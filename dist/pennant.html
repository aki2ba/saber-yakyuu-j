  if (ev.severity !== 'major') return; // 軽症は率も量も戻る（A.minorNone）
  const t = p.trueAbility;
  if (p.role === 'pitcher') {
    // 出場量: スタミナ恒久減（登板数・投球回が戻らない）
    t.pitching.stamina = clampRating(t.pitching.stamina - A.majorStamina);
    const dv = p.age >= A.oldAge ? A.majorVeloKmhOld : A.majorVeloKmh;
    t.pitching.velocityKmh = clamp(t.pitching.velocityKmh - dv, 130, 165);
  }
  if (A.lowerBodySites.includes(ev.site)) {
    t.common.speed = clampRating(t.common.speed - A.majorLowerBodySpeed);
    t.common.reaction = clampRating(t.common.reaction - A.majorLowerBodyReaction);
  }
}


// ===== src/game/breakout.mjs =====
// ============================================================================
// フェーズC2b: ブレイクイベント（§10.4 / §11.1）
//
//   applyBreakouts(players, cfg, { seed, year })
//     … オフシーズンに低確率で能力が「階段状に」跳ねる離散イベントを判定する純関数。
//        上方=球種習得（列が生える千賀型）/覚醒（真値ジャンプ）/EVジャンプ（板山・用具型）、
//        下方=制球崩壊（イップス）/燃え尽き/故障明けの別人化。career.breakEvents に履歴を積む。
//
// 設計原則（phaseC_spec・厳守）:
//   - 同一機構で複数の実在現象を表現（§10.4）: 発火対象パラメータを変えるだけで
//     千賀型（球種列が生える）も板山型（打撃真値ジャンプ）も用具型（EV）も出す。
//   - §11.1: 上方だけだとリーグがインフレするので下方≧上方を既定（バランス上ほぼ必須）。
//   - 決定論・順序非依存: 各選手の乱数は makeRng(hashSeed(seed,'breakout',id))（id基準派生）。
//     Date.now/Math.random 非使用。1年目には効かない（2年目以降のオフのみ）。
//   - 故障との合流（§10.4「故障明けの別人化」）: 直近オフに大怪我があると下方確率が跳ねる。
//     ＝injury.mjs を先に適用してから本モジュールを呼ぶ（index.mjs のオフシーズン順序）。
// ============================================================================





/**
 * 全選手にオフシーズンのブレイクイベントを適用する（in-place・決定論・順序非依存）。
 * @param {Array} players league.players
 * @param {Object} cfg createConfig()（cfg.tuning.breakout を参照）
 * @param {{seed:number, year:number}} o seed=ブレイク用階層シード / year=当該年（履歴・故障合流判定に使用）
 * @returns {Array<{id,year,dir,kind}>} 発生したブレイクイベント（dir='up'|'down'）
 */
function applyBreakouts(players, cfg, { seed, year }) {
  const events = [];
  for (const p of players) {
    const prng = makeRng(hashSeed(seed, 'breakout', p.id));
    const ev = rollBreakout(p, cfg, prng, year);
    if (ev) events.push(ev);
  }
  return events;
}

/** 1選手のブレイク判定（上方/下方/無し）。下方の裾を厚くしてインフレを抑える（§11.1）。 */
function rollBreakout(p, cfg, prng, year) {
  const bo = cfg.tuning.breakout;
  const hist = p.trueAbility.career.injuryHistory ?? [];
  const recentMajor = hist.some((e) => e.year === year && e.severity === 'major');
  const young = p.age <= bo.youngAge;
  const upP = bo.upBase * (young ? bo.youngUpMult : 1);
  const downP =
    bo.downBase + (recentMajor ? bo.postInjuryDown : 0) + Math.max(0, p.age - bo.burnoutAge) * bo.burnoutPerYear;
  const r = prng.next(); // 1回の一様乱数で上/下/無しに振る（下方を厚く配置）
  if (r < upP) return applyUpBreak(p, bo, prng, year);
  if (r < upP + downP) return applyDownBreak(p, bo, prng, year, recentMajor);
  return null;
}

/** 上方ブレイク: 投手=球種習得 or 覚醒、野手=覚醒/EVジャンプ。 */
function applyUpBreak(p, bo, prng, year) {
  const t = p.trueAbility;
  let kind;
  if (p.role === 'pitcher') {
    const held = new Set(t.pitching.pitches.map((x) => x.type));
    const avail = PITCH_TYPES.filter((x) => !held.has(x));
    if (avail.length && prng.chance(bo.newPitchShare)) {
      // 球種の「列が一本生える」（千賀のフォーク）: 決め球として whiff を高めに（§4）。
      const type = avail[prng.int(avail.length)];
      t.pitching.pitches.push(
        createPitch(type, {
          current: clampRating(55 + prng.normal(0, 5)),
          whiff: clampRating(58 + prng.normal(0, 6)),
          hrSuppress: clampRating(54 + prng.normal(0, 5)),
          contactQuality: clampRating(54 + prng.normal(0, 5)),
        }),
      );
      kind = 'newPitch';
    } else {
      // 覚醒: 球速＋全球種の質が階段状に上がる。
      t.pitching.velocityKmh = clamp(t.pitching.velocityKmh + bo.veloJump, 130, 165);
      for (const pi of t.pitching.pitches) {
        pi.whiff = clampRating(pi.whiff + bo.jump);
        pi.current = clampRating(pi.current + bo.jump);
      }
      kind = 'awaken';
    }
  } else {
    // 覚醒/EVジャンプ（板山・用具型）: EV・パワー中心にコンタクト/LAも階段状に上がる。
    t.batting.ev = clampRating(t.batting.ev + bo.jump);
    t.common.power = clampRating(t.common.power + bo.jump * 0.6);
    t.batting.contact = clampRating(t.batting.contact + bo.jump * 0.6);
    t.batting.la = clampRating(t.batting.la + bo.jump * 0.4);
    kind = 'awaken';
  }
  pushEvent(t, year, 'up', kind);
  return { id: p.id, year, dir: 'up', kind };
}

/** 下方ブレイク: 投手=制球崩壊（イップス）or 燃え尽き、野手=燃え尽き/別人化。 */
function applyDownBreak(p, bo, prng, year, recentMajor) {
  const t = p.trueAbility;
  let kind;
  if (p.role === 'pitcher' && prng.chance(bo.yipsShare)) {
    // 制球崩壊（イップス）: 制球が階段状に崩れる。
    t.pitching.control = clampRating(t.pitching.control - bo.controlCollapse);
    kind = 'yips';
  } else {
    // 燃え尽き / 故障明けの別人化: 広く低下（別人化は追加で大きく）。
    const mag = recentMajor ? bo.jump + bo.postInjuryMag : bo.jump;
    t.batting.ev = clampRating(t.batting.ev - mag * 0.6);
    t.batting.contact = clampRating(t.batting.contact - mag * 0.6);
    t.common.power = clampRating(t.common.power - mag * 0.5);
    if (p.role === 'pitcher') {
      for (const pi of t.pitching.pitches) pi.whiff = clampRating(pi.whiff - mag * 0.6);
      t.pitching.velocityKmh = clamp(t.pitching.velocityKmh - bo.veloJump * 0.7, 130, 165);
    }
    kind = recentMajor ? 'postInjury' : 'burnout';
  }
  pushEvent(t, year, 'down', kind);
  return { id: p.id, year, dir: 'down', kind };
}

function pushEvent(t, year, dir, kind) {
  (t.career.breakEvents ?? (t.career.breakEvents = [])).push({ year, dir, kind });
}


// ===== src/game/roster.mjs =====
// ============================================================================
// フェーズC2b: 引退・世代交代（§10.6） ／ C3a: 補充をドラフト＋育成昇格へ置換（§13/§15/§12.1）
//
//   runRetirement(league, cfg, { seed, yearIndex, debutYear })
//     … 能力・年齢・故障から各選手の引退を確率判定し（生存バイアス）、生存者を league.players へ
//        張り替え、引退で空いた枠(teamId,role,primaryPos)の一覧 vacancies を返す。
//        補充（ドラフト/育成昇格＝runMarket）と C3b の市場（FA/トレード/戦力外）は呼び出し側
//        （index.mjs の offseasonTransition）がこの後に順序立てて実行する。
//   rebuildTeamRosters(league)
//     … league.players から各 team.playerIds を張り直す（移動/補充の後に呼ぶ・構成の同期）。
//
// 設計原則（phaseC_spec・厳守）:
//   - 生存バイアス（§10.6）はそのままで正しい: 弱い個体が引退で消え、40代まで残るのは
//     「衰えなかった個体（低declineRate＝鉄人）」だけ → 鉄人が自動でレア化する。
//   - 決定論・順序非依存: 引退判定は id 基準 rng（配列順に依らない）。ウェーバー順は前年順位
//     （standings＝teamHistory 経由で load-replay も同一）。
//   - 引退判定は「能力＋年齢＋故障歴」の純関数（観測成績/出場機会に依存しない）。
//     ＝ load の replay（過去年のオフを再走）で season 再シムなしに同一ロスターを再構築できる。
// ============================================================================



/**
 * 各 team.playerIds を league.players（現在の teamId）から張り直す（移動/補充後の同期）。
 * 育成（minor）は支配下ロスターに含めない。
 */
function rebuildTeamRosters(league) {
  const idsByTeam = new Map();
  for (const p of league.players) {
    if (!idsByTeam.has(p.teamId)) idsByTeam.set(p.teamId, []);
    idsByTeam.get(p.teamId).push(p.id);
  }
  for (const t of league.teams) t.playerIds = idsByTeam.get(t.id) ?? [];
}

/**
 * オフシーズンの引退判定（in-place）。生存者を league.players へ張り替え、引退で空いた枠一覧を返す。
 * 補充（ドラフト/育成昇格）は呼び出し側が runMarket で行う（C3b で FA/トレードを引退と補充の間に
 * 挟むため、引退と補充を分離した）。
 *
 * @param {{players:Array, teams:Array}} league
 * @param {Object} cfg createConfig()（cfg.tuning.retire を参照）
 * @param {{seed:number, debutYear:number}} o
 * @returns {{retirees:Array, vacancies:Array}} 引退者サマリと空き枠(teamId,role,primaryPos)一覧
 */
function runRetirement(league, cfg, { seed, debutYear }) {
  const survivors = [];
  const retirees = [];
  const gone = []; // 引退選手（枠 = teamId/role/primaryPos の供給源）

  for (const p of league.players) {
    const prng = makeRng(hashSeed(seed, 'retire', p.id));
    if (decideRetire(p, cfg, prng)) {
      p.rosterStatus = 'retired';
      retirees.push(summarizeRetiree(p, debutYear - 1));
      gone.push(p);
    } else {
      survivors.push(p);
    }
  }

  // 引退枠を id 昇順で確定（決定論・順序非依存）。同型(role:pos)は等価なので枠内順序は結果に無影響。
  gone.sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  const vacancies = gone.map((p) => ({ teamId: p.teamId, role: p.role, primaryPos: p.primaryPos }));

  league.players = survivors;
  rebuildTeamRosters(league);
  return { retirees, vacancies };
}

/**
 * 引退判定（確率）。老いるほど・弱いほど・故障歴が多いほど引退圧が上がり、能力が高い（鉄人）ほど
 * 残る（生存バイアス）。minAge 未満は残し、hardAge 以上は必ず引退。
 */
function decideRetire(p, cfg, prng) {
  const rt = cfg.tuning.retire;
  const age = p.age;
  if (age < rt.minAge) return false;
  if (age >= rt.hardAge) return true;
  // R2: 球団が見るのは「現在能力＋伸びしろ」。maturity 導入で若手の現在能力は構造的に低いため、
  //   peakAge までの残り年数ぶんの成長見込みを加算してから引退圧を測る（これが無いと将来のエースを
  //   「能力40の使えない選手」と見て切ってしまう）。伸びしろが尽きた中堅以降は素の能力で評価される。
  const growthCredit = Math.max(0, (p.trueAbility.career.peakAge ?? 27) - age) * (rt.youthCreditPerYear ?? 0);
  const ability = overallAbility(p) + growthCredit; // ~20-80（弱い＝出場機会減の代理）
  let pr =
    rt.base +
    Math.max(0, age - rt.rampAge) * rt.agePerYear +
    Math.max(0, rt.abilityRef - ability) * rt.abilityPerPt +
    (p.trueAbility.career.injuryHistory?.length ?? 0) * rt.injuryPerHist +
    // R6: 肩の重症はキャリア長そのものを縮める（関節唇修復後: 投手2.3年 vs 対照5.8年）
    (p.trueAbility.career.injuryHistory ?? []).filter((e) => e.severity === 'major' && e.site === 'shoulder').length
      * (cfg.tuning.injury.aftereffect.shoulderRetireBias ?? 0);
  pr -= Math.max(0, ability - rt.abilityRef) * rt.eliteRetain; // 鉄人ほど残る
  return prng.chance(clamp(pr, 0, rt.cap));
}

/**
 * 総合力の粗い代理（~20-80）。role 別に主要な真値を平均する（引退圧の「出場機会」代理）。
 * 投手は球速を rating 換算（50 + (velo-145)×2）して制球/スタミナ/球種質と平均。
 */
function overallAbility(p) {
  const t = p.trueAbility;
  if (p.role === 'pitcher') {
    const veloR = clamp(50 + (t.pitching.velocityKmh - 145) * 2, 20, 80);
    const pitches = t.pitching.pitches;
    let stuff = 50;
    if (pitches.length) {
      let s = 0;
      for (const pi of pitches) s += (pi.current + pi.whiff) / 2;
      stuff = s / pitches.length;
    }
    return (veloR + t.pitching.control + t.pitching.stamina + stuff) / 4;
  }
  const b = t.batting;
  let bestProf = 20;
  for (const k of Object.keys(t.fielding.positionProf)) bestProf = Math.max(bestProf, t.fielding.positionProf[k]);
  return (b.ev + b.contact + b.la + b.eye + t.common.speed + t.fielding.positioningIQ + bestProf) / 7;
}

/** 引退者サマリ（記録/通算リーダーボード用・§17集計値。生イベントは持たない）。 */
function summarizeRetiree(p, retiredAfterYear) {
  return {
    id: p.id,
    name: p.name,
    role: p.role,
    primaryPos: p.primaryPos,
    finalAge: p.age,
    birthSeason: p.birthSeason ?? null,
    retiredAfterYear,
    injuries: (p.trueAbility.career.injuryHistory ?? []).length,
    breakEvents: (p.trueAbility.career.breakEvents ?? []).length,
  };
}


// ===== src/game/statcodec.mjs =====
// ============================================================================
// R5: 成績集計（careerStats / careerFarmStats）の数値エンコード
//
// 問題: playerSeason は {batting:{pa,ab,h,...}, pitching:{...}, fielding:{positionOuts:{...}},
//   baserunning:{...}} という **キー名だらけの入れ子オブジェクト** で、1行 ≈ 2,000B のうち大半が
//   キー名の繰り返し。前史30年＋長期プレイでは数万行になり、save が十数MBに膨らむ。
//   （保存先は IndexedDB なので容量は足りるが、**日次オートセーブで毎回それを直列化する**コストが痛い）
//
// 方式: 数値の位置を固定した「列指向」エンコード。
//   paths（数値リーフのパス一覧）を1回だけ書き、各行は [playerId, season, teamId, ...数値] の配列にする。
//   キー名が行ごとに消えるので 1/3 以下になる。**値は一切丸めない**（丸めると load 後の
//   オフシーズン査定が無セーブ通しと食い違い、決定論が壊れる）。
//
//   スプリット/カウント別（表示専用の入れ子。直近2年のみ保持・index.mjs compactCareerStats）は
//   数が少ないので、行番号をキーにした detail としてそのまま持つ。
// ============================================================================


const SECTIONS = ['batting', 'pitching', 'fielding', 'baserunning'];
const SKIP = new Set(['splits', 'byCount']); // 表示専用の入れ子（detail 側で持つ）

/** テンプレートから「数値リーフのパス」を決定論的に列挙する（キー順＝挿入順で安定）。 */
function collectPaths(obj, prefix, out) {
  for (const k of Object.keys(obj)) {
    if (SKIP.has(k)) continue;
    const v = obj[k];
    if (v === null || typeof v === 'number') out.push(prefix ? `${prefix}.${k}` : k);
    else if (v && typeof v === 'object' && !Array.isArray(v)) collectPaths(v, prefix ? `${prefix}.${k}` : k, out);
  }
}

/** playerSeason の数値パス一覧（モジュール初期化時に1回だけ作る）。 */
function statPaths() {
  const tpl = createPlayerSeason('x', 0);
  const out = [];
  for (const sec of SECTIONS) if (tpl[sec]) collectPaths(tpl[sec], sec, out);
  return out;
}
const PATHS = statPaths();

function getPath(row, path) {
  let cur = row;
  for (const k of path.split('.')) {
    if (cur == null) return 0;
    cur = cur[k];
  }
  return typeof cur === 'number' ? cur : 0;
}

function setPath(row, path, val) {
  const keys = path.split('.');
  let cur = row;
  for (let i = 0; i < keys.length - 1; i++) {
    if (cur[keys[i]] == null || typeof cur[keys[i]] !== 'object') cur[keys[i]] = {};
    cur = cur[keys[i]];
  }
  cur[keys[keys.length - 1]] = val;
}

/**
 * playerSeason[] → 列指向のエンコード済みブロブ。
 * @returns {{v:number, paths:string[], rows:Array, detail:Object}}
 */
function encodeSeasons(seasons) {
  const rows = [];
  const detail = {};
  seasons.forEach((s, i) => {
    const vals = PATHS.map((p) => getPath(s, p));
    rows.push([s.playerId, s.season, s.teamId ?? null, ...vals]);
    // 表示専用の入れ子（直近年のみ存在）はそのまま退避
    const d = {};
    if (s.batting?.splits) d.splits = s.batting.splits;
    if (s.batting?.byCount) d.byCount = s.batting.byCount;
    if (s.pitching?.byCount) d.pByCount = s.pitching.byCount;
    if (Object.keys(d).length) detail[i] = d;
  });
  return { v: 1, paths: PATHS, rows, detail };
}

/** エンコード済みブロブ → playerSeason[]（未エンコードの配列がそのまま来たら素通し＝旧セーブ互換）。 */
function decodeSeasons(blob) {
  if (!blob) return [];
  if (Array.isArray(blob)) return blob; // 生配列（旧形式/テスト）
  const { paths, rows, detail = {} } = blob;
  return rows.map((r, i) => {
    const [playerId, season, teamId, ...vals] = r;
    const ps = createPlayerSeason(playerId, season);
    ps.teamId = teamId;
    for (let k = 0; k < paths.length; k++) setPath(ps, paths[k], vals[k] ?? 0);
    const d = detail[i];
    if (d) {
      if (d.splits) ps.batting.splits = d.splits;
      if (d.byCount) ps.batting.byCount = d.byCount;
      if (d.pByCount) ps.pitching.byCount = d.pByCount;
    }
    return ps;
  });
}


// ===== src/game/era.mjs =====
// ============================================================================
// フェーズD3: 時代トレンドと王朝均衡（§11.3「集団・時代系」・多年運用）
//
//   computeEra(masterSeed, yearIndex, cfg) → EraState
//     … その年（yearIndex）の「時代」を (masterSeed, yearIndex) から純粋に決める。
//       投高打低↔打高投低の緩やかな揺れ（offenseWave→evBaseDelta）・平均球速の経年上昇
//       （veloBump）・世代の波（cohortQuality＝ドラフト当たり年/外れ年→黄金世代）を返す。
//   eraSeasonConfig(baseCfg, era) → cfg
//     … シーズンシムに使う「時代補正済み config」を作る（bb.evBase を evBaseDelta ぶん動かす）。
//   teamBalanceBoost(standings, cfg) → Map<teamId, number>
//     … 王朝均衡（戦力の平均回帰）: 前年に勝ち越した球団のドラフト新人を控えめに、負け越した
//       球団の新人を厚めにする再分配 boost（新人品質rating・weak teams ほど大）。
//
// 設計原則（phaseD_spec D3・厳守）:
//   - **1年目（yearIndex=0）は完全に identity**: computeEra は全成分ゼロを返し、eraSeasonConfig は
//     baseCfg を同一参照で返す＝1年目レギュラーシーズンは D3 前と byte 一致（既存50較正不変）。
//     ドリフトは 2年目以降にのみ効く。
//   - 決定論維持: 乱数は makeRng(hashSeed(masterSeed, ...)) のみ。Date.now/Math.random 非使用。
//     era は (masterSeed, yearIndex) の純関数＝live の advanceYear と load の replay で bit 一致。
//   - config集約: 揺れ幅・周期・球速上昇率・黄金世代確率・均衡強度は cfg.tuning.era のノブ。
//   - 揺れは位相0の正弦（sin(2π·yi/period)）で表現する。yi=0 で必ず 0（year0 identity の担保）。
//     周期は世界（masterSeed）ごとに少し散らす（時代の巡りが世界で違う）が位相0は保つ。
// ============================================================================


/** 1年目（identity）用の EraState。全成分ゼロ＝D3 前と完全一致。 */
function identityEra(yearIndex) {
  return { yearIndex, offenseWave: 0, evBaseDelta: 0, veloBump: 0, cohortQuality: 0, isGolden: false, isLean: false };
}

/**
 * その年の「時代」を (masterSeed, yearIndex) から決める（純関数・決定論）。
 * yearIndex<=0 は identity（1年目不変の担保）。cfg.tuning.era 未定義/無効時も identity。
 * @returns {{yearIndex:number, offenseWave:number, evBaseDelta:number, veloBump:number,
 *            cohortQuality:number, isGolden:boolean, isLean:boolean}}
 */
function computeEra(masterSeed, yearIndex, cfg) {
  const E = cfg && cfg.tuning ? cfg.tuning.era : null;
  if (!E || E.enabled === false || yearIndex <= 0) return identityEra(yearIndex);

  // --- 得点環境の緩やかな揺れ（投高打低↔打高投低）---------------------------------
  // 周期は世界ごとに散らす（位相は0固定＝sin(0)=0 で year0 identity）。1世界で1回だけ引く。
  const period = Math.max(4, E.wavePeriod + makeRng(hashSeed(masterSeed, 'era-phase')).normal(0, E.wavePeriodSd));
  const offenseWave = Math.sin((2 * Math.PI * yearIndex) / period); // -1..+1（+=打高 / −=投高）
  const evBaseDelta = offenseWave * E.offenseAmpKmh; // EV中心の上下（km/h）＝得点環境の揺れ

  // --- 平均球速の経年上昇（新人世代が世代ごとに速くなる・約+0.5km/h/年）---------------
  const veloBump = Math.min(E.veloPerYear * yearIndex, E.veloBumpMax);

  // --- 世代の波（ドラフト当たり年/外れ年→黄金世代）--------------------------------
  const cr = makeRng(hashSeed(masterSeed, 'era-cohort', yearIndex));
  const u = cr.next();
  let cohortQuality = cr.normal(0, E.cohortSd); // 通常年の小さな揺れ
  let isGolden = false;
  let isLean = false;
  if (u < E.goldenProb) {
    cohortQuality += E.goldenBoost; // 当たり年（黄金世代・稀）
    isGolden = true;
  } else if (u > 1 - E.leanProb) {
    cohortQuality -= E.leanPenalty; // 外れ年
    isLean = true;
  }

  return { yearIndex, offenseWave, evBaseDelta, veloBump, cohortQuality, isGolden, isLean };
}

/**
 * シーズンシム用の「時代補正済み config」を返す（bb.evBase を evBaseDelta ぶん動かす）。
 * evBaseDelta=0（1年目 or 無効）なら baseCfg を**同一参照**で返す＝byte一致の担保。
 * それ以外は shallow spread で tuning.bb.evBase だけ差し替えた新オブジェクトを返す（他は共有＝
 * シムは読み取り専用で参照するため安全。leagueConstants はシムが都度導出し cfg を書き換えない）。
 */
function eraSeasonConfig(baseCfg, era) {
  if (!era || !era.evBaseDelta) return baseCfg;
  return {
    ...baseCfg,
    tuning: {
      ...baseCfg.tuning,
      bb: { ...baseCfg.tuning.bb, evBase: baseCfg.tuning.bb.evBase + era.evBaseDelta },
    },
  };
}

/**
 * 王朝均衡（戦力の平均回帰）: 前年順位（勝率）から各球団のドラフト新人 boost を導く。
 * 勝ち越した球団（winPct>.500）は boost=0（既にウェーバー順で不利＝再分配で更に控えめに）、
 * 負け越した球団ほど新人品質を厚くする（弱い球団に良い人材が回る＝FA/ドラフト再分配の増幅）。
 * これで強い球団の連覇（王朝）が数年で崩れる振り子が生まれる（§11.3）。
 * 決定論: standings（勝率）は teamHistory 由来＝save/replay で同一。boost は純粋な算術。
 * @param {Array} standings 完了年の順位表行（w/l を持つ）
 * @param {Object} cfg cfg.tuning.era.balanceReversion / balanceMaxDev
 * @returns {Map<string, number>} teamId → 新人 rating boost（>=0）
 */
function teamBalanceBoost(standings, cfg) {
  const E = cfg && cfg.tuning ? cfg.tuning.era : null;
  const boost = new Map();
  if (!E || E.enabled === false || !E.balanceReversion || !standings || !standings.length) return boost;
  for (const s of standings) {
    const dec = (s.w ?? 0) + (s.l ?? 0);
    const winPct = dec ? s.w / dec : 0.5;
    const deficit = Math.min(E.balanceMaxDev, Math.max(0, 0.5 - winPct)); // .500 未満ぶん（上限クランプ）
    boost.set(s.teamId, deficit * E.balanceReversion);
  }
  return boost;
}


// ===== src/game/awards.mjs =====
// ============================================================================
// フェーズC4: 表彰・記録・二つ名（§16/§17・phaseC_spec C4）
//
//   computeSeasonAwards({playerSeasons, standings, playersById, cfg, allCareerStats, year})
//     … 完了シーズンの "観測成績/WAR" から各リーグの表彰を選定する（MVP/新人王/ベストナイン/
//        守備の栄誉賞/タイトル9種）。選定は観測集計と WAR のみ（trueAbility 非参照＝三層構造）。
//   playerAwardHistory(playerId, {careerStats, teamHistory, playersById, cfg, firstSeason})
//     … 全年の表彰を再計算し、その選手の受賞履歴を集める（受賞は careerStats から決定論再現）。
//   leagueRecords({careerStats, playersById, cfg})   … シーズン/通算のトップN リーグ記録。
//   teamRecords(teamHistory, cfg)                     … 球団史（年度別順位・日本一）。
//   milestones({careerStats, playersById, cfg, year}) … 当年に通算で跨いだマイルストーン通知。
//   nicknameFor(player, careerStats, cfg)             … 通算観測パターンから二つ名を自動付与。
//
// 決定論: すべて (careerStats, teamHistory) の純関数。同値タイは playerId 昇順で割る。
// エンジン不変: 集計/表示のみ。1年目レギュラーシーズン（既存50較正）には一切干渉しない。
// ============================================================================







/** 守備の栄誉賞の架空名（§16: 実在の「ゴールデングラブ」を避ける）。 */
const DEF_AWARD_NAME = 'ベストディフェンダー賞';

/** ベストナインのポジション並び（P＝先発格・DH は DH リーグのみ計上）。 */
const BEST_NINE_POS = ['P', 'C', '1B', '2B', '3B', 'SS', 'LF', 'CF', 'RF', 'DH'];

/** タイトル定義（key→表示名・観測ベース）。守備の栄誉賞/MVP/新人王/ベストナインは別枠。 */
const TITLE_LABELS = {
  battingAvg: '首位打者', homeRun: '本塁打王', rbi: '打点王', steal: '盗塁王',
  era: '最優秀防御率', wins: '最多勝', strikeoutsP: '最多奪三振', hold: '最優秀中継ぎ', save: '最多セーブ',
};

/** リーグ定数（wOBA/FIP/RPW…）を当年の観測から導出。標準の deriveLeagueConstants を使う。 */
function seasonLeagueConstants(playerSeasons, standings) {
  return deriveLeagueConstants({ playerSeasons, standings });
}

/** teamId→league の対応（順位表 standings 行から）。 */
function teamLeagueMap(standings) {
  const m = new Map();
  for (const r of standings || []) m.set(r.teamId, r.league ?? 'ALL');
  return m;
}

/**
 * 1選手・1シーズンの観測指標＋WAR（表彰選定の素）。role で打者/投手に分岐する。
 * すべて既存の指標器（metrics/war/fielding）の再利用＝観測とWARのみ（真値非参照）。
 */
function evalSeason(s, player, cfg, lc) {
  if (player.role === 'pitcher') {
    const p = playerPitching(s, lc, cfg);
    const w = pitcherWAR(s, cfg, lc);
    return {
      role: 'pitcher', war: w.war, ip: p.ip, era: p.era, fip: p.fip,
      w: p.w, l: p.l, so: p.so, sv: p.sv, hld: p.hld, g: p.g, gs: p.gs,
    };
  }
  const b = playerBatting(s, lc);
  const w = hitterWAR(s, cfg, lc);
  const uzr = uzrRuns(s, cfg, lc);
  const oaa = centeredOAAOuts(s, lc);
  const innings = totalFieldInnings(s.fielding);
  return {
    role: 'fielder', war: w.war, pa: b.pa, avg: b.avg, hr: b.hr, rbi: b.rbi, sb: b.sb,
    h: b.h, obp: b.obp, ops: b.ops, wrcPlus: b.wrcPlus, uzr, oaa,
    defScore: uzr + 0.8 * oaa, innings,
  };
}

/** 各 playerSeason を {id, teamId, player, ev} 化（未知IDは除外）。 */
function buildEvals(playerSeasons, playersById, cfg, lc) {
  const out = [];
  for (const s of playerSeasons) {
    const p = playersById.get(s.playerId);
    if (!p) continue;
    out.push({ id: s.playerId, teamId: s.teamId, player: p, ev: evalSeason(s, p, cfg, lc) });
  }
  return out;
}

/** 最大値リーダー（同値は playerId 昇順）。valFn が null を返す要素は無視。 */
function leaderMax(list, valFn, filterFn) {
  let best = null;
  for (const e of list) {
    if (filterFn && !filterFn(e)) continue;
    const v = valFn(e);
    if (v == null || Number.isNaN(v)) continue;
    if (!best || v > best.v || (v === best.v && e.id < best.id)) best = { id: e.id, v, e };
  }
  return best;
}

/** 最小値リーダー（防御率など・同値は playerId 昇順）。 */
function leaderMin(list, valFn, filterFn) {
  let best = null;
  for (const e of list) {
    if (filterFn && !filterFn(e)) continue;
    const v = valFn(e);
    if (v == null || Number.isNaN(v)) continue;
    if (!best || v < best.v || (v === best.v && e.id < best.id)) best = { id: e.id, v, e };
  }
  return best;
}

const asTitle = (r) => (r ? { playerId: r.id, value: r.v } : null);

/**
 * 完了シーズンの表彰を各リーグごとに選定する（観測成績/WAR ベース・§55）。
 * @returns {{year:number, leagues:Array}} leagues[]= {leagueId, mvp, roty, titles, bestNine, gloves}
 */
function computeSeasonAwards({ playerSeasons, standings, playersById, cfg, allCareerStats = null, year = null }) {
  const lc = seasonLeagueConstants(playerSeasons, standings);
  const evals = buildEvals(playerSeasons, playersById, cfg, lc);
  const lgOf = teamLeagueMap(standings);
  const qPA = qualifiedPA(cfg.league.gamesPerSeason);
  const qIP = qualifiedIP(cfg.league.gamesPerSeason);
  const A = cfg.tuning.awards;

  // 新人（当年デビュー）判定: 当年より前の season を持たない playerId。allCareerStats 未指定なら空。
  const priorIds = new Set();
  if (allCareerStats && year != null) {
    for (const s of allCareerStats) if (s.season < year) priorIds.add(s.playerId);
  }
  const isRookie = (id) => !priorIds.has(id);

  // リーグ集合（順位表の league から）。
  const leagueIds = [...new Set([...lgOf.values()])].sort();
  const leagues = leagueIds.map((lid) => {
    const inLg = evals.filter((e) => lgOf.get(e.teamId) === lid);
    const bat = inLg.filter((e) => e.ev.role === 'fielder');
    const pit = inLg.filter((e) => e.ev.role === 'pitcher');

    const titles = {
      battingAvg: asTitle(leaderMax(bat, (e) => e.ev.avg, (e) => e.ev.pa >= qPA)),
      homeRun: asTitle(leaderMax(bat, (e) => e.ev.hr, (e) => e.ev.hr > 0)),
      rbi: asTitle(leaderMax(bat, (e) => e.ev.rbi, (e) => e.ev.rbi > 0)),
      steal: asTitle(leaderMax(bat, (e) => e.ev.sb, (e) => e.ev.sb > 0)),
      era: asTitle(leaderMin(pit, (e) => e.ev.era, (e) => e.ev.ip >= qIP)),
      wins: asTitle(leaderMax(pit, (e) => e.ev.w, (e) => e.ev.w > 0)),
      strikeoutsP: asTitle(leaderMax(pit, (e) => e.ev.so, (e) => e.ev.so > 0)),
      hold: asTitle(leaderMax(pit, (e) => e.ev.hld, (e) => e.ev.hld > 0)),
      save: asTitle(leaderMax(pit, (e) => e.ev.sv, (e) => e.ev.sv > 0)),
    };

    // MVP: リーグ内 WAR 最高（打者/投手横断）。新人王: 新人のうち WAR 最高（最低出場ゲートあり）。
    //   開幕年（priorIds 空＝全員デビュー）は新人王の意味が立たないため付与しない。
    const mvp = asMvp(leaderMax(inLg, (e) => e.ev.war));
    const rotyGate = (e) => isRookie(e.id) && (e.ev.role === 'pitcher' ? e.ev.ip >= A.rotyMinIp : e.ev.pa >= A.rotyMinPa);
    const roty = priorIds.size ? asMvp(leaderMax(inLg, (e) => e.ev.war, rotyGate)) : null;

    // ベストナイン: 各ポジション（primaryPos）で WAR 最高。P は先発格（gs 最多寄り）を優先。
    const bestNine = [];
    for (const pos of BEST_NINE_POS) {
      let r;
      if (pos === 'P') {
        r = leaderMax(pit, (e) => e.ev.war, (e) => e.ev.gs >= 10) || leaderMax(pit, (e) => e.ev.war);
      } else {
        const atPos = inLg.filter((e) => e.player.primaryPos === pos);
        if (pos === 'DH' && !atPos.length) continue; // DH不在リーグは DH 枠なし
        r = leaderMax(atPos, (e) => e.ev.war);
      }
      if (r) bestNine.push({ pos, playerId: r.id, war: r.v });
    }

    // 守備の栄誉賞（UZR+OAA）: 8守備位置で defScore 最高（最低守備イニングゲート）。
    const gloves = [];
    for (const pos of FIELD_POSITIONS) {
      const atPos = bat.filter((e) => e.player.primaryPos === pos && e.ev.innings >= A.gloveMinInnings);
      const r = leaderMax(atPos, (e) => e.ev.defScore);
      if (r) gloves.push({ pos, playerId: r.id, defScore: r.v, uzr: r.e.ev.uzr, oaa: r.e.ev.oaa });
    }

    return { leagueId: lid, mvp, roty, titles, bestNine, gloves };
  });

  return { year, leagues };
}

const asMvp = (r) => (r ? { playerId: r.id, war: r.v } : null);

/**
 * 選手の受賞履歴（全年の表彰を再計算して収集）。determinism: careerStats/teamHistory から純関数で復元。
 * @returns {Array} [{year, kind, label, pos?}]（kind='mvp'|'roty'|'title'|'bestNine'|'glove'）
 */
function playerAwardHistory(playerId, { careerStats, teamHistory, playersById, cfg, awardsHistory = null }) {
  // ★R5: 実際に確定した受賞（awardsHistory）が保存されていればそれを使う。
  //   前史(burn-in)では引退選手の成績を保持しないため、careerStats からの**再計算は嘘の受賞者を出す**
  //   （当時のMVPが引退して名簿から消えていると、別人が繰り上がってしまう）。確定値を優先する。
  if (awardsHistory && awardsHistory.length) {
    const out = [];
    for (const rec of awardsHistory) out.push(...collectAwardsFor(playerId, rec.year, rec.awards));
    // 保存が無い年（旧セーブ/前史外）だけ従来どおり再計算して足す
    const covered = new Set(awardsHistory.map((r) => r.year));
    const rest = recomputeAwardHistory(playerId, { careerStats, teamHistory: teamHistory.filter((h) => !covered.has(h.year)), playersById, cfg });
    return out.concat(rest).sort((a, b) => a.year - b.year);
  }
  return recomputeAwardHistory(playerId, { careerStats, teamHistory, playersById, cfg });
}

/** 確定済みの受賞オブジェクト（computeSeasonAwards の返値）から、その選手が獲ったものを抜き出す。 */
function collectAwardsFor(playerId, year, awards) {
  const out = [];
  if (!awards) return out;
  for (const lg of awards.leagues ?? []) {
    if (lg.mvp && lg.mvp.playerId === playerId) out.push({ year, kind: 'mvp', label: 'MVP' });
    if (lg.roty && lg.roty.playerId === playerId) out.push({ year, kind: 'roty', label: '新人王' });
    for (const k of Object.keys(lg.titles ?? {})) {
      const t = lg.titles[k];
      if (t && t.playerId === playerId) out.push({ year, kind: 'title', label: TITLE_LABELS[k], titleKey: k, value: t.value });
    }
    for (const b of lg.bestNine ?? []) if (b.playerId === playerId) out.push({ year, kind: 'bestNine', label: 'ベストナイン', pos: b.pos });
    for (const g of lg.gloves ?? []) if (g.playerId === playerId) out.push({ year, kind: 'glove', label: DEF_AWARD_NAME, pos: g.pos });
  }
  return out;
}

function recomputeAwardHistory(playerId, { careerStats, teamHistory, playersById, cfg }) {
  const byYear = new Map();
  for (const s of careerStats) {
    if (!byYear.has(s.season)) byYear.set(s.season, []);
    byYear.get(s.season).push(s);
  }
  const out = [];
  for (const hist of teamHistory) {
    const year = hist.year;
    const ps = byYear.get(year);
    if (!ps) continue;
    const aw = computeSeasonAwards({ playerSeasons: ps, standings: hist.standings, playersById, cfg, allCareerStats: careerStats, year });
    for (const lg of aw.leagues) {
      if (lg.mvp && lg.mvp.playerId === playerId) out.push({ year, kind: 'mvp', label: 'MVP' });
      if (lg.roty && lg.roty.playerId === playerId) out.push({ year, kind: 'roty', label: '新人王' });
      for (const k of Object.keys(lg.titles)) {
        const t = lg.titles[k];
        if (t && t.playerId === playerId) out.push({ year, kind: 'title', label: TITLE_LABELS[k], titleKey: k, value: t.value });
      }
      for (const b of lg.bestNine) if (b.playerId === playerId) out.push({ year, kind: 'bestNine', label: 'ベストナイン', pos: b.pos });
      for (const g of lg.gloves) if (g.playerId === playerId) out.push({ year, kind: 'glove', label: DEF_AWARD_NAME, pos: g.pos });
    }
  }
  out.sort((a, b) => a.year - b.year);
  return out;
}

// --- 通算集計（二つ名・記録・マイルストーンの素。観測のみ・§17） ------------------
/** 打撃の通算生カウント合算（careerStats の batting を全年で足す）。 */
function careerBatting(careerStats, playerId) {
  const acc = { pa: 0, ab: 0, h: 0, b1: 0, b2: 0, b3: 0, hr: 0, bb: 0, hbp: 0, so: 0, sf: 0, sb: 0, cs: 0, rbi: 0, ibb: 0 };
  let seasons = 0;
  for (const s of careerStats) {
    if (s.playerId !== playerId || !s.batting) continue;
    seasons++;
    for (const k of Object.keys(acc)) acc[k] += s.batting[k] || 0;
  }
  const avg = acc.ab ? acc.h / acc.ab : 0;
  const tb = acc.b1 + 2 * acc.b2 + 3 * acc.b3 + 4 * acc.hr;
  const slg = acc.ab ? tb / acc.ab : 0;
  const bbPct = acc.pa ? acc.bb / acc.pa : 0;
  return { ...acc, seasons, avg, slg, iso: slg - avg, bbPct };
}

/** 投手の通算生カウント合算。 */
function careerPitching(careerStats, playerId) {
  const acc = { outs: 0, bf: 0, h: 0, hr: 0, bb: 0, ibb: 0, hbp: 0, so: 0, er: 0, r: 0, w: 0, l: 0, sv: 0, hld: 0, g: 0, gs: 0 };
  let seasons = 0;
  for (const s of careerStats) {
    if (s.playerId !== playerId || !s.pitching) continue;
    seasons++;
    for (const k of Object.keys(acc)) acc[k] += s.pitching[k] || 0;
  }
  const ip = acc.outs / 3;
  return { ...acc, seasons, ip, era: ip ? (acc.er * 9) / ip : 0, bbPer9: ip ? (acc.bb * 9) / ip : 0, kPer9: ip ? (acc.so * 9) / ip : 0 };
}

/**
 * 二つ名（§16 Lv4回避）: 通算 "観測" 集計のパターンで自動付与する（priority 順・最初の一致）。
 * trueAbility を一切見ない＝出場して積み上げた観測（H/HR/SB/BB%・IP/BB9/K9/S）のみで決める。
 * サンプルが薄い（IP/PA ゲート未満）選手は「未知数」を返す（キャラ立ては通算実績で）。
 */
function nicknameFor(player, careerStats, cfg) {
  const N = cfg.tuning.awards.nickname;
  if (player.role === 'pitcher') {
    const c = careerPitching(careerStats, player.id);
    if (c.ip < N.ipGate) return '未知数';
    if (c.sv >= N.closerSv) return '守護神';
    if (c.bbPer9 <= N.precisionBbPer9) return '精密機械';
    if (c.kPer9 >= N.strikeoutKPer9) return 'ドクターK';
    if (c.ip >= N.workhorseIp) return '鉄腕';
    return c.bbPer9 <= 3.0 ? '技巧派' : '本格派';
  }
  const c = careerBatting(careerStats, player.id);
  if (c.pa < N.paGate) return '未知数';
  if (c.sb >= N.speedSb) return '韋駄天';
  if (c.hr >= N.bigSluggerHr) return '巨砲';
  if (c.hr >= N.sluggerHr) return '大砲';
  if (c.h >= N.hitMachineH && c.avg >= N.hitMachineAvg) return '安打製造機';
  if (c.iso >= N.isoSlugger && c.hr >= N.isoSluggerHr) return 'スラッガー';
  if (c.bbPct >= N.onbaseBbPct) return '出塁の職人';
  return 'いぶし銀';
}

// --- 記録の時代補正（D3・§11.3「記録の文脈」）------------------------------------
/**
 * 通算の「時代補正 +指標」（D3・§11.3）: 各シーズンの記録を**その年の**リーグ環境で正規化し、
 * PA/IP 加重で通算平均する。wRC+ / ERA- / FIP- は元々その年の lgwOBA/lgERA/lgFIP に対する相対値
 * ゆえ、打高時代の .320 と投高時代の .290 が「同価値」として揃う（生の打率/防御率が時代で化ける
 * のを補正する）。各年の lc はその年の全選手観測から導出（seasonLeagueConstants・観測のみ・三層構造）。
 *
 * 決定論: (careerStats, teamHistory) の純関数（各年の lc は当年の playerSeasons/standings から再現）。
 * @param {string} playerId
 * @param {{careerStats:Array, teamHistory:Array, playersById:Map, cfg:Object}} ctx
 * @returns {{role:string, seasons:number, wrcPlus:number|null, eraMinus:number|null,
 *            fipMinus:number|null, byYear:Array}} 加重通算＋年次内訳（未出場は null）
 */
function careerEraPlus(playerId, { careerStats, teamHistory, playersById, cfg }) {
  const player = playersById.get(playerId);
  if (!player) return { role: null, seasons: 0, wrcPlus: null, eraMinus: null, fipMinus: null, byYear: [] };
  // 年→その年の全 playerSeasons（当年リーグ環境の母集団）と standings（PF/リーグ判定の素）。
  const byYear = new Map();
  for (const s of careerStats) {
    if (!byYear.has(s.season)) byYear.set(s.season, []);
    byYear.get(s.season).push(s);
  }
  const standByYear = new Map();
  for (const h of teamHistory || []) standByYear.set(h.year, h.standings);

  const out = [];
  let num = 0; // 加重合計（分子）
  let den = 0; // 加重（PA or IP）合計
  const isPit = player.role === 'pitcher';
  for (const season of [...byYear.keys()].sort((a, b) => a - b)) {
    const ps = byYear.get(season);
    const mine = ps.find((s) => s.playerId === playerId);
    if (!mine) continue;
    const lc = seasonLeagueConstants(ps, standByYear.get(season) || null);
    if (isPit) {
      const pm = playerPitching(mine, lc, cfg);
      if (!pm.ip) continue;
      out.push({ year: season, ip: pm.ip, eraMinus: pm.eraMinus, fipMinus: pm.fipMinus });
      num += pm.fipMinus * pm.ip; // 代表値は FIP-（守備/運に頑健）
      den += pm.ip;
    } else {
      const bm = playerBatting(mine, lc);
      if (!bm.pa) continue;
      out.push({ year: season, pa: bm.pa, wrcPlus: bm.wrcPlus });
      num += bm.wrcPlus * bm.pa;
      den += bm.pa;
    }
  }
  const wt = den ? num / den : null;
  if (isPit) {
    // ERA- も別途 IP 加重（表示用）。
    let eraNum = 0;
    for (const r of out) eraNum += r.eraMinus * r.ip;
    return { role: 'pitcher', seasons: out.length, wrcPlus: null, eraMinus: den ? eraNum / den : null, fipMinus: wt, byYear: out };
  }
  return { role: 'fielder', seasons: out.length, wrcPlus: wt, eraMinus: null, fipMinus: null, byYear: out };
}

// --- 記録（球団史・リーグ記録・マイルストーン） --------------------------------
/** 球団史: 各年の順位（自リーグ内）と日本一。teamHistory から。 */
function teamRecords(teamHistory, teamId) {
  const rows = [];
  for (const h of teamHistory) {
    const row = h.standings.find((r) => r.teamId === teamId);
    if (!row) continue;
    const lgRows = h.standings.filter((r) => (r.league ?? 'ALL') === (row.league ?? 'ALL'));
    lgRows.sort((a, b) => (b.w - b.l) - (a.w - a.l) || (b.rs - b.ra) - (a.rs - a.ra));
    const rank = lgRows.findIndex((r) => r.teamId === teamId) + 1;
    rows.push({ year: h.year, rank, w: row.w, l: row.l, t: row.t, champion: h.champion === teamId });
  }
  return rows;
}

/** 全球団の日本一回数（球団史サマリ）。 */
function championCounts(teamHistory) {
  const m = new Map();
  for (const h of teamHistory) if (h.champion) m.set(h.champion, (m.get(h.champion) || 0) + 1);
  return m;
}

/** トップN リーグ記録（シーズン単発＋通算）。観測集計から。 */
function leagueRecords({ careerStats, playersById, cfg }) {
  const topN = cfg.tuning.awards.topN;
  const nameOf = (id) => (playersById.get(id) ? playersById.get(id).name : id);
  // シーズン単発トップN（各年の生カウント）。
  const seasonTop = (get, role) => {
    const rows = [];
    for (const s of careerStats) {
      const p = playersById.get(s.playerId);
      if (!p || p.role !== role) continue;
      const v = get(s);
      if (v == null || v <= 0) continue;
      rows.push({ playerId: s.playerId, name: nameOf(s.playerId), year: s.season, value: v });
    }
    rows.sort((a, b) => b.value - a.value || (a.playerId < b.playerId ? -1 : 1));
    return rows.slice(0, topN);
  };
  // 通算トップN（選手横断で合算）。
  const careerTop = (accKind, get) => {
    const byId = new Map();
    const ids = new Set(careerStats.map((s) => s.playerId));
    for (const id of ids) {
      const p = playersById.get(id);
      if (!p) continue;
      const agg = accKind === 'bat' ? careerBatting(careerStats, id) : careerPitching(careerStats, id);
      const v = get(agg);
      if (v == null || v <= 0) continue;
      byId.set(id, { playerId: id, name: nameOf(id), value: v });
    }
    return [...byId.values()].sort((a, b) => b.value - a.value || (a.playerId < b.playerId ? -1 : 1)).slice(0, topN);
  };
  return {
    seasonHR: seasonTop((s) => s.batting && s.batting.hr, 'fielder'),
    seasonH: seasonTop((s) => s.batting && s.batting.h, 'fielder'),
    seasonSB: seasonTop((s) => s.batting && s.batting.sb, 'fielder'),
    seasonW: seasonTop((s) => s.pitching && s.pitching.w, 'pitcher'),
    seasonSO: seasonTop((s) => s.pitching && s.pitching.so, 'pitcher'),
    seasonSV: seasonTop((s) => s.pitching && s.pitching.sv, 'pitcher'),
    careerHR: careerTop('bat', (a) => a.hr),
    careerH: careerTop('bat', (a) => a.h),
    careerSB: careerTop('bat', (a) => a.sb),
    careerW: careerTop('pit', (a) => a.w),
    careerSO: careerTop('pit', (a) => a.so),
    careerSV: careerTop('pit', (a) => a.sv),
  };
}

/** マイルストーン定義（通算 accessor・カテゴリ名・単位）。 */
const MILESTONE_DEFS = [
  { key: 'hits', role: 'fielder', label: '通算安打', unit: '本安打', get: (a) => a.h },
  { key: 'homeRuns', role: 'fielder', label: '通算本塁打', unit: '本塁打', get: (a) => a.hr },
  { key: 'wins', role: 'pitcher', label: '通算勝利', unit: '勝', get: (a) => a.w },
  { key: 'saves', role: 'pitcher', label: '通算セーブ', unit: 'S', get: (a) => a.sv },
  { key: 'strikeouts', role: 'pitcher', label: '通算奪三振', unit: '奪三振', get: (a) => a.so },
];

/**
 * 当年 year に通算で跨いだマイルストーンを検出（通算[〜year] >= T かつ 通算[〜year-1] < T）。
 * @returns {Array} [{playerId, name, category, threshold, total, unit}]
 */
function milestones({ careerStats, playersById, cfg, year }) {
  const thr = cfg.tuning.awards.milestones;
  const through = (id, y) => careerStats.filter((s) => s.playerId === id && s.season <= y);
  const out = [];
  const ids = new Set(careerStats.filter((s) => s.season === year).map((s) => s.playerId));
  for (const id of [...ids].sort()) {
    const p = playersById.get(id);
    if (!p) continue;
    for (const def of MILESTONE_DEFS) {
      if (p.role !== def.role) continue;
      const cur = def.role === 'fielder' ? careerBatting(through(id, year), id) : careerPitching(through(id, year), id);
      const prev = def.role === 'fielder' ? careerBatting(through(id, year - 1), id) : careerPitching(through(id, year - 1), id);
      const now = def.get(cur);
      const before = def.get(prev);
      for (const T of thr[def.key]) {
        if (now >= T && before < T) {
          out.push({ playerId: id, name: p.name, category: def.label, threshold: T, total: now, unit: def.unit });
        }
      }
    }
  }
  return out;
}


// ===== src/game/news.mjs =====
// ============================================================================
// フェーズC4: ニュースフィード（週次ダイジェスト＋珍記録検出・phaseC_spec C4）
//
//   detectGameNotables(events)  … 1試合の観戦イベント列（onEvent の pa/start/end）から
//        ノーヒットノーラン・完全試合・サイクル安打・猛打賞を検出する（純関数）。
//   streakOf(gameLog, teamId)   … 直近の連勝/連敗を数える。
//   weeklyDigest({...})         … 自チームの直近成績から見出しをテンプレ生成（実データ差し込み）。
//
// 決定論: すべて入力（イベント列/試合ログ/順位表）の純関数。乱数非使用（onEvent は乱数非消費＝
//   検出の有無は試合結果に一切影響しない＝既存50較正が不変）。生イベントは当該シーズンのみ（§17）。
// ============================================================================


const HIT_RESULTS = new Set(['1B', '2B', '3B', 'HR']);
/** 出塁（安打＋四死球＋失策）。完全試合の判定に使う（走者を一人も出さない）。 */
const REACH_RESULTS = new Set(['1B', '2B', '3B', 'HR', 'BB', 'HBP', 'E']);

/**
 * 1試合の観戦イベント列から珍記録を検出する。events は onEvent の構造化イベント
 * （type: 'start'|'pa'|'end'|'steal'|'sub'）。'pa' の result/outcome/pitTeam/batTeam/batterId を使う。
 * @param {Array} events
 * @returns {Array} [{kind, ...}] kind='noHitter'|'perfectGame'|'cycle'|'multiHit'
 */
function detectGameNotables(events) {
  let start = null;
  let end = null;
  const byPitTeam = new Map(); // pitTeam → {hits, reaches, batTeam}
  const byBatter = new Map(); // batterId → {teamId, hits, types:Set}
  for (const e of events) {
    if (e.type === 'start') start = e;
    else if (e.type === 'end') end = e;
    else if (e.type === 'pa') {
      let pt = byPitTeam.get(e.pitTeam);
      if (!pt) { pt = { hits: 0, reaches: 0, batTeam: e.batTeam }; byPitTeam.set(e.pitTeam, pt); }
      if (HIT_RESULTS.has(e.result)) pt.hits++;
      if (REACH_RESULTS.has(e.result)) pt.reaches++;
      let bt = byBatter.get(e.batterId);
      if (!bt) { bt = { teamId: e.batTeam, hits: 0, types: new Set() }; byBatter.set(e.batterId, bt); }
      if (HIT_RESULTS.has(e.result)) { bt.hits++; bt.types.add(e.result); }
    }
  }
  const out = [];
  // ノーヒッター/完全試合は試合完了（end）が前提。
  if (end) {
    for (const [pitTeam, pt] of byPitTeam) {
      if (pt.hits === 0) {
        if (pt.reaches === 0) out.push({ kind: 'perfectGame', teamId: pitTeam, opponent: pt.batTeam });
        else out.push({ kind: 'noHitter', teamId: pitTeam, opponent: pt.batTeam });
      }
    }
  }
  // サイクル安打（単/二/三/本の4種を1試合で）／猛打賞（3安打以上）。
  for (const [batterId, bt] of byBatter) {
    if (bt.types.size === 4) out.push({ kind: 'cycle', batterId, teamId: bt.teamId });
    if (bt.hits >= 3) out.push({ kind: 'multiHit', batterId, teamId: bt.teamId, hits: bt.hits });
  }
  return { start, end, notables: out };
}

/** 珍記録を日本語見出しへ（pnameOf: id→選手名, tnameOf: id→球団名）。 */
function notableHeadline(n, pnameOf, tnameOf) {
  if (n.kind === 'perfectGame') return `完全試合達成！ ${tnameOf(n.teamId)} の投手陣が ${tnameOf(n.opponent)} を完璧に封じる`;
  if (n.kind === 'noHitter') return `ノーヒットノーラン！ ${tnameOf(n.teamId)} が ${tnameOf(n.opponent)} 相手に無安打`;
  if (n.kind === 'cycle') return `サイクル安打！ ${pnameOf(n.batterId)} が単打・二塁打・三塁打・本塁打をすべて記録`;
  if (n.kind === 'multiHit') return `${pnameOf(n.batterId)} が猛打賞（${n.hits}安打）の固め打ち`;
  return '';
}

/**
 * 昇降格ニュース見出し（F2-3）。mv = rt.rosterMoves / step.rosterMoves の1件。
 * off要約・週次ダイジェスト・ハブのニュース欄の素材（純関数・乱数非使用）。
 * @param {{type:string, teamId:string, upName:string, upPos:string, downName:string, downPos:string}} mv
 * @param {Function} tnameOf teamId→球団名
 */
function rosterMoveHeadline(mv, tnameOf) {
  const t = tnameOf(mv.teamId);
  if (mv.type === 'ilReplace') return `${t}、${mv.downName}（${mv.downPos}）が故障で登録抹消 — 二軍から${mv.upName}を昇格`;
  if (mv.type === 'ilReturn') return `${t}、${mv.upName}（${mv.upPos}）が離脱から復帰し一軍登録（${mv.downName}は登録抹消）`;
  if (mv.type === 'perfSwap') return `${t}、不振の${mv.downName}（${mv.downPos}）を登録抹消 — 二軍で好調の${mv.upName}を昇格`;
  return '';
}

/**
 * 直近の連勝/連敗を数える（自チーム視点・最新試合から遡る）。
 * @param {Array} gameLog [{home,away,homeScore,awayScore,tie}]
 * @returns {{type:'W'|'L'|'T'|null, len:number}}
 */
function streakOf(gameLog, teamId) {
  let type = null;
  let len = 0;
  for (let i = gameLog.length - 1; i >= 0; i--) {
    const g = gameLog[i];
    if (g.home !== teamId && g.away !== teamId) continue;
    const isHome = g.home === teamId;
    const my = isHome ? g.homeScore : g.awayScore;
    const opp = isHome ? g.awayScore : g.homeScore;
    const r = g.tie ? 'T' : my > opp ? 'W' : 'L';
    if (type === null) { type = r; len = 1; }
    else if (r === type) len++;
    else break;
  }
  return { type, len };
}

/** 自リーグ内の順位とゲーム差（首位攻防の判定素）。 */
function rankAndGb(standings, teamId) {
  const row = standings.find((r) => r.teamId === teamId);
  if (!row) return null;
  const lg = standings.filter((r) => (r.league ?? 'ALL') === (row.league ?? 'ALL'));
  lg.sort((a, b) => (b.w - b.l) - (a.w - a.l) || (b.rs - b.ra) - (a.rs - a.ra));
  const rank = lg.findIndex((r) => r.teamId === teamId) + 1;
  const top = lg[0];
  const gb = gamesBehind(top, row); // 標準的なゲーム差
  const gp = row.w + row.l + (row.t || 0); // 消化試合数（開幕直後の「首位快走」誤発火を防ぐガード用）
  return { rank, gb, total: lg.length, gp };
}

/**
 * 週次ダイジェスト見出し（自チーム・実データ差し込み）。テンプレ文＋直近成績。
 * @param {{gameLog:Array, standings:Array, teamId:string, nameOf:Function, recentN?:number}} o
 * @returns {Array} [{text, cls}]（cls='good'|'bad'|'info'）
 */
function weeklyDigest({ gameLog, standings, teamId, nameOf, recentN = 7 }) {
  const out = [];
  const myName = nameOf(teamId);
  // 連勝/連敗
  const st = streakOf(gameLog, teamId);
  if (st.type === 'W' && st.len >= 3) out.push({ text: `${myName}、${st.len}連勝で波に乗る！`, cls: 'good' });
  else if (st.type === 'L' && st.len >= 3) out.push({ text: `${myName}、${st.len}連敗…反攻なるか`, cls: 'bad' });
  // 首位攻防（開幕直後は全チーム勝率.000で並ぶため、順位の意味が生まれる試合数まではガード）
  const rg = rankAndGb(standings, teamId);
  if (rg && rg.gp >= 5) {
    if (rg.rank === 1) out.push({ text: `${myName}が首位快走（${rg.total}球団中1位）`, cls: 'good' });
    else if (rg.gb <= 3) out.push({ text: `首位攻防、${myName}は${rg.rank}位・${rg.gb.toFixed(1)}ゲーム差の激戦`, cls: 'info' });
  }
  // 直近の完封勝ち／大勝
  const myGames = gameLog.filter((g) => g.home === teamId || g.away === teamId).slice(-recentN);
  for (const g of myGames) {
    const isHome = g.home === teamId;
    const my = isHome ? g.homeScore : g.awayScore;
    const opp = isHome ? g.awayScore : g.homeScore;
    const oppId = isHome ? g.away : g.home;
    if (opp === 0 && my > 0) { out.push({ text: `${myName}が${nameOf(oppId)}を完封（${my}-0）`, cls: 'good' }); break; }
  }
  for (const g of myGames) {
    const isHome = g.home === teamId;
    const my = isHome ? g.homeScore : g.awayScore;
    const opp = isHome ? g.awayScore : g.homeScore;
    const oppId = isHome ? g.away : g.home;
    if (my - opp >= 7) { out.push({ text: `${myName}が${nameOf(oppId)}に${my}-${opp}の大勝`, cls: 'good' }); break; }
  }
  return out;
}


// ===== src/game/storylines.mjs =====
// ============================================================================
// フェーズH1: ストーリーライン（連続ニュース・ライバル・引退ロード・phaseH_fun_spec H1）。
//
//   titleRaces(state)              … 当季タイトル争い（打率/HR/打点/盗塁/防御率/勝利/S/K）の
//                                     各リーグ上位3。首位・2位が僅差なら close=true（激戦）。
//   titleRaceHeadlines(state, names)  … 激戦カテゴリの見出しテキスト。
//   rookieRace(state)              … 当季新人（デビュー年=当年）の観測ベースWAR近似順位。
//   rookieRaceHeadlines(state, names) … 各リーグの新人王レース首位の見出しテキスト。
//   recordPaces(state)             … leagueRecords（awards.mjs）のシーズン記録と当季ペースを比較し、
//                                     105%超ペース＋消化50%以上の選手を検出。
//   recordPaceHeadlines(state, names) … 記録ペース見出しテキスト。
//   weeklyStorylineDigest(state, names) … 上記＋引退ロード候補見出しを1本にまとめる（「今週の見どころ」節）。
//   appendTransactionLog(state, off, completedYear, offYearIndex) … オフ確定結果を
//                                     state.transactionLog へコンパクト行として追記（advanceYearから呼ぶ）。
//   rivalriesOf(state, playerId)   … transactionLog から因縁関係（トレード相手/FA・戦力外の旧所属/
//                                     同年同round指名の同期）を導出。
//   rivalryGameHeadlines(state, names, limit) … 自チーム試合で「因縁」該当選手が活躍した回を検出し
//                                     見出しテキストを生成（テンプレ選択は hashSeed 決定論）。
//   retirementRoadCandidates(state)   … 開幕時点で年齢閾値＋通算マイルストーンを満たす「今季が
//                                     集大成」候補（引退判定そのものには一切触れない）。
//   retirementRoadHeadlines(state, names) … 上記の見出しテキスト。
//   retirementCeremonies(state, off, completedYear) … 確定した引退者のうち功労者（通算PA/IP/
//                                     受賞数が閾値超）を「引退セレモニー」カード用データへ整形。
//   retirementCeremonyText(ceremony, names) … セレモニーカード1件のテキスト整形。
//   ownTeamRetirementHeadlines(state, ceremonies, myTeamId, completedYear, names)
//                                     … 自チーム所属だった功労者の引退を個別ニュース化。
//
// 設計原則（phaseH_fun_spec 全柱共通の鉄則・厳守）:
//   - 表示層のみ: すべて (state, careerStats, transactionLog, ...) の純関数。真値(trueAbility)は
//     一切参照しない（三層構造）。エンジン（sim/）には触れない。
//   - 決定論: 乱数は hashSeed(masterSeed, 'story', ...) 階層シードのみ。既存の生成/進行ストリーム
//     を一切消費しない（独立座標＝durability/breakoutと同じ前例）。
//   - transactionLog は additive save field（旧セーブは load 時に既定 [] で補完）。
// ============================================================================





const idAsc = (a, b) => (a < b ? -1 : a > b ? 1 : 0);

// ============================================================================
// H1-1: レース追跡
// ============================================================================

/** タイトル争いカテゴリ定義（TITLE_LABELS(awards.mjs)と同キーで8種）。 */
const RACE_CATS = [
  { key: 'battingAvg', label: '首位打者', role: 'fielder', kind: 'rate', get: (b) => (b.ab > 0 ? b.h / b.ab : null), qualifies: (b, qPA) => b.pa >= qPA },
  { key: 'homeRun', label: '本塁打王', role: 'fielder', kind: 'count', get: (b) => b.hr },
  { key: 'rbi', label: '打点王', role: 'fielder', kind: 'count', get: (b) => b.rbi },
  { key: 'steal', label: '盗塁王', role: 'fielder', kind: 'count', get: (b) => b.sb },
  { key: 'era', label: '最優秀防御率', role: 'pitcher', kind: 'rateAsc', get: (p) => (p.outs > 0 ? (p.er * 27) / p.outs : null), qualifies: (p, qIP) => p.outs / 3 >= qIP },
  { key: 'wins', label: '最多勝', role: 'pitcher', kind: 'count', get: (p) => p.w },
  { key: 'save', label: '最多セーブ', role: 'pitcher', kind: 'count', get: (p) => p.sv },
  { key: 'strikeoutsP', label: '最多奪三振', role: 'pitcher', kind: 'count', get: (p) => p.so },
];

/**
 * 当季タイトル争い（各リーグ上位3・規定はリーグ内平均消化試合数に比例して換算）。
 * @param {Object} state GameState（state.rt が必要・シーズン中のみ意味を持つ）
 * @returns {{leagues:Array<{leagueId:string, categories:Object}>}}
 */
function titleRaces(state) {
  const rt = state.rt;
  if (!rt) return { leagues: [] };
  const cfg = state.cfg;
  const st = cfg.tuning.storylines;
  // rt.standings は Map<teamId,row> でシーズン中も常に最新（rt.table は finalizeRuntime 後のみ埋まる）。
  const standRows = [...rt.standings.values()];
  const teamLg = new Map(standRows.map((r) => [r.teamId, r.league]));
  const leagueIds = [...new Set(standRows.map((r) => r.league))].sort();
  const gpByLeague = new Map();
  for (const lid of leagueIds) {
    const rows = standRows.filter((r) => r.league === lid);
    const avg = rows.length ? rows.reduce((a, r) => a + (r.g || 0), 0) / rows.length : 0;
    gpByLeague.set(lid, avg);
  }
  const seasons = [...rt.stats.stats.values()];
  const leagues = leagueIds.map((lid) => {
    const gp = gpByLeague.get(lid) || 0;
    const qPA = qualifiedPA(gp);
    const qIP = qualifiedIP(gp);
    const inLg = seasons.filter((s) => teamLg.get(s.teamId) === lid);
    const categories = {};
    for (const cat of RACE_CATS) {
      const pool = [];
      for (const s of inLg) {
        const line = cat.role === 'pitcher' ? s.pitching : s.batting;
        if (!line) continue;
        if (cat.qualifies && !cat.qualifies(line, cat.role === 'pitcher' ? qIP : qPA)) continue;
        const v = cat.get(line);
        if (v == null || Number.isNaN(v)) continue;
        if (cat.kind !== 'rateAsc' && v <= 0) continue; // 数え上げ0は掲載対象外
        pool.push({ playerId: s.playerId, value: v });
      }
      const asc = cat.kind === 'rateAsc';
      pool.sort((a, b) => (asc ? a.value - b.value : b.value - a.value) || idAsc(a.playerId, b.playerId));
      const leaders = pool.slice(0, 3);
      const margin = cat.kind === 'count' ? st.raceCloseMargin.count : st.raceCloseMargin.rate;
      const close = leaders.length >= 2 && Math.abs(leaders[0].value - leaders[1].value) <= margin;
      categories[cat.key] = { label: cat.label, kind: cat.kind, leaders, close };
    }
    return { leagueId: lid, categories };
  });
  return { leagues };
}

function fmtRaceValue(kind, v) {
  if (kind === 'rate') return v.toFixed(3).replace(/^0\./, '.');
  if (kind === 'rateAsc') return v.toFixed(2);
  return String(Math.round(v));
}

/** タイトル争いが激戦のカテゴリだけ見出しテキストへ（names={pnameOf,tnameOf,leagueNameOf}）。 */
function titleRaceHeadlines(state, names = {}) {
  const { pnameOf = (id) => id, leagueNameOf = (id) => id } = names;
  const out = [];
  for (const lg of titleRaces(state).leagues) {
    for (const cat of Object.values(lg.categories)) {
      if (!cat.close) continue;
      const [l1, l2] = cat.leaders;
      out.push({
        text: `【${leagueNameOf(lg.leagueId)}】${cat.label}争いが激戦！首位 ${pnameOf(l1.playerId)}（${fmtRaceValue(cat.kind, l1.value)}） vs 2位 ${pnameOf(l2.playerId)}（${fmtRaceValue(cat.kind, l2.value)}）`,
        cls: 'info',
      });
    }
  }
  return out;
}

/** 生の投手ラインから簡易FIP（transactions.mjs observedValueOfと同式・replacement非減算）。 */
function simpleFip(pt, ip) {
  if (!ip) return 0;
  return (13 * (pt.hr || 0) + 3 * ((pt.bb || 0) - (pt.ibb || 0) + (pt.hbp || 0)) - 2 * (pt.so || 0)) / ip;
}

/**
 * 当季新人王レース（観測ベース近似: 野手=wOBA×PA／投手=-FIP×IP）。開幕年（前年成績を持つ選手が
 * 皆無＝全員デビュー）は awards.mjs の新人王同様に対象外（意味が立たないため）。
 * @returns {{leagues:Array<{leagueId:string, leaders:Array<{playerId,value,role}>}>}}
 */
function rookieRace(state) {
  const rt = state.rt;
  if (!rt) return { leagues: [] };
  const cfg = state.cfg;
  const priorIds = new Set();
  for (const s of state.careerStats) if (s.season < state.year) priorIds.add(s.playerId);
  if (!priorIds.size) return { leagues: [] };
  const teamLg = new Map([...rt.standings.values()].map((r) => [r.teamId, r.league]));
  const byLeague = new Map();
  for (const s of rt.stats.stats.values()) {
    if (priorIds.has(s.playerId)) continue;
    const lid = teamLg.get(s.teamId);
    if (lid == null) continue;
    let value = null;
    let role = null;
    if (s.pitching && s.pitching.outs > 0) {
      role = 'pitcher';
      const ip = s.pitching.outs / 3;
      value = -simpleFip(s.pitching, ip) * ip;
    } else if (s.batting && s.batting.pa > 0) {
      role = 'fielder';
      value = observedWoba(s.batting, cfg) * s.batting.pa;
    }
    if (value == null) continue;
    if (!byLeague.has(lid)) byLeague.set(lid, []);
    byLeague.get(lid).push({ playerId: s.playerId, value, role });
  }
  const N = cfg.tuning.storylines.rookieRaceTopN ?? 5;
  const leagues = [...byLeague.keys()].sort().map((lid) => ({
    leagueId: lid,
    leaders: byLeague.get(lid).sort((a, b) => b.value - a.value || idAsc(a.playerId, b.playerId)).slice(0, N),
  }));
  return { leagues };
}

/** 各リーグの新人王レース首位だけ見出しテキストへ。 */
function rookieRaceHeadlines(state, names = {}) {
  const { pnameOf = (id) => id, leagueNameOf = (id) => id } = names;
  const out = [];
  for (const lg of rookieRace(state).leagues) {
    if (!lg.leaders.length) continue;
    out.push({ text: `【${leagueNameOf(lg.leagueId)}】新人王レース、現在の首位は ${pnameOf(lg.leaders[0].playerId)}`, cls: 'info' });
  }
  return out;
}

/** シーズン記録カテゴリ（leagueRecords の season系キーと対応）。 */
const PACE_CATS = [
  ['seasonHR', 'homeRuns', (s) => s.batting && s.batting.hr, '本塁打'],
  ['seasonH', 'hits', (s) => s.batting && s.batting.h, '安打'],
  ['seasonSB', 'steals', (s) => s.batting && s.batting.sb, '盗塁'],
  ['seasonW', 'wins', (s) => s.pitching && s.pitching.w, '勝利'],
  ['seasonSO', 'strikeouts', (s) => s.pitching && s.pitching.so, '奪三振'],
  ['seasonSV', 'saves', (s) => s.pitching && s.pitching.sv, 'セーブ'],
];

/** careerStats から playerId→role の簡易マップ（leagueRecords が要求する playersById の代用）。 */
function roleMapFromCareer(careerStats) {
  const m = new Map();
  for (const s of careerStats) {
    if (m.has(s.playerId)) continue;
    if (s.pitching && (s.pitching.g > 0 || s.pitching.outs > 0)) m.set(s.playerId, 'pitcher');
    else if (s.batting && s.batting.pa > 0) m.set(s.playerId, 'fielder');
  }
  return m;
}

/**
 * シーズン記録ペース検出（leagueRecords の既存トップ1と当季ペースを比較）。
 * @returns {Array<{category,label,playerId,current,pace,recordValue,progress}>}
 */
function recordPaces(state) {
  const rt = state.rt;
  if (!rt) return [];
  const cfg = state.cfg;
  const st = cfg.tuning.storylines;
  const roleMap = roleMapFromCareer(state.careerStats);
  const playersById = new Map([...roleMap].map(([id, role]) => [id, { role, name: id }]));
  const recs = leagueRecords({ careerStats: state.careerStats, playersById, cfg });
  const teamG = new Map([...rt.standings.values()].map((r) => [r.teamId, r.g]));
  const fullG = cfg.league.gamesPerSeason;
  const out = [];
  for (const [key, category, get, label] of PACE_CATS) {
    const top = recs[key];
    if (!top || !top.length) continue;
    const recordValue = top[0].value;
    if (!(recordValue > 0)) continue;
    for (const s of rt.stats.stats.values()) {
      const v = get(s);
      if (!v) continue;
      const g = teamG.get(s.teamId) || 0;
      const progress = fullG ? g / fullG : 0;
      if (progress < st.recordPaceMinProgress) continue;
      const pace = v / progress;
      if (pace >= recordValue * st.recordPaceThreshold) {
        out.push({ category, label, playerId: s.playerId, current: v, pace, recordValue, progress });
      }
    }
  }
  return out;
}

/** 記録ペース見出しテキスト（ペース比率の高い順に digestMaxItems 件まで）。 */
function recordPaceHeadlines(state, names = {}) {
  const { pnameOf = (id) => id } = names;
  const max = state.cfg.tuning.storylines.digestMaxItems ?? 6;
  return recordPaces(state)
    .sort((a, b) => b.pace / b.recordValue - a.pace / a.recordValue || idAsc(a.playerId, b.playerId))
    .slice(0, max)
    .map((p) => ({
      text: `${pnameOf(p.playerId)}が${p.label}のシーズン記録ペース（現在${p.current}・ペース換算${Math.round(p.pace)}）`,
      cls: 'good',
    }));
}

// ============================================================================
// H1-3: 引退ロード（開幕時点の候補検出。実際の引退判定・確率は roster.mjs のまま不変）
// ============================================================================

function milestoneHit(agg, thresholds) {
  for (const [k, v] of Object.entries(thresholds || {})) {
    if ((agg[MILESTONE_FIELD[k]] ?? 0) >= v) return true;
  }
  return false;
}
const MILESTONE_FIELD = { hits: 'h', homeRuns: 'hr', wins: 'w', saves: 'sv', strikeouts: 'so' };

/**
 * 開幕時点の「引退ロード候補」（年齢閾値＋通算マイルストーンいずれか到達）。引退判定そのものは
 * roster.mjs の decideRetire が別途行う（本関数はニュース素材の検出のみ・非干渉）。
 * @returns {Array<{playerId,teamId,age,role}>}
 */
function retirementRoadCandidates(state) {
  const cfg = state.cfg;
  const rr = cfg.tuning.storylines.retirementRoad;
  const out = [];
  for (const p of state.league.players) {
    if (p.rosterStatus !== 'active') continue;
    if (p.age < rr.ageThreshold) continue;
    const isPitcher = p.role === 'pitcher';
    const agg = isPitcher ? careerPitching(state.careerStats, p.id) : careerBatting(state.careerStats, p.id);
    const hit = milestoneHit(agg, isPitcher ? rr.pitcherMilestones : rr.batterMilestones);
    if (!hit) continue;
    out.push({ playerId: p.id, teamId: p.teamId, age: p.age, role: p.role });
  }
  return out.sort((a, b) => b.age - a.age || idAsc(a.playerId, b.playerId));
}

/** 引退ロード候補の見出しテキスト。 */
function retirementRoadHeadlines(state, names = {}) {
  const { pnameOf = (id) => id } = names;
  return retirementRoadCandidates(state).map((c) => ({
    text: `${pnameOf(c.playerId)}（${c.age}歳）、今季が集大成のシーズンになるか`,
    cls: 'info',
  }));
}

/**
 * 「今週の見どころ」節: タイトル争い／新人王レース／記録ペース／引退ロードの見出しを1本化する
 * （ニュースタブの新設節。既存 weeklyDigest の隣に並べる想定・digestMaxItems で件数上限）。
 */
function weeklyStorylineDigest(state, names = {}) {
  const max = state.cfg.tuning.storylines.digestMaxItems ?? 6;
  const out = [
    ...titleRaceHeadlines(state, names),
    ...rookieRaceHeadlines(state, names),
    ...recordPaceHeadlines(state, names),
    ...retirementRoadHeadlines(state, names),
  ];
  return out.slice(0, max);
}

// ============================================================================
// H1-2: ライバル・因縁（transactionLog）
// ============================================================================

/**
 * 完了年オフの確定結果（fa/trades/pickups/draftLog.picks）を state.transactionLog へ
 * コンパクト行として追記する（advanceYear から呼ぶ・additive）。
 * 行形式: {year, kind, playerId, playerId2?, from?, to?, round?}
 *   kind='fa'|'trade'|'pickup'|'draft'
 * @returns {Array} 追記した行（テスト用に返す）
 */
function appendTransactionLog(state, off, completedYear, offYearIndex) {
  const rows = [];
  for (const f of off.fa ?? []) {
    rows.push({ year: completedYear, kind: 'fa', playerId: f.playerId, from: f.from, to: f.to });
  }
  for (const t of off.trades ?? []) {
    if (t.rejected) continue;
    rows.push({ year: completedYear, kind: 'trade', playerId: t.aPlayer, playerId2: t.bPlayer, from: t.aTeam, to: t.bTeam });
  }
  for (const pu of off.pickups ?? []) {
    rows.push({ year: completedYear, kind: 'pickup', playerId: pu.playerId, from: pu.from, to: pu.to });
  }
  const picks = off.draftLog ? off.draftLog.picks : null;
  if (picks) {
    for (const pick of picks) {
      rows.push({ year: completedYear, kind: 'draft', playerId: pick.prospectId, to: pick.teamId, round: pick.round });
    }
  }
  if (!state.transactionLog) state.transactionLog = [];
  state.transactionLog.push(...rows);
  return rows;
}

/**
 * 選手の因縁関係を transactionLog から導出する（同年同round指名の同期／トレード相手／
 * FA・戦力外の旧所属）。三層構造: すべて実際に起きた取引の事実のみ（真値非参照）。
 * @returns {Array} [{type:'trade'|'faOld'|'pickupOld'|'draftmate', year, oldTeamId?, newTeamId?,
 *                    otherPlayerId?, matchTeamId?, round?}]
 */
function rivalriesOf(state, playerId) {
  const log = state.transactionLog || [];
  const out = [];
  for (const row of log) {
    if (row.kind === 'trade') {
      if (row.playerId === playerId) {
        out.push({ type: 'trade', year: row.year, otherPlayerId: row.playerId2, oldTeamId: row.from, newTeamId: row.to });
      } else if (row.playerId2 === playerId) {
        out.push({ type: 'trade', year: row.year, otherPlayerId: row.playerId, oldTeamId: row.to, newTeamId: row.from });
      }
    } else if (row.kind === 'fa' && row.playerId === playerId) {
      out.push({ type: 'faOld', year: row.year, oldTeamId: row.from, newTeamId: row.to });
    } else if (row.kind === 'pickup' && row.playerId === playerId) {
      out.push({ type: 'pickupOld', year: row.year, oldTeamId: row.from, newTeamId: row.to });
    }
  }
  const mine = log.find((r) => r.kind === 'draft' && r.playerId === playerId);
  if (mine) {
    for (const row of log) {
      if (row.kind !== 'draft' || row.year !== mine.year || row.round !== mine.round || row.playerId === playerId) continue;
      out.push({ type: 'draftmate', year: row.year, round: row.round, otherPlayerId: row.playerId, matchTeamId: row.to });
    }
  }
  return out;
}

/** 見出しマッチング用の「相手チーム」（旧所属 or 同期の在籍先）。 */
function rivalryMatchTeam(r) {
  return r.oldTeamId ?? r.matchTeamId ?? null;
}

function matchRivalry(state, playerId, oppTeamId) {
  const rivals = rivalriesOf(state, playerId);
  return rivals.find((r) => rivalryMatchTeam(r) === oppTeamId) || null;
}

const RIVALRY_TEMPLATES = {
  faOld: [
    (n, t) => `${n}が古巣${t}に牙をむく`,
    (n, t) => `${n}、${t}を出た男が意地を見せる`,
    (n, t) => `${n}、かつての本拠地${t}戦で躍動`,
  ],
  pickupOld: [
    (n, t) => `${n}、戦力外にした${t}を相手に一泡吹かせる`,
    (n, t) => `${n}、見限った球団${t}に結果で応える`,
  ],
  trade: [
    (n, t) => `${n}、かつての在籍先${t}を相手に一暴れ`,
    (n, t) => `${n}、トレードで去った${t}戦で存在感`,
  ],
  draftmate: [
    (n, t) => `${n}、同期指名組を擁する${t}との一戦で輝く`,
  ],
};

function isNotableBatter(bt) {
  return bt.hr >= 2 || bt.h >= 3;
}
function isNotablePitcher(pt) {
  return pt.k >= 10 || (pt.outs >= 21 && pt.r === 0);
}

/**
 * 自チーム試合（state.rt.playerGameLog）で「因縁」該当選手が活躍(notable)した場合の見出し
 * （直近の試合から新しい順・最大 limit 件）。決定論: テンプレ選択は
 * hashSeed(masterSeed,'story',year,day,playerId) の rng（表示文言のみ・結果に非干渉）。
 * @param {{pnameOf:Function, tnameOf:Function}} names
 */
function rivalryGameHeadlines(state, names = {}, limit = 5) {
  const { pnameOf = (id) => id, tnameOf = (id) => id } = names;
  const rt = state.rt;
  if (!rt || !rt.playerGameLog) return [];
  const out = [];
  for (const rec of rt.playerGameLog.slice().reverse()) {
    const b = rec.box;
    if (!b) continue;
    for (const side of ['home', 'away']) {
      const oppTeamThisGame = side === 'home' ? rec.away : rec.home;
      for (const bt of b.batters[side] || []) {
        if (!isNotableBatter(bt)) continue;
        const hit = matchRivalry(state, bt.pid, oppTeamThisGame);
        if (hit) out.push(buildRivalryHeadline(state, bt.pid, rec.day, oppTeamThisGame, hit, pnameOf, tnameOf));
      }
      for (const pt of b.pitchers[side] || []) {
        if (!isNotablePitcher(pt)) continue;
        const hit = matchRivalry(state, pt.pid, oppTeamThisGame);
        if (hit) out.push(buildRivalryHeadline(state, pt.pid, rec.day, oppTeamThisGame, hit, pnameOf, tnameOf));
      }
    }
    if (out.length >= limit) break;
  }
  return out.slice(0, limit);
}

function buildRivalryHeadline(state, playerId, day, oppTeamId, rivalry, pnameOf, tnameOf) {
  const list = RIVALRY_TEMPLATES[rivalry.type] || RIVALRY_TEMPLATES.faOld;
  const r = makeRng(hashSeed(state.masterSeed, 'story', state.year, day, playerId));
  const tpl = list[r.int(list.length)];
  return { text: tpl(pnameOf(playerId), tnameOf(oppTeamId)), cls: 'good', playerId, oppTeamId, day, type: rivalry.type };
}

// ============================================================================
// H1-3: 引退セレモニー（確定した引退者のうち功労者をカード化）
// ============================================================================

/**
 * 確定した引退者（off.retirees）のうち功労者（通算PA/IP/受賞数が閾値超）を
 * 「引退セレモニー」カード用データへ整形する（通算成績・受賞歴・二つ名・在籍球団）。
 * @returns {Array<{playerId,name,role,primaryPos,finalAge,retiredAfterYear,nickname,awards,career,teams}>}
 */
function retirementCeremonies(state, off, completedYear) {
  const cfg = state.cfg;
  const rr = cfg.tuning.storylines.retirementRoad;
  const awardsHistory = state.awardsHistory.some((h) => h.year === completedYear)
    ? state.awardsHistory
    : state.awardsHistory.concat([{ year: completedYear, awards: off.awards }]);
  const out = [];
  for (const r of off.retirees ?? []) {
    const isPitcher = r.role === 'pitcher';
    const agg = isPitcher ? careerPitching(state.careerStats, r.id) : careerBatting(state.careerStats, r.id);
    const scale = isPitcher ? agg.ip : agg.pa;
    // playerAwardHistory: awardsHistory が対象年をすべて覆っていれば playersById は参照されない
    //   （recomputeAwardHistory のフォールバック対象年が空集合になるため・awards.mjs 参照）。
    const hist = playerAwardHistory(r.id, { careerStats: state.careerStats, teamHistory: state.teamHistory, playersById: new Map(), cfg, awardsHistory });
    const merit = scale >= (isPitcher ? rr.ceremonyMinIP : rr.ceremonyMinPA) || hist.length >= rr.ceremonyMinAwards;
    if (!merit) continue;
    const teams = [];
    for (const s of state.careerStats) {
      if (s.playerId === r.id && !teams.includes(s.teamId)) teams.push(s.teamId);
    }
    out.push({
      playerId: r.id, name: r.name, role: r.role, primaryPos: r.primaryPos, finalAge: r.finalAge,
      retiredAfterYear: r.retiredAfterYear, nickname: nicknameFor(r, state.careerStats, cfg),
      awards: hist, career: agg, teams,
    });
  }
  return out;
}

/** 引退セレモニーカード1件のテキスト整形（names={tnameOf}）。 */
function retirementCeremonyText(ceremony, names = {}) {
  const { tnameOf = (id) => id } = names;
  const isPitcher = ceremony.role === 'pitcher';
  const c = ceremony.career;
  const line = isPitcher
    ? `通算${c.w}勝${c.l}敗${c.sv}S・防御率${Number.isFinite(c.era) ? c.era.toFixed(2) : '-'}（${c.ip.toFixed(0)}回）`
    : `通算${c.h}安打・${c.hr}本塁打・打率${c.avg.toFixed(3)}`;
  const teams = ceremony.teams.map((t) => tnameOf(t)).join('→');
  return `${ceremony.name}（「${ceremony.nickname}」・${ceremony.finalAge}歳）が引退。${line}。受賞${ceremony.awards.length}回。在籍: ${teams}`;
}

/** 自チーム所属だった功労者の引退だけを個別ニュース化（完了年時点の最終所属で判定）。 */
function ownTeamRetirementHeadlines(state, ceremonies, myTeamId, completedYear, names = {}) {
  const finalTeam = new Map();
  for (const s of state.careerStats) if (s.season === completedYear) finalTeam.set(s.playerId, s.teamId);
  return ceremonies
    .filter((c) => finalTeam.get(c.playerId) === myTeamId)
    .map((c) => ({ text: `【引退】${retirementCeremonyText(c, names)}`, cls: 'info', playerId: c.playerId }));
}
