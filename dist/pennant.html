  const pitcher = fielding.byId.get(fielding.curPid);
  const catcher = fielding.byId.get(fielding.defense.C);
  const succ = expit(
    logit(s.successBase) +
      ratingDelta(br.steal, s.stealSlope) +
      ratingDelta(sp, s.stealSlope * 0.6) -
      ratingDelta(pitcher.trueAbility.pitching.hold, s.holdSlope) -
      ratingDelta(catcher ? catcher.trueAbility.common.arm : 50, s.armSlope),
  );

  const rStat = statFor(bases[0], batting.teamId);
  const catcherId = fielding.defense.C; // rSB（捕手盗塁阻止run・§B3b）の帰属先
  if (rng.next() < succ) {
    bases[1] = bases[0]; // 二塁へ
    bases[0] = null;
    rStat.batting.sb++;
    if (catcherId) statFor(catcherId, fielding.teamId).fielding.sbAllowed++; // 捕手が許したSB（乱数非消費）
  } else {
    bases[0] = null; // 盗塁死
    rStat.batting.cs++;
    if (catcherId) statFor(catcherId, fielding.teamId).fielding.csMade++; // 捕手が刺したCS（乱数非消費）
    // 盗塁死は投手在籍中の記録アウト＝投手IPに算入（監査A2: ΣpositionOuts==8·Σpitcher.outs を回復）。
    statFor(fielding.curPid, fielding.teamId).pitching.outs++;
    fielding.cur.outs++;
    return outs + 1;
  }
  return outs;
}

/**
 * 1試合をシミュレート。statFor(pid,teamId)=PlayerSeason を返す関数。
 * @param {Object} homeInit initSide v2 参照（旧 {teamId,depth,starterIdx} も後方互換で受ける）
 * @param {Function} [onBattedBall] (batterId, teamId, battedBall, result) スプレー収集用（任意）
 * @param {{maxInnings?:number}} [opts] ポストシーズンは maxInnings:Infinity（延長は決着まで・§S3-3）
 * @returns {{homeScore, awayScore, innings, tie, pitchers:{home,away}, subs:{home,away}}}
 *   pitchers: 投手使用ログ [{pid,pitches,outs,enterInning,enterDiff}]（S3疲労管理の素材）
 *   subs:     交代ログ [{type:'PH'|'PR'|'DEF'|'RP', inning, outPid, inPid}]
 */
function simulateGame(homeInit, awayInit, cfg, rng, statFor, park, onBattedBall, opts = {}) {
  const home = initSide(homeInit, cfg);
  const away = initSide(awayInit, cfg);
  const maxInnings = opts.maxInnings ?? MAX_INNINGS;
  // 文脈指標フック（§B2）: 存在するときのみ各プレー確定点で ΔRE/ΔWPA/LI を積む。
  // 乱数は一切消費しないため、gc の有無で試合結果は不変（決定論・較正30指標が不変）。
  const gc = opts.gameContext ?? null;
  if (gc) {
    gc.maxInnings = maxInnings;
    gc.startGame();
  }

  // 得点推移ログ（勝敗の正確な判定用）: 得点が入るたびに両軍のスコアと現投手を記録
  const runLog = [];
  const recordRun = () =>
    runLog.push({ homeScore: home.score, awayScore: away.score, homePid: home.curPid, awayPid: away.curPid });

  let inning = 1;
  while (true) {
    playHalf(away, home, cfg, rng, statFor, park, false, onBattedBall, recordRun, inning, false, gc); // 表: away攻撃
    if (inning >= 9 && home.score > away.score) break; // 裏を省略（ホームリード）
    const bottomWalkoff = inning >= 9;
    playHalf(home, away, cfg, rng, statFor, park, bottomWalkoff, onBattedBall, recordRun, inning, true, gc); // 裏: home攻撃
    if (inning >= 9 && home.score !== away.score) break;
    inning++;
    if (inning > maxInnings) break;
  }

  flushPitcher(home, away.score);
  flushPitcher(away, home.score);
  assignDecisions(home, away, statFor, runLog);
  // シャットダウン/メルトダウン（§B2）: 救援の1登板WPAを閾値判定（加算パスのみ）。
  if (gc && gc.mode === 'accumulate') classifyShutdowns(home, away, statFor, cfg);

  const usage = (side) =>
    side.log.map((ap) => ({
      pid: ap.pid,
      pitches: Math.round(ap.pitches),
      outs: ap.outs,
      enterInning: ap.enterInning,
      enterDiff: ap.enterDiff,
    }));
  return {
    homeScore: home.score,
    awayScore: away.score,
    innings: Math.min(inning, maxInnings), // 12回引分でループ脱出時 inning=13 になるためクリップ（off-by-one修正）
    tie: home.score === away.score,
    pitchers: { home: usage(home), away: usage(away) }, // 投手使用ログ（S3の疲労管理素材）
    subs: { home: home.subs, away: away.subs },
  };
}

/**
 * サイド初期化 v2（§S2-1）。season から「今日のスタメン/ベンチ/ブルペン可用リスト/監督」を
 * 受ける。未指定フィールドは depth から既定生成（S3改修前の season でも動く後方互換）。
 * DH無し編成（9番 pos:'P' プレースホルダ）には当日先発を充填する。
 * @param {{teamId, depth, starterIdx, lineup?, starterPid?, bench?, availableRelievers?, manager?, dh?}} init
 */
function initSide(init, cfg) {
  const d = init.depth;
  const starterId = init.starterPid ?? d.rotation[init.starterIdx % d.rotation.length];
  // lineupSlots: 打順スロット→現在の選手。交代はスロット単位（一度退いた選手は再出場不可）
  const slots = (init.lineup ?? d.lineup).map((s) => ({ playerId: s.playerId, pos: s.pos }));
  const pitcherSlot = slots.findIndex((s) => s.pos === 'P'); // DH無し試合のみ >=0
  if (pitcherSlot >= 0) slots[pitcherSlot].playerId = starterId; // 9番=当日の先発
  const dhSlot = slots.findIndex((s) => s.pos === 'DH');
  // 守備配置は「当日のスタメン」から導く（S3 日次スタメンAI: depth の初期配置と異なりうる）
  const defense = {};
  for (const s of slots) {
    if (s.pos !== 'DH' && s.pos !== 'P') defense[s.pos] = s.playerId;
  }
  const bullpen = (init.availableRelievers ?? d.bullpen).slice();
  const roles = d.bullpenRoles ?? {
    closer: bullpen[0] ?? null,
    setup8: bullpen[1] ?? null,
    setup7: bullpen[2] ?? null,
    middle: bullpen.slice(3, Math.max(3, bullpen.length - 1)),
    long: bullpen.length >= 4 ? bullpen[bullpen.length - 1] : null,
  };
  return {
    teamId: init.teamId,
    byId: d.byId,
    manager: init.manager ?? neutralManager(),
    slots,
    pitcherSlot,
    dhSlot, // 守備に就かないDH（守備位置補正=-17.5の主語）のスロット
    defense,
    orderIdx: 0,
    starterId,
    curPid: starterId,
    usedPitchers: new Set([starterId]),
    retired: new Set(), // 一度退いた選手（再出場不可・§S2-1）
    bench: (init.bench ?? d.bench).slice(), // 当日のベンチ（起用で減る）
    bullpen,
    roles, // ブルペン役割 closer/setup8/setup7/middle/long（継投v2）
    pendingPitcher: false, // 投手への代打→次の守備から新投手（§S2-2）
    pregame: buildPregameEval(d.byId, cfg), // 監督の当日メモ（編成時評価。以降trueAbilityは見ない）
    // enterDiff/enterInning: 登板時の投手側リード差と回（ホールド/BS判定・監査B3）
    cur: { pid: starterId, outs: 0, pitches: 0, runs: 0, er: 0, bf: 0, enterDiff: 0, enterInning: 1, wpa: 0 },
    log: [],
    subs: [], // 交代ログ {type,inning,outPid,inPid}（再出場不可の検証・S3素材）
    score: 0,
  };
}

function emptyCur() {
  return { pid: null, outs: 0, pitches: 0, runs: 0, er: 0, bf: 0, enterDiff: 0, enterInning: 0, wpa: 0 };
}

/** 半イニングを消化（batting=攻撃側, fielding=守備側）。battingIsHome=攻撃側がホーム（裏）か・
 *  gc=文脈指標フック（§B2・任意）。 */
function playHalf(batting, fielding, cfg, rng, statFor, park, walkoff, onBattedBall, recordRun, inning, battingIsHome, gc) {
  // 守備側の投手整備: 投手への代打の後始末→回頭の役割ベース継投（§S2-2/§S2-7）
  halfStartPitching(fielding, batting.score, inning, statFor, cfg);
  // 守備固め（§S2-3: 8回以降・リード1-3・当日メモで優位時のみ）
  maybeDefensiveSub(fielding, batting.score, inning, cfg);

  const bases = [null, null, null];
  let outs = 0;
  let errorInInning = false; // 失策発生後の得点は非自責（§ERA整合）
  while (outs < 3) {
    // 盗塁機会（走者一塁・二塁空き）。§6 wSB×采配ゲート。PA解決の前に処理。
    const stBase = baseBits(bases);
    const stOuts = outs;
    const stRunner = bases[0];
    outs = attemptSteal(batting, fielding, bases, outs, statFor, cfg, rng);
    // 文脈指標（§B2）: 盗塁/盗塁死で状態が動いたら ΔRE/ΔWPA を走者へ（投手は−側）。
    if (gc && stRunner != null && (baseBits(bases) !== stBase || outs !== stOuts)) {
      gc.onPlay({
        kind: 'steal',
        battingIsHome,
        inning,
        batSideStat: statFor(stRunner, batting.teamId).baserunning,
        pitStat: statFor(fielding.curPid, fielding.teamId).pitching,
        pitcherCur: fielding.cur,
        firstBatterOfApp: false,
        baseBefore: stBase,
        outsBefore: stOuts,
        baseAfter: baseBits(bases),
        outsAfter: outs,
        runsOnPlay: 0,
        batScoreBefore: batting.score,
        fldScore: fielding.score,
      });
    }
    if (outs >= 3) break;

    // 代打（§S2-3）: 打席に入る前に差し替える（判断は manager.mjs）
    maybePinchHit(batting, fielding, bases, inning, cfg, statFor);

    const batterId = batting.slots[batting.orderIdx].playerId;
    // 投手打席か（DH無し試合の9番スロット×現投手。代打後は該当しない）
    const batterIsPitcher = batting.orderIdx === batting.pitcherSlot && batterId === batting.curPid;
    const nextIdx = (batting.orderIdx + 1) % 9;
    const nextIsPitcher = nextIdx === batting.pitcherSlot && batting.slots[nextIdx].playerId === batting.curPid;
    batting.orderIdx = nextIdx;
    const batter = batting.byId.get(batterId);
    const pitcher = fielding.byId.get(fielding.curPid);

    const bStat = statFor(batterId, batting.teamId);
    const pStat = statFor(fielding.curPid, fielding.teamId);
    const batterWoba = observedWoba(bStat.batting, cfg); // 采配用の観測評価（真値は見ない）

    // 文脈指標（§B2）: 打席プレーの「状態前」（盗塁/代打反映後）と登板初打者フラグを控える。
    const paBase = baseBits(bases);
    const paOuts = outs;
    const paScore = batting.score;
    const firstBF = fielding.cur.bf === 0; // 登板初打者（gmLI用・bf++の前）

    // 敬遠（§S2-5・守備側監督の判断）: PA解決の前に判断し、成立なら申告四球
    const pIBB = ibbProb(
      {
        manager: fielding.manager,
        bases,
        outs,
        inning,
        scoreDiff: fielding.score - batting.score,
        batterWoba,
        nextIsPitcher,
      },
      cfg,
    );
    const isIBB = pIBB > 0 && rng.next() < pIBB;

    // 犠打（§S2-4・攻撃側監督の判断）: PA解決の前に処理（敬遠時はなし）
    if (!isIBB) {
      const pBunt = buntAttemptProb(
        {
          manager: batting.manager,
          bases,
          outs,
          scoreDiff: batting.score - fielding.score,
          batterWoba,
          isPitcher: batterIsPitcher,
        },
        cfg,
      );
      if (pBunt > 0 && rng.next() < pBunt) {
        const bunt = resolveBunt(batting, fielding, bases, outs, cfg, rng, batterId, bStat, pStat);
        outs = bunt.outs;
        // スプリット計上（§B3b）: 犠打も1打席＝vsL/vsR・得点圏・ホーム/ビジターへ配る（PA恒等の維持）。
        recordPaSplits(bStat.batting, pitcher.throws, battingIsHome, (paBase & 6) !== 0, bunt.dab, bunt.dh, bunt.d1, 0, 0, 0, 0, 0, 0, 0);
        creditPlay(gc, {
          kind: 'pa',
          battingIsHome,
          inning,
          batSideStat: bStat.batting,
          pitStat: pStat.pitching,
          pitcherCur: fielding.cur,
          firstBatterOfApp: firstBF,
          baseBefore: paBase,
          outsBefore: paOuts,
          baseAfter: baseBits(bases),
          outsAfter: outs,
          runsOnPlay: batting.score - paScore,
          batScoreBefore: paScore,
          fldScore: fielding.score,
        });
        maybePinchRun(batting, fielding, bases, inning, cfg, statFor);
        if (outs < 3) maybeChangePitcher(fielding, statFor, batting.score, inning, cfg);
        continue;
      }
    }

    // 対戦巡目（この登板でこの投手が何度打線を通過したか。§3.3）
    const tto = Math.floor(fielding.cur.bf / 9);
    // 球種格子(§4段階1): この打席で投げる球種を1つ選ぶ（敬遠は勝負しない＝球種なし）
    const pitch = isIBB ? null : selectPitch(pitcher, rng, cfg);
    const outcome = isIBB ? 'BB' : resolvePADiscipline(batter, pitcher, cfg, rng, tto, pitch);
    const pc = isIBB ? cfg.tuning.ibb.pitches : pitchesFor(outcome);
    fielding.cur.pitches += pc;
    fielding.cur.bf++;
    pStat.pitching.pitches += Math.round(pc);
    pStat.pitching.bf++;
    bStat.batting.pa++;

    let result;
    let isAirOut = false;
    let bType = null;
    let hitFielderPos = null; // ARM（外野送球）用: 安打を処理した野手ポジション（§B3b）
    if (outcome === 'K') {
      result = 'out';
      bStat.batting.ab++;
      bStat.batting.so++;
      pStat.pitching.so++;
    } else if (outcome === 'BB') {
      result = 'BB';
      bStat.batting.bb++;
      pStat.pitching.bb++;
      if (isIBB) {
        bStat.batting.ibb++; // 敬遠はBBの部分集合（IBB⊆BB）
        pStat.pitching.ibb++;
      }
    } else if (outcome === 'HBP') {
      result = 'HBP';
      bStat.batting.hbp++;
      pStat.pitching.hbp++;
    } else {
      const bb = generateBattedBall(batter, pitcher, cfg, rng, { baseState: baseBits(bases), outs, tto, pitch });
      // 守備者個人のRangeを注入（2-7）: 担当ポジションの野手能力で被安打率を上下
      const r = resolveBattedBall(bb, cfg, rng, park, (pos) => {
        const fp = fielding.byId.get(fielding.defense[pos]);
        return fp ? rangeRating(fp, cfg) : 50;
      });
      result = r.result;
      bType = battedType(bb.laDeg);
      isAirOut = result === 'out' && bType !== 'GB';
      hitFielderPos = r.fielderPos; // 追加進塁機会での外野ARM帰属に使う（§B3b）
      recordBattedBallStat(bStat, pStat, result);
      // 追加系指標の打球集計（§B3a）: 期待out率/塁打分布(r)＋EV/LA/spray を積む。rng消費なし＝決定論不変。
      const pullSign = effectiveBats(batter, pitcher) === 'L' ? 1 : -1;
      accumulateBatted(bStat.batting, pStat.pitching, bb, r, pullSign, cfg);
      // 失策(ROE)判定: インプレーのアウトを Hands 依存で出塁に変える
      if (result === 'out') {
        const fPid = fielding.defense[r.fielderPos];
        const fielder = fielding.byId.get(fPid);
        const hands = fielder ? fielder.trueAbility.common.hands : 50;
        const pErr = clamp(cfg.tuning.bb.errBase - (hands - 50) * cfg.tuning.bb.errHandsW, 0.004, 0.06);
        if (rng.next() < pErr) {
          statFor(fPid, fielding.teamId).fielding.e++;
          errorInInning = true;
          result = 'E';
          isAirOut = false;
        }
      }
      // OAA累積: ポジション平均の期待アウトからの差分＝レンジ成分（§7.2）。
      // 失策前の r.result（アウト/安打）で判定＝OAAはリーグ平均0に中心化される。
      // 失策(Hands)は別成分（fielding.e→UZRで別途）として扱い、二重計上しない。
      const fielderPid = fielding.defense[r.fielderPos];
      if (fielderPid) {
        const actual = r.result === 'out' ? 1 : 0; // 失策前の判定: アウト=1, 安打=0
        statFor(fielderPid, fielding.teamId).fielding.oaaOuts += actual - r.expOut;
      }
      // スプレー収集（1-8, 任意）
      if (onBattedBall) onBattedBall(batterId, batting.teamId, bb, result);
    }

    // 対球種スプリット記録（§4段階1: 対ストレート成績等の素）
    if (pitch) {
      const sl = pitchClass(pitch.type) === 'fastball' ? bStat.batting.vsFastball : bStat.batting.vsBreaking;
      sl.pa++;
      if (outcome === 'BB') sl.bb++;
      else if (outcome !== 'HBP') {
        sl.ab++;
        if (outcome === 'K') sl.so++;
        else if (result === '1B' || result === '2B' || result === '3B' || result === 'HR') {
          sl.h++;
          if (result === 'HR') sl.hr++;
        }
      }
    }

    // ARM（外野送球の対平均run・§B3b）: 単打×二塁走者 / 二塁打×一塁走者 の追加進塁機会に
    // 相対した外野手へ、機会と (arm-50)×armRunPerOpp のrun換算を累積する。進塁判定(resolveAdv)は
    // 不変・乱数も一切消費しない（＝決定論・較正30指標が不変）。実際の送球死化はB1（一球データ）で。
    if (hitFielderPos && OUTFIELD_POS.has(hitFielderPos) && ((result === '1B' && bases[1]) || (result === '2B' && bases[0]))) {
      const ofPid = fielding.defense[hitFielderPos];
      const ofPlayer = ofPid ? fielding.byId.get(ofPid) : null;
      if (ofPlayer) {
        const fl = statFor(ofPid, fielding.teamId).fielding;
        fl.armOpp++;
        fl.armRuns += (ofPlayer.trueAbility.common.arm - 50) * cfg.tuning.field.armRunPerOpp;
      }
    }

    const ubrCtx = { byId: batting.byId, statFor, teamId: batting.teamId };
    const runs = advanceRunners(bases, result, batterId, isAirOut, outs, rng, cfg, ubrCtx);

    if (result === 'out') {
      if (isAirOut && runs > 0) {
        // 犠飛: ABを取り消してSF計上
        bStat.batting.ab--;
        bStat.batting.sf++;
      }
      const outsBefore = outs;
      outs++;
      fielding.cur.outs++;
      pStat.pitching.outs++;
      // 併殺（GB・走者一塁・2アウト未満）§6 wGDP。打者の足で回避。
      if (bType === 'GB' && bases[0] && outsBefore < 2) {
        bStat.baserunning.gdpOpp++;
        // DPR（二遊間の併殺転換・§B3b）: 機会と成立を 2B/SS 双方に計上（対平均runはmetrics側）。乱数非消費。
        const dp2 = fielding.defense['2B'];
        const dpS = fielding.defense.SS;
        if (dp2) statFor(dp2, fielding.teamId).fielding.dpOpp++;
        if (dpS) statFor(dpS, fielding.teamId).fielding.dpOpp++;
        const gp = clamp(
          cfg.tuning.gdp.base - (batter.trueAbility.common.speed - 50) * cfg.tuning.gdp.speedW,
          0.02,
          0.45,
        );
        if (rng.next() < gp) {
          bases[0] = null; // 一塁走者もアウト
          bStat.batting.gdp++;
          outs++;
          fielding.cur.outs++;
          pStat.pitching.outs++;
          if (dp2) statFor(dp2, fielding.teamId).fielding.dpTurned++;
          if (dpS) statFor(dpS, fielding.teamId).fielding.dpTurned++;
        }
      }
    }
    if (runs > 0) {
      batting.score += runs;
      if (result !== 'E') bStat.batting.rbi += runs; // 失策の得点は打点なし
      pStat.pitching.r += runs;
      pStat.pitching.er += errorInInning ? 0 : runs; // 失策以降は非自責
      fielding.cur.runs += runs;
      fielding.cur.er += errorInInning ? 0 : runs; // 登板ぶんの自責（QS判定用・§B3a）
      if (recordRun) recordRun(); // 得点推移を記録（勝敗判定用）
    }

    // スプリット計上（§B3b・乱数非消費）: 打席の最終結果からデルタを作り、対左右・得点圏・
    // ホーム/ビジターへ配る。トップレベルの生カウント（ab/h/…）と厳密に対応させる。
    {
      const sacFly = result === 'out' && isAirOut && runs > 0;
      let dab = 0, dh = 0, d1 = 0, d2 = 0, d3 = 0, dhr = 0, dbb = 0, dhbp = 0, dso = 0, dsf = 0;
      if (result === 'BB') dbb = 1;
      else if (result === 'HBP') dhbp = 1;
      else if (result === '1B') { dab = 1; dh = 1; d1 = 1; }
      else if (result === '2B') { dab = 1; dh = 1; d2 = 1; }
      else if (result === '3B') { dab = 1; dh = 1; d3 = 1; }
      else if (result === 'HR') { dab = 1; dh = 1; dhr = 1; }
      else if (result === 'E') dab = 1; // 失策出塁はAB計上・安打なし（recordBattedBallStatと整合）
      else { // 'out'（三振・凡打・犠飛）
        if (sacFly) dsf = 1; else dab = 1;
        if (outcome === 'K') dso = 1;
      }
      recordPaSplits(bStat.batting, pitcher.throws, battingIsHome, (paBase & 6) !== 0, dab, dh, d1, d2, d3, dhr, dbb, dhbp, dso, dsf);
    }

    // 文脈指標（§B2）: 打席プレー確定＝状態前→状態後（進塁/併殺/得点込み）で ΔRE/ΔWPA/LI を付与。
    // サヨナラ break の前に置き、終端(決着)勝率を正しく計上する（ゼロサム＝勝者±0.5）。
    creditPlay(gc, {
      kind: 'pa',
      battingIsHome,
      inning,
      batSideStat: bStat.batting,
      pitStat: pStat.pitching,
      pitcherCur: fielding.cur,
      firstBatterOfApp: firstBF,
      baseBefore: paBase,
      outsBefore: paOuts,
      baseAfter: baseBits(bases),
      outsAfter: outs,
      runsOnPlay: runs,
      batScoreBefore: paScore,
      fldScore: fielding.score,
    });

    // 代走（§S2-3）: PA解決後、塁上の鈍足走者をベンチ最速と交代
    maybePinchRun(batting, fielding, bases, inning, cfg, statFor);

    // 継投（球数/失点による途中降板。回頭の交代は halfStartPitching が担う）
    if (outs < 3) maybeChangePitcher(fielding, statFor, batting.score, inning, cfg);

    if (walkoff && batting.score > fielding.score) break; // サヨナラ
  }

  // 守備イニング計上（守備側の8人に outs を加算）
  for (const pos of Object.keys(fielding.defense)) {
    statFor(fielding.defense[pos], fielding.teamId).fielding.positionOuts[pos] += outs;
  }
  // 捕手フレーミング（監査B5・§7.3）: 当該イニング分の (framing-50) をrun換算して framingRuns に加算。
  // 死蔵していた捕手フレーミング能力を守備価値としてWARに接続する。
  const cPid = fielding.defense.C;
  if (cPid) {
    const framing = fielding.byId.get(cPid).trueAbility.fielding.framing;
    statFor(cPid, fielding.teamId).fielding.framingRuns += (framing - 50) * cfg.tuning.field.framePerInning * (outs / 3);
  }
  // DHの出場イニング相当を計上（守備に就かないDHにも守備位置補正 -17.5/1350 を効かせる。
  // 攻撃側ハーフのアウト数＝そのイニング数分の在籍。§9・監査A1）。
  const dhPid = batting.dhSlot >= 0 ? batting.slots[batting.dhSlot].playerId : null;
  if (dhPid) {
    const dl = statFor(dhPid, batting.teamId).fielding.positionOuts;
    dl.DH = (dl.DH || 0) + outs;
  }
}

/** 文脈指標フックの呼び出し（§B2）。gc が無ければ何もしない（乱数非消費・結果不変）。 */
function creditPlay(gc, p) {
  if (gc) gc.onPlay(p);
}

/** スプリット器1つへ1打席ぶんのデルタを加算（§B3b）。 */
function bumpSplit(sl, dab, dh, db1, db2, db3, dhr, dbb, dhbp, dso, dsf) {
  sl.pa++;
  sl.ab += dab;
  sl.h += dh;
  sl.b1 += db1;
  sl.b2 += db2;
  sl.b3 += db3;
  sl.hr += dhr;
  sl.bb += dbb;
  sl.hbp += dhbp;
  sl.so += dso;
  sl.sf += dsf;
}

/**
 * 打席1回ぶんをスプリット器へ計上（§B3b・乱数非消費）。同一デルタを 対左右・得点圏・ホーム/ビジターへ配る。
 * 全打席（通常打席＋犠打）で呼ぶことで vsL.pa+vsR.pa=pa / home.pa+away.pa=pa の恒等が成立する。
 */
function recordPaSplits(bLine, pitcherThrows, isHome, risp, dab, dh, db1, db2, db3, dhr, dbb, dhbp, dso, dsf) {
  const sp = bLine.splits;
  bumpSplit(pitcherThrows === 'L' ? sp.vsL : sp.vsR, dab, dh, db1, db2, db3, dhr, dbb, dhbp, dso, dsf);
  bumpSplit(isHome ? sp.home : sp.away, dab, dh, db1, db2, db3, dhr, dbb, dhbp, dso, dsf);
  if (risp) bumpSplit(sp.risp, dab, dh, db1, db2, db3, dhr, dbb, dhbp, dso, dsf);
}

/** シャットダウン/メルトダウン（§B2）。救援の1登板WPAが ±閾値を超えたら sd/md を計上（加算パス）。 */
function classifyShutdowns(home, away, statFor, cfg) {
  const thr = cfg.tuning.context.sdThreshold;
  for (const side of [home, away]) {
    for (const ap of side.log) {
      if (ap.pid === side.starterId || !(ap.bf > 0)) continue; // 救援の実登板のみ
      const s = statFor(ap.pid, side.teamId).pitching;
      if (ap.wpa >= thr) s.sd++;
      else if (ap.wpa <= -thr) s.md++;
    }
  }
}

function recordBattedBallStat(bStat, pStat, result) {
  bStat.batting.ab++;
  if (result === 'out') return;
  bStat.batting.h++;
  pStat.pitching.h++;
  if (result === '1B') bStat.batting.b1++;
  else if (result === '2B') bStat.batting.b2++;
  else if (result === '3B') bStat.batting.b3++;
  else if (result === 'HR') {
    bStat.batting.hr++;
    pStat.pitching.hr++;
  }
}

// --- 交代の適用（判断は manager.mjs / ここでは状態遷移と記録のみ） -------------

function removeFromBench(side, pid) {
  const i = side.bench.indexOf(pid);
  if (i >= 0) side.bench.splice(i, 1);
}

/** 代打（§S2-3）。同スロットに入り、守備位置も引き継ぐ（守備イニング計上の整合）。 */
function maybePinchHit(batting, fielding, bases, inning, cfg, statFor) {
  const slot = batting.slots[batting.orderIdx];
  const batterId = slot.playerId;
  const isPitcher = batting.orderIdx === batting.pitcherSlot && batterId === batting.curPid;
  const pick = choosePinchHitter(
    {
      side: batting,
      oppScore: fielding.score,
      bases,
      inning,
      batterId,
      isPitcher,
      oppPitcher: fielding.byId.get(fielding.curPid),
    },
    cfg,
  );
  if (!pick) return;
  batting.retired.add(batterId); // 退いた打者は再出場不可
  slot.playerId = pick;
  removeFromBench(batting, pick);
  if (isPitcher) {
    // 投手への代打（§S2-2）: 現投手の登板を確定し「次の守備から新投手」を予約。
    // curPid は投手記録（勝敗の pitcher of record）として新投手が入るまで保持する。
    flushPitcher(batting, fielding.score);
    batting.cur = emptyCur();
    batting.pendingPitcher = true;
  } else if (slot.pos !== 'DH' && slot.pos !== 'P' && batting.defense[slot.pos] === batterId) {
    batting.defense[slot.pos] = pick; // 守備位置を引き継ぐ
  }
  statFor(pick, batting.teamId).batting.ph++; // 代打打席数（§S1-5の器を消費）
  batting.subs.push({ type: 'PH', inning, outPid: batterId, inPid: pick });
}

/** 代走（§S2-3）。塁上の鈍足走者をベンチ最速と交代し、打順スロット・守備位置を引き継ぐ。 */
function maybePinchRun(batting, fielding, bases, inning, cfg, statFor) {
  const pick = choosePinchRunner({ side: batting, oppScore: fielding.score, bases, inning }, cfg);
  if (!pick) return;
  const outPid = bases[pick.baseIdx];
  const slot = batting.slots.find((s) => s.playerId === outPid);
  if (!slot) return; // 想定外（走者が打順にいない）は安全側で見送り
  batting.retired.add(outPid);
  slot.playerId = pick.pid;
  removeFromBench(batting, pick.pid);
  if (slot.pos !== 'DH' && slot.pos !== 'P' && batting.defense[slot.pos] === outPid) {
    batting.defense[slot.pos] = pick.pid; // 守備位置を引き継ぐ
  }
  bases[pick.baseIdx] = pick.pid;
  batting.subs.push({ type: 'PR', inning, outPid, inPid: pick.pid });
}

/** 守備固め（§S2-3）。守備側ハーフ開始時に適用。 */
function maybeDefensiveSub(side, oppScore, inning, cfg) {
  const pick = chooseDefensiveSub({ side, oppScore, inning }, cfg);
  if (!pick) return;
  const outPid = side.defense[pick.pos];
  const slot = side.slots.find((s) => s.playerId === outPid);
  side.retired.add(outPid);
  side.defense[pick.pos] = pick.pid;
  if (slot) slot.playerId = pick.pid;
  removeFromBench(side, pick.pid);
  side.subs.push({ type: 'DEF', inning, outPid, inPid: pick.pid });
}

// --- 犠打の解決（§S2-4） -----------------------------------------------------

/**
 * 犠打を解決。成功=走者進塁・打者アウト・sh++（ABなし・PAあり）、失敗=先頭走者アウト・打者一塁（AB計上）、
 * 内野安打=全員セーフ（AB・H計上）。走者三塁は試行条件で除外済み＝犠打から得点は発生しない。
 * @returns {{outs:number, dab:number, dh:number, d1:number}} 新outs＋スプリット計上用の打席デルタ（§B3b）。
 */
function resolveBunt(batting, fielding, bases, outs, cfg, rng, batterId, bStat, pStat) {
  const t = cfg.tuning.bunt;
  const pc = t.pitches;
  fielding.cur.pitches += pc;
  fielding.cur.bf++;
  pStat.pitching.pitches += Math.round(pc);
  pStat.pitching.bf++;
  bStat.batting.pa++;

  const u = rng.next();
  if (u < t.successProb) {
    // 成功: 先頭から順に1つ進塁・打者アウト
    if (bases[1] && !bases[2]) {
      bases[2] = bases[1];
      bases[1] = null;
    }
    if (bases[0] && !bases[1]) {
      bases[1] = bases[0];
      bases[0] = null;
    }
    bStat.batting.sh++; // 犠打はABに計上しない
    fielding.cur.outs++;
    pStat.pitching.outs++;
    return { outs: outs + 1, dab: 0, dh: 0, d1: 0 };
  }
  if (u < t.successProb + t.failProb) {
    // 失敗: 先頭走者が封殺（フィールダースチョイス＝AB計上・安打なし）
    if (bases[1]) bases[1] = null;
    else bases[0] = null;
    if (bases[0] && !bases[1]) {
      bases[1] = bases[0];
      bases[0] = null;
    }
    bases[0] = batterId;
    bStat.batting.ab++;
    fielding.cur.outs++;
    pStat.pitching.outs++;
    return { outs: outs + 1, dab: 1, dh: 0, d1: 0 };
  }
  // 内野安打: 全走者1つ進塁・打者一塁
  if (bases[1] && !bases[2]) {
    bases[2] = bases[1];
    bases[1] = null;
  }
  if (bases[0]) bases[1] = bases[0];
  bases[0] = batterId;
  bStat.batting.ab++;
  bStat.batting.h++;
  bStat.batting.b1++;
  pStat.pitching.h++;
  return { outs, dab: 1, dh: 1, d1: 1 };
}

// --- 継投v2（§S2-7。選択は manager.chooseReliever） ---------------------------

/** 新しい投手を入れる（打順スロット'P'があれば同スロットへ・§S2-2）。 */
function installPitcher(side, pid, inning, lead) {
  const outPid = side.pitcherSlot >= 0 ? side.slots[side.pitcherSlot].playerId : side.curPid;
  if (outPid != null && outPid !== pid) side.retired.add(outPid);
  side.subs.push({ type: 'RP', inning, outPid, inPid: pid });
  side.curPid = pid;
  side.usedPitchers.add(pid);
  if (side.pitcherSlot >= 0) side.slots[side.pitcherSlot].playerId = pid;
  side.cur = { pid, outs: 0, pitches: 0, runs: 0, er: 0, bf: 0, enterDiff: lead, enterInning: inning, wpa: 0 };
}

/**
 * 守備側ハーフ開始時の投手整備。
 * (1) 投手への代打の後始末: 予約済みなら新投手を必ず入れる（§S2-2）。
 * (2) 回頭の継投判断: 球数/失点で降板、セーブ機会は役割（7=setup7/8=setup8/9+=closer）へ。
 *     好投中の先発は7-8回を任せ、9回は完封継続中のみ続投（完投・完封を残す）。
 */
function halfStartPitching(fielding, oppScore, inning, statFor, cfg) {
  const pen = cfg.tuning.pen;
  const lead = fielding.score - oppScore;

  if (fielding.pendingPitcher) {
    const next =
      chooseReliever(fielding, statFor, inning, lead, cfg) ??
      availableRelievers(fielding).find((pid) => pid !== fielding.roles.closer) ??
      availableRelievers(fielding)[0];
    if (next) installPitcher(fielding, next, inning, lead);
    fielding.pendingPitcher = false;
    return;
  }

  const c = fielding.cur;
  const isStarter = c.pid === fielding.starterId;
  const saveSitu = lead >= 1 && lead <= pen.saveLeadMax && inning >= pen.leverageMinInning;
  let change;
  if (isStarter) {
    const limit = starterPitchLimit(fielding.manager, fielding.byId.get(c.pid), cfg);
    const due =
      c.pitches >= limit || c.runs >= pen.starterMaxRuns || (c.outs >= pen.tiredOuts && c.runs >= pen.tiredRuns);
    if (inning >= 9) {
      // 9回以降の続投＝完投狙いは、リード有無に依らず「完封継続中×球数余裕（cgMaxPitches）」
      // のみに絞る（完投の門番・S5較正。大差リード/同点の漫然続投で完投が溢れるのを防ぐ）
      const stay =
        c.runs === 0 && c.outs >= pen.cgMinOuts && c.pitches < Math.min(limit, pen.cgMaxPitches);
      change = due || !stay;
    } else if (saveSitu) {
      const stay = c.runs <= pen.starterStayRuns && c.pitches < limit; // 好投中の先発は7-8回を任せる
      change = due || !stay;
    } else {
      change = due;
    }
  } else {
    const due = c.outs >= relieverMaxOutsFor(fielding, c.pid, pen) || c.runs >= pen.relieverMaxRuns;
    change = due || saveSitu; // セーブ機会は回頭で適役へ繋ぐ（8回setup8→9回closer等）
  }
  if (!change) return;
  const next = chooseReliever(fielding, statFor, inning, lead, cfg);
  if (!next || next === c.pid) return;
  flushPitcher(fielding, oppScore);
  installPitcher(fielding, next, inning, lead);
}

/** 救援の役割別イニング上限（アウト数）。long=敗戦処理は長め・勝ちパターン役割は1イニング・
 *  middle（非役割）は複数イニング可＝同じ救援IPを少ない登板数で消化する（登板数王の圧縮・S5較正）。 */
function relieverMaxOutsFor(fielding, pid, pen) {
  const r = fielding.roles;
  if (pid === r.long) return pen.longOuts;
  if (pid === r.closer || pid === r.setup8 || pid === r.setup7) return pen.relieverMaxOuts;
  return pen.middleMaxOuts;
}

/** イニング途中の降板判定（球数・失点）。回頭の交代は halfStartPitching が担う。 */
function maybeChangePitcher(fielding, statFor, oppScore, inning, cfg) {
  const pen = cfg.tuning.pen;
  const c = fielding.cur;
  if (c.pid == null) return;
  const isStarter = c.pid === fielding.starterId;
  let remove;
  if (isStarter) {
    const limit = starterPitchLimit(fielding.manager, fielding.byId.get(c.pid), cfg);
    remove =
      c.pitches >= limit || c.runs >= pen.starterMaxRuns || (c.outs >= pen.tiredOuts && c.runs >= pen.tiredRuns);
  } else {
    remove = c.outs >= relieverMaxOutsFor(fielding, c.pid, pen) || c.runs >= pen.relieverMaxRuns;
  }
  if (!remove) return;

  const lead = fielding.score - oppScore;
  const next = chooseReliever(fielding, statFor, inning, lead, cfg);
  if (!next || next === c.pid) return;
  flushPitcher(fielding, oppScore);
  installPitcher(fielding, next, inning, lead);
}

/** 現投手のゲーム成績を log に確定（実登板のみ・幽霊リリーフ除外）。
 *  実登板の判定は「対戦打者あり(bf>0) または 記録アウトあり(outs>0)」。
 *  後者は回頭で登板し打者と対戦する前に盗塁死で第3アウトを記録した投手を拾う
 *  （outs>0 だが bf=0 で log から欠落する幽霊登板を防止・IPと登板Gの整合）。
 *  exitDiff=退場時の投手側リード差（ホールド/ブローンセーブ判定用・監査B3）。 */
function flushPitcher(side, oppScore) {
  if (side.cur.bf > 0 || side.cur.outs > 0) {
    side.cur.exitDiff = side.score - (oppScore ?? side.score);
    side.log.push({ ...side.cur });
  }
}

/**
 * 勝敗・セーブ（決勝点＝go-ahead run ベース。§18の簡易判定を精緻化）。
 * - 決勝点 = 勝者が最後にリードを取り以降維持した得点。
 * - 負け投手 = その決勝点を許した投手（敗者側の当時の投手）。
 * - 勝ち投手 = 決勝点時の勝者側の投手（先発は5回以上、さもなくば最多アウト救援）。
 * これにより「同点で降板」「リード継投」等で先発に無決着が自然に出る。
 */
function assignDecisions(home, away, statFor, runLog) {
  // 登板・先発は勝敗に関わらず付与（引分試合でも計上する。early-returnの前に置く）
  for (const side of [home, away]) {
    const seen = new Set();
    for (const ap of side.log) {
      if (seen.has(ap.pid)) continue;
      seen.add(ap.pid);
      const s = statFor(ap.pid, side.teamId);
      s.pitching.g++;
      if (ap.pid === side.starterId) s.pitching.gs++;
    }
  }

  // 完投・完封（監査B4）: そのチームの投手が先発1人のみで投げ切った＝完投。無失点なら完封。
  for (const side of [home, away]) {
    if (side.log.length === 1 && side.log[0].pid === side.starterId) {
      const s = statFor(side.starterId, side.teamId);
      s.pitching.cg++;
      if (side.log[0].runs === 0) s.pitching.sho++;
    }
  }

  // クオリティスタート（§B3a）: 先発が6IP=18アウト以上を投げ、その登板の自責3以下。勝敗に依らず計上。
  for (const side of [home, away]) {
    const st = side.log.find((a) => a.pid === side.starterId);
    if (st && st.outs >= 18 && (st.er ?? st.runs) <= 3) statFor(side.starterId, side.teamId).pitching.qs++;
  }

  if (home.score === away.score) return; // 引分は勝敗・セーブなし
  const homeWins = home.score > away.score;
  const winner = homeWins ? home : away;
  const loser = homeWins ? away : home;

  // 決勝点(go-ahead run)を特定: 勝者が「同点or負け」だった最後の得点イベントの、次の得点。
  const winSc = (e) => (homeWins ? e.homeScore : e.awayScore);
  const loseSc = (e) => (homeWins ? e.awayScore : e.homeScore);
  let goIdx = 0;
  for (let i = runLog.length - 1; i >= 0; i--) {
    if (winSc(runLog[i]) <= loseSc(runLog[i])) {
      goIdx = i + 1;
      break;
    }
  }
  const go = runLog[goIdx] || runLog[runLog.length - 1];

  // 負け投手 = 決勝点を許した敗者側の当時の投手
  const lossPid = homeWins ? go.awayPid : go.homePid;
  statFor(lossPid, loser.teamId).pitching.l++;

  // 勝ち投手 = 決勝点時の勝者側の投手（先発5回未満なら最多アウト救援）
  let wPid = homeWins ? go.homePid : go.awayPid;
  if (wPid === winner.starterId) {
    const st = winner.log.find((a) => a.pid === winner.starterId);
    if (!st || st.outs < 15) {
      let mx = -1;
      for (const a of winner.log) {
        if (a.pid === winner.starterId) continue;
        if (a.outs > mx) {
          mx = a.outs;
          wPid = a.pid;
        }
      }
    }
  }
  statFor(wPid, winner.teamId).pitching.w++;

  // セーブ: 3点差以内・最後に投げたリリーフ（勝ち投手と別）。抑え固定化(B2)でクローザーに集中。
  const last = winner.log[winner.log.length - 1];
  const margin = Math.abs(home.score - away.score);
  let savePid = null;
  if (last && last.pid !== wPid && margin <= 3 && last.outs >= 1) {
    statFor(last.pid, winner.teamId).pitching.sv++;
    savePid = last.pid;
  }

  // ホールド／ブローンセーブ（監査B3）: 救援の登板時/退場時リード差から判定。
  // リード1-3(セーブ機会)で7回以降に登板した救援が、リード保持で降板し勝ちでもセーブでもない→ホールド。
  // リードを吐き出して同点/逆転を許した→ブローンセーブ（敗退側・勝利側を問わず）。
  for (const side of [home, away]) {
    for (const ap of side.log) {
      if (ap.pid === side.starterId) continue; // 先発は対象外
      if (!(ap.enterDiff >= 1 && ap.enterDiff <= 3 && ap.enterInning >= 7)) continue; // セーブ機会で登板していない
      const s = statFor(ap.pid, side.teamId);
      if (ap.exitDiff <= 0) {
        s.pitching.bs++; // リードを吐き出した
      } else if (ap.pid !== wPid && ap.pid !== savePid && ap.outs >= 1) {
        s.pitching.hld++; // リード保持で降板
      }
    }
  }
}


// ===== src/sim/usage.mjs =====
// ============================================================================
// 日次スタメンAI・疲労管理（フェーズA S3 / §S3-2 / 設計原則「起用はポリシー経由」）
//
// season.mjs から試合ごとに呼ばれる純関数群＋チームごとの起用状態（UsageState）:
//   selectStarter    → 中5日以上のローテ先発を選ぶ（投手可用性）
//   bullpenAvailable → 連投制限（3連投禁止）・前日30球以上をフィルタした救援可用リスト
//   selectLineup     → 休養（捕手は厚め・連続出場で確率↑）、相手先発の利き手プラトーン、
//                      観測ベースの担当（regular/challenger の先発シェア）で当日スタメンを組む
//   recordGameUsage  → 出場・登板履歴を更新し、25試合ごとに reviewAssignments を回す
//   reviewAssignments→ 観測成績ベースの見直し: 不振レギュラーの先発頻度が下がり、
//                      好調の控えが「シェア」を上げて徐々に昇格する（急な全交代はしない。
//                      これが「WAR -6 が出ない」仕組みの本体・§S3-2）
//
// 三層構造の原則: シーズン中の見直しは trueAbility を直接見ない。
//   評価 = 観測wOBA（PAで信頼度加重・少PAはリーグ平均へ回帰）
//        ＋ スカウト評価（真値 + scoutSeed 由来の決定論ノイズ。状態作成時に一度だけ固める）
// 初期の担当（regular）とポジション候補（positionRank）だけは編成時評価（S1）を引き継ぐ。
// 采配（試合中の判断）は manager.mjs、ここは「試合前の起用」を担う（フェーズCの差し替えフック）。
// ============================================================================







/**
 * チームの起用状態を作る（シーズン開始時に1回）。
 * @param {{id:string}} team
 * @param {{dh:Object, noDh:Object}} charts buildDepthChart のDH有/無ペア（byId等は共通）
 */
function createUsageState(team, charts, cfg) {
  const u = cfg.tuning.usage;
  const chart = charts.dh; // byId / positionRank / rotation / bullpen は dh/noDh で共通
  // スカウト打撃評価（真値 + scoutSeed由来の決定論ノイズ。50中心rating相当）: ここで一度だけ固める
  const scoutEval = new Map();
  for (const [pid, p] of chart.byId) {
    if (p.role !== 'fielder') continue;
    const noise = makeRng(hashSeed(p.scoutSeed ?? hashSeed(pid, 'scout'), 'usageScout')).normal(0, u.scoutSd);
    scoutEval.set(pid, hitScore(p) / 4.5 - 50 + noise);
  }
  // 守備の当日メモ（編成時評価と同じ扱い＝manager.buildPregameEval と同輪。S5較正:
  // 見直し/日次起用が打撃観測のみだと「打撃並×守備最悪」の選手が降格されず
  // WAR下限を破る＝守備をwOBA換算で加味してポジション適性を守る）
  const defEval = buildPregameEval(chart.byId, cfg);
  // レンジ評価（S5較正）: 実際の守備run産出（OAA→UZR）は習熟でなく rangeRating に比例する。
  // 習熟主導の defEval だけでは「習熟高×レンジ最悪」のCF/LFが定着し UZR -20級 → WAR-3級を生むため、
  // 50中心のレンジ項を別途持つ（rangeWobaPerPt で換算）。
  const rangeEval = new Map();
  for (const [pid, p] of chart.byId) {
    if (p.role !== 'fielder') continue;
    rangeEval.set(pid, rangeRating(p, cfg));
  }
  // ポジション担当: regular=編成時のスタメン、challenger=見直しで浮上した控え（share=先発シェア）
  const assign = {};
  for (const pos of Object.keys(chart.defense)) {
    assign[pos] = { regular: chart.defense[pos], challenger: null, share: 0 };
  }
  const dhSlot = chart.lineup.find((s) => s.pos === 'DH');
  assign.DH = { regular: dhSlot ? dhSlot.playerId : null, challenger: null, share: 0 };
  return {
    teamId: team.id,
    charts,
    scoutEval,
    defEval,
    rangeEval,
    assign,
    lastSnap: null, // 直近フォーム窓の起点（前回見直し時の観測スナップショット・S5較正）
    games: 0, // 消化試合数（見直しタイマー）
    consecStarts: new Map(), // 野手 pid → 連続先発出場数（休養確率の入力）
    startsByPid: new Map(), // 野手 pid → 先発出場数（較正・検証用）
    startsAtPos: new Map(), // 野手 pid → Map(pos→先発数)（正捕手出場の較正・検証用）
    lastStartDay: new Map(), // 先発投手 pid → 前回先発day
    startDaysByPid: new Map(), // 先発投手 pid → [day,...]（登板間隔の検証用）
    pitchedByDay: new Map(), // 投手 pid → Map(day→球数)（連投制限・前日球数の判定）
    rotIdx: 0, // ローテの次の先発候補index
  };
}

/**
 * 混合評価（§S3-2）: 観測wOBA（回帰込み）を打席数で信頼度加重し、スカウト評価と混合。
 * 真値は直接見ない（観測statline＋scoutSeedノイズのみ）。
 * @param {Function} getBat pid → 観測battingライン（読み取り専用）
 */
function blendedWoba(state, pid, getBat, cfg) {
  const u = cfg.tuning.usage;
  const b = getBat(pid);
  const obs = observedWoba(b, cfg);
  const w = b.pa / (b.pa + u.trustPA); // PAが積み上がるほど観測を信じる
  const scout = cfg.tuning.mgr.wobaPrior + (state.scoutEval.get(pid) ?? 0) * u.scoutWobaPerPt;
  return w * obs + (1 - w) * scout;
}

/** ポジション守備の wOBA換算加点（S5較正）。DHは守備なし=0。同一ポジション内の比較にのみ使う
 *  （習熟項の絶対値は50中心でないため、ポジションをまたぐ比較には持ち込まない）。
 *  習熟（ポジション適性）＋レンジ（実際のUZR産出に比例する成分・50中心）の2項構成。 */
function defWobaAt(state, pid, pos, cfg) {
  if (pos === 'DH' || !state.defEval) return 0;
  const u = cfg.tuning.usage;
  const e = state.defEval.get(pid);
  if (!e) return 0;
  const range = state.rangeEval ? (state.rangeEval.get(pid) ?? 50) : 50;
  return u.defWobaPerPt * e.def[pos] + u.rangeWobaPerPt * (range - 50);
}

// --- 直近フォーム窓（S5較正・WAR下限>-2.5の門番） --------------------------------
// 累積観測は「好スタート→長い不振」の選手の真の不調を数百打席も隠す（WAR-4級の主因）。
// 見直しは前回スナップショット以降（≈25試合）の観測ウィンドウで評価し、
// 窓の打席が windowMinPA 未満（控え・出場僅少）は従来通り累積を使う。
// （窓のノイズは blendedWoba の trustPA 回帰と share の漸進昇格が受け止める）

/** 打撃ラインの数値カウントだけを複製（スナップショット用。ネストのスプリットは対象外） */
function copyBatCounts(b) {
  const o = {};
  for (const k of Object.keys(b)) if (typeof b[k] === 'number') o[k] = b[k];
  return o;
}

/** 現在の累積 − スナップショット ＝ ウィンドウ観測ライン */
function diffBatCounts(cur, snap) {
  const o = {};
  for (const k of Object.keys(snap)) o[k] = (cur[k] ?? 0) - snap[k];
  return o;
}

/** 当日の先発投手（中 starterRestDays 日以上のローテ投手をローテ順に）。§S3-2投手可用性 */
function selectStarter(state, day, cfg) {
  const rot = state.charts.dh.rotation;
  const need = cfg.tuning.fatigue.starterRestDays;
  let fallback = rot[state.rotIdx % rot.length];
  let fallbackRest = -1;
  for (let k = 0; k < rot.length; k++) {
    const pid = rot[(state.rotIdx + k) % rot.length];
    const last = state.lastStartDay.get(pid);
    const rest = last == null ? Infinity : day - last - 1;
    if (rest >= need) return pid;
    if (rest > fallbackRest) {
      fallbackRest = rest;
      fallback = pid;
    }
  }
  return fallback; // 1日1試合×ローテ6なら理論上ここへは来ない（安全弁: 最も休めた投手）
}

/** 救援の可用リスト: 直近 maxConsecDays 日連続登板（=3連投になる）と前日30球以上を除外。§S3-2 */
function bullpenAvailable(state, day, cfg) {
  const f = cfg.tuning.fatigue;
  return state.charts.dh.bullpen.filter((pid) => {
    const m = state.pitchedByDay.get(pid);
    if (!m) return true;
    if ((m.get(day - 1) ?? 0) >= f.prevDayPitchLimit) return false; // 前日30球以上は不可
    let consec = 0;
    for (let d = 1; d <= f.maxConsecDays; d++) {
      if ((m.get(day - d) ?? 0) > 0) consec++;
      else break;
    }
    return consec < f.maxConsecDays; // 2連投まで（3連投禁止）
  });
}

/**
 * 当日スタメンを組む（§S3-2）。担当（regular/challengerシェア）→休養→プラトーン入替の順で解決。
 * 捕手はリード面の継続性を優先しプラトーン入替の対象外（休養と見直しのみ）。
 * @param {{day:number, dh:boolean, oppPitcher:?Object, rng:Object, getBat:Function}} ctx
 * @returns {{lineup:Array<{playerId:?string,pos:string}>, bench:string[], rested:string[]}}
 */
function selectLineup(state, ctx, cfg) {
  const u = cfg.tuning.usage;
  const r = cfg.tuning.rest;
  const chart = ctx.dh ? state.charts.dh : state.charts.noDh;
  const byId = chart.byId;
  const fielders = [];
  for (const [pid, p] of byId) if (p.role === 'fielder') fielders.push(pid);

  // 評価（当日メモ）: 混合評価＋相手先発とのプラトーン補正（スイッチは常に有利側=減点なし）
  // ＋守備のwOBA換算（同一ポジション内の比較のみ・S5較正: 守備破綻選手の起用を防ぐ）
  const cache = new Map();
  const baseEval = (pid) => {
    let v = cache.get(pid);
    if (v === undefined) {
      v = blendedWoba(state, pid, ctx.getBat, cfg);
      cache.set(pid, v);
    }
    return v;
  };
  const effEval = (pid, pos) =>
    baseEval(pid) -
    (ctx.oppPitcher && isSameHand(byId.get(pid), ctx.oppPitcher) ? u.platoonWobaPenalty : 0) +
    defWobaAt(state, pid, pos, cfg);

  const used = new Set(); // 今日すでにスタメンへ入れた選手
  const resting = new Set(); // 今日休養させる選手（スタメン候補から外す。代打等ベンチ待機は可）
  const excluded = (pid) => used.has(pid) || resting.has(pid);
  const today = {}; // pos → 当日スタメン

  const positions = ctx.dh ? [...POSITION_DIFFICULTY, 'DH'] : POSITION_DIFFICULTY;
  for (const pos of positions) {
    const a = state.assign[pos] ?? { regular: null, challenger: null, share: 0 };
    // 候補プール: 守備ポジは編成時 positionRank 上位（守備適性の担保）、DHは全野手
    const pool = pos === 'DH' ? fielders : chart.positionRank[pos].slice(0, u.candidatesPerPos);
    const bestOf = (list) => {
      let best = null;
      let bv = -Infinity;
      for (const pid of list) {
        if (excluded(pid)) continue;
        const v = effEval(pid, pos);
        if (v > bv) {
          bv = v;
          best = pid;
        }
      }
      return best;
    };

    // (1) 担当: challenger は share の頻度で先発（観測ベース見直しの漸進昇格）
    let pid = a.regular != null && !excluded(a.regular) ? a.regular : null;
    if (a.challenger && !excluded(a.challenger) && ctx.rng.next() < a.share) pid = a.challenger;

    // (2) 休養: 捕手は厚めに、連続出場が長いほど確率↑（正捕手100-135試合の機序）
    if (pid != null) {
      const restP =
        (pos === 'C' ? r.catcherRestProb : r.fielderRestProb) + r.streakW * (state.consecStarts.get(pid) ?? 0);
      if (ctx.rng.next() < restP) {
        resting.add(pid);
        pid = null;
      }
    }
    // (2b) 不振ベンチ（S5較正・WAR下限>-2.5の門番）: 観測ベース評価＋レンジ評価（50中心・
    // UZR産出に比例する静的成分）がベンチ水準を割る担当は、見直し(25試合)の周期を待たず
    // 日次でPA蓄積を絞る（打撃崩壊型・レンジ破綻型の双方が数百打席積むのを防ぐ）。
    // 逆に「守備の名手×貧打」はレンジ加点で先発が保たれる（現実のNPBの守備型レギュラー）。
    // 捕手は守備優先の起用が現実につき通常は対象外だが、「壊滅的」水準（catcherDisasterWoba未満＝
    // wRAA最悪級×守備破綻）に限り控えと分担させ、WAR-3級の定着を防ぐ（原則2）。
    if (pid != null) {
      const isC = pos === 'C';
      const benchEval =
        baseEval(pid) + (pos === 'DH' ? 0 : u.rangeWobaPerPt * ((state.rangeEval?.get(pid) ?? 50) - 50));
      const thr = isC ? r.catcherDisasterWoba : r.benchWoba;
      const prob = isC ? r.catcherDisasterBenchProb : r.slumpBenchProb;
      if (benchEval < thr && ctx.rng.next() < prob) {
        resting.add(pid);
        pid = null;
      }
    }

    // (3) 空席の充填: 候補プールの実効評価最良（全滅なら positionRank/全野手から最初の未使用）
    if (pid == null) {
      pid = bestOf(pool) ?? (pos === 'DH' ? fielders : chart.positionRank[pos]).find((x) => !excluded(x));
    } else if (pos !== 'C' && ctx.oppPitcher && isSameHand(byId.get(pid), ctx.oppPitcher)) {
      // (4) プラトーン: 同利きの担当に対し、実効評価（守備込み）で上回る候補がいれば当日限りの入替
      const alt = bestOf(pool.filter((x) => x !== pid));
      if (alt != null && effEval(alt, pos) - effEval(pid, pos) > u.platoonMargin) pid = alt;
    }
    used.add(pid);
    today[pos] = pid;
  }

  // 打順スロットへ反映（交代者は同じ打順スロットを引き継ぐ）。9番'P'は initSide が当日先発を充填。
  const lineup = chart.lineup.map((s) => ({ playerId: s.pos === 'P' ? null : today[s.pos], pos: s.pos }));
  const inLineup = new Set(lineup.map((s) => s.playerId));
  const bench = fielders.filter((pid) => !inLineup.has(pid)); // 休養者も代打要員としてベンチに残る
  return { lineup, bench, rested: [...resting] };
}

/**
 * 試合後の起用履歴の更新。ローテ進行・投手の日次球数（S2投手使用ログの接続）・
 * 野手の連続出場/先発数を記録し、reviewInterval 試合ごとに見直しを回す。
 */
function recordGameUsage(state, { day, starterPid, lineup, pitcherLog }, getBat, cfg) {
  // 先発ローテの進行と登板日の記録
  const rot = state.charts.dh.rotation;
  const ri = rot.indexOf(starterPid);
  if (ri >= 0) state.rotIdx = (ri + 1) % rot.length;
  state.lastStartDay.set(starterPid, day);
  let sd = state.startDaysByPid.get(starterPid);
  if (!sd) {
    sd = [];
    state.startDaysByPid.set(starterPid, sd);
  }
  sd.push(day);

  // 投手の日次球数（連投制限・前日球数の判定材料）
  for (const ap of pitcherLog) {
    let m = state.pitchedByDay.get(ap.pid);
    if (!m) {
      m = new Map();
      state.pitchedByDay.set(ap.pid, m);
    }
    m.set(day, (m.get(day) ?? 0) + ap.pitches);
  }

  // 野手の連続出場・先発数（先発した野手は+1、しなかった野手は0へリセット）
  const started = new Set();
  for (const s of lineup) {
    if (s.pos === 'P' || !s.playerId) continue;
    started.add(s.playerId);
    state.startsByPid.set(s.playerId, (state.startsByPid.get(s.playerId) ?? 0) + 1);
    let mp = state.startsAtPos.get(s.playerId);
    if (!mp) {
      mp = new Map();
      state.startsAtPos.set(s.playerId, mp);
    }
    mp.set(s.pos, (mp.get(s.pos) ?? 0) + 1);
  }
  for (const [pid, p] of state.charts.dh.byId) {
    if (p.role !== 'fielder') continue;
    state.consecStarts.set(pid, started.has(pid) ? (state.consecStarts.get(pid) ?? 0) + 1 : 0);
  }

  // 観測成績ベースの見直し（25試合ごと・§S3-2）
  state.games++;
  if (state.games % cfg.tuning.usage.reviewInterval === 0) reviewAssignments(state, getBat, cfg);
}

/**
 * 観測成績ベースの担当見直し（§S3-2）。ポジションごとに混合評価で候補を再ランクし、
 * swapMargin を超えて上回る候補を challenger としてシェアを漸増（share≥1で完全昇格）。
 * 差が縮めばシェアは減衰する（一時の好不調で振り回されない）。真値は見ない。
 */
function reviewAssignments(state, getBat, cfg) {
  const u = cfg.tuning.usage;
  const chart = state.charts.dh;
  const fielders = [];
  for (const [pid, p] of chart.byId) if (p.role === 'fielder') fielders.push(pid);
  // 直近フォーム窓: 前回見直し以降の観測で評価（窓PAが少なければ累積へフォールバック）
  const getBatWin = (pid) => {
    const cur = getBat(pid);
    const snap = state.lastSnap ? state.lastSnap.get(pid) : null;
    if (!snap) return cur;
    const win = diffBatCounts(cur, snap);
    return win.pa >= u.windowMinPA ? win : cur;
  };
  const bat = new Map(fielders.map((pid) => [pid, blendedWoba(state, pid, getBatWin, cfg)]));

  const used = new Set();
  for (const pos of [...POSITION_DIFFICULTY, 'DH']) {
    const a = state.assign[pos];
    if (!a) continue;
    // 評価 = 混合打撃評価 + ポジション守備のwOBA換算（同一ポジション内の比較・S5較正）
    const ev = new Map(fielders.map((pid) => [pid, bat.get(pid) + defWobaAt(state, pid, pos, cfg)]));
    const pool = (pos === 'DH' ? fielders : chart.positionRank[pos].slice(0, u.candidatesPerPos)).filter(
      (pid) => !used.has(pid),
    );
    if (!pool.length) continue;
    // レギュラーが他ポジションの担当に取られた（or不在）なら評価最良を新担当に
    if (a.regular == null || used.has(a.regular)) {
      a.regular = pool.reduce((b, pid) => (ev.get(pid) > ev.get(b) ? pid : b));
      a.challenger = null;
      a.share = 0;
      used.add(a.regular);
      continue;
    }
    let top = a.regular;
    for (const pid of pool) if (ev.get(pid) > ev.get(top)) top = pid;
    // 入替マージン: 捕手のみ厚め（リード面の継続性＝正捕手の出場を100-135試合へ保つ・S5較正）
    const margin = pos === 'C' ? u.catcherSwapMargin : u.swapMargin;
    if (top === a.regular || ev.get(top) - ev.get(a.regular) <= margin) {
      // 現状維持: 挑戦者のシェアは減衰（差が消えたら挑戦解消）
      a.share = Math.max(0, a.share - u.promoteStep);
      if (a.share === 0) a.challenger = null;
    } else if (a.challenger === top) {
      a.share += u.promoteStep;
      if (a.share >= 1) {
        // 完全昇格: 不振レギュラーはベンチ（次回見直しから挑戦者になりうる）
        a.regular = top;
        a.challenger = null;
        a.share = 0;
      }
    } else {
      a.challenger = top; // 新挑戦者はシェア漸増から（急な全交代をしない）
      a.share = u.promoteStep;
    }
    used.add(a.regular);
  }

  // スナップショットの更新（次回見直しの直近フォーム窓の起点）
  state.lastSnap = new Map(fielders.map((pid) => [pid, copyBatCounts(getBat(pid))]));
}


// ===== src/sim/postseason.mjs =====
// ============================================================================
// ポストシーズン（フェーズA S3 / §S3-3）
//
// クライマックスシリーズ（CS）→ 日本シリーズを NPB 規則で実行する:
//   CS 1st   : リーグ2位 vs 3位。csFirstWins(2)戦先勝・全試合2位の本拠地。
//   CS Final : リーグ1位 vs CS1st勝者。1位に csFinalAdv(1)勝のアドバンテージ・
//              csFinalWins(4)勝先取・全試合1位の本拠地。
//   日本シリーズ: 両リーグ王者。japanSeriesWins(4)勝先取・2-3-2 の本拠地パターン
//              （レギュラーシーズン勝率上位が第1,2,6,7戦を主催。同率は得失点差→先着）。
// 延長は決着まで（引分なし・maxInnings:Infinity）。DH規則=ホーム球団のリーグ（§S2-2と同じ）。
// 統計はレギュラーシーズンと分離集計（専用の stats Map。混ぜない・§S3-3）。
// 起用はシリーズ内でローテを頭から回す簡易版（日次疲労の持ち越しはフェーズB以降）。
// ============================================================================





/**
 * ポストシーズン一式を実行。
 * @param {Object} input
 * @param {Array<{id:string, rows:Array}>} input.rankings リーグ別順位（rows=順位表の行・勝率降順）
 * @param {Map} input.chartsByTeam teamId → {dh,noDh} 編成表
 * @param {Map} input.teamById teamId → チーム（league/manager 参照）
 * @param {Map} input.leagueDh リーグid → DH有無
 * @param {number} input.seed ポストシーズン用シード（レギュラーシーズンから分離）
 * @returns {{csFirst:Object, csFinal:Object, japanSeries:?Object, champion:?string,
 *   playerSeasons:Array, statsById:Map}}
 */
function simulatePostseason({ rankings, chartsByTeam, teamById, leagueDh, cfg, seed, season = 2026, park = NEUTRAL_PARK }) {
  const rules = cfg.league.postseason ?? {};
  const csFirstWins = rules.csFirstWins ?? 2;
  const csFinalWins = rules.csFinalWins ?? 4;
  const csFinalAdv = rules.csFinalAdv ?? 1;
  const jsWins = rules.japanSeriesWins ?? 4;

  // ポストシーズン専用の集計器（レギュラーシーズンと混ぜない）
  const stats = new Map();
  const statFor = (pid, teamId) => {
    let s = stats.get(pid);
    if (!s) {
      s = createPlayerSeason(pid, 'postseason');
      s.teamId = teamId;
      stats.set(pid, s);
    }
    return s;
  };
  const psGames = new Map(); // teamId → ポストシーズン消化試合数（ローテを頭から回す）

  /** 1試合（延長は決着まで）。DH規則=ホーム球団リーグ。 */
  const playGame = (stage, gi, homeId, awayId) => {
    const rng = makeRng(hashSeed(seed, stage, gi));
    const dh = leagueDh.get(teamById.get(homeId).league) ?? true;
    const init = (teamId) => {
      const c = chartsByTeam.get(teamId);
      const n = psGames.get(teamId) ?? 0;
      psGames.set(teamId, n + 1);
      return {
        teamId,
        depth: dh ? c.dh : c.noDh,
        starterIdx: n, // シリーズはローテ頭から順に（中n日はシリーズ間隔で担保される簡易版）
        manager: teamById.get(teamId).manager,
        dh,
      };
    };
    const res = simulateGame(init(homeId), init(awayId), cfg, rng, statFor, park, undefined, {
      maxInnings: Infinity, // 延長は決着まで（引分なし・§S3-3）
    });
    return { home: homeId, away: awayId, homeScore: res.homeScore, awayScore: res.awayScore, innings: res.innings };
  };

  /** シリーズ（winsNeeded 勝先取。advA=チームaの初期アド、hosts=第n戦のホスト列・末尾を繰返し） */
  const playSeries = (stage, a, b, { winsNeeded, advA = 0, hosts }) => {
    const wins = { [a]: advA, [b]: 0 };
    const games = [];
    let gi = 0;
    while (wins[a] < winsNeeded && wins[b] < winsNeeded) {
      const home = hosts[Math.min(gi, hosts.length - 1)];
      const away = home === a ? b : a;
      const g = playGame(stage, gi, home, away);
      games.push(g);
      wins[g.homeScore > g.awayScore ? g.home : g.away]++;
      gi++;
    }
    const winner = wins[a] >= winsNeeded ? a : b;
    return { teams: [a, b], winsNeeded, advantage: advA > 0 ? a : null, wins, games, winner };
  };

  // --- リーグごとの CS ------------------------------------------------------
  const csFirst = {};
  const csFinal = {};
  const finalists = []; // {league, teamId}
  for (const l of rankings) {
    const ids = l.rows.map((r) => r.teamId);
    const [t1, t2, t3] = ids;
    if (!t1) continue;
    let challenger = t2 ?? null;
    if (t2 && t3) {
      csFirst[l.id] = playSeries(`csFirst:${l.id}`, t2, t3, { winsNeeded: csFirstWins, hosts: [t2] });
      challenger = csFirst[l.id].winner;
    }
    if (challenger) {
      csFinal[l.id] = playSeries(`csFinal:${l.id}`, t1, challenger, {
        winsNeeded: csFinalWins,
        advA: csFinalAdv,
        hosts: [t1],
      });
      finalists.push({ league: l.id, teamId: csFinal[l.id].winner });
    } else {
      finalists.push({ league: l.id, teamId: t1 }); // 相手不在（縮小構成の安全弁）
    }
  }

  // --- 日本シリーズ（2-3-2） -------------------------------------------------
  let japanSeries = null;
  let champion = finalists.length === 1 ? finalists[0].teamId : null;
  if (finalists.length >= 2) {
    const [fa, fb] = [finalists[0].teamId, finalists[1].teamId];
    // 本拠地アドバンテージ: NPB方式＝主催リーグを年の偶奇で交互（勝率無関係）。
    // 偶数年は leagues[0]、奇数年は leagues[1] のリーグ王者が第1,2,6,7戦を主催。
    const leagues = cfg.league.leagues ?? [];
    const hostLeague = leagues.length === 2 ? leagues[season % 2].id : finalists[0].league;
    const aFirst = finalists[0].league === hostLeague;
    const upper = aFirst ? fa : fb;
    const lower = aFirst ? fb : fa;
    const hosts = [upper, upper, lower, lower, lower, upper, upper]; // 2-3-2
    japanSeries = playSeries('japanSeries', upper, lower, { winsNeeded: jsWins, hosts });
    champion = japanSeries.winner;
  }

  return { csFirst, csFinal, japanSeries, champion, playerSeasons: [...stats.values()], statsById: stats };
}


// ===== src/sim/context.mjs =====
// ============================================================================
// 文脈指標（RE24 / WPA / LI / Clutch）— フェーズB B2（§B2 / req_1 §8.3「WARの死角」）
//
// 「打席/打球/プレーのイベントストリームを読むだけで計算できる」文脈指標を、
// シミュレーション本体（打席解決・打球生成・継投）を一切変えずに湧かせる。
//
// 2パス構造（season.mjs で結線・§B2）:
//   pass1(derive)   : シーズンを実走し、24状態(塁×アウト)の得点期待値(RE)・
//                     (イニング,表裏,点差,塁アウト)→勝率(WE)・打席状態のWE変化分散(LI) を
//                     大標本として集計する（乱数は消費しない＝結果は不変）。
//   → deriveTables  : RE行列・WE表(階層平滑化)・LI表(リーグ平均=1.0正規化) を焼き固める。
//   pass2(accumulate): 同一シード＝同一試合を再走し、各プレー確定点で
//                     ΔRE を打者(+)/投手(−)、走塁は走者へ・ΔWE(=WPA) を打者/投手へ加算。
//                     LI を打席加重(aLI)・投手(pLI)・救援登板時(gmLI) に積む。
//
// 恒等式（構造から保証）: リーグ ΣRE24 ≈ 0 / 1試合の ΣWPA = 勝者+0.5・敗者−0.5（ゼロサム）/
//                        リーグ 打席加重平均 LI = 1.0。
//
// 生の一球ログは永続化しない（§17）。派生に用いる liPairs は導出中のみ保持する一時バッファで、
// pass1 完了後は破棄する（集計カウンタと導出用の遷移対のみ・恒久保存しない）。
// ============================================================================

// 終端(試合決着)を表す afterKey のセンチネル（liPairs 用）。
const TERM_HWIN = -1; // ホーム勝ち（weHome=1）
const TERM_HLOSS = -2; // ホーム負け（weHome=0）
const TERM_TIE = -3; // 引分（weHome=0.5）

/** 状態キー = f(イニング, 表裏, 点差クリップ, 塁状態0..7, アウト0..2)。打者側視点の点差。 */
function ctxEncodeKey(innMax, diffClip, inning, isBottom, diff, base, outs) {
  const D = 2 * diffClip + 1;
  const inn = (inning < 1 ? 1 : inning > innMax ? innMax : inning) - 1;
  const d = (diff < -diffClip ? -diffClip : diff > diffClip ? diffClip : diff) + diffClip;
  return (((inn * 2 + (isBottom ? 1 : 0)) * D + d) * 8 + base) * 3 + outs;
}

/** キーから「表裏（bottom=ホーム攻撃）」を復元（LI導出でホーム視点へ変換するのに使う）。 */
function ctxKeyIsBottom(key, diffClip) {
  const D = 2 * diffClip + 1;
  return Math.floor(key / (D * 8 * 3)) % 2 === 1;
}

/** 24状態インデックス（塁 0..7 × アウト 0..2）。RE行列の添字。 */
function ctxReIndex(base, outs) {
  return outs * 8 + base;
}

/**
 * 回終了（3アウト）後の「次ハーフ先頭（無死・走者なし・攻守交代）」の状態キー。
 * 3アウト状態は WE表(アウト0..2)に無いため、勝率は次ハーフ先頭の値へ連続的に引き継ぐ
 * （そうしないと打者/投手側の WPA 配分が偏る）。次の攻撃側から見た点差 = 現守備側得点 − 現攻撃側得点。
 */
function nextHalfKey(innMax, diffClip, inning, curBottom, curBatScore, fldScore) {
  const nextBottom = !curBottom;
  const nextInning = curBottom ? inning + 1 : inning;
  return ctxEncodeKey(innMax, diffClip, nextInning, nextBottom, fldScore - curBatScore, 0, 0);
}

/**
 * このプレー確定後に試合が決着したか（simulateGame の break 条件と整合させる）。
 * @param {boolean} isBottom 攻撃側がホーム（裏）か
 * @param {number} inning
 * @param {number} batScore 攻撃側の得点（このプレー後）
 * @param {number} fldScore 守備側の得点
 * @param {number} outsAfter このプレー後のアウト数
 * @param {number} maxInnings 引分になる回数上限（ポストシーズンは Infinity）
 * @returns {{over:boolean, homeWon?:boolean, tie?:boolean}}
 */
function gameOverAfter(isBottom, inning, batScore, fldScore, outsAfter, maxInnings) {
  if (inning < 9) return { over: false };
  // サヨナラ: 裏でホーム(=攻撃側)が勝ち越し（アウト数に依らず即決着）
  if (isBottom && batScore > fldScore) return { over: true, homeWon: true };
  if (outsAfter >= 3) {
    if (!isBottom) {
      // 表終了: ホーム(=守備側)がリードなら決着（裏は行われない）
      if (fldScore > batScore) return { over: true, homeWon: true };
      return { over: false }; // ビジターリード or 同点 → 裏へ
    }
    // 裏終了: ホーム(=攻撃側)は勝ち越していれば既にサヨナラ済み。ここでは同点 or ビハインド。
    if (batScore < fldScore) return { over: true, homeWon: false }; // ビジター勝ち
    if (batScore === fldScore && inning >= maxInnings) return { over: true, tie: true };
    return { over: false }; // 同点続行
  }
  return { over: false };
}

// --- 導出コンテキスト（pass1: 集計のみ・乱数非消費） --------------------------

/**
 * pass1 用の集計コンテキストを作る（§B2）。onPlay で各プレーの状態遷移を受け、
 * RE(24状態→残り得点)・WE(状態→勝敗)・LIペア(打席の状態前後キー) を蓄える。
 */
function makeDeriveContext(cfg) {
  const c = cfg.tuning.context;
  return {
    mode: 'derive',
    innMax: c.innMax,
    diffClip: c.scoreDiffClip,
    maxInnings: 12,
    reSum: new Float64Array(24),
    reCount: new Float64Array(24),
    weWin: new Map(),
    weN: new Map(),
    liPairs: [], // flat [beforeKey, afterKey, ...]（PA のみ・一時バッファ）
    // 実行中の一時状態
    reHalfBuf: [], // flat [reIdx, runsBefore, ...]（当該ハーフ）
    inningRunsSoFar: 0,
    weGameBuf: [], // flat [key, isBottom(0/1), ...]（当該試合）
    startGame() {
      this.reHalfBuf.length = 0;
      this.inningRunsSoFar = 0;
      this.weGameBuf.length = 0;
    },
    onPlay(p) {
      deriveOnPlay(this, p);
    },
  };
}

function deriveOnPlay(gc, p) {
  const batScoreAfter = p.batScoreBefore + p.runsOnPlay;
  const go = gameOverAfter(p.battingIsHome, p.inning, batScoreAfter, p.fldScore, p.outsAfter, gc.maxInnings);
  const inningOver = p.outsAfter >= 3 || go.over;

  // RE: 「この状態から回終わりまでの得点」を回終了時に確定する
  gc.reHalfBuf.push(ctxReIndex(p.baseBefore, p.outsBefore), gc.inningRunsSoFar);
  gc.inningRunsSoFar += p.runsOnPlay;
  if (inningOver) {
    const total = gc.inningRunsSoFar;
    const buf = gc.reHalfBuf;
    for (let i = 0; i < buf.length; i += 2) {
      gc.reSum[buf[i]] += total - buf[i + 1];
      gc.reCount[buf[i]] += 1;
    }
    buf.length = 0;
    gc.inningRunsSoFar = 0;
  }

  // WE: 状態(打者側視点)を試合バッファに積み、決着時に「攻撃側が勝ったか」で確定する
  const beforeKey = ctxEncodeKey(gc.innMax, gc.diffClip, p.inning, p.battingIsHome, p.batScoreBefore - p.fldScore, p.baseBefore, p.outsBefore);
  gc.weGameBuf.push(beforeKey, p.battingIsHome ? 1 : 0);

  // LI: 打席の状態前→状態後（終端は centinel・回終了は次ハーフ先頭）を蓄え、WE表確定後に分散を取る
  if (p.kind === 'pa') {
    const afterKey = go.over
      ? go.tie
        ? TERM_TIE
        : go.homeWon
          ? TERM_HWIN
          : TERM_HLOSS
      : p.outsAfter >= 3
        ? nextHalfKey(gc.innMax, gc.diffClip, p.inning, p.battingIsHome, batScoreAfter, p.fldScore)
        : ctxEncodeKey(gc.innMax, gc.diffClip, p.inning, p.battingIsHome, batScoreAfter - p.fldScore, p.baseAfter, p.outsAfter);
    gc.liPairs.push(beforeKey, afterKey);
  }

  if (go.over) {
    const buf = gc.weGameBuf;
    for (let i = 0; i < buf.length; i += 2) {
      const key = buf[i];
      const isB = buf[i + 1] === 1;
      const battingWon = isB ? go.homeWon : !go.homeWon;
      gc.weN.set(key, (gc.weN.get(key) || 0) + 1);
      gc.weWin.set(key, (gc.weWin.get(key) || 0) + (go.tie ? 0.5 : battingWon ? 1 : 0));
    }
    buf.length = 0;
  }
}

// --- 表の焼き固め（pass1 → tables） ------------------------------------------

/**
 * pass1 の集計から RE行列・WE表(階層平滑化)・LI表(リーグ平均=1.0) を導出する（§B2）。
 * @param {ReturnType<makeDeriveContext>} gc
 * @param {Object} cfg
 * @returns {{re:Float64Array, we:Float64Array, li:Float64Array, innMax:number, diffClip:number,
 *   keyN:number, avgSwing:number, re0:number}}
 */
function deriveTables(gc, cfg) {
  const c = cfg.tuning.context;
  const innMax = gc.innMax;
  const diffClip = gc.diffClip;
  const D = 2 * diffClip + 1;
  const keyN = innMax * 2 * D * 8 * 3;

  // RE行列（24状態）
  const re = new Float64Array(24);
  for (let i = 0; i < 24; i++) re[i] = gc.reCount[i] ? gc.reSum[i] / gc.reCount[i] : 0;

  // WE表の階層平滑化: fine(状態) ← coarse(イニング/表裏/点差) ← diff周辺 ← 0.5
  const coarseN = new Float64Array(innMax * 2 * D);
  const coarseWin = new Float64Array(innMax * 2 * D);
  const diffN = new Float64Array(D);
  const diffWin = new Float64Array(D);
  for (const [key, n] of gc.weN) {
    const win = gc.weWin.get(key);
    const d = Math.floor(key / (8 * 3)) % D;
    const innB = Math.floor(key / (D * 8 * 3)); // = inn*2 + isBottom（0..innMax*2-1）
    coarseN[innB * D + d] += n;
    coarseWin[innB * D + d] += win;
    diffN[d] += n;
    diffWin[d] += win;
  }
  const diffWE = new Float64Array(D);
  for (let d = 0; d < D; d++) diffWE[d] = (diffWin[d] + c.weDiffK * 0.5) / (diffN[d] + c.weDiffK);
  const coarseWE = new Float64Array(innMax * 2 * D);
  for (let i = 0; i < coarseWE.length; i++) {
    const d = i % D;
    coarseWE[i] = (coarseWin[i] + c.weCoarseK * diffWE[d]) / (coarseN[i] + c.weCoarseK);
  }
  const we = new Float64Array(keyN);
  for (let key = 0; key < keyN; key++) {
    const n = gc.weN.get(key) || 0;
    const win = gc.weWin.get(key) || 0;
    const d = Math.floor(key / (8 * 3)) % D;
    const innB = Math.floor(key / (D * 8 * 3));
    const prior = coarseWE[innB * D + d];
    we[key] = (win + c.weSmoothK * prior) / (n + c.weSmoothK);
  }

  // LI表: 各状態の ΔWE(ホーム視点) の二乗平均平方根(=WE変化のばらつき) を、
  // 打席加重平均で 1.0 に正規化する（リーグ平均LI=1.0）。
  const liSumSq = new Float64Array(keyN);
  const liN = new Float64Array(keyN);
  const P = gc.liPairs;
  const weHomeOfKey = (key) => (ctxKeyIsBottom(key, diffClip) ? we[key] : 1 - we[key]);
  for (let i = 0; i < P.length; i += 2) {
    const b = P[i];
    const a = P[i + 1];
    const weHb = weHomeOfKey(b);
    const weHa = a === TERM_HWIN ? 1 : a === TERM_HLOSS ? 0 : a === TERM_TIE ? 0.5 : weHomeOfKey(a);
    const dw = weHa - weHb;
    liSumSq[b] += dw * dw;
    liN[b] += 1;
  }
  const swing = new Float64Array(keyN);
  let wSum = 0;
  let wN = 0;
  for (let k = 0; k < keyN; k++) {
    if (liN[k]) {
      swing[k] = Math.sqrt(liSumSq[k] / liN[k]);
      wSum += swing[k] * liN[k];
      wN += liN[k];
    }
  }
  const avgSwing = wN ? wSum / wN : 1; // 打席加重平均のスイング＝正規化基準
  const li = new Float64Array(keyN);
  for (let k = 0; k < keyN; k++) li[k] = avgSwing > 0 ? swing[k] / avgSwing : 1;

  return { re, we, li, innMax, diffClip, keyN, avgSwing, re0: re[ctxReIndex(0, 0)] };
}

// --- 加算コンテキスト（pass2: プレーごとに ΔRE/ΔWPA/LI を選手へ付与） ----------

/**
 * pass2 用の加算コンテキストを作る（§B2）。tables を参照し、各プレー確定点で
 * ΔRE を打者(+)/投手(−)・走塁は走者へ、ΔWE(=WPA) を打者/投手・救援登板時LIを積む。
 * gameHomeWpa は当該試合のホーム側WPA累計（= weHome(終端)−0.5 = 勝者±0.5 のゼロサム検査用）。
 */
function makeAccumulateContext(tables, cfg) {
  return {
    mode: 'accumulate',
    tables,
    innMax: tables.innMax,
    diffClip: tables.diffClip,
    maxInnings: 12,
    weHomePrev: 0.5, // 試合開始の中立勝率（アンカー）
    gameHomeWpa: 0,
    startGame() {
      this.weHomePrev = 0.5;
      this.gameHomeWpa = 0;
    },
    onPlay(p) {
      accumulateOnPlay(this, p);
    },
  };
}

function reGet(t, base, outs) {
  return t.re[ctxReIndex(base, outs)];
}
function weHomeOf(t, inning, isBottom, diff, base, outs) {
  return weHomeAtKey(t, ctxEncodeKey(t.innMax, t.diffClip, inning, isBottom, diff, base, outs));
}
function weHomeAtKey(t, key) {
  const wb = t.we[key]; // P(攻撃側が勝つ)
  return ctxKeyIsBottom(key, t.diffClip) ? wb : 1 - wb; // ホーム視点へ
}
function liGet(t, inning, isBottom, diff, base, outs) {
  const key = ctxEncodeKey(t.innMax, t.diffClip, inning, isBottom, diff, base, outs);
  return t.li[key];
}

function accumulateOnPlay(gc, p) {
  const t = gc.tables;
  const batScoreAfter = p.batScoreBefore + p.runsOnPlay;
  const go = gameOverAfter(p.battingIsHome, p.inning, batScoreAfter, p.fldScore, p.outsAfter, gc.maxInnings);
  const inningOver = p.outsAfter >= 3 || go.over;

  // RE24: ΔRE = RE(状態後) − RE(状態前) + このプレー得点。回終了/決着後は RE=0。
  const reB = reGet(t, p.baseBefore, p.outsBefore);
  const reA = inningOver ? 0 : reGet(t, p.baseAfter, p.outsAfter);
  const dRE = reA - reB + p.runsOnPlay;
  p.batSideStat.re24 += dRE;
  p.pitStat.re24 -= dRE;

  // WPA: ホーム視点の勝率変化を打者(攻撃側)/投手(守備側)へ。ΔWE の総和は telescoping で
  // weHome(終端)−0.5 = 勝者±0.5（ゼロサム）に一致する（weHomePrev をアンカーに逐次更新）。
  // 回終了(3アウト)後は次ハーフ先頭の勝率へ連続的に引き継ぐ（3アウト状態は表に無い）。
  const weNow = go.over
    ? go.tie
      ? 0.5
      : go.homeWon
        ? 1
        : 0
    : p.outsAfter >= 3
      ? weHomeAtKey(t, nextHalfKey(t.innMax, t.diffClip, p.inning, p.battingIsHome, batScoreAfter, p.fldScore))
      : weHomeOf(t, p.inning, p.battingIsHome, batScoreAfter - p.fldScore, p.baseAfter, p.outsAfter);
  const dHome = weNow - gc.weHomePrev;
  const batWPA = p.battingIsHome ? dHome : -dHome; // 攻撃側から見た勝率変化
  p.batSideStat.wpa += batWPA;
  p.pitStat.wpa -= batWPA;
  if (p.pitcherCur) p.pitcherCur.wpa -= batWPA; // 登板ぶんWPA（SD/MD判定用）
  gc.weHomePrev = weNow;
  gc.gameHomeWpa += dHome;

  // LI: 打席の状態前レバレッジを 打者(aLI)/投手(pLI) へ。救援は登板時(初打者)を gmLI へ。
  // WPA/LI（文脈中立）: 各打席の WPA を打席LIで割って累積（Clutch = WPA/pLI − WPA/LI の素）。
  if (p.kind === 'pa') {
    const li = liGet(t, p.inning, p.battingIsHome, p.batScoreBefore - p.fldScore, p.baseBefore, p.outsBefore);
    p.batSideStat.liSum += li;
    p.pitStat.liSum += li;
    if (li > 0) {
      p.batSideStat.wpaLiSum += batWPA / li;
      p.pitStat.wpaLiSum += -batWPA / li;
    }
    if (p.firstBatterOfApp) {
      p.pitStat.gmLiSum += li;
      p.pitStat.gmLiN += 1;
    }
  }
}


// ===== src/sim/season.mjs =====
// ============================================================================
// 日程生成・シーズン実行・順位表（1-4a/f → フェーズA S3 で日程v2・日次起用AI・PSを導入）
//
// 日程v2（§S3-1）: リーグ内5相手×25（ホーム13/12交互）=125 ＋ 交流戦6相手×3=18 → 143試合。
//   「節」（day）単位に直列化: 各チーム1日1試合・連続 maxTeamConsecDays 日で休日を挟む。
//   試合のDH有無 = ホーム球団の所属リーグ規則（§S2-2）。
// 日次スタメンAI（§S3-2・usage.mjs）: 先発は中5日以上、救援は3連投禁止/前日30球で不可、
//   捕手厚めの休養・プラトーン・25試合ごとの観測ベース見直しで当日スタメンを組む。
// 各試合は階層シードで独立に実行（§17/§19）。起用状態（疲労・見直し）は day 順に逐次更新
// されるため、日程は day 昇順で回す。
// ポストシーズン（§S3-3・postseason.mjs）: CS→日本シリーズ。統計はレギュラーと分離集計。
// ============================================================================









/**
 * 日程v2を生成し「節」（day）単位に直列化する（§S3-1）。
 * 2リーグ×同数構成: リーグ内 各相手 inLeagueGamesPerOpp 試合（ホームは13/12を交互）＋
 * 交流戦 各相手 interLeagueGamesPerOpp 試合（3連戦を一方の本拠地で・ホスト交互）。
 * それ以外の構成は旧・総当たり近似にフォールバック（day直列化は同様に適用）。
 * @param {Array} teams league.teams（t.league でリーグ判定）
 * @param {Object} rng 決定論rng（シャッフル用）
 * @param {Object} cfg createConfig() の設定
 * @returns {Array<{home:string, away:string, day:number}>} day 昇順
 */
function buildSchedule(teams, rng, cfg) {
  const byLeague = new Map();
  for (const t of teams) {
    const key = t.league ?? '';
    if (!byLeague.has(key)) byLeague.set(key, []);
    byLeague.get(key).push(t.id);
  }
  const groups = [...byLeague.values()];
  const canV2 = groups.length === 2 && groups[0].length === groups[1].length && groups[0].length >= 2;

  const flat = [];
  if (canV2) {
    const nIn = cfg.league.inLeagueGamesPerOpp ?? 25;
    const nInter = cfg.league.interLeagueGamesPerOpp ?? 3;
    // リーグ内: 各ペア nIn 試合。「追加ホーム」（13試合目）は (i+j) 偶奇で振り分け＝
    // 各チームの追加ホスト数が2or3に均され、リーグ内ホームは62or63試合になる。
    for (const g of groups) {
      for (let i = 0; i < g.length; i++) {
        for (let j = i + 1; j < g.length; j++) {
          const extraToI = (i + j) % 2 === 0;
          for (let k = 0; k < nIn; k++) {
            const iHosts = (k % 2 === 0) === extraToI;
            flat.push(iHosts ? { home: g[i], away: g[j] } : { home: g[j], away: g[i] });
          }
        }
      }
    }
    // 交流戦: 各ペア nInter 試合を一方の本拠地で（(a+b) 偶奇でホスト交互＝各チーム3カード主催・
    // 交流戦ホームは9試合。総ホームは71or72試合でほぼ均衡）。
    const [A, B] = groups;
    for (let a = 0; a < A.length; a++) {
      for (let b = 0; b < B.length; b++) {
        const hostA = (a + b) % 2 === 0;
        for (let k = 0; k < nInter; k++) {
          flat.push(hostA ? { home: A[a], away: B[b] } : { home: B[b], away: A[a] });
        }
      }
    }
  } else {
    // フォールバック: 総当たり近似（対戦相手ごとの試合数 = round(G/(n-1))・ホストはペア内交互）
    const ids = teams.map((t) => t.id);
    const n = ids.length;
    const perPair = Math.round((cfg.league.gamesPerSeason ?? 143) / (n - 1));
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const startHome = (i + j) % 2;
        for (let k = 0; k < perPair; k++) {
          const iHosts = k % 2 === startHome;
          flat.push(iHosts ? { home: ids[i], away: ids[j] } : { home: ids[j], away: ids[i] });
        }
      }
    }
  }

  // シャッフル（同一カードの偏り解消）→ 節カレンダーへ直列化
  for (let i = flat.length - 1; i > 0; i--) {
    const j = rng.int(i + 1);
    const t = flat[i];
    flat[i] = flat[j];
    flat[j] = t;
  }
  return serializeDays(flat, teams, cfg.tuning?.schedule?.maxTeamConsecDays ?? 6);
}

/**
 * フラットな試合リストを day 単位へ直列化（§S3-1）。各チーム1日1試合。
 * 連続 maxConsec 日出場したチームは翌日を休日にする（連投制限・中6日の時間基盤）。
 */
function serializeDays(flat, teams, maxConsec) {
  const remaining = flat.slice();
  const consec = new Map(teams.map((t) => [t.id, 0]));
  const out = [];
  let day = 0;
  while (remaining.length) {
    const busy = new Set(); // 今日もう試合が入った（or 休日の）チーム
    for (const [tid, c] of consec) if (c >= maxConsec) busy.add(tid);
    const played = new Set();
    for (let i = 0; i < remaining.length; ) {
      const g = remaining[i];
      if (busy.has(g.home) || busy.has(g.away)) {
        i++;
        continue;
      }
      busy.add(g.home);
      busy.add(g.away);
      played.add(g.home);
      played.add(g.away);
      out.push({ home: g.home, away: g.away, day });
      remaining.splice(i, 1);
    }
    for (const t of teams) consec.set(t.id, played.has(t.id) ? consec.get(t.id) + 1 : 0);
    day++; // 誰も組めない日は全休日（consecがリセットされ翌日は必ず進む）
  }
  return out;
}

/**
 * 1シーズンを実行。
 * @param {{teams:Array,players:Array,masterSeed:number}} league
 * @param {Object} cfg
 * @param {{season?:number, seed?:number, park?:Object, postseason?:boolean, context?:boolean}} opts
 *   context=true で文脈指標（RE24/WPA/LI・§B2）を2パスで算出する。pass1でRE行列/WE表/LI表を
 *   大標本導出→焼き固め、pass2（同一シード＝同一試合の再走）で ΔRE/ΔWPA/LI を選手へ加算する。
 *   context無効時は単一パス＝従来と完全同一（乱数消費も不変・較正30指標が不変）。
 * @returns {{season:number, standings:Array, standingsByLeague:Object, playerSeasons:Array,
 *   statsById:Map, depthByTeam:Map, runSplit:Object, usageByTeam:Map, postseason:?Object,
 *   contextTables?:Object, contextCheck?:Object}}
 */
function simulateSeason(league, cfg, opts = {}) {
  const season = opts.season ?? 2026;
  const seed = opts.seed ?? league.masterSeed ?? 20260701;
  const park = opts.park ?? NEUTRAL_PARK;

  // 編成表（試合のDH有無=ホーム球団の所属リーグ規則。各チームDH用/DH無し用の両方を用意）
  const leagueDh = new Map((cfg.league.leagues ?? []).map((l) => [l.id, l.dh]));
  const teamById = new Map(league.teams.map((t) => [t.id, t]));
  const chartsByTeam = new Map();
  for (const t of league.teams) {
    const roster = league.players.filter((p) => p.teamId === t.id);
    chartsByTeam.set(t.id, {
      dh: buildDepthChart(roster, cfg, { dh: true }),
      noDh: buildDepthChart(roster, cfg, { dh: false }),
    });
  }
  // 後方互換の depthByTeam: 各チームの所属リーグ規則での編成（リーグ未設定はDH有）
  const depthByTeam = new Map(
    league.teams.map((t) => {
      const c = chartsByTeam.get(t.id);
      return [t.id, (leagueDh.get(t.league) ?? true) ? c.dh : c.noDh];
    }),
  );

  // 観測成績の読み取り専用ビューを持つ集計器を作る（S3 usage: 未出場は空ライン＝priorへ回帰）。
  // 各パスは独立の集計器で走る（三層構造・pass1導出用の集計は破棄する）。
  const makeStats = () => {
    const stats = new Map();
    const emptyBat = createBattingLine();
    const statFor = (pid, teamId) => {
      let s = stats.get(pid);
      if (!s) {
        s = createPlayerSeason(pid, season);
        s.teamId = teamId;
        stats.set(pid, s);
      }
      return s;
    };
    const getBat = (pid) => {
      const s = stats.get(pid);
      return s ? s.batting : emptyBat;
    };
    return { stats, statFor, getBat };
  };

  const standings = new Map();
  for (const t of league.teams) {
    // il = 交流戦成績（S4 UI「2リーグ順位表＋交流戦成績」の素材。所属リーグが異なる対戦のみ勘定）
    standings.set(t.id, { ...createTeamSeason(t.id, season), name: t.name, league: t.league, il: { w: 0, l: 0, t: 0 } });
  }

  // スプレー収集（§16, §17: 生イベントは最新シーズンのみ保持）。opts.collectSpray で有効化。
  const spray = opts.collectSpray ? new Map() : null;
  const capPerBatter = opts.sprayCap ?? 600;
  const onBattedBall = spray
    ? (batterId, teamId, bb, result) => {
        let arr = spray.get(batterId);
        if (!arr) {
          arr = [];
          spray.set(batterId, arr);
        }
        if (arr.length < capPerBatter) {
          arr.push({ sprayDeg: bb.sprayDeg, distanceM: bb.distanceM, laDeg: bb.laDeg, evKmh: bb.evKmh, result });
        }
      }
    : undefined;

  // 日程v2（day昇順）。日程は一度だけ生成し、各パスで同一に消化する（同一試合＝決定論）。
  const schedule = buildSchedule(league.teams, makeRng(hashSeed(seed, 'schedule')), cfg);
  // 試合のDH規則別 得点集計（セパ得点差はDH規則単位で見る: 所属リーグ単位は球団戦力ノイズが乗る）
  const runSplit = { dh: { games: 0, runs: 0 }, noDh: { games: 0, runs: 0 } };

  /**
   * 日程を1パス消化する。集計器・順位/得点集計・文脈フックを注入する。
   * pass ごとに起用状態(usage)を新規生成＝同一シードなら選手成績も同一に進む（決定論）。
   * @param {{statFor:Function, getBat:Function, standings?:Map, runSplit?:Object,
   *   onBattedBall?:Function, gameContext?:Object, contextCheck?:Object}} pass
   * @returns {Map} usageByTeam（消化後の起用状態）
   */
  const runPass = (pass) => {
    const usageByTeam = new Map(league.teams.map((t) => [t.id, createUsageState(t, chartsByTeam.get(t.id), cfg)]));
    schedule.forEach((g, gi) => {
      const rng = makeRng(hashSeed(seed, 'game', gi));
      // 試合のDH有無 = ホーム球団の所属リーグ規則（§S2-2。両チームとも同じ規則で編成）
      const gameDh = leagueDh.get(teamById.get(g.home).league) ?? true;
      const hC = chartsByTeam.get(g.home);
      const aC = chartsByTeam.get(g.away);
      const hU = usageByTeam.get(g.home);
      const aU = usageByTeam.get(g.away);

      // 先発投手（中5日以上）を先に決める＝互いのスタメン（プラトーン）判断の入力になる
      const hSp = selectStarter(hU, g.day, cfg);
      const aSp = selectStarter(aU, g.day, cfg);

      // 当日スタメン・ベンチ・救援可用リスト（usage.mjs）。乱数は試合ごとに独立の階層シード。
      const mkInit = (teamId, chart, u, starterPid, oppStarter, sideIdx) => {
        const sel = selectLineup(
          u,
          {
            day: g.day,
            dh: gameDh,
            oppPitcher: oppStarter,
            rng: makeRng(hashSeed(seed, 'lineup', gi, sideIdx)),
            getBat: pass.getBat,
          },
          cfg,
        );
        return {
          teamId,
          depth: chart,
          starterPid,
          lineup: sel.lineup,
          bench: sel.bench,
          availableRelievers: bullpenAvailable(u, g.day, cfg),
          manager: teamById.get(teamId).manager,
          dh: gameDh,
        };
      };
      const hInit = mkInit(g.home, gameDh ? hC.dh : hC.noDh, hU, hSp, aC.dh.byId.get(aSp), 0);
      const aInit = mkInit(g.away, gameDh ? aC.dh : aC.noDh, aU, aSp, hC.dh.byId.get(hSp), 1);

      const res = simulateGame(hInit, aInit, cfg, rng, pass.statFor, park, pass.onBattedBall, {
        gameContext: pass.gameContext,
      });

      // 投手使用ログ→日次疲労、野手の連続出場・見直しタイマーを更新
      recordGameUsage(hU, { day: g.day, starterPid: hSp, lineup: hInit.lineup, pitcherLog: res.pitchers.home }, pass.getBat, cfg);
      recordGameUsage(aU, { day: g.day, starterPid: aSp, lineup: aInit.lineup, pitcherLog: res.pitchers.away }, pass.getBat, cfg);

      // WPA ゼロサム検査（§B2）: ホーム側WPA累計が 勝者±0.5/引分0 に一致するか（決着の整合）。
      if (pass.gameContext && pass.gameContext.mode === 'accumulate' && pass.contextCheck) {
        const expected = res.tie ? 0 : res.homeScore > res.awayScore ? 0.5 : -0.5;
        const err = Math.abs(pass.gameContext.gameHomeWpa - expected);
        if (err > pass.contextCheck.wpaMaxErr) pass.contextCheck.wpaMaxErr = err;
      }

      if (pass.standings) {
        const H = pass.standings.get(g.home);
        const A = pass.standings.get(g.away);
        H.g++;
        A.g++;
        H.rs += res.homeScore;
        H.ra += res.awayScore;
        A.rs += res.awayScore;
        A.ra += res.homeScore;
        if (res.tie) {
          H.t++;
          A.t++;
        } else if (res.homeScore > res.awayScore) {
          H.w++;
          A.l++;
        } else {
          A.w++;
          H.l++;
        }
        // 交流戦成績（S4 UI）: 別リーグ同士の対戦を各チームの il へ計上
        if (teamById.get(g.home).league !== teamById.get(g.away).league) {
          if (res.tie) {
            H.il.t++;
            A.il.t++;
          } else if (res.homeScore > res.awayScore) {
            H.il.w++;
            A.il.l++;
          } else {
            A.il.w++;
            H.il.l++;
          }
        }
      }
      if (pass.runSplit) {
        const split = gameDh ? pass.runSplit.dh : pass.runSplit.noDh;
        split.games++;
        split.runs += res.homeScore + res.awayScore;
      }
    });
    return usageByTeam;
  };

  // 文脈指標（§B2）の2パス導出: pass1でRE行列/WE表/LI表を大標本から焼き、pass2（同一試合の再走）で
  // 選手へ ΔRE/ΔWPA/LI を加算する。context無効時は単一パス（従来と完全同一・較正30指標が不変）。
  let contextTables = null;
  let contextCheck = null;
  if (opts.context) {
    const derive = makeStats();
    const dgc = makeDeriveContext(cfg);
    runPass({ statFor: derive.statFor, getBat: derive.getBat, gameContext: dgc }); // pass1: 導出のみ（集計は破棄）
    contextTables = deriveTables(dgc, cfg);
    contextCheck = { wpaMaxErr: 0 };
  }

  const main = makeStats();
  const usageByTeam = runPass({
    statFor: main.statFor,
    getBat: main.getBat,
    standings,
    runSplit,
    onBattedBall,
    gameContext: contextTables ? makeAccumulateContext(contextTables, cfg) : null,
    contextCheck,
  });
  const stats = main.stats;

  const table = [...standings.values()].sort((a, b) => winPct(b) - winPct(a) || b.rs - b.ra - (a.rs - a.ra));
  // リーグ別順位表（table はソート済み→フィルタで順序が保たれる）
  const standingsByLeague = {};
  for (const row of table) {
    const lid = row.league ?? 'ALL';
    (standingsByLeague[lid] = standingsByLeague[lid] || []).push(row);
  }

  // ポストシーズン（§S3-3）: 2リーグ制のときのみ。統計はレギュラーシーズンと分離集計。
  let postseason = null;
  if ((opts.postseason ?? true) && (cfg.league.leagues ?? []).length === 2) {
    postseason = simulatePostseason({
      rankings: cfg.league.leagues.map((l) => ({ id: l.id, rows: standingsByLeague[l.id] ?? [] })),
      chartsByTeam,
      teamById,
      leagueDh,
      cfg,
      seed: hashSeed(seed, 'postseason'),
      season, // 日本シリーズの主催リーグを年の偶奇で交互にするため（NPB方式）
      park,
    });
  }

  return {
    season,
    standings: table,
    standingsByLeague,
    playerSeasons: [...stats.values()],
    statsById: stats,
    depthByTeam,
    spray,
    runSplit,
    usageByTeam,
    postseason,
    contextTables, // §B2: RE行列/WE表/LI表（context有効時のみ・非null）
    contextCheck, // §B2: { wpaMaxErr } ゼロサム検査の最大誤差（context有効時のみ）
  };
}

/** 勝率（引分除く） */
function winPct(t) {
  const dec = t.w + t.l;
  return dec === 0 ? 0 : t.w / dec;
}


// ===== src/sim/metrics.mjs =====
// ============================================================================
// 選手別セイバー指標（1-7 / §5 §9）
// 生カウント(PlayerSeason)＋リーグ定数(1-6) から打撃・投手指標を算出する。
// 指標は「後付け」でなく、打席・打球のシミュレートの副産物である生カウントから湧く（付録原則1）。
// ============================================================================






const div = (a, b) => (b ? a / b : 0);

/**
 * Spd（簡易4成分・Bill James風0-10スケール・§B3b）。SB成功率×頻度・三塁打率・XBT%・守備位置速度の合成。
 * 俊足で高くなる（各成分が走力に単調）。cfg.tuning.spd の基準で0-10へ写像し平均する。
 */
function spdScore(ps, cfg) {
  const b = ps.batting;
  const br = ps.baserunning || {};
  const s = cfg.tuning.spd;
  const att = (b.sb || 0) + (b.cs || 0);
  const reach = (b.b1 || 0) + (b.bb || 0) + (b.hbp || 0);
  const sbFreq = div(att, reach); // 盗塁企図頻度
  const sbRate = att >= s.minSbAtt ? div(b.sb || 0, att) : s.neutralSbRate; // 成功率（企図僅少は中立）
  const inplay = (b.ab || 0) - (b.so || 0) - (b.hr || 0);
  const b3Rate = div(b.b3 || 0, inplay); // 三塁打率
  const xbt = div(br.advTaken || 0, br.advOpp || 0); // XBT%（追加進塁率）
  const pos = ps.fielding ? mainPosition(ps.fielding) : '';
  const posSpd = s.posSpeed[pos] ?? s.posDefault; // 守備位置の速度性
  const cSb = clamp((sbFreq / s.sbFreqRef) * 10, 0, 10) * clamp(sbRate / 0.5, 0, 1.2);
  const cB3 = clamp((b3Rate / s.b3Ref) * 10, 0, 10);
  const cXbt = clamp((xbt / s.xbtRef) * 10, 0, 10);
  return (cSb + cB3 + cXbt + posSpd) / 4;
}

/** スプリット器→スラッシュライン（AVG/OBP/SLG/OPS・§B3b）。 */
function slashOf(sl) {
  const tb = sl.b1 + 2 * sl.b2 + 3 * sl.b3 + 4 * sl.hr;
  const obp = div(sl.h + sl.bb + sl.hbp, sl.ab + sl.bb + sl.hbp + sl.sf);
  const slg = div(tb, sl.ab);
  return { pa: sl.pa, ab: sl.ab, h: sl.h, hr: sl.hr, bb: sl.bb, so: sl.so, avg: div(sl.h, sl.ab), obp, slg, ops: obp + slg };
}

/** 打撃スプリット表示（対左/対右・得点圏(RISP)・ホーム/ビジター・§B3b）。 */
function battingSplits(ps) {
  const sp = (ps.batting && ps.batting.splits) || {};
  const g = (k) => slashOf(sp[k] || createSplitLine());
  return { vsL: g('vsL'), vsR: g('vsR'), risp: g('risp'), home: g('home'), away: g('away') };
}

/** 守備成分の表示（UZR分解 RngR/ErrR/ARM/DPR/rSB/framing・§B3b）。WAR用uzrRunsとは独立の内訳表示。 */
function playerFielding(ps, cfg, lc) {
  const comp = uzrComponents(ps, cfg, lc);
  const f = ps.fielding;
  return {
    ...comp, // pos/rngR/errR/framing/arm/dpr/rSB/total
    armOpp: f.armOpp || 0,
    dpOpp: f.dpOpp || 0,
    dpTurned: f.dpTurned || 0,
    sbAllowed: f.sbAllowed || 0,
    csMade: f.csMade || 0,
  };
}

/** 打撃指標（wOBA/wRAA/wRC+ ＋ B3a: xBA/xSLG/xwOBA・Barrel%等・OPS+/wRC/SecA…） */
function playerBatting(ps, lc) {
  const b = ps.batting;
  const tb = b.b1 + 2 * b.b2 + 3 * b.b3 + 4 * b.hr;
  const avg = div(b.h, b.ab);
  const obp = div(b.h + b.bb + b.hbp, b.ab + b.bb + b.hbp + b.sf);
  const slg = div(tb, b.ab);
  const babip = div(b.h - b.hr, b.ab - b.so - b.hr + b.sf);

  const raw = rawRunValuePerPA(b, lc.linearWeights);
  const woba = lc.wobaScale ? lc.wobaScale * raw : 0;
  const wraa = (raw - (lc.lgRawPerPA || 0)) * b.pa;
  const wrcPlus =
    lc.lgRunsPerPA && b.pa ? ((wraa / b.pa + lc.lgRunsPerPA) / lc.lgRunsPerPA) * 100 : 100;

  // --- B3a: 期待値系（xBA/xSLG/xwOBA）。打球イベントの期待out率/塁打分布(rng抽選前)の累積から。 ---
