  return cohort.corpAge;
}

/**
 * ドラフトプールを生成する。各(role,primaryPos)型で「空き数＋surplus」人の prospect を
 * スカウト観測（世代年齢・真値）付きで作る。surplus が選択肢を生み、球団評価差＝宝の源になる。
 * @returns {Map<string, Array>} typeKey('role:pos') → prospect[]
 */
function generatePool(vacancies, cfg, { draftSeed, yearIndex, debutYear, era = null }) {
  const mk = cfg.tuning.market;
  const byType = new Map();
  for (const v of vacancies) {
    const tk = `${v.role}:${v.primaryPos}`;
    if (!byType.has(tk)) byType.set(tk, { role: v.role, primaryPos: v.primaryPos, count: 0 });
    byType.get(tk).count++;
  }
  const pool = new Map();
  let gi = 0;
  for (const [tk, info] of byType) {
    const n = info.count + mk.surplusPerType;
    const arr = [];
    for (let i = 0; i < n; i++) {
      const id = `D${yearIndex}n${gi++}`;
      const age = pickCohortAge(makeRng(hashSeed(draftSeed, 'cohortage', id)), mk.cohort);
      // era（時代トレンド・D3）: 世代の波・球速の経年上昇を新人生成時に反映（王朝均衡 boost は draft 後）。
      // R2: cfg を渡して applyMaturity を効かせる（新人＝年齢に応じた未成熟。旧実装は新人が
      //   いきなりリーグ平均能力を持ち、高卒18歳が即戦力レギュラーになっていた）。
      const p = generateRookie(draftSeed, id, { role: info.role, primaryPos: info.primaryPos, ageMin: age, ageMax: age, debutYear, era, cfg });
      arr.push(p);
    }
    pool.set(tk, arr);
  }
  return pool;
}

/**
 * ドラフト（ウェーバー逆順×1位競合くじ・NPB風）。空き枠(vacancies)を pool から埋める。
 *   Round1: 各球団が自評価の最高 prospect を1位指名 → 競合はくじで解決（負けは再指名）。
 *   Round2+: ウェーバー順（弱い順）に残り枠を自評価の最高で1人ずつ埋める。
 * 各球団は自分の空き枠と同型(role:pos)の prospect しか獲れない（構成恒常）。
 *
 * H2（プレイヤー参加型ドラフト）: playerTeamId を渡すと、その球団の指名だけ bestFor（AI自動）を
 * 使わず pickLog（marketInterventions の phase:'draft' エントリ・提出順）から消費する。
 * pickLog が尽きた時点（＝プレイヤーがまだ選んでいない）で **即座に一時停止**し
 * `{paused:true, awaitingDraft}` を返す（AI11球団のロジックは一切変えない）。
 * 呼び出し側（src/game/index.mjs driveOffseasonDraft）は、プールを毎回シードから再生成し、
 * ここまでに確定した pickLog を渡して本関数を最初から再実行することで「再開」する
 * （決定論・pool の保存は不要。load-replay は蓄積済みログをそのまま渡すため一切 pause しない）。
 * playerTeamId が null（既定）なら旧来どおり完全自動＝既存呼び出し元と byte 同一。
 * @returns {{rookies:Array, undrafted:Array, draftLog:Object}|{paused:true, awaitingDraft:Object}}
 */
function runDraft(vacancies, pool, profiles, order, cfg, { masterSeed, yearIndex, windowByTeam = null, playerTeamId = null, pickLog = [] }) {
  const teamVac = new Map(); // teamId → [{role,primaryPos}]（残り空き枠のキュー）
  for (const t of order) teamVac.set(t, []);
  for (const v of vacancies) {
    if (!teamVac.has(v.teamId)) teamVac.set(v.teamId, []);
    teamVac.get(v.teamId).push({ role: v.role, primaryPos: v.primaryPos });
  }
  const available = new Map(); // typeKey → prospect[]（獲得で減る）
  for (const [k, arr] of pool) available.set(k, arr.slice());
  // 全プロスペクト（獲得済みも含む・id→prospect）。H2会議室の「指名済みボード」表示用
  // （公開情報の名前/役割/守備位置/年齢のみを picksSoFar に付す＝trueAbility は含めない）。
  const allProspects = new Map();
  for (const arr of pool.values()) for (const pr of arr) allProspects.set(pr.id, pr);
  const rookies = [];
  const draftLog = { order: order.slice(), picks: [], lotteries: [] };
  const wc = cfg.tuning.market.window;
  const mk = cfg.tuning.market;
  let pickIdx = 0; // pickLog の消費カーソル（自チームの番が来るたび1つずつ進む）

  // R7（決定3）: 窓状態に応じた指名の傾き（即戦力=大社 vs 素材=高卒）。三層構造は崩さない
  //   （trueAbility 非参照・年齢は公開情報）。窓を持たない旧テスト呼び出し（windowByTeam無し）は
  //   ボーナス0＝既存挙動と bit 同一。
  const draftWindowBonus = (teamId, pr) => {
    if (!windowByTeam) return 0;
    const w = windowByTeam.get(teamId);
    if (w === 'contending' && pr.age >= mk.cohort.colAge) return wc.draftBonus;
    if (w === 'rebuilding' && pr.age <= mk.cohort.hsAge) return wc.draftBonus;
    return 0;
  };

  // 球団の「残り空き枠の型のうち、自評価が最高の available prospect」を返す（AI専用）。
  const bestFor = (teamId) => {
    const vac = teamVac.get(teamId);
    if (!vac || !vac.length) return null;
    const types = new Set(vac.map((v) => `${v.role}:${v.primaryPos}`));
    const profile = profiles.get(teamId);
    let best = null;
    let bestVal = -Infinity;
    let bestType = null;
    for (const tk of types) {
      const arr = available.get(tk) || [];
      for (const pr of arr) {
        const val = evaluateProspect(profile, pr, cfg, { masterSeed, yearIndex, teamId }) + draftWindowBonus(teamId, pr);
        if (val > bestVal || (val === bestVal && (best === null || pr.id < best.id))) {
          bestVal = val;
          best = pr;
          bestType = tk;
        }
      }
    }
    return best ? { prospect: best, typeKey: bestType } : null;
  };

  /** teamId の残り空き枠のいずれかの型に available な prospect が1人でもいるか（AI/自チーム共通の存在確認）。 */
  const hasCandidate = (teamId) => {
    const vac = teamVac.get(teamId);
    if (!vac || !vac.length) return false;
    for (const v of vac) if ((available.get(`${v.role}:${v.primaryPos}`) || []).length) return true;
    return false;
  };

  /** 自チームが指名する prospectId を、残り空き枠の型に限定して available から探す（H2・介入ログの解決）。 */
  const resolvePick = (teamId, prospectId) => {
    const vac = teamVac.get(teamId);
    if (!vac) return null;
    const types = new Set(vac.map((v) => `${v.role}:${v.primaryPos}`));
    for (const tk of types) {
      const arr = available.get(tk) || [];
      const idx = arr.findIndex((p) => p.id === prospectId);
      if (idx >= 0) return { prospect: arr[idx], typeKey: tk };
    }
    return null;
  };

  /** 中断ペイロード（H2・src/ui/draft.mjs の会議室画面が表示する現在の状態）。 */
  const buildAwaitingDraft = (round, contested) => {
    const vac = teamVac.get(playerTeamId) || [];
    const poolNow = [];
    for (const arr of available.values()) poolNow.push(...arr);
    poolNow.sort(byId);
    return {
      round,
      contested,
      teamId: playerTeamId,
      vacTypes: vac.map((v) => ({ role: v.role, primaryPos: v.primaryPos })),
      order: order.slice(),
      // 指名済みボード（公開情報のみ denormalize: 名前/役割/守備位置/年齢。trueAbility は含めない）。
      picksSoFar: draftLog.picks.map((pk) => {
        const pr = allProspects.get(pk.prospectId);
        return { ...pk, name: pr?.name ?? null, role: pr?.role ?? null, primaryPos: pr?.primaryPos ?? null, age: pr?.age ?? null };
      }),
      lotteries: draftLog.lotteries.slice(),
      pool: poolNow,
    };
  };

  const assign = (teamId, prospect, typeKey, meta) => {
    const vac = teamVac.get(teamId);
    const vi = vac.findIndex((v) => `${v.role}:${v.primaryPos}` === typeKey);
    vac.splice(vi, 1);
    const arr = available.get(typeKey);
    arr.splice(arr.findIndex((p) => p.id === prospect.id), 1);
    prospect.teamId = teamId;
    prospect.rosterStatus = 'active';
    rookies.push(prospect);
    draftLog.picks.push({ teamId, prospectId: prospect.id, ...meta });
  };

  // --- Round1: 1位指名＋競合くじ ---
  const pendingR1 = new Set(order.filter((t) => (teamVac.get(t) || []).length));
  let r1Renom = false; // 自チームが同ラウンド内で2回目以降の指名（＝前回くじ敗退）か
  while (pendingR1.size) {
    if (playerTeamId && pendingR1.has(playerTeamId) && hasCandidate(playerTeamId) && !pickLog[pickIdx]) {
      return { paused: true, awaitingDraft: buildAwaitingDraft(1, r1Renom) };
    }
    const noms = new Map(); // prospectId → {prospect, byTeam:Map<teamId,typeKey>}
    for (const teamId of order) {
      if (!pendingR1.has(teamId)) continue;
      if (teamId === playerTeamId) {
        if (!hasCandidate(teamId)) { pendingR1.delete(teamId); continue; }
        const entry = pickLog[pickIdx++];
        if (!entry || entry.round !== 1) throw new Error(`runDraft: round1の介入ログが不正（${JSON.stringify(entry)}）`);
        const picked = resolvePick(teamId, entry.prospectId);
        if (!picked) throw new Error(`runDraft: 介入ログの指名 ${entry.prospectId} が無効（round1・入手不可/型不一致）`);
        if (!noms.has(picked.prospect.id)) noms.set(picked.prospect.id, { prospect: picked.prospect, byTeam: new Map() });
        noms.get(picked.prospect.id).byTeam.set(teamId, picked.typeKey);
        continue;
      }
      const b = bestFor(teamId);
      if (!b) { pendingR1.delete(teamId); continue; }
      if (!noms.has(b.prospect.id)) noms.set(b.prospect.id, { prospect: b.prospect, byTeam: new Map() });
      noms.get(b.prospect.id).byTeam.set(teamId, b.typeKey);
    }
    if (!noms.size) break;
    for (const [pid, nom] of noms) {
      const teams = [...nom.byTeam.keys()];
      let winner;
      let contested = false;
      if (teams.length === 1) {
        winner = teams[0];
      } else {
        contested = true;
        const r = makeRng(hashSeed(masterSeed, 'lottery', yearIndex, pid));
        winner = teams[r.int(teams.length)];
        draftLog.lotteries.push({ prospectId: pid, contenders: teams.slice(), winner });
      }
      assign(winner, nom.prospect, nom.byTeam.get(winner), { round: 1, via: contested ? 'lottery' : 'nominate', contested });
      pendingR1.delete(winner);
    }
    r1Renom = playerTeamId ? pendingR1.has(playerTeamId) : false; // 敗退で残っていれば次回は再指名
  }

  // --- Round2+: ウェーバー順（弱い順）に残り枠を埋める ---
  for (let round = 2; round <= 200; round++) {
    let progress = false;
    for (const teamId of order) {
      if (!(teamVac.get(teamId) || []).length) continue;
      if (teamId === playerTeamId) {
        if (!hasCandidate(teamId)) continue;
        const entry = pickLog[pickIdx];
        if (!entry) return { paused: true, awaitingDraft: buildAwaitingDraft(round, false) };
        if (entry.round !== round) throw new Error(`runDraft: round${round}の介入ログが不正（${JSON.stringify(entry)}）`);
        pickIdx++;
        const picked = resolvePick(teamId, entry.prospectId);
        if (!picked) throw new Error(`runDraft: 介入ログの指名 ${entry.prospectId} が無効（round${round}・入手不可/型不一致）`);
        assign(teamId, picked.prospect, picked.typeKey, { round, via: 'waiver', contested: false });
        progress = true;
        continue;
      }
      const b = bestFor(teamId);
      if (!b) continue;
      assign(teamId, b.prospect, b.typeKey, { round, via: 'waiver', contested: false });
      progress = true;
    }
    if (!progress) break;
  }

  const undrafted = [];
  for (const arr of available.values()) undrafted.push(...arr);
  return { rookies, undrafted, draftLog };
}

/**
 * ドラフト漏れ（undrafted＝球団評価に過小評価された surplus）を育成枠へ配る。
 * ウェーバー順ラウンドロビンで各球団 perTeamSignsPerYear 人まで。rosterStatus='minor' で farm へ。
 */
function signDevelopment(league, cfg, undrafted, order) {
  const mk = cfg.tuning.market.farm;
  const pool = undrafted.slice().sort(byId);
  const signed = new Map(order.map((t) => [t, 0]));
  let pi = 0;
  let any = true;
  while (pi < pool.length && any) {
    any = false;
    for (const teamId of order) {
      if (pi >= pool.length) break;
      if ((signed.get(teamId) ?? 0) >= mk.perTeamSignsPerYear) continue;
      const d = pool[pi++];
      d.teamId = teamId;
      d.rosterStatus = 'minor';
      league.farm.push(d);
      signed.set(teamId, (signed.get(teamId) ?? 0) + 1);
      any = true;
    }
  }
}

/**
 * 育成の二軍実成績ボーナス（F2-3・§12.1強化）: 昇格判定の「観測」へ当年の二軍statlineを加点する。
 * 二軍で打った/抑えた育成ほど昇格しやすい（三層構造: 観測statlineのみ・真値不参照）。
 * 標本が薄いほど信頼度加重で効きが弱まる（少PA/少IPの上振れに騙されない）。obs 無し（未出場・
 * 二軍リーグ不成立の旧構成）は 0＝従来の判定と同一。
 * @param {Object} d 育成選手
 * @param {?Object} obs 当年の二軍 statline（{batting,pitching}・careerFarmStats 由来）
 */
function farmPerfBonus(d, obs, cfg, farmLc = null) {
  if (!obs) return 0;
  const f = cfg.tuning.market.farm;
  if (d.role === 'fielder') {
    const b = obs.batting;
    if (!b || !(b.pa > 0)) return 0;
    const trust = b.pa / (b.pa + f.promotePerfTrustPA);
    let v = f.promoteWobaW * (observedWoba(b, cfg) - cfg.tuning.mgr.wobaPrior) * trust;
    // ★R4: 二軍の守備(UZR)・走塁(BsR)の観測も昇格査定に入れる（旧実装は打撃だけを見ていた）。
    //   farmLc（二軍のリーグ定数）が渡された場合のみ作動（旧構成/二軍不成立では 0＝従来と同一）。
    if (farmLc && obs.fielding) {
      const inn = totalFieldInnings(obs.fielding);
      const uzr = inn > 0 ? uzrRuns(obs, cfg, farmLc) : 0;
      const bsr = playerBaserunning(obs, cfg, farmLc).bsr || 0;
      const dTrust = inn / (inn + f.promoteDefTrustInnings);
      v += f.promoteDefW * (uzr * dTrust + bsr);
    }
    return v;
  }
  const pi = obs.pitching;
  if (!pi || !(pi.outs > 0)) return 0;
  const trust = pi.outs / (pi.outs + f.promotePerfTrustOuts);
  return f.promoteRa9W * (f.promoteRa9Ref - (pi.r * 27) / pi.outs) * trust;
}

/** 育成枠の剪定: 年齢超過は解雇、球団あたり perTeamMax 超は観測下位から解雇（箱を有限に保つ）。 */
function pruneFarm(league, cfg) {
  const mk = cfg.tuning.market.farm;
  const byTeam = new Map();
  for (const d of league.farm) {
    if (d.age > mk.maxAge) continue;
    if (!byTeam.has(d.teamId)) byTeam.set(d.teamId, []);
    byTeam.get(d.teamId).push(d);
  }
  const kept = [];
  for (const arr of byTeam.values()) {
    arr.sort((a, b) => overallRating(b) - overallRating(a) || byId(a, b));
    for (const d of arr.slice(0, mk.perTeamMax)) kept.push(d);
  }
  kept.sort(byId);
  league.farm = kept;
}

/**
 * 編成市場の前半（H2・runMarket のステップ1-2＋ドラフト準備）: 「育成昇格 → プール生成」まで。
 *   1. 育成枠を加齢（発達）させる
 *   2. 昇格判定: 育成の観測成績が閾値超 かつ 自球団に同型の空き枠あり → 支配下登録（稀・§12.1）
 * ドラフト本体（runDraft）は呼ばない＝プレイヤー参加型ドラフト（H2）が指名の合間に中断できるよう、
 * ここで止めて {remainingVac, pool, order, profiles, windowByTeam} を呼び出し側へ渡す。
 * league.players には promoted を足さない（呼び出し側が rookies と合わせて一括で足す＝既存 runMarket
 * と同じタイミング）。league.farm は in-place 更新（stillFarm）。
 * @returns {{promoted:Array, promotions:Array, remainingVac:Array, pool:Map, order:Array, profiles:Map, windowByTeam:?Map}}
 */
function marketStage1(league, cfg, { vacancies, standings, masterSeed, yearIndex, debutYear, era = null, farmObs = null, teamHistory = null }) {
  const mk = cfg.tuning.market;
  if (!league.farm) league.farm = [];
  const profiles = new Map();
  for (const t of league.teams) profiles.set(t.id, teamEvalProfile(masterSeed, t.id, cfg));
  // R7（決定3）: 窓状態は teamHistory だけから毎年純関数で導出（新規の永続状態を持たない）。
  //   teamHistory 無し（旧テスト呼び出し）は null＝draftWindowBonus が常に0で既存挙動と bit 同一。
  const windowByTeam = teamHistory
    ? new Map(league.teams.map((t) => [t.id, teamWindowState(t.id, teamHistory, cfg)]))
    : null;

  // 1. 育成枠の発達（加齢）。独立シード座標＝支配下選手の加齢ストリームを一切乱さない。
  applyAging(league.farm, cfg, { seed: hashSeed(masterSeed, 'farmaging', yearIndex) });

  // 2. 昇格判定（§12.1・這い上がり／F2-3強化）。観測成績（真値+下振れバイアス+ノイズ＋
  //    **当年の二軍実成績ボーナス**）が閾値超 かつ 自球団に同型の空き枠がある育成選手を支配下登録
  //    する（枠が空くという「機会」に依存＝稀）。支配下70枠（roster.controlledPerTeam）の管理:
  //    昇格は枠の空きがある球団のみ（引退→空き枠の通常フローでは常に空くが、不変量として明示的に守る）。
  const cap = cfg.tuning.roster?.controlledPerTeam ?? Infinity;
  const controlledCount = new Map();
  for (const p of league.players) controlledCount.set(p.teamId, (controlledCount.get(p.teamId) ?? 0) + 1);
  const remainingVac = vacancies.slice();
  const promoted = [];
  const promotions = [];
  const stillFarm = [];
  // R4: 二軍のリーグ定数（当年の二軍観測から導出）。守備(UZR)・走塁(BsR)を得点換算して昇格査定に
  //   入れるために必要。farmObs が無い旧構成（二軍リーグ不成立）では null＝従来の判定と同一。
  const farmSeasons = farmObs ? [...farmObs.values()].filter((s) => s && s.fielding) : [];
  const farmLc = farmSeasons.length ? deriveLeagueConstants({ playerSeasons: farmSeasons, standings: [] }) : null;
  for (const d of league.farm.slice().sort(byId)) {
    const tk = `${d.role}:${d.primaryPos}`;
    const r = makeRng(hashSeed(masterSeed, 'promote', yearIndex, d.id));
    const observed =
      overallRating(d) + mk.farm.promoteObsBias + r.normal(0, mk.farm.promoteObsNoiseSd) +
      farmPerfBonus(d, farmObs ? farmObs.get(d.id) : null, cfg, farmLc);
    const vi = remainingVac.findIndex((v) => v.teamId === d.teamId && `${v.role}:${v.primaryPos}` === tk);
    const hasRoom = (controlledCount.get(d.teamId) ?? 0) < cap; // 支配下70枠の空き（F2-3枠管理）
    if (observed >= mk.farm.promoteThreshold && vi >= 0 && hasRoom) {
      remainingVac.splice(vi, 1);
      controlledCount.set(d.teamId, (controlledCount.get(d.teamId) ?? 0) + 1);
      d.rosterStatus = 'active';
      promoted.push(d);
      promotions.push({ playerId: d.id, teamId: d.teamId, role: d.role, primaryPos: d.primaryPos, age: d.age, observed: Math.round(observed) });
    } else {
      stillFarm.push(d);
    }
  }
  league.farm = stillFarm;

  // ドラフトプール生成（era＝世代の波/球速上昇を反映・D3・§11.3）。ドラフト本体は呼ばない。
  const pool = generatePool(remainingVac, cfg, { draftSeed: hashSeed(masterSeed, 'draft', yearIndex), yearIndex, debutYear, era });
  const order = waiverOrder(standings, league);
  return { promoted, promotions, remainingVac, pool, order, profiles, windowByTeam };
}

/**
 * 編成市場の後半（H2・runMarket のステップ4-5）: ドラフト確定後の「育成獲得 → 剪定」。
 * 王朝均衡（balanceBoost）の適用もここで行う（draft 割当後＝team 確定後でないと適用できないため）。
 * league を in-place 更新する。戻り値なし。
 */
function marketStage2(league, cfg, { undrafted, order, balanceBoost = null, rookies }) {
  // 王朝均衡（D3・§11.3）: 弱い球団に割り当たった新人へ再分配 boost を反映（戦力の平均回帰＝振り子）。
  //   pool 生成時は team 未確定ゆえ draft 割当後に適用（決定論・boost は standings 由来の純算術）。
  if (balanceBoost && balanceBoost.size) {
    for (const p of rookies) {
      const b = balanceBoost.get(p.teamId) || 0;
      if (b) applyEraToRookie(p, null, b);
    }
  }
  // 育成獲得（ドラフト漏れ＝過小評価された surplus を安く箱へ）。剪定。
  signDevelopment(league, cfg, undrafted, order);
  pruneFarm(league, cfg);
}

/**
 * 編成市場の中核（C3a）。引退枠 vacancies を「育成昇格 → ドラフト → 育成獲得」で埋める。
 *   1. 育成枠を加齢（発達）させる
 *   2. 昇格判定: 育成の観測成績が閾値超 かつ 自球団に同型の空き枠あり → 支配下登録（稀・§12.1）
 *   3. ドラフト: 残り空き枠をウェーバー逆順×くじで埋める（§15）
 *   4. 育成獲得: ドラフト漏れ（過小評価 surplus）を育成枠へ（安く獲れる箱・§12.1）
 *   5. 剪定: 育成枠を有限に保つ
 * 決定論・構成恒常（promoted+rookies == vacancies）。league.farm を in-place で更新する。
 * H2: marketStage1 + runDraft（完全自動＝playerTeamId無し）+ marketStage2 の合成（byte 同一）。
 * プレイヤー参加型ドラフト（中断/再開）が要る場合は marketStage1/runDraft/marketStage2 を
 * 個別に呼ぶこと（src/game/index.mjs driveOffseasonDraft 参照）。
 * @returns {{promoted:Array, rookies:Array, draftLog:Object, promotions:Array}}
 */
function runMarket(league, cfg, { vacancies, standings, masterSeed, yearIndex, debutYear, era = null, balanceBoost = null, farmObs = null, teamHistory = null }) {
  const s1 = marketStage1(league, cfg, { vacancies, standings, masterSeed, yearIndex, debutYear, era, farmObs, teamHistory });
  const { rookies, undrafted, draftLog } = runDraft(s1.remainingVac, s1.pool, s1.profiles, s1.order, cfg, { masterSeed, yearIndex, windowByTeam: s1.windowByTeam });
  marketStage2(league, cfg, { undrafted, order: s1.order, balanceBoost, rookies });
  return { promoted: s1.promoted, rookies, draftLog, promotions: s1.promotions };
}

// ============================================================================
// H2: プレイヤー参加型ドラフト会議 — スカウトレポート（draftScoutView）
//   真値(trueAbility)は絶対に参照しない。観測ツール(obsTool)・球団評価(evaluateProspect)・
//   公開情報(age)だけから「等級／ツール別5段階／伸びしろ／経歴タグ／世代内評判」を作る（§13三層構造）。
// ============================================================================

/** 経歴タグ（高卒/大卒/社会人）: 世代生成の年齢（公開情報・cohort と同じ年齢）から判定。 */
function cohortTag(age, cohort) {
  if (age <= cohort.hsAge) return '高卒';
  if (age <= cohort.colAge) return '大卒';
  return '社会人';
}

/** 分位点(0-1・大きいほど上位)→S/A/B/C/D。 */
function gradeFromPercentile(p, breaks) {
  if (p >= breaks.S) return 'S';
  if (p >= breaks.A) return 'A';
  if (p >= breaks.B) return 'B';
  if (p >= breaks.C) return 'C';
  return 'D';
}

/** 観測値(20-80相当)→1-5段階（breaksは昇順の3境界＝4段階の境目で計5段階）。 */
function toolLevel(v, breaks) {
  let lvl = 1;
  for (const b of breaks) if (v >= b) lvl++;
  return lvl;
}

/** vals内での x の分位点（0-1・x以下の割合＝大きいほど上位）。vals空なら1（安全側=最上位扱いしない用途では呼ばない）。 */
function percentileOf(x, vals) {
  if (!vals.length) return 1;
  let le = 0;
  for (const v of vals) if (v <= x) le++;
  return le / vals.length;
}

/** 全球団平均のプロスペクト評価（世代内評判の素・§13）。球団ごとの評価プロファイル＋観測ノイズ込み。 */
function consensusEval(state, prospect) {
  const cfg = state.cfg;
  const ctx0 = { masterSeed: state.masterSeed, yearIndex: state.yearIndex };
  let s = 0;
  for (const t of state.league.teams) {
    const prof = teamEvalProfile(state.masterSeed, t.id, cfg);
    s += evaluateProspect(prof, prospect, cfg, { ...ctx0, teamId: t.id });
  }
  return s / state.league.teams.length;
}

/**
 * H2: スカウトレポート。自球団 profile での evaluateProspect（ノイズ込み）をプールの分位点で
 * 相対化し、真値非参照の等級・ツール別評価・伸びしろ・経歴タグ・世代内評判にまとめる。
 * @param {Object} state GameState（cfg/masterSeed/yearIndex/playerTeamId/league.teams を使う）
 * @param {Object} prospect スカウト対象（ドラフトプールの1人）
 * @param {Array} [pool] 比較母集団（省略時は state.awaitingDraft.pool。それも無ければ prospect 単体）
 * @returns {{grade:string, tools:Object, upside:string, cohort:string, hype:?string, myPercentile:number, consensusPercentile:number}}
 */
function draftScoutView(state, prospect, pool = null) {
  const cfg = state.cfg;
  const sr = cfg.tuning.market.scoutReport;
  const myProfile = teamEvalProfile(state.masterSeed, state.playerTeamId, cfg);
  const ctx = { masterSeed: state.masterSeed, yearIndex: state.yearIndex, teamId: state.playerTeamId };
  const comparisonPool = pool ?? (state.awaitingDraft && state.awaitingDraft.pool && state.awaitingDraft.pool.length ? state.awaitingDraft.pool : [prospect]);

  const myVal = evaluateProspect(myProfile, prospect, cfg, ctx);
  const poolVals = comparisonPool.map((p) => evaluateProspect(myProfile, p, cfg, ctx));
  const myPct = percentileOf(myVal, poolVals);
  const grade = gradeFromPercentile(myPct, sr.gradeBreaks);

  // ツール別5段階（evaluateProspect と同じハッシュ座標 'velo'/'control'/... で obsTool を引く＝一貫性）。
  const t = prospect.trueAbility;
  const id = prospect.id;
  let tools;
  if (prospect.role === 'pitcher') {
    const veloR = clamp(50 + (t.pitching.velocityKmh - 145) * 2, 20, 80);
    tools = {
      velo: toolLevel(obsTool(veloR, myProfile, ctx, 'velo', id), sr.toolBreaks),
      control: toolLevel(obsTool(t.pitching.control, myProfile, ctx, 'control', id), sr.toolBreaks),
      stamina: toolLevel(obsTool(t.pitching.stamina, myProfile, ctx, 'stamina', id), sr.toolBreaks),
      stuff: toolLevel(obsTool(pitchStuff(t), myProfile, ctx, 'stuff', id), sr.toolBreaks),
    };
  } else {
    tools = {
      contact: toolLevel(obsTool(t.batting.contact, myProfile, ctx, 'contact', id), sr.toolBreaks),
      power: toolLevel(obsTool(t.common.power, myProfile, ctx, 'power', id), sr.toolBreaks),
      speed: toolLevel(obsTool(t.common.speed, myProfile, ctx, 'speed', id), sr.toolBreaks),
      defense: toolLevel(obsTool(t.fielding.positionProf[prospect.primaryPos] ?? 20, myProfile, ctx, 'prof', id), sr.toolBreaks),
      arm: toolLevel(obsTool(t.common.arm, myProfile, ctx, 'arm', id), sr.toolBreaks),
    };
  }

  // 伸びしろ: 公開年齢と「典型的なピーク年齢」（config定数。個体の真の career.peakAge は不参照）の
  //   差＋スカウトノイズで3段階（大器/並/完成品）。実在のスカウティングと同じ「若さ＝伸びしろ」の代理。
  const gapRng = makeRng(hashSeed(state.masterSeed, 'scoutupside', state.yearIndex, state.playerTeamId, id));
  const gap = (sr.referencePeakAge - prospect.age) + gapRng.normal(0, sr.upsideNoiseSd);
  const upside = gap >= sr.upsideBigThreshold ? '大器' : gap <= sr.upsideDoneThreshold ? '完成品' : '並';

  // 経歴タグ（公開の年齢のみから判定）。
  const cohort = cohortTag(prospect.age, cfg.tuning.market.cohort);

  // 世代内評判: 全球団平均評価（consensus）のプール内分位点。目玉＝consensus上位。
  //   隠し玉＝自球団評価の分位がconsensus分位を大きく上回る（他球団が見落としている＝市場の非効率が発現）。
  const consensusVals = comparisonPool.map((p) => consensusEval(state, p));
  const myConsensusPct = percentileOf(consensusEval(state, prospect), consensusVals);
  let hype = null;
  if (myConsensusPct >= sr.hypeTopPct) hype = '目玉';
  else if (myPct - myConsensusPct >= sr.hiddenGemGapPct) hype = '隠し玉';

  return { grade, tools, upside, cohort, hype, myPercentile: myPct, consensusPercentile: myConsensusPct };
}

/**
 * H2: ドラフト前ニュース「今年の目玉」（世代トップ数名を報道）。全球団平均評価(consensus)の
 * 降順で上位 previewCount 人を返す（真値非参照＝draftScoutView と同じ evaluateProspect ベース）。
 * state.awaitingDraft.pool が無ければ空配列（ドラフト会議室が開いていない）。
 * @returns {Array<{prospectId, role, primaryPos, age, cohort}>}
 */
function draftPreviewHeadlines(state) {
  const aw = state.awaitingDraft;
  if (!aw || !aw.pool || !aw.pool.length) return [];
  const cfg = state.cfg;
  const sr = cfg.tuning.market.scoutReport;
  const ranked = aw.pool
    .map((p) => ({ p, consensus: consensusEval(state, p) }))
    .sort((a, b) => b.consensus - a.consensus || (a.p.id < b.p.id ? -1 : 1));
  return ranked.slice(0, sr.previewCount).map(({ p }) => ({
    prospectId: p.id, role: p.role, primaryPos: p.primaryPos, age: p.age,
    cohort: cohortTag(p.age, cfg.tuning.market.cohort),
  }));
}


// ===== src/game/transactions.mjs =====
// ============================================================================
// フェーズC3b: 選手市場のトランザクション — FA・トレード・戦力外/拾い上げ（§15 / §12.2）。
//
//   runFA(league, cfg, ctx)            … 国内FA（宣言→球団AI入札→移籍＋人的補償）
//   runTrades(league, cfg, ctx)        … トレード（AI同士＝評価差で双方win成立／プレイヤー起案）
//   runReleaseAndPickup(league,cfg,ctx)… 戦力外→拾い上げ（少なく歪んだ観測で切られ、査定の違う球団が拾う）
//   runContractRenewal(league,cfg,ctx) … 契約更改（年俸=観測連動・34歳以降の長期はリスク＝フレーバー）
//   observedValueOf(p, obs, cfg)       … 当該シーズンの "実観測" 貢献量（放出判定の入力・出場機会依存）
//
// 設計原則（phaseC_spec・厳守）:
//   - エンジンを壊さない: すべてオフシーズン遷移（2年目以降）でのみ呼ばれる。1年目レギュラー
//     シーズン（既存50較正）には一切効かない（generateLeague/シム/1年目季は不変）。
//   - 決定論: 乱数は階層シード rng のみ（Date.now/Math.random 非使用）。処理順は id/teamId 昇順・
//     ウェーバー順で固定。プレイヤー操作（入札/トレード起案）は marketInterventions ログとして
//     save に含まれ、load の replay で同一結果に再現される。
//   - 三層構造: 入札・受諾・拾い上げの査定は evaluateProspect（観測ツール＋スカウトノイズ×球団の癖）。
//     放出（戦力外）判定だけは "実際の観測成績"（当該シーズンの生 statline）で下す＝出場機会に
//     依存して歪む（少PA→ショボく見える＝上林型／不振→板山型）。査定を違える他球団が拾って生き返る。
//   - 構成恒常: 全移動は同(role,primaryPos)の 1:1 スワップ／循環。球団あたりの役割・守備位置
//     構成が厳密に不変＝人口/構成恒常（引退→ドラフトの補充系と直交）。
// ============================================================================




/** id 昇順の安定比較（決定論・順序非依存の走査に使う）。 */
function byId(a, b) {
  return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
}

/** teamId 昇順のチームid列（決定論の走査順）。 */
function teamIds(league) {
  return league.teams.map((t) => t.id).sort();
}

/** 支配下（active）選手を球団ごとに束ねる（育成 minor は市場対象外）。 */
function activeByTeam(league) {
  const m = new Map();
  for (const t of league.teams) m.set(t.id, []);
  for (const p of league.players) {
    if (p.rosterStatus !== 'active') continue;
    if (!m.has(p.teamId)) m.set(p.teamId, []);
    m.get(p.teamId).push(p);
  }
  for (const arr of m.values()) arr.sort(byId);
  return m;
}

/** ロスターの (role,primaryPos) 型キー。 */
function typeKey(p) {
  return `${p.role}:${p.primaryPos}`;
}

/** 球団 profile による査定（ctx=スカウトノイズ座標）。evaluateProspect の薄いラッパ。 */
function assess(profiles, teamId, p, cfg, masterSeed, yearIndex) {
  return evaluateProspect(profiles.get(teamId), p, cfg, { masterSeed, yearIndex, teamId });
}

/**
 * 球団のプロテクトリスト（自評価の上位 count 人の id 集合）。非プロテクト＝残り。
 * 人的補償・トレード放出・戦力外の「出せる／狙える」母集団を非プロテクトに絞る（§12.2）。
 */
function protectSet(teamId, roster, profiles, cfg, count, masterSeed, yearIndex) {
  const ranked = roster
    .slice()
    .sort(
      (a, b) =>
        assess(profiles, teamId, b, cfg, masterSeed, yearIndex) -
          assess(profiles, teamId, a, cfg, masterSeed, yearIndex) || byId(a, b),
    );
  return new Set(ranked.slice(0, count).map((p) => p.id));
}

/**
 * 当該シーズンの "実観測" 貢献量（trueAbility を一切見ない・出場機会に依存して歪む）。
 *   野手 =（観測wOBA − 代替wOBA）× PA
 *   投手 =（代替FIP − 観測FIP）× IP/9（run単位）
 * 拾い上げ後の "観測改善"（PAが増えて貢献が表に出る＝余所では生きる）の物差しにも使う（§12.2）。
 * @param {Object} p 選手（{id, role}）
 * @param {Map<string,Object>} obs playerId → 当該シーズンの careerStats 行（{batting,pitching,...}）
 * @returns {number|null} 観測が無い（新人・当年未出場）なら null
 */
function observedValueOf(p, obs, cfg) {
  const line = obs.get(p.id);
  if (!line) return null;
  const rel = cfg.tuning.market.release;
  if (p.role === 'pitcher') {
    const pt = line.pitching || {};
    const ip = (pt.outs || 0) / 3;
    if (ip <= 0) return null;
    const fip = (13 * (pt.hr || 0) + 3 * ((pt.bb || 0) - (pt.ibb || 0) + (pt.hbp || 0)) - 2 * (pt.so || 0)) / ip;
    return ((rel.replacementFip - fip) * ip) / 9;
  }
  const b = line.batting || {};
  const pa = b.pa || 0;
  if (pa <= 0) return null;
  return (observedWoba(b, cfg) - rel.replacementWoba) * pa;
}

/**
 * 戦力外スコア（低いほど切られやすい・§12.2）＝ 観測貢献量 − 出場機会ペナルティ。
 * 少PA/少IP（未確立・渋滞の犠牲＝上林型）は不足ぶんのペナルティで負に沈む。高PAの不振（板山型）も
 * 貢献量自体が負。放出判定は "実観測" だけで下す（trueAbility 非参照）＝出場機会に依存して歪む。
 * ＝別球団（査定が違う＝スカウトが素材を見る）が拾えば生き返る余地が生まれる。
 * @returns {number|null} 観測が無ければ null（＝対象外・新人保護）
 */
function releaseScore(p, obs, cfg) {
  const base = observedValueOf(p, obs, cfg);
  if (base == null) return null;
  const rel = cfg.tuning.market.release;
  const line = obs.get(p.id);
  if (p.role === 'pitcher') {
    const ip = (line.pitching?.outs || 0) / 3;
    return base - rel.ptPenaltyPit * Math.max(0, rel.fullIP - ip);
  }
  const pa = line.batting?.pa || 0;
  return base - rel.ptPenaltyBat * Math.max(0, rel.fullPA - pa);
}

// ============================================================================
// FA（§15）
// ============================================================================
/**
 * 国内FA。資格者（一定年齢帯・簡略）の一部が宣言→他球団が評価関数で入札→最高入札が現球団評価を
 * bidMargin 超で上回れば移籍。人的補償として移籍先の "非プロテクト同型" から1人を流出元へ戻す
 * （＝同(role,primaryPos)1:1スワップ＝構成恒常）。プレイヤーは marketInterventions で入札に介入できる。
 *
 * FA入札が "評価関数差で分かれる": 守備を重める球団は守備型FAに高く入札し、出塁重視の球団は
 * 選球眼型に高く入札する（evaluateProspect の球団の癖）。→ 宝を正しく評価する球団が競り勝つ。
 * @returns {Array} 成立した移籍の記録
 */
function runFA(league, cfg, { profiles, masterSeed, yearIndex, interventions }) {
  const fa = cfg.tuning.market.fa;
  const order = teamIds(league);
  const rosters = activeByTeam(league);
  const protects = new Map();
  for (const tid of order) {
    protects.set(tid, protectSet(tid, rosters.get(tid), profiles, cfg, fa.protectCount, masterSeed, yearIndex));
  }
  const signings = [];

  // 資格判定＋宣言（決定論・年齢帯＝年数条件の簡略代理）。
  const declared = [];
  for (const p of league.players.slice().sort(byId)) {
    if (p.rosterStatus !== 'active') continue;
    if (p.age < fa.minAge || p.age > fa.maxAge) continue;
    if (makeRng(hashSeed(masterSeed, 'fa-declare', yearIndex, p.id)).chance(fa.declareRate)) declared.push(p);
  }

  const faIv = interventions.filter((iv) => iv.phase === 'fa');
  for (const p of declared) {
    const home = p.teamId;
    // 各球団の入札（現球団を除く）。最高入札を決める（同値は teamId 昇順）。
    let best = null;
    let bestVal = -Infinity;
    for (const tid of order) {
      if (tid === home) continue;
      const bid = assess(profiles, tid, p, cfg, masterSeed, yearIndex);
      if (bid > bestVal || (bid === bestVal && (best === null || tid < best))) {
        bestVal = bid;
        best = tid;
      }
    }
    if (!best) continue;
    const homeVal = assess(profiles, home, p, cfg, masterSeed, yearIndex);

    // プレイヤー介入: 自チームがこのFAへ入札（＝AIを上回る意思）→ 勝者を強制上書き（再現可能）。
    const pv = faIv.find((iv) => iv.playerId === p.id);
    let winner = null;
    let via = 'ai';
    if (pv && pv.teamId && pv.teamId !== home && rosters.has(pv.teamId)) {
      winner = pv.teamId;
      via = 'player';
    } else if (bestVal > homeVal + fa.bidMargin) {
      winner = best;
    }
    if (!winner) continue;

    // 人的補償: 移籍先 winner の "非プロテクト同型" から、流出元 home が自評価で最良の1人を獲る。
    //   winner は自評価で最も惜しくない同型（＝最低評価の非プロテクト）を差し出す。無ければ不成立
    //   （＝構成恒常のガード。同(role,primaryPos)1:1が保てない移籍はしない）。
    const tk = typeKey(p);
    const pool = rosters
      .get(winner)
      .filter((q) => q.id !== p.id && typeKey(q) === tk && !protects.get(winner).has(q.id));
    if (!pool.length) continue;
    // winner が差し出す＝winner 自評価の最低（最も惜しくない）。
    pool.sort((a, b) => assess(profiles, winner, a, cfg, masterSeed, yearIndex) - assess(profiles, winner, b, cfg, masterSeed, yearIndex) || byId(a, b));
    const comp = pool[0];

    // 契約年数（34歳以降の長期はリスク・§15）＝フレーバー記録。
    const years = Math.max(1, Math.min(fa.maxYears, p.age >= fa.longContractAge ? fa.maxYears - Math.floor((p.age - fa.longContractAge) / 2) : fa.maxYears - 1));
    // 移籍実行（同型1:1スワップ）。
    p.teamId = winner;
    comp.teamId = home;
    // ロスター束を更新（後続FA処理が最新の在籍で判断できるように）。
    rosters.set(winner, rosters.get(winner).filter((q) => q.id !== comp.id).concat(p).sort(byId));
    rosters.set(home, rosters.get(home).filter((q) => q.id !== p.id).concat(comp).sort(byId));
    signings.push({ playerId: p.id, from: home, to: winner, comp: comp.id, via, years, age: p.age, role: p.role, primaryPos: p.primaryPos });
  }
  return signings;
}

// ============================================================================
// トレード（§15）
// ============================================================================
/**
 * R7（決定4）: 「今⇄将来」の意図的な非効率（窓状態バイアス）。Dayn Perry/Neil Painesの実証
 * （デッドライン補強の実際の貢献は総VORPの2.2%・WS制覇との相関はほぼ無/マイナス）に基づき、
 * contending は即戦力(veteranAge以上)を受け取る評価を、rebuilding は若手(youthAge以下)を
 * 受け取る評価を、それぞれ windowPremium だけ過大評価する（＝双方winのmargin判定を通りやすくし、
 * 買い手が将来を安く手放す/売り手が即戦力を安く手放す構造を作る）。windowByTeam 無し（旧テスト
 * 呼び出し）は常に0＝既存挙動と bit 同一。
 */
function windowPremium(teamId, incoming, windowByTeam, cfg) {
  if (!windowByTeam) return 0;
  const tc = cfg.tuning.market.trade;
  const w = windowByTeam.get(teamId);
  if (w === 'contending' && incoming.age >= tc.veteranAge) return tc.windowPremium;
  if (w === 'rebuilding' && incoming.age <= tc.youthAge) return tc.windowPremium;
  return 0;
}

/**
 * トレード。AI同士は "各自の評価関数の差" から双方が得だと見なせば成立（双方win）。同(role,primaryPos)の
 * 1:1スワップ（構成恒常）。プレイヤー起案は marketInterventions で受け、AIは自評価で受諾判定する。
 *
 * 双方win の直観: A の余剰選手 Xa（A評価で最低）と B の余剰選手 Xb を、A が「Xb>Xa（A評価）」かつ
 * B が「Xa>Xb（B評価）」と見なせば、評価関数の違いから両者とも純利得＝成立。宝の再分配が起きる。
 * @param {Map<string,string>|null} windowByTeam teamId→'contending'|'neutral'|'rebuilding'（決定3・§決定4で使用）
 * @returns {Array} 成立したトレードの記録
 */
function runTrades(league, cfg, { profiles, masterSeed, yearIndex, interventions, windowByTeam = null }) {
  const tc = cfg.tuning.market.trade;
  const order = teamIds(league);
  const rosters = activeByTeam(league);
  const protects = new Map();
  for (const tid of order) {
    protects.set(tid, protectSet(tid, rosters.get(tid), profiles, cfg, tc.protectCount, masterSeed, yearIndex));
  }
  const moved = new Set(); // この年に既に動いた選手（二重移動を防ぐ）
  const trades = [];
  const byPid = new Map(league.players.map((p) => [p.id, p]));

  const swap = (a, b, via) => {
    const ta = a.teamId;
    const tb = b.teamId;
    a.teamId = tb;
    b.teamId = ta;
    rosters.set(tb, rosters.get(tb).filter((q) => q.id !== b.id).concat(a).sort(byId));
    rosters.set(ta, rosters.get(ta).filter((q) => q.id !== a.id).concat(b).sort(byId));
    moved.add(a.id);
    moved.add(b.id);
    trades.push({ aPlayer: a.id, aTeam: ta, bPlayer: b.id, bTeam: tb, via, role: a.role, primaryPos: a.primaryPos });
  };

  // プレイヤー起案トレードを先に適用（AIは自評価で受諾判定・再現可能）。
  for (const iv of interventions.filter((i) => i.phase === 'trade')) {
    const a = byPid.get(iv.aPlayer);
    const b = byPid.get(iv.bPlayer);
    if (!a || !b || moved.has(a.id) || moved.has(b.id)) continue;
    if (a.teamId !== iv.aTeam || b.teamId !== iv.bTeam) continue;
    if (typeKey(a) !== typeKey(b)) continue; // 同型のみ（構成恒常）
    // AI 相手（bTeam）の受諾判定: 受け取る a を、放出する b より margin 超で高評価なら受諾。
    const aiTeam = iv.bTeam;
    const gain =
      assess(profiles, aiTeam, a, cfg, masterSeed, yearIndex) + windowPremium(aiTeam, a, windowByTeam, cfg) -
      assess(profiles, aiTeam, b, cfg, masterSeed, yearIndex);
    if (gain > tc.margin) swap(a, b, 'player');
    else trades.push({ aPlayer: a.id, aTeam: iv.aTeam, bPlayer: b.id, bTeam: iv.bTeam, via: 'player', rejected: true });
  }

  // AI同士: 型ごとに、各球団の "最も惜しくない非プロテクト同型選手" を候補に、双方winの対を探す。
  const types = new Set();
  for (const p of league.players) if (p.rosterStatus === 'active') types.add(typeKey(p));
  outer: for (const tk of [...types].sort()) {
    // 各球団の候補＝その型の非プロテクトのうち自評価が最低（放出したい1人）。
    const cand = new Map();
    for (const tid of order) {
      const arr = rosters
        .get(tid)
        .filter((q) => typeKey(q) === tk && !protects.get(tid).has(q.id) && !moved.has(q.id));
      if (!arr.length) continue;
      arr.sort((a, b) => assess(profiles, tid, a, cfg, masterSeed, yearIndex) - assess(profiles, tid, b, cfg, masterSeed, yearIndex) || byId(a, b));
      cand.set(tid, arr[0]);
    }
    const teams = [...cand.keys()].sort();
    for (let i = 0; i < teams.length; i++) {
      for (let j = i + 1; j < teams.length; j++) {
        const A = teams[i];
        const B = teams[j];
        const Xa = cand.get(A);
        const Xb = cand.get(B);
        if (!Xa || !Xb || moved.has(Xa.id) || moved.has(Xb.id)) continue;
        const aGain =
          assess(profiles, A, Xb, cfg, masterSeed, yearIndex) + windowPremium(A, Xb, windowByTeam, cfg) -
          assess(profiles, A, Xa, cfg, masterSeed, yearIndex);
        const bGain =
          assess(profiles, B, Xa, cfg, masterSeed, yearIndex) + windowPremium(B, Xa, windowByTeam, cfg) -
          assess(profiles, B, Xb, cfg, masterSeed, yearIndex);
        if (aGain > tc.margin && bGain > tc.margin) {
          swap(Xa, Xb, 'ai');
          if (trades.filter((t) => !t.rejected).length >= tc.maxPerYear) break outer;
          continue outer; // この型は1件成立で次の型へ（churn抑制）
        }
      }
    }
  }
  return trades;
}

// ============================================================================
// 戦力外 → 拾い上げ（§12.2）
// ============================================================================
/**
 * 戦力外→拾い上げ。各球団は "実際の観測成績"（当該シーズンの生 statline）が低い非プロテクト選手を
 * 戦力外候補に出す（少PA/不振でショボく見える＝上林/板山型）。候補を型ごとに集め、査定の違う球団間で
 * 再分配する（同型循環＝構成恒常）。切った球団は同型を1人受け取る（自分の候補が戻ることも、他球団の
 * 宝を拾うこともある）。拾い上げた選手は翌季に出場機会を得て観測が改善しうる（「余所では生きる」）。
 *
 * 三層の要: 放出判定＝実観測（歪む）／拾い上げ査定＝evaluateProspect（スカウトが素材を見る）。
 * 全球団同目だと復活は起きない → 球団ごとに評価関数が違うからこそ宝がこぼれ、別球団で生き返る。
 * @param {Map<string,Object>} obs playerId → 当該シーズンの観測 statline 行
 * @returns {Array} 拾い上げ（放出→別球団が獲得）の記録
 */
function runReleaseAndPickup(league, cfg, { profiles, masterSeed, yearIndex, standings, obs }) {
  const rel = cfg.tuning.market.release;
  const order = teamIds(league);
  const rosters = activeByTeam(league);

  // 各球団の戦力外候補を型別に集める。放出判定は "実観測" の戦力外スコアだけ（trueAbility 非参照）＝
  //   出場機会に依存して歪む。査定（evaluateProspect）で守らない＝自球団の歪んだ査定で切った宝が
  //   別球団で拾われる余地を残す（全球団同目だと復活しない・§12.2）。若手（minAge未満）は保護。
  const cutByType = new Map(); // typeKey → [{teamId, player, cutVal}]
  for (const tid of order) {
    const cands = [];
    for (const p of rosters.get(tid)) {
      if (p.age < rel.minAge) continue;
      const v = releaseScore(p, obs, cfg);
      if (v == null || v >= rel.threshold) continue;
      cands.push({ player: p, val: v, obsVal: observedValueOf(p, obs, cfg) });
    }
    cands.sort((a, b) => a.val - b.val || byId(a.player, b.player)); // スコアが低い順
    for (const c of cands.slice(0, rel.maxCutsPerTeam)) {
      const tk = typeKey(c.player);
      if (!cutByType.has(tk)) cutByType.set(tk, []);
      cutByType.get(tk).push({ teamId: tid, player: c.player, cutVal: c.obsVal });
    }
  }

  const wOrder = waiverOrder(standings, league); // 弱い球団が先に拾える（ウェーバー順）
  const rank = new Map(wOrder.map((t, i) => [t, i]));
  const pickups = [];
  for (const [, entries] of [...cutByType].sort((a, b) => (a[0] < b[0] ? -1 : 1))) {
    if (entries.length < 2) continue; // 同型が2件以上ないと再分配（＝拾い上げ）が起きない
    const cutMeta = new Map(entries.map((e) => [e.player.id, e]));
    const remaining = entries.map((e) => e.player);
    // 拾い上げ: 提出球団は "出した人数ぶん" の獲得枠を持つ（枠=提出票）。枠をウェーバー順（同順は teamId）
    //   に処理し、各枠が残プールから自評価で最良を1人ずつ引き当てる＝提出=獲得の全単射（構成恒常）。
    const tickets = entries
      .map((e) => e.teamId)
      .sort((a, b) => (rank.get(a) ?? 0) - (rank.get(b) ?? 0) || (a < b ? -1 : a > b ? 1 : 0));
    for (const tid of tickets) {
      if (!remaining.length) break;
      let bi = 0;
      let bv = -Infinity;
      for (let i = 0; i < remaining.length; i++) {
        const val = assess(profiles, tid, remaining[i], cfg, masterSeed, yearIndex);
        if (val > bv || (val === bv && remaining[i].id < remaining[bi].id)) {
          bv = val;
          bi = i;
        }
      }
      const claimed = remaining.splice(bi, 1)[0];
      if (claimed.teamId !== tid) {
        const meta = cutMeta.get(claimed.id);
        claimed.teamId = tid;
        pickups.push({ playerId: claimed.id, from: meta.teamId, to: tid, cutVal: Math.round(meta.cutVal * 10) / 10, age: claimed.age, role: claimed.role, primaryPos: claimed.primaryPos });
      }
    }
  }
  return pickups;
}

// ============================================================================
// 契約更改（§15・フレーバー）
// ============================================================================
/**
 * 契約更改。年俸を観測（当年 statline 貢献量、無ければ 0）に緩く連動させ、契約年数を年齢で決める
 * （34歳以降は長期＝リスク）。エンジンには一切効かない純フレーバー（記録/ニュース素材・C4用）。
 * @returns {{count:number, totalSalary:number}} 更改サマリ
 */
function runContractRenewal(league, cfg, { obs }) {
  const fa = cfg.tuning.market.fa;
  let total = 0;
  let count = 0;
  for (const p of league.players) {
    if (p.rosterStatus !== 'active') continue;
    const v = observedValueOf(p, obs, cfg);
    const salary = Math.max(50, Math.round((300 + 40 * (v ?? 0)) )); // 万円相当の粗い代理（下限50）
    const years = p.age >= fa.longContractAge ? Math.max(1, fa.maxYears - 1) : Math.min(fa.maxYears, 2 + Math.floor(salary / 2000));
    p.contract = { salary, years };
    total += salary;
    count++;
  }
  return { count, totalSalary: total };
}


// ===== src/game/roster_moves.mjs =====
// ============================================================================
// F2-3: シーズン中の出場登録入替（昇格・降格）— phaseF_spec F2-3 / §S3-2 / §12.1
//
//   applyRosterMovesForDay(rt, day)
//     … 日次進行の冒頭（その日の試合前）に呼ばれ、各球団AIが出場登録29人を入れ替える:
//       (1) IL復帰:   故障離脱で入替登録されていた選手が復帰 → 補充選手（不在なら同型最下位）と再入替
//       (2) IL補充:   一軍登録者が離脱中 → 二軍から同型最良（球団AI評価=観測＋スカウト）を登録へ昇格
//       (3) 成績入替: 既存の25試合レビューと同周期で、一軍で不振の登録者と「二軍観測成績」が
//                     良い控えを入替（クールダウン日数ノブ＝NPB10日ルールの簡略化）
//
// 設計原則（req_1/req_2・厳守）:
//   - 三層構造: 判定は 観測statline（一軍 rt.stats / 二軍 rt.farm.stats）＋スカウト評価
//     （scoutSeed・球団評価プロファイル由来の決定論ノイズ）のみ。trueAbility の直接参照は
//     編成の初期値の再構築（buildDepthChart/createUsageState）だけに閉じる（既存の原則と同輪）。
//   - 決定論: 乱数の共有ストリームを一切消費しない（評価は hashSeed 派生の独立RNG or 乱数非使用。
//     同点は id 昇順で解決）。load の replay は同一観測から同一の入替を再現する（verifyStandings が門番）。
//   - 1年目シム不変（鉄則7）: startYear が yearIndex>=1 でのみ enableMoves を立てる。
//     1年目のゲームランナーは simulateSeason（一括）と bit 同一のまま（較正53指標に非干渉）。
//   - 構成恒常: 入替は 野手=同 primaryPos／投手=同 role の1:1＝登録・二軍双方のポジション構成が
//     シーズンを通じて不変（両軍デプスチャート成立の保証）。育成(rosterStatus='minor')はシーズン中
//     は登録しない（支配下70枠の管理。育成→支配下はオフの C3a 強化判定＝market.runMarket のみ）。
//   - ニュース: 入替は rt.rosterMoves に記録され step.rosterMoves でも返る（週次ダイジェスト/
//     ハブの素材。§17: 集計値・当該シーズンのみ＝save 非対象、replay で再構築）。
// ============================================================================










/** id 昇順の安定比較（決定論・順序非依存の走査に使う）。 */
function byId(a, b) {
  return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
}

// ============================================================================
// ★R4: 守備・走塁の「観測」を球団AIの査定に入れる（ユーザー指摘）。
//
// 旧実装の欠陥: 二軍選手の査定（callupScore / farmPerfBonus）も、一軍選手の降格判定も、
//   **打撃（wOBA）と防御率（RA9）しか見ていなかった**。二軍の守備・走塁は集計器が
//   ちゃんと積んでいる（UZR成分・UBR/wSB/wGDP の生カウント）のに、査定でも表示でも捨てていた。
//   結果「守備の上手い二軍野手は永遠に上がってこない」「守備で稼ぐ一軍野手が打撃だけで
//   二軍に落とされる」という、現実にあり得ない編成AIになっていた。
// 三層構造: 見るのは**観測成績**（rt.stats / rt.farm.stats）だけ＝真値は覗かない。
// ============================================================================

/** 当季の観測から一軍/二軍のリーグ定数を導出する（レビュー時に作り直す・水準が違うので別々に）。 */
function refreshLeagueConstants(rt) {
  const top = [...rt.stats.stats.values()];
  rt.moves.lc = top.length
    ? deriveLeagueConstants({ playerSeasons: top, standings: [...rt.standings.values()] })
    : null;
  const farm = rt.farm ? [...rt.farm.stats.stats.values()] : [];
  rt.moves.farmLc = farm.length
    ? deriveLeagueConstants({ playerSeasons: farm, standings: [...rt.farm.standings.values()] })
    : null;
}

/**
 * 観測された守備＋走塁の価値（得点）。標本が薄いうちは信頼度で縮める（UZRは少イニングで暴れる）。
 * @returns {number} runs above average（守備UZR＋走塁BsR）
 */
function obsDefRunRuns(ps, cfg, lc) {
  if (!ps || !lc) return 0;
  const inn = totalFieldInnings(ps.fielding);
  const uzr = inn > 0 ? uzrRuns(ps, cfg, lc) : 0;
  const bsr = playerBaserunning(ps, cfg, lc).bsr || 0;
  const mv = cfg.tuning.moves;
  const trust = inn / (inn + mv.defTrustInnings); // 少イニングの守備評価は信じない
  return uzr * trust + bsr;
}

/** 得点 → wOBA 相当（打撃評価と足せる単位へ）。PA が少ないと発散するので下限を噛ませる。 */
function runsToWoba(runs, pa, lc, cfg) {
  if (!lc || !lc.wobaScale) return 0;
  const denom = Math.max(pa, cfg.tuning.moves.defWobaMinPA);
  return (runs / denom) * lc.wobaScale;
}

/** 一軍野手の「打撃＋守備＋走塁」の観測混合評価（降格判定の物差し）。 */
function fielderValue(rt, pid, cfg) {
  const u = rt.usageByTeam.get(rt.moves.byId.get(pid).teamId);
  const bat = blendedWoba(u, pid, rt.stats.getBat, cfg);
  const ps = rt.stats.stats.get(pid);
  if (!ps) return bat;
  return bat + runsToWoba(obsDefRunRuns(ps, cfg, rt.moves.lc), ps.batting.pa, rt.moves.lc, cfg);
}

/** 観測RA9（未出場/アウト0は null＝判定対象外）。 */
function obsRA9(line) {
  if (!line || !(line.outs > 0)) return null;
  return (line.r * 27) / line.outs;
}

/** 出場登録中の支配下ロスター（league.players ∩ registered）。 */
function activeRosterOf(rt, teamId) {
  const reg = rt.registeredByTeam.get(teamId);
  return rt.league.players.filter((p) => p.teamId === teamId && reg.has(p.id));
}

/** 球団評価プロファイル（キャリア中固定・§13）。moves 用に遅延キャッシュ。 */
function profileOf(rt, teamId) {
  let pr = rt.moves.profiles.get(teamId);
  if (!pr) {
    pr = teamEvalProfile(rt.masterSeed, teamId, rt.cfg);
    rt.moves.profiles.set(teamId, pr);
  }
  return pr;
}

/** クールダウン中か（10日ルール簡略・swapCooldownDays）。 */
function inCooldown(rt, pid, day) {
  return (rt.moves.cooldownUntil.get(pid) ?? -1) > day;
}

/**
 * IL補充の球団AI評価（観測＋スカウト）: evaluateProspect（観測ツール=真値＋球団固有ノイズ・
 * 球団の癖の重み）を土台に、二軍の観測statline（wOBA/RA9）を信頼度加重で加点する。
 * 三層構造: 真値の直接参照はない（evaluateProspect がスカウト観測を模す既存の球団AI評価）。
 */
function callupScore(rt, teamId, p, cfg) {
  const mv = cfg.tuning.moves;
  const ctx = { masterSeed: rt.moves.scoutSeed, yearIndex: rt.season, teamId };
  let score = evaluateProspect(profileOf(rt, teamId), p, cfg, ctx);
  if (p.role === 'fielder') {
    const b = rt.farm.stats.getBat(p.id);
    if (b.pa > 0) {
      const trust = b.pa / (b.pa + mv.callupTrustPA);
      score += mv.callupWobaW * (observedWoba(b, cfg) - cfg.tuning.mgr.wobaPrior) * trust;
    }
    // ★R4: 二軍の守備・走塁の観測も査定に入れる（旧実装は打撃だけを見ていた＝守備の上手い
    //   二軍野手が永遠に上がってこなかった）。UZR＋BsR の得点をそのまま評価点へ換算する。
    score += mv.callupDefW * obsDefRunRuns(rt.farm.stats.stats.get(p.id), cfg, rt.moves.farmLc);
  } else {
    const ra9 = obsRA9(rt.farm.stats.getPitch(p.id));
    if (ra9 != null) {
      const pi = rt.farm.stats.getPitch(p.id);
      const trust = pi.outs / (pi.outs + mv.callupTrustOuts);
      score += mv.callupRa9W * (mv.callupRa9Ref - ra9) * trust;
    }
  }
  return score;
}

/**
 * チャート＋起用状態を新ロスターで再構築し、動的フィールド（疲労/出場履歴/IL/担当）を引き継ぐ。
 * createUsageState は選手ごとの scoutSeed 派生RNGのみ使用＝共有ストリーム非消費（決定論）。
 * 残留選手の scoutEval/defEval/rangeEval は再構築でも同値（scoutSeed 基準）＝評価の連続性が保たれる。
 * @returns {{dh:Object, noDh:Object}} 新チャート
 */
function rebuildSlice({ team, roster, cfg, chartsByTeam, usageByTeam }) {
  const charts = {
    dh: buildDepthChart(roster, cfg, { dh: true }),
    noDh: buildDepthChart(roster, cfg, { dh: false }),
  };
  chartsByTeam.set(team.id, charts);
  const old = usageByTeam.get(team.id);
  const nu = createUsageState(team, charts, cfg, old ? old.priorPitch : null);
  if (old) {
    nu.games = old.games;
    nu.lastSnap = old.lastSnap;
    nu.consecStarts = old.consecStarts;
    nu.startsByPid = old.startsByPid;
    nu.startsAtPos = old.startsAtPos;
    nu.lastStartDay = old.lastStartDay;
    nu.startDaysByPid = old.startDaysByPid;
    nu.pitchedByDay = old.pitchedByDay;
    nu.injuredUntil = old.injuredUntil;
    nu.rotIdx = charts.dh.rotation.length ? old.rotIdx % charts.dh.rotation.length : 0;
    // 担当（regular/challenger/share）の引き継ぎ: 旧担当が新ロスターに残っていればそのまま
    // （見直しの漸進性を保つ）。抹消された担当は新チャートの既定（編成時評価）へ戻る。
    for (const pos of Object.keys(nu.assign)) {
      const oa = old.assign[pos];
      if (!oa || oa.regular == null || !charts.dh.byId.has(oa.regular)) continue;
      const keepCh = oa.challenger != null && charts.dh.byId.has(oa.challenger);
      nu.assign[pos] = { regular: oa.regular, challenger: keepCh ? oa.challenger : null, share: keepCh ? oa.share : 0 };
    }
  }
  usageByTeam.set(team.id, nu);
  return charts;
}

/**
 * 出場登録の1:1入替を実行する（up=二軍→登録・down=登録→二軍）。一軍/二軍双方の
 * チャート・起用状態を再構築し、双方の選手にクールダウンを課す。
 */
function swapRegistration(rt, teamId, up, down, day) {
  const cfg = rt.cfg;
  const reg = rt.registeredByTeam.get(teamId);
  reg.delete(down.id);
  reg.add(up.id);
  // 一軍側の再編成（depthByTeam も所属リーグ規則で張り替え＝後方互換の参照を保つ）
  const team = rt.teamById.get(teamId);
  const charts = rebuildSlice({ team, roster: activeRosterOf(rt, teamId), cfg, chartsByTeam: rt.chartsByTeam, usageByTeam: rt.usageByTeam });
  rt.depthByTeam.set(teamId, (rt.leagueDh.get(team.league) ?? true) ? charts.dh : charts.noDh);
  // 二軍側（up を除き down を加える）
  const f = rt.farm;
  const fr = f.rosterByTeam.get(teamId);
  const idx = fr.findIndex((p) => p.id === up.id);
  if (idx >= 0) fr.splice(idx, 1);
  fr.push(down);
  rebuildSlice({ team: f.teamById.get(teamId), roster: fr, cfg, chartsByTeam: f.chartsByTeam, usageByTeam: f.usageByTeam });
  // クールダウン（10日ルール簡略）: 双方とも当分は成績入替の対象にしない（IL復帰は強制につき無視される）
  const until = day + cfg.tuning.moves.swapCooldownDays;
  rt.moves.cooldownUntil.set(up.id, until);
  rt.moves.cooldownUntil.set(down.id, until);
}

/** 入替をニュースイベントとして記録する（rt.rosterMoves・当該シーズンのみ・§17）。 */
function logMove(rt, out, { day, teamId, type, up, down }) {
  const mv = {
    day,
    teamId,
    type, // 'ilReplace' | 'ilReturn' | 'perfSwap'
    upId: up.id,
    upName: up.name,
    upPos: up.role === 'pitcher' ? 'P' : up.primaryPos,
    downId: down.id,
    downName: down.name,
    downPos: down.role === 'pitcher' ? 'P' : down.primaryPos,
  };
  rt.rosterMoves.push(mv);
  out.push(mv);
  return mv;
}

/** 同型（野手=同 primaryPos／投手=同 role）の二軍昇格候補（育成・離脱中・クールダウン中は除外）。 */
function farmCandidates(rt, teamId, like, day) {
  const fu = rt.farm.usageByTeam.get(teamId);
  return rt.farm.rosterByTeam.get(teamId).filter(
    (q) =>
      q.rosterStatus !== 'minor' && // 育成はシーズン中は登録できない（支配下70枠・オフのC3aのみ）
      q.role === like.role &&
      (like.role === 'pitcher' || q.primaryPos === like.primaryPos) &&
      !isInjured(fu, q.id, day) &&
      !inCooldown(rt, q.id, day),
  );
}

/** 候補から score 最大を選ぶ（同点は id 昇順＝決定論）。 */
function bestBy(cands, score) {
  let best = null;
  let bv = -Infinity;
  for (const q of cands.slice().sort(byId)) {
    const v = score(q);
    if (v > bv) {
      bv = v;
      best = q;
    }
  }
  return best;
}

/** (1) IL復帰: 離脱が明けた入替対象を再登録する（補充選手が居なければ同型の観測最下位と入替）。 */
function processIlReturns(rt, teamId, day, out) {
  const entries = [...rt.moves.ilSwaps].filter(([, s]) => s.teamId === teamId).sort((a, b) => (a[0] < b[0] ? -1 : 1));
  for (const [pid, swap] of entries) {
    const u = rt.usageByTeam.get(teamId);
    if (isInjured(u, pid, day)) continue; // まだ離脱中
    const p = rt.moves.byId.get(pid);
    rt.moves.ilSwaps.delete(pid);
    if (!p || p.teamId !== teamId) continue; // 安全弁（シーズン中の移籍は無い）
    const reg = rt.registeredByTeam.get(teamId);
    if (reg.has(pid)) continue; // 既に登録済み（想定外の安全弁）
    if (p.rosterStatus === 'minor') continue; // 育成契約の選手は出場登録できない（支配下70枠の管理・安全弁）
    // 復帰と入替で抹消する相手: 原則は補充選手。成績入替で既に降格済みなら同型の観測最下位。
    let down = rt.moves.byId.get(swap.subId);
    if (!down || !reg.has(swap.subId)) {
      const cands = activeRosterOf(rt, teamId).filter(
        (q) => q.role === p.role && (p.role === 'pitcher' || q.primaryPos === p.primaryPos) && !isInjured(u, q.id, day),
      );
      down = p.role === 'pitcher'
        ? bestBy(cands, (q) => obsRA9(rt.stats.getPitch(q.id)) ?? rt.cfg.tuning.moves.callupRa9Ref) // RA9最悪
        : bestBy(cands, (q) => -blendedWoba(u, q.id, rt.stats.getBat, rt.cfg)); // 混合評価最低
      if (!down) continue; // 同型が居ない（理論上は起きない）
    }
    swapRegistration(rt, teamId, p, down, day);
    logMove(rt, out, { day, teamId, type: 'ilReturn', up: p, down });
  }
}

/** (2) IL補充: 離脱中の登録者を、二軍の同型最良（球団AI評価=観測＋スカウト）と入替する。 */
function processIlReplacements(rt, teamId, day, out) {
  const cfg = rt.cfg;
  const mv = cfg.tuning.moves;
  for (const p of activeRosterOf(rt, teamId).sort(byId)) {
    const u = rt.usageByTeam.get(teamId);
    const until = u.injuredUntil.get(p.id) ?? 0;
    if (until <= day) continue; // 離脱していない
    if (until - day < mv.ilMinDays) continue; // 残り離脱が短い＝登録を動かさない
    if (rt.moves.ilSwaps.has(p.id)) continue; // 補充済み（登録に残らないため通常は来ない）
    const best = bestBy(farmCandidates(rt, teamId, p, day), (q) => callupScore(rt, teamId, q, cfg));
    if (!best) continue; // 同型候補が枯れている→起用AIのベンチ運用に任せる
    swapRegistration(rt, teamId, best, p, day);
    // 降格した離脱者は二軍でも出場不可（IL選手が二軍戦に出る矛盾の防止）
    rt.farm.usageByTeam.get(teamId).injuredUntil.set(p.id, until);
    rt.moves.ilSwaps.set(p.id, { teamId, subId: best.id });
    logMove(rt, out, { day, teamId, type: 'ilReplace', up: best, down: p });
  }
}

/**
 * (3) 成績入替: 25試合レビューと同周期で、一軍の観測不振者と二軍観測好調者を入替する。
 * 三層構造: 一軍側=混合評価（観測wOBA＋スカウト・blendedWoba）／二軍側=二軍の混合評価から
 * レベル差割引 farmGapWoba を引いた値。投手は観測RA9同士の比較（真値不参照）。
 * 野手・投手 各1件/レビューまで（急な総入替をしない＝シェア漸増の見直しと同じ思想）。
 */
function processPerfSwaps(rt, teamId, day, out) {
  const cfg = rt.cfg;
  const mv = cfg.tuning.moves;
  const fu = () => rt.farm.usageByTeam.get(teamId);
  const u = () => rt.usageByTeam.get(teamId);

  // 二軍から誰を上げるか＝球団AI評価（スカウト＋二軍観測の信頼度加重。IL補充と同じ物差し）。
  //   ★R4: 旧実装は「二軍で farmMinPA/farmPitchMinOuts 以上を消化し、かつ一軍の選手より明確に
  //   良い成績を残した選手」しか昇格候補にしなかった（＝**相対比較のみ**）。そのため
  //   「打ち込まれた中継ぎ」も、二軍に実績十分な上位互換が居なければ一軍に居座り続けた。
  //   現実の球団は「ダメなら落とす」→「二軍から誰かを上げる」（上げる相手は実績が薄くても
  //   スカウト評価で選ぶ）。昇格側の下限標本を外し、callupScore（真値を見ないスカウト観測＋
  //   二軍成績の加点）で選ぶ。
  const bestFarmFor = (p, extra) =>
    bestBy(farmCandidates(rt, teamId, p, day), (q) => callupScore(rt, teamId, q, cfg) + (extra ? extra(q) : 0));
  const doSwap = (up, down) => {
    swapRegistration(rt, teamId, up, down, day);
    logMove(rt, out, { day, teamId, type: 'perfSwap', up, down });
  };

  // --- (a) 打ち込まれた投手を二軍へ落とす -------------------------------------------
  //   救援は少ない対戦打者数で判断される（数試合打ち込まれれば抹消＝NPBの実務）。
  //   先発は緩衝を厚く取り、数試合の不調では動かさない（実際に先発は簡単には外されない）。
  const rot = new Set(rt.chartsByTeam.get(teamId).dh.rotation);
  const pitchers = activeRosterOf(rt, teamId)
    .filter((p) => p.role === 'pitcher' && !isInjured(u(), p.id, day) && !inCooldown(rt, p.id, day))
    .map((p) => ({ p, line: rt.stats.getPitch(p.id), starter: rot.has(p.id) }))
    .filter(({ line, starter }) => obsRA9(line) != null && line.bf >= (starter ? mv.rotationMinBF : mv.pitchMinBF))
    .sort((a, b) => obsRA9(b.line) - obsRA9(a.line) || byId(a.p, b.p));
  let nPitchSwaps = 0;
  for (const { p, line, starter } of pitchers) {
    if (nPitchSwaps >= mv.maxPitchSwapsPerReview) break;
    const ra9 = obsRA9(line);
    const best = bestFarmFor(p, starter ? (q) => starterScore(q) * mv.rotationStarterScoreW : null);
    if (!best) continue; // 同型の代わりが二軍に居ない（枠を壊せない）
    const farmRa9 = obsRA9(rt.farm.stats.getPitch(best.id));
    // ①絶対評価: 観測RA9が「打ち込まれた」水準（＝二軍の実績を問わず落とす）
    const shelled = ra9 >= (starter ? mv.relegateStarterRA9 : mv.relegateRelieverRA9);
    // ②相対評価: 二軍に明確に良い投手が居る（レベル差割引 farmGapRA9 込み）
    const outclassed =
      farmRa9 != null &&
      (rt.farm.stats.getPitch(best.id).outs ?? 0) >= mv.farmPitchMinOuts &&
      ra9 - (farmRa9 + mv.farmGapRA9) > (starter ? mv.rotationSwapRA9 : mv.pitchSwapRA9);
    if (!shelled && !outclassed) continue;
    doSwap(best, p);
    nPitchSwaps++;
  }

  // --- (b) 打てない野手を二軍へ落とす -----------------------------------------------
  const fielders = activeRosterOf(rt, teamId)
    .filter((p) => p.role === 'fielder' && !isInjured(u(), p.id, day) && !inCooldown(rt, p.id, day))
    .map((p) => ({ p, bat: rt.stats.getBat(p.id), v: fielderValue(rt, p.id, cfg) }))
    .filter(({ bat }) => bat.pa >= mv.fieldMinPA) // 標本不足（代打専任等）は判断しない
    .sort((a, b) => a.v - b.v || byId(a.p, b.p));
  let nFieldSwaps = 0;
  for (const { p, v } of fielders) {
    if (nFieldSwaps >= mv.maxFieldSwapsPerReview) break;
    const best = bestFarmFor(p, null);
    if (!best) continue;
    const fb = rt.farm.stats.getBat(best.id);
    const fps = rt.farm.stats.stats.get(best.id);
    const farmV =
      fb.pa >= mv.farmMinPA
        ? blendedWoba(fu(), best.id, rt.farm.stats.getBat, cfg)
          + runsToWoba(obsDefRunRuns(fps, cfg, rt.moves.farmLc), fb.pa, rt.moves.farmLc, cfg)
          - mv.farmGapWoba
        : null;
    const slumping = v <= mv.relegateWoba; // ①絶対評価: 観測混合評価が「打てない」水準
    const outclassed = farmV != null && farmV - v > mv.perfSwapMargin; // ②相対評価: 二軍に明確に良い打者
    if (!slumping && !outclassed) continue;
    doSwap(best, p);
    nFieldSwaps++;
  }
}

/**
 * (4) 育成→支配下の季節中昇格（§req_20260708・NPB実務: 支配下登録は例年7月末までシーズン中随時
 * 可能。旧実装は年1回のオフシーズンのみ＋自球団の同型引退枠待ちで、育成の好成績が塩漬けになる
 * 欠陥があった）。同型(role,primaryPos)の支配下のうち一軍登録外で観測不振な選手と1:1で入れ替える
 * （支配下70人枠を常に不変に保つ・releaseの代わりに育成契約へ落とす簡略化。実際のNPBでも新規の
 * 支配下登録には既存選手の育成契約化/自由契約などで枠を空ける必要がある）。
 */
function processFarmPromotions(rt, teamId, day, out) {
  const cfg = rt.cfg;
  const mv = cfg.tuning.moves;
  const mk = cfg.tuning.market.farm;
  if (day > rt.finalDay * mv.farmPromoteDeadlineFrac) return; // 実務の7/31相当の昇格期限

  const candidates = rt.league.farm.filter((d) => d.teamId === teamId && !inCooldown(rt, d.id, day));
  if (!candidates.length) return;
  let best = null;
  let bestScore = -Infinity;
  for (const d of candidates.slice().sort(byId)) {
    const r = makeRng(hashSeed(rt.masterSeed, 'inseasonPromote', rt.season, day, d.id));
    // R4: 守備(UZR)・走塁(BsR)も査定に入れるので playerSeason 丸ごと渡す（無出場は従来どおり0点）
    const obs = rt.farm.stats.stats.get(d.id)
      ?? (d.role === 'fielder' ? { batting: rt.farm.stats.getBat(d.id) } : { pitching: rt.farm.stats.getPitch(d.id) });
    const score = overallRating(d) + mk.promoteObsBias + r.normal(0, mk.promoteObsNoiseSd) + farmPerfBonus(d, obs, cfg, rt.moves.farmLc);
    if (score > bestScore) {
      bestScore = score;
      best = d;
    }
  }
  if (!best || bestScore < mk.promoteThreshold) return;

  // 交換相手: 同型(role,primaryPos)の支配下・一軍登録外（登録メンバー構成は乱さない）で
  // 当季観測が最も振るわない選手（transactions.mjs releaseScore と同じ物差し・当季観測のみ）。
  const reg = rt.registeredByTeam.get(teamId);
  const sameType = rt.league.players.filter(
    (p) => p.teamId === teamId && !reg.has(p.id) && p.role === best.role &&
      (best.role === 'pitcher' || p.primaryPos === best.primaryPos) && !inCooldown(rt, p.id, day) &&
      // ★R3: 故障でIL入替中の選手を育成落ちさせない。旧実装は「登録外＋当季観測が不振」だけで選ぶため、
      //   **故障で登録を外れた選手が（出場が少ないので観測が不振に見え）育成契約へ落とされ**、
      //   IL明けの再登録（processIlReturns）で **育成選手が一軍登録に混ざる** 不変量違反を起こした。
      //   現実にも「故障者を育成契約に落として即再登録」は起こらない（療養は支配下のまま）。
      !rt.moves.ilSwaps.has(p.id),
  );
  if (!sameType.length) return; // 交換相手が居ない（枠を崩せない・稀）
  const obsMap = { get: (pid) => ({ batting: rt.stats.getBat(pid), pitching: rt.stats.getPitch(pid) }) };
  const worst = bestBy(sameType, (p) => -(releaseScore(p, obsMap, cfg) ?? Infinity));
  if (!worst) return;

  applyFarmPromotionSwap(rt.league, best.id, worst.id);
  const until = day + cfg.tuning.moves.swapCooldownDays;
  rt.moves.cooldownUntil.set(best.id, until);
  rt.moves.cooldownUntil.set(worst.id, until);
  // §req_20260708: league.players/farmの直接変更はsaveに含まれず、過去年はoffseasonTransitionのみの
  // replay近道で再構築される（day単位の再シムをしない）ため、このログをGameState側で年ごとに畳み込み、
  // load時にreplay適用する（index.mjs load()を参照）。rt.farmPromotionLogは当該シーズンのみ（年ごとに
  // 新規作成）で、状態自体は決定論的に同一入替を再現するが、このログが無いと過去完了年の再構築時に
  // league.players/farmの構成が食い違う（verifyStandingsが検出）。
  rt.farmPromotionLog.push({ day, teamId, upId: best.id, downId: worst.id });
  logMove(rt, out, { day, teamId, type: 'farmPromote', up: best, down: worst });
}

/**
 * 育成⇄支配下のロースター状態を1:1で入れ替える（population不変・§req_20260708）。
 * processFarmPromotions（当季の決定）と index.mjs load()（過去完了年のログreplay適用）の
 * 両方から呼ばれる共有ロジック。
 * @returns {boolean} 入替を実行できたか（upId/downIdが見つからなければfalse・安全弁）
 */
function applyFarmPromotionSwap(league, upId, downId) {
  const fi = league.farm.findIndex((d) => d.id === upId);
  const pi = league.players.findIndex((p) => p.id === downId);
  if (fi < 0 || pi < 0) return false;
  const up = league.farm[fi];
  const down = league.players[pi];
  up.rosterStatus = 'active';
  down.rosterStatus = 'minor';
  // ★R5: **配列の位置をそのまま入れ替える**（splice+push で末尾へ動かさない）。
  //   league.players の並び順は selectActiveRoster/buildDepthChart の同点解決に効くため、
  //   昇格のたびに並びが変わると「同じ入替を巻き戻しても元のリーグに戻らない」。
  //   位置を保存する入替にすると、逆スワップが厳密に元へ戻す＝セーブの開幕時点復元が成立する。
  league.players[pi] = up;
  league.farm[fi] = down;
  return true;
}

/**
 * この day の試合前に出場登録の入替を適用する（F2-3の入口・advanceRuntimeDay から呼ばれる）。
 * enableMoves が立っていない（1年目・sim層・ミニリーグ=farm不成立）構成では常に何もしない。
 * @returns {Array} 実行した入替 [{day,teamId,type,upId,upName,upPos,downId,downName,downPos}]
 */
function applyRosterMovesForDay(rt, day) {
  if (!rt.moves || !rt.farm || !rt.cfg.tuning.moves) return [];
  const out = [];
  for (const team of rt.league.teams) {
    processIlReturns(rt, team.id, day, out);
    processIlReplacements(rt, team.id, day, out);
    // 成績入替/育成昇格はチーム消化試合が reviewInterval を跨ぐたびに1回（既存25試合レビューの拡張）
    const reviewIdx = Math.floor(rt.usageByTeam.get(team.id).games / rt.cfg.tuning.moves.reviewInterval);
    if (reviewIdx > (rt.moves.lastReviewIdx.get(team.id) ?? 0)) {
      rt.moves.lastReviewIdx.set(team.id, reviewIdx);
      // R4: 守備/走塁の観測を得点換算するためのリーグ定数（一軍・二軍で水準が違うので別々に導出）
      if (rt.moves.lcDay !== day) {
        refreshLeagueConstants(rt);
        rt.moves.lcDay = day;
      }
      processPerfSwaps(rt, team.id, day, out);
      processFarmPromotions(rt, team.id, day, out); // §req_20260708: 育成→支配下の季節中昇格
    }
  }
  return out;
}

/**
 * moves 状態の初期化（startSeasonRuntime から呼ばれる）。enableMoves=false（1年目・sim層）や
 * farm 不成立（ミニリーグ）では null＝完全不作動（既存挙動と bit 同一）。
 */
function createMovesState(league, { enableMoves, masterSeed, season, farm }) {
  if (!enableMoves || !farm) return null;
  const byIdMap = new Map();
  for (const p of league.players) byIdMap.set(p.id, p);
  for (const p of league.farm ?? []) byIdMap.set(p.id, p);
  return {
    scoutSeed: hashSeed(masterSeed, 'moves', season), // 球団AI評価の観測ノイズ座標（決定論・年別）
    byId: byIdMap, // 全選手 id→player（シーズン中は不変）
    cooldownUntil: new Map(), // pid → この day まで再移動不可（10日ルール簡略）
    ilSwaps: new Map(), // 離脱者 pid → {teamId, subId}（復帰時の再入替に使う）
    lastReviewIdx: new Map(), // teamId → 処理済みレビュー番号（25試合周期）
    profiles: new Map(), // teamId → teamEvalProfile（遅延キャッシュ・キャリア中固定と同値）
    lc: null, // R4: 一軍のリーグ定数（守備/走塁の観測を得点換算する）
    farmLc: null, // R4: 二軍のリーグ定数（水準が違うので別々に導出）
    lcDay: -1, // 上記を作り直した day
  };
}


// ===== src/game/season_runtime.mjs =====
// ============================================================================
// フェーズC1a: 1シーズンの「日次進行ランタイム」（ヘッドレス・UI非依存）
//
// season.mjs の simulateSeason は「1シーズン一括」だが、ゲームシェルは day（節）単位で
// 進めたい。ここでは simulateSeason と *同一の per-game 処理*（playScheduledGame）を
// schedule の index（gi）順に1日ぶんずつ駆動する。gi は階層シードの座標なので、
// 一括実行でも日次分割実行でも結果は bit 単位で同一になる（既存50較正指標が不変）。
//
// 決定論: 乱数は makeRng(hashSeed(seed, ...)) のみ。Date.now/Math.random 非使用。
//   セーブ/ロードは save.mjs が「開幕状態から cursor まで再走（replay）」で復元する
//   （seed と cursor が RNG カーソルに相当する。usage/集計はこの再走で厳密に再現される）。
// ============================================================================










/**
 * シーズン終了時点でまだ癒えていない故障を、翌シーズンの開幕IL（pendingInjuries）へ持ち越す（R3）。
 * 「9月に全治半年の大怪我 → 翌年の開幕も出られない」を表現する。
 * @returns {Array<{id:string, daysLost:number}>} 翌季開幕時点の残り離脱 day 数
 */
function carryOverInjuries(rt) {
  const out = [];
  const push = (usageByTeam) => {
    for (const u of usageByTeam.values()) {
      for (const [pid, until] of u.injuredUntil) {
        const remain = until - rt.finalDay;
        if (remain > 0) out.push({ id: pid, daysLost: remain });
      }
    }
  };
  push(rt.usageByTeam);
  if (rt.farm) push(rt.farm.usageByTeam);
  // 決定論・順序非依存（Map の走査順に依らない）
  out.sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  return out;
}

/**
 * 二軍リーグのランタイムを組む（F2-2・phaseF_spec F2-2）。
 * 同じ12球団のファームを cfg.league.farm.leagues の2リーグ（完全架空名・一軍と同分割）で
 * ~110試合。**一軍と同じ playScheduledGame**・別の集計器(farmStats)・独立の階層シード
 * （hashSeed(seed,'farm') を根にする＝一軍の 'game'/'lineup' 系列と非干渉→一軍は farm の
 * 有無で byte 不変）。二軍ロスター＝登録外の支配下＋育成（league.farm・rosterStatus='minor'）。
 * 成立しない構成（ミニリーグ/旧テストの少人数ロスター）では null を返し二軍なしで動く。
 * @returns {?Object} FarmRuntime（可変・cursor が進行位置）
 */
function buildFarmRuntime(league, cfg, { season, seed, registeredByTeam, injuries = [] }) {
  const F = cfg.league.farm;
  if (!F || !(F.leagues ?? []).length) return null;
  const parentIds = (cfg.league.leagues ?? []).map((l) => l.id);
  // 二軍ロスター: 支配下の登録外＋育成（どちらも p.teamId で球団へ紐づく）
  const rosterByTeam = new Map(league.teams.map((t) => [t.id, []]));
  for (const p of league.players) {
    const reg = registeredByTeam.get(p.teamId);
    if (reg && !reg.has(p.id)) rosterByTeam.get(p.teamId)?.push(p);
  }
  for (const p of league.farm ?? []) rosterByTeam.get(p.teamId)?.push(p);
  // 成立チェック: 全球団で 投手>=ローテ+2・野手>=9。満たさなければ二軍リーグは組まない（旧構成互換）。
  for (const t of league.teams) {
    const r = rosterByTeam.get(t.id) ?? [];
    const nP = r.filter((p) => p.role === 'pitcher').length;
    if (nP < cfg.league.rotationSize + 2 || r.length - nP < 9) return null;
  }
  // 二軍チーム: 親球団と同一 id/名前/監督/本拠地。リーグだけ farm 側（親リーグと同分割で対応付け）。
  const teams = league.teams.map((t) => ({
    id: t.id,
    name: t.name,
    league: F.leagues[Math.max(0, parentIds.indexOf(t.league))]?.id ?? F.leagues[0].id,
    manager: t.manager,
    park: t.park,
  }));
  const teamById = new Map(teams.map((t) => [t.id, t]));
  const leagueDh = new Map(F.leagues.map((l) => [l.id, l.dh]));
  const chartsByTeam = new Map();
  for (const t of teams) {
    const r = rosterByTeam.get(t.id);
    chartsByTeam.set(t.id, {
      dh: buildDepthChart(r, cfg, { dh: true }),
      noDh: buildDepthChart(r, cfg, { dh: false }),
    });
  }
  // 起用AI: 一軍と同じ usage（priorPitch なし＝破綻救援ガード不作動。育成試合の簡略）。
  const usageByTeam = new Map(teams.map((t) => [t.id, createUsageState(t, chartsByTeam.get(t.id), cfg, null)]));
  // 開幕IL（F2-3）: 直前オフの故障者は二軍でも出場不可（IL選手が二軍戦に出る矛盾の防止・C2.4/§10.5）。
  //   1年目は injuries が空＝無影響（F2-2 と bit 同一）。
  if (injuries.length) {
    const teamOf = new Map();
    for (const [tid, r] of rosterByTeam) for (const p of r) teamOf.set(p.id, tid);
    for (const ev of injuries) {
      const tid = teamOf.get(ev.id);
      const days = ev.daysLost ?? ev.gamesLost; // R3: 開幕IL＝前季の故障の「残り離脱 day 数」
      if (tid == null || !days) continue;
      usageByTeam.get(tid)?.injuredUntil.set(ev.id, days);
    }
  }
  // 日程: buildSchedule を farm 用の試合数ノブで再利用（リーグ内22×5相手=110試合・交流戦なし）。
  const schedCfg = {
    ...cfg,
    league: {
      ...cfg.league,
      inLeagueGamesPerOpp: F.inLeagueGamesPerOpp,
      interLeagueGamesPerOpp: F.interLeagueGamesPerOpp,
      gamesPerSeason: F.gamesPerSeason,
    },
  };
  const farmSeed = hashSeed(seed, 'farm'); // 独立の階層シード根＝一軍の乱数列と非干渉
  const schedule = buildSchedule(teams, makeRng(hashSeed(farmSeed, 'schedule')), schedCfg);
  const standings = new Map();
  for (const t of teams) {
    standings.set(t.id, { ...createTeamSeason(t.id, season), name: t.name, league: t.league, il: { w: 0, l: 0, t: 0 } });
  }
  return {
    seed: farmSeed,
    dayScale: dayScaleOf(schedule, cfg), // R3: gamesLost→day 換算（二軍日程は~110試合）
    teams,
    teamById,
    leagueDh,
    rosterByTeam, // 二軍ロスター（UI/検証用: teamId → players）
    chartsByTeam,
    usageByTeam,
    schedule,
    standings,
    stats: makeSeasonStats(season), // farmStats: 一軍と別の集計器（per-(player,season)・§17集計値のみ）
    runSplit: { dh: { games: 0, runs: 0 }, noDh: { games: 0, runs: 0 } },
    cursor: 0,
    finished: false,
    table: null,
    standingsByLeague: null,
  };
}

/**
 * 二軍の試合を throughDay（含む）まで消化する（F2-2）。二軍は観戦/介入対象外＝スキップ消化のみ
 * （onEvent 無し・box 無し）。一軍と同じ playScheduledGame を farm の独立コンテキストで回す。
 * 全日程消化で順位表を確定し finished にする。
 * @returns {Array} 消化した試合の集計行 [{day,home,away,homeScore,awayScore,tie}]
 */
function advanceFarmThrough(rt, throughDay) {
  const f = rt.farm;
  if (!f || f.finished) return [];
  const pass = {
    statFor: f.stats.statFor,
    getBat: f.stats.getBat,
    getPitch: f.stats.getPitch,
    standings: f.standings,
    runSplit: f.runSplit,
  };
  const ctx = {
    seed: f.seed,
    park: rt.park,
    parkByTeam: rt.parkByTeam, // 二軍も親球団の本拠地 park を使う（専用球場は将来拡張）
    cfg: rt.cfg,
    leagueDh: f.leagueDh,
    teamById: f.teamById,
    chartsByTeam: f.chartsByTeam,
    usageByTeam: f.usageByTeam,
    pass,
    dayScale: f.dayScale,
    season: rt.season, // R6
    // 二軍戦の故障も当季ログへ積む（R3）: 二軍で壊れた選手はそのまま昇格候補から外れる。
    onInjury: (ev) => rt.injuryLog.push({ ...ev, farm: true }),
  };
  const games = [];
  while (f.cursor < f.schedule.length && f.schedule[f.cursor].day <= throughDay) {
    const g = f.schedule[f.cursor];
    const res = playScheduledGame(ctx, g, f.cursor);
    games.push({ day: g.day, home: g.home, away: g.away, homeScore: res.homeScore, awayScore: res.awayScore, tie: res.tie });
    f.cursor++;
  }
  if (f.cursor >= f.schedule.length) {
    const { table, standingsByLeague } = finalizeStandings(f.standings);
    f.table = table;
    f.standingsByLeague = standingsByLeague; // 二軍の順位表も記録（UI: 順位タブのサブ表示素材）
    f.finished = true;
  }
  return games;
}

/**
 * 1シーズンの日次ランタイムを開幕状態で作る。
 * @param {{teams:Array,players:Array}} league generateLeague の出力
 * @param {Object} cfg createConfig()
 * @param {{season:number, seed:number, park?:Object, playerTeamId:string, injuries?:Array}} opts
 *   injuries=直前オフで確定した故障 [{id,severity,gamesLost}]。各選手を新シーズン開幕から
 *   gamesLost 日ぶん離脱(IL)させ、起用AI/ベンチが穴を埋める（C2.4/§10.5）。空配列（1年目）は無影響。
 * @returns {Object} SeasonRuntime（可変・cursor が進行位置）
 */
function startSeasonRuntime(league, cfg, { season, seed, park = NEUTRAL_PARK, playerTeamId, injuries = [], priorPitch = null, enableMoves = false, masterSeed = null }) {
  const { leagueDh, teamById, chartsByTeam, depthByTeam, registeredByTeam } = buildTeamCharts(league, cfg);
  // 本拠地球場マップ（D2・§11.2）: 球団ごとの park（generateLeague が付与）。無い球団は単一 park へ。
  const parkByTeam = new Map(league.teams.map((t) => [t.id, t.park ?? park]));
  const schedule = buildSchedule(league.teams, makeRng(hashSeed(seed, 'schedule')), cfg);
  const standings = new Map();
  for (const t of league.teams) {
    standings.set(t.id, { ...createTeamSeason(t.id, season), name: t.name, league: t.league, il: { w: 0, l: 0, t: 0 } });
  }
  const stats = makeSeasonStats(season);
  // priorPitch=前年の観測投手ライン(pid→line)。破綻救援ガード（多年運用・原則2）の"前歴"。
  //   1年目は null（前年なし）＝ガード不作動＝較正53指標が byte 不変（startYear が2年目以降のみ渡す）。
  const usageByTeam = new Map(league.teams.map((t) => [t.id, createUsageState(t, chartsByTeam.get(t.id), cfg, priorPitch)]));
  // 開幕IL: 故障選手を所属チームの起用状態に「day < gamesLost の間は不可」として載せる。
  //   day は schedule の節index（1日≒1試合）＝gamesLost をそのまま離脱日数として扱う。
  //   これで selectLineup/selectStarter/bullpenAvailable が離脱中の選手を除外し、ベンチ/控えが
  //   自然に穴を埋める（phaseA の起用AI資産）。injuries が空（1年目）なら一切効かない。
  const byId = new Map(league.players.map((p) => [p.id, p]));
  const seasonInjuries = [];
  for (const ev of injuries) {
    const p = byId.get(ev.id);
    const days = ev.daysLost ?? ev.gamesLost; // R3: 前季の故障の「残り離脱 day 数」
    if (!p || !days) continue; // 引退で消えた選手（pid不在）は無視
    const u = usageByTeam.get(p.teamId);
    if (u) u.injuredUntil.set(ev.id, days);
    seasonInjuries.push({ id: ev.id, name: p.name, teamId: p.teamId, role: p.role, primaryPos: p.primaryPos, severity: ev.severity, daysLost: days });
  }
  const runSplit = { dh: { games: 0, runs: 0 }, noDh: { games: 0, runs: 0 } };
  const finalDay = schedule.length ? schedule[schedule.length - 1].day : -1;
  // 二軍リーグ（F2-2）: 一軍と同じ day カレンダーに並走。成立しない構成（ミニリーグ）は null。
  const farm = buildFarmRuntime(league, cfg, { season, seed, registeredByTeam, injuries });
  return {
    league,
    cfg,
    season,
    seed,
    // キャリアのマスターシード（F2-3: 球団評価プロファイル＝キャリア中固定の座標。
    // 未提供（sim層/単体テスト）は season seed で代用＝同一シーズン内では同様に決定論）。
    masterSeed: masterSeed ?? seed,
    park,
    parkByTeam,
    playerTeamId,
    leagueDh,
    teamById,
    chartsByTeam,
    depthByTeam,
    registeredByTeam, // F2-2: 出場登録29人（teamId → Set(pid)。登録外＋育成＝二軍）
    farm,
    // 出場登録入替（F2-3）: enableMoves（=2年目以降のゲーム層のみ）かつ farm 成立時のみ作動。
    moves: createMovesState(league, { enableMoves, masterSeed: masterSeed ?? seed, season, farm }),
    rosterMoves: [], // 当該シーズンの昇降格ニュースログ（§17: 当該シーズンのみ・replayで再構築）
    // 育成→支配下の季節中昇格ログ（§req_20260708）: league.players/farmを直接動かすため、過去年は
    // offseasonTransitionのみのreplay近道が効かない。年末にGameState.farmPromotionLogへ畳み込んで
    // 永続化し、load時は「その年の分」をこのログからreplay適用する（day単位の再シムは不要）。
    farmPromotionLog: [],
    // 故障（R3）: gamesLost→day 換算と、当季に試合中発生した故障のログ（一軍＋二軍）。
    //   §17: 当該シーズンのみ（save には GameState 側で年ごとに畳み込んで永続）。
    dayScale: dayScaleOf(schedule, cfg),
    injuryLog: [],
    schedule,
    standings,
    stats,
    usageByTeam,
    runSplit,
    cursor: 0, // 次に処理する schedule の index（= gi。day 境界でのみ止まる）
    finalDay,
    seasonInjuries, // 当該シーズン開幕IL（ハブ表示用・[{id,name,teamId,severity,gamesLost}]・当年のみ）
    playerGameLog: [], // 自チームの試合結果（当該シーズンのみ・§17）
    // 采配介入（フェーズC1b）: 自チーム監督プロファイルの人間差し替えログ。
    //   [{ day, teamId, manager:{buntTend,stealTend,ibbTend,quickHook} }]（絶対値）。
    //   その day 以降の試合に効く。save に含め、load 時に replay で同一 day に再適用＝決定論を保つ。
    interventions: [],
    finished: false,
    table: null,
    standingsByLeague: null,
    postseason: null,
  };
}

/** 次に処理する day（節）。全消化後は finalDay+1。 */
function pendingDay(rt) {
  return rt.cursor < rt.schedule.length ? rt.schedule[rt.cursor].day : rt.finalDay + 1;
}

/**
 * 采配介入を適用（フェーズC1b）。この day に効く監督プロファイルの差し替えを teamById へ反映する。
 * live 実行でも load 後の replay でも同一 day で同一に呼ばれる＝決定論を保つ（絶対値パッチ）。
 */
function applyInterventionsForDay(rt, d) {
  for (const iv of rt.interventions) {
    if (iv.day !== d) continue;
    const team = rt.teamById.get(iv.teamId);
    if (team) team.manager = { ...team.manager, ...iv.manager };
  }
}

/**
 * 1日（節）ぶんの試合をまとめて消化する。schedule は day 昇順・同一 day が連続するため、
 * cursor は必ず day 境界で止まる（save/load の cursor 再走が day 単位で正確になる）。
 * @param {Object} rt SeasonRuntime
 * @param {{collectPlayerEvents?:boolean}} opts collectPlayerEvents=自チーム試合の観戦実況イベントを返す
 * @returns {{day:number, games:Array, playerGames:Array, playerEvents:?Array, seasonEnded:boolean}}
 *   playerEvents は §17（生イベントは当該シーズンのみ・永続しない）に従い返却のみ・rt/save には積まない。
 */
function advanceRuntimeDay(rt, opts = {}) {
  if (rt.finished) return { day: pendingDay(rt), games: [], farmGames: [], rosterMoves: [], playerGames: [], playerEvents: null, seasonEnded: false };
  const d = pendingDay(rt);
  applyInterventionsForDay(rt, d); // この day 以降に効く采配差し替えを反映（live/replay 共通）
  // 出場登録の入替（F2-3）: その日の試合前に IL補充/復帰・成績入替を適用（2年目以降のみ。
  // 1年目・sim層は rt.moves=null で完全不作動＝simulateSeason と bit 同一を維持・鉄則7）。
  const rosterMoves = applyRosterMovesForDay(rt, d);
  const pass = {
    statFor: rt.stats.statFor,
    getBat: rt.stats.getBat,
    getPitch: rt.stats.getPitch, // 破綻救援ガードの当年観測（多年運用・原則2）
    standings: rt.standings,
    runSplit: rt.runSplit,
  };
  const ctx = {
    seed: rt.seed,
    park: rt.park,
    parkByTeam: rt.parkByTeam,
    cfg: rt.cfg,
    leagueDh: rt.leagueDh,
    teamById: rt.teamById,
    chartsByTeam: rt.chartsByTeam,
    usageByTeam: rt.usageByTeam,
    pass,
    dayScale: rt.dayScale,
    season: rt.season, // R6: 直近故障の残債（指数減衰）の計算に使う
    // 故障ログ（R3・当季のみ・§17集計値）: オフに後遺/故障歴へ落とし、save に永続して
    //   load の replay（season を再シムしない）で同一の真値を再構築する（farmPromotionLog と同方式）。
    onInjury: (ev) => rt.injuryLog.push(ev),
  };
  const games = [];
  const playerGames = [];
  let playerEvents = null;
  while (rt.cursor < rt.schedule.length && rt.schedule[rt.cursor].day === d) {
    const g = rt.schedule[rt.cursor];
    const isPlayer = g.home === rt.playerTeamId || g.away === rt.playerTeamId;
    // 観戦実況/ボックススコア: 自チーム試合は常時イベント収集（onEvent は乱数非消費＝
    // 観戦/ダイジェスト/スキップのどれでも試合結果は不変）。生イベントは box 集計を組んだら
    // 捨て、観戦用（opts.collectPlayerEvents）のときだけ返却する（§17: 生イベント非永続）。
    let events = null;
    pass.onEvent = isPlayer ? (e) => events.push(e) : undefined;
    if (pass.onEvent) events = [];
    const res = playScheduledGame(ctx, g, rt.cursor);
    const rec = {
      day: d,
      home: g.home,
      away: g.away,
      homeScore: res.homeScore,
      awayScore: res.awayScore,
      tie: res.tie,
      innings: res.innings,
    };
    if (isPlayer && events) {
      // E4: 日程・結果タブの簡易ボックススコア（両軍打者/投手の当日ライン・集計行のみ）。
      // live も load の replay も同一イベント列から再構築される（決定論・save は集計値のみ）。
      rec.box = buildBoxScore(events);
    }
    games.push(rec);
    if (isPlayer) {
      rt.playerGameLog.push(rec); // 集計値のみ（イベントは積まない・§17）
      playerGames.push(rec);
      if (opts.collectPlayerEvents && events) playerEvents = events;
    }
    rt.cursor++;
  }
  // 二軍の同日試合（F2-2）: 一軍と同じ day カレンダーで並走消化（<=d ＝ 一軍が全休日を飛ばしても
  // 取り残さない）。二軍は独立シード根（hashSeed(seed,'farm')）＝一軍の結果は二軍の有無で byte 不変。
  const farmGames = advanceFarmThrough(rt, d);
  let seasonEnded = false;
  if (rt.cursor >= rt.schedule.length) {
    finalizeRuntime(rt);
    seasonEnded = true;
  }
  return { day: d, games, farmGames, rosterMoves, playerGames, playerEvents, seasonEnded };
}

/** レギュラーシーズン終了時の確定（順位表＋ポストシーズン）。simulateSeason と同一の座標/シード。 */
function finalizeRuntime(rt) {
  // 二軍の残り日程を洗い流す（F2-2）: 通常は二軍(~110試合)が一軍(143試合)より先に終わるが、
  // 日程直列化の揺らぎで残っても、一軍シーズン確定時に必ず全消化する（=二軍全日程消化の保証）。
  advanceFarmThrough(rt, Infinity);
  const { table, standingsByLeague } = finalizeStandings(rt.standings);
  rt.table = table;
  rt.standingsByLeague = standingsByLeague;
  let postseason = null;
  if ((rt.cfg.league.leagues ?? []).length === 2) {
    postseason = simulatePostseason({
      rankings: rt.cfg.league.leagues.map((l) => ({ id: l.id, rows: standingsByLeague[l.id] ?? [] })),
      chartsByTeam: rt.chartsByTeam,
      teamById: rt.teamById,
      leagueDh: rt.leagueDh,
      cfg: rt.cfg,
      seed: hashSeed(rt.seed, 'postseason'),
      season: rt.season,
      park: rt.park,
      parkByTeam: rt.parkByTeam,
    });
  }
  rt.postseason = postseason;
  rt.finished = true;
}


// ===== src/game/injury.mjs =====
// ============================================================================
// 故障の「オフシーズン処理」（§10.5）— 当季に**試合中に発生した**故障の結果を真値へ落とす
//
// ★R3（2026-07-13）: 故障の発生自体は src/sim/injury.mjs ＋ sim/game.mjs へ移した
//   （試合中の露出イベントごとのハザード）。旧 applyInjuries（オフに1選手1回ロールして
//   翌年の開幕ILにする簡略化）は撤去。ここに残るのは「当季の故障ログを消費して
//   故障歴を積み・後遺（能力減）を真値へ適用する」オフシーズンの後処理のみ。
//
// なぜ分けるか:
//   - **真値はシーズン中に動かさない**（C2a の不変量「1年目シーズン中に真値/年齢は動かない」）。
//     試合中に確定するのは「離脱の事実（severity/gamesLost）」だけで、能力への影響はオフに入る。
//   - **load の replay 可能性**: 過去年のオフは season を再シムせずに再走する（index.mjs load）。
//     故障が試合由来になったので、当季の故障ログを save に永続し（state.injuryLog）、
//     replay ではそのログを渡して同一の後遺・故障歴を再構築する（farmPromotionLog と同じ方式）。
// ============================================================================


/**
 * 当季に発生した故障イベントを消費し、故障歴の積み上げと後遺（真値の一時減）を適用する。
 * オフシーズン遷移から呼ばれる純関数（in-place・乱数非使用＝決定論・順序非依存）。
 *
 * @param {Array} players league.players（引退で消えた選手は events 側で無視される）
 * @param {Array<{id:string, severity:string, gamesLost:number}>} events 当季の故障ログ
 * @param {Object} cfg createConfig()
 * @param {number} year 当該シーズンの年（履歴に記録）
 * @returns {Array} 適用した故障イベント（サマリ表示用。players に居ない id は落とす）
 */
function applySeasonInjuries(players, events, cfg, year) {
  const byId = new Map(players.map((p) => [p.id, p]));
  const applied = [];
  // 決定論・順序非依存: id 昇順→同一選手内は day 昇順で適用する（ログの並びに依存しない）。
  const sorted = events
    .slice()
    .sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : (a.day ?? 0) - (b.day ?? 0)));
  for (const ev of sorted) {
    const p = byId.get(ev.id);
    if (!p) continue; // 引退/移籍で league.players に居ない（＝安全弁）
    const hist = p.trueAbility.career.injuryHistory ?? (p.trueAbility.career.injuryHistory = []);
    hist.push({ year, site: ev.site ?? null, siteName: ev.siteName ?? null, severity: ev.severity, gamesLost: ev.gamesLost });
    applyAftereffect(p, ev, cfg.tuning.injury);
    applied.push({ id: p.id, year, site: ev.site ?? null, siteName: ev.siteName ?? null, severity: ev.severity, gamesLost: ev.gamesLost });
  }
  return applied;
}

/**
 * 後遺（§10.5・★R6 文献調査に基づく再設計）。
 *
 * 【旧実装の誤り】故障するたびに走力・初動・パワー・EV を恒久的に削っていた。
 *   これは実証と食い違う。**「率は戻るが、出場量は戻らない」**（Camp et al., n=216 / Lansdown & Feeley, n=80）:
 *     - トミー・ジョン術後: **K%/BB%/FIP は有意差なし（＝率は戻る）**。球速だけ −0.7mph
 *       （35歳以上は −2.9mph と大きい）
 *     - 一方 **登板数 120.7→72.6・投球回 338.1→223.6 は術後3年平均でも回復しない（P<.001）**
 *     - ACL再建後も ERA/WHIP/打率/OBP/SLG はすべて有意差なし（Erickson, n=124）
 *     - 肩関節唇修復後は **キャリア長そのものが短縮**（投手 2.3年 vs 対照 5.8年）
 *
 * 【新実装】削るのは "出場量" の側:
 *   - 軽症: 恒久的な能力低下なし（率は戻る）
 *   - 重症の投手: **スタミナ**（＝登板数/イニングの上限）と球速を削る。35歳以上は球速を大きく削る
 *   - 重症の下肢（ハム/膝/足首/鼠径）: 走力・初動を削る（走塁・守備範囲＝身体的な"量"）
 *   - 重症の肩: 引退圧を上げる（キャリア長が縮む）
 *   打撃の"率"（contact/eye/la）とパワー/EV は **触らない**。
 */
function applyAftereffect(p, ev, inj) {
  const A = inj.aftereffect;
