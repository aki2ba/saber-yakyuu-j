  const xh = b.xB1 + b.xB2 + b.xB3 + b.xHR;
  const xtb = b.xB1 + 2 * b.xB2 + 3 * b.xB3 + 4 * b.xHR;
  const xba = div(xh, b.ab);
  const xslg = div(xtb, b.ab);
  const W = lc.linearWeights || LINEAR_WEIGHTS;
  const ibb = b.ibb || 0;
  const xDenom = b.ab + b.bb - ibb + b.sf + b.hbp; // wOBAと同一の分母
  const xNum = W.bb * (b.bb - ibb) + W.hbp * b.hbp + W.b1 * b.xB1 + W.b2 * b.xB2 + W.b3 * b.xB3 + W.hr * b.xHR;
  const xRaw = xDenom ? xNum / xDenom : 0;
  const xwoba = lc.wobaScale ? lc.wobaScale * xRaw : 0;

  // --- B3a: 打球分類・質（分母=bbEvents）。GB/LD/FB/PU%・Pull/Cent/Oppo%・Barrel/HardHit/SweetSpot% ---
  const bbe = b.bbEvents;
  // --- B3a: 伝統系の派生（OPS+/wRC/TB/XBH/SecA/BB/K/ISO） ---
  const opsPlus = lc.lgOBP && lc.lgSLG ? 100 * (obp / lc.lgOBP + slg / lc.lgSLG - 1) : 100;
  const wrc = wraa + (lc.lgRunsPerPA || 0) * b.pa; // wRC = wRAA + lgR/PA×PA
  const xbh = b.b2 + b.b3 + b.hr; // 長打(二塁打+三塁打+本塁打)
  const secA = div(tb - b.h + b.bb + (b.sb - b.cs), b.ab); // Secondary Average

  return {
    pa: b.pa,
    ab: b.ab,
    h: b.h,
    hr: b.hr,
    rbi: b.rbi,
    sb: b.sb,
    bb: b.bb,
    so: b.so,
    avg,
    obp,
    slg,
    ops: obp + slg,
    iso: slg - avg,
    babip,
    kPct: div(b.so, b.pa),
    bbPct: div(b.bb, b.pa),
    woba,
    wraa,
    wrcPlus,
    tb,
    // --- B3a 追加 ---
    xba,
    xslg,
    xwoba,
    opsPlus,
    wrc,
    xbh,
    secA,
    bbK: div(b.bb, b.so),
    gbPct: div(b.bbGB, bbe),
    ldPct: div(b.bbLD, bbe),
    fbPct: div(b.bbFB, bbe),
    puPct: div(b.bbPU, bbe),
    pullPct: div(b.bbPull, bbe),
    centPct: div(b.bbCent, bbe),
    oppoPct: div(b.bbOppo, bbe),
    barrelPct: div(b.barrels, bbe),
    hardHitPct: div(b.hardHits, bbe),
    sweetSpotPct: div(b.sweetSpots, bbe),
    evAvg: div(b.evSum, bbe),
    evMax: b.evMax,
    bbEvents: bbe,
    // --- B2 文脈指標（RE24/WPA/LI・§B2。context有効時のみ非0） ---
    re24: b.re24,
    wpa: b.wpa,
    aLI: div(b.liSum, b.pa), // 打席加重レバレッジ（リーグ平均=1.0）
    wpaLI: b.wpaLiSum, // 文脈中立WPA（Σ 打席WPA/打席LI）
    clutch: div(b.wpa, div(b.liSum, b.pa)) - b.wpaLiSum, // Clutch = WPA/aLI − WPA/LI
  };
}

/**
 * 走塁指標（§6）。現状 wSB のみ実装（UBR/wGDPは2-5/2-6で追加）。
 * BsR = wSB + UBR + wGDP。
 */
function playerBaserunning(ps, cfg, lc) {
  const b = ps.batting;
  // wSB（監査C1）: リーグ基準 lgwSB×(一塁到達機会) を控除して中心化する。
  // 走らない選手は僅かに負の基準、盗塁者は正味加点というゼロ点になり、リーグwSB総和≈0。
  const sbOpp = (b.b1 || 0) + (b.bb || 0) + (b.hbp || 0) - (b.ibb || 0);
  const lgwSBrate =
    lc && lc.lgSBOpp ? (lc.lgSB * cfg.tuning.run.runSB + lc.lgCS * cfg.tuning.run.runCS) / lc.lgSBOpp : 0;
  const wSB = b.sb * cfg.tuning.run.runSB + b.cs * cfg.tuning.run.runCS - lgwSBrate * sbOpp;
  const br = ps.baserunning || {};
  // wGDP: 期待併殺(リーグ率×機会)より少なく併殺した分がプラス。§6
  const gdpOpp = br.gdpOpp || 0;
  const wGDP =
    lc && lc.lgGDPrate != null ? (lc.lgGDPrate * gdpOpp - (b.gdp || 0)) * Math.abs(cfg.tuning.gdp.runGDP) : 0;
  // UBR: 追加進塁を平均より多く取った分がプラス（走者Speed/IQ）。§6
  const advOpp = br.advOpp || 0;
  const ubr =
    lc && lc.lgAdvRate != null ? ((br.advTaken || 0) - lc.lgAdvRate * advOpp) * cfg.tuning.run.runUBR : 0;
  return {
    sb: b.sb,
    cs: b.cs,
    sbPct: b.sb + b.cs ? b.sb / (b.sb + b.cs) : 0,
    gdp: b.gdp,
    wSB,
    ubr,
    wGDP,
    bsr: wSB + ubr + wGDP,
    // --- B3b 走塁の追加集計（XBT%・Spd・§B3b） ---
    xbt: div(br.advTaken || 0, br.advOpp || 0), // 追加進塁率（advTaken/advOpp）
    spd: cfg ? spdScore(ps, cfg) : 0, // 簡易Spd（0-10・俊足で高い）
    advOpp: br.advOpp || 0,
    advTaken: br.advTaken || 0,
    // --- B2 文脈指標（走塁イベントのRE24/WPA・§B2。context有効時のみ非0） ---
    re24: br.re24 || 0, // 盗塁/追加進塁の得点期待値寄与
    wpa: br.wpa || 0, // 盗塁/追加進塁の勝率寄与
  };
}

/**
 * 投手指標（ERA/FIP ＋ B3a: xFIP/SIERA/kwERA/ERA-/FIP-/xFIP-/K-BB%/LOB%/被打球分類/HR-FB/QS）。
 * FIPはFG式 (13HR+3(BB−IBB+HBP)−2K)/IP + C（敬遠は投手の技量でないため除外・S3）。
 * @param {Object} ps PlayerSeason
 * @param {Object} lc リーグ定数（lgHRFB/lgERA/lgFIP/fipConstant を含む）
 * @param {Object} [cfg] 設定（SIERA/kwERA係数=cfg.tuning.metrics。省略時は METRICS_CONST 既定）
 */
function playerPitching(ps, lc, cfg = null) {
  const p = ps.pitching;
  const ip = p.outs / 3;
  const m = (cfg && cfg.tuning && cfg.tuning.metrics) || METRICS_CONST;
  const uBBhbp = p.bb - (p.ibb || 0) + p.hbp;
  const fipRaw = ip ? (13 * p.hr + 3 * uBBhbp - 2 * p.so) / ip : 0;
  const fip = ip ? fipRaw + (lc.fipConstant || 0) : 0;
  const era = div(p.er * 9, ip);
  const kPct = div(p.so, p.bf);
  const bbPct = div(p.bb, p.bf);

  // xFIP（§B3a）: 被HRを 被FB×lgHR/FB に置換（FG式）。fipConstant共通ゆえ リーグxFIP=リーグFIP。
  const xHRexp = p.bbFB * (lc.lgHRFB || 0);
  const xfipRaw = ip ? (13 * xHRexp + 3 * uBBhbp - 2 * p.so) / ip : 0;
  const xfip = ip ? xfipRaw + (lc.fipConstant || 0) : 0;

  // SIERA（FanGraphs公開式・Swartz）。netGB²項は符号保存（GB>FB+PU で好投側=負寄与）。
  const pa = p.bf;
  const soR = div(p.so, pa);
  const bbR = div(p.bb, pa);
  const netGB = div(p.bbGB - p.bbFB - p.bbPU, pa);
  const S = m.siera;
  const siera = pa
    ? S.c0 +
      S.cSO * soR +
      S.cBB * bbR +
      S.cNet * netGB +
      S.cSO2 * soR * soR +
      S.cNet2 * netGB * Math.abs(netGB) +
      S.cSOnet * soR * netGB +
      S.cBBnet * bbR * netGB
    : 0;

  // kwERA = 5.40 − 12×(K% − BB%)
  const kwera = m.kwERA.c0 - m.kwERA.k * (kPct - bbPct);

  // LOB% = (H+BB+HBP−R)/(H+BB+HBP−1.4HR)（残塁率）
  const lobDen = p.h + p.bb + p.hbp - 1.4 * p.hr;
  const lobPct = lobDen ? (p.h + p.bb + p.hbp - p.r) / lobDen : 0;

  // 被打球分類（分母=bbEvents）と HR/FB
  const bbe = p.bbEvents;

  return {
    g: p.g,
    gs: p.gs,
    ip,
    bf: p.bf,
    w: p.w,
    l: p.l,
    sv: p.sv,
    hld: p.hld,
    so: p.so,
    bb: p.bb,
    h: p.h,
    hr: p.hr,
    era,
    fip,
    whip: div(p.h + p.bb, ip),
    kPer9: div(p.so * 9, ip),
    bbPer9: div(p.bb * 9, ip),
    hrPer9: div(p.hr * 9, ip),
    kPct,
    bbPct,
    // --- B3a 追加 ---
    xfip,
    siera,
    kwera,
    kbbPct: kPct - bbPct,
    lobPct,
    // リーグ=100基準（低いほど良い。パーク補正はフェーズD）
    eraMinus: lc.lgERA ? (era / lc.lgERA) * 100 : 100,
    fipMinus: lc.lgFIP ? (fip / lc.lgFIP) * 100 : 100,
    xfipMinus: lc.lgFIP ? (xfip / lc.lgFIP) * 100 : 100,
    gbPct: div(p.bbGB, bbe),
    ldPct: div(p.bbLD, bbe),
    fbPct: div(p.bbFB, bbe),
    puPct: div(p.bbPU, bbe),
    hrFbPct: div(p.hr, p.bbFB),
    qs: p.qs,
    bbEvents: bbe,
    // --- B2 文脈指標（RE24/WPA/LI・§B2。context有効時のみ非0） ---
    re24: p.re24,
    wpa: p.wpa,
    pLI: div(p.liSum, p.bf), // 投手の平均レバレッジ（リーグ平均=1.0）
    gmLI: div(p.gmLiSum, p.gmLiN), // 登板時レバレッジ（救援WARのレバレッジ加重に使用）
    wpaLI: p.wpaLiSum, // 文脈中立WPA（Σ 被WPA/打席LI）
    clutch: div(p.wpa, div(p.liSum, p.bf)) - p.wpaLiSum, // Clutch = WPA/pLI − WPA/LI
    sd: p.sd, // シャットダウン（1登板WPA ≥ +0.06）
    md: p.md, // メルトダウン（1登板WPA ≤ −0.06）
  };
}


// ===== src/sim/war.mjs =====
// ============================================================================
// WAR算出（2-9 / §9）— 企画の一番の売り「WARまで自然に出る」
//
// 野手WAR = (wRAA + BsR + UZR + posAdj + repl) / RPW
// 投手WAR = (lgFIP − FIP)/9 × IP / RPW + (IP/9) × replPer9(役割)
//   役割別代替水準（S3・FanGraphs方式 B-5）: 先発 0.12 / 救援 0.03 wins/9IP を GS/G で按分
//   （旧 replFIP = lgFIP × replFipMult は廃止）
//
// 各項はここまでの副産物（wRAA=1-7, BsR=2-4/2-6, UZR=2-8, posAdj=位置補正, repl=代替水準）。
// 位置価値は posAdj の一箇所のみで計上（UZR側で二重計上しない・レビューB-5）。
// 試合数依存定数(1350/600)は §18/M3 に従い config・143試合基準を尊重。
// ============================================================================




/** 守備位置補正（runs）。各ポジションの守備イニングに比例（§9・BR式 /1350）。 */
function posAdjRuns(ps) {
  let adj = 0;
  for (const pos of Object.keys(ps.fielding.positionOuts)) {
    const innings = ps.fielding.positionOuts[pos] / 3;
    adj += (POSITION_ADJUST_PER_1350[pos] || 0) * (innings / 1350);
  }
  return adj;
}

/** 野手WAR（構成要素つき） */
function hitterWAR(ps, cfg, lc) {
  const bat = playerBatting(ps, lc);
  const bsr = playerBaserunning(ps, cfg, lc).bsr;
  const uzr = uzrRuns(ps, cfg, lc);
  const posAdj = posAdjRuns(ps);
  const repl = (ps.batting.pa / 600) * cfg.tuning.replBatterPer600;
  const rpw = lc.rpw || 9.3;
  const raRuns = bat.wraa + bsr + uzr + posAdj + repl;
  return {
    wraa: bat.wraa,
    bsr,
    uzr,
    posAdj,
    repl,
    war: raRuns / rpw,
  };
}

/** 投手WAR（役割別代替水準・S3）。平均比の価値 + 役割別の代替水準ボーナス。
 *  救援WARのレバレッジ加重（§B2・FG方式・req_1 §8.3「WARの死角」の完成）:
 *    登板時レバレッジ gmLI があるとき、救援ぶんの代替水準対比runに (1+gmLI)/2 を乗じる。
 *    先発は不変（gsShare で加重＝gsShare=1 なら mult=1）。gmLI 未算出（文脈指標オフ＝
 *    gmLiN=0）のときは mult=1 に落ちるため、既存の較正済みWARは完全に不変（30指標を守る）。 */
function pitcherWAR(ps, cfg, lc) {
  const pit = playerPitching(ps, lc);
  const lgFIP = lc.lgFIP || 3.8;
  const rpw = lc.rpw || 9.3;
  // 役割 = GS/G 比で先発/救援を按分（スイングマンは中間の代替水準になる）
  const gsShare = pit.g ? pit.gs / pit.g : 0;
  const replPer9 = gsShare * cfg.tuning.replStarterPer9 + (1 - gsShare) * cfg.tuning.replRelieverPer9;
  let war = (((lgFIP - pit.fip) / 9) * pit.ip) / rpw + (pit.ip / 9) * replPer9;
  // レバレッジ加重（救援ぶんのみ・gmLI があるとき）
  const gmLiN = ps.pitching.gmLiN || 0;
  const gmLI = gmLiN ? ps.pitching.gmLiSum / gmLiN : null;
  const leverageMult = gmLI != null ? 1 + (1 - gsShare) * ((1 + gmLI) / 2 - 1) : 1;
  war *= leverageMult;
  return { ip: pit.ip, fip: pit.fip, replPer9, gmLI, leverageMult, war };
}

/** 選手のWAR（役割で分岐） */
function playerWAR(player, ps, cfg, lc) {
  return player.role === 'pitcher' ? pitcherWAR(ps, cfg, lc).war : hitterWAR(ps, cfg, lc).war;
}

function selfCheck(seed = 20260701, n = 8) {

      // 役割は観測値（GS/G過半）で判定（S4。真値のローテ表は見ない＝statlineから湧く原則）
      const role = m.g && m.gs * 2 >= m.g ? '先発' : '救援';
      return { id: s.playerId, name: p ? p.name : s.playerId, team: state.teamName.get(s.teamId) || s.teamId, role, war: pitcherWAR(s, state.cfg, state.lc).war, ...m };
    });
  c.append(statTable(data, PIT_COLS, ['era', 'fip', 'whip', 'xfip', 'siera', 'kwera'], ['bbPct', 'kbbPct', 'lobPct'], 'war', 1));
}

// --- 守備 -----------------------------------------------------------------
function renderFielding(c) {
  const data = state.res.playerSeasons
    .map((s) => {
      let outs = 0;
      let mainPos = '';
      let mx = -1;
      for (const k of Object.keys(s.fielding.positionOuts)) {
        outs += s.fielding.positionOuts[k];
        if (s.fielding.positionOuts[k] > mx) { mx = s.fielding.positionOuts[k]; mainPos = k; }
      }
      const p = state.byId.get(s.playerId);
      return { id: s.playerId, name: p ? p.name : s.playerId, team: state.teamName.get(s.teamId) || s.teamId, pos: mainPos, inn: outs / 3, oaa: centeredOAAOuts(s, state.lc), uzr: uzrRuns(s, state.cfg, state.lc), e: s.fielding.e };
    })
    .filter((d) => d.inn >= 100 && d.pos !== 'DH'); // DHは守備表から除外（守備位置補正はWAR表に反映）
  const cols = [['name', '選手', 'left'], ['team', 'ﾁｰﾑ', 'left'], ['pos', '守', 'left'], ['inn', '守備回'], ['oaa', 'OAA'], ['uzr', 'UZR'], ['e', '失策']];
  c.append(statTable(data, cols, [], [], 'uzr', 1));
}

// --- 汎用ソート可能テーブル ------------------------------------------------
function statTable(data, cols, fmtDec3, fmtPct, defaultSort, dec = 0) {
  const wrap = el('div', { class: 'tablewrap' });
  const render = () => {
    wrap.innerHTML = '';
    const { key, dir } = state.sort;
    const sorted = [...data].sort((a, b) => {
      const av = a[key]; const bv = b[key];
      if (typeof av === 'string') return dir * av.localeCompare(bv);
      return dir * ((av ?? 0) - (bv ?? 0));
    }).slice(0, 100);
    const head = el('tr', {}, cols.map(([k, label, align]) =>
      el('th', { class: (align || '') + (state.sort.key === k ? ' sorted' : ''), title: TIP[k] || '', onclick: () => { state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : -1 }; render(); } }, label + (state.sort.key === k ? (dir < 0 ? ' ▼' : ' ▲') : '')),
    ));
    const rows = sorted.map((d) => el('tr', { class: 'clickable', onclick: () => openModal(d.id) }, cols.map(([k, , align]) => {
      let v = d[k];
      if (typeof v === 'number') {
        if (fmtDec3.includes(k)) v = fmt3(v);
        else if (fmtPct.includes(k)) v = pct(v);
        else if (k === 'ip' || k === 'inn') v = v.toFixed(1);
        else if (k === 'war') v = v.toFixed(1);
        else if (PLUSMINUS.has(k)) v = (v > 0 ? '+' : '') + v.toFixed(1);
        else if (!Number.isInteger(v)) v = v.toFixed(dec);
      }
      return td(v, align);
    })));
    wrap.append(el('table', { class: 'stat' }, [el('thead', {}, head), el('tbody', {}, rows)]));
  };
  state.sort = { key: defaultSort, dir: defaultSort === 'era' || defaultSort === 'fip' ? 1 : -1 };
  render();
  return wrap;
}

function openModal(playerId) {
  const p = state.byId.get(playerId);
  const s = state.res.statsById.get(playerId);
  if (!p || !s) return;
  const isPitcher = p.role === 'pitcher';
  const overlay = el('div', { class: 'overlay', onclick: (e) => { if (e.target === overlay) overlay.remove(); } });
  const box = el('div', { class: 'modal' });
  box.append(el('div', { class: 'modalhead' }, [
    el('div', {}, [el('span', { class: 'pname' }, p.name), el('span', { class: 'muted' }, `  ${state.teamName.get(p.teamId) || ''} / ${isPitcher ? '投手' : primaryPos(p)} / ${p.age}歳 / ${handLabel(p.throws)}投${handLabel(p.bats)}打`)]),
    el('button', { class: 'link', onclick: () => overlay.remove() }, '✕'),
  ]));
  const modalTabs = isPitcher
    ? [['basic', '基本'], ['pitch', '投球'], ['context', '文脈']]
    : [['basic', '基本'], ['batted', '打球'], ['splits', 'スプリット'], ['context', '文脈'], ['field', '守備成分']];
  let cur = 'basic';
  const rest = el('div');
  box.append(rest);
  const render = () => {
    rest.innerHTML = '';
    const bar = el('div', { class: 'modaltabs' }, modalTabs.map(([k, label]) =>
      el('button', { class: 'mtab' + (cur === k ? ' active' : ''), onclick: () => { cur = k; render(); } }, label)));
    const body = el('div', { class: 'modalbody' });
    rest.append(bar, body);
    if (cur === 'basic') renderModalBasic(body, p, s, isPitcher);

    else if (cur === 'field') renderModalField(body, s);
    else if (cur === 'pitch') renderModalPitch(body, s);
  };
  render();
  overlay.append(box);
  document.getElementById('app').append(overlay);
}

  ]);

  if (role === 'pitcher') {

    groups.push(section('球種', p.pitches.map((pi) => bar(pitchName(pi.type), pi.current))));
  } else {
    const b = t.batting;
    groups.push(section('打撃', [bar('EV適性', b.ev), bar('LA適性', b.la), bar('引張', b.pull), bar('コンタクト', b.contact), bar('選球眼', b.eye)]));

function section(title, bars) { return el('div', { class: 'abgroup' }, [el('div', { class: 'abtitle' }, title), ...bars]); }
function barColor(v) { return v >= 70 ? '#e8b84b' : v >= 55 ? '#7bc47f' : v >= 45 ? '#cfc8b0' : '#9a8f78'; }

// --- スプレーチャート SVG（1-8, Lv2）--------------------------------------
function sprayChart(balls) {
  const W = 320; const H = 300; const hx = W / 2; const hy = H - 24; const scale = (H - 40) / 135;
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, class: 'spray' });
  // 内野・外野の目安円 + フェンス弧
  const pt = (deg, dist) => {
    const r = (deg * Math.PI) / 180;
    return [hx + dist * scale * Math.sin(r), hy - dist * scale * Math.cos(r)];
  };
  // フェア地帯（ファウルライン ±45°）
  const [lx, ly] = pt(-45, 125); const [rx, ry] = pt(45, 125);
  svg.append(svgEl('path', { d: `M ${hx} ${hy} L ${lx} ${ly} A ${125 * scale} ${125 * scale} 0 0 1 ${rx} ${ry} Z`, fill: '#123d2a', stroke: '#2f6b4a' }));
  // 内野ダイヤ目安
  const [b2x, b2y] = pt(0, 38);
  svg.append(svgEl('circle', { cx: b2x, cy: b2y, r: 3, fill: '#c9a06a' }));
  // 打球ドット
  for (const b of balls) {
    const [x, y] = pt(b.sprayDeg, Math.min(b.distanceM, 130));
    svg.append(svgEl('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: b.result === 'HR' ? 3.2 : 2.2, fill: ballColor(b.result), opacity: 0.85 }));
  }
  svg.append(svgEl('circle', { cx: hx, cy: hy, r: 3, fill: '#fff' }));
  return svg;
}
function ballColor(res) { return res === 'HR' ? '#e8b84b' : res === '2B' || res === '3B' ? '#5aa9e6' : res === '1B' ? '#f4f1e6' : '#6d7f74'; }

// --- EV/LA 散布図 SVG（打球速度×角度・§B3 打球タブ）------------------------
// 横=打球角度(LA -20〜60°) 縦=打球速度(EV 80〜200km/h)。Barrel帯の目安として Sweet-Spot(8-32°)・
// HardHit(152km/h) のガイドを薄く描く。色は打球結果（HR=金/長打=青/単打=白/アウト=灰）。
function evLaChart(balls) {
  const W = 300; const H = 220; const padL = 30; const padB = 22; const top = 8; const right = 8;
  const laMin = -20; const laMax = 60; const evMin = 80; const evMax = 200;
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, class: 'evla' });
  const plotW = W - padL - right; const plotH = H - top - padB;
  const xOf = (la) => padL + ((cl(la, laMin, laMax) - laMin) / (laMax - laMin)) * plotW;
  const yOf = (ev) => top + (1 - (cl(ev, evMin, evMax) - evMin) / (evMax - evMin)) * plotH;
  svg.append(svgEl('rect', { x: padL, y: top, width: plotW, height: plotH, fill: '#0c3122', stroke: '#2f6b4a' }));
  // Sweet-Spot 角度帯 8-32°（縦帯）
  svg.append(svgEl('rect', { x: xOf(8).toFixed(1), y: top, width: (xOf(32) - xOf(8)).toFixed(1), height: plotH, fill: '#1c4a34', opacity: 0.6 }));
  // HardHit 閾値 152km/h（横ガイド）
  svg.append(svgEl('line', { x1: padL, y1: yOf(152).toFixed(1), x2: (padL + plotW).toFixed(1), y2: yOf(152).toFixed(1), stroke: '#c9a06a', 'stroke-dasharray': '3 3', opacity: 0.6 }));
  for (const b of balls) {
    svg.append(svgEl('circle', { cx: xOf(b.laDeg).toFixed(1), cy: yOf(b.evKmh).toFixed(1), r: b.result === 'HR' ? 2.8 : 2, fill: ballColor(b.result), opacity: 0.8 }));
  }
  return svg;
}

// --- チーム集計タブ（打撃/投手/守備/走塁のリーグ内順位・§B3 UI）---------------
function teamAggregates() {
  const teamPS = new Map();
  for (const s of state.res.playerSeasons) {
    if (!teamPS.has(s.teamId)) teamPS.set(s.teamId, []);
    teamPS.get(s.teamId).push(s);
  }
  const standRow = new Map(state.res.standings.map((t) => [t.teamId, t]));
  const out = [];
  for (const [tid, list] of teamPS) {
    const bat = leagueBatting(list);
    const pit = leaguePitching(list);
    const ip = pit.ip;
    const fipRaw = ip ? (13 * pit.hr + 3 * (pit.bb - (pit.ibb || 0) + pit.hbp) - 2 * pit.so) / ip : 0;
    const fip = ip ? fipRaw + (state.lc.fipConstant || 0) : 0;
    let uzr = 0; let bsr = 0; let e = 0; let sb = 0; let cs = 0;
    for (const s of list) {
      uzr += uzrRuns(s, state.cfg, state.lc);
      bsr += playerBaserunning(s, state.cfg, state.lc).bsr;
      e += s.fielding.e || 0;
      sb += s.batting.sb || 0;
      cs += s.batting.cs || 0;
    }
    const st = standRow.get(tid);
    out.push({
      id: tid, name: state.teamName.get(tid) || tid, league: st ? st.league : null,
      rs: st ? st.rs : 0, ra: st ? st.ra : 0,
      avg: bat.avg, obp: bat.obp, slg: bat.slg, ops: bat.ops, hr: bat.hr, sb, cs,
      era: pit.era, fip, whip: pit.whip, kPer9: ip ? (pit.so * 9) / ip : 0, so: pit.so,
      uzr, e, bsr,
    });
  }
  return out;
}

  { title: '守備', sort: 'uzr', asc: false, dec3: [],
    cols: [['name', '球団', 'left'], ['uzr', 'ΣUZR'], ['e', '失策']] },
  { title: '走塁', sort: 'bsr', asc: false, dec3: [],
    cols: [['name', '球団', 'left'], ['bsr', 'ΣBsR'], ['sb', '盗塁'], ['cs', '盗塁死']] },
];

function renderTeams(c) {
  const rows = teamAggregates();
  const byLg = new Map();
  for (const r of rows) { const k = r.league ?? 'ALL'; if (!byLg.has(k)) byLg.set(k, []); byLg.get(k).push(r); }
  const leagues = (state.cfg.league.leagues ?? []).length ? state.cfg.league.leagues : [{ id: 'ALL', name: '総合' }];
  c.append(el('div', { class: 'muted', style: 'margin:4px 0' }, 'チーム集計（各リーグ内順位）。数値の意味は列見出しにカーソルで表示。'));
  const teamCell = (k, v, dec3) => {
    if (typeof v !== 'number') return v;
    if (dec3.includes(k)) return fmt3(v);
    if (k === 'era' || k === 'fip' || k === 'whip' || k === 'kPer9') return v.toFixed(2);
    if (k === 'uzr' || k === 'bsr') return (v > 0 ? '+' : '') + v.toFixed(1);
    if (Number.isInteger(v)) return String(v);
    return v.toFixed(1);
  };
  for (const cat of TEAM_CATS) {
    c.append(el('h3', { class: 'leaguename' }, `チーム${cat.title}`));
    for (const l of leagues) {
      const list = (byLg.get(l.id) || []).slice().sort((a, b) => (cat.asc ? a[cat.sort] - b[cat.sort] : b[cat.sort] - a[cat.sort]));
      if (!list.length) continue;
      const headers = ['順', ...cat.cols.map(([, label]) => label)];
      const trs = list.map((r, i) => el('tr', {}, [
        td(i + 1),
        ...cat.cols.map(([k, , align]) => td(teamCell(k, r[k], cat.dec3), align)),
      ]));
      c.append(el('h4', { class: 'teamsub' }, l.name));
      c.append(teamTable(headers, cat.cols, trs));
    }
  }
}

// チーム表（ヘッダにツールチップ・§B3 初心者配慮）。cols は [key,label,align]。
function teamTable(headers, cols, rows) {
  const head = el('tr', {}, [el('th', {}, headers[0]), ...cols.map(([k, label, align]) =>
    el('th', { class: align || '', title: TIP[k === 'uzr' ? 'uzrTeam' : k] || '' }, label))]);
  return el('div', { class: 'tablewrap' }, [el('table', { class: 'stat' }, [el('thead', {}, head), el('tbody', {}, rows)])]);
}

// --- 小物 -----------------------------------------------------------------
function td(v, align) { return el('td', { class: align || '' }, String(v)); }
function table(headers, rows) {
  return el('div', { class: 'tablewrap' }, [el('table', { class: 'stat' }, [
    el('thead', {}, el('tr', {}, headers.map((h) => el('th', {}, h)))),
    el('tbody', {}, rows),
  ])]);
}
function svgEl(tag, attrs) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k of Object.keys(attrs)) e.setAttribute(k, attrs[k]);
  return e;
}
function primaryPos(p) {
  if (!p || p.role === 'pitcher') return 'P';
  let mp = ''; let mx = -1;
  const pp = p.trueAbility.fielding.positionProf;
  for (const k of Object.keys(pp)) if (pp[k] > mx) { mx = pp[k]; mp = k; }
  return mp;
}
function pitchName(t) {
  return { fastball: '直球', slider: 'スラ', curve: 'カーブ', changeup: 'チェンジ', fork: 'フォーク', sinker: 'シンカー', cutter: 'カット' }[t] || t;
}
/** 利き手の表示（S4: 選手モーダルの「右投左打」等。S=両打/両投） */
function handLabel(h) {
  return { R: '右', L: '左', S: '両' }[h] || h || '?';
}

initApp();
</script>
