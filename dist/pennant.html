<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>架空選手ペナント</title>
<style>
  :root { --bg:#0f3d2e; --panel:#123d2a; --ink:#f4f1e6; --clay:#c9a06a; --gold:#e8b84b;
          --muted:#9fb8ac; --line:#2f6b4a; --chalk:#e9e4d0; }
  * { box-sizing:border-box; }
  body { font-family: system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
         background:var(--bg); color:var(--ink); margin:0; padding:16px; line-height:1.5; }
  h2 { font-size:17px; margin:6px 0; }
  .muted { color:var(--muted); font-size:12px; }
  button { font-family:inherit; cursor:pointer; border:1px solid var(--line); background:#0c3122;
           color:var(--ink); border-radius:6px; padding:6px 12px; }
  button.primary { background:var(--clay); color:#20160a; border-color:var(--clay); font-weight:700; }
  button.link { border:none; background:none; color:var(--muted); padding:2px 6px; }
  input { background:#0c3122; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:5px; }
  .setup .row { display:flex; gap:8px; align-items:center; margin:10px 0; }
  .header { display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--clay); padding-bottom:4px; }
  .header .row { flex-wrap:wrap; }
  /* G4a: ハブタブバー sticky＋モバイル横スクロール1行。進行フッターは全タブ常設 */
  .tabs { display:flex; gap:6px; position:sticky; top:0; z-index:6; background:var(--bg); padding:6px 0;
          margin:6px 0; flex-wrap:nowrap; overflow-x:auto; }
  .tab { padding:6px 14px; white-space:nowrap; flex:none; }
  .tab.active { background:var(--clay); color:#20160a; border-color:var(--clay); font-weight:700; }
  .hubfooter { position:fixed; left:0; right:0; bottom:0; z-index:8; display:flex; gap:6px;
               background:var(--bg); border-top:1px solid var(--line); padding:8px;
               box-shadow:0 -6px 8px -6px rgba(0,0,0,.5); }
  .hubfooter button { flex:1; min-height:44px; white-space:nowrap; padding:6px 2px; }
  .hubspacer { height:68px; }
  @media (min-width:900px) {
    /* デスクトップでは flex:1 のボタンが幅いっぱいに間延びするのを防ぐ（G1a .watchctrl と同じ配慮） */
    .hubfooter { justify-content:center; }
    .hubfooter button { flex:none; min-width:140px; }
  }
  .tablewrap { overflow-x:auto; border:1px solid var(--line); border-radius:8px; position:relative; }
  /* G5b: 表の右にまだ列がある気配（初期表示時のヒント。スクロール後の追従は保証しない＝仕様） */
  .tablewrap::after { content:''; position:absolute; top:0; right:0; bottom:0; width:14px;
    background:linear-gradient(270deg, rgba(0,0,0,.35), transparent); pointer-events:none;
    border-radius:0 8px 8px 0; }
  .emptybox { text-align:center; padding:24px 8px; color:var(--muted); }
  table.stat { border-collapse:collapse; width:100%; font-size:13px; white-space:nowrap; }
  table.stat th { position:sticky; top:0; background:#0c3122; color:var(--chalk); padding:6px 8px;
                  text-align:right; cursor:pointer; user-select:none; border-bottom:1px solid var(--line); }
  table.stat th.left, table.stat td.left { text-align:left; }
  table.stat th.sorted { color:var(--gold); }
  table.stat td { padding:5px 8px; text-align:right; border-bottom:1px solid #1c4a34; }
  /* F4: 列数の多い成績表（打撃26列等）を横スクロールしても選手名が見えるよう先頭列を固定 */
  table.stat th:first-child { left:0; z-index:2; }
  table.stat td:first-child { position:sticky; left:0; background:var(--sticky-bg, var(--bg)); z-index:1; }
  tr.clickable:hover { background:#174a34; cursor:pointer; }
  /* 上記の先頭列固定より後ろに置き、自チーム強調/hoverが先頭セルだけ効かなくなるのを防ぐ */
  tr.clickable:hover td:first-child { background:#174a34; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-start;
             justify-content:center; padding:20px; overflow:auto; z-index:10; }
  /* G9: モーダルは長い成分（打球SVG・経歴等）でも画面内に収まるようスクロール化。ヘッダーは常に見える */
  .modal { background:var(--panel); border:1px solid var(--clay); border-radius:10px; padding:16px;
           max-width:560px; width:100%; --sticky-bg:var(--panel); max-height:92vh; overflow:auto; }
  .modalhead { display:flex; justify-content:space-between; align-items:center;
               position:sticky; top:0; background:var(--panel); z-index:2; padding:4px 0; margin:-4px 0 10px; }
  .modalnavwrap { display:flex; align-items:center; gap:4px; }
  .modalnav { padding:4px 9px; font-size:14px; line-height:1; }
  .modalnav:disabled { opacity:.3; cursor:default; }
  .pname { font-size:18px; font-weight:700; }
  .kvgrid { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .kv { background:#0c3122; border-radius:6px; padding:6px; text-align:center; }
  .kvk { font-size:10px; color:var(--muted); } .kvv { font-size:15px; font-weight:700; }
  .abilities { display:grid; grid-template-columns:1fr 1fr; gap:6px 16px; margin-top:4px; }
  .abtitle { font-size:11px; color:var(--gold); margin:4px 0 2px; }
  .barrow { display:flex; align-items:center; gap:6px; font-size:11px; margin:2px 0; }
  .barlabel { width:64px; color:var(--muted); } .barval { width:22px; text-align:right; }
  .bartrack { flex:1; height:8px; background:#0c3122; border-radius:4px; overflow:hidden; }
  .barfill { display:block; height:100%; }
  .spraywrap { margin-top:10px; text-align:center; }
  svg.spray { width:280px; max-width:100%; background:#0c3122; border-radius:8px; }
  svg.evla { width:280px; max-width:100%; background:#0c3122; border-radius:8px; }
  .sprayrow { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:flex-start; margin-top:8px; }
  /* G9: モーダルのタブ行は折返しせず横スクロール1行に（多タブ選手モーダルの2行化を解消） */
  .modaltabs { display:flex; gap:6px; margin:8px 0 12px; flex-wrap:nowrap; overflow-x:auto;
               border-bottom:1px solid var(--line); padding-bottom:8px; }
  .mtab { padding:4px 12px; font-size:12px; white-space:nowrap; flex:none; }
  .mtab.active { background:var(--clay); color:#20160a; border-color:var(--clay); font-weight:700; }
  .modalbody { min-height:40px; }
  h4.teamsub { font-size:12px; color:var(--muted); margin:8px 0 3px; font-weight:600; }
  h3.leaguename { font-size:14px; margin:12px 0 4px; color:var(--gold); }
  /* G7: 日程タブの月見出しは summary（<details class="schedmonth">内）でも同じ見た目にする */
  summary.leaguename { font-size:14px; margin:12px 0 4px; color:var(--gold); cursor:pointer; }
  .schedmonth { margin:4px 0; }
  .nextjump { margin:6px 0; }
  .schednext { outline:1px solid var(--gold); }
  .pspanel { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-top:12px; background:var(--panel); }
  .psrow { display:flex; gap:8px; font-size:13px; margin:3px 0; flex-wrap:wrap; }
  .pslabel { color:var(--muted); min-width:190px; }
  .pschamp { margin-top:6px; font-weight:700; color:var(--gold); }
  .warlist { display:flex; flex-direction:column; gap:6px; }
  .warcard { display:flex; align-items:center; gap:12px; background:var(--panel);
             border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  .warcard:hover { background:#174a34; cursor:pointer; }
  .warrank { width:24px; color:var(--muted); text-align:right; font-size:13px; }
  .warval { width:54px; font-size:20px; font-weight:800; color:var(--gold); text-align:right; }
  .warname { flex:1; font-size:14px; } .wn1 { font-weight:700; }
  /* --- フェーズC1b ゲームシェル --- */
  .teamgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:10px; }
  .teamcard { text-align:left; padding:10px 12px; }
  .teamcard:hover { background:#174a34; }
  .tcname { font-weight:700; font-size:14px; }
  .nextcard { border:1px solid var(--clay); border-radius:8px; padding:8px 12px; margin:8px 0; background:var(--panel); }
  .nextmatch { font-size:15px; font-weight:700; }
  .recentlist { display:flex; flex-direction:column; gap:3px; }
  .recentrow { display:flex; gap:10px; align-items:center; font-size:13px; }
  .recentrow .score { margin-left:auto; color:var(--muted); }
  .wl { display:inline-block; width:18px; text-align:center; font-weight:700; border-radius:4px; }
  .wlw { color:#7bc47f; } .wll { color:#e06d6d; } .wlt { color:var(--muted); }
  table.stat tr.myteam td { background:#1c4a34; font-weight:700; } /* (0,2,3)で先頭列固定の(0,2,2)に順序非依存で勝つ */
  .teamstate { margin:8px 0; font-size:14px; letter-spacing:1px; }
  .mgrpanel, .savepanel { border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin-top:12px; }
  .tendrow { display:flex; align-items:center; gap:6px; margin:4px 0; }
  .tendlabel { width:96px; color:var(--muted); font-size:13px; }
  .tendbtn { padding:4px 10px; font-size:12px; }
  .tendbtn.active { background:var(--clay); color:#20160a; border-color:var(--clay); font-weight:700; }
  .watchmid { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; margin:10px 0; }
  svg.diamond { width:200px; background:#0c3122; border-radius:8px; }
  .benchbox { flex:1; min-width:180px; border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  .resrow { display:flex; align-items:center; gap:6px; font-size:12px; margin:4px 0; }
  .reslabel { width:60px; color:var(--muted); } .resval { width:40px; text-align:right; }
  .restrack { flex:1; height:8px; background:#0c3122; border-radius:4px; overflow:hidden; }
  .resfill { display:block; height:100%; background:var(--gold); }
  .pbp { border:1px solid var(--line); border-radius:8px; padding:8px 12px; max-height:320px; overflow-y:auto; font-size:13px; }
  .pbpline { padding:2px 0; border-bottom:1px solid #163d2c; }
  .pbpline.ev-run { color:#7bc47f; }
  .pbpline.ev-sub { color:#7fb0e0; }
  .pbpline.ev-start { color:var(--clay); font-weight:600; }
  /* E2改: 結果行の色分け（安打=青系/HR・得点=赤系強調/三振=グレー/四死球=緑系/失策・盗塁死=橙系） */
  .pbpline.ev-hit, .curabresult.ev-hit, .fieldlabel.ev-hit { color:#8fc7ff; }
  .pbpline.ev-bb, .curabresult.ev-bb, .fieldlabel.ev-bb { color:#7bc47f; }
  .pbpline.ev-k, .curabresult.ev-k, .fieldlabel.ev-k { color:var(--muted); }
  .pbpline.ev-err, .curabresult.ev-err, .fieldlabel.ev-err { color:#e8b84b; }
  .pbpline.ev-score, .pbpline.ev-hr, .curabresult.ev-score, .curabresult.ev-hr, .fieldlabel.ev-hr { color:#ff8a76; font-weight:700; }
  /* F4: 得点/HRの瞬間を一目で伝える演出（現在の打席の結果ボックスに一度だけ再生されるパルス。
     再生位置が進んだ描画(justAdvanced)でのみ .fx を付与＝タブ切替等の再描画では再発火しない）。 */
  @keyframes pulseScore { 0% { box-shadow:0 0 0 0 rgba(255,138,118,.55); } 70% { box-shadow:0 0 0 12px rgba(255,138,118,0); } 100% { box-shadow:0 0 0 0 rgba(255,138,118,0); } }
  .curabresult.ev-score.fx, .curabresult.ev-hr.fx { animation: pulseScore .9s ease-out; }
  @keyframes notablePop { 0% { transform:scale(.95); opacity:0; } 100% { transform:scale(1); opacity:1; } }
  .notable.fx { animation: notablePop .35s ease-out; }
  .finalscore { font-size:16px; font-weight:700; margin-right:auto; }
  table.scoreboard th.rcol, table.scoreboard td.rcol { color:var(--gold); font-weight:700; border-left:1px solid var(--line); }
  .pbtrack { height:14px; background:#0c3122; border:1px solid var(--line); border-radius:8px; overflow:hidden; margin:10px 0; }
  .pbfill { height:100%; background:var(--clay); transition:width .1s; }
  .championbanner { background:var(--panel); border:1px solid var(--gold); border-radius:8px; padding:12px; font-size:18px; font-weight:800; color:var(--gold); text-align:center; margin:12px 0; }
  /* C4 演出: ニュース/表彰/記録/二つ名 */
  .newsfeed { display:flex; flex-direction:column; gap:4px; margin:4px 0 8px; }
  .newsrow { border-left:3px solid var(--line); background:var(--panel); border-radius:4px; padding:5px 10px; font-size:13px; }
  .newsrow.good { border-left-color:var(--gold); }
  .newsrow.bad { border-left-color:#c96a5a; }
  .newsrow.info { border-left-color:#5aa9e6; }
  .awardpanel { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:8px 0; background:var(--panel); }
  .awardlgname { color:var(--gold); font-weight:700; border-bottom:1px solid var(--line); padding-bottom:4px; margin-bottom:6px; }
  /* G8: 表彰パネルをリーグ単位で折りたたみ */
  .awarddetails { margin:8px 0; }
  .awarddetails > summary { cursor:pointer; }
  .awarddetails .awardpanel { margin-top:6px; }
  .awardtop { display:flex; flex-wrap:wrap; gap:10px; }
  .awardbig { flex:1; min-width:160px; background:#0c3122; border-radius:6px; padding:8px; }
  .awardbigk { display:block; font-size:11px; color:var(--muted); }
  .awardbigv { display:block; font-weight:700; color:var(--gold); }
  .awardlist { display:flex; flex-direction:column; gap:3px; }
  .awardrow { display:flex; gap:8px; align-items:center; background:#0c3122; border-radius:4px; padding:4px 8px; font-size:13px; }
  .awardyear { color:var(--muted); min-width:44px; }
  .awardbadge { color:var(--ink); }
  .nickname { display:flex; gap:8px; align-items:center; margin-top:6px; }
  .nickmark { font-size:10px; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:1px 5px; }
  .nicktext { font-size:18px; font-weight:800; color:var(--gold); }
  svg.growth { width:280px; max-width:100%; background:#0c3122; border-radius:8px; margin-top:6px; }
  /* E1: チームタブ（一軍/二軍サブタブ）・選手名リンク・モーダルヘッダ（二つ名/受賞歴） */
  .subtabs { display:flex; gap:6px; margin:8px 0 4px; flex-wrap:wrap; }
  .subtab { padding:5px 14px; font-size:13px; }
  .subtab.active { background:var(--clay); color:#20160a; border-color:var(--clay); font-weight:700; }
  /* G5a: 成績タブの列グループ切替（.subtabsより一段軽い見た目＝タブ切替と列フィルタの階層を区別） */
  .colgroups { display:flex; gap:4px; margin:4px 0 8px; flex-wrap:wrap; }
  .colgroup { padding:3px 10px; font-size:11px; border-radius:999px; border:1px solid var(--line); background:none; color:var(--muted); }
  .colgroup.active { border-color:var(--clay); color:var(--clay); font-weight:700; }
  /* F2-4: 二軍サブタブの育成契約バッジ・二軍順位の折りたたみ */
  .devbadge { margin-left:5px; font-size:10px; color:#20160a; background:var(--gold); border-radius:4px; padding:0 4px; font-weight:700; vertical-align:1px; }
  .farmstandings { margin-top:14px; }
  .plink { color:#8fc7ff; cursor:pointer; text-decoration:underline dotted; text-underline-offset:2px; }
  .plink:hover { color:var(--gold); }
  .headnick { margin-left:8px; font-size:13px; font-weight:700; color:var(--gold); }
  .headawards { font-size:11px; color:var(--muted); margin-top:2px; }
  /* E2: スポナビ風観戦（ラインスコア/フィールド盤面/対戦カード/一球速報/進行切替） */
  .matchup { flex:1; min-width:250px; border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--panel); }
  .bso { display:flex; gap:16px; margin-bottom:8px; flex-wrap:wrap; }
  .bsorow { display:flex; align-items:center; gap:5px; }
  .bsolabel { color:var(--muted); font-size:12px; width:12px; font-weight:700; }
  .lamp { width:11px; height:11px; border-radius:50%; background:#0c3122; border:1px solid var(--line); display:inline-block; }
  .lamp.lb.on { background:#7bc47f; border-color:#7bc47f; }
  .lamp.ls.on { background:var(--gold); border-color:var(--gold); }
  .lamp.lo.on { background:#c96a5a; border-color:#c96a5a; }
  .murow { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; margin:7px 0; font-size:13px; }
  .mulabel { color:var(--muted); font-size:11px; border:1px solid var(--line); border-radius:4px; padding:0 6px; }
  .muname { font-weight:700; font-size:14px; }
  .mutoday { color:var(--chalk); }
  .pbpline.ev-ab { color:var(--chalk); font-weight:600; }
  .pbpline.ev-pitch { color:var(--muted); }
  /* E2改: 「現在の打席」ボックス（正順の投球列＋決着結果の強調）＋履歴チップ＋実況ヘッダ */
  .curab { border:1px solid var(--line); border-radius:8px; padding:8px 12px; background:var(--panel); }
  .curabhead { color:var(--muted); font-size:11px; font-weight:700; letter-spacing:1px; margin-bottom:4px; }
  .curabpitch { font-size:13px; padding:1px 0; color:var(--chalk); }
  .curabresult { margin-top:6px; padding:6px 10px; border-radius:6px; background:#0c3122; font-size:15px; font-weight:700; }
  .reschips { display:inline-flex; gap:3px; flex-wrap:wrap; }
  .reschip { font-size:11px; color:var(--chalk); background:#0c3122; border:1px solid var(--line); border-radius:4px; padding:0 5px; }
  /* §16: 打席ごとの指標変化（「▼ 指標の変化」折りたたみ・既定で開く・結果ボックスの下にぶら下げる） */
  .metricdelta { margin-top:6px; border-top:1px dashed var(--line); padding-top:6px; }
  .metricdelta summary { cursor:pointer; color:var(--muted); font-size:11px; font-weight:700; list-style:none; }
  .metricdelta summary::-webkit-details-marker { display:none; }
  .mdgroup { margin-top:4px; }
  .mdname { font-size:11px; color:var(--muted); margin-right:6px; }
  .mdrow { font-size:12px; padding:1px 0 1px 4px; color:var(--chalk); }
  .mdrow.mdup { color:#7bc47f; }
  .mdrow.mddown { color:#e06d6d; }
  .pbphead { display:flex; align-items:center; gap:10px; margin:8px 0 2px; }
  .lineupbody { display:flex; gap:12px; flex-wrap:wrap; margin-top:6px; align-items:flex-start; }
  .lineupcol { flex:1; min-width:230px; }
  /* E2ゾーニング改の常設パネルは G1a でスコアバー(.scorebar)＋タブ本体に置換済み（下方のG1a追記ブロック参照）。
     .duelcol は watchFieldChart の .fieldcol が併用するため残す（対戦タブでも使用中）。 */
  .duelcol { flex:1; min-width:250px; display:flex; flex-direction:column; gap:10px; }
  .handtag { font-size:10px; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:0 4px; white-space:nowrap; }
  /* F3: 打球フィールド図（対戦パネル右カラム・直近打席1件の実データ・静的画像・スポナビ風） */
  .fieldcol { align-items:center; text-align:center; flex:none; min-width:200px; }
  .duelhead { color:var(--muted); font-size:11px; font-weight:700; letter-spacing:1px; margin-bottom:2px; align-self:flex-start; }
  svg.fieldchart { width:200px; max-width:100%; background:#0c3122; border-radius:8px; }
  .fieldlabel { margin-top:6px; font-size:13px; font-weight:700; }
  .fieldsub { font-size:11px; margin-top:2px; }
  /* 一球判定の統一色（現打席リスト・実況一球行に適用）:
     ボール=白/見逃しS=緑/空振り=赤/ファウル=黄/インプレー=青 */
  .pc-ball, .pbpline.pc-ball, .curabpitch.pc-ball { color:#f4f1e6; fill:#f4f1e6; }
  .pc-called, .pbpline.pc-called, .curabpitch.pc-called { color:#7bc47f; fill:#7bc47f; }
  .pc-whiff, .pbpline.pc-whiff, .curabpitch.pc-whiff { color:#e06d6d; fill:#e06d6d; }
  .pc-foul, .pbpline.pc-foul, .curabpitch.pc-foul { color:#e8b84b; fill:#e8b84b; }
  .pc-inplay, .pbpline.pc-inplay, .curabpitch.pc-inplay { color:#8fc7ff; fill:#8fc7ff; }
  /* E2ゾーニング改: watch内サブタブ（速報/対戦/ボックス/スタメン・G1aで4分割） */
  .wtabs { display:flex; gap:6px; margin:12px 0 4px; flex-wrap:wrap; }
  .wtab { padding:5px 16px; font-size:13px; }

<script>
// ===== src/rng.mjs =====
// ============================================================================
// 決定論RNG基盤（§3.1 §17 §19 / 自己レビュー M2・F35・F41）
//
// 設計:
//   - 階層シード: masterSeed → hashSeed(season, game, pa, ...) で打席ごとに独立RNG。
//     「実行順序に依存しない」＝ 任意の試合/打席を単独・任意順で再現できる（並列化・§19突合に必須）。
//   - PRNG: mulberry32（素のLCGでなくカウンタ系。1状態語で高品質・自己完結）。
//   - Box-Muller: 予備値をキャッシュしない（毎回2一様乱数を消費し1つ返す）。
//     → 隠れ状態ゼロで版間・端末間・シリアライズ跨ぎでも完全再現（F41）。
//   - 直列化: 状態は uint32 一語。serializeRng→number / makeRng(number) で復元（セーブ対象）。
// ============================================================================

/** mulberry32 の1ステップ。state.a を進めて float[0,1) を返す。 */
function step(state) {
  const a = (state.a + 0x6d2b79f5) | 0;
  state.a = a;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

/** 素の関数版PRNG（selfCheck等の軽用途） */
function mulberry32(seed) {
  const state = { a: seed >>> 0 };
  return () => step(state);
}

/**
 * 複数の整数/文字列を 32bit シードへ決定論的に畳み込む（FNV-1a派生）。
 * hashSeed(masterSeed, seasonId, gameId, paIndex) の形で階層シードを作る。
 */
function hashSeed(...parts) {
  let h = 0x811c9dc5 >>> 0;
  const byte = (b) => {
    h ^= b & 0xff;
    h = Math.imul(h, 0x01000193);
  };
  for (const p of parts) {
    if (typeof p === 'string') {
      for (let i = 0; i < p.length; i++) byte(p.charCodeAt(i));
    } else {
      let n = Math.trunc(p) >>> 0;
      byte(n);
      byte(n >>> 8);
      byte(n >>> 16);
      byte(n >>> 24);
    }
  }
  // 最終ミックス
  h ^= h >>> 16;
  h = Math.imul(h, 0x85ebca6b);
  h ^= h >>> 13;
  return h >>> 0;
}

/**
 * RNGオブジェクト。状態は state.a（uint32）に閉じる＝シリアライズ可能。
 */
function makeRng(seed) {
  const state = { a: seed >>> 0 };
  const rng = {
    state,
    /** float [0,1) */
    next() {
      return step(state);
    },
    /** 整数 [0,n) */
    int(n) {
      return Math.floor(step(state) * n);
    },
    /** 実数 [lo,hi) */
    range(lo, hi) {
      return lo + step(state) * (hi - lo);
    },
    /** 標準正規（Box-Muller・予備値キャッシュなし＝隠れ状態ゼロ） */
    normal(mean = 0, sd = 1) {
      let u1 = step(state);
      if (u1 < 1e-12) u1 = 1e-12; // log(0) 回避
      const u2 = step(state);
      const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
      return mean + sd * z;
    },
    /** 確率 p で true */
    chance(p) {
      return step(state) < p;
    },
    /** 子RNGを決定論的に派生（順序非依存） */
    fork(...parts) {
      return makeRng(hashSeed(state.a, ...parts));
    },
  };
  return rng;
}

/**
 * 階層シードから、指定座標(season/game/pa等)の打席用RNGを作る。
 * 実行順序に依存せず、同じ座標は常に同じ列を返す。
 */
function rngFor(masterSeed, ...coords) {
  return makeRng(hashSeed(masterSeed, ...coords));
}

/** 状態を数値へ（セーブ用） */
function serializeRng(rng) {
  return rng.state.a >>> 0;
}

/** 数値状態から復元（makeRng(state) はその地点から続きを再現する） */
function deserializeRng(stateNumber) {
  return makeRng(stateNumber >>> 0);
}


// ===== src/model/positions.mjs =====
// ポジション・球種などの定数（§7 §9 §13 §4）。
// ⚠️ ここの数値（posAdj等）はMLB標準の初期値。143試合/NPBへの再スケールは
//    中央config(0-4)＋較正(2-9)で行う。定数の"出発点"としてのみ置く。

/** 守備位置（投手Pはroleで扱う。DHは守備なし打撃専念） */
const POSITIONS = ['C', '1B', '2B', '3B', 'SS', 'LF', 'CF', 'RF', 'DH'];

/** 野手の守備位置のみ（DH除く） */
const FIELD_POSITIONS = ['C', '1B', '2B', '3B', 'SS', 'LF', 'CF', 'RF'];

/**
 * 位置補正（FanGraphs WAR の値）。§9 / 正典 sabermetrics_glossary.md §7.5・§10.3
 *
 * ⚠️ 単位は「**162守備試合 = 1,458守備イニング** あたりの run」。1350ではない。
 *   FanGraphs Library 原文:
 *     "Positional adjustments are calculated based on a full 162 games, which equates to
 *      1,458 defensive innings."
 *     "Positional Adjustment = ((Innings Played/9) / 162) * position specific run value"
 *   同ページの実例: 一塁手(−12.5)が1,214イニング → −10.4。
 *     −12.5 × 1214/1458 = −10.41 ✓ ／ −12.5 × 1214/1350 = −11.24 ✗
 *
 *   1,350イニングは **Baseball-Reference** の慣行で、しかも値のセット自体が別物
 *   （C +9 / SS +7 / 2B +3 / CF +2.5 / 3B +2 / LF・RF −7 / 1B −9.5 / DH −15）。
 *   FanGraphs の値に B-R の分母を掛けてはならない（旧実装のバグ）。
 */
const POSITION_ADJUST_INNINGS_FULL = 1458; // 162守備試合 × 9イニング
const POSITION_ADJUST_PER_162G = {
  C: 12.5,
  SS: 7.5,
  '2B': 2.5,
  '3B': 2.5,
  CF: 2.5,
  RF: -7.5,
  LF: -7.5,
  '1B': -12.5,
  DH: -17.5,
};

/** 守備難易度の序列（難→易）。§9/§13。コンバート成否・延命判定に流用。 */
const POSITION_DIFFICULTY = ['C', 'SS', 'CF', '2B', '3B', 'RF', 'LF', '1B'];

/** 球種（§2.4）。各投手はこの一部を保有する。 */
const PITCH_TYPES = [
  'fastball', // ストレート
  'sinker', // シンカー/ツーシーム
  'cutter', // カット
  'slider', // スライダー
  'curve', // カーブ
  'changeup', // チェンジアップ
  'fork', // フォーク/スプリット
];

/** 速球系（対速球/対変化球の2軸分類・§4段階1） */
const FASTBALL_TYPES = new Set(['fastball', 'sinker', 'cutter']);

/** 球種を2クラス（速球/変化球）に分類 */
function pitchClass(type) {
  return FASTBALL_TYPES.has(type) ? 'fastball' : 'breaking';
}


// ===== src/model/player.mjs =====
// ============================================================================
// 選手データモデル（§2）
//
// 三層構造（§1・本作の背骨）:
//   layer1 真の実力  = player.trueAbility        … 隠しパラメータ（本人の本当の能力）
//   layer2 観測成績  = player.career.seasons[...] … 真値+打席ノイズ（simで湧く。§5集計）
//   layer3 球団の評価 = 球団AI側が trueAbility+スカウト誤差 で持つ（フェーズ3）。
//                       ここでは誤差シードの器 player.scoutSeed のみ用意。
//
// 能力素材は登録(role)に依らず常時両方保持する（§2.1 転向で重要）。
// レーティングは 20–80 スカウティングスケール（50=リーグ平均）。球速のみ km/h 実数（§2.4）。
// 本ステップ(0-3)は"形"を確定するのが目的。分布からの生成は 0-6。
// ============================================================================


/**
 * @typedef {Object} PitchRating 1球種の能力（§2.4）
 * @property {string} type
 * @property {number} current   現在値(20-80)
 * @property {number} potential 潜在値(20-80)
 * @property {number} whiff     空振り寄与
 * @property {number} hrSuppress 被弾抑止（高いほど打たれにくい）
 * @property {number} contactQuality 被コンタクト質の抑止
 */

/** 1球種レーティングを生成（空振り率と被弾率は別能力＝別プロファイル。§4） */
function createPitch(type, over = {}) {
  return {
    type,
    current: 50,
    potential: 50,
    whiff: 50,
    hrSuppress: 50,
    contactQuality: 50,
    ...over,
  };
}

/**
 * 真の実力（layer1）。全軸を常時保持。§2.2〜§2.7。
 */
function createTrueAbility(over = {}) {
  const base = {
    // §2.2 共通素材（登録・ポジション非依存の本人の持ち物）
    common: {
      speed: 50, // 走力（走塁/守備範囲のスピード成分）— 早く落ちる
      arm: 50, // 肩（送球/投手なら球速の素地）— 中間
      hands: 50, // 手・確実性（エラー回避/コンタクト素地）— 安定
      reaction: 50, // 反応・初動（守備範囲の初動成分）— やや弱い
      power: 50, // 生体パワー（打球速度EVの素地）— 20代天井後 維持
    },
    // §2.3 打撃系
    batting: {
      ev: 50, // EV適性（打球速度ポテンシャル＝生体Power×スイング効率）
      la: 50, // LA適性（打球角度の最適化スキル）— 技術寄り・加齢に強い
      pull: 50, // 方向適性（>50 引っ張り / <50 流し）
      contact: 50, // コンタクト資質（芯を食う頻度）— 技術寄り
      eye: 50, // 選球眼 — 加齢でむしろ伸びる
      vsFastball: 50, // 対速球適性（§4段階1）
      vsBreaking: 50, // 対変化球適性（§4段階1）
      // hot/cold ゾーン（球種格子 段階2〜, §4）は後付け（フェーズ2以降）
    },
    // §2.4 投手系
    pitching: {
      velocityKmh: 145, // 球速（km/h 実数・レーティングとは別枠）
      control: 50, // 制球 — 技巧寄り・加齢に強い
      stamina: 50, // スタミナ（イニング耐性軸, §16）
      gbRate: 50, // ゴロ率（打たせて取るタイプ）
      hold: 50, // クイック/Hold（盗塁抑止・§6 wSBの入力。0-3で追加）
      pitches: [], // PitchRating[]（球種構成＝投手タイプ, §8）
    },
    // §2.5 野手守備系
    fielding: {
      positionProf: fielderProfInit(), // ポジション別習熟テーブル（経験で上下, §13）
      positioningIQ: 50, // ポジショニングIQ — 経験・技巧寄り・加齢に強い
      framing: 50, // フレーミング（捕手専用）
      blocking: 50, // ブロッキング（捕手専用・§B1）: ワンバウンド球を止める能力（WP/PB抑止）
    },
    // §2.6 走塁系
    baserunning: {
      steal: 50, // 盗塁技術（スタート/スライディング）— 足の速さと別物
      baserunIQ: 50, // 走塁IQ（進塁判断）— 経験で伸び加齢に強い
    },
    // §2.7 キャリア・パラメータ（分布から引く: §10.2, §12.4。0-6/フェーズ3で使用）
    career: {
      peakAge: 27, // ピーク年齢
      declineRate: 0.5, // 衰え速度（能力タイプと相関, §10.2）
      // ★R6 潜在的な故障耐性（20-80・生涯不変の真値）。§10.5 / Wei et al., Am J Epidemiol 2011:
      //   「故障歴が増えるほど故障率が上がる」という用量反応は、個体の潜在的脆弱性(frailty)を
      //   調整すると**消失する**＝観察される累積効果は因果でなく選択効果。故障がちに見える選手は
      //   「壊れやすい体質」であって「故障したから壊れやすくなった」のではない。
      //   三層構造: 球団AI/起用AIはこれを直接見ない（見えるのは"故障歴"というノイズの多い観測値だけ）。
      //   → Ramkumar 2019(OJSM,n=1,890): ドラフト前の故障歴は指名オッズを下げる(OR=0.738)のに
      //     指名後の故障率は予測しない＝**実在する市場の非効率**（鉄則5の宝の泉になる）。
      durability: 50,
      injuryHistory: [], // 故障歴（{year,site,severity,gamesLost}・再発の"観測値"・§10.5）
      breakEvents: [], // ブレイクイベント履歴（上下, §10.4）
      // R7（draft_timeline_evidence §決定1）: 高卒新人だけの追加未成熟を「期限付きの負債」として持つ。
      //   0（負でない）＝負債なし。generateRookie が若いほど負の値を積み、applyAging が毎年
      //   一定額を返済して0へ収束させる（＝一時的にだけ弱く、数年で自然に追いつく。恒久劣化ではない）。
      //   aging.profiles.grow をいじる方式（生成と加齢が同じ値を対称に読む前提）は、初期ロスター
      //   生成にも同じ grow が使われ 1年目較正・多年ドリフト帯を破ったため不採用（実測で確認済み）。
      youthDebt: 0,
    },
  };
  return deepMerge(base, over);
}

function fielderProfInit() {
  const m = {};
  for (const p of FIELD_POSITIONS) m[p] = 20; // 新ポジションは低スタート（§13）
  return m;
}

/**
 * 選手（三層のコンテナ）。
 * @param {Object} o
 * @param {string} o.id
 * @param {string} o.name  完全架空の名前（§0法的前提）。生成は0-6。
 * @param {'pitcher'|'fielder'} o.role 登録区分（能力素材は両方保持）
 */
function createPlayer(o = {}) {
  return {
    id: o.id ?? null,
    name: o.name ?? '',
    role: o.role ?? 'fielder',
    // 主守備位置（投手は 'P'）。ロスター構成の恒常化（C2b 世代交代の1:1補充）に使う
    // 不変の座標。加齢で positionProf が揺れても「本来の枠」を固定する（生成時に確定）。
    primaryPos: o.primaryPos ?? (o.role === 'pitcher' ? 'P' : null),
    bats: o.bats ?? 'R', // 'R'|'L'|'S'
    throws: o.throws ?? 'R', // 'R'|'L'
    age: o.age ?? 24,
    birthSeason: o.birthSeason ?? null,
    teamId: o.teamId ?? null,
    rosterStatus: o.rosterStatus ?? 'active', // active|minor(育成)|fa|retired（フェーズ3で活用）

    trueAbility: o.trueAbility ?? createTrueAbility(), // layer1（隠し）

    // layer3 の基盤: 球団評価はスカウト誤差で歪む（§1, §13）。
    // 誤差は球団×選手で決まるので、選手側は再現用シードのみ持つ（評価値は球団AIが算出, フェーズ3）。
    scoutSeed: o.scoutSeed ?? null,

    // layer2 観測成績: シーズン別スタットライン（simが埋める, §5）。season -> PlayerSeason
    career: { seasons: {} },
  };
}

/**
 * 実効打席サイド（左右プラトーン・S1/M7解消）。
 * スイッチ(S)は常に投手の利き腕と逆＝有利側に立つ（NPB/MLBの実運用どおり）。
 */
function effectiveBats(batter, pitcher) {
  if (batter.bats === 'S') return pitcher.throws === 'L' ? 'R' : 'L';
  return batter.bats;
}

/** 同利きマッチアップか（打者に不利な側。config.tuning.platoon の補正対象判定） */
function isSameHand(batter, pitcher) {
  return effectiveBats(batter, pitcher) === pitcher.throws;
}

/** 浅い階層のディープマージ（配列は置換） */
function deepMerge(base, over) {
  if (over == null) return base;
  const out = Array.isArray(base) ? base.slice() : { ...base };
  for (const k of Object.keys(over)) {
    const bv = base[k];
    const ov = over[k];
    out[k] =
      bv && ov && typeof bv === 'object' && typeof ov === 'object' && !Array.isArray(bv)
        ? deepMerge(bv, ov)
        : ov;
  }
  return out;
}

/** 最低限のスキーマ検証（スキーマ・ドリフトの早期検出用） */
function validatePlayer(p) {
  const errors = [];
  if (!p || typeof p !== 'object') return ['player is not an object'];
  if (p.role !== 'pitcher' && p.role !== 'fielder') errors.push(`bad role: ${p.role}`);
  const t = p.trueAbility;
  if (!t) errors.push('missing trueAbility');
  else {
    for (const grp of ['common', 'batting', 'pitching', 'fielding', 'baserunning', 'career']) {
      if (!t[grp]) errors.push(`missing trueAbility.${grp}`);
    }
    if (t.pitching && typeof t.pitching.hold !== 'number') errors.push('missing pitching.hold');
  }
  return errors;
}


// ===== src/model/battedball.mjs =====
// ============================================================================
// 打球イベントオブジェクト＋球場ジオメトリ（§3.2）—「一粒五度おいしい」の単一入力
//
// 接触した瞬間に打球3要素(EV/LA/方向)を先に生成し、球場ジオメトリと突き合わせて
// 落下点・滞空時間を出す。この"1個の打球レコード"から、
//   スプレーチャート(§16) / OAA好守拙守(§7.2) / UBR進塁(§6) / 対球種成績(§4)
// が全部派生する。結果を先に決めてゾーンを後付けする旧来設計を逆転させる。
//
// 座標系: 本塁を原点、+y をセンター方向、x を横（−=三塁側/左, +=一塁側/右）。単位はメートル。
// 方向角 sprayAngle: 0=センター, −45=左翼線, +45=右翼線（度）。
// EV は km/h（NPB表記に合わせる）、LA は度。
// ============================================================================

/**
 * @typedef {Object} BattedBall
 * @property {number} evKmh       打球速度 km/h（§3.2: 打者EV適性×投球の質×芯度）
 * @property {number} laDeg       打球角度 度（§3.2: 打者LA適性×投手GB%相性）
 * @property {number} sprayDeg    方向角 度（§3.2: 引っ張り/流し×投球コース）
 * @property {number|null} landingX 落下点X(m)
 * @property {number|null} landingY 落下点Y(m)
 * @property {number|null} distanceM 飛距離(m)
 * @property {number|null} hangTimeS 滞空時間(秒)
 * @property {string|null} pitchType 対戦球種（§4集計の素）
 * @property {string|null} batterId
 * @property {string|null} pitcherId
 * @property {string|null} fielderPos 担当野手ポジション（OAAの主語）
 * @property {number} baseState   塁状況 0..7（bit0:一塁, bit1:二塁, bit2:三塁）
 * @property {number} outs        アウトカウント 0..2
 * @property {string|null} result 最終結果（'1B'|'2B'|'3B'|'HR'|'out'|'error'...）simが確定
 */

/** 打球イベントを生成（3要素は必須、幾何・結果は後段で埋める） */
function createBattedBall(o = {}) {
  return {
    evKmh: o.evKmh ?? 0,
    laDeg: o.laDeg ?? 0,
    sprayDeg: o.sprayDeg ?? 0,
    landingX: o.landingX ?? null,
    landingY: o.landingY ?? null,
    distanceM: o.distanceM ?? null,
    hangTimeS: o.hangTimeS ?? null,
    pitchType: o.pitchType ?? null,
    batterId: o.batterId ?? null,
    pitcherId: o.pitcherId ?? null,
    fielderPos: o.fielderPos ?? null,
    baseState: o.baseState ?? 0,
    outs: o.outs ?? 0,
    result: o.result ?? null,
  };
}

/**
 * 球場ジオメトリ（フェーズD2・§11.2「文脈で化ける」）。中立球場は左右対称。
 * フェンス距離は方向角の関数で表し、左翼線(lfLineM)/右翼線(rfLineM)を独立に持つ（非対称球場）。
 * NPB標準寄りの中立値: 両翼 100m / 中堅 122m / フェンス高 4m。
 *   実在球場名は使わない（完全架空・§11.2）。lfLineM/rfLineM 省略時は lineDistM（左右対称）へ落ちる。
 *   狭い翼×引っ張り打者 → 同じ打球がHRに、広い中堅 → 同じ打球が凡フライに（D2の核心）。
 */
function createBallpark(o = {}) {
  const line = o.lineDistM ?? 100;
  return {
    name: o.name ?? 'Neutral Park',
    lineDistM: line, // 両翼の代表値（左右対称時。非対称は lf/rf を使う）
    lfLineM: o.lfLineM ?? line, // 左翼線（spray=−45）
    rfLineM: o.rfLineM ?? line, // 右翼線（spray=+45）
    centerDistM: o.centerDistM ?? 122, // 中堅（spray=0）
    gapDistM: o.gapDistM ?? 116, // 左右中間の目安（|spray|≈20・表示用）
    fenceHeightM: o.fenceHeightM ?? 4,
  };
}

/** 中立球場（既定・左右対称100/122/4m） */
const NEUTRAL_PARK = createBallpark();

/**
 * 指定方向角のフェンスまでの距離(m)。中堅(centerDistM)〜翼線を滑らかに補間。
 * 方向角の符号で左翼線(lfLineM)/右翼線(rfLineM)を選ぶ（非対称球場・D2）。
 * 中立球場は lf=rf=lineDistM ゆえ従来と完全一致（後方互換）。
 */
function fenceDistanceAt(sprayDeg, park = NEUTRAL_PARK) {
  const a = Math.min(Math.abs(sprayDeg), 45) / 45; // 0(中堅)..1(ライン)
  const line = sprayDeg < 0 ? (park.lfLineM ?? park.lineDistM) : (park.rfLineM ?? park.lineDistM);
  return park.centerDistM + (line - park.centerDistM) * a;
}


// ===== src/model/util.mjs =====
// モデル共通の小ヘルパー（ブラウザ安全・依存ゼロ）。
// バンドル後は全モジュールが同一スコープに並ぶため、共有ヘルパーはここ一箇所に定義する。

/** 値を [min,max] に丸める */
function clamp(v, min, max) {
  return v < min ? min : v > max ? max : v;
}

/** 能力のスカウティングスケール（20=最低, 50=リーグ平均, 80=最高）に丸める */
function clampRating(v) {
  return clamp(Math.round(v), 20, 80);
}

/** src の数値プロパティを dst に加算（両者フラットな数値マップ前提の集計ヘルパー） */
function addNumeric(dst, src) {
  for (const k of Object.keys(src)) {
    if (typeof src[k] === 'number') dst[k] = (dst[k] || 0) + src[k];
  }
  return dst;
}

function createSplitLine() {

}

    pitches: 0, swings: 0, whiffs: 0, fouls: 0, calledStrikes: 0,

    // 一球swing模型の率(Zone%/CSW%/SwStr%)の分母からは除外する（EV/LA非模型のため）＝機械球数=pitches−lumpedPitches。
    lumpedPitches: 0,

    byCount: {

function createBaserunningLine() {

/** 守備（§7 §9）。posAdj/UZRの土台＝ポジション別 守備アウト勘定を必ず持つ。 */
function createFieldingLine() {
  const positionOuts = {}; // ポジション -> 守備アウト数（イニング=outs/3）
  for (const p of FIELD_POSITIONS) positionOuts[p] = 0;
  return {
    positionOuts,
    chances: 0,
    po: 0, // 刺殺
    a: 0, // 補殺
    e: 0, // 失策
    oaaOuts: 0, // OAA（実アウト − 期待アウト、outs単位）§7.2。集計で加算
    framingRuns: 0, // フレーミング(捕手)。集計で加算
    // --- UZR成分の素（ARM/DPR/rSB）。すべて生カウントで、run換算は fielding.mjs がリーグ平均基準で行う。
    armOpp: 0, // 外野: 走者の追加進塁機会に相対した回数（ARMの分母）
    armAdv: 0, // うち追加進塁を許した数
    armKill: 0, // うち走塁死に仕留めた数（外野補殺）
    dpOpp: 0, // 二遊間: 併殺機会（GB×走者一塁×2死未満で当該ポジ在籍）
    dpTurned: 0, // うち併殺成立（DPR＝対リーグ平均転換率で metrics 側が run 換算）
    sbAllowed: 0, // 捕手: 許した盗塁（rSBの素）
    csMade: 0, // 捕手: 刺した盗塁死（rSBの素）
    // --- B1 捕手の一球ごとの創発（§B1-2）。フレーミング/ブロッキングを一球単位で計上。
    frameCalls: 0, // ボーダー球で獲得した見逃しストライク − 中立(borderCsBase) の累積（対リーグ平均）
    wp: 0, // 暴投（この捕手が受けた投手の暴投・走者進塁を許した数）
    pb: 0, // 捕逸（この捕手起因の後逸・走者進塁）
    blockOpp: 0, // ブロッキング機会（走者ありでのワンバウンド球数。wp+pb の分母）
  };
}

/** 選手×シーズンの器（layer2 観測成績の実体） */
function createPlayerSeason(playerId, season) {
  return {
    playerId,
    season,
    teamId: null,
    batting: createBattingLine(),
    pitching: createPitchingLine(),
    baserunning: createBaserunningLine(),
    fielding: createFieldingLine(),
  };
}

/** チーム×シーズンの器（順位表の実体）。RS/RAはチーム得点＝個人R保留とは別（§18・F6）。 */
function createTeamSeason(teamId, season) {
  return {
    teamId,
    season,
    g: 0,
    w: 0,
    l: 0,
    t: 0, // 引分（NPBは延長規定あり）
    rs: 0, // 得点（チーム）
    ra: 0, // 失点（チーム）
  };
}

// --- 集計ヘルパー（2パス集計・通算集計で使用） -------------------------------

/** バッティングを加算（dst に src を足し込む）。evMax のみ最大（通算集計での二重加算を防ぐ・B3a）。 */
function addBattingLine(dst, src) {
  const em = Math.max(dst.evMax || 0, src.evMax || 0);
  addNumeric(dst, src);
  dst.evMax = em;
  return dst;
}

/** ピッチングを加算 */
function addPitchingLine(dst, src) {
  return addNumeric(dst, src);
}

/** 走塁を加算 */
function addBaserunningLine(dst, src) {
  return addNumeric(dst, src);
}

/** 守備を加算（positionOuts マップは個別に、他は数値加算） */
function addFieldingLine(dst, src) {
  for (const p of Object.keys(src.positionOuts || {})) {
    dst.positionOuts[p] = (dst.positionOuts[p] || 0) + src.positionOuts[p];
  }
  for (const k of Object.keys(src)) {
    if (k !== 'positionOuts' && typeof src[k] === 'number') dst[k] = (dst[k] || 0) + src[k];
  }
  return dst;
}

/** 選手シーズンを別の器へ加算（通算/リーグ集計用） */
function addPlayerSeason(dst, src) {
  addBattingLine(dst.batting, src.batting);
  addPitchingLine(dst.pitching, src.pitching);
  addBaserunningLine(dst.baserunning, src.baserunning);
  addFieldingLine(dst.fielding, src.fielding);
  return dst;
}

// --- 試合数依存の媒介変数（M3: 162試合MLB定数を143へ再スケール） -------------
/** 規定打席（≒ games×3.1） */
function qualifiedPA(games = LEAGUE_DEFAULT.gamesPerSeason) {
  return Math.round(games * 3.1);
}
/** 規定投球回（= games×1） */
function qualifiedIP(games = LEAGUE_DEFAULT.gamesPerSeason) {
  return games;
}
/** フル出場の守備イニング（= games×9）。posAdj の分母（旧1350の置換） */
function fieldingInningsFull(games = LEAGUE_DEFAULT.gamesPerSeason) {
  return games * 9;
}

/** 値が [min,max] に収まるか（較正の合否判定ヘルパー） */
function inRange(v, range) {
  return v >= range[0] && v <= range[1];
}

// --- 内部ヘルパー -----------------------------------------------------------
function clone(o) {
  return JSON.parse(JSON.stringify(o));
}
function deepAssign(base, over) {
  for (const k of Object.keys(over)) {
    const ov = over[k];
    if (base[k] && ov && typeof base[k] === 'object' && typeof ov === 'object' && !Array.isArray(ov)) {
      deepAssign(base[k], ov);
    } else if (ov !== null && typeof ov === 'object') {
      base[k] = clone(ov); // 葉のオブジェクト/配列は複製し、override元との状態共有を断つ
    } else {
      base[k] = ov; // null・プリミティブは葉として代入
    }
  }
  return base;
}


// ===== src/sim/rates.mjs =====
// 確率合成の基本関数（log5/オッズ比の土台。§3.1）。
// logit/expit と、レーティング(20-80, 50=平均)を logit の増分へ写す変換。

/** ロジット（オッズの対数） */
function logit(p) {
  return Math.log(p / (1 - p));
}

/** 逆ロジット（シグモイド） */
function expit(x) {
  return 1 / (1 + Math.exp(-x));
}

/**
 * レーティング(50=平均)を logit 増分に変換。
 * 例: slope=0.30 なら 80(=+30) で +0.9（オッズ約2.5倍）。
 */
function ratingDelta(rating, slope) {
  return (slope * (rating - 50)) / 10;
}

/**
 * log5 / オッズ比合成: リーグ基準率に打者側・投手側の logit 増分を足し込む（§3.1）。
 * logit(P) = logit(L) + Δbatter + Δpitcher。両者が平均なら L に戻る。
 */
function log5(leagueRate, batterDelta, pitcherDelta) {
  return expit(logit(leagueRate) + batterDelta + pitcherDelta);
}


// ===== src/sim/fieldingGeometry.mjs =====
// ============================================================================
// 守備の幾何（Distance-Time モデル）— Statcast OAA と同型の捕球確率
// 正典: thyroxin/research/fielding_metrics_reference.md §2.1-2.3 / §11.2
//
// 【設計の核】
//   打球ごとに、各野手の「アウト化確率 p」を幾何から導く。
//   p はリーグ中立（野手個人の能力を含まない）＝ Statcast の catch probability と同じ性質。
//   個人の Range 能力は「実効クロージング速度 Smax」に乗り、抽選側にのみ効く。
//
//   空中球(LD/FB/PU) : p = expit((Smax − 必要走速度) / width)
//                      必要走速度 = (落下点までの距離 − reach) / (滞空時間 − 反応時間) / 方向係数
//   ゴロ(GB)         : p = P(到達) × P(送球アウト)
//                      Statcast infield OAA の4要素（迎撃点までの距離・使える時間・
//                      迎撃点から塁までの距離・打者走者の足）をすべて含む。
//                      P(到達) のみだとゴロ安打率が 0.19→0.04 に破綻する（§11.2）。
//
//   方向補正(direction) : 後方への移動は前方/横より遅い（Statcast が2017年に追加）。
//                         これが無いと内野手が頭上のライナーへ走り戻って捕ってしまう。
//
// 【責任野手】 argmax_i p_i（DRS の流儀・§9.2）。同率なら必要走速度が小さい方。
//   アウト → OAA += (1 − p_j) / 安打 → OAA += −p_j。
//   到達不能な打球は全野手 p≈0 ゆえ、誰もほとんど減点されない（＝ポテンヒット問題の解消）。
// ============================================================================


const FG_G = 9.8; // 重力加速度（build.mjs が全モジュールを1スコープへインライン化するため名前衝突を避ける）
const FG_RAD = Math.PI / 180;

const FG_INFIELD = ['3B', 'SS', '2B', '1B'];
const FG_OUTFIELD = ['LF', 'CF', 'RF'];
const FIELD_POS = [...FG_INFIELD, ...FG_OUTFIELD];
const IS_OUTFIELD = new Set(FG_OUTFIELD);
const IS_INFIELD = new Set(FG_INFIELD);

/** 一塁ベースの座標（本塁原点・y=センター方向・x=一塁側が正） */
const FIRST_BASE = { x: 27.43 / Math.SQRT2, y: 27.43 / Math.SQRT2 };

/** 守備隊形（config の極座標 r[m], t[deg]）→ 直交座標 */
function fielderPositions(cfg) {
  const out = {};
  const src = cfg.tuning.field.positions;
  for (const pos of FIELD_POS) {
    const p = src[pos];
    out[pos] = { x: p.r * Math.sin(p.t * FG_RAD), y: p.r * Math.cos(p.t * FG_RAD), r: p.r };
  }
  return out;
}

/**
 * 方向係数。野手 → 目標点 の移動が「本塁から見て外向き（＝後方へ下がる）」ほど小さくなる。
 * 係数 = 1 − backPenalty × max(0, 外向き成分の余弦)。前方・横方向では 1。
 */
function directionFactor(fx, fy, tx, ty, backPenalty) {
  const mx = tx - fx;
  const my = ty - fy;
  const m = Math.hypot(mx, my);
  if (m < 1e-6) return 1;
  const fr = Math.hypot(fx, fy);
  if (fr < 1e-6) return 1;
  const cos = (mx * (fx / fr) + my * (fy / fr)) / m; // 外向き単位ベクトルとの余弦
  return 1 - backPenalty * Math.max(0, cos);
}

/** 空中球の必要走速度[m/s]。到達不能なら Infinity */
function reqSpeedAir(f, landX, landY, hangS, g) {
  const t = hangS - g.reactionS;
  if (t <= 0) return Infinity;
  const d = Math.hypot(landX - f.x, landY - f.y) - g.reachM;
  if (d <= 0) return 0;
  const dir = directionFactor(f.x, f.y, landX, landY, g.backPenalty);
  if (dir <= 0.02) return Infinity;
  return d / t / dir;
}

/**
 * ゴロの内野処理。迎撃点は野手を打球ベクトルへ射影した点（Statcast の "intercept point"）。
 * 迎撃点での打球高度が gloveHeightM を超える（頭上を通過）なら処理不能。
 * air=true は「迎撃点が初バウンドより手前」＝ボールがまだ空中にある＝実質ライナー捕球
 * （LA<10°でGB分類だが、現実の記録では『直』＝ラインドライブアウトになるプレー。
 *   realism検証 2026-07-12: GB分類アウトの約19%・1試合1.3件がこれに該当し、旧実装は
 *   すべて「ゴロ」と表示し走者もゴロ意味論（進塁打/併殺）で動かしていた）。
 * @returns {{reqSpeed:number, pThrow:number, air:boolean}|null}
 */
function groundChance(f, bb, g, runnerToFirstS) {
  const dx = Math.sin(bb.sprayDeg * FG_RAD);
  const dy = Math.cos(bb.sprayDeg * FG_RAD);
  const s = f.x * dx + f.y * dy; // 本塁 → 迎撃点
  if (s <= g.gbMinDepth || s > g.gbMaxDepth) return null; // 背後 / 内野を抜けた

  const v = bb.evKmh / 3.6;
  let air = false;
  if (bb.laDeg > 0) {
    const vx = v * Math.cos(bb.laDeg * FG_RAD);
    if (vx > 1e-6) {
      const h = s * Math.tan(bb.laDeg * FG_RAD) - (FG_G * s * s) / (2 * vx * vx);
      if (h > g.gloveHeightM) return null; // 頭上を通過
    }
    // 初バウンドまでの弾道距離（生の放物線）より手前で迎撃＝空中でキャッチ（ライナー捕球）
    const laRad = bb.laDeg * FG_RAD;
    const firstBounceM = (v * v * Math.sin(2 * laRad)) / FG_G;
    air = s < firstBounceM;
  }

  const ix = s * dx;
  const iy = s * dy;
  const move = Math.hypot(ix - f.x, iy - f.y) - g.reachM;
  const vG = v * g.gbSpeedFactor; // ゴロの実効水平速度（バウンド減速込み）
  const tBall = s / vG;
  const tAvail = tBall - g.reactionS;
  if (tAvail <= 0) return null;

  const dir = directionFactor(f.x, f.y, ix, iy, g.backPenalty);
  const reqSpeed = move <= 0 ? 0 : move / tAvail / Math.max(0.02, dir);

  // 送球アウト: 捕球時刻 + 持ち替え + 送球飛行 < 打者走者の一塁到達
  // （air=trueの捕球は本来送球不要の即アウトだが、該当打球は痛烈でpThrow≈1のため補正は省略）
  const tField = Math.max(tBall, g.reactionS + Math.max(0, move) / g.smaxBase);
  const throwDist = Math.hypot(FIRST_BASE.x - ix, FIRST_BASE.y - iy);
  const tOut = tField + g.transferS + throwDist / g.throwSpeed;
  return { reqSpeed, pThrow: expit((runnerToFirstS - tOut) / g.throwWidth), air };
}

/** 打者走者の一塁到達時間[s]。speed 50 = リーグ平均。速い打者ほど内野安打が湧く */
function runnerToFirst(runnerSpeed, cfg) {
  const g = cfg.tuning.field;
  return g.runnerToFirstS - (runnerSpeed - 50) * g.runnerToFirstPerRating;
}

/**
 * 打球1つに対する各野手の「必要走速度」と「送球アウト確率」。
 * 野手個人の能力を含まない（＝ Statcast catch probability と同じくリーグ中立）。
 * gbAir[pos]=true はGB分類の打球をそのポジションが「初バウンド前に迎撃」＝実質ライナー捕球。
 * @returns {{reqSpeed: Object<string,number>, pThrow: Object<string,number>, gbAir: Object<string,boolean>}}
 */
function fieldingChances(bb, type, cfg) {
  const g = cfg.tuning.field;
  const F = fielderPositions(cfg);
  const reqSpeed = {};
  const pThrow = {};
  const gbAir = {};

  const v = bb.evKmh / 3.6;
  const hangS = bb.laDeg > 0 ? (2 * v * Math.sin(bb.laDeg * FG_RAD)) / FG_G : 0;
  const landX = bb.distanceM * Math.sin(bb.sprayDeg * FG_RAD);
  const landY = bb.distanceM * Math.cos(bb.sprayDeg * FG_RAD);
  const rtf = runnerToFirst(bb.runnerSpeed ?? 50, cfg);

  for (const pos of FIELD_POS) {
    const f = F[pos];
    let rs = Infinity;
    let pt = 1;
    let air = false;
    if (type === 'GB') {
      // ゴロは内野手のみアウト機会を持つ（外野へ抜けたら安打。外野の処理は ARM の領分）
      if (IS_INFIELD.has(pos)) {
        const gc = groundChance(f, bb, g, rtf);
        if (gc) {
          rs = gc.reqSpeed;
          pt = gc.pThrow;
          air = gc.air;
        }
      }
    } else {
      // 空中球は全野手が落下点を狙える。頭上を越える打球は後方ペナルティで自動的に p≈0 になる
      rs = reqSpeedAir(f, landX, landY, hangS, g);
    }
    reqSpeed[pos] = rs;
    pThrow[pos] = pt;
    gbAir[pos] = air;
  }
  return { reqSpeed, pThrow, gbAir };
}

/**
 * 打球を「拾う」外野手（ARM の主語）。責任野手（OAA の主語）とは別概念であることに注意:
 *   三遊間を抜けたゴロの OAA 責任は SS だが、実際に球を拾って返球するのは LF である。
 * 空中球は落下点に最も近い外野手、ゴロは spray 角のセクタで決める。
 */
function retrievingOutfielder(bb, cfg) {
  const F = fielderPositions(cfg);
  const landX = bb.distanceM * Math.sin(bb.sprayDeg * FG_RAD);
  const landY = bb.distanceM * Math.cos(bb.sprayDeg * FG_RAD);
  let best = null;
  let bestD = Infinity;
  for (const pos of FG_OUTFIELD) {
    const f = F[pos];
    // ゴロは転がり出しの落下点が浅く落下点距離が使えないので、角度セクタで決める
    const d = bb.laDeg <= 0
      ? Math.abs(bb.sprayDeg - cfg.tuning.field.positions[pos].t)
      : Math.hypot(landX - f.x, landY - f.y);
    if (d < bestD) {
      bestD = d;
      best = pos;
    }
  }
  return best;
}

/** Smax（実効クロージング速度 m/s）。rating 50 = リーグ平均 */
function smaxOf(rating, cfg) {
  const g = cfg.tuning.field;
  return g.smaxBase + (rating - 50) * g.smaxPerRating;
}

/** 必要走速度 + Smax → アウト化確率 */
function outProb(reqSpeed, pThrow, smax, cfg) {
  if (!Number.isFinite(reqSpeed)) return 0;
  return expit((smax - reqSpeed) / cfg.tuning.field.width) * pThrow;
}

/**
 * リーグ中立の責任野手とアウト化確率。
 * argmax_i p_i。全員 p≈0（誰にも捕れない打球）のときは、必要走速度が最小の野手＝
 * 「最も惜しかった」野手を責任者とする（減点は −p≈0 なので実害は無い）。
 * @returns {{pos:string, pOut:number, reqSpeed:number, pThrow:number}}
 */
function neutralResponsible(bb, type, cfg) {
  const { reqSpeed, pThrow } = fieldingChances(bb, type, cfg);
  const smax = cfg.tuning.field.smaxBase;
  let bestPos = null;
  let bestP = -1;
  let bestReq = Infinity;
  for (const pos of FIELD_POS) {
    const p = outProb(reqSpeed[pos], pThrow[pos], smax, cfg);
    const rs = reqSpeed[pos];
    // p が大きい方を優先。同率（典型的には両方 0）なら必要走速度が小さい方
    if (p > bestP + 1e-12 || (Math.abs(p - bestP) <= 1e-12 && rs < bestReq)) {
      bestP = p;
      bestReq = rs;
      bestPos = pos;
    }
  }
  if (bestPos == null) bestPos = type === 'GB' ? 'SS' : 'CF';
  return { pos: bestPos, pOut: Math.max(0, bestP), reqSpeed: reqSpeed[bestPos], pThrow: pThrow[bestPos] };
}


// ===== src/sim/fielding.mjs =====
// ============================================================================
// 守備の能力→結果 結線（2-7）＋ OAA→UZR run換算（2-8）（§7 / 自己レビュー M1・B-7）
//
// Range（守備範囲）= ポジショニングIQ + 初動(Reaction) + 走力(Speed)（§7.1）を合成し、
// 打球結果解決(resolveBattedBall)に注入して「実効被安打率」を個人スキルで上下させる。
// 期待アウトのベースラインはリーグ平均(ポジション中立)のままなので、
// 実結果 − 期待 の累積(oaaOuts)が個人のレンジ・シグナルになる（MLBAM OAAと同型）。
// ============================================================================



const OUTFIELD = IS_OUTFIELD;

/** 野手のRangeレーティング（50=リーグ平均）。§7.1 の Range = ポジIQ+初動+走力 */
function rangeRating(player, cfg) {
  const f = player.trueAbility.fielding;
  const c = player.trueAbility.common;
  const w = cfg.tuning.field.wRange;
  return w.positioningIQ * f.positioningIQ + w.reaction * c.reaction + w.speed * c.speed;
}

/** 選手シーズンの主守備位置（守備アウト最多）。出場イニング0なら ''（S2: 代打のみの選手が出うる） */
function mainPosition(fieldingLine) {
  let pos = '';
  let mx = 0;
  for (const k of Object.keys(fieldingLine.positionOuts)) {
    if (fieldingLine.positionOuts[k] > mx) {
      mx = fieldingLine.positionOuts[k];
      pos = k;
    }
  }
  return pos;
}

/** 選手の総守備イニング */
function totalFieldInnings(fieldingLine) {
  let o = 0;
  for (const k of Object.keys(fieldingLine.positionOuts)) o += fieldingLine.positionOuts[k];
  return o / 3;
}

/**
 * ポジション別に中心化した OAA（アウト単位）。
 * 生の oaaOuts はリーグ中立基準ゆえ「出場している守備者（＝上手い選手ばかり）」が全員プラスに
 * 偏る。正しくは「そのポジションで実際に守る選手の平均」を0とすべき（UZRの定義）。
 * lc.oaaCenterPerInn（主ポジ別のOAA/イニング平均）を差し引いて中心化する。
 */
function centeredOAAOuts(ps, lc) {
  const raw = ps.fielding.oaaOuts;
  if (!lc || !lc.oaaCenterPerInn) return raw;
  const pos = mainPosition(ps.fielding);
  const inn = totalFieldInnings(ps.fielding);
  return raw - (lc.oaaCenterPerInn[pos] || 0) * inn;
}

/**
 * 失策run成分（ErrR・§7.2 / 監査A3）。OAAは失策"前"の判定で範囲成分のみを表すため、
 * 捕球ミス（Hands）の価値はここで別勘定する（二重計上しない）。
 * ポジション平均の失策率で中心化し、平均より失策が少ない＝プラス。
 */
function errRunsAboveAvg(ps, cfg, lc) {
  if (!lc || !lc.errCenterPerInn) return 0;
  const pos = mainPosition(ps.fielding);
  const inn = totalFieldInnings(ps.fielding);
  const expE = (lc.errCenterPerInn[pos] || 0) * inn;
  return -((ps.fielding.e || 0) - expE) * cfg.tuning.field.runPerError;
}

/**
 * 守備run（WARに入る値）。FanGraphs の UZR 定義に従い、ポジションで成分が異なる（正典§1.1）:
 *   外野手 = RngR + ErrR + ARM
 *   内野手 = RngR + ErrR + DPR
 *   捕手   = ErrR + framing + blocking + rSB（UZRは付けない）
 * run換算は MLB.com 公式 FRV glossary の固定定数（内野0.75 / 外野0.90 out・正典§2.4）。
 * uzrComponents(...).total と厳密一致する（表示とWARが食い違わない）。
 */
function uzrRuns(ps, cfg, lc) {
  return uzrComponents(ps, cfg, lc).total;
}

// ============================================================================
// UZR の成分（FanGraphs 定義・正典§1.1）
//   外野手 UZR = RngR + ErrR + ARM
//   内野手 UZR = RngR + ErrR + DPR
//   捕手     = UZR を付けない → 捕手守備run = ErrR + framing + blocking + throwing(rSB)
//
// すべて生カウント（armOpp/armAdv/armKill, dpOpp/dpTurned, blockOpp/wp/pb, sbAllowed/csMade）
// からリーグ平均基準で創発させる。run換算は MLB.com 公式 FRV glossary の固定定数（正典§2.4）。
// リーグΣ は各成分とも 0 に厳密収束する（＝WARの総量を動かさない）。
// ============================================================================

/**
 * ARM（外野送球）run。実イベント（追加進塁を許した数 / 走塁死に仕留めた数）から創発する。
 *   ARM = lgPerOpp×機会 − (許進塁×runUBR + 刺殺×runCS)
 *   lgPerOpp = (Σ許進塁×runUBR + Σ刺殺×runCS) / Σ機会
 * runCS は負値なので、走者を刺すほど ARM は増える。リーグΣ ARM = 0（厳密）。
 */
function armRunsAboveAvg(ps, cfg, lc) {
  const f = ps.fielding;
  const opp = f.armOpp || 0;
  if (!opp || !lc || lc.lgArmAdvRate == null) return 0;
  const runAdv = cfg.tuning.run.runUBR; // 走者が1つ余分に進む攻撃側価値
  const runKill = lc.runCS ?? cfg.tuning.run.runCS; // 走塁死の攻撃側価値（負・得点環境依存）
  const lgPerOpp = lc.lgArmAdvRate * runAdv + lc.lgArmKillRate * runKill;
  return lgPerOpp * opp - ((f.armAdv || 0) * runAdv + (f.armKill || 0) * runKill);
}

/**
 * DPR（二遊間の併殺転換）run。対リーグ平均転換率より多く転換した分がプラス。
 * 1件の併殺は 2B・SS が共同で成立させる1イベントで、game.mjs は機会/成立を両者へフル計上する。
 * runPerDP はこの「1イベント」あたりの対称run価値（FRV: Double Plays 1 = .4）なので、
 * 二重帰属を避けるため参加者ぶん (dpShare=0.5) を配分する。
 */
function dprRunsAboveAvg(ps, cfg, lc) {
  const f = ps.fielding;
  const opp = f.dpOpp || 0;
  if (!opp || !lc || lc.lgDPRate == null) return 0;
  return ((f.dpTurned || 0) - lc.lgDPRate * opp) * cfg.tuning.field.runPerDP * cfg.tuning.field.dpShare;
}

/**
 * 捕手 rSB（盗塁阻止run）。FRV: "Catcher Stealing Runs is a translation of Caught Stealing
 * Above Average to a run value on a .65 runs/CS basis, the difference between a SB (+.2 runs)
 * and a CS (-.45 runs)"（正典§8.4）。
 * .65 を天下りで置かず、この得点環境の runSB − runCS から導出する。
 *   rSB = (刺CS − リーグCS率×企図) × (runSB − runCS)
 * リーグΣ rSB = 0（厳密）。
 */
function catcherRsbRuns(ps, cfg, lc) {
  const f = ps.fielding;
  const sb = f.sbAllowed || 0;
  const cs = f.csMade || 0;
  const att = sb + cs;
  if (!att || !lc) return 0;
  const lgAtt = (lc.lgSB || 0) + (lc.lgCS || 0);
  if (!lgAtt) return 0;
  const lgCsRate = (lc.lgCS || 0) / lgAtt;
  const runPerCs = cfg.tuning.run.runSB - (lc.runCS ?? cfg.tuning.run.runCS); // FRV の .65 と同型の導出
  return (cs - lgCsRate * att) * runPerCs;
}

/**
 * 捕手ブロッキング run（FRV: "Catcher Blocking 1 = .25 runs"）。
 * ワンバウンド機会あたりの (暴投+捕逸) 率がリーグ平均より低いほどプラス。リーグΣ = 0。
 */
function catcherBlockRuns(ps, cfg, lc) {
  const f = ps.fielding;
  const opp = f.blockOpp || 0;
  if (!opp || !lc || lc.lgBlockFailRate == null) return 0;
  const fails = (f.wp || 0) + (f.pb || 0);
  return (lc.lgBlockFailRate * opp - fails) * cfg.tuning.field.runPerBlock;
}

/** 捕手守備 run（UZRは付けない・正典§1.1）= ErrR + framing + blocking + rSB */
function catcherDefenseRuns(ps, cfg, lc) {
  return (
    errRunsAboveAvg(ps, cfg, lc) +
    (ps.fielding.framingRuns || 0) +
    catcherBlockRuns(ps, cfg, lc) +
    catcherRsbRuns(ps, cfg, lc)
  );
}

/**
 * UZR成分分解（表示用）。ポジションに応じて FanGraphs 定義の成分だけを持つ。
 * total は WAR用 uzrRuns と厳密一致する（表示とWARが食い違わない）。
 */
function uzrComponents(ps, cfg, lc) {
  const pos = mainPosition(ps.fielding);
  if (pos === 'C') {
    const errR = errRunsAboveAvg(ps, cfg, lc);
    const framing = ps.fielding.framingRuns || 0;
    const blocking = catcherBlockRuns(ps, cfg, lc);
    const rSB = catcherRsbRuns(ps, cfg, lc);
    return { pos, rngR: 0, errR, framing, blocking, rSB, arm: 0, dpr: 0, total: errR + framing + blocking + rSB };
  }
  const isOF = OUTFIELD.has(pos);
  const rpo = isOF ? cfg.tuning.field.runPerOutOutfield : cfg.tuning.field.runPerOutInfield;
  const rngR = centeredOAAOuts(ps, lc) * rpo;
  const errR = errRunsAboveAvg(ps, cfg, lc);
  const arm = isOF ? armRunsAboveAvg(ps, cfg, lc) : 0;
  const dpr = isOF ? 0 : dprRunsAboveAvg(ps, cfg, lc);
  return { pos, rngR, errR, framing: 0, blocking: 0, rSB: 0, arm, dpr, total: rngR + errR + arm + dpr };
}


// ===== src/sim/team.mjs =====
// ============================================================================
// チーム編成（1-4a/b/d → フェーズA S1 で v2 化）— ロスターから編成表を組む
//
// buildDepthChart v2（§S1-3）:
//   守備配置:   positionRank（習熟×守備素材＋打撃考慮）の上位を難ポジ優先で割当。
//   打順:       アーキタイプ制。1番=OBP×俊足 / 2番=コンタクト・出塁 / 3番=最強総合 /
//               4番=最強パワー / 5番=次点パワー / 6-8番=残り降順 /
//               9番=DH無なら投手（プレースホルダ・S2が当日の先発を充填）/ DH有なら最弱野手。
//   ベンチ:     スタメン外野手の hitScore 降順（S2の代打/代走/守備固めの母集団）。
//   ローテ:     cfg.league.rotationSize 人（中6日=6人）。
//   ブルペン:   relieverScore 順に closer / setup8 / setup7 / middle[] / long（最下位）。
// ここは「編成の初期値」なので trueAbility を直接参照してよい（三層構造の原則。
// シーズン中の見直しは S3 usage.mjs が観測成績＋スカウトノイズで行う）。
// ============================================================================



/** 打撃スコア（総合打力。3番・DH・ベンチ序列に使用） */
function hitScore(p) {
  const b = p.trueAbility.batting;
  const c = p.trueAbility.common;
  return b.ev + b.contact + b.eye + c.power + b.la * 0.5;
}

/** 出塁スコア（eye重視。1-2番アーキタイプの選抜に使用・§S1-3） */
function obpScore(p) {
  const b = p.trueAbility.batting;
  return b.eye * 1.6 + b.contact + b.ev * 0.4;
}

/** パワースコア（4-5番アーキタイプの選抜に使用・§S1-3） */
function powerScore(p) {
  const b = p.trueAbility.batting;
  const c = p.trueAbility.common;
  return c.power * 1.2 + b.ev + b.la * 0.6;
}

/** 先発スコア（スタミナ主・§16。球種数も加点） */
function starterScore(p) {
  const pt = p.trueAbility.pitching;
  const whiff = pt.pitches.length ? pt.pitches.reduce((a, x) => a + x.whiff, 0) / pt.pitches.length : 40;
  return pt.stamina * 1.6 + pt.control + whiff + pt.pitches.length * 8 + (pt.velocityKmh - 140);
}

/** リリーフの質（クローザー/セットアッパー序列） */
function relieverScore(p) {
  const pt = p.trueAbility.pitching;
  const whiff = pt.pitches.length ? pt.pitches.reduce((a, x) => a + x.whiff, 0) / pt.pitches.length : 40;
  return whiff + pt.control + (pt.velocityKmh - 140) * 1.2;
}

/** ポジション候補スコア（習熟＋守備素材(Range)＋打撃考慮。重みは config.tuning.depth） */
function posRankScore(p, pos, cfg) {
  const d = cfg.tuning.depth;
  const prof = p.trueAbility.fielding.positionProf[pos];
  // hitScore(平均≈225)を 50 中心のレーティング相当へスケール（/4.5）して混合
  return prof + d.posToolW * (rangeRating(p, cfg) - 50) + d.posBatW * (hitScore(p) / 4.5 - 50);
}

/**
 * 出場登録29人の選抜（F2-2・§S1-3の編成時評価と同輪）。支配下ロスターから
 * cfg.league.rosterActive 人を球団AIが選抜する（シーズン開始時に一度だけ）。
 *   投手: ローテ rotationSize 人を starterScore、残り枠を relieverScore で（計 activePitchers 人）。
 *   野手: 難ポジ優先で各ポジ最良(posRankScore) → 控え捕手 → 残り枠は hitScore 降順。
 *         ただし各主ポジションに farmKeepPerPos 人を二軍へ残す（二軍のデプスチャート成立を保証）。
 * ここは「編成の初期値」なので trueAbility を直接参照してよい（buildDepthChart と同じ原則。
 * シーズン中の入替は F2-3 が観測成績ベースで行う）。決定論: 乱数非使用の純関数（score降順・同点は
 * 配列順＝league.players 順で安定）。roster が rosterActive 以下なら全員登録（ミニリーグ/単体テスト互換）。
 * @param {Array} roster 1球団の支配下選手（league.players の teamId 絞り込み）
 * @returns {Array} 登録選手（投手→野手の順・rosterActive 人）
 */
function selectActiveRoster(roster, cfg) {
  const nActive = cfg.league.rosterActive ?? roster.length;
  if (roster.length <= nActive) return roster.slice();
  const R = cfg.tuning.roster ?? {};
  const pitchers = roster.filter((p) => p.role === 'pitcher');
  const fielders = roster.filter((p) => p.role === 'fielder');

  // --- 投手枠: 先発ローテを starterScore、救援枠を relieverScore で選抜 ---
  const rotationSize = cfg.league.rotationSize;
  const byStarter = pitchers.slice().sort((a, b) => starterScore(b) - starterScore(a));
  const rot = byStarter.slice(0, Math.min(rotationSize, byStarter.length));
  const relievers = byStarter.slice(rot.length).sort((a, b) => relieverScore(b) - relieverScore(a));
  const selP = rot.concat(relievers).slice(0, Math.min(R.activePitchers ?? 14, pitchers.length));

  // --- 野手枠: 残り人数（29−投手14＝15人目安） ---
  const nFieldTarget = Math.max(0, nActive - selP.length);
  const used = new Set();
  const selF = [];
  const pickBest = (scoreFn) => {
    let best = null;
    let bv = -Infinity;
    for (const f of fielders) {
      if (used.has(f.id)) continue;
      const v = scoreFn(f);
      if (v > bv) {
        bv = v;
        best = f;
      }
    }
    if (best) {
      used.add(best.id);
      selF.push(best);
    }
    return best;
  };
  // 1) 難ポジ優先（C→SS→CF→…）で各ポジ最良＝スタメン8人相当を確保
  for (const pos of POSITION_DIFFICULTY) {
    if (selF.length >= nFieldTarget) break;
    pickBest((f) => posRankScore(f, pos, cfg));
  }
  // 2) 控え捕手（正捕手の休養AI・故障時に捕手が枯れないための保険）
  for (let k = 0; k < (R.activeBackupCatchers ?? 1) && selF.length < nFieldTarget; k++) {
    pickBest((f) => posRankScore(f, 'C', cfg));
  }
  // 3) 残り枠: hitScore 降順（代打/DH/控えの母集団）。各主ポジ farmKeepPerPos 人は二軍に残す。
  const keep = R.farmKeepPerPos ?? 0;
  const remainByPos = new Map();
  for (const f of fielders) {
    if (!used.has(f.id)) remainByPos.set(f.primaryPos, (remainByPos.get(f.primaryPos) ?? 0) + 1);
  }
  const restSorted = fielders.filter((f) => !used.has(f.id)).sort((a, b) => hitScore(b) - hitScore(a));
  for (const f of restSorted) {
    if (selF.length >= nFieldTarget) break;
    if ((remainByPos.get(f.primaryPos) ?? 0) - 1 < keep) continue; // 取ると二軍の当該ポジが薄くなる→飛ばす
    remainByPos.set(f.primaryPos, remainByPos.get(f.primaryPos) - 1);
    used.add(f.id);
    selF.push(f);
  }
  // 4) 制約で埋まらない場合の安全弁（極端なポジ偏在ロスター）: 制約を無視して充足する
  for (const f of restSorted) {
    if (selF.length >= nFieldTarget) break;
    if (!used.has(f.id)) {
      used.add(f.id);
      selF.push(f);
    }
  }
  return selP.concat(selF);
}

/**
 * ロスターから編成表を作る（v2）。
 * @param {Array} roster
 * @param {Object} cfg createConfig() の設定（rotationSize / tuning.depth を参照）
 * @param {{dh?:boolean}} opts dh=false でDH無し打順（9番=投手プレースホルダ）。既定 true。
 *   ※S1では season 側は常に dh:true（DH規則=ホーム球団リーグの適用は S2 initSide v2）。
 * @returns {{lineup:Array<{playerId:?string,pos:string}>, defense:Object, bench:string[],
 *   positionRank:Object, rotation:string[], bullpen:string[], bullpenRoles:Object, byId:Map}}
 */
function buildDepthChart(roster, cfg, opts = {}) {
  const dh = opts.dh ?? true;
  const rotationSize = cfg.league.rotationSize;
  const pitchers = roster.filter((p) => p.role === 'pitcher');
  const fielders = roster.filter((p) => p.role === 'fielder');
  const byId = new Map(roster.map((p) => [p.id, p]));

  // positionRank: ポジションごとの候補ランキング（S3 usage.mjs の見直し対象の初期値）
  const positionRank = {};
  for (const pos of FIELD_POSITIONS) {
    positionRank[pos] = fielders
      .slice()
      .sort((a, b) => posRankScore(b, pos, cfg) - posRankScore(a, pos, cfg))
      .map((p) => p.id);
  }

  // 守備配置: 難ポジ優先（C→SS→CF→…）で positionRank 上位の未使用選手を割当
  const used = new Set();
  const defense = {};
  for (const pos of POSITION_DIFFICULTY) {
    const pid = positionRank[pos].find((id) => !used.has(id));
    used.add(pid);
    defense[pos] = pid;
  }

  // スタメン外の野手（hitScore降順）。DH有なら先頭がDH、残りがベンチ。
  const reserves = fielders.filter((f) => !used.has(f.id)).sort((a, b) => hitScore(b) - hitScore(a));
  const dhId = dh ? (reserves.length ? reserves[0].id : defense['1B']) : null;
  const bench = reserves.filter((f) => f.id !== dhId).map((f) => f.id);

  // --- 打順アーキタイプ（§S1-3） -------------------------------------------
  const pool = FIELD_POSITIONS.map((pos) => ({ playerId: defense[pos], pos }));
  if (dh && dhId) pool.push({ playerId: dhId, pos: 'DH' });
  const P = (e) => byId.get(e.playerId);
  const take = (scoreFn) => {
    let bi = -1;
    let bv = -Infinity;
    for (let i = 0; i < pool.length; i++) {
      const v = scoreFn(P(pool[i]));
      if (v > bv) {
        bv = v;
        bi = i;
      }
    }
    return pool.splice(bi, 1)[0];
  };

  const slots = new Array(9).fill(null);
  // 9番: DH無なら投手（当日の先発。S2 initSide v2 が playerId を充填）、DH有なら最弱野手
  slots[8] = dh ? take((p) => -hitScore(p)) : { playerId: null, pos: 'P' };
  slots[2] = take(hitScore); // 3番=最強総合
  slots[3] = take(powerScore); // 4番=最強パワー
  slots[4] = take(powerScore); // 5番=次点パワー
  slots[0] = take((p) => obpScore(p) + cfg.tuning.depth.leadoffSpeedW * (p.trueAbility.common.speed - 50)); // 1番=OBP×俊足
  slots[1] = take((p) => obpScore(p) + p.trueAbility.batting.contact); // 2番=コンタクト/出塁
  // 6-8番: 残りを hitScore 降順
  const rest = pool.slice().sort((a, b) => hitScore(P(b)) - hitScore(P(a)));
  slots[5] = rest[0];
  slots[6] = rest[1];
  slots[7] = rest[2];

  // --- ローテ＆ブルペン ------------------------------------------------------
  const sortedP = pitchers.slice().sort((a, b) => starterScore(b) - starterScore(a));
  const rotation = sortedP.slice(0, rotationSize).map((p) => p.id);
  const bullpen = sortedP
    .slice(rotationSize)
    .sort((a, b) => relieverScore(b) - relieverScore(a))
    .map((p) => p.id);
  // ブルペン役割（§S1-3）: relieverScore順に closer/setup8/setup7、long は最下位、残り middle
  const bullpenRoles = {
    closer: bullpen[0] ?? null,
    setup8: bullpen[1] ?? null,
    setup7: bullpen[2] ?? null,
    middle: bullpen.slice(3, Math.max(3, bullpen.length - 1)),
    long: bullpen.length >= 4 ? bullpen[bullpen.length - 1] : null,
  };

  return { lineup: slots, defense, bench, positionRank, rotation, bullpen, bullpenRoles, byId };
}

//   - 名前は完全架空（実在選手名・そのもじりを使わない）。姓名パーツの手続き合成。
//   - 能力は分布から個体ごとに引く（§1「合わせるのは集団の分布」）。中心50/裾でばらす。
//   - 三層の器を埋める: layer1=trueAbility（ここで生成）/ layer3=scoutSeed / layer2=空。

// ============================================================================

// 球団アクセントカラー（UI表示専用の識別色）。TEAM_NAMES とインデックス対応で定義し、
// 改名時に色マップだけ取り残される乖離を構造的に防ぐ。エンジンのロジックはこれを読まない。

const TEAM_ABBRS = [

  '翠嶺', '金獅子', '銀翼', '暁', '嵐山', '夜叉',
