             border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  .warcard:hover { background:#174a34; cursor:pointer; }

  .warname { flex:1; font-size:14px; } .wn1 { font-weight:700; }

<div id="app"></div>
<script>
// ===== src/rng.mjs =====
// ============================================================================
// 決定論RNG基盤（§3.1 §17 §19 / 自己レビュー M2・F35・F41）
//
// 設計:
//   - 階層シード: masterSeed → hashSeed(season, game, pa, ...) で打席ごとに独立RNG。
//     「実行順序に依存しない」＝ 任意の試合/打席を単独・任意順で再現できる（並列化・§19突合に必須）。
//   - PRNG: mulberry32（素のLCGでなくカウンタ系。1状態語で高品質・自己完結）。
//   - Box-Muller: 予備値をキャッシュしない（毎回2一様乱数を消費し1つ返す）。
//     → 隠れ状態ゼロで版間・端末間・シリアライズ跨ぎでも完全再現（F41）。
//   - 直列化: 状態は uint32 一語。serializeRng→number / makeRng(number) で復元（セーブ対象）。
// ============================================================================

/** mulberry32 の1ステップ。state.a を進めて float[0,1) を返す。 */
function step(state) {
  const a = (state.a + 0x6d2b79f5) | 0;
  state.a = a;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

/** 素の関数版PRNG（selfCheck等の軽用途） */
function mulberry32(seed) {
  const state = { a: seed >>> 0 };
  return () => step(state);
}

/**
 * 複数の整数/文字列を 32bit シードへ決定論的に畳み込む（FNV-1a派生）。
 * hashSeed(masterSeed, seasonId, gameId, paIndex) の形で階層シードを作る。
 */
function hashSeed(...parts) {
  let h = 0x811c9dc5 >>> 0;
  const byte = (b) => {
    h ^= b & 0xff;
    h = Math.imul(h, 0x01000193);
  };
  for (const p of parts) {
    if (typeof p === 'string') {
      for (let i = 0; i < p.length; i++) byte(p.charCodeAt(i));
    } else {
      let n = Math.trunc(p) >>> 0;
      byte(n);
      byte(n >>> 8);
      byte(n >>> 16);
      byte(n >>> 24);
    }
  }
  // 最終ミックス
  h ^= h >>> 16;
  h = Math.imul(h, 0x85ebca6b);
  h ^= h >>> 13;
  return h >>> 0;
}

/**
 * RNGオブジェクト。状態は state.a（uint32）に閉じる＝シリアライズ可能。
 */
function makeRng(seed) {
  const state = { a: seed >>> 0 };
  const rng = {
    state,
    /** float [0,1) */
    next() {
      return step(state);
    },
    /** 整数 [0,n) */
    int(n) {
      return Math.floor(step(state) * n);
    },
    /** 実数 [lo,hi) */
    range(lo, hi) {
      return lo + step(state) * (hi - lo);
    },
    /** 標準正規（Box-Muller・予備値キャッシュなし＝隠れ状態ゼロ） */
    normal(mean = 0, sd = 1) {
      let u1 = step(state);
      if (u1 < 1e-12) u1 = 1e-12; // log(0) 回避
      const u2 = step(state);
      const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
      return mean + sd * z;
    },
    /** 確率 p で true */
    chance(p) {
      return step(state) < p;
    },
    /** 子RNGを決定論的に派生（順序非依存） */
    fork(...parts) {
      return makeRng(hashSeed(state.a, ...parts));
    },
  };
  return rng;
}

/**
 * 階層シードから、指定座標(season/game/pa等)の打席用RNGを作る。
 * 実行順序に依存せず、同じ座標は常に同じ列を返す。
 */
function rngFor(masterSeed, ...coords) {
  return makeRng(hashSeed(masterSeed, ...coords));
}

/** 状態を数値へ（セーブ用） */
function serializeRng(rng) {
  return rng.state.a >>> 0;
}

/** 数値状態から復元（makeRng(state) はその地点から続きを再現する） */
function deserializeRng(stateNumber) {
  return makeRng(stateNumber >>> 0);
}


// ===== src/model/positions.mjs =====
// ポジション・球種などの定数（§7 §9 §13 §4）。
// ⚠️ ここの数値（posAdj等）はMLB標準の初期値。143試合/NPBへの再スケールは
//    中央config(0-4)＋較正(2-9)で行う。定数の"出発点"としてのみ置く。

/** 守備位置（投手Pはroleで扱う。DHは守備なし打撃専念） */
const POSITIONS = ['C', '1B', '2B', '3B', 'SS', 'LF', 'CF', 'RF', 'DH'];

/** 野手の守備位置のみ（DH除く） */
const FIELD_POSITIONS = ['C', '1B', '2B', '3B', 'SS', 'LF', 'CF', 'RF'];

/**
 * 位置補正（1350守備イニングあたりの Run 値・MLB標準の初期値）。§9。
 * 難ポジほど+、易ポジほど−。143試合較正で config から再スケールする。
 */
const POSITION_ADJUST_PER_1350 = {
  C: 12.5,
  SS: 7.5,
  '2B': 2.5,
  '3B': 2.5,
  CF: 2.5,
  RF: -7.5,
  LF: -7.5,
  '1B': -12.5,
  DH: -17.5,
};

/** 守備難易度の序列（難→易）。§9/§13。コンバート成否・延命判定に流用。 */
const POSITION_DIFFICULTY = ['C', 'SS', 'CF', '2B', '3B', 'RF', 'LF', '1B'];

/** 球種（§2.4）。各投手はこの一部を保有する。 */
const PITCH_TYPES = [
  'fastball', // ストレート
  'sinker', // シンカー/ツーシーム
  'cutter', // カット
  'slider', // スライダー
  'curve', // カーブ
  'changeup', // チェンジアップ
  'fork', // フォーク/スプリット
];

/** 速球系（対速球/対変化球の2軸分類・§4段階1） */
const FASTBALL_TYPES = new Set(['fastball', 'sinker', 'cutter']);

/** 球種を2クラス（速球/変化球）に分類 */
function pitchClass(type) {
  return FASTBALL_TYPES.has(type) ? 'fastball' : 'breaking';
}


// ===== src/model/player.mjs =====
// ============================================================================
// 選手データモデル（§2）
//
// 三層構造（§1・本作の背骨）:
//   layer1 真の実力  = player.trueAbility        … 隠しパラメータ（本人の本当の能力）
//   layer2 観測成績  = player.career.seasons[...] … 真値+打席ノイズ（simで湧く。§5集計）
//   layer3 球団の評価 = 球団AI側が trueAbility+スカウト誤差 で持つ（フェーズ3）。
//                       ここでは誤差シードの器 player.scoutSeed のみ用意。
//
// 能力素材は登録(role)に依らず常時両方保持する（§2.1 転向で重要）。
// レーティングは 20–80 スカウティングスケール（50=リーグ平均）。球速のみ km/h 実数（§2.4）。
// 本ステップ(0-3)は"形"を確定するのが目的。分布からの生成は 0-6。
// ============================================================================


/**
 * @typedef {Object} PitchRating 1球種の能力（§2.4）
 * @property {string} type
 * @property {number} current   現在値(20-80)
 * @property {number} potential 潜在値(20-80)
 * @property {number} whiff     空振り寄与
 * @property {number} hrSuppress 被弾抑止（高いほど打たれにくい）
 * @property {number} contactQuality 被コンタクト質の抑止
 */

/** 1球種レーティングを生成（空振り率と被弾率は別能力＝別プロファイル。§4） */
function createPitch(type, over = {}) {
  return {
    type,
    current: 50,
    potential: 50,
    whiff: 50,
    hrSuppress: 50,
    contactQuality: 50,
    ...over,
  };
}

/**
 * 真の実力（layer1）。全軸を常時保持。§2.2〜§2.7。
 */
function createTrueAbility(over = {}) {
  const base = {
    // §2.2 共通素材（登録・ポジション非依存の本人の持ち物）
    common: {
      speed: 50, // 走力（走塁/守備範囲のスピード成分）— 早く落ちる
      arm: 50, // 肩（送球/投手なら球速の素地）— 中間
      hands: 50, // 手・確実性（エラー回避/コンタクト素地）— 安定
      reaction: 50, // 反応・初動（守備範囲の初動成分）— やや弱い
      power: 50, // 生体パワー（打球速度EVの素地）— 20代天井後 維持
    },
    // §2.3 打撃系
    batting: {
      ev: 50, // EV適性（打球速度ポテンシャル＝生体Power×スイング効率）
      la: 50, // LA適性（打球角度の最適化スキル）— 技術寄り・加齢に強い
      pull: 50, // 方向適性（>50 引っ張り / <50 流し）
      contact: 50, // コンタクト資質（芯を食う頻度）— 技術寄り
      eye: 50, // 選球眼 — 加齢でむしろ伸びる
      vsFastball: 50, // 対速球適性（§4段階1）
      vsBreaking: 50, // 対変化球適性（§4段階1）
      // hot/cold ゾーン（球種格子 段階2〜, §4）は後付け（フェーズ2以降）
    },
    // §2.4 投手系
    pitching: {
      velocityKmh: 145, // 球速（km/h 実数・レーティングとは別枠）
      control: 50, // 制球 — 技巧寄り・加齢に強い
      stamina: 50, // スタミナ（イニング耐性軸, §16）
      gbRate: 50, // ゴロ率（打たせて取るタイプ）
      hold: 50, // クイック/Hold（盗塁抑止・§6 wSBの入力。0-3で追加）
      pitches: [], // PitchRating[]（球種構成＝投手タイプ, §8）
    },
    // §2.5 野手守備系
    fielding: {
      positionProf: fielderProfInit(), // ポジション別習熟テーブル（経験で上下, §13）
      positioningIQ: 50, // ポジショニングIQ — 経験・技巧寄り・加齢に強い
      framing: 50, // フレーミング（捕手専用）
    },
    // §2.6 走塁系
    baserunning: {
      steal: 50, // 盗塁技術（スタート/スライディング）— 足の速さと別物
      baserunIQ: 50, // 走塁IQ（進塁判断）— 経験で伸び加齢に強い
    },
    // §2.7 キャリア・パラメータ（分布から引く: §10.2, §12.4。0-6/フェーズ3で使用）
    career: {
      peakAge: 27, // ピーク年齢
      declineRate: 0.5, // 衰え速度（能力タイプと相関, §10.2）
      injuryHistory: [], // 故障歴（最大リスク・再発, §10.5）
      breakEvents: [], // ブレイクイベント履歴（上下, §10.4）
    },
  };
  return deepMerge(base, over);
}

function fielderProfInit() {
  const m = {};
  for (const p of FIELD_POSITIONS) m[p] = 20; // 新ポジションは低スタート（§13）
  return m;
}

/**
 * 選手（三層のコンテナ）。
 * @param {Object} o
 * @param {string} o.id
 * @param {string} o.name  完全架空の名前（§0法的前提）。生成は0-6。
 * @param {'pitcher'|'fielder'} o.role 登録区分（能力素材は両方保持）
 */
function createPlayer(o = {}) {
  return {
    id: o.id ?? null,
    name: o.name ?? '',
    role: o.role ?? 'fielder',
    bats: o.bats ?? 'R', // 'R'|'L'|'S'
    throws: o.throws ?? 'R', // 'R'|'L'
    age: o.age ?? 24,
    birthSeason: o.birthSeason ?? null,
    teamId: o.teamId ?? null,
    rosterStatus: o.rosterStatus ?? 'active', // active|minor(育成)|fa|retired（フェーズ3で活用）

    trueAbility: o.trueAbility ?? createTrueAbility(), // layer1（隠し）

    // layer3 の基盤: 球団評価はスカウト誤差で歪む（§1, §13）。
    // 誤差は球団×選手で決まるので、選手側は再現用シードのみ持つ（評価値は球団AIが算出, フェーズ3）。
    scoutSeed: o.scoutSeed ?? null,

    // layer2 観測成績: シーズン別スタットライン（simが埋める, §5）。season -> PlayerSeason
    career: { seasons: {} },
  };
}

/**
 * 実効打席サイド（左右プラトーン・S1/M7解消）。
 * スイッチ(S)は常に投手の利き腕と逆＝有利側に立つ（NPB/MLBの実運用どおり）。
 */
function effectiveBats(batter, pitcher) {
  if (batter.bats === 'S') return pitcher.throws === 'L' ? 'R' : 'L';
  return batter.bats;
}

/** 同利きマッチアップか（打者に不利な側。config.tuning.platoon の補正対象判定） */
function isSameHand(batter, pitcher) {
  return effectiveBats(batter, pitcher) === pitcher.throws;
}

/** 浅い階層のディープマージ（配列は置換） */
function deepMerge(base, over) {
  if (over == null) return base;
  const out = Array.isArray(base) ? base.slice() : { ...base };
  for (const k of Object.keys(over)) {
    const bv = base[k];
    const ov = over[k];
    out[k] =
      bv && ov && typeof bv === 'object' && typeof ov === 'object' && !Array.isArray(bv)
        ? deepMerge(bv, ov)
        : ov;
  }
  return out;
}

/** 最低限のスキーマ検証（スキーマ・ドリフトの早期検出用） */
function validatePlayer(p) {
  const errors = [];
  if (!p || typeof p !== 'object') return ['player is not an object'];
  if (p.role !== 'pitcher' && p.role !== 'fielder') errors.push(`bad role: ${p.role}`);
  const t = p.trueAbility;
  if (!t) errors.push('missing trueAbility');
  else {
    for (const grp of ['common', 'batting', 'pitching', 'fielding', 'baserunning', 'career']) {
      if (!t[grp]) errors.push(`missing trueAbility.${grp}`);
    }
    if (t.pitching && typeof t.pitching.hold !== 'number') errors.push('missing pitching.hold');
  }
  return errors;
}


// ===== src/model/battedball.mjs =====
// ============================================================================
// 打球イベントオブジェクト＋球場ジオメトリ（§3.2）—「一粒五度おいしい」の単一入力
//
// 接触した瞬間に打球3要素(EV/LA/方向)を先に生成し、球場ジオメトリと突き合わせて
// 落下点・滞空時間を出す。この"1個の打球レコード"から、
//   スプレーチャート(§16) / OAA好守拙守(§7.2) / UBR進塁(§6) / 対球種成績(§4)
// が全部派生する。結果を先に決めてゾーンを後付けする旧来設計を逆転させる。
//
// 座標系: 本塁を原点、+y をセンター方向、x を横（−=三塁側/左, +=一塁側/右）。単位はメートル。
// 方向角 sprayAngle: 0=センター, −45=左翼線, +45=右翼線（度）。
// EV は km/h（NPB表記に合わせる）、LA は度。
// ============================================================================

/**
 * @typedef {Object} BattedBall
 * @property {number} evKmh       打球速度 km/h（§3.2: 打者EV適性×投球の質×芯度）
 * @property {number} laDeg       打球角度 度（§3.2: 打者LA適性×投手GB%相性）
 * @property {number} sprayDeg    方向角 度（§3.2: 引っ張り/流し×投球コース）
 * @property {number|null} landingX 落下点X(m)
 * @property {number|null} landingY 落下点Y(m)
 * @property {number|null} distanceM 飛距離(m)
 * @property {number|null} hangTimeS 滞空時間(秒)
 * @property {string|null} pitchType 対戦球種（§4集計の素）
 * @property {string|null} batterId
 * @property {string|null} pitcherId
 * @property {string|null} fielderPos 担当野手ポジション（OAAの主語）
 * @property {number} baseState   塁状況 0..7（bit0:一塁, bit1:二塁, bit2:三塁）
 * @property {number} outs        アウトカウント 0..2
 * @property {string|null} result 最終結果（'1B'|'2B'|'3B'|'HR'|'out'|'error'...）simが確定
 */

/** 打球イベントを生成（3要素は必須、幾何・結果は後段で埋める） */
function createBattedBall(o = {}) {
  return {
    evKmh: o.evKmh ?? 0,
    laDeg: o.laDeg ?? 0,
    sprayDeg: o.sprayDeg ?? 0,
    landingX: o.landingX ?? null,
    landingY: o.landingY ?? null,
    distanceM: o.distanceM ?? null,
    hangTimeS: o.hangTimeS ?? null,
    pitchType: o.pitchType ?? null,
    batterId: o.batterId ?? null,
    pitcherId: o.pitcherId ?? null,
    fielderPos: o.fielderPos ?? null,
    baseState: o.baseState ?? 0,
    outs: o.outs ?? 0,
    result: o.result ?? null,
  };
}

/**
 * 球場ジオメトリ。中立球場は左右対称。フェンス距離は方向角の関数で表す（パークファクターはフェーズ4）。
 * NPB標準寄りの中立値: 両翼 100m / 中堅 122m / フェンス高 4m。
 */
function createBallpark(o = {}) {
  return {
    name: o.name ?? 'Neutral Park',
    lineDistM: o.lineDistM ?? 100, // 両翼（ファウルライン上, |spray|=45）
    centerDistM: o.centerDistM ?? 122, // 中堅（spray=0）
    gapDistM: o.gapDistM ?? 116, // 左右中間の目安（|spray|≈20）
    fenceHeightM: o.fenceHeightM ?? 4,
  };
}

/** 中立球場（既定） */
const NEUTRAL_PARK = createBallpark();

/**
 * 指定方向角のフェンスまでの距離(m)。ライン(100)〜中堅(122)を滑らかに補間。
 * cos ベースの単純近似（中堅で最大、ライン方向で最小）。パーク非対称はフェーズ4で拡張。
 */
function fenceDistanceAt(sprayDeg, park = NEUTRAL_PARK) {
  const a = Math.min(Math.abs(sprayDeg), 45) / 45; // 0(中堅)..1(ライン)
  return park.centerDistM + (park.lineDistM - park.centerDistM) * a;
}

// モデル共通の小ヘルパー（ブラウザ安全・依存ゼロ）。
// バンドル後は全モジュールが同一スコープに並ぶため、共有ヘルパーはここ一箇所に定義する。

/** 値を [min,max] に丸める */
function clamp(v, min, max) {
  return v < min ? min : v > max ? max : v;
}

/** 能力のスカウティングスケール（20=最低, 50=リーグ平均, 80=最高）に丸める */
function clampRating(v) {
  return clamp(Math.round(v), 20, 80);
}

/** src の数値プロパティを dst に加算（両者フラットな数値マップ前提の集計ヘルパー） */
function addNumeric(dst, src) {
  for (const k of Object.keys(src)) {
    if (typeof src[k] === 'number') dst[k] = (dst[k] || 0) + src[k];
  }
  return dst;
}

function createSplitLine() {
  return { pa: 0, ab: 0, h: 0, b1: 0, b2: 0, b3: 0, hr: 0, bb: 0, hbp: 0, so: 0, sf: 0 };
}

    gdp: 0, // 併殺打（wGDPの素, §6）
    sb: 0, // 盗塁（wSBの素, §6）
    cs: 0, // 盗塁死

    vsFastball: { pa: 0, ab: 0, h: 0, hr: 0, so: 0, bb: 0 },

    // --- B3a 追加集計（一球データ不要・打球イベントの副産物。§B3） ------------
    // 打球期待値アキュムレータ（xBA/xSLG/xwOBA）: resolveBattedBall の期待out率/塁打分布を

    xB1: 0, xB2: 0, xB3: 0, xHR: 0,
    // 打球分類（GB/LD/FB/PU%・被弾含む全インプレー打球）と方向（Pull/Cent/Oppo%）。
    // 分母 bbEvents = bbGB+bbLD+bbFB+bbPU = bbPull+bbCent+bbOppo。
    bbGB: 0, bbLD: 0, bbFB: 0, bbPU: 0, bbEvents: 0,
    bbPull: 0, bbCent: 0, bbOppo: 0,
    // 打球質（Barrel/HardHit/SweetSpot・分母=bbEvents）と打球速度（平均=evSum/bbEvents, 最大=evMax）。
    barrels: 0, hardHits: 0, sweetSpots: 0, evSum: 0, evMax: 0,
    // --- B2 文脈指標（RE24/WPA/LI・§B2。2パスでRE行列/WE表/LI表を焼いてから accumulate）------
    // 打者の打席プレーぶんの ΔRE(得点期待値変化＋得点) と ΔWE(勝率変化=WPA)、
    // liSum=打席状態レバレッジの合計（aLI = liSum/pa）、wpaLiSum=Σ(打席WPA/打席LI)（文脈中立WPA/LI）。
    // context無効時は 0 のまま（既存較正は不変）。
    re24: 0, wpa: 0, liSum: 0, wpaLiSum: 0,
    // --- B3b 打撃スプリット（対左/対右・得点圏・ホーム/ビジター・§B3b）。game.mjs で1打席ごとに計上。
    // 通算/リーグ集計では合算しない（addNumeric がネストを触らない＝最新シーズンの内訳表示用・vsFastball同様）。
    // 恒等: vsL.pa + vsR.pa = pa（全打席は左右いずれかの投手と対戦）／home.pa + away.pa = pa。
    splits: {
      vsL: createSplitLine(), // 対左投手
      vsR: createSplitLine(), // 対右投手
      risp: createSplitLine(), // 得点圏（打席開始時に走者二塁 or 三塁）
      home: createSplitLine(), // ホーム打席

    },

}

/** 投手の生カウント（§8 §9）。IPは outs で持つ（1/3イニングの丸め誤差回避）。 */

    bbGB: 0, bbLD: 0, bbFB: 0, bbPU: 0, bbEvents: 0,

/** 走塁（盗塁以外の進塁。§6 UBR/wGDPの素）。盗塁数自体は打撃側にも計上。 */
function createBaserunningLine() {
  return {
    advOpp: 0, // 進塁機会（単打で2→本 / 二塁打で1→本 の判断が発生した回数。UBRの分母）
    advTaken: 0, // うち追加進塁（生還）を取った回数

    re24: 0, wpa: 0,

}

/** 守備（§7 §9）。posAdj/UZRの土台＝ポジション別 守備アウト勘定を必ず持つ。 */
function createFieldingLine() {
  const positionOuts = {}; // ポジション -> 守備アウト数（イニング=outs/3）
  for (const p of FIELD_POSITIONS) positionOuts[p] = 0;
  return {
    positionOuts,
    chances: 0,
    po: 0, // 刺殺
    a: 0, // 補殺
    e: 0, // 失策
    oaaOuts: 0, // OAA（実アウト − 期待アウト、outs単位）§7.2。集計で加算
    framingRuns: 0, // フレーミング(捕手)。集計で加算

    // これらは WAR用 uzrRuns には入れず、uzrComponents（分解表示）でのみ合成する（較正30指標が不変）。
    armOpp: 0, // 外野: 単打×二塁走者 / 二塁打×一塁走者 の追加進塁機会に相対した回数
    armRuns: 0, // 外野ARM run（(arm-50)×armRunPerOpp を機会ごとに累積・対平均）
    dpOpp: 0, // 二遊間: 併殺機会（GB×走者一塁×2死未満で当該ポジ在籍）
    dpTurned: 0, // うち併殺成立（DPR＝対リーグ平均転換率で metrics 側が run 換算）
    sbAllowed: 0, // 捕手: 許した盗塁（rSBの素）
    csMade: 0, // 捕手: 刺した盗塁死（rSBの素）
  };

/** 選手×シーズンの器（layer2 観測成績の実体） */
function createPlayerSeason(playerId, season) {
  return {

    teamId: null,
    batting: createBattingLine(),
    pitching: createPitchingLine(),
    baserunning: createBaserunningLine(),

  return {
    teamId,
    season,
    g: 0,
    w: 0,

// --- 集計ヘルパー（2パス集計・通算集計で使用） -------------------------------

/** バッティングを加算（dst に src を足し込む）。evMax のみ最大（通算集計での二重加算を防ぐ・B3a）。 */
function addBattingLine(dst, src) {
  const em = Math.max(dst.evMax || 0, src.evMax || 0);
  addNumeric(dst, src);
  dst.evMax = em;
  return dst;
}

/** ピッチングを加算 */
function addPitchingLine(dst, src) {
  return addNumeric(dst, src);
}

/** 走塁を加算 */
function addBaserunningLine(dst, src) {
  return addNumeric(dst, src);
}

/** 守備を加算（positionOuts マップは個別に、他は数値加算） */
function addFieldingLine(dst, src) {
  for (const p of Object.keys(src.positionOuts || {})) {
    dst.positionOuts[p] = (dst.positionOuts[p] || 0) + src.positionOuts[p];
  }
  for (const k of Object.keys(src)) {
    if (k !== 'positionOuts' && typeof src[k] === 'number') dst[k] = (dst[k] || 0) + src[k];
  }
  return dst;
}

/** 選手シーズンを別の器へ加算（通算/リーグ集計用） */
function addPlayerSeason(dst, src) {
  addBattingLine(dst.batting, src.batting);
  addPitchingLine(dst.pitching, src.pitching);
  addBaserunningLine(dst.baserunning, src.baserunning);
  addFieldingLine(dst.fielding, src.fielding);
  return dst;
}

    framePerInning: 0.0005, // 捕手フレーミング: (framing-50)×これ×守備イニング をrun換算（監査B5・§7.3）
    // --- B3b UZR成分分解（ARM/DPR/rSB・§B3b）: 追加集計の対平均run換算係数。
    //     いずれも WAR用の uzrRuns には加えず（＝較正30指標が完全不変）、
    //     uzrComponents（分解表示）でのみ合成する（総UZR不変が理想・§検証）。
    armRunPerOpp: 0.007, // 外野ARM: 追加進塁機会1回あたり (arm-50)×これ をrun換算（対平均・game.mjsで累積。上位+5〜12run）
    runPerDP: 0.45, // DPR: 併殺1つ（対リーグ平均転換率）あたりのrun価値（二遊間）
  },
  // 走塁 Spd（簡易4成分・Bill James風0-10スケール・§B3b）: SB成功率×頻度・三塁打率・XBT%・守備位置速度の合成。
  spd: {
    minSbAtt: 5, // 盗塁成功率を採用する最小企図数（未満は中立）
    neutralSbRate: 0.5, // 企図僅少時の中立成功率
    sbFreqRef: 0.15, // 盗塁企図頻度（企図/一塁到達）の10点基準
    b3Ref: 0.02, // 三塁打率（三塁打/インプレー）の10点基準
    xbtRef: 0.6, // XBT%（追加進塁率）の10点基準
    posDefault: 4, // 位置速度の既定
    posSpeed: { CF: 8, SS: 7, '2B': 6, '3B': 4, RF: 5, LF: 4, C: 2, '1B': 2, DH: 3 }, // 守備位置の速度性（0-10）
  },

  // 対戦巡目（1-5, §3.3）: 同一投手を1試合に複数回見るほど打者有利。
  // Phase1は一律係数のプレースホルダ。球種数重み付けは 2-1/2-2 後に有効化。
  tto: {
    kPerTime: 0.025, // 2巡目以降、K の logit を巡目あたり減らす（打者は三振しにくく）
    evPerTime: 0.7, // 2巡目以降、打球EV を巡目あたり +km/h（芯を捉えやすく）
  },

  // 打球生成(1-2)＋結果解決(1-3)。EV/LA/方向を先に作り、球場ジオメトリで結果を導く（§3.2）。
  // ※ bb 群は予備較正済み（5リーグ平均で AVG.258/OBP.323/SLG.401/HR118/ERA3.85/得点4.22、
  //    かつ分布の裾も 打率王.348/HR王47 まで圧縮=M4対応。RBI王~145は満員打線ゆえ構造的に高め）。
  bb: {
    // EV(打球速度 km/h)
    evBase: 139, // 平均打球速度の中心
    evPerEV: 0.355, // 打者EV適性1pt → km/h ※S5較正（裾圧縮＝野手WAR王7-9.5）
    evPerPower: 0.2, // 生体power1pt → km/h ※S5較正
    evPitchSuppress: 0.3, // 投手の被コンタクト質抑止1pt → km/h減（選択球種のcontactQuality）
    evHrSuppressW: 0.25, // 選択球種のhrSuppressが高いほどEV減（弱い打球＝M3の結線）
    evAptW: 0.26, // 打者の対該当クラス適性が高いほどEV増（§4段階1）
    evSd: 14,
    // LA(打球角度 度)
    laBase: 12,
    laPerLA: 0.42, // 打者LA適性 → 角度中心シフト ※S5較正（HR王の裾はLA側で確保）
    laPitchGB: 0.22, // 投手ゴロ率 → 角度を下げる
    laSd: 23,
    // 方向(spray 度: 0=中堅, ±45=ライン)。pull適性で引っ張り側へ。
    sprayPull: 0.55,
    spraySd: 17,
    // 飛距離モデル
    carry: 0.6, // v^2/g に掛ける実効係数（空気抵抗込みの縮み）
    // 結果グリッド（xBABIP系。type別の基準hit率＋EV補正）
    hitGB: 0.2195, // ※S5較正
    hitLD: 0.672, // 文献整合(ライナー安打率~.68-.70)へ引上げ(B-8)。得点環境は下の較正で再収束
    hitFB: 0.131, // ※S5較正
    hitPU: 0.02,
    evHitW: 0.003, // (evKmh-140)×これ を hit率に加算 ※S5較正（BABIP裾＝打率王≤.355）
    gapDistM: 85.5, // 単打/二塁打の境界（外野手到達圏）。これ未満の空中安打は単打（監査B1で84→90、S5較正でSLG帯確保のため85.5へ。fbHitBonusM=84より上を維持）
    fbHitBonusM: 84, // FB警告帯ヒット加点(+0.15)の閾値。BABIP環境を保つため二塁打境界と分離（監査B1）
    tripleDistM: 94, // 二塁打/三塁打候補の深さ。これ以上の深いギャップ/ライン際球が三塁打になりうる（監査B1）
    tripleBase: 0.32, // 深いギャップ球の三塁打基本率（打者speedで上下）※較正済み
    tripleSpeedW: 0.007, // 打者speed(50中心)→三塁打率への寄与
    // 失策（ROE・§7 Hands）。インプレーのアウトが確率 errBase−(Hands−50)×errHandsW で失策になる。
    // 失策以降その回の得点は非自責（ERA<失点 の差＝未自責点を生む・較正の整合に必須）。
    errBase: 0.023,
    errHandsW: 0.0006,
    // 走者進塁の確率（Phase1簡易。UBRの精緻化は2-5）
    singleScore2: 0.6, // 単打で二塁走者が生還する確率（残りは三塁止まり）※S5較正（得点環境・rpw）
    doubleScore1: 0.50, // 二塁打で一塁走者が生還する確率（残りは三塁止まり）※較正済み（監査B後の得点環境再収束）
  },
};

/**
 * シムのラン環境から 1-6（リーグ定数導出パス）で埋める定数の器。
 * §18の 13.3/1.216 等は「初期値」であって、ここに導出値を上書きしてから指標を確定する（2パス）。
 */
function createLeagueConstants() {
  return {
    linearWeights: null, // {bb,hbp,b1,b2,b3,hr, outValue,...}
    wobaScale: null,
    lgwOBA: null,
    lgFIP: null,
    fipConstant: null,
    rpw: null, // Runs Per Win
    posAdjPer1350: null, // 143試合へ再スケール後の位置補正（§9・M3）
  };
}

/** 設定一式のディープコピーを配る（較正ランごとに独立させる） */
function createConfig(overrides = {}) {
  const cfg = {
    version: CONFIG_VERSION,
    league: clone(LEAGUE_DEFAULT),
    targets: clone(CALIBRATION_TARGETS),
    tuning: clone(TUNING_DEFAULT),
    leagueConstants: createLeagueConstants(),
  };
  return deepAssign(cfg, overrides);
}

// --- 試合数依存の媒介変数（M3: 162試合MLB定数を143へ再スケール） -------------
/** 規定打席（≒ games×3.1） */
function qualifiedPA(games = LEAGUE_DEFAULT.gamesPerSeason) {
  return Math.round(games * 3.1);
}
/** 規定投球回（= games×1） */
function qualifiedIP(games = LEAGUE_DEFAULT.gamesPerSeason) {
  return games;
}
/** フル出場の守備イニング（= games×9）。posAdj の分母（旧1350の置換） */
function fieldingInningsFull(games = LEAGUE_DEFAULT.gamesPerSeason) {
  return games * 9;
}

/** 値が [min,max] に収まるか（較正の合否判定ヘルパー） */
function inRange(v, range) {
  return v >= range[0] && v <= range[1];
}

// --- 内部ヘルパー -----------------------------------------------------------
function clone(o) {
  return JSON.parse(JSON.stringify(o));
}
function deepAssign(base, over) {
  for (const k of Object.keys(over)) {
    const ov = over[k];
    if (base[k] && ov && typeof base[k] === 'object' && typeof ov === 'object' && !Array.isArray(ov)) {
      deepAssign(base[k], ov);
    } else if (ov !== null && typeof ov === 'object') {
      base[k] = clone(ov); // 葉のオブジェクト/配列は複製し、override元との状態共有を断つ
    } else {
      base[k] = ov; // null・プリミティブは葉として代入
    }
  }
  return base;
}


// ===== src/sim/fielding.mjs =====
// ============================================================================
// 守備の能力→結果 結線（2-7）＋ OAA→UZR run換算（2-8）（§7 / 自己レビュー M1・B-7）
//
// Range（守備範囲）= ポジショニングIQ + 初動(Reaction) + 走力(Speed)（§7.1）を合成し、
// 打球結果解決(resolveBattedBall)に注入して「実効被安打率」を個人スキルで上下させる。
// 期待アウトのベースラインはリーグ平均(ポジション中立)のままなので、
// 実結果 − 期待 の累積(oaaOuts)が個人のレンジ・シグナルになる（MLBAM OAAと同型）。
// ============================================================================

const OUTFIELD = new Set(['LF', 'CF', 'RF']);

/** 野手のRangeレーティング（50=リーグ平均）。§7.1 の Range = ポジIQ+初動+走力 */
function rangeRating(player, cfg) {
  const f = player.trueAbility.fielding;
  const c = player.trueAbility.common;
  const w = cfg.tuning.field.wRange;
  return w.positioningIQ * f.positioningIQ + w.reaction * c.reaction + w.speed * c.speed;
}

/** 選手シーズンの主守備位置（守備アウト最多）。出場イニング0なら ''（S2: 代打のみの選手が出うる） */
function mainPosition(fieldingLine) {
  let pos = '';
  let mx = 0;
  for (const k of Object.keys(fieldingLine.positionOuts)) {
    if (fieldingLine.positionOuts[k] > mx) {
      mx = fieldingLine.positionOuts[k];
      pos = k;
    }
  }
  return pos;
}

/** 選手の総守備イニング */
function totalFieldInnings(fieldingLine) {
  let o = 0;
  for (const k of Object.keys(fieldingLine.positionOuts)) o += fieldingLine.positionOuts[k];
  return o / 3;
}

/**
 * ポジション別に中心化した OAA（アウト単位）。
 * 生の oaaOuts はリーグ中立基準ゆえ「出場している守備者（＝上手い選手ばかり）」が全員プラスに
 * 偏る。正しくは「そのポジションで実際に守る選手の平均」を0とすべき（UZRの定義）。
 * lc.oaaCenterPerInn（主ポジ別のOAA/イニング平均）を差し引いて中心化する。
 */
function centeredOAAOuts(ps, lc) {
  const raw = ps.fielding.oaaOuts;
  if (!lc || !lc.oaaCenterPerInn) return raw;
  const pos = mainPosition(ps.fielding);
  const inn = totalFieldInnings(ps.fielding);
  return raw - (lc.oaaCenterPerInn[pos] || 0) * inn;
}

/**
 * 失策run成分（ErrR・§7.2 / 監査A3）。OAAは失策"前"の判定で範囲成分のみを表すため、
 * 捕球ミス（Hands）の価値はここで別勘定する（二重計上しない）。
 * ポジション平均の失策率で中心化し、平均より失策が少ない＝プラス。
 */
function errRunsAboveAvg(ps, cfg, lc) {
  if (!lc || !lc.errCenterPerInn) return 0;
  const pos = mainPosition(ps.fielding);
  const inn = totalFieldInnings(ps.fielding);
  const expE = (lc.errCenterPerInn[pos] || 0) * inn;
  return -((ps.fielding.e || 0) - expE) * cfg.tuning.field.runPerError;
}

/**
 * UZR相当(run単位) = 範囲成分(中心化OAA×run/out) + 失策成分(ErrR) + 捕手フレーミング(framingRuns)。
 * 内野0.75 / 外野0.90（Statcast FRV, §7.2）。捕手は範囲=0で framing が主成分（監査B5）。
 */
function uzrRuns(ps, cfg, lc) {
  const pos = mainPosition(ps.fielding);
  const rpo = OUTFIELD.has(pos) ? cfg.tuning.field.runPerOutOutfield : cfg.tuning.field.runPerOutInfield;
  return centeredOAAOuts(ps, lc) * rpo + errRunsAboveAvg(ps, cfg, lc) + (ps.fielding.framingRuns || 0);
}

// ============================================================================
// B3b: UZR成分分解（RngR + ErrR + ARM + DPR + rSB + framing・§B3b）
//
// ARM/DPR/rSB は「一球データを要さない」追加集計として game.mjs が乱数非消費で素カウントを
// 積み、ここで対リーグ平均の run に換算する。いずれも WAR用の uzrRuns には加えない
// （＝較正30指標・総WARが完全不変。分解表示でのみ合成する。総UZR不変が理想・§検証）。
// ※フレーミング/ブロッキングの毎球分解は一球データが要る＝B1で実装。ここでは既存の
//   per-inning近似 framingRuns をそのまま維持する（触らない）。
// ============================================================================

/**
 * ARM（外野送球）run。game.mjs が (arm-50)×armRunPerOpp を追加進塁機会ごとに累積した armRuns を、
 * リーグの外野手平均の肩（lgArmRunPerOpp×機会）に対して0中心化する（§B3b・リーグΣ ARM≈0）。
 */
function armRunsAboveAvg(ps, lc) {
  const f = ps.fielding;
  const raw = f.armRuns || 0;
  const center = lc && lc.lgArmRunPerOpp != null ? lc.lgArmRunPerOpp * (f.armOpp || 0) : 0;
  return raw - center;
}

/** DPR（二遊間の併殺転換）run。対リーグ平均転換率(lgDPRate)より多く転換した分がプラス（§B3b）。 */
function dprRunsAboveAvg(ps, cfg, lc) {
  const f = ps.fielding;
  const opp = f.dpOpp || 0;
  if (!opp || !lc || lc.lgDPRate == null) return 0;
  return ((f.dpTurned || 0) - lc.lgDPRate * opp) * cfg.tuning.field.runPerDP;
}

/**
 * 捕手 rSB（盗塁阻止run）。既存の盗塁/盗塁死（捕手が許したSB/刺したCS）から、
 * リーグ平均の1企図あたり攻撃価値を基準に、捕手が抑えた分をプラス評価する（FG rSB相当・§B3b）。
 * rSB = lgPerAtt×企図 − (許SB×runSB + 刺CS×runCS)。リーグΣ rSB≈0（Σ許SB=lgSB, Σ刺CS=lgCS）。
 */
function catcherRsbRuns(ps, cfg, lc) {
  const f = ps.fielding;
  const sb = f.sbAllowed || 0;
  const cs = f.csMade || 0;
  const att = sb + cs;
  if (!att || !lc) return 0;
  const runSB = cfg.tuning.run.runSB;
  const runCS = cfg.tuning.run.runCS;
  const lgAtt = (lc.lgSB || 0) + (lc.lgCS || 0);
  const lgPerAtt = lgAtt ? ((lc.lgSB || 0) * runSB + (lc.lgCS || 0) * runCS) / lgAtt : 0;
  return lgPerAtt * att - (sb * runSB + cs * runCS);
}

/**
 * UZR成分分解（表示用・§B3b）。total = RngR + ErrR + framing + ARM + DPR + rSB。
 * 「classic」= RngR + ErrR + framing は WAR用 uzrRuns と厳密一致する（＝ARM/DPR/rSB は
 * 純粋な内訳の付け足しで、WAR/較正には一切影響しない・self-check可能）。
 */
function uzrComponents(ps, cfg, lc) {
  const pos = mainPosition(ps.fielding);
  const rpo = OUTFIELD.has(pos) ? cfg.tuning.field.runPerOutOutfield : cfg.tuning.field.runPerOutInfield;
  const rngR = centeredOAAOuts(ps, lc) * rpo;
  const errR = errRunsAboveAvg(ps, cfg, lc);
  const framing = ps.fielding.framingRuns || 0;
  const arm = armRunsAboveAvg(ps, lc);
  const dpr = dprRunsAboveAvg(ps, cfg, lc);
  const rSB = catcherRsbRuns(ps, cfg, lc);
  return { pos, rngR, errR, framing, arm, dpr, rSB, total: rngR + errR + framing + arm + dpr + rSB };
}


// ===== src/sim/team.mjs =====
// ============================================================================
// チーム編成（1-4a/b/d → フェーズA S1 で v2 化）— ロスターから編成表を組む
//
// buildDepthChart v2（§S1-3）:
//   守備配置:   positionRank（習熟×守備素材＋打撃考慮）の上位を難ポジ優先で割当。
//   打順:       アーキタイプ制。1番=OBP×俊足 / 2番=コンタクト・出塁 / 3番=最強総合 /
//               4番=最強パワー / 5番=次点パワー / 6-8番=残り降順 /
//               9番=DH無なら投手（プレースホルダ・S2が当日の先発を充填）/ DH有なら最弱野手。
//   ベンチ:     スタメン外野手の hitScore 降順（S2の代打/代走/守備固めの母集団）。
//   ローテ:     cfg.league.rotationSize 人（中6日=6人）。
//   ブルペン:   relieverScore 順に closer / setup8 / setup7 / middle[] / long（最下位）。
// ここは「編成の初期値」なので trueAbility を直接参照してよい（三層構造の原則。
// シーズン中の見直しは S3 usage.mjs が観測成績＋スカウトノイズで行う）。
// ============================================================================



/** 打撃スコア（総合打力。3番・DH・ベンチ序列に使用） */
function hitScore(p) {
  const b = p.trueAbility.batting;
  const c = p.trueAbility.common;
  return b.ev + b.contact + b.eye + c.power + b.la * 0.5;
}

/** 出塁スコア（eye重視。1-2番アーキタイプの選抜に使用・§S1-3） */
function obpScore(p) {
  const b = p.trueAbility.batting;
  return b.eye * 1.6 + b.contact + b.ev * 0.4;
}

/** パワースコア（4-5番アーキタイプの選抜に使用・§S1-3） */
function powerScore(p) {
  const b = p.trueAbility.batting;
  const c = p.trueAbility.common;
  return c.power * 1.2 + b.ev + b.la * 0.6;
}

/** 先発スコア（スタミナ主・§16。球種数も加点） */
function starterScore(p) {
  const pt = p.trueAbility.pitching;
  const whiff = pt.pitches.length ? pt.pitches.reduce((a, x) => a + x.whiff, 0) / pt.pitches.length : 40;
  return pt.stamina * 1.6 + pt.control + whiff + pt.pitches.length * 8 + (pt.velocityKmh - 140);
}

/** リリーフの質（クローザー/セットアッパー序列） */
function relieverScore(p) {
  const pt = p.trueAbility.pitching;
  const whiff = pt.pitches.length ? pt.pitches.reduce((a, x) => a + x.whiff, 0) / pt.pitches.length : 40;
  return whiff + pt.control + (pt.velocityKmh - 140) * 1.2;
}

/** ポジション候補スコア（習熟＋守備素材(Range)＋打撃考慮。重みは config.tuning.depth） */
function posRankScore(p, pos, cfg) {
  const d = cfg.tuning.depth;
  const prof = p.trueAbility.fielding.positionProf[pos];
  // hitScore(平均≈225)を 50 中心のレーティング相当へスケール（/4.5）して混合
  return prof + d.posToolW * (rangeRating(p, cfg) - 50) + d.posBatW * (hitScore(p) / 4.5 - 50);
}

/**
 * ロスターから編成表を作る（v2）。
 * @param {Array} roster
 * @param {Object} cfg createConfig() の設定（rotationSize / tuning.depth を参照）
 * @param {{dh?:boolean}} opts dh=false でDH無し打順（9番=投手プレースホルダ）。既定 true。
 *   ※S1では season 側は常に dh:true（DH規則=ホーム球団リーグの適用は S2 initSide v2）。
 * @returns {{lineup:Array<{playerId:?string,pos:string}>, defense:Object, bench:string[],
 *   positionRank:Object, rotation:string[], bullpen:string[], bullpenRoles:Object, byId:Map}}
 */
function buildDepthChart(roster, cfg, opts = {}) {
  const dh = opts.dh ?? true;
  const rotationSize = cfg.league.rotationSize;
  const pitchers = roster.filter((p) => p.role === 'pitcher');
  const fielders = roster.filter((p) => p.role === 'fielder');
  const byId = new Map(roster.map((p) => [p.id, p]));

  // positionRank: ポジションごとの候補ランキング（S3 usage.mjs の見直し対象の初期値）
  const positionRank = {};
  for (const pos of FIELD_POSITIONS) {
    positionRank[pos] = fielders
      .slice()
      .sort((a, b) => posRankScore(b, pos, cfg) - posRankScore(a, pos, cfg))
      .map((p) => p.id);
  }

  // 守備配置: 難ポジ優先（C→SS→CF→…）で positionRank 上位の未使用選手を割当
  const used = new Set();
  const defense = {};
  for (const pos of POSITION_DIFFICULTY) {
    const pid = positionRank[pos].find((id) => !used.has(id));
    used.add(pid);
    defense[pos] = pid;
  }

  // スタメン外の野手（hitScore降順）。DH有なら先頭がDH、残りがベンチ。
  const reserves = fielders.filter((f) => !used.has(f.id)).sort((a, b) => hitScore(b) - hitScore(a));
  const dhId = dh ? (reserves.length ? reserves[0].id : defense['1B']) : null;
  const bench = reserves.filter((f) => f.id !== dhId).map((f) => f.id);

  // --- 打順アーキタイプ（§S1-3） -------------------------------------------
  const pool = FIELD_POSITIONS.map((pos) => ({ playerId: defense[pos], pos }));
  if (dh && dhId) pool.push({ playerId: dhId, pos: 'DH' });
  const P = (e) => byId.get(e.playerId);
  const take = (scoreFn) => {
    let bi = -1;
    let bv = -Infinity;
    for (let i = 0; i < pool.length; i++) {
      const v = scoreFn(P(pool[i]));
      if (v > bv) {
        bv = v;
        bi = i;
      }
    }
    return pool.splice(bi, 1)[0];
  };

  const slots = new Array(9).fill(null);
  // 9番: DH無なら投手（当日の先発。S2 initSide v2 が playerId を充填）、DH有なら最弱野手
  slots[8] = dh ? take((p) => -hitScore(p)) : { playerId: null, pos: 'P' };
  slots[2] = take(hitScore); // 3番=最強総合
  slots[3] = take(powerScore); // 4番=最強パワー
  slots[4] = take(powerScore); // 5番=次点パワー
  slots[0] = take((p) => obpScore(p) + cfg.tuning.depth.leadoffSpeedW * (p.trueAbility.common.speed - 50)); // 1番=OBP×俊足
  slots[1] = take((p) => obpScore(p) + p.trueAbility.batting.contact); // 2番=コンタクト/出塁
  // 6-8番: 残りを hitScore 降順
  const rest = pool.slice().sort((a, b) => hitScore(P(b)) - hitScore(P(a)));
  slots[5] = rest[0];
  slots[6] = rest[1];
  slots[7] = rest[2];

  // --- ローテ＆ブルペン ------------------------------------------------------
  const sortedP = pitchers.slice().sort((a, b) => starterScore(b) - starterScore(a));
  const rotation = sortedP.slice(0, rotationSize).map((p) => p.id);
  const bullpen = sortedP
    .slice(rotationSize)
    .sort((a, b) => relieverScore(b) - relieverScore(a))
    .map((p) => p.id);
  // ブルペン役割（§S1-3）: relieverScore順に closer/setup8/setup7、long は最下位、残り middle
  const bullpenRoles = {
    closer: bullpen[0] ?? null,
    setup8: bullpen[1] ?? null,
    setup7: bullpen[2] ?? null,
    middle: bullpen.slice(3, Math.max(3, bullpen.length - 1)),
    long: bullpen.length >= 4 ? bullpen[bullpen.length - 1] : null,
  };

  return { lineup: slots, defense, bench, positionRank, rotation, bullpen, bullpenRoles, byId };
}


// ===== src/generate.mjs =====
// ============================================================================
// 架空選手・チーム・リーグのジェネレータ（§0法的前提 / §1 / §10.2 / 0-6）
//
// 方針:
//   - 名前は完全架空（実在選手名・そのもじりを使わない）。姓名パーツの手続き合成。
//   - 能力は分布から個体ごとに引く（§1「合わせるのは集団の分布」）。中心50/裾でばらす。
//   - 三層の器を埋める: layer1=trueAbility（ここで生成）/ layer3=scoutSeed / layer2=空。
//   - declineRateは能力タイプと相関（§10.2: 速球・走力高＆制球・技巧低→衰え速い）。
//   - 分布の平均/分散は初期値。最終的な"リアルさ"は較正(1-11)でこのノブを回して合わせる。
//   - masterSeed＋階層シードで、生成は決定論・順序非依存（誰が回しても同じリーグ）。
// ============================================================================






// --- 名前パーツ（完全架空・common surname/given の手続き合成。プールは拡張可） ------
const SURNAMES = [
  '青柳', '石垣', '大空', '海堂', '桐生', '黒瀬', '小鳥遊', '相良',
  '志摩', '瀬川', '立花', '茅野', '鶴見', '灯野', '成瀬', '羽鳥',
  '氷室', '深沢', '真壁', '御影', '柳沢', '結城', '芳賀', '鷲尾',
];
const GIVEN = [
  '陽', '駿', '空良', '樹', '奏太', '海斗', '大河', '蒼真',
  '悠人', '玲', '湊', '一颯', '隼', '楓', '直', '和',
  '琉生', '碧', '慶', '拓実', '真澄', '航', '創', '燿',
];

// --- 架空チーム名（実在NPB球団名を避けた造語） -------------------------------
const TEAM_NAMES = [
  '白鷺ホワイトス', '疾風ゲイルズ', '蒼波ブルーズ', '紅蓮フレイムス',
  '雷鳴サンダー', '黒曜オブシディアン', '翠嶺グリーンズ', '金獅子ライオネル',
  '銀翼シルバーズ', '暁アヴローラ', '嵐山ストームズ', '夜叉ナイツ',
];

function draw(rng, mean = 50, sd = 10) {
  return clampRating(rng.normal(mean, sd));
}

/** 完全架空の姓名を合成 */
function generateName(rng) {
  return SURNAMES[rng.int(SURNAMES.length)] + '　' + GIVEN[rng.int(GIVEN.length)];
}

/** 投手を1人生成 */
function generatePitcher(rng, id) {
  const velocityKmh = Math.round(clamp(rng.normal(146, 4.5), 130, 165)); // NPB先発平均~146
  const control = draw(rng, 50, 12); // S5較正: 分散を微拡大（平均不変）＝エース級FIPの裾→投手WAR王
  const stamina = draw(rng, 50, 12);

  // 球種数 2〜5（奪三振能力とは独立, §8.1）。fastball は必ず保有。
  const nPitches = 2 + rng.int(4);
  const pool = shuffle(rng, PITCH_TYPES.filter((t) => t !== 'fastball'));
  const types = ['fastball', ...pool.slice(0, nPitches - 1)];
  const pitches = types.map((t) =>
    createPitch(t, {
      current: draw(rng, 50, 10),
      whiff: draw(rng, 50, 14), // S5較正: 分散を微拡大（平均不変）＝奪三振の裾→投手WAR王
      hrSuppress: draw(rng, 50, 10),
      contactQuality: draw(rng, 50, 10), // 被コンタクト質の抑止（EV抑止に接続・A-9修正）
    }),
  );

  // §10.2 衰え相関: 速球高＆制球低 → 衰え速い（技巧派だけ長生き）。
  const declineRate = clamp(
    0.5 + (velocityKmh - 146) * 0.03 - (control - 50) * 0.012 + rng.normal(0, 0.15),
    0.1,
    1.3,
  );

  const t = createTrueAbility({
    common: {
      arm: draw(rng, 56, 9),
      speed: draw(rng, 42, 9),
      hands: draw(rng, 48, 9),
      reaction: draw(rng, 48, 9),
      power: draw(rng, 40, 8), // S5較正: 投手打席を実NPB水準（打率~.13）へ＝セパ得点差の門番
    },
    // 投手打撃は実NPB水準（AVG~.15 / K%~30 / 極低BB）へ。特に対球種適性を低く設定しないと
    // 既定50（球種に対し平均打者）のままK%が上がらずAVGが.21まで膨れ、セパ得点差が埋没する（レビュー#3）。
    batting: {
      ev: draw(rng, 25, 6),
      la: draw(rng, 39, 6),
      contact: draw(rng, 24, 6),
      eye: draw(rng, 29, 6),
      vsFastball: draw(rng, 25, 6), // 対速球適性（低＝速球で三振を取られる）
      vsBreaking: draw(rng, 23, 6), // 対変化球適性
    },
    pitching: { velocityKmh, control, stamina, gbRate: draw(rng, 50, 12), hold: draw(rng, 50, 10), pitches },
    career: { peakAge: Math.round(clamp(rng.normal(27, 2), 23, 34)), declineRate },
  });

  return createPlayer({
    id,
    name: generateName(rng),
    role: 'pitcher',
    bats: rng.chance(0.3) ? 'L' : 'R',
    throws: rng.chance(0.28) ? 'L' : 'R',
    age: 18 + rng.int(20),
    trueAbility: t,
    scoutSeed: hashSeed(id, 'scout'),
  });
}

// ポジション別の打撃バイアス（守備難ポジは打撃控えめ＝現実の傾向。較正で微調整）
const POS_POWER_BIAS = { '1B': 8, RF: 6, LF: 6, '3B': 3, CF: 0, C: -2, '2B': -3, SS: -5 };

/** 野手を1人生成（primaryPos を主守備位置に） */
function generateFielder(rng, id, primaryPos) {
  const speed = draw(rng, primaryPos === 'CF' || primaryPos === 'SS' ? 58 : 48, 11);
  const powerBias = POS_POWER_BIAS[primaryPos] ?? 0;
  const power = draw(rng, 50 + powerBias, 10); // S5較正: 打撃系sdを微圧縮（平均不変）＝5ツール重畳の
  // 外れ値が野手WAR王を9.5超へ押し上げるのを抑える（打率王/HR王の裾もこのsdで同時較正）

  // 守備習熟: 主ポジ高、他は低。ユーティリティは近隣に分散（§13）。
  const positionProf = {};
  for (const p of FIELD_POSITIONS) positionProf[p] = draw(rng, 24, 5);
  positionProf[primaryPos] = draw(rng, 60, 8);
  if (rng.chance(0.35)) {
    // ユーティリティ寄り: もう1ポジ育つ
    const alt = FIELD_POSITIONS[rng.int(FIELD_POSITIONS.length)];
    positionProf[alt] = Math.max(positionProf[alt], draw(rng, 48, 8));
  }

  const declineRate = clamp(0.5 + (speed - 50) * 0.012 + rng.normal(0, 0.15), 0.1, 1.3);

  const t = createTrueAbility({
    common: {
      speed,
      power,
      arm: draw(rng, primaryPos === 'RF' || primaryPos === 'C' ? 58 : 50, 10),
      hands: draw(rng, 50, 10),
      reaction: draw(rng, 50, 10),
    },
    batting: {
      ev: draw(rng, 50 + powerBias, 9.5),
      la: draw(rng, 50, 10),
      pull: draw(rng, 50, 12),
      contact: draw(rng, 50, 9.5),
      eye: draw(rng, 50, 9.5),
      vsFastball: draw(rng, 50, 11), // 対速球適性（§4段階1）
      vsBreaking: draw(rng, 50, 11), // 対変化球適性
    },
    fielding: {
      positionProf,
      positioningIQ: draw(rng, 50, 10),
      framing: primaryPos === 'C' ? draw(rng, 50, 10) : draw(rng, 30, 6),
    },
    baserunning: { steal: draw(rng, speed > 55 ? 55 : 46, 12), baserunIQ: draw(rng, 50, 10) },
    career: { peakAge: Math.round(clamp(rng.normal(27, 2), 23, 34)), declineRate },
  });

  return createPlayer({
    id,
    name: generateName(rng),
    role: 'fielder',
    bats: rng.chance(0.35) ? 'L' : rng.chance(0.08) ? 'S' : 'R',
    throws: rng.chance(0.15) ? 'L' : 'R',
    age: 18 + rng.int(20),
    trueAbility: t,
    scoutSeed: hashSeed(id, 'scout'),
  });
}

// 1チームの守備位置配分（合計20野手＋13投手＝33人）
const FIELDER_PLAN = [
  'C', 'C', 'C',
  '1B', '1B',
  '2B', '2B', '2B',
  '3B', '3B',
  'SS', 'SS', 'SS',
  'LF', 'LF',
  'CF', 'CF', 'CF',
  'RF', 'RF',
];
const PITCHERS_PER_TEAM = 13;

/** 1チームのロスターを生成 */
function generateTeam(rng, teamId) {
  const roster = [];
  for (let i = 0; i < PITCHERS_PER_TEAM; i++) {
    roster.push(generatePitcher(rng, `${teamId}P${i + 1}`));
  }
  FIELDER_PLAN.forEach((pos, i) => {
    roster.push(generateFielder(rng, `${teamId}F${i + 1}`, pos));
  });
  return roster;
}

/**
 * 監督プロファイルを生成（S1・§S2/S3の采配判断が参照する「監督ポリシー」の個性）。
 * 20-80スケール(50=リーグ平均)。判断ロジック自体は src/sim/manager.mjs に置く（S2）。
 */
function generateManager(rng) {
  return {
    buntTend: draw(rng, 50, 12), // 犠打の好み（高いほどバントさせる）
    stealTend: draw(rng, 50, 12), // 盗塁の積極性
    ibbTend: draw(rng, 50, 12), // 敬遠の使い方
    quickHook: draw(rng, 50, 12), // 継投の早さ（高いほど早く投手を代える）
  };
}

/**
 * リーグ全体を生成。masterSeed＋階層シードで決定論・順序非依存。
 * 2リーグ制: 前半球団=leagues[0]（L1・DH無）、後半=leagues[1]（L2・DH有）。
 * @returns {{masterSeed:number, teams:Array, players:Array}}
 */
function generateLeague(masterSeed, config) {
  const numTeams = config.league.numTeams;
  const leagues = config.league.leagues ?? null;
  const perLeague = leagues ? Math.ceil(numTeams / leagues.length) : numTeams;

  // 1) 全チームのロスターを生成（チームシードで決定論・順序非依存）＋攻撃力を測る。
  const built = [];
  for (let ti = 0; ti < numTeams; ti++) {
    const teamId = `T${ti + 1}`;
    const trng = makeRng(hashSeed(masterSeed, 'team', ti));
    const roster = generateTeam(trng, teamId);
    for (const p of roster) p.teamId = teamId;
    const manager = generateManager(makeRng(hashSeed(masterSeed, 'manager', ti)));
    // 攻撃力＝野手のhitScore合計（投手はDH無で常に打つため、均衡はDH枠以外の野手攻撃で測る）。
    const offense = roster.filter((p) => p.role === 'fielder').reduce((a, p) => a + hitScore(p), 0);
    built.push({ teamId, roster, manager, offense });
  }

  // 2) リーグ均衡割当（2リーグ×偶数のみ）: 攻撃力降順にグリーディで「総攻撃力が小さいリーグ」へ
  //    詰め、両リーグの野手攻撃を近づける。→ セ・パ得点差がDH効果だけを反映して安定する（競争均衡）。
  //    それ以外の構成は従来どおり前半L1/後半L2の連番割当。
  const leagueOf = new Map();
  if (leagues && leagues.length === 2 && numTeams % 2 === 0) {
    const half = numTeams / 2;
    const sums = [0, 0];
    const counts = [0, 0];
    for (const t of built.slice().sort((a, b) => b.offense - a.offense)) {
      let g;
      if (counts[0] >= half) g = 1;
      else if (counts[1] >= half) g = 0;
      else g = sums[0] <= sums[1] ? 0 : 1;
      leagueOf.set(t.teamId, g);
      sums[g] += t.offense;
      counts[g]++;
    }
  } else {
    built.forEach((t, ti) =>
      leagueOf.set(t.teamId, leagues ? Math.min(Math.floor(ti / perLeague), leagues.length - 1) : 0),
    );
  }

  // 3) teams配列を [L1..., L2...] 順（各リーグ内はチーム番号順）に並べ、名前を最終位置で付与。
  const ordered = leagues
    ? built.slice().sort((a, b) => leagueOf.get(a.teamId) - leagueOf.get(b.teamId))
    : built;
  const teams = [];
  const players = [];
  ordered.forEach((t, idx) => {
    const gi = leagueOf.get(t.teamId);
    teams.push({
      id: t.teamId,
      name: TEAM_NAMES[idx] ?? t.teamId,
      league: leagues ? leagues[gi].id : null,
      manager: t.manager,
      playerIds: t.roster.map((p) => p.id),
    });
    players.push(...t.roster);
  });
  return { masterSeed, teams, players };
}

/** Fisher–Yates（rng使用・決定論） */
function shuffle(rng, arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = rng.int(i + 1);
    const tmp = a[i];
    a[i] = a[j];
    a[j] = tmp;
  }
  return a;
}


// ===== src/sim/rates.mjs =====
// 確率合成の基本関数（log5/オッズ比の土台。§3.1）。
// logit/expit と、レーティング(20-80, 50=平均)を logit の増分へ写す変換。

/** ロジット（オッズの対数） */
function logit(p) {
  return Math.log(p / (1 - p));
}

/** 逆ロジット（シグモイド） */
function expit(x) {
  return 1 / (1 + Math.exp(-x));
}

/**
 * レーティング(50=平均)を logit 増分に変換。
 * 例: slope=0.30 なら 80(=+30) で +0.9（オッズ約2.5倍）。
 */
function ratingDelta(rating, slope) {
  return (slope * (rating - 50)) / 10;
}

/**
 * log5 / オッズ比合成: リーグ基準率に打者側・投手側の logit 増分を足し込む（§3.1）。
 * logit(P) = logit(L) + Δbatter + Δpitcher。両者が平均なら L に戻る。
 */
function log5(leagueRate, batterDelta, pitcherDelta) {
  return expit(logit(leagueRate) + batterDelta + pitcherDelta);
}


// ===== src/sim/plateAppearance.mjs =====
// ============================================================================
// 打席解決の規律層（1-1）— 2段パイプラインの第1段（§3.1 / 自己レビュー F29）
//
// ここでは打者能力 vs 投手能力を log5/オッズ比で合成し、打席の分岐だけを決める:
//   { K(三振) / BB(四球) / HBP(死球) / IN_PLAY(インプレー=打球化) }
// 安打/アウト/長打は決めない。IN_PLAY は第2段(1-2/1-3 EV/LA→球場→守備)へ渡す。
// 「結果を先に決めてゾーンを後付け」を避け、決定権をこの1箇所に閉じる。
// ============================================================================




const PA_OUTCOME = { K: 'K', BB: 'BB', HBP: 'HBP', IN_PLAY: 'inPlay' };

/** 投手の平均空振り資質（球種whiffの平均）。球種未設定なら平均50。 */
function meanWhiff(pit) {
  const arr = pit.pitches;
  if (!arr || arr.length === 0) return 50;
  let s = 0;
  for (const p of arr) s += p.whiff;
  return s / arr.length;
}

/**
 * 打席の分岐確率（pK, pBB, pHBP）を log5 合成で算出。IN_PLAY は残余。
 * @returns {{pK:number, pBB:number, pHBP:number, pInPlay:number}}
 */
function paProbabilities(batter, pitcher, cfg, tto = 0, pitch = null) {
  const pa = cfg.tuning.pa;
  const b = batter.trueAbility.batting;
  const p = pitcher.trueAbility.pitching;

  // --- 左右プラトーン（S1・M7解消）: 同利き（スイッチは常に有利側=逆打席）で K↑ BB↓ ---
  const pl = cfg.tuning.platoon;
  const same = pl && isSameHand(batter, pitcher);

  // --- K: 打者のK傾向（コンタクト/選球眼＋対該当球種クラス適性）×投手の奪三振資質 ---
  // 球種格子(§4段階1): pitch があればその球種の whiff を使い、打者の対クラス適性で補正。
  const whiffVal = pitch ? pitch.whiff : meanWhiff(p);
  let aptAdj = 0;
  if (pitch) {
    const apt = pitchClass(pitch.type) === 'fastball' ? b.vsFastball : b.vsBreaking;
    aptAdj = pa.whiffAptW * (apt - 50); // 適性高い→Kしにくい
  }
  // 巡目(tto)が進むほど打者はK を回避しやすい（§3.3）。
  const kProne = 50 - pa.kContactW * (b.contact - 50) - pa.kEyeW * (b.eye - 50) - aptAdj;
  const kStuff = whiffVal + pa.kVeloPerKmh * (p.velocityKmh - 146);
  let pK = expit(
    logit(pa.kLeague) +
      ratingDelta(kProne, pa.kSlope) +
      ratingDelta(kStuff, pa.kSlope) -
      tto * cfg.tuning.tto.kPerTime +
      (same ? pl.kLogitSame : 0),
  );

  // --- BB: 打者選球眼（高→増）×投手制球（高→減） ---
  let pBB = expit(
    logit(pa.bbLeague) +
      ratingDelta(b.eye, pa.bbSlope) -
      ratingDelta(p.control, pa.bbSlope) +
      (same ? pl.bbLogitSame : 0),
  );

  // --- HBP: 小。投手制球が低いほどわずかに増 ---
  let pHBP = expit(logit(pa.hbpLeague) - ratingDelta(p.control, pa.hbpSlope));

  // 端の組み合わせで合計が1に近づき過ぎないようガード（IN_PLAY を最低限残す）
  const sum = pK + pBB + pHBP;
  const cap = 0.95;
  if (sum > cap) {
    const s = cap / sum;
    pK *= s;
    pBB *= s;
    pHBP *= s;
  }
  return { pK, pBB, pHBP, pInPlay: 1 - pK - pBB - pHBP };
}

/**
 * 打席の分岐を1回抽選（決定論・rng使用）。
 * @returns {'K'|'BB'|'HBP'|'inPlay'}
 */
function resolvePADiscipline(batter, pitcher, cfg, rng, tto = 0, pitch = null) {
  const { pK, pBB, pHBP } = paProbabilities(batter, pitcher, cfg, tto, pitch);
  const u = rng.next();
  if (u < pK) return PA_OUTCOME.K;
  if (u < pK + pBB) return PA_OUTCOME.BB;
  if (u < pK + pBB + pHBP) return PA_OUTCOME.HBP;
  return PA_OUTCOME.IN_PLAY;
}


// ===== src/sim/battedBall.mjs =====
// ============================================================================
// 打球生成（1-2）— 2段パイプラインの第2段・前半（§3.2）
//
// IN_PLAY になった打席で、接触の瞬間に打球3要素を先に生成する:
//   EV（打球速度 km/h） = 打者EV適性 × 生体power × 投球の質（抑止）＋ノイズ
//   LA（打球角度 度）   = 打者LA適性 × 投手ゴロ率相性 ＋ノイズ
//   方向（spray 度）    = 打者引っ張り/流し（利き手で符号）＋ノイズ
// ここでは結果（安打/アウト）は決めない。落下点・結果は 1-3 が球場ジオメトリで導く。
//
// Phase1簡略（自己レビューF34）: 「投球の質」は集約スカラー、方向は打者傾向のみ
//   （×投球コースは球種格子 段階2まで保留）。球種別は 2-1 で差し替える。
// ============================================================================




/** 投手の被コンタクト質抑止（球種contactQualityの平均。高いほど強い打球を許さない） */
function meanContactSuppress(pit) {
  const arr = pit.pitches;
  if (!arr || arr.length === 0) return 50;
  let s = 0;
  for (const p of arr) s += p.contactQuality;
  return s / arr.length;
}

/**
 * 打球3要素を生成して BattedBall を返す（幾何・結果は null のまま）。
 */
function generateBattedBall(batter, pitcher, cfg, rng, ctx = {}) {
  const bb = cfg.tuning.bb;
  const bat = batter.trueAbility;
  const pit = pitcher.trueAbility.pitching;

  // EV: 打者EV適性＋power − 投手抑止(選択球種) − 被弾抑止(M3) ＋対クラス適性 ＋巡目 ＋ノイズ
  const tto = ctx.tto ?? 0;
  const pitch = ctx.pitch ?? null;
  const contactSup = pitch ? pitch.contactQuality : meanContactSuppress(pit);
  const hrSup = pitch ? pitch.hrSuppress : 50;
  const apt = pitch
    ? pitchClass(pitch.type) === 'fastball'
      ? bat.batting.vsFastball
      : bat.batting.vsBreaking
    : 50;
  // 左右プラトーン（S1・M7解消）: 同利き（スイッチは常に有利側）でEVの中心を下げる
  const pl = cfg.tuning.platoon;
  const platoonEv = pl && isSameHand(batter, pitcher) ? pl.evKmhSame : 0;
  const evMean =
    bb.evBase +
    bb.evPerEV * (bat.batting.ev - 50) +
    bb.evPerPower * (bat.common.power - 50) -
    bb.evPitchSuppress * (contactSup - 50) -
    bb.evHrSuppressW * (hrSup - 50) +
    bb.evAptW * (apt - 50) +
    tto * cfg.tuning.tto.evPerTime +
    platoonEv;
  const evKmh = Math.max(40, rng.normal(evMean, bb.evSd));

  // LA: 打者LA適性で中心シフト、投手ゴロ率で下げる ＋ノイズ
  const laMean = bb.laBase + bb.laPerLA * (bat.batting.la - 50) - bb.laPitchGB * (pit.gbRate - 50);
  const laDeg = rng.normal(laMean, bb.laSd);

  // 方向: pull適性で引っ張り側へ。右打ちは左方向(−)、左打ちは右方向(+)へ引っ張る。
  // スイッチ(S)は実効打席サイド（常に投手と逆＝有利側）で引っ張る（S1でM7の簡易扱いを解消）。
  const pullMag = bb.sprayPull * (bat.batting.pull - 50);
  const pullSign = effectiveBats(batter, pitcher) === 'L' ? +1 : -1;
  const sprayMean = pullSign * pullMag;
  let sprayDeg = rng.normal(sprayMean, bb.spraySd);
  if (sprayDeg < -50) sprayDeg = -50;
  if (sprayDeg > 50) sprayDeg = 50;

  const bb2 = createBattedBall({
    evKmh,
    laDeg,
    sprayDeg,
    pitchType: ctx.pitchType ?? null,
    batterId: batter.id,
    pitcherId: pitcher.id,
    baseState: ctx.baseState ?? 0,
    outs: ctx.outs ?? 0,
  });
  bb2.runnerSpeed = batter.trueAbility.common.speed; // 三塁打の脚力依存に使用（監査B1）
  return bb2;
}


// ===== src/sim/battedBallResult.mjs =====
// ============================================================================
// 打球結果解決（1-3）— 2段パイプラインの第2段・後半（§3.2 / 自己レビュー F29）
//
// 打球3要素(EV/LA/方向)＋球場ジオメトリから落下点・滞空時間を出し、
//   - フェンス越え → HR
//   - それ以外 → 「そのポジション平均の期待アウト率」で安打/アウトを確定し、
//     安打種別(1B/2B/3B)を落下点から導く
// を行う。ここで守備者"個人"の巧拙は入れない（＝ポジション平均）。
// 個人の上手さは OAA(1-9) と守備モデル(2-7)で "期待からの差分" として後付けする。
// ============================================================================



const G = 9.8;

/** 打球種別（角度で分類） */
function battedType(laDeg) {
  if (laDeg < 10) return 'GB'; // ゴロ（負角含む）
  if (laDeg < 25) return 'LD'; // ライナー
  if (laDeg <= 50) return 'FB'; // フライ
  return 'PU'; // ポップ
}

/** 飛距離・滞空・落下点を計算して bb に書き込む */
function computeGeometry(bb, cfg, park = NEUTRAL_PARK) {
  const v = bb.evKmh / 3.6; // m/s
  const laRad = (bb.laDeg * Math.PI) / 180;
  let distanceM;
  let hangTimeS;
  if (bb.laDeg <= 0) {
    // ゴロ: 地面を転がる想定。内野到達距離の目安のみ。
    distanceM = Math.max(0, ((v * v) / G) * 0.15);
    hangTimeS = 0;
  } else {
    // キャリー効率: 最適LA ~26°を中心に山（空気抵抗込みの現実近似。真空sin(2θ)より現実的）
    const lift = Math.exp(-Math.pow((bb.laDeg - 26) / 24, 2));
    distanceM = Math.max(0, cfg.tuning.bb.carry * ((v * v) / G) * lift);
    hangTimeS = (2 * v * Math.sin(laRad)) / G;
  }
  const sprayRad = (bb.sprayDeg * Math.PI) / 180;
  bb.distanceM = distanceM;
  bb.hangTimeS = hangTimeS;
  bb.landingX = distanceM * Math.sin(sprayRad);
  bb.landingY = distanceM * Math.cos(sprayRad);
  return bb;
}

/** 落下点・打球種別から担当野手ポジションを決める（OAAの主語） */
function assignFielder(bb, type) {
  const s = bb.sprayDeg;
  const infield = type === 'GB' || type === 'PU' || (type === 'LD' && bb.distanceM < 45);
  if (infield) {
    if (s <= -18) return '3B';
    if (s <= -4) return 'SS';
    if (s < 6) return s < 0 ? 'SS' : '2B';
    if (s < 20) return '2B';
    return '1B';
  }
  // 外野: CFの担当角を狭め（±15→±10）、モード(0°)集中による機会・UZR過大を緩和（監査B6）
  if (s <= -10) return 'LF';
  if (s < 10) return 'CF';
  return 'RF';
}

/** 打球種別ごとの基準hit率（ポジション平均のxBABIP的な値） */
function baseHitProb(type, cfg) {
  const bb = cfg.tuning.bb;
  return type === 'GB' ? bb.hitGB : type === 'LD' ? bb.hitLD : type === 'FB' ? bb.hitFB : bb.hitPU;
}

/** 安打種別を落下点から決める（監査B1: 単打/二塁打境界＝gapDistM、深いギャップ球は打者脚力で三塁打化） */
function decideBases(bb, type, cfg, rng) {
  const g = cfg.tuning.bb;
  if (type === 'GB') {
    return Math.abs(bb.sprayDeg) > 38 && rng.next() < 0.2 ? '2B' : '1B';
  }
  // 外野手到達圏(gapDistM)手前に前落ちする空中安打は単打
  if (bb.distanceM < g.gapDistM) return '1B';
  // 深い打球は二塁打ベース。さらに深いギャップ/ライン際(|spray|>18)は打者speedで三塁打になりうる
  if (bb.distanceM >= g.tripleDistM && Math.abs(bb.sprayDeg) > 18) {
    const speed = bb.runnerSpeed ?? 50;
    const pTriple = clamp(g.tripleBase + (speed - 50) * g.tripleSpeedW, 0.02, 0.55);
    if (rng.next() < pTriple) return '3B';
  }
  return '2B';
}

/**
 * 塁打分布の"期待値"（rng抽選を伴わない decideBases の確率版・§B3a xBA/xSLG/xwOBA用）。
 * decideBases と同一の分岐条件を確率として返す（実結果の期待値＝モデルの塁打分布）。
 * @returns {{p1:number, p2:number, p3:number}} 安打を打った条件下での 1B/2B/3B 確率（Σ=1）
 */
function expectedBases(bb, type, cfg) {
  const g = cfg.tuning.bb;
  if (type === 'GB') {
    const p2 = Math.abs(bb.sprayDeg) > 38 ? 0.2 : 0;
    return { p1: 1 - p2, p2, p3: 0 };
  }
  if (bb.distanceM < g.gapDistM) return { p1: 1, p2: 0, p3: 0 };
  if (bb.distanceM >= g.tripleDistM && Math.abs(bb.sprayDeg) > 18) {
    const speed = bb.runnerSpeed ?? 50;
    const pTriple = clamp(g.tripleBase + (speed - 50) * g.tripleSpeedW, 0.02, 0.55);
    return { p1: 0, p2: 1 - pTriple, p3: pTriple };
  }
  return { p1: 0, p2: 1, p3: 0 };
}

/**
 * 打球を解決。bb.result と bb.fielderPos を確定し、要約を返す。
 * 追加(§B3a): 期待塁打分布 xB1/xB2/xB3/xHR（rng抽選前の防御中立=pHit基準の期待値）を返す。
 *   実結果とは独立の"期待値"であり、リーグ集計で xwOBA≈wOBA を恒等成立させる（副作用・rng消費なし）。
 * @returns {{result:string, type:string, expOut:number, fielderPos:string, distanceM:number,
 *   xB1:number, xB2:number, xB3:number, xHR:number}}
 */
/**
 * @param {Function} [fielderRangeFor] (pos) => Rangeレーティング(50=平均)。守備者個人の
 *   レンジで実効被安打率を上下させる（2-7）。省略時は50＝リーグ平均（Phase1互換）。
 */
function resolveBattedBall(bb, cfg, rng, park = NEUTRAL_PARK, fielderRangeFor) {
  computeGeometry(bb, cfg, park);
  const type = battedType(bb.laDeg);

  // --- HR判定: 適角のフライ/ライナーが（hrScale込みで）フェンスを越える ---
  if ((type === 'FB' || type === 'LD') && bb.laDeg >= 15 && bb.laDeg <= 48) {
    const fence = fenceDistanceAt(bb.sprayDeg, park);
    if (bb.distanceM * cfg.tuning.hrScale >= fence) {
      bb.fielderPos = assignFielder(bb, type);
      bb.result = 'HR';
      return { result: 'HR', type, expOut: 0, fielderPos: bb.fielderPos, distanceM: bb.distanceM, xB1: 0, xB2: 0, xB3: 0, xHR: 1 };
    }
  }

  // --- インプレー: ポジション平均の期待アウト率で安打/アウト ---
  let pHit = baseHitProb(type, cfg) + (bb.evKmh - 140) * cfg.tuning.bb.evHitW;
  if (type === 'FB' && bb.distanceM >= cfg.tuning.bb.fbHitBonusM) pHit += 0.15; // 警告帯FBの被安打（BABIP環境維持のため二塁打境界と別閾値）
  pHit = clamp(pHit, 0.01, 0.97);

  const fielderPos = assignFielder(bb, type);
  bb.fielderPos = fielderPos;
  const expOut = 1 - pHit; // リーグ平均基準（OAAのベースライン・ポジション中立）

  // 期待塁打分布（§B3a）: 防御中立の pHit × decideBases 確率版。rng を消費しない（決定論不変）。
  const eb = expectedBases(bb, type, cfg);
  const xB1 = pHit * eb.p1;
  const xB2 = pHit * eb.p2;
  const xB3 = pHit * eb.p3;

  // 守備者個人のRangeで実効被安打率を上下（good fielder→outを増やす）。OAAの個人シグナル源。
  const rangeR = fielderRangeFor ? fielderRangeFor(fielderPos) : 50;
  const effPHit = clamp(pHit - (rangeR - 50) * cfg.tuning.field.rangePerRating, 0.01, 0.99);

  if (rng.next() >= effPHit) {
    bb.result = 'out';
    return { result: 'out', type, expOut, fielderPos, distanceM: bb.distanceM, xB1, xB2, xB3, xHR: 0 };
  }
  const base = decideBases(bb, type, cfg, rng);
  bb.result = base;
  return { result: base, type, expOut, fielderPos, distanceM: bb.distanceM, xB1, xB2, xB3, xHR: 0 };
}


// ===== src/sim/pitchGrid.mjs =====
// ============================================================================
// 球種格子 段階1（2-1/2-2 / §4）
// 1打席ごとに投手の球種を1つ選び、その球種の (whiff/hrSuppress/contactQuality) と
// 打者の (対速球/対変化球) 適性で解決する。これにより:
//   - 対ストレート成績が球種別ログの集計として湧く
//   - フォーク習得で開花（列が一本生える＝新しい優秀な球種の追加）
//   - 球種構成＝投手タイプ / 先発・リリーフ適性
// ============================================================================


/** その打席で投げる球種を1つ選ぶ（速球系を重く重み付け） */
function selectPitch(pitcher, rng, cfg) {
  const pitches = pitcher.trueAbility.pitching.pitches;
  if (!pitches || pitches.length === 0) return null;
  const fw = cfg.tuning.pa.fastballWeight;
  let total = 0;
  for (const p of pitches) total += FASTBALL_TYPES.has(p.type) ? fw : 1;
  let r = rng.next() * total;
  for (const p of pitches) {
    r -= FASTBALL_TYPES.has(p.type) ? fw : 1;
    if (r <= 0) return p;
  }
  return pitches[pitches.length - 1];
}


// ===== src/sim/leagueStats.mjs =====
// ============================================================================
// リーグ集計指標（1-7の一部・1-11較正で再利用）
// シーズン結果(playerSeasons + standings)から、レート指標を算出する。
// ============================================================================

/** リーグ打撃集計 */
function leagueBatting(playerSeasons) {
  const s = { pa: 0, ab: 0, h: 0, b1: 0, b2: 0, b3: 0, hr: 0, bb: 0, ibb: 0, hbp: 0, so: 0, sf: 0, sh: 0 };
  for (const ps of playerSeasons) {
    const b = ps.batting;
    s.pa += b.pa; s.ab += b.ab; s.h += b.h; s.b1 += b.b1; s.b2 += b.b2; s.b3 += b.b3;
    s.hr += b.hr; s.bb += b.bb; s.ibb += b.ibb; s.hbp += b.hbp; s.so += b.so; s.sf += b.sf; s.sh += b.sh;
  }
  const tb = s.b1 + 2 * s.b2 + 3 * s.b3 + 4 * s.hr;
  const avg = s.ab ? s.h / s.ab : 0;
  const obp = s.ab + s.bb + s.hbp + s.sf ? (s.h + s.bb + s.hbp) / (s.ab + s.bb + s.hbp + s.sf) : 0;
  const slg = s.ab ? tb / s.ab : 0;
  const babipDen = s.ab - s.so - s.hr + s.sf;
  return {
    ...s,
    tb,
    avg,
    obp,
    slg,
    ops: obp + slg,
    iso: slg - avg,
    kPct: s.pa ? s.so / s.pa : 0,
    bbPct: s.pa ? s.bb / s.pa : 0,
    babip: babipDen ? (s.h - s.hr) / babipDen : 0,
  };
}

/** リーグ投手集計 */
function leaguePitching(playerSeasons) {
  const s = { outs: 0, bf: 0, h: 0, hr: 0, bb: 0, ibb: 0, hbp: 0, so: 0, r: 0, er: 0 };
  for (const ps of playerSeasons) {
    const p = ps.pitching;
    s.outs += p.outs; s.bf += p.bf; s.h += p.h; s.hr += p.hr; s.bb += p.bb; s.ibb += p.ibb;
    s.hbp += p.hbp; s.so += p.so; s.r += p.r; s.er += p.er;
  }
  const ip = s.outs / 3;
  return { ...s, ip, era: ip ? (s.er / ip) * 9 : 0, whip: ip ? (s.h + s.bb) / ip : 0 };
}

/**
 * シーズン結果からリーグ全体のサマリを作る（較正の判定用）。
 * @param {{playerSeasons:Array, standings:Array}} res
 * @param {number} numTeams
 */
function leagueSummary(res, numTeams) {
  const bat = leagueBatting(res.playerSeasons);
  const pit = leaguePitching(res.playerSeasons);
  const totalRS = res.standings.reduce((a, t) => a + t.rs, 0);
  const totalG = res.standings.reduce((a, t) => a + t.g, 0); // = リーグ延べ試合数(=2×試合)
  const gamesPerTeam = totalG / numTeams;
  return {
    batting: bat,
    pitching: pit,
    hrPerTeam: bat.hr / numTeams,
    runsPerTeamPerGame: totalRS / numTeams / gamesPerTeam,
    gamesPerTeam,
  };
}

/**
 * リーグ別（L1/L2）のサマリ（S3・セパ得点差の較正用）。チームの所属リーグ単位で集計する。
 * ※DH規則単位（試合のDH有無別）の得点差は simulateSeason の runSplit を使うこと
 *   （所属リーグ単位は球団戦力ノイズで符号が反転しうる・S2引き継ぎ注意）。
 * @param {{playerSeasons:Array, standings:Array}} res simulateSeason の結果
 * @param {Array<{id:string,league:?string}>} teams league.teams
 * @returns {Object<string, ReturnType<leagueSummary>>} リーグid → サマリ
 */
function leagueSummaryByLeague(res, teams) {
  const leagueOf = new Map(teams.map((t) => [t.id, t.league]));
  const out = {};
  for (const lid of new Set(teams.map((t) => t.league))) {
    const ps = res.playerSeasons.filter((s) => leagueOf.get(s.teamId) === lid);
    const rows = res.standings.filter((t) => leagueOf.get(t.teamId) === lid);
    if (!rows.length) continue;
    out[lid ?? 'ALL'] = leagueSummary({ playerSeasons: ps, standings: rows }, rows.length);
  }
  return out;
}


// ===== src/sim/leagueConstants.mjs =====
// ============================================================================
// リーグ定数導出パス（1-6 / 自己レビュー F2・F31・F46）
//
// 2パス構造: pass1 でシーズンを実走・集計 → 本モジュールでシムのラン環境から
// 線形ウェイト・lgwOBA・wOBAscale・FIP定数・RPW を導出 → pass2 で各指標を確定。
// §18 の 13.3/1.216 等は「初期値」であり、ここで 12球団143試合NPB環境へ再導出する。
// ============================================================================



// 各イベントの得点価値（アウト基準=0の線形ウェイト・runs単位）。FanGraphs標準の
// "runs above out" 系（wRAAが正しいラン単位になり、WARの絶対値が文献スケールに乗る・レビューB-2）。
// run-expectancy からの厳密導出は将来（コード自身の予告）。
const LINEAR_WEIGHTS = {
  bb: 0.55,
  hbp: 0.58,
  b1: 0.7,
  b2: 1.0,
  b3: 1.27,
  hr: 1.65,
};

/** 打撃イベント合計から「アウト基準の得点価値/打席」を出す（wOBAの素）。
 *  FG定義準拠（S3）: 分子は uBB=BB−IBB（敬遠は打者の技量でない）、分母 = AB+BB−IBB+SF+HBP。 */
function rawRunValuePerPA(bat, W = LINEAR_WEIGHTS) {
  const ibb = bat.ibb || 0;
  const denom = bat.ab + bat.bb - ibb + bat.sf + bat.hbp;
  if (!denom) return 0;
  const num =
    W.bb * (bat.bb - ibb) + W.hbp * bat.hbp + W.b1 * bat.b1 + W.b2 * bat.b2 + W.b3 * bat.b3 + W.hr * bat.hr;
  return num / denom;
}

/**
 * シーズン結果からリーグ定数を導出。cfg.leagueConstants に相当する構造を返す。
 * @param {{playerSeasons:Array, standings:Array}} res
 */
function deriveLeagueConstants(res) {
  const bat = leagueBatting(res.playerSeasons);
  const pit = leaguePitching(res.playerSeasons);

  // --- wOBA 系（lgwOBA を lgOBP スケールへ正規化）---
  const lgRawPerPA = rawRunValuePerPA(bat); // アウト基準の得点価値/打席
  const lgOBP = bat.obp;
  const wobaScale = lgRawPerPA > 0 ? lgOBP / lgRawPerPA : 1; // wOBA = wobaScale × raw で lgwOBA=lgOBP
  const lgwOBA = lgOBP;

  // wRC+ 用: リーグの総得点/打席
  const totalRuns = res.standings.reduce((a, t) => a + t.rs, 0);
  const lgRunsPerPA = bat.pa ? totalRuns / bat.pa : 0;

  // --- FIP 定数（lgFIP を lgERA に一致させる。FG式＝IBB除外・S3）---
  const ip = pit.outs / 3;
  const fipRawLeague = ip ? (13 * pit.hr + 3 * (pit.bb - (pit.ibb || 0) + pit.hbp) - 2 * pit.so) / ip : 0;
  const lgERA = pit.era;
  const fipConstant = lgERA - fipRawLeague;
  const lgFIP = lgERA; // 定義上一致

  // xFIP用のリーグ HR/FB（§B3a）: リーグ総被HR ÷ リーグ総被フライ。
  // これで Σ(被FB×lgHRFB)=ΣHR となり、リーグ xFIP=リーグ FIP=リーグ ERA が恒等成立する。
  let totFB = 0;
  for (const ps of res.playerSeasons) totFB += ps.pitching.bbFB;
  const lgHRFB = totFB ? pit.hr / totFB : 0;
  const lgSLG = bat.slg; // OPS+ の基準（§B3a）

  // --- RPW（Runs Per Win, Tango近似 1.5×RG+3。RG=1チーム1試合の得点）---
  const gamesPerTeam = res.standings.reduce((a, t) => a + t.g, 0) / res.standings.length;
  const runsPerGamePerTeam = gamesPerTeam ? totalRuns / res.standings.length / gamesPerTeam : 4.2;
  const rpw = 1.5 * runsPerGamePerTeam + 3;

  // 併殺リーグ率（wGDPの基準・§6）
  let totGDP = 0;
  let totGDPOpp = 0;
  for (const ps of res.playerSeasons) {
    totGDP += ps.batting.gdp;
    totGDPOpp += ps.baserunning.gdpOpp;
  }
  const lgGDPrate = totGDPOpp ? totGDP / totGDPOpp : 0;

  // 二遊間 併殺転換率（DPRの基準・§B3b）: 守備側の機会/成立から。lgDPRate= Σ成立/Σ機会。
  // 各機会は 2B・SS の両者に計上されるため分母/分子とも2倍だが比は不変（DPRの対平均は0中心）。
  let totDPturned = 0;
  let totDPopp = 0;
  for (const ps of res.playerSeasons) {
    totDPturned += ps.fielding.dpTurned || 0;
    totDPopp += ps.fielding.dpOpp || 0;
  }
  const lgDPRate = totDPopp ? totDPturned / totDPopp : 0;

  // 外野ARMの中心化基準（§B3b）: 追加進塁機会1回あたりの平均armRun。ARMを「リーグの外野手平均の肩」
  // に対して0中心化するため（外野手は概して平均以上の肩＝生の(arm-50)は正に偏る）。metrics側で
  // ARM = armRuns − lgArmRunPerOpp×armOpp とすると リーグΣ ARM≈0 が厳密成立する。
  let totArmRuns = 0;
  let totArmOpp = 0;
  for (const ps of res.playerSeasons) {
    totArmRuns += ps.fielding.armRuns || 0;
    totArmOpp += ps.fielding.armOpp || 0;
  }
  const lgArmRunPerOpp = totArmOpp ? totArmRuns / totArmOpp : 0;

  // 追加進塁リーグ率（UBRの基準・§6）
  let totAdv = 0;
  let totAdvOpp = 0;
  for (const ps of res.playerSeasons) {
    totAdv += ps.baserunning.advTaken;
    totAdvOpp += ps.baserunning.advOpp;
  }
  const lgAdvRate = totAdvOpp ? totAdv / totAdvOpp : 0;

  // wSB中心化の基準（監査C1・§6）: リーグの盗塁/盗塁死と、盗塁母数=一塁到達(1B+BB+HBP-IBB)。
  // metrics側で lgwSB = (ΣSB×runSB+ΣCS×runCS)/Σ機会 を作り、走者の機会分だけ基準控除する。
  let lgSB = 0;
  let lgCS = 0;
  let lgSBOpp = 0;
  for (const ps of res.playerSeasons) {
    const b = ps.batting;
    lgSB += b.sb;
    lgCS += b.cs;
    lgSBOpp += b.b1 + b.bb + b.hbp - b.ibb;
  }

  // ポジション別 OAA/イニング・失策/イニング 平均（UZRの範囲成分/失策成分を
  // 「そのポジションで守る選手の平均=0」に中心化するため。§7.2・監査A3）
  const posAgg = {};
  for (const ps of res.playerSeasons) {
    const inn = totalFieldInnings(ps.fielding);
    if (inn < 1) continue;
    const pos = mainPosition(ps.fielding);
    if (!posAgg[pos]) posAgg[pos] = { oaa: 0, inn: 0, err: 0 };
    posAgg[pos].oaa += ps.fielding.oaaOuts;
    posAgg[pos].inn += inn;
    posAgg[pos].err += ps.fielding.e || 0;
  }
  const oaaCenterPerInn = {};
  const errCenterPerInn = {};
  for (const pos of Object.keys(posAgg)) {
    oaaCenterPerInn[pos] = posAgg[pos].oaa / posAgg[pos].inn;
    errCenterPerInn[pos] = posAgg[pos].err / posAgg[pos].inn;
  }

  return {
    lgGDPrate,
    lgDPRate,
    lgArmRunPerOpp,
    lgAdvRate,
    lgSB,
    lgCS,
    lgSBOpp,
    oaaCenterPerInn,
    errCenterPerInn,
    linearWeights: { ...LINEAR_WEIGHTS },
    lgRawPerPA,
    wobaScale,
    lgwOBA,
    lgOBP,
    lgRunsPerPA,
    lgSLG,
    lgHRFB,
    lgERA,
    lgFIP,
    fipConstant,
    rpw,
    // WAR 用の位置補正は §9/positions の per-1350 値を使う（143試合再スケールはWAR算出2-9で）
  };
}

/** シーズンを走らせてから cfg.leagueConstants を埋める（2パスの糊） */
function fillLeagueConstants(cfg, res) {
  cfg.leagueConstants = { ...cfg.leagueConstants, ...deriveLeagueConstants(res) };
  return cfg.leagueConstants;
}


// ===== src/sim/manager.mjs =====
// ============================================================================
// 監督ポリシー（フェーズA S2 / §S2 / 設計原則「采配はすべて監督ポリシー経由」）
//
// 采配・起用の判断ロジックをここに集約する（game.mjs は状態機械と記録に徹する）。
// フェーズCで人間の采配に差し替えるフックとなるため、各関数は
// 「状況（試合状態のビュー）→ 判断（確率 or 起用対象）」の純粋関数として書く。
//
// 三層構造の原則（req: 起用AIが trueAbility を直接見てよいのは編成の初期値のみ）:
//   - 打者の強弱判断 = 観測statline（observedWoba: 生カウント＋リーグ平均への回帰）
//   - 交代候補の序列 = buildPregameEval（試合開始時に固めた「監督の当日メモ」＝編成時評価）
//   - 左右（bats/throws）は公開情報として参照してよい
// シーズン中のレギュラー見直しは S3 usage.mjs（観測＋スカウトノイズ）が担う。
// ============================================================================







/** 中立の監督プロファイル（未指定時の既定。生成は generate.generateManager） */
function neutralManager() {
  return { buntTend: 50, stealTend: 50, ibbTend: 50, quickHook: 50 };
}

/**
 * 観測wOBA（インゲーム判断用の近似）。観測statlineの生カウントから
 * 得点価値/PA を出し、少打席はリーグ平均へ回帰させる（config.tuning.mgr）。
 * リーグ定数導出（2パス目）前でも使えるよう wobaScale は簡易ノブで代用。
 */
function observedWoba(batLine, cfg) {
  const m = cfg.tuning.mgr;
  const raw = rawRunValuePerPA(batLine, LINEAR_WEIGHTS) * m.wobaScale;
  const pa = batLine.pa || 0;
  return (raw * pa + m.wobaPrior * m.wobaPriorPA) / (pa + m.wobaPriorPA);
}

/**
 * 試合開始時の「監督の当日メモ」（編成時評価＝trueAbility 参照はここまで）。
 * 以降のインゲーム判断（代打/代走/守備固め）はこのメモと観測statlineのみを見る。
 * @returns {Map<string,{hit:number,speed:number,def:Object}>}
 */
function buildPregameEval(byId, cfg) {
  const d = cfg.tuning.depth;
  const m = new Map();
  for (const [pid, p] of byId) {
    const def = {};
    const range = rangeRating(p, cfg);
    for (const pos of FIELD_POSITIONS) {
      def[pos] = p.trueAbility.fielding.positionProf[pos] + d.posToolW * (range - 50);
    }
    m.set(pid, { hit: hitScore(p), speed: p.trueAbility.common.speed, def });
  }
  return m;
}

/** 側オブジェクトから未使用・未退場のブルペン投手を返す（可用リスト前提・§S2-7） */
function availableRelievers(side) {
  return side.bullpen.filter((pid) => !side.usedPitchers.has(pid) && !side.retired.has(pid));
}

// --- 盗塁の采配ゲート（§S2-6） ----------------------------------------------

/**
 * 盗塁試行への監督ゲート（logit加算値）。stealTend の個性＋状況ゲート:
 * 大差（±gateBigDiff以上）では走らない / 2死×強打者では自重。
 */
function stealLogitAdjust(manager, situ, cfg) {
  const s = cfg.tuning.steal;
  let adj = ratingDelta(manager.stealTend, s.tendW);
  if (Math.abs(situ.scoreDiff) >= s.gateBigDiff) adj -= s.gateBigDiffLogit;
  if (situ.outs === 2 && situ.batterWoba >= cfg.tuning.ibb.strongBatterWoba) adj -= s.gateStrong2OutLogit;
  return adj;
}

// --- 犠打（§S2-4） -----------------------------------------------------------

/**
 * 犠打の試行確率。局面不成立（2死/三塁走者あり/走者なし）は0。
 * 投手打席はほぼ必ずバント。野手は接戦×非強打者（観測wOBA）×監督buntTend。
 */
function buntAttemptProb(situ, cfg) {
  const t = cfg.tuning.bunt;
  if (situ.outs >= 2) return 0;
  if (situ.bases[2] || (!situ.bases[0] && !situ.bases[1])) return 0; // 走者1B/2B×三塁空きのみ
  if (situ.isPitcher) {
    // 投手は野手より広い点差でバントするが、大差では打たせる（点差ゲートを先に評価）
    return Math.abs(situ.scoreDiff) > t.pitcherMaxScoreDiff ? 0 : t.pitcherAttempt;
  }
  if (Math.abs(situ.scoreDiff) > t.maxScoreDiff) return 0;
  if (situ.batterWoba >= t.weakBatterWoba) return 0; // 強打者にはバントさせない
  return expit(logit(t.attemptBase) + ratingDelta(situ.manager.buntTend, t.tendW));
}

// --- 敬遠（§S2-5） -----------------------------------------------------------

/**
 * 敬遠の実施確率（守備側監督の判断）。一塁空き×一死or二死×終盤接戦×
 * （強打者 or 次打者が投手）でのみ正の値。
 */
function ibbProb(situ, cfg) {
  const t = cfg.tuning.ibb;
  if (situ.inning < t.minInning) return 0;
  if (situ.outs < 1) return 0; // 一死or二死のみ
  if (situ.bases[0]) return 0; // 一塁空きのみ
  if (!situ.bases[1] && !situ.bases[2]) return 0; // 得点圏に走者がいる時のみ
  if (Math.abs(situ.scoreDiff) > t.maxScoreDiff) return 0;
  if (!(situ.batterWoba >= t.strongBatterWoba || situ.nextIsPitcher)) return 0;
  return expit(logit(t.base) + ratingDelta(situ.manager.ibbTend, t.tendW));
}

// --- 代打/代走/守備固め（§S2-3） ---------------------------------------------

/**
 * 代打の起用判断。条件成立時、ベンチ最良打者（当日メモ＋プラトーン込み）を返す。
 * - 投手へ: phPitcherInning 以降のビハインド（±phMaxBehind内）or 同点以下の得点機。
 *   次の回に新投手を出せる救援が残っている時のみ。
 * - 野手へ: phInning 以降・同点orビハインド（phMaxBehind内）の得点機で、
 *   実効打力差（プラトーン込みhitScore相当）が phGainMin 以上の時のみ。
 * @returns {?string} 代打のplayerId（起用しないなら null）
 */
function choosePinchHitter(ctx, cfg) {
  const t = cfg.tuning.sub;
  const side = ctx.side;
  if (!side.bench.length) return null;
  const diff = side.score - ctx.oppScore;
  const risp = !!(ctx.bases[1] || ctx.bases[2]);
  if (ctx.isPitcher) {
    if (ctx.inning < t.phPitcherInning) return null;
    const behind = diff < 0 && -diff <= t.phMaxBehind;
    if (!behind && !(diff <= 0 && risp)) return null;
    if (availableRelievers(side).length === 0) return null; // 次の回の新投手が出せない
  } else {
    if (ctx.inning < t.phInning) return null;
    if (!(diff <= 0 && -diff <= t.phMaxBehind)) return null;
    if (!risp) return null; // 得点機のみ
  }
  // 実効打力 = 当日メモのhitScore − 同利きペナルティ（スイッチは常に有利側=減点なし）
  const eff = (pid) => {
    const e = side.pregame.get(pid);
    return e.hit - (isSameHand(side.byId.get(pid), ctx.oppPitcher) ? t.phPlatoonW : 0);
  };
  let best = null;
  let bestV = -Infinity;
  for (const pid of side.bench) {
    const v = eff(pid);
    if (v > bestV) {
      bestV = v;
      best = pid;
    }
  }
  if (bestV - eff(ctx.batterId) < t.phGainMin) return null;
  return best;
}

/**
 * 代走の起用判断。prInning 以降・prMaxScoreDiff 以内の接戦で、塁上の鈍足走者と
 * ベンチ最速の走力差が prSpeedGainMin 以上なら {baseIdx, pid} を返す。
 * 投手走者は対象外（投手退場が絡むため・DH無し試合）。
 */
function choosePinchRunner(ctx, cfg) {
  const t = cfg.tuning.sub;
  const side = ctx.side;
  if (!side.bench.length) return null;
  if (ctx.inning < t.prInning) return null;
  if (Math.abs(side.score - ctx.oppScore) > t.prMaxScoreDiff) return null;
  let fast = null;
  let fastSp = -Infinity;
  for (const pid of side.bench) {
    const sp = side.pregame.get(pid).speed;
    if (sp > fastSp) {
      fastSp = sp;
      fast = pid;
    }
  }
  let baseIdx = -1;
  let bestGain = -Infinity;
  for (let i = 0; i < 3; i++) {
    const r = ctx.bases[i];
    if (!r || r === side.curPid) continue;
    const gain = fastSp - side.pregame.get(r).speed;
    if (gain > bestGain) {
      bestGain = gain;
      baseIdx = i;
    }
  }
  if (baseIdx < 0 || bestGain < t.prSpeedGainMin) return null;
  return { baseIdx, pid: fast };
}

/**
 * 守備固めの判断。defInning 以降・リード defLeadMin〜defLeadMax で、
 * 守備最弱ポジ（当日メモの習熟＋素材）にベンチから defGainMin 以上の
 * 上位互換がいる時のみ {pos, pid} を返す。
 */
function chooseDefensiveSub(ctx, cfg) {
  const t = cfg.tuning.sub;
  const side = ctx.side;
  if (!side.bench.length) return null;
  if (ctx.inning < t.defInning) return null;
  const lead = side.score - ctx.oppScore;
  if (lead < t.defLeadMin || lead > t.defLeadMax) return null;
  let worstPos = null;
  let worstV = Infinity;
  for (const pos of Object.keys(side.defense)) {
    const pid = side.defense[pos];
    if (!pid) continue;
    const v = side.pregame.get(pid).def[pos];
    if (v < worstV) {
      worstV = v;
      worstPos = pos;
    }
  }
  if (!worstPos) return null;
  let best = null;
  let bestV = -Infinity;
  for (const pid of side.bench) {
    const v = side.pregame.get(pid).def[worstPos];
    if (v > bestV) {
      bestV = v;
      best = pid;
    }
  }
  if (!best || bestV - worstV < t.defGainMin) return null;
  return { pos: worstPos, pid: best };
}

// --- 継投v2（§S2-7） ---------------------------------------------------------

/** 先発の球数上限（スタミナ×監督quickHook。高quickHookほど早く代える） */
function starterPitchLimit(manager, pitcher, cfg) {
  const pen = cfg.tuning.pen;
  return (
    pen.starterPitchBase +
    pitcher.trueAbility.pitching.stamina * pen.starterPitchStamW -
    (manager.quickHook - 50) * pen.quickHookW
  );
}

/**
 * 状況→役割ベースの救援選択（§S2-7）。可用リスト（連投制限等でフィルタ済み・S3）のみ使用。
 *   9回以降セーブ機会 = closer / 8回 = setup8 / 7回 = setup7 /
 *   大差ビハインド = long（敗戦処理・長め） / その他 = middle をシーズン負荷最少で。
 * closer はセーブ機会（9回以降）にのみ登板させ、僅差以外では温存する。
 * @returns {?string} 登板させる投手id（適任なし=現投手続投なら null）
 */
function chooseReliever(side, statFor, inning, lead, cfg) {
  const pen = cfg.tuning.pen;
  const avail = availableRelievers(side);
  if (!avail.length) return null;
  const r = side.roles;
  const has = (pid) => pid != null && avail.includes(pid);
  const saveSitu = lead >= 1 && lead <= pen.saveLeadMax;

  if (saveSitu && inning >= 9) {
    if (has(r.closer)) return r.closer;
    return avail[0]; // 抑え不在: 序列最上位（bullpenはrelieverScore順）
  }
  if (saveSitu && inning === 8) {
    if (has(r.setup8)) return r.setup8;
    return avail.find((pid) => pid !== r.closer) ?? null; // closerは9回のセーブ機会に温存
  }
  if (saveSitu && inning === 7) {
    if (has(r.setup7)) return r.setup7;
    return avail.find((pid) => pid !== r.closer && pid !== r.setup8) ?? avail.find((pid) => pid !== r.closer) ?? null;
  }
  if (lead <= -pen.bigBehind && has(r.long)) return r.long; // 敗戦処理

  // その他（僅差ビハインド・同点・大差リード等）: middle を負荷分散。
  // closer/setup8 に加え setup7 も温存（7回接戦の役割登板と兼務させると登板数王が
  // 70台へ膨らむため・S5較正。middle が尽きた時のみ setup7→closer 以外の順で繰り上げ）。
  let pool = avail.filter((pid) => pid !== r.closer && pid !== r.setup8 && pid !== r.setup7);
  if (!pool.length) pool = avail.filter((pid) => pid !== r.closer && pid !== r.setup8);
  if (!pool.length) pool = avail.filter((pid) => pid !== r.closer);
  if (!pool.length) return null; // closerしか残っていない → 現投手続投
  // 負荷分散はG(登板数)基準・同数ならouts（S5較正: outs基準だと細切れ登板の投手に
  // 登板数が偏り登板数王が70台へ膨らむ。Gを均せば45-65へ収まる）
  let best = null;
  let bestG = Infinity;
  let bestOuts = Infinity;
  for (const pid of pool) {
    const p = statFor(pid, side.teamId).pitching;
    const g = p.g ?? 0;
    if (g < bestG || (g === bestG && p.outs < bestOuts)) {
      bestG = g;
      bestOuts = p.outs;
      best = pid;
    }
  }
  return best;
}


// ===== src/sim/battedBallStats.mjs =====
// ============================================================================
// 追加系指標の打球イベント集計（§B3a / フェーズB B3a）
//
// 「打席/打球/プレーのイベントストリームを読むだけで計算できる」追加集計を、
// シミュレーション本体（打席解決・打球生成・継投）を一切変えずに湧かせる。
// resolveBattedBall が既に計算した期待out率・期待塁打分布(xB1..xHR)と、打球3要素(EV/LA/spray)を
// 打者/投手の生カウントへ積むだけ。ここでは乱数を一切消費しない（＝決定論・較正30指標が完全不変）。
//
// 生の一球ログは永続化しない（§17）。集計カウンタのみ。
// ============================================================================


/**
 * Barrel 判定（Statcast定義の近似・§B3a）。EV≥~98mph かつ、EVが上がるほど広がるLA帯に入る打球。
 * @param {number} evKmh 打球速度(km/h)
 * @param {number} laDeg 打球角度(度)
 * @param {Object} m cfg.tuning.metrics（Barrel帯定数）
 */
function isBarrel(evKmh, laDeg, m) {
  if (evKmh < m.barrelMinKmh) return false;
  const excessMph = (evKmh - m.barrelMinKmh) / 1.60934; // 98mph超過ぶん(mph)
  const lo = Math.max(m.barrelMinLA, m.barrelBaseLo - excessMph * m.barrelLoSlope);
  const hi = Math.min(m.barrelMaxLA, m.barrelBaseHi + excessMph * m.barrelHiSlope);
  return laDeg >= lo && laDeg <= hi;
}

/** 打球種別を該当ラインの被打球分類カウンタへ加算（GB/LD/FB/PU＋総数bbEvents）。 */
function bumpType(line, type) {
  if (type === 'GB') line.bbGB++;
  else if (type === 'LD') line.bbLD++;
  else if (type === 'FB') line.bbFB++;
  else line.bbPU++;
  line.bbEvents++;
}

/**
 * 打球イベント1個ぶんを打者(bat)・投手(pit)の生カウントへ累積する（§B3a）。
 * @param {Object} bat 打者 battingLine
 * @param {Object} pit 投手 pitchingLine
 * @param {Object} bb  打球（evKmh/laDeg/sprayDeg）
 * @param {Object} r   resolveBattedBall の戻り（期待塁打分布 xB1/xB2/xB3/xHR を含む）
 * @param {number} pullSign 打者の引っ張り方向符号（effectiveBats==='L' ? +1 : -1）。
 *   spray がこの符号側なら Pull、逆なら Oppo、|spray|≤centAbsSpray なら Cent。
 * @param {Object} cfg 設定（cfg.tuning.metrics）
 */
function accumulateBatted(bat, pit, bb, r, pullSign, cfg) {
  const m = cfg.tuning.metrics;
  const type = battedType(bb.laDeg);
  // 被打球分類（打者・投手 双方に対称に計上）
  bumpType(bat, type);
  bumpType(pit, type);
  // 打球方向（打者のみ・Pull/Cent/Oppo）
  const s = bb.sprayDeg;
  if (Math.abs(s) <= m.centAbsSpray) bat.bbCent++;
  else if ((s > 0 ? 1 : -1) === pullSign) bat.bbPull++;
  else bat.bbOppo++;
  // 打球質・速度（打者のみ）
  if (bb.evKmh >= m.hardHitKmh) bat.hardHits++;
  if (bb.laDeg >= m.sweetSpotLoLA && bb.laDeg <= m.sweetSpotHiLA) bat.sweetSpots++;
  if (isBarrel(bb.evKmh, bb.laDeg, m)) bat.barrels++;
  bat.evSum += bb.evKmh;
  if (bb.evKmh > bat.evMax) bat.evMax = bb.evKmh;
  // 期待塁打分布（打者のみ・xBA/xSLG/xwOBA の素）。rng抽選前の期待値をそのまま累積。
  bat.xB1 += r.xB1;
  bat.xB2 += r.xB2;
  bat.xB3 += r.xB3;
  bat.xHR += r.xHR;
}


// ===== src/sim/game.mjs =====
// ============================================================================
// 試合状態機械（1-4c/e → フェーズA S2 でベンチ・采配・投手打席を導入）
//
// 打席は 1-1(規律層)→1-2/1-3(打球)で解決。走者は簡易進塁ルールで動かす（UBRの精緻化は2-5）。
// S2: initSide v2（当日スタメン/ベンチ/ブルペン可用リスト・lineupSlots・再出場不可）、
//     DH無し試合（9番=投手・投手交代で同スロット・投手への代打）、
//     代打/代走/守備固め、犠打、敬遠、盗塁の采配ゲート、役割ベース継投v2。
// 采配の判断ロジックは src/sim/manager.mjs に集約（本ファイルは状態遷移と記録に徹する。
// フェーズCで人間の采配に差し替えるフック＝判断関数の入替だけで済む構造）。
// 個人R(得点者)は保留、チーム得点(RS/RA)と投手失点のみ計上（§18・自己レビューF6）。
// ============================================================================












const MAX_INNINGS = 12; // NPB延長規定（超えたら引分）
const OUTFIELD_POS = new Set(['LF', 'CF', 'RF']); // ARM（外野送球）対象ポジション（§B3b）

/**
 * 走者を進める。bases=[1B,2B,3B]（playerId or null）。得点数を返し bases を破壊的更新。
 * @param {boolean} isAirOut アウトが空中打球（犠飛判定用）
 */
function advanceRunners(bases, result, batterId, isAirOut, outs, rng, cfg, ctx) {
  let runs = 0;
  const b1 = bases[0];
  const b2 = bases[1];
  const b3 = bases[2];

  if (result === 'BB' || result === 'HBP' || result === 'E') {
    // 押し出し（フォース）のみ。失策(E)も batter は一塁到達＝フォース進塁で近似
    if (b1) {
      if (b2) {
        if (b3) runs++; // 満塁押し出し
        bases[2] = b2;
      } else {
        bases[2] = b3; // 二塁が空なら三塁走者は残る
      }
      bases[1] = b1;
    } else {
      bases[1] = b2;
      bases[2] = b3;
    }
    bases[0] = batterId;
    return runs;
  }

  if (result === 'out') {
    // 犠飛: 空中アウト・2アウト未満・三塁走者 → 生還
    if (isAirOut && outs < 2 && b3) {
      runs++;
      bases[2] = null;
    }
    return runs; // それ以外は走者そのまま（併殺/進塁打は wGDP/UBR で後日）
  }

  if (result === '1B') {
    const nb = [null, null, null];
    if (b3) runs++; // 三塁は生還
    if (b2) {
      // 二塁走者の生還（走者Speed/IQ依存＝UBR, 2-5）
      if (resolveAdv(b2, cfg ? cfg.tuning.bb.singleScore2 : 0.55, ctx, cfg, rng)) runs++;
      else nb[2] = b2; // 三塁止まり
    }
    if (b1) nb[1] = b1; // 一塁→二塁（station to station）
    nb[0] = batterId; // 打者→一塁
    bases[0] = nb[0];
    bases[1] = nb[1];
    bases[2] = nb[2];
    return runs;
  }
  if (result === '2B') {
    const nb = [null, null, null];
    if (b3) runs++;
    if (b2) runs++;
    if (b1) {
      if (resolveAdv(b1, cfg ? cfg.tuning.bb.doubleScore1 : 0.45, ctx, cfg, rng)) runs++; // 一塁→生還
      else nb[2] = b1; // 三塁止まり
    }
    nb[1] = batterId; // 打者→二塁
    bases[0] = nb[0];
    bases[1] = nb[1];
    bases[2] = nb[2];
    return runs;
  }
  if (result === '3B') {
    if (b1) runs++;
    if (b2) runs++;
    if (b3) runs++;
    bases[0] = null;
    bases[1] = null;
    bases[2] = batterId;
    return runs;
  }
  if (result === 'HR') {
    if (b1) runs++;
    if (b2) runs++;
    if (b3) runs++;
    runs++; // 打者
    bases[0] = bases[1] = bases[2] = null;
    return runs;
  }
  return runs;
}

/**
 * 追加進塁（生還）の判定（§6 UBR, 2-5）。走者Speed/走塁IQで基準確率を上下し、
 * ctx があれば進塁機会(advOpp)と成否(advTaken)を走者に記録する。ctxなし=能力非依存（テスト互換）。
 */
function resolveAdv(pid, baseProb, ctx, cfg, rng) {
  let p = baseProb;
  if (ctx) {
    const t = ctx.byId.get(pid).trueAbility;
    const tool = (t.common.speed + t.baserunning.baserunIQ) / 2;
    p = clamp(baseProb + (tool - 50) * cfg.tuning.run.ubrSlope, 0.05, 0.95);
    const bs = ctx.statFor(pid, ctx.teamId).baserunning;
    bs.advOpp++;
    const took = (rng ? rng.next() : 1) < p;
    if (took) bs.advTaken++;
    return took;
  }
  return (rng ? rng.next() : 1) < baseProb;
}

/** 投球数の近似（除去判定用） */
function pitchesFor(outcome) {
  if (outcome === 'K') return 4.8;
  if (outcome === 'BB') return 5.2;
  if (outcome === 'HBP') return 3.5;
  return 3.6;
}

function baseBits(bases) {
  return (bases[0] ? 1 : 0) | (bases[1] ? 2 : 0) | (bases[2] ? 4 : 0);
}

/**
 * 盗塁の試行・成否（§6 wSB）。走者Steal/Speed × 投手Hold × 捕手Arm。outs を返す。
 * S2: 監督stealTend×状況の采配ゲート（大差では走らない・2死×強打者では自重）を乗せる。
 */
function attemptSteal(batting, fielding, bases, outs, statFor, cfg, rng) {
  if (!bases[0] || bases[1]) return outs; // 一塁走者かつ二塁が空いている時のみ
  const runner = batting.byId.get(bases[0]);
  const s = cfg.tuning.steal;
  const br = runner.trueAbility.baserunning;
  const sp = runner.trueAbility.common.speed;

  // 采配ゲート（§S2-6）: 打者の強弱は観測wOBA（三層構造: 真値は見ない）
  const batterId = batting.slots[batting.orderIdx].playerId;
  const situ = {
    scoreDiff: batting.score - fielding.score,
    outs,
    batterWoba: observedWoba(statFor(batterId, batting.teamId).batting, cfg),
  };

  // 試行判断: 走者のSteal/Speedが高いほど走る × 監督ゲート
  const aggr = expit(
    logit(s.attemptBase) +
      ratingDelta(br.steal, s.attemptSlope) +
      ratingDelta(sp, s.attemptSlope * 0.5) +
      stealLogitAdjust(batting.manager, situ, cfg),
  );
  if (rng.next() >= aggr) return outs;

  // 成功確率: 走者Steal/Speed↑、投手Hold↑・捕手Arm↑で↓
