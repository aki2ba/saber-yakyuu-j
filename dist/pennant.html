// ============================================================================
// 架空選手・チーム・リーグのジェネレータ（§0法的前提 / §1 / §10.2 / 0-6）
//
// 方針:
//   - 名前は完全架空（実在選手名・そのもじりを使わない）。姓名パーツの手続き合成。
//   - 能力は分布から個体ごとに引く（§1「合わせるのは集団の分布」）。中心50/裾でばらす。
//   - 三層の器を埋める: layer1=trueAbility（ここで生成）/ layer3=scoutSeed / layer2=空。
//   - declineRateは能力タイプと相関（§10.2: 速球・走力高＆制球・技巧低→衰え速い）。
//   - 分布の平均/分散は初期値。最終的な"リアルさ"は較正(1-11)でこのノブを回して合わせる。
//   - masterSeed＋階層シードで、生成は決定論・順序非依存（誰が回しても同じリーグ）。
// ============================================================================





// --- 名前パーツ（完全架空・common surname/given の手続き合成。プールは拡張可） ------
const SURNAMES = [
  '青柳', '石垣', '大空', '海堂', '桐生', '黒瀬', '小鳥遊', '相良',
  '志摩', '瀬川', '立花', '茅野', '鶴見', '灯野', '成瀬', '羽鳥',
  '氷室', '深沢', '真壁', '御影', '柳沢', '結城', '芳賀', '鷲尾',
];
const GIVEN = [
  '陽', '駿', '空良', '樹', '奏太', '海斗', '大河', '蒼真',
  '悠人', '玲', '湊', '一颯', '隼', '楓', '直', '和',
  '琉生', '碧', '慶', '拓実', '真澄', '航', '創', '燿',
];

// --- 架空チーム名（実在NPB球団名を避けた造語） -------------------------------
const TEAM_NAMES = [
  '白鷺ホワイトス', '疾風ゲイルズ', '蒼波ブルーズ', '紅蓮フレイムス',
  '雷鳴サンダー', '黒曜オブシディアン', '翠嶺グリーンズ', '金獅子ライオネル',
  '銀翼シルバーズ', '暁アヴローラ', '嵐山ストームズ', '夜叉ナイツ',
];

function draw(rng, mean = 50, sd = 10) {
  return clampRating(rng.normal(mean, sd));
}

/** 完全架空の姓名を合成 */
function generateName(rng) {
  return SURNAMES[rng.int(SURNAMES.length)] + '　' + GIVEN[rng.int(GIVEN.length)];
}

/** 投手を1人生成 */
function generatePitcher(rng, id) {
  const velocityKmh = Math.round(clamp(rng.normal(146, 4.5), 130, 165)); // NPB先発平均~146
  const control = draw(rng, 50, 10);
  const stamina = draw(rng, 50, 12);

  // 球種数 2〜5（奪三振能力とは独立, §8.1）。fastball は必ず保有。
  const nPitches = 2 + rng.int(4);
  const pool = shuffle(rng, PITCH_TYPES.filter((t) => t !== 'fastball'));
  const types = ['fastball', ...pool.slice(0, nPitches - 1)];
  const pitches = types.map((t) =>
    createPitch(t, {
      current: draw(rng, 50, 10),
      whiff: draw(rng, 50, 12),
      hrSuppress: draw(rng, 50, 10),
      contactQuality: draw(rng, 50, 10), // 被コンタクト質の抑止（EV抑止に接続・A-9修正）
    }),
  );

  // §10.2 衰え相関: 速球高＆制球低 → 衰え速い（技巧派だけ長生き）。
  const declineRate = clamp(
    0.5 + (velocityKmh - 146) * 0.03 - (control - 50) * 0.012 + rng.normal(0, 0.15),
    0.1,
    1.3,
  );

  const t = createTrueAbility({
    common: {
      arm: draw(rng, 56, 9),
      speed: draw(rng, 42, 9),
      hands: draw(rng, 48, 9),
      reaction: draw(rng, 48, 9),
      power: draw(rng, 45, 9),
    },
    batting: { ev: draw(rng, 38, 8), la: draw(rng, 42, 8), contact: draw(rng, 38, 8), eye: draw(rng, 42, 8) },
    pitching: { velocityKmh, control, stamina, gbRate: draw(rng, 50, 12), hold: draw(rng, 50, 10), pitches },
    career: { peakAge: Math.round(clamp(rng.normal(27, 2), 23, 34)), declineRate },
  });

  return createPlayer({
    id,
    name: generateName(rng),
    role: 'pitcher',
    bats: rng.chance(0.3) ? 'L' : 'R',
    throws: rng.chance(0.28) ? 'L' : 'R',
    age: 18 + rng.int(20),
    trueAbility: t,
    scoutSeed: hashSeed(id, 'scout'),
  });
}

// ポジション別の打撃バイアス（守備難ポジは打撃控えめ＝現実の傾向。較正で微調整）
const POS_POWER_BIAS = { '1B': 8, RF: 6, LF: 6, '3B': 3, CF: 0, C: -2, '2B': -3, SS: -5 };

/** 野手を1人生成（primaryPos を主守備位置に） */
function generateFielder(rng, id, primaryPos) {
  const speed = draw(rng, primaryPos === 'CF' || primaryPos === 'SS' ? 58 : 48, 11);
  const powerBias = POS_POWER_BIAS[primaryPos] ?? 0;
  const power = draw(rng, 50 + powerBias, 11);

  // 守備習熟: 主ポジ高、他は低。ユーティリティは近隣に分散（§13）。
  const positionProf = {};
  for (const p of FIELD_POSITIONS) positionProf[p] = draw(rng, 24, 5);
  positionProf[primaryPos] = draw(rng, 60, 8);
  if (rng.chance(0.35)) {
    // ユーティリティ寄り: もう1ポジ育つ
    const alt = FIELD_POSITIONS[rng.int(FIELD_POSITIONS.length)];
    positionProf[alt] = Math.max(positionProf[alt], draw(rng, 48, 8));
  }

  const declineRate = clamp(0.5 + (speed - 50) * 0.012 + rng.normal(0, 0.15), 0.1, 1.3);

  const t = createTrueAbility({
    common: {
      speed,
      power,
      arm: draw(rng, primaryPos === 'RF' || primaryPos === 'C' ? 58 : 50, 10),
      hands: draw(rng, 50, 10),
      reaction: draw(rng, 50, 10),
    },
    batting: {
      ev: draw(rng, 50 + powerBias, 10),
      la: draw(rng, 50, 10),
      pull: draw(rng, 50, 12),
      contact: draw(rng, 50, 10),
      eye: draw(rng, 50, 10),
      vsFastball: draw(rng, 50, 11), // 対速球適性（§4段階1）
      vsBreaking: draw(rng, 50, 11), // 対変化球適性
    },
    fielding: {
      positionProf,
      positioningIQ: draw(rng, 50, 10),
      framing: primaryPos === 'C' ? draw(rng, 50, 10) : draw(rng, 30, 6),
    },
    baserunning: { steal: draw(rng, speed > 55 ? 55 : 46, 12), baserunIQ: draw(rng, 50, 10) },
    career: { peakAge: Math.round(clamp(rng.normal(27, 2), 23, 34)), declineRate },
  });

  return createPlayer({
    id,
    name: generateName(rng),
    role: 'fielder',
    bats: rng.chance(0.35) ? 'L' : rng.chance(0.08) ? 'S' : 'R',
    throws: rng.chance(0.15) ? 'L' : 'R',
    age: 18 + rng.int(20),
    trueAbility: t,
    scoutSeed: hashSeed(id, 'scout'),
  });
}

// 1チームの守備位置配分（合計20野手＋13投手＝33人）
const FIELDER_PLAN = [
  'C', 'C', 'C',
  '1B', '1B',
  '2B', '2B', '2B',
  '3B', '3B',
  'SS', 'SS', 'SS',
  'LF', 'LF',
  'CF', 'CF', 'CF',
  'RF', 'RF',
];
const PITCHERS_PER_TEAM = 13;

/** 1チームのロスターを生成 */
function generateTeam(rng, teamId) {
  const roster = [];
  for (let i = 0; i < PITCHERS_PER_TEAM; i++) {
    roster.push(generatePitcher(rng, `${teamId}P${i + 1}`));
  }
  FIELDER_PLAN.forEach((pos, i) => {
    roster.push(generateFielder(rng, `${teamId}F${i + 1}`, pos));
  });
  return roster;
}

/**
 * 監督プロファイルを生成（S1・§S2/S3の采配判断が参照する「監督ポリシー」の個性）。
 * 20-80スケール(50=リーグ平均)。判断ロジック自体は src/sim/manager.mjs に置く（S2）。
 */
function generateManager(rng) {
  return {
    buntTend: draw(rng, 50, 12), // 犠打の好み（高いほどバントさせる）
    stealTend: draw(rng, 50, 12), // 盗塁の積極性
    ibbTend: draw(rng, 50, 12), // 敬遠の使い方
    quickHook: draw(rng, 50, 12), // 継投の早さ（高いほど早く投手を代える）
  };
}

/**
 * リーグ全体を生成。masterSeed＋階層シードで決定論・順序非依存。
 * 2リーグ制: 前半球団=leagues[0]（L1・DH無）、後半=leagues[1]（L2・DH有）。
 * @returns {{masterSeed:number, teams:Array, players:Array}}
 */
function generateLeague(masterSeed, config) {
  const numTeams = config.league.numTeams;
  const leagues = config.league.leagues ?? null;
  const perLeague = leagues ? Math.ceil(numTeams / leagues.length) : numTeams;
  const teams = [];
  const players = [];
  for (let ti = 0; ti < numTeams; ti++) {
    const teamId = `T${ti + 1}`;
    const trng = makeRng(hashSeed(masterSeed, 'team', ti));
    const roster = generateTeam(trng, teamId);
    for (const p of roster) p.teamId = teamId;
    // リーグ割当（前半6球団=L1 / 後半=L2）
    const leagueId = leagues ? leagues[Math.min(Math.floor(ti / perLeague), leagues.length - 1)].id : null;
    // 監督は別ストリームで生成（ロスター生成の決定論・順序非依存を汚さない）
    const manager = generateManager(makeRng(hashSeed(masterSeed, 'manager', ti)));
    teams.push({
      id: teamId,
      name: TEAM_NAMES[ti] ?? teamId,
      league: leagueId,
      manager,
      playerIds: roster.map((p) => p.id),
    });
    players.push(...roster);
  }
  return { masterSeed, teams, players };
}

/** Fisher–Yates（rng使用・決定論） */
function shuffle(rng, arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = rng.int(i + 1);
    const tmp = a[i];
    a[i] = a[j];
    a[j] = tmp;
  }
  return a;
}


// ===== src/sim/rates.mjs =====
// 確率合成の基本関数（log5/オッズ比の土台。§3.1）。
// logit/expit と、レーティング(20-80, 50=平均)を logit の増分へ写す変換。

/** ロジット（オッズの対数） */
function logit(p) {
  return Math.log(p / (1 - p));
}

/** 逆ロジット（シグモイド） */
function expit(x) {
  return 1 / (1 + Math.exp(-x));
}

/**
 * レーティング(50=平均)を logit 増分に変換。
 * 例: slope=0.30 なら 80(=+30) で +0.9（オッズ約2.5倍）。
 */
function ratingDelta(rating, slope) {
  return (slope * (rating - 50)) / 10;
}

/**
 * log5 / オッズ比合成: リーグ基準率に打者側・投手側の logit 増分を足し込む（§3.1）。
 * logit(P) = logit(L) + Δbatter + Δpitcher。両者が平均なら L に戻る。
 */
function log5(leagueRate, batterDelta, pitcherDelta) {
  return expit(logit(leagueRate) + batterDelta + pitcherDelta);
}


// ===== src/sim/plateAppearance.mjs =====
// ============================================================================
// 打席解決の規律層（1-1）— 2段パイプラインの第1段（§3.1 / 自己レビュー F29）
//
// ここでは打者能力 vs 投手能力を log5/オッズ比で合成し、打席の分岐だけを決める:
//   { K(三振) / BB(四球) / HBP(死球) / IN_PLAY(インプレー=打球化) }
// 安打/アウト/長打は決めない。IN_PLAY は第2段(1-2/1-3 EV/LA→球場→守備)へ渡す。
// 「結果を先に決めてゾーンを後付け」を避け、決定権をこの1箇所に閉じる。
// ============================================================================




const PA_OUTCOME = { K: 'K', BB: 'BB', HBP: 'HBP', IN_PLAY: 'inPlay' };

/** 投手の平均空振り資質（球種whiffの平均）。球種未設定なら平均50。 */
function meanWhiff(pit) {
  const arr = pit.pitches;
  if (!arr || arr.length === 0) return 50;
  let s = 0;
  for (const p of arr) s += p.whiff;
  return s / arr.length;
}

/**
 * 打席の分岐確率（pK, pBB, pHBP）を log5 合成で算出。IN_PLAY は残余。
 * @returns {{pK:number, pBB:number, pHBP:number, pInPlay:number}}
 */
function paProbabilities(batter, pitcher, cfg, tto = 0, pitch = null) {
  const pa = cfg.tuning.pa;
  const b = batter.trueAbility.batting;
  const p = pitcher.trueAbility.pitching;

  // --- 左右プラトーン（S1・M7解消）: 同利き（スイッチは常に有利側=逆打席）で K↑ BB↓ ---
  const pl = cfg.tuning.platoon;
  const same = pl && isSameHand(batter, pitcher);

  // --- K: 打者のK傾向（コンタクト/選球眼＋対該当球種クラス適性）×投手の奪三振資質 ---
  // 球種格子(§4段階1): pitch があればその球種の whiff を使い、打者の対クラス適性で補正。
  const whiffVal = pitch ? pitch.whiff : meanWhiff(p);
  let aptAdj = 0;
  if (pitch) {
    const apt = pitchClass(pitch.type) === 'fastball' ? b.vsFastball : b.vsBreaking;
    aptAdj = pa.whiffAptW * (apt - 50); // 適性高い→Kしにくい
  }
  // 巡目(tto)が進むほど打者はK を回避しやすい（§3.3）。
  const kProne = 50 - pa.kContactW * (b.contact - 50) - pa.kEyeW * (b.eye - 50) - aptAdj;
  const kStuff = whiffVal + pa.kVeloPerKmh * (p.velocityKmh - 146);
  let pK = expit(
    logit(pa.kLeague) +
      ratingDelta(kProne, pa.kSlope) +
      ratingDelta(kStuff, pa.kSlope) -
      tto * cfg.tuning.tto.kPerTime +
      (same ? pl.kLogitSame : 0),
  );

  // --- BB: 打者選球眼（高→増）×投手制球（高→減） ---
  let pBB = expit(
    logit(pa.bbLeague) +
      ratingDelta(b.eye, pa.bbSlope) -
      ratingDelta(p.control, pa.bbSlope) +
      (same ? pl.bbLogitSame : 0),
  );

  // --- HBP: 小。投手制球が低いほどわずかに増 ---
  let pHBP = expit(logit(pa.hbpLeague) - ratingDelta(p.control, pa.hbpSlope));

  // 端の組み合わせで合計が1に近づき過ぎないようガード（IN_PLAY を最低限残す）
  const sum = pK + pBB + pHBP;
  const cap = 0.95;
  if (sum > cap) {
    const s = cap / sum;
    pK *= s;
    pBB *= s;
    pHBP *= s;
  }
  return { pK, pBB, pHBP, pInPlay: 1 - pK - pBB - pHBP };
}

/**
 * 打席の分岐を1回抽選（決定論・rng使用）。
 * @returns {'K'|'BB'|'HBP'|'inPlay'}
 */
function resolvePADiscipline(batter, pitcher, cfg, rng, tto = 0, pitch = null) {
  const { pK, pBB, pHBP } = paProbabilities(batter, pitcher, cfg, tto, pitch);
  const u = rng.next();
  if (u < pK) return PA_OUTCOME.K;
  if (u < pK + pBB) return PA_OUTCOME.BB;
  if (u < pK + pBB + pHBP) return PA_OUTCOME.HBP;
  return PA_OUTCOME.IN_PLAY;
}


// ===== src/sim/battedBall.mjs =====
// ============================================================================
// 打球生成（1-2）— 2段パイプラインの第2段・前半（§3.2）
//
// IN_PLAY になった打席で、接触の瞬間に打球3要素を先に生成する:
//   EV（打球速度 km/h） = 打者EV適性 × 生体power × 投球の質（抑止）＋ノイズ
//   LA（打球角度 度）   = 打者LA適性 × 投手ゴロ率相性 ＋ノイズ
//   方向（spray 度）    = 打者引っ張り/流し（利き手で符号）＋ノイズ
// ここでは結果（安打/アウト）は決めない。落下点・結果は 1-3 が球場ジオメトリで導く。
//
// Phase1簡略（自己レビューF34）: 「投球の質」は集約スカラー、方向は打者傾向のみ
//   （×投球コースは球種格子 段階2まで保留）。球種別は 2-1 で差し替える。
// ============================================================================




/** 投手の被コンタクト質抑止（球種contactQualityの平均。高いほど強い打球を許さない） */
function meanContactSuppress(pit) {
  const arr = pit.pitches;
  if (!arr || arr.length === 0) return 50;
  let s = 0;
  for (const p of arr) s += p.contactQuality;
  return s / arr.length;
}

/**
 * 打球3要素を生成して BattedBall を返す（幾何・結果は null のまま）。
 */
function generateBattedBall(batter, pitcher, cfg, rng, ctx = {}) {
  const bb = cfg.tuning.bb;
  const bat = batter.trueAbility;
  const pit = pitcher.trueAbility.pitching;

  // EV: 打者EV適性＋power − 投手抑止(選択球種) − 被弾抑止(M3) ＋対クラス適性 ＋巡目 ＋ノイズ
  const tto = ctx.tto ?? 0;
  const pitch = ctx.pitch ?? null;
  const contactSup = pitch ? pitch.contactQuality : meanContactSuppress(pit);
  const hrSup = pitch ? pitch.hrSuppress : 50;
  const apt = pitch
    ? pitchClass(pitch.type) === 'fastball'
      ? bat.batting.vsFastball
      : bat.batting.vsBreaking
    : 50;
  // 左右プラトーン（S1・M7解消）: 同利き（スイッチは常に有利側）でEVの中心を下げる
  const pl = cfg.tuning.platoon;
  const platoonEv = pl && isSameHand(batter, pitcher) ? pl.evKmhSame : 0;
  const evMean =
    bb.evBase +
    bb.evPerEV * (bat.batting.ev - 50) +
    bb.evPerPower * (bat.common.power - 50) -
    bb.evPitchSuppress * (contactSup - 50) -
    bb.evHrSuppressW * (hrSup - 50) +
    bb.evAptW * (apt - 50) +
    tto * cfg.tuning.tto.evPerTime +
    platoonEv;
  const evKmh = Math.max(40, rng.normal(evMean, bb.evSd));

  // LA: 打者LA適性で中心シフト、投手ゴロ率で下げる ＋ノイズ
  const laMean = bb.laBase + bb.laPerLA * (bat.batting.la - 50) - bb.laPitchGB * (pit.gbRate - 50);
  const laDeg = rng.normal(laMean, bb.laSd);

  // 方向: pull適性で引っ張り側へ。右打ちは左方向(−)、左打ちは右方向(+)へ引っ張る。
  // スイッチ(S)は実効打席サイド（常に投手と逆＝有利側）で引っ張る（S1でM7の簡易扱いを解消）。
  const pullMag = bb.sprayPull * (bat.batting.pull - 50);
  const pullSign = effectiveBats(batter, pitcher) === 'L' ? +1 : -1;
  const sprayMean = pullSign * pullMag;
  let sprayDeg = rng.normal(sprayMean, bb.spraySd);
  if (sprayDeg < -50) sprayDeg = -50;
  if (sprayDeg > 50) sprayDeg = 50;

  const bb2 = createBattedBall({
    evKmh,
    laDeg,
    sprayDeg,
    pitchType: ctx.pitchType ?? null,
    batterId: batter.id,
    pitcherId: pitcher.id,
    baseState: ctx.baseState ?? 0,
    outs: ctx.outs ?? 0,
  });
  bb2.runnerSpeed = batter.trueAbility.common.speed; // 三塁打の脚力依存に使用（監査B1）
  return bb2;
}


// ===== src/sim/battedBallResult.mjs =====
// ============================================================================
// 打球結果解決（1-3）— 2段パイプラインの第2段・後半（§3.2 / 自己レビュー F29）
//
// 打球3要素(EV/LA/方向)＋球場ジオメトリから落下点・滞空時間を出し、
//   - フェンス越え → HR
//   - それ以外 → 「そのポジション平均の期待アウト率」で安打/アウトを確定し、
//     安打種別(1B/2B/3B)を落下点から導く
// を行う。ここで守備者"個人"の巧拙は入れない（＝ポジション平均）。
// 個人の上手さは OAA(1-9) と守備モデル(2-7)で "期待からの差分" として後付けする。
// ============================================================================



const G = 9.8;

/** 打球種別（角度で分類） */
function battedType(laDeg) {
  if (laDeg < 10) return 'GB'; // ゴロ（負角含む）
  if (laDeg < 25) return 'LD'; // ライナー
  if (laDeg <= 50) return 'FB'; // フライ
  return 'PU'; // ポップ
}

/** 飛距離・滞空・落下点を計算して bb に書き込む */
function computeGeometry(bb, cfg, park = NEUTRAL_PARK) {
  const v = bb.evKmh / 3.6; // m/s
  const laRad = (bb.laDeg * Math.PI) / 180;
  let distanceM;
  let hangTimeS;
  if (bb.laDeg <= 0) {
    // ゴロ: 地面を転がる想定。内野到達距離の目安のみ。
    distanceM = Math.max(0, ((v * v) / G) * 0.15);
    hangTimeS = 0;
  } else {
    // キャリー効率: 最適LA ~26°を中心に山（空気抵抗込みの現実近似。真空sin(2θ)より現実的）
    const lift = Math.exp(-Math.pow((bb.laDeg - 26) / 24, 2));
    distanceM = Math.max(0, cfg.tuning.bb.carry * ((v * v) / G) * lift);
    hangTimeS = (2 * v * Math.sin(laRad)) / G;
  }
  const sprayRad = (bb.sprayDeg * Math.PI) / 180;
  bb.distanceM = distanceM;
  bb.hangTimeS = hangTimeS;
  bb.landingX = distanceM * Math.sin(sprayRad);
  bb.landingY = distanceM * Math.cos(sprayRad);
  return bb;
}

/** 落下点・打球種別から担当野手ポジションを決める（OAAの主語） */
function assignFielder(bb, type) {
  const s = bb.sprayDeg;
  const infield = type === 'GB' || type === 'PU' || (type === 'LD' && bb.distanceM < 45);
  if (infield) {
    if (s <= -18) return '3B';
    if (s <= -4) return 'SS';
    if (s < 6) return s < 0 ? 'SS' : '2B';
    if (s < 20) return '2B';
    return '1B';
  }
  // 外野: CFの担当角を狭め（±15→±10）、モード(0°)集中による機会・UZR過大を緩和（監査B6）
  if (s <= -10) return 'LF';
  if (s < 10) return 'CF';
  return 'RF';
}

/** 打球種別ごとの基準hit率（ポジション平均のxBABIP的な値） */
function baseHitProb(type, cfg) {
  const bb = cfg.tuning.bb;
  return type === 'GB' ? bb.hitGB : type === 'LD' ? bb.hitLD : type === 'FB' ? bb.hitFB : bb.hitPU;
}

/** 安打種別を落下点から決める（監査B1: 単打/二塁打境界＝gapDistM、深いギャップ球は打者脚力で三塁打化） */
function decideBases(bb, type, cfg, rng) {
  const g = cfg.tuning.bb;
  if (type === 'GB') {
    return Math.abs(bb.sprayDeg) > 38 && rng.next() < 0.2 ? '2B' : '1B';
  }
  // 外野手到達圏(gapDistM)手前に前落ちする空中安打は単打
  if (bb.distanceM < g.gapDistM) return '1B';
  // 深い打球は二塁打ベース。さらに深いギャップ/ライン際(|spray|>18)は打者speedで三塁打になりうる
  if (bb.distanceM >= g.tripleDistM && Math.abs(bb.sprayDeg) > 18) {
    const speed = bb.runnerSpeed ?? 50;
    const pTriple = clamp(g.tripleBase + (speed - 50) * g.tripleSpeedW, 0.02, 0.55);
    if (rng.next() < pTriple) return '3B';
  }
  return '2B';
}

/**
 * 打球を解決。bb.result と bb.fielderPos を確定し、要約を返す。
 * @returns {{result:string, type:string, expOut:number, fielderPos:string, distanceM:number}}
 */
/**
 * @param {Function} [fielderRangeFor] (pos) => Rangeレーティング(50=平均)。守備者個人の
 *   レンジで実効被安打率を上下させる（2-7）。省略時は50＝リーグ平均（Phase1互換）。
 */
function resolveBattedBall(bb, cfg, rng, park = NEUTRAL_PARK, fielderRangeFor) {
  computeGeometry(bb, cfg, park);
  const type = battedType(bb.laDeg);

  // --- HR判定: 適角のフライ/ライナーが（hrScale込みで）フェンスを越える ---
  if ((type === 'FB' || type === 'LD') && bb.laDeg >= 15 && bb.laDeg <= 48) {
    const fence = fenceDistanceAt(bb.sprayDeg, park);
    if (bb.distanceM * cfg.tuning.hrScale >= fence) {
      bb.fielderPos = assignFielder(bb, type);
      bb.result = 'HR';
      return { result: 'HR', type, expOut: 0, fielderPos: bb.fielderPos, distanceM: bb.distanceM };
    }
  }

  // --- インプレー: ポジション平均の期待アウト率で安打/アウト ---
  let pHit = baseHitProb(type, cfg) + (bb.evKmh - 140) * cfg.tuning.bb.evHitW;
  if (type === 'FB' && bb.distanceM >= cfg.tuning.bb.fbHitBonusM) pHit += 0.15; // 警告帯FBの被安打（BABIP環境維持のため二塁打境界と別閾値）
  pHit = clamp(pHit, 0.01, 0.97);

  const fielderPos = assignFielder(bb, type);
  bb.fielderPos = fielderPos;
  const expOut = 1 - pHit; // リーグ平均基準（OAAのベースライン・ポジション中立）

  // 守備者個人のRangeで実効被安打率を上下（good fielder→outを増やす）。OAAの個人シグナル源。
  const rangeR = fielderRangeFor ? fielderRangeFor(fielderPos) : 50;
  const effPHit = clamp(pHit - (rangeR - 50) * cfg.tuning.field.rangePerRating, 0.01, 0.99);

  if (rng.next() >= effPHit) {
    bb.result = 'out';
    return { result: 'out', type, expOut, fielderPos, distanceM: bb.distanceM };
  }
  const base = decideBases(bb, type, cfg, rng);
  bb.result = base;
  return { result: base, type, expOut, fielderPos, distanceM: bb.distanceM };
}


// ===== src/sim/pitchGrid.mjs =====
// ============================================================================
// 球種格子 段階1（2-1/2-2 / §4）
// 1打席ごとに投手の球種を1つ選び、その球種の (whiff/hrSuppress/contactQuality) と
// 打者の (対速球/対変化球) 適性で解決する。これにより:
//   - 対ストレート成績が球種別ログの集計として湧く
//   - フォーク習得で開花（列が一本生える＝新しい優秀な球種の追加）
//   - 球種構成＝投手タイプ / 先発・リリーフ適性
// ============================================================================


/** その打席で投げる球種を1つ選ぶ（速球系を重く重み付け） */
function selectPitch(pitcher, rng, cfg) {
  const pitches = pitcher.trueAbility.pitching.pitches;
  if (!pitches || pitches.length === 0) return null;
  const fw = cfg.tuning.pa.fastballWeight;
  let total = 0;
  for (const p of pitches) total += FASTBALL_TYPES.has(p.type) ? fw : 1;
  let r = rng.next() * total;
  for (const p of pitches) {
    r -= FASTBALL_TYPES.has(p.type) ? fw : 1;
    if (r <= 0) return p;
  }
  return pitches[pitches.length - 1];
}


// ===== src/sim/fielding.mjs =====
// ============================================================================
// 守備の能力→結果 結線（2-7）＋ OAA→UZR run換算（2-8）（§7 / 自己レビュー M1・B-7）
//
// Range（守備範囲）= ポジショニングIQ + 初動(Reaction) + 走力(Speed)（§7.1）を合成し、
// 打球結果解決(resolveBattedBall)に注入して「実効被安打率」を個人スキルで上下させる。
// 期待アウトのベースラインはリーグ平均(ポジション中立)のままなので、
// 実結果 − 期待 の累積(oaaOuts)が個人のレンジ・シグナルになる（MLBAM OAAと同型）。
// ============================================================================

const OUTFIELD = new Set(['LF', 'CF', 'RF']);

/** 野手のRangeレーティング（50=リーグ平均）。§7.1 の Range = ポジIQ+初動+走力 */
function rangeRating(player, cfg) {
  const f = player.trueAbility.fielding;
  const c = player.trueAbility.common;
  const w = cfg.tuning.field.wRange;
  return w.positioningIQ * f.positioningIQ + w.reaction * c.reaction + w.speed * c.speed;
}

/** 選手シーズンの主守備位置（守備アウト最多） */
function mainPosition(fieldingLine) {
  let pos = '';
  let mx = -1;
  for (const k of Object.keys(fieldingLine.positionOuts)) {
    if (fieldingLine.positionOuts[k] > mx) {
      mx = fieldingLine.positionOuts[k];
      pos = k;
    }
  }
  return pos;
}

/** 選手の総守備イニング */
function totalFieldInnings(fieldingLine) {
  let o = 0;
  for (const k of Object.keys(fieldingLine.positionOuts)) o += fieldingLine.positionOuts[k];
  return o / 3;
}

/**
 * ポジション別に中心化した OAA（アウト単位）。
 * 生の oaaOuts はリーグ中立基準ゆえ「出場している守備者（＝上手い選手ばかり）」が全員プラスに
 * 偏る。正しくは「そのポジションで実際に守る選手の平均」を0とすべき（UZRの定義）。
 * lc.oaaCenterPerInn（主ポジ別のOAA/イニング平均）を差し引いて中心化する。
 */
function centeredOAAOuts(ps, lc) {
  const raw = ps.fielding.oaaOuts;
  if (!lc || !lc.oaaCenterPerInn) return raw;
  const pos = mainPosition(ps.fielding);
  const inn = totalFieldInnings(ps.fielding);
  return raw - (lc.oaaCenterPerInn[pos] || 0) * inn;
}

/**
 * 失策run成分（ErrR・§7.2 / 監査A3）。OAAは失策"前"の判定で範囲成分のみを表すため、
 * 捕球ミス（Hands）の価値はここで別勘定する（二重計上しない）。
 * ポジション平均の失策率で中心化し、平均より失策が少ない＝プラス。
 */
function errRunsAboveAvg(ps, cfg, lc) {
  if (!lc || !lc.errCenterPerInn) return 0;
  const pos = mainPosition(ps.fielding);
  const inn = totalFieldInnings(ps.fielding);
  const expE = (lc.errCenterPerInn[pos] || 0) * inn;
  return -((ps.fielding.e || 0) - expE) * cfg.tuning.field.runPerError;
}

/**
 * UZR相当(run単位) = 範囲成分(中心化OAA×run/out) + 失策成分(ErrR) + 捕手フレーミング(framingRuns)。
 * 内野0.75 / 外野0.90（Statcast FRV, §7.2）。捕手は範囲=0で framing が主成分（監査B5）。
 */
function uzrRuns(ps, cfg, lc) {
  const pos = mainPosition(ps.fielding);
  const rpo = OUTFIELD.has(pos) ? cfg.tuning.field.runPerOutOutfield : cfg.tuning.field.runPerOutInfield;
  return centeredOAAOuts(ps, lc) * rpo + errRunsAboveAvg(ps, cfg, lc) + (ps.fielding.framingRuns || 0);
}


// ===== src/sim/team.mjs =====
// ============================================================================
// チーム編成（1-4a/b/d → フェーズA S1 で v2 化）— ロスターから編成表を組む
//
// buildDepthChart v2（§S1-3）:
//   守備配置:   positionRank（習熟×守備素材＋打撃考慮）の上位を難ポジ優先で割当。
//   打順:       アーキタイプ制。1番=OBP×俊足 / 2番=コンタクト・出塁 / 3番=最強総合 /
//               4番=最強パワー / 5番=次点パワー / 6-8番=残り降順 /
//               9番=DH無なら投手（プレースホルダ・S2が当日の先発を充填）/ DH有なら最弱野手。
//   ベンチ:     スタメン外野手の hitScore 降順（S2の代打/代走/守備固めの母集団）。
//   ローテ:     cfg.league.rotationSize 人（中6日=6人）。
//   ブルペン:   relieverScore 順に closer / setup8 / setup7 / middle[] / long（最下位）。
// ここは「編成の初期値」なので trueAbility を直接参照してよい（三層構造の原則。
// シーズン中の見直しは S3 usage.mjs が観測成績＋スカウトノイズで行う）。
// ============================================================================



/** 打撃スコア（総合打力。3番・DH・ベンチ序列に使用） */
function hitScore(p) {
  const b = p.trueAbility.batting;
  const c = p.trueAbility.common;
  return b.ev + b.contact + b.eye + c.power + b.la * 0.5;
}

/** 出塁スコア（eye重視。1-2番アーキタイプの選抜に使用・§S1-3） */
function obpScore(p) {
  const b = p.trueAbility.batting;
  return b.eye * 1.6 + b.contact + b.ev * 0.4;
}

/** パワースコア（4-5番アーキタイプの選抜に使用・§S1-3） */
function powerScore(p) {
  const b = p.trueAbility.batting;
  const c = p.trueAbility.common;
  return c.power * 1.2 + b.ev + b.la * 0.6;
}

/** 先発スコア（スタミナ主・§16。球種数も加点） */
function starterScore(p) {
  const pt = p.trueAbility.pitching;
  const whiff = pt.pitches.length ? pt.pitches.reduce((a, x) => a + x.whiff, 0) / pt.pitches.length : 40;
  return pt.stamina * 1.6 + pt.control + whiff + pt.pitches.length * 8 + (pt.velocityKmh - 140);
}

/** リリーフの質（クローザー/セットアッパー序列） */
function relieverScore(p) {
  const pt = p.trueAbility.pitching;
  const whiff = pt.pitches.length ? pt.pitches.reduce((a, x) => a + x.whiff, 0) / pt.pitches.length : 40;
  return whiff + pt.control + (pt.velocityKmh - 140) * 1.2;
}

/** ポジション候補スコア（習熟＋守備素材(Range)＋打撃考慮。重みは config.tuning.depth） */
function posRankScore(p, pos, cfg) {
  const d = cfg.tuning.depth;
  const prof = p.trueAbility.fielding.positionProf[pos];
  // hitScore(平均≈225)を 50 中心のレーティング相当へスケール（/4.5）して混合
  return prof + d.posToolW * (rangeRating(p, cfg) - 50) + d.posBatW * (hitScore(p) / 4.5 - 50);
}

/**
 * ロスターから編成表を作る（v2）。
 * @param {Array} roster
 * @param {Object} cfg createConfig() の設定（rotationSize / tuning.depth を参照）
 * @param {{dh?:boolean}} opts dh=false でDH無し打順（9番=投手プレースホルダ）。既定 true。
 *   ※S1では season 側は常に dh:true（DH規則=ホーム球団リーグの適用は S2 initSide v2）。
 * @returns {{lineup:Array<{playerId:?string,pos:string}>, defense:Object, bench:string[],
 *   positionRank:Object, rotation:string[], bullpen:string[], bullpenRoles:Object, byId:Map}}
 */
function buildDepthChart(roster, cfg, opts = {}) {
  const dh = opts.dh ?? true;
  const rotationSize = cfg.league.rotationSize;
  const pitchers = roster.filter((p) => p.role === 'pitcher');
  const fielders = roster.filter((p) => p.role === 'fielder');
  const byId = new Map(roster.map((p) => [p.id, p]));

  // positionRank: ポジションごとの候補ランキング（S3 usage.mjs の見直し対象の初期値）
  const positionRank = {};
  for (const pos of FIELD_POSITIONS) {
    positionRank[pos] = fielders
      .slice()
      .sort((a, b) => posRankScore(b, pos, cfg) - posRankScore(a, pos, cfg))
      .map((p) => p.id);
  }

  // 守備配置: 難ポジ優先（C→SS→CF→…）で positionRank 上位の未使用選手を割当
  const used = new Set();
  const defense = {};
  for (const pos of POSITION_DIFFICULTY) {
    const pid = positionRank[pos].find((id) => !used.has(id));
    used.add(pid);
    defense[pos] = pid;
  }

  // スタメン外の野手（hitScore降順）。DH有なら先頭がDH、残りがベンチ。
  const reserves = fielders.filter((f) => !used.has(f.id)).sort((a, b) => hitScore(b) - hitScore(a));
  const dhId = dh ? (reserves.length ? reserves[0].id : defense['1B']) : null;
  const bench = reserves.filter((f) => f.id !== dhId).map((f) => f.id);

  // --- 打順アーキタイプ（§S1-3） -------------------------------------------
  const pool = FIELD_POSITIONS.map((pos) => ({ playerId: defense[pos], pos }));
  if (dh && dhId) pool.push({ playerId: dhId, pos: 'DH' });
  const P = (e) => byId.get(e.playerId);
  const take = (scoreFn) => {
    let bi = -1;
    let bv = -Infinity;
    for (let i = 0; i < pool.length; i++) {
      const v = scoreFn(P(pool[i]));
      if (v > bv) {
        bv = v;
        bi = i;
      }
    }
    return pool.splice(bi, 1)[0];
  };

  const slots = new Array(9).fill(null);
  // 9番: DH無なら投手（当日の先発。S2 initSide v2 が playerId を充填）、DH有なら最弱野手
  slots[8] = dh ? take((p) => -hitScore(p)) : { playerId: null, pos: 'P' };
  slots[2] = take(hitScore); // 3番=最強総合
  slots[3] = take(powerScore); // 4番=最強パワー
  slots[4] = take(powerScore); // 5番=次点パワー
  slots[0] = take((p) => obpScore(p) + cfg.tuning.depth.leadoffSpeedW * (p.trueAbility.common.speed - 50)); // 1番=OBP×俊足
  slots[1] = take((p) => obpScore(p) + p.trueAbility.batting.contact); // 2番=コンタクト/出塁
  // 6-8番: 残りを hitScore 降順
  const rest = pool.slice().sort((a, b) => hitScore(P(b)) - hitScore(P(a)));
  slots[5] = rest[0];
  slots[6] = rest[1];
  slots[7] = rest[2];

  // --- ローテ＆ブルペン ------------------------------------------------------
  const sortedP = pitchers.slice().sort((a, b) => starterScore(b) - starterScore(a));
  const rotation = sortedP.slice(0, rotationSize).map((p) => p.id);
  const bullpen = sortedP
    .slice(rotationSize)
    .sort((a, b) => relieverScore(b) - relieverScore(a))
    .map((p) => p.id);
  // ブルペン役割（§S1-3）: relieverScore順に closer/setup8/setup7、long は最下位、残り middle
  const bullpenRoles = {
    closer: bullpen[0] ?? null,
    setup8: bullpen[1] ?? null,
    setup7: bullpen[2] ?? null,
    middle: bullpen.slice(3, Math.max(3, bullpen.length - 1)),
    long: bullpen.length >= 4 ? bullpen[bullpen.length - 1] : null,
  };

  return { lineup: slots, defense, bench, positionRank, rotation, bullpen, bullpenRoles, byId };
}


// ===== src/sim/game.mjs =====
// ============================================================================
// 試合状態機械（1-4c/e）— 9イニング/27アウト・塁状況・得点・投手交代・守備イニング計上
//
// 打席は 1-1(規律層)→1-2/1-3(打球)で解決。走者は簡易進塁ルールで動かす（UBRの精緻化は2-5）。
// 継投は「最小投球回起用」（§18）。SP勝敗は簡易判定（§18: 指標は近似）。
// 個人R(得点者)は保留、チーム得点(RS/RA)と投手失点のみ計上（§18・自己レビューF6）。
// ============================================================================









const MAX_INNINGS = 12; // NPB延長規定（超えたら引分）

/**
 * 走者を進める。bases=[1B,2B,3B]（playerId or null）。得点数を返し bases を破壊的更新。
 * @param {boolean} isAirOut アウトが空中打球（犠飛判定用）
 */
function advanceRunners(bases, result, batterId, isAirOut, outs, rng, cfg, ctx) {
  let runs = 0;
  const b1 = bases[0];
  const b2 = bases[1];
  const b3 = bases[2];

  if (result === 'BB' || result === 'HBP' || result === 'E') {
    // 押し出し（フォース）のみ。失策(E)も batter は一塁到達＝フォース進塁で近似
    if (b1) {
      if (b2) {
        if (b3) runs++; // 満塁押し出し
        bases[2] = b2;
      } else {
        bases[2] = b3; // 二塁が空なら三塁走者は残る
      }
      bases[1] = b1;
    } else {
      bases[1] = b2;
      bases[2] = b3;
    }
    bases[0] = batterId;
    return runs;
  }

  if (result === 'out') {
    // 犠飛: 空中アウト・2アウト未満・三塁走者 → 生還
    if (isAirOut && outs < 2 && b3) {
      runs++;
      bases[2] = null;
    }
    return runs; // それ以外は走者そのまま（併殺/進塁打は wGDP/UBR で後日）
  }

  if (result === '1B') {
    const nb = [null, null, null];
    if (b3) runs++; // 三塁は生還
    if (b2) {
      // 二塁走者の生還（走者Speed/IQ依存＝UBR, 2-5）
      if (resolveAdv(b2, cfg ? cfg.tuning.bb.singleScore2 : 0.55, ctx, cfg, rng)) runs++;
      else nb[2] = b2; // 三塁止まり
    }
    if (b1) nb[1] = b1; // 一塁→二塁（station to station）
    nb[0] = batterId; // 打者→一塁
    bases[0] = nb[0];
    bases[1] = nb[1];
    bases[2] = nb[2];
    return runs;
  }
  if (result === '2B') {
    const nb = [null, null, null];
    if (b3) runs++;
    if (b2) runs++;
    if (b1) {
      if (resolveAdv(b1, cfg ? cfg.tuning.bb.doubleScore1 : 0.45, ctx, cfg, rng)) runs++; // 一塁→生還
      else nb[2] = b1; // 三塁止まり
    }
    nb[1] = batterId; // 打者→二塁
    bases[0] = nb[0];
    bases[1] = nb[1];
    bases[2] = nb[2];
    return runs;
  }
  if (result === '3B') {
    if (b1) runs++;
    if (b2) runs++;
    if (b3) runs++;
    bases[0] = null;
    bases[1] = null;
    bases[2] = batterId;
    return runs;
  }
  if (result === 'HR') {
    if (b1) runs++;
    if (b2) runs++;
    if (b3) runs++;
    runs++; // 打者
    bases[0] = bases[1] = bases[2] = null;
    return runs;
  }
  return runs;
}

/**
 * 追加進塁（生還）の判定（§6 UBR, 2-5）。走者Speed/走塁IQで基準確率を上下し、
 * ctx があれば進塁機会(advOpp)と成否(advTaken)を走者に記録する。ctxなし=能力非依存（テスト互換）。
 */
function resolveAdv(pid, baseProb, ctx, cfg, rng) {
  let p = baseProb;
  if (ctx) {
    const t = ctx.byId.get(pid).trueAbility;
    const tool = (t.common.speed + t.baserunning.baserunIQ) / 2;
    p = clamp(baseProb + (tool - 50) * cfg.tuning.run.ubrSlope, 0.05, 0.95);
    const bs = ctx.statFor(pid, ctx.teamId).baserunning;
    bs.advOpp++;
    const took = (rng ? rng.next() : 1) < p;
    if (took) bs.advTaken++;
    return took;
  }
  return (rng ? rng.next() : 1) < baseProb;
}

/** 投球数の近似（除去判定用） */
function pitchesFor(outcome) {
  if (outcome === 'K') return 4.8;
  if (outcome === 'BB') return 5.2;
  if (outcome === 'HBP') return 3.5;
  return 3.6;
}

function baseBits(bases) {
  return (bases[0] ? 1 : 0) | (bases[1] ? 2 : 0) | (bases[2] ? 4 : 0);
}

/** 盗塁の試行・成否（§6 wSB）。走者Steal/Speed × 投手Hold × 捕手Arm。outs を返す。 */
function attemptSteal(batting, fielding, bases, outs, statFor, cfg, rng) {
  if (!bases[0] || bases[1]) return outs; // 一塁走者かつ二塁が空いている時のみ
  const runner = batting.byId.get(bases[0]);
  const s = cfg.tuning.steal;
  const br = runner.trueAbility.baserunning;
  const sp = runner.trueAbility.common.speed;

  // 試行判断: 走者のSteal/Speedが高いほど走る
  const aggr = expit(
    logit(s.attemptBase) + ratingDelta(br.steal, s.attemptSlope) + ratingDelta(sp, s.attemptSlope * 0.5),
  );
  if (rng.next() >= aggr) return outs;

  // 成功確率: 走者Steal/Speed↑、投手Hold↑・捕手Arm↑で↓
  const pitcher = fielding.byId.get(fielding.curPid);
  const catcher = fielding.byId.get(fielding.defense.C);
  const succ = expit(
    logit(s.successBase) +
      ratingDelta(br.steal, s.stealSlope) +
      ratingDelta(sp, s.stealSlope * 0.6) -
      ratingDelta(pitcher.trueAbility.pitching.hold, s.holdSlope) -
      ratingDelta(catcher ? catcher.trueAbility.common.arm : 50, s.armSlope),
  );

  const rStat = statFor(bases[0], batting.teamId);
  if (rng.next() < succ) {
    bases[1] = bases[0]; // 二塁へ
    bases[0] = null;
    rStat.batting.sb++;
  } else {
    bases[0] = null; // 盗塁死
    rStat.batting.cs++;
    // 盗塁死は投手在籍中の記録アウト＝投手IPに算入（監査A2: ΣpositionOuts==8·Σpitcher.outs を回復）。
    statFor(fielding.curPid, fielding.teamId).pitching.outs++;
    fielding.cur.outs++;
    return outs + 1;
  }
  return outs;
}

/**
 * 1試合をシミュレート。statFor(pid,teamId)=PlayerSeason を返す関数。
 * @param {Function} [onBattedBall] (batterId, teamId, battedBall, result) スプレー収集用（任意）
 */
function simulateGame(homeInit, awayInit, cfg, rng, statFor, park, onBattedBall) {
  const home = initSide(homeInit);
  const away = initSide(awayInit);

  // 得点推移ログ（勝敗の正確な判定用）: 得点が入るたびに両軍のスコアと現投手を記録
  const runLog = [];
  const recordRun = () =>
    runLog.push({ homeScore: home.score, awayScore: away.score, homePid: home.curPid, awayPid: away.curPid });

  let inning = 1;
  while (true) {
    playHalf(away, home, cfg, rng, statFor, park, false, onBattedBall, recordRun, inning); // 表: away攻撃
    if (inning >= 9 && home.score > away.score) break; // 裏を省略（ホームリード）
    const bottomWalkoff = inning >= 9;
    playHalf(home, away, cfg, rng, statFor, park, bottomWalkoff, onBattedBall, recordRun, inning); // 裏: home攻撃
    if (inning >= 9 && home.score !== away.score) break;
    inning++;
    if (inning > MAX_INNINGS) break;
  }

  flushPitcher(home, away.score);
  flushPitcher(away, home.score);
  assignDecisions(home, away, statFor, runLog);

  return { homeScore: home.score, awayScore: away.score, innings: inning, tie: home.score === away.score };
}

function initSide(init) {
  const d = init.depth;
  const starterId = d.rotation[init.starterIdx % d.rotation.length];
  const dhEntry = d.lineup.find((s) => s.pos === 'DH');
  return {
    teamId: init.teamId,
    byId: d.byId,
    order: d.lineup.map((s) => s.playerId),
    dhId: dhEntry ? dhEntry.playerId : null, // 守備に就かないDH（守備位置補正=-17.5の主語）
    defense: { ...d.defense },
    orderIdx: 0,
    starterId,
    closerId: d.bullpen.length ? d.bullpen[0] : null, // relieverScore最上位＝抑え（締め局面で固定起用・監査B2）
    curPid: starterId,
    used: new Set([starterId]),
    bullpen: d.bullpen.slice(),
    // enterDiff/enterInning: 登板時の投手側リード差と回（ホールド/BS判定・監査B3）
    cur: { pid: starterId, outs: 0, pitches: 0, runs: 0, bf: 0, enterDiff: 0, enterInning: 1 },
    log: [],
    score: 0,
  };
}

/** 半イニングを消化（batting=攻撃側, fielding=守備側） */
function playHalf(batting, fielding, cfg, rng, statFor, park, walkoff, onBattedBall, recordRun, inning) {
  // 継投(高レバレッジ): リード1-3の守備側に 8回=セットアッパー / 9回+=抑え を投入（監査B2/B3）。
  maybeBringLeverageReliever(fielding, batting.score, inning, statFor);
  const bases = [null, null, null];
  let outs = 0;
  let errorInInning = false; // 失策発生後の得点は非自責（§ERA整合）
  while (outs < 3) {
    // 盗塁機会（走者一塁・二塁空き）。§6 wSB。PA解決の前に処理。
    outs = attemptSteal(batting, fielding, bases, outs, statFor, cfg, rng);
    if (outs >= 3) break;

    const batterId = batting.order[batting.orderIdx];
    batting.orderIdx = (batting.orderIdx + 1) % 9;
    const batter = batting.byId.get(batterId);
    const pitcher = fielding.byId.get(fielding.curPid);

    const bStat = statFor(batterId, batting.teamId);
    const pStat = statFor(fielding.curPid, fielding.teamId);

    // 対戦巡目（この登板でこの投手が何度打線を通過したか。§3.3）
    const tto = Math.floor(fielding.cur.bf / 9);
    // 球種格子(§4段階1): この打席で投げる球種を1つ選ぶ
    const pitch = selectPitch(pitcher, rng, cfg);
    const outcome = resolvePADiscipline(batter, pitcher, cfg, rng, tto, pitch);
    const pc = pitchesFor(outcome);
    fielding.cur.pitches += pc;
    fielding.cur.bf++;
    pStat.pitching.pitches += Math.round(pc);
    pStat.pitching.bf++;
    bStat.batting.pa++;

    let result;
    let isAirOut = false;
    let bType = null;
    if (outcome === 'K') {
      result = 'out';
      bStat.batting.ab++;
      bStat.batting.so++;
      pStat.pitching.so++;
    } else if (outcome === 'BB') {
      result = 'BB';
      bStat.batting.bb++;
      pStat.pitching.bb++;
    } else if (outcome === 'HBP') {
      result = 'HBP';
      bStat.batting.hbp++;
      pStat.pitching.hbp++;
    } else {
      const bb = generateBattedBall(batter, pitcher, cfg, rng, { baseState: baseBits(bases), outs, tto, pitch });
      // 守備者個人のRangeを注入（2-7）: 担当ポジションの野手能力で被安打率を上下
      const r = resolveBattedBall(bb, cfg, rng, park, (pos) => {
        const fp = fielding.byId.get(fielding.defense[pos]);
        return fp ? rangeRating(fp, cfg) : 50;
      });
      result = r.result;
      bType = battedType(bb.laDeg);
      isAirOut = result === 'out' && bType !== 'GB';
      recordBattedBallStat(bStat, pStat, result);
      // 失策(ROE)判定: インプレーのアウトを Hands 依存で出塁に変える
      if (result === 'out') {
        const fPid = fielding.defense[r.fielderPos];
        const fielder = fielding.byId.get(fPid);
        const hands = fielder ? fielder.trueAbility.common.hands : 50;
        const pErr = clamp(cfg.tuning.bb.errBase - (hands - 50) * cfg.tuning.bb.errHandsW, 0.004, 0.06);
        if (rng.next() < pErr) {
          statFor(fPid, fielding.teamId).fielding.e++;
          errorInInning = true;
          result = 'E';
          isAirOut = false;
        }
      }
      // OAA累積: ポジション平均の期待アウトからの差分＝レンジ成分（§7.2）。
      // 失策前の r.result（アウト/安打）で判定＝OAAはリーグ平均0に中心化される。
      // 失策(Hands)は別成分（fielding.e→UZRで別途）として扱い、二重計上しない。
      const fielderPid = fielding.defense[r.fielderPos];
      if (fielderPid) {
        const actual = r.result === 'out' ? 1 : 0; // 失策前の判定: アウト=1, 安打=0
        statFor(fielderPid, fielding.teamId).fielding.oaaOuts += actual - r.expOut;
      }
      // スプレー収集（1-8, 任意）
      if (onBattedBall) onBattedBall(batterId, batting.teamId, bb, result);
    }

    // 対球種スプリット記録（§4段階1: 対ストレート成績等の素）
    if (pitch) {
      const sl = pitchClass(pitch.type) === 'fastball' ? bStat.batting.vsFastball : bStat.batting.vsBreaking;
      sl.pa++;
      if (outcome === 'BB') sl.bb++;
      else if (outcome !== 'HBP') {
        sl.ab++;
        if (outcome === 'K') sl.so++;
        else if (result === '1B' || result === '2B' || result === '3B' || result === 'HR') {
          sl.h++;
          if (result === 'HR') sl.hr++;
        }
      }
    }

    const ubrCtx = { byId: batting.byId, statFor, teamId: batting.teamId };
    const runs = advanceRunners(bases, result, batterId, isAirOut, outs, rng, cfg, ubrCtx);

    if (result === 'out') {
      if (isAirOut && runs > 0) {
        // 犠飛: ABを取り消してSF計上
        bStat.batting.ab--;
        bStat.batting.sf++;
      }
      const outsBefore = outs;
      outs++;
      fielding.cur.outs++;
      pStat.pitching.outs++;
      // 併殺（GB・走者一塁・2アウト未満）§6 wGDP。打者の足で回避。
      if (bType === 'GB' && bases[0] && outsBefore < 2) {
        bStat.baserunning.gdpOpp++;
        const gp = clamp(
          cfg.tuning.gdp.base - (batter.trueAbility.common.speed - 50) * cfg.tuning.gdp.speedW,
          0.02,
          0.45,
        );
        if (rng.next() < gp) {
          bases[0] = null; // 一塁走者もアウト
          bStat.batting.gdp++;
          outs++;
          fielding.cur.outs++;
          pStat.pitching.outs++;
        }
      }
    }
    if (runs > 0) {
      batting.score += runs;
      if (result !== 'E') bStat.batting.rbi += runs; // 失策の得点は打点なし
      pStat.pitching.r += runs;
      pStat.pitching.er += errorInInning ? 0 : runs; // 失策以降は非自責
      fielding.cur.runs += runs;
      if (recordRun) recordRun(); // 得点推移を記録（勝敗判定用）
    }

    maybeChangePitcher(fielding, statFor, batting.score, inning);

    if (walkoff && batting.score > fielding.score) break; // サヨナラ
  }

  // 守備イニング計上（守備側の8人に outs を加算）
  for (const pos of Object.keys(fielding.defense)) {
    statFor(fielding.defense[pos], fielding.teamId).fielding.positionOuts[pos] += outs;
  }
  // 捕手フレーミング（監査B5・§7.3）: 当該イニング分の (framing-50) をrun換算して framingRuns に加算。
  // 死蔵していた捕手フレーミング能力を守備価値としてWARに接続する。
  const cPid = fielding.defense.C;
  if (cPid) {
    const framing = fielding.byId.get(cPid).trueAbility.fielding.framing;
    statFor(cPid, fielding.teamId).fielding.framingRuns += (framing - 50) * cfg.tuning.field.framePerInning * (outs / 3);
  }
  // DHの出場イニング相当を計上（守備に就かないDHにも守備位置補正 -17.5/1350 を効かせる。
  // 攻撃側ハーフのアウト数＝そのイニング数分の在籍。§9・監査A1）。
  if (batting.dhId) {
    const dl = statFor(batting.dhId, batting.teamId).fielding.positionOuts;
    dl.DH = (dl.DH || 0) + outs;
  }
}

function recordBattedBallStat(bStat, pStat, result) {
  bStat.batting.ab++;
  if (result === 'out') return;
  bStat.batting.h++;
  pStat.pitching.h++;
  if (result === '1B') bStat.batting.b1++;
  else if (result === '2B') bStat.batting.b2++;
  else if (result === '3B') bStat.batting.b3++;
  else if (result === 'HR') {
    bStat.batting.hr++;
    pStat.pitching.hr++;
  }
}

/** 現投手を必要なら交代。先発は球数/失点ベースで好投時は完投まで届く（監査B4）。 */
function maybeChangePitcher(fielding, statFor, oppScore, inning) {
  const c = fielding.cur;
  const pitcher = fielding.byId.get(c.pid);
  const stamina = pitcher.trueAbility.pitching.stamina;
  const isStarter = c.pid === fielding.starterId;

  // B4: 一律21アウト上限を撤廃。球数(82+stamina*0.6)・失点・疲労で降板し、
  //     好投の高スタミナ先発は8-9回=完投/完封まで届く。
  const remove = isStarter
    ? c.pitches >= 82 + stamina * 0.6 || c.runs >= 6 || (c.outs >= 18 && c.runs >= 4)
    : c.outs >= 3 || c.runs >= 3;
  if (!remove) return;

  const lead = fielding.score - oppScore;
  const next = pickReliever(fielding, statFor, inning, lead);
  if (!next) return;

  flushPitcher(fielding, oppScore);
  fielding.curPid = next;
  fielding.used.add(next);
  fielding.cur = { pid: next, outs: 0, pitches: 0, runs: 0, bf: 0, enterDiff: lead, enterInning: inning };
}

/**
 * 高レバレッジ継投（監査B2/B3）: リード1-3の守備側に、9回+は抑え(closerId)、8回はセットアッパーを
 * 半イニング開始時に投入。締め投手を固定してセーブを集中させ、セットアッパーにホールドを生む。
 * 完封中の絶対的エース（自責0・21アウト以上）は続投を許し、稀な完投完封を残す。
 */
function maybeBringLeverageReliever(fielding, oppScore, inning, statFor) {
  if (inning == null || inning < 8) return;
  const lead = fielding.score - oppScore;
  if (lead < 1 || lead > 3) return; // 保護すべき僅差リードがない
  const c = fielding.cur;
  const isStarter = c.pid === fielding.starterId;
  if (isStarter && c.runs === 0 && c.outs >= 21) return; // 完封中のエースは続投
  const avail = fielding.bullpen.filter((pid) => !fielding.used.has(pid));
  if (!avail.length) return;
  const target = inning >= 9 ? avail[0] : avail.find((pid) => pid !== fielding.closerId) || avail[0];
  if (!target || target === c.pid) return;
  flushPitcher(fielding, oppScore);
  fielding.curPid = target;
  fielding.used.add(target);
  fielding.cur = { pid: target, outs: 0, pitches: 0, runs: 0, bf: 0, enterDiff: lead, enterInning: inning };
}

/** リリーバー選択（監査B2）: 締め局面は抑え/セットアッパーを固定、それ以外は投球回最少で負荷分散。 */
function pickReliever(fielding, statFor, inning, lead) {
  const avail = fielding.bullpen.filter((pid) => !fielding.used.has(pid));
  if (!avail.length) return null;
  if (lead >= 1 && lead <= 3 && inning != null) {
    if (inning >= 9) return avail[0]; // 抑え（relieverScore最上位の未使用）
    if (inning === 8) return avail.find((pid) => pid !== fielding.closerId) || avail[0]; // セットアッパー
  }
  let best = null;
  let bestOuts = Infinity;
  for (const pid of avail) {
    const s = statFor(pid, fielding.teamId);
    if (s.pitching.outs < bestOuts) {
      bestOuts = s.pitching.outs;
      best = pid;
    }
  }
  return best;
}

/** 現投手のゲーム成績を log に確定（bf>0の実登板のみ・幽霊リリーフ除外）。
 *  exitDiff=退場時の投手側リード差（ホールド/ブローンセーブ判定用・監査B3）。 */
function flushPitcher(side, oppScore) {
  if (side.cur.bf > 0) {
    side.cur.exitDiff = side.score - (oppScore ?? side.score);
    side.log.push({ ...side.cur });
  }
}

/**
 * 勝敗・セーブ（決勝点＝go-ahead run ベース。§18の簡易判定を精緻化）。
 * - 決勝点 = 勝者が最後にリードを取り以降維持した得点。
 * - 負け投手 = その決勝点を許した投手（敗者側の当時の投手）。
 * - 勝ち投手 = 決勝点時の勝者側の投手（先発は5回以上、さもなくば最多アウト救援）。
 * これにより「同点で降板」「リード継投」等で先発に無決着が自然に出る。
 */
function assignDecisions(home, away, statFor, runLog) {
  // 登板・先発は勝敗に関わらず付与（引分試合でも計上する。early-returnの前に置く）
  for (const side of [home, away]) {
    const seen = new Set();
    for (const ap of side.log) {
      if (seen.has(ap.pid)) continue;
      seen.add(ap.pid);
      const s = statFor(ap.pid, side.teamId);
      s.pitching.g++;
      if (ap.pid === side.starterId) s.pitching.gs++;
    }
  }

  // 完投・完封（監査B4）: そのチームの投手が先発1人のみで投げ切った＝完投。無失点なら完封。
  for (const side of [home, away]) {
    if (side.log.length === 1 && side.log[0].pid === side.starterId) {
      const s = statFor(side.starterId, side.teamId);
      s.pitching.cg++;
      if (side.log[0].runs === 0) s.pitching.sho++;
    }
  }

  if (home.score === away.score) return; // 引分は勝敗・セーブなし
  const homeWins = home.score > away.score;
  const winner = homeWins ? home : away;
  const loser = homeWins ? away : home;

  // 決勝点(go-ahead run)を特定: 勝者が「同点or負け」だった最後の得点イベントの、次の得点。
  const winSc = (e) => (homeWins ? e.homeScore : e.awayScore);
  const loseSc = (e) => (homeWins ? e.awayScore : e.homeScore);
  let goIdx = 0;
  for (let i = runLog.length - 1; i >= 0; i--) {
    if (winSc(runLog[i]) <= loseSc(runLog[i])) {
      goIdx = i + 1;
      break;
    }
  }
  const go = runLog[goIdx] || runLog[runLog.length - 1];

  // 負け投手 = 決勝点を許した敗者側の当時の投手
  const lossPid = homeWins ? go.awayPid : go.homePid;
  statFor(lossPid, loser.teamId).pitching.l++;

  // 勝ち投手 = 決勝点時の勝者側の投手（先発5回未満なら最多アウト救援）
  let wPid = homeWins ? go.homePid : go.awayPid;
  if (wPid === winner.starterId) {
    const st = winner.log.find((a) => a.pid === winner.starterId);
    if (!st || st.outs < 15) {
      let mx = -1;
      for (const a of winner.log) {
        if (a.pid === winner.starterId) continue;
        if (a.outs > mx) {
          mx = a.outs;
          wPid = a.pid;
        }
      }
    }
  }
  statFor(wPid, winner.teamId).pitching.w++;

  // セーブ: 3点差以内・最後に投げたリリーフ（勝ち投手と別）。抑え固定化(B2)でクローザーに集中。
  const last = winner.log[winner.log.length - 1];
  const margin = Math.abs(home.score - away.score);
  let savePid = null;
  if (last && last.pid !== wPid && margin <= 3 && last.outs >= 1) {
    statFor(last.pid, winner.teamId).pitching.sv++;
    savePid = last.pid;
  }

  // ホールド／ブローンセーブ（監査B3）: 救援の登板時/退場時リード差から判定。
  // リード1-3(セーブ機会)で7回以降に登板した救援が、リード保持で降板し勝ちでもセーブでもない→ホールド。
  // リードを吐き出して同点/逆転を許した→ブローンセーブ（敗退側・勝利側を問わず）。
  for (const side of [home, away]) {
    for (const ap of side.log) {
      if (ap.pid === side.starterId) continue; // 先発は対象外
      if (!(ap.enterDiff >= 1 && ap.enterDiff <= 3 && ap.enterInning >= 7)) continue; // セーブ機会で登板していない
      const s = statFor(ap.pid, side.teamId);
      if (ap.exitDiff <= 0) {
        s.pitching.bs++; // リードを吐き出した
      } else if (ap.pid !== wPid && ap.pid !== savePid && ap.outs >= 1) {
        s.pitching.hld++; // リード保持で降板
      }
    }
  }
}


// ===== src/sim/season.mjs =====
// ============================================================================
// 日程生成・シーズン実行・順位表（1-4a/f）
//
// 12球団総当たり: 各ペア13試合（うちホーム7/6）→ 各チーム143試合・リーグ858試合。
// ※S1は総当たり近似。リーグ内125＋交流戦18＋「節」カレンダーは S3 日程v2 で導入。
// 各試合は階層シードで独立・順序非依存に実行（並列化・再現の前提, §17/§19）。
// 先発は各チームの登板数 % rotationSize（中6日=6人）でローテを回す。
// ============================================================================






/**
 * 総当たり日程を生成（{home,away} のリスト）。
 * 対戦相手ごとの試合数 = round(gamesPerSeason / (球団数-1))。
 * 6球団×140 → 5相手×28、12球団×143 → 11相手×13。ホスト側はペアごとに交互（C-6均衡化）。
 */
function buildSchedule(teams, rng, gamesPerSeason) {
  const ids = teams.map((t) => t.id);
  const n = ids.length;
  const perPair = Math.round(gamesPerSeason / (n - 1));
  const games = [];
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const startHome = (i + j) % 2; // ペアごとにホスト開始を入替（低index偏りを解消）
      for (let k = 0; k < perPair; k++) {
        const iHosts = k % 2 === startHome;
        games.push(iHosts ? { home: ids[i], away: ids[j] } : { home: ids[j], away: ids[i] });
      }
    }
  }
  // 順序をシャッフル（同一チームの試合が偏らないように）
  for (let i = games.length - 1; i > 0; i--) {
    const j = rng.int(i + 1);
    const t = games[i];
    games[i] = games[j];
    games[j] = t;
  }
  return games;
}

/**
 * 1シーズンを実行。
 * @param {{teams:Array,players:Array,masterSeed:number}} league
 * @param {Object} cfg
 * @param {{season?:number, seed?:number, park?:Object}} opts
 * @returns {{season:number, standings:Array, playerSeasons:Array, statsById:Map, depthByTeam:Map}}
 */
function simulateSeason(league, cfg, opts = {}) {
  const season = opts.season ?? 2026;
  const seed = opts.seed ?? league.masterSeed ?? 20260701;
  const park = opts.park ?? NEUTRAL_PARK;

  // 編成表
  // TODO(S2): DH無し試合（L1主催）は initSide v2 で投手打席へ差し替える。S1では全試合DH打順で従来動作を維持。
  const depthByTeam = new Map();
  for (const t of league.teams) {
    const roster = league.players.filter((p) => p.teamId === t.id);
    depthByTeam.set(t.id, buildDepthChart(roster, cfg, { dh: true }));
  }

  // 集計器
  const stats = new Map();
  const statFor = (pid, teamId) => {
    let s = stats.get(pid);
    if (!s) {
      s = createPlayerSeason(pid, season);
      s.teamId = teamId;
      stats.set(pid, s);
    }
    return s;
  };
  const standings = new Map();
  for (const t of league.teams) standings.set(t.id, { ...createTeamSeason(t.id, season), name: t.name });

  // スプレー収集（§16, §17: 生イベントは最新シーズンのみ保持）。opts.collectSpray で有効化。
  const spray = opts.collectSpray ? new Map() : null;
  const capPerBatter = opts.sprayCap ?? 600;
  const onBattedBall = spray
    ? (batterId, teamId, bb, result) => {
        let arr = spray.get(batterId);
        if (!arr) {
          arr = [];
          spray.set(batterId, arr);
        }
        if (arr.length < capPerBatter) {
          arr.push({ sprayDeg: bb.sprayDeg, distanceM: bb.distanceM, laDeg: bb.laDeg, evKmh: bb.evKmh, result });
        }
      }
    : undefined;

  // 日程実行
  const schedule = buildSchedule(league.teams, makeRng(hashSeed(seed, 'schedule')), cfg.league.gamesPerSeason);
  const gameCount = new Map(league.teams.map((t) => [t.id, 0]));

  const rotationSize = cfg.league.rotationSize;
  schedule.forEach((g, gi) => {
    const rng = makeRng(hashSeed(seed, 'game', gi));
    const hGC = gameCount.get(g.home);
    const aGC = gameCount.get(g.away);
    const res = simulateGame(
      { teamId: g.home, depth: depthByTeam.get(g.home), starterIdx: hGC % rotationSize },
      { teamId: g.away, depth: depthByTeam.get(g.away), starterIdx: aGC % rotationSize },
      cfg,
      rng,
      statFor,
      park,
      onBattedBall,
    );
    gameCount.set(g.home, hGC + 1);
    gameCount.set(g.away, aGC + 1);

    const H = standings.get(g.home);
    const A = standings.get(g.away);
    H.g++;
    A.g++;
    H.rs += res.homeScore;
    H.ra += res.awayScore;
    A.rs += res.awayScore;
    A.ra += res.homeScore;
    if (res.tie) {
      H.t++;
      A.t++;
    } else if (res.homeScore > res.awayScore) {
      H.w++;
      A.l++;
    } else {
      A.w++;
      H.l++;
    }
  });

  const table = [...standings.values()].sort((a, b) => winPct(b) - winPct(a) || b.rs - b.ra - (a.rs - a.ra));
  return { season, standings: table, playerSeasons: [...stats.values()], statsById: stats, depthByTeam, spray };
}

/** 勝率（引分除く） */
function winPct(t) {
  const dec = t.w + t.l;
  return dec === 0 ? 0 : t.w / dec;
}


// ===== src/sim/leagueStats.mjs =====
// ============================================================================
// リーグ集計指標（1-7の一部・1-11較正で再利用）
// シーズン結果(playerSeasons + standings)から、レート指標を算出する。
// ============================================================================

/** リーグ打撃集計 */
function leagueBatting(playerSeasons) {
  const s = { pa: 0, ab: 0, h: 0, b1: 0, b2: 0, b3: 0, hr: 0, bb: 0, hbp: 0, so: 0, sf: 0 };
  for (const ps of playerSeasons) {
    const b = ps.batting;
    s.pa += b.pa; s.ab += b.ab; s.h += b.h; s.b1 += b.b1; s.b2 += b.b2; s.b3 += b.b3;
    s.hr += b.hr; s.bb += b.bb; s.hbp += b.hbp; s.so += b.so; s.sf += b.sf;
  }
  const tb = s.b1 + 2 * s.b2 + 3 * s.b3 + 4 * s.hr;
  const avg = s.ab ? s.h / s.ab : 0;
  const obp = s.ab + s.bb + s.hbp + s.sf ? (s.h + s.bb + s.hbp) / (s.ab + s.bb + s.hbp + s.sf) : 0;
  const slg = s.ab ? tb / s.ab : 0;
  const babipDen = s.ab - s.so - s.hr + s.sf;
  return {
    ...s,
    tb,
    avg,
    obp,
    slg,
    ops: obp + slg,
    iso: slg - avg,
    kPct: s.pa ? s.so / s.pa : 0,
    bbPct: s.pa ? s.bb / s.pa : 0,
    babip: babipDen ? (s.h - s.hr) / babipDen : 0,
  };
}

/** リーグ投手集計 */
function leaguePitching(playerSeasons) {
  const s = { outs: 0, bf: 0, h: 0, hr: 0, bb: 0, hbp: 0, so: 0, r: 0, er: 0 };
  for (const ps of playerSeasons) {
    const p = ps.pitching;
    s.outs += p.outs; s.bf += p.bf; s.h += p.h; s.hr += p.hr; s.bb += p.bb;
    s.hbp += p.hbp; s.so += p.so; s.r += p.r; s.er += p.er;
  }
  const ip = s.outs / 3;
  return { ...s, ip, era: ip ? (s.er / ip) * 9 : 0, whip: ip ? (s.h + s.bb) / ip : 0 };
}

/**
 * シーズン結果からリーグ全体のサマリを作る（較正の判定用）。
 * @param {{playerSeasons:Array, standings:Array}} res
 * @param {number} numTeams
 */
function leagueSummary(res, numTeams) {
  const bat = leagueBatting(res.playerSeasons);
  const pit = leaguePitching(res.playerSeasons);
  const totalRS = res.standings.reduce((a, t) => a + t.rs, 0);
  const totalG = res.standings.reduce((a, t) => a + t.g, 0); // = リーグ延べ試合数(=2×試合)
  const gamesPerTeam = totalG / numTeams;
  return {
    batting: bat,
    pitching: pit,
    hrPerTeam: bat.hr / numTeams,
    runsPerTeamPerGame: totalRS / numTeams / gamesPerTeam,
    gamesPerTeam,
  };
}


// ===== src/sim/leagueConstants.mjs =====
// ============================================================================
// リーグ定数導出パス（1-6 / 自己レビュー F2・F31・F46）
//
// 2パス構造: pass1 でシーズンを実走・集計 → 本モジュールでシムのラン環境から
// 線形ウェイト・lgwOBA・wOBAscale・FIP定数・RPW を導出 → pass2 で各指標を確定。
// §18 の 13.3/1.216 等は「初期値」であり、ここで 12球団143試合NPB環境へ再導出する。
// ============================================================================



// 各イベントの得点価値（アウト基準=0の線形ウェイト・runs単位）。FanGraphs標準の
// "runs above out" 系（wRAAが正しいラン単位になり、WARの絶対値が文献スケールに乗る・レビューB-2）。
// run-expectancy からの厳密導出は将来（コード自身の予告）。
const LINEAR_WEIGHTS = {
  bb: 0.55,
  hbp: 0.58,
  b1: 0.7,
  b2: 1.0,
  b3: 1.27,
  hr: 1.65,
};

/** 打撃イベント合計から「アウト基準の得点価値/打席」を出す（wOBAの素） */
function rawRunValuePerPA(bat, W = LINEAR_WEIGHTS) {
  const denom = bat.ab + bat.bb + bat.hbp + bat.sf;
  if (!denom) return 0;
  const num = W.bb * bat.bb + W.hbp * bat.hbp + W.b1 * bat.b1 + W.b2 * bat.b2 + W.b3 * bat.b3 + W.hr * bat.hr;
  return num / denom;
}

/**
 * シーズン結果からリーグ定数を導出。cfg.leagueConstants に相当する構造を返す。
 * @param {{playerSeasons:Array, standings:Array}} res
 */
function deriveLeagueConstants(res) {
  const bat = leagueBatting(res.playerSeasons);
  const pit = leaguePitching(res.playerSeasons);

  // --- wOBA 系（lgwOBA を lgOBP スケールへ正規化）---
  const lgRawPerPA = rawRunValuePerPA(bat); // アウト基準の得点価値/打席
  const lgOBP = bat.obp;
  const wobaScale = lgRawPerPA > 0 ? lgOBP / lgRawPerPA : 1; // wOBA = wobaScale × raw で lgwOBA=lgOBP
  const lgwOBA = lgOBP;

  // wRC+ 用: リーグの総得点/打席
  const totalRuns = res.standings.reduce((a, t) => a + t.rs, 0);
  const lgRunsPerPA = bat.pa ? totalRuns / bat.pa : 0;

  // --- FIP 定数（lgFIP を lgERA に一致させる）---
  const ip = pit.outs / 3;
  const fipRawLeague = ip ? (13 * pit.hr + 3 * (pit.bb + pit.hbp) - 2 * pit.so) / ip : 0;
  const lgERA = pit.era;
  const fipConstant = lgERA - fipRawLeague;
  const lgFIP = lgERA; // 定義上一致

  // --- RPW（Runs Per Win, Tango近似 1.5×RG+3。RG=1チーム1試合の得点）---
  const gamesPerTeam = res.standings.reduce((a, t) => a + t.g, 0) / res.standings.length;
  const runsPerGamePerTeam = gamesPerTeam ? totalRuns / res.standings.length / gamesPerTeam : 4.2;
  const rpw = 1.5 * runsPerGamePerTeam + 3;

  // 併殺リーグ率（wGDPの基準・§6）
  let totGDP = 0;
  let totGDPOpp = 0;
  for (const ps of res.playerSeasons) {
    totGDP += ps.batting.gdp;
    totGDPOpp += ps.baserunning.gdpOpp;
  }
  const lgGDPrate = totGDPOpp ? totGDP / totGDPOpp : 0;

  // 追加進塁リーグ率（UBRの基準・§6）
  let totAdv = 0;
  let totAdvOpp = 0;
  for (const ps of res.playerSeasons) {
    totAdv += ps.baserunning.advTaken;
    totAdvOpp += ps.baserunning.advOpp;
  }
  const lgAdvRate = totAdvOpp ? totAdv / totAdvOpp : 0;

  // wSB中心化の基準（監査C1・§6）: リーグの盗塁/盗塁死と、盗塁母数=一塁到達(1B+BB+HBP-IBB)。
  // metrics側で lgwSB = (ΣSB×runSB+ΣCS×runCS)/Σ機会 を作り、走者の機会分だけ基準控除する。
  let lgSB = 0;
  let lgCS = 0;
  let lgSBOpp = 0;
  for (const ps of res.playerSeasons) {
    const b = ps.batting;
    lgSB += b.sb;
    lgCS += b.cs;
    lgSBOpp += b.b1 + b.bb + b.hbp - b.ibb;
  }

  // ポジション別 OAA/イニング・失策/イニング 平均（UZRの範囲成分/失策成分を
  // 「そのポジションで守る選手の平均=0」に中心化するため。§7.2・監査A3）
  const posAgg = {};
  for (const ps of res.playerSeasons) {
    const inn = totalFieldInnings(ps.fielding);
    if (inn < 1) continue;
    const pos = mainPosition(ps.fielding);
    if (!posAgg[pos]) posAgg[pos] = { oaa: 0, inn: 0, err: 0 };
    posAgg[pos].oaa += ps.fielding.oaaOuts;
    posAgg[pos].inn += inn;
    posAgg[pos].err += ps.fielding.e || 0;
  }
  const oaaCenterPerInn = {};
  const errCenterPerInn = {};
  for (const pos of Object.keys(posAgg)) {
    oaaCenterPerInn[pos] = posAgg[pos].oaa / posAgg[pos].inn;
    errCenterPerInn[pos] = posAgg[pos].err / posAgg[pos].inn;
  }

  return {
    lgGDPrate,
    lgAdvRate,
    lgSB,
    lgCS,
    lgSBOpp,
    oaaCenterPerInn,
    errCenterPerInn,
    linearWeights: { ...LINEAR_WEIGHTS },
    lgRawPerPA,
    wobaScale,
    lgwOBA,
    lgOBP,
    lgRunsPerPA,
    lgERA,
    lgFIP,
    fipConstant,
    rpw,
    // WAR 用の位置補正は §9/positions の per-1350 値を使う（143試合再スケールはWAR算出2-9で）
  };
}

/** シーズンを走らせてから cfg.leagueConstants を埋める（2パスの糊） */
function fillLeagueConstants(cfg, res) {
  cfg.leagueConstants = { ...cfg.leagueConstants, ...deriveLeagueConstants(res) };
  return cfg.leagueConstants;
}


// ===== src/sim/metrics.mjs =====
// ============================================================================
// 選手別セイバー指標（1-7 / §5 §9）
// 生カウント(PlayerSeason)＋リーグ定数(1-6) から打撃・投手指標を算出する。
// 指標は「後付け」でなく、打席・打球のシミュレートの副産物である生カウントから湧く（付録原則1）。
// ============================================================================


const div = (a, b) => (b ? a / b : 0);

/** 打撃指標（wOBA/wRAA/wRC+ 含む） */
function playerBatting(ps, lc) {
  const b = ps.batting;
  const tb = b.b1 + 2 * b.b2 + 3 * b.b3 + 4 * b.hr;
  const avg = div(b.h, b.ab);
  const obp = div(b.h + b.bb + b.hbp, b.ab + b.bb + b.hbp + b.sf);
  const slg = div(tb, b.ab);
  const babip = div(b.h - b.hr, b.ab - b.so - b.hr + b.sf);

  const raw = rawRunValuePerPA(b, lc.linearWeights);
  const woba = lc.wobaScale ? lc.wobaScale * raw : 0;
  const wraa = (raw - (lc.lgRawPerPA || 0)) * b.pa;
  const wrcPlus =
    lc.lgRunsPerPA && b.pa ? ((wraa / b.pa + lc.lgRunsPerPA) / lc.lgRunsPerPA) * 100 : 100;

  return {
    pa: b.pa,
    ab: b.ab,
    h: b.h,
    hr: b.hr,
    rbi: b.rbi,
    sb: b.sb,
    bb: b.bb,
    so: b.so,
    avg,
    obp,
    slg,
    ops: obp + slg,
    iso: slg - avg,
    babip,
    kPct: div(b.so, b.pa),
    bbPct: div(b.bb, b.pa),
    woba,
    wraa,
    wrcPlus,
    tb,
  };
}

/**
 * 走塁指標（§6）。現状 wSB のみ実装（UBR/wGDPは2-5/2-6で追加）。
 * BsR = wSB + UBR + wGDP。
 */
function playerBaserunning(ps, cfg, lc) {
  const b = ps.batting;
  // wSB（監査C1）: リーグ基準 lgwSB×(一塁到達機会) を控除して中心化する。
  // 走らない選手は僅かに負の基準、盗塁者は正味加点というゼロ点になり、リーグwSB総和≈0。
  const sbOpp = (b.b1 || 0) + (b.bb || 0) + (b.hbp || 0) - (b.ibb || 0);
  const lgwSBrate =
    lc && lc.lgSBOpp ? (lc.lgSB * cfg.tuning.run.runSB + lc.lgCS * cfg.tuning.run.runCS) / lc.lgSBOpp : 0;
  const wSB = b.sb * cfg.tuning.run.runSB + b.cs * cfg.tuning.run.runCS - lgwSBrate * sbOpp;
  const br = ps.baserunning || {};
  // wGDP: 期待併殺(リーグ率×機会)より少なく併殺した分がプラス。§6
  const gdpOpp = br.gdpOpp || 0;
  const wGDP =
    lc && lc.lgGDPrate != null ? (lc.lgGDPrate * gdpOpp - (b.gdp || 0)) * Math.abs(cfg.tuning.gdp.runGDP) : 0;
  // UBR: 追加進塁を平均より多く取った分がプラス（走者Speed/IQ）。§6
  const advOpp = br.advOpp || 0;
  const ubr =
    lc && lc.lgAdvRate != null ? ((br.advTaken || 0) - lc.lgAdvRate * advOpp) * cfg.tuning.run.runUBR : 0;
  return {
    sb: b.sb,
    cs: b.cs,
    sbPct: b.sb + b.cs ? b.sb / (b.sb + b.cs) : 0,
    gdp: b.gdp,
    wSB,
    ubr,
    wGDP,
    bsr: wSB + ubr + wGDP,
  };
}

/** 投手指標（ERA/FIP 含む） */
function playerPitching(ps, lc) {
  const p = ps.pitching;
  const ip = p.outs / 3;
  const fipRaw = ip ? (13 * p.hr + 3 * (p.bb + p.hbp) - 2 * p.so) / ip : 0;
  return {
    g: p.g,
    gs: p.gs,
    ip,
    bf: p.bf,
    w: p.w,
    l: p.l,
    sv: p.sv,
    hld: p.hld,
    so: p.so,
    bb: p.bb,
    h: p.h,
    hr: p.hr,
    era: div(p.er * 9, ip),
    fip: ip ? fipRaw + (lc.fipConstant || 0) : 0,
    whip: div(p.h + p.bb, ip),
    kPer9: div(p.so * 9, ip),
    bbPer9: div(p.bb * 9, ip),
    kPct: div(p.so, p.bf),
    bbPct: div(p.bb, p.bf),
  };
}


// ===== src/sim/war.mjs =====
// ============================================================================
// WAR算出（2-9 / §9）— 企画の一番の売り「WARまで自然に出る」
//
// 野手WAR = (wRAA + BsR + UZR + posAdj + repl) / RPW
// 投手WAR = (IP/9 × (replFIP − FIP)) / RPW,  replFIP = lgFIP × replFipMult
//
// 各項はここまでの副産物（wRAA=1-7, BsR=2-4/2-6, UZR=2-8, posAdj=位置補正, repl=代替水準）。
// 位置価値は posAdj の一箇所のみで計上（UZR側で二重計上しない・レビューB-5）。
// 試合数依存定数(1350/600)は §18/M3 に従い config・143試合基準を尊重。
// ============================================================================




/** 守備位置補正（runs）。各ポジションの守備イニングに比例（§9・BR式 /1350）。 */
function posAdjRuns(ps) {
  let adj = 0;
  for (const pos of Object.keys(ps.fielding.positionOuts)) {
    const innings = ps.fielding.positionOuts[pos] / 3;
    adj += (POSITION_ADJUST_PER_1350[pos] || 0) * (innings / 1350);
  }
  return adj;
}

/** 野手WAR（構成要素つき） */
function hitterWAR(ps, cfg, lc) {
  const bat = playerBatting(ps, lc);
  const bsr = playerBaserunning(ps, cfg, lc).bsr;
  const uzr = uzrRuns(ps, cfg, lc);
  const posAdj = posAdjRuns(ps);
  const repl = (ps.batting.pa / 600) * cfg.tuning.replBatterPer600;
  const rpw = lc.rpw || 9.3;
  const raRuns = bat.wraa + bsr + uzr + posAdj + repl;
  return {
    wraa: bat.wraa,
    bsr,
    uzr,
    posAdj,
    repl,
    war: raRuns / rpw,
  };
}

/** 投手WAR */
function pitcherWAR(ps, cfg, lc) {
  const pit = playerPitching(ps, lc);
  const lgFIP = lc.lgFIP || 3.8;
  const replFIP = lgFIP * cfg.tuning.replFipMult;
  const rpw = lc.rpw || 9.3;
  const war = ((pit.ip / 9) * (replFIP - pit.fip)) / rpw;
  return { ip: pit.ip, fip: pit.fip, replFIP, war };
}

/** 選手のWAR（役割で分岐） */
function playerWAR(player, ps, cfg, lc) {
  return player.role === 'pitcher' ? pitcherWAR(ps, cfg, lc).war : hitterWAR(ps, cfg, lc).war;
}

function selfCheck(seed = 20260701, n = 8) {
  const rnd = mulberry32(seed);
  const out = [];
  for (let i = 0; i < n; i++) out.push(Math.round(rnd() * 1e9));
  return out;
}

        else if (k === 'ip' || k === 'inn') v = v.toFixed(1);
        else if (k === 'war') v = v.toFixed(1);
        else if (k === 'oaa' || k === 'uzr' || k === 'bsr') v = (v > 0 ? '+' : '') + v.toFixed(1);
        else if (!Number.isInteger(v)) v = v.toFixed(dec);
      }
      return td(v, align);
    })));
    wrap.append(el('table', { class: 'stat' }, [el('thead', {}, head), el('tbody', {}, rows)]));
  };
  state.sort = { key: defaultSort, dir: defaultSort === 'era' || defaultSort === 'fip' ? 1 : -1 };
  render();
  return wrap;
}

// --- 選手モーダル（能力バー＋スプレーチャート） ----------------------------
function openModal(playerId) {
  const p = state.byId.get(playerId);
  const s = state.res.statsById.get(playerId);
  if (!p || !s) return;
  const overlay = el('div', { class: 'overlay', onclick: (e) => { if (e.target === overlay) overlay.remove(); } });
  const box = el('div', { class: 'modal' });
  box.append(el('div', { class: 'modalhead' }, [
    el('div', {}, [el('span', { class: 'pname' }, p.name), el('span', { class: 'muted' }, `  ${state.teamName.get(p.teamId) || ''} / ${p.role === 'pitcher' ? '投手' : primaryPos(p)} / ${p.age}歳 / ${p.bats}打${p.throws}投`)]),
    el('button', { class: 'link', onclick: () => overlay.remove() }, '✕'),
  ]));

  // 成績サマリ
  if (p.role === 'pitcher') {
    const m = playerPitching(s, state.lc);
    const pw = pitcherWAR(s, state.cfg, state.lc);
    box.append(kv([['WAR', pw.war.toFixed(1)], ['登板', m.g], ['勝', m.w], ['敗', m.l], ['S', m.sv], ['投球回', m.ip.toFixed(1)], ['防御率', f2(m.era)], ['FIP', f2(m.fip)], ['奪三', m.so], ['K/9', f2(m.kPer9)]]));
  } else {
    const m = playerBatting(s, state.lc);
    box.append(kv([['打席', m.pa], ['打率', fmt3(m.avg)], ['本塁打', m.hr], ['打点', m.rbi], ['盗塁', m.sb], ['出塁', fmt3(m.obp)], ['長打', fmt3(m.slg)], ['OPS', fmt3(m.ops)], ['wOBA', fmt3(m.woba)], ['wRC+', m.wrcPlus.toFixed(0)]]));
    // WAR内訳（打/走/守/位）
    const w = hitterWAR(s, state.cfg, state.lc);
    box.append(el('div', { class: 'muted', style: 'margin-top:8px' }, `WAR ${w.war.toFixed(1)} 内訳`));
    box.append(kv([['打wRAA', w.wraa.toFixed(1)], ['走BsR', w.bsr.toFixed(1)], ['守UZR', w.uzr.toFixed(1)], ['位置', w.posAdj.toFixed(1)], ['OAA', centeredOAAOuts(s, state.lc).toFixed(1)]]));
    // 対球種成績（§4段階1）
    const vf = s.batting.vsFastball;
    const vb = s.batting.vsBreaking;
    const avgOf = (x) => (x.ab ? fmt3(x.h / x.ab) : '-');
    box.append(el('div', { class: 'muted', style: 'margin-top:8px' }, '対球種成績（打率 / 本）'));
    box.append(kv([['対速球', `${avgOf(vf)} / ${vf.hr}`], ['対変化球', `${avgOf(vb)} / ${vb.hr}`]]));
    // スプレーチャート
    const arr = state.res.spray && state.res.spray.get(playerId);
    if (arr && arr.length) box.append(el('div', { class: 'spraywrap' }, [el('div', { class: 'muted' }, `スプレーチャート（${arr.length}打球）`), sprayChart(arr)]));
  }

  // 能力バー
  box.append(el('div', { class: 'muted', style: 'margin-top:10px' }, '能力（真の実力）'));
  box.append(abilityBars(p.trueAbility, p.role));
  overlay.append(box);
  document.getElementById('app').append(overlay);
}

function kv(pairs) {
  return el('div', { class: 'kvgrid' }, pairs.map(([k, v]) => el('div', { class: 'kv' }, [el('div', { class: 'kvk' }, k), el('div', { class: 'kvv' }, String(v))])));
}

function abilityBars(t, role) {
  const groups = [];
  const bar = (label, val) => el('div', { class: 'barrow' }, [
    el('span', { class: 'barlabel' }, label),
    el('span', { class: 'bartrack' }, [el('span', { class: 'barfill', style: `width:${((val - 20) / 60) * 100}%;background:${barColor(val)}` })]),
    el('span', { class: 'barval' }, String(Math.round(val))),
  ]);
  const c = t.common;
  groups.push(section('共通', [bar('走力', c.speed), bar('肩', c.arm), bar('確実', c.hands), bar('反応', c.reaction), bar('パワー', c.power)]));
  if (role === 'pitcher') {
    const p = t.pitching;
    groups.push(section('投手', [bar('球速km/h', p.velocityKmh), bar('制球', p.control), bar('スタミナ', p.stamina), bar('ゴロ率', p.gbRate), bar('クイック', p.hold)]));
    groups.push(section('球種', p.pitches.map((pi) => bar(pitchName(pi.type), pi.current))));
  } else {
    const b = t.batting;
    groups.push(section('打撃', [bar('EV適性', b.ev), bar('LA適性', b.la), bar('引張', b.pull), bar('コンタクト', b.contact), bar('選球眼', b.eye)]));
    groups.push(section('走塁', [bar('盗塁技術', t.baserunning.steal), bar('走塁IQ', t.baserunning.baserunIQ)]));
    groups.push(section('守備', [bar('ポジIQ', t.fielding.positioningIQ), bar('捕手F', t.fielding.framing)]));
  }
  return el('div', { class: 'abilities' }, groups);
}
function section(title, bars) { return el('div', { class: 'abgroup' }, [el('div', { class: 'abtitle' }, title), ...bars]); }
function barColor(v) { return v >= 70 ? '#e8b84b' : v >= 55 ? '#7bc47f' : v >= 45 ? '#cfc8b0' : '#9a8f78'; }

// --- スプレーチャート SVG（1-8, Lv2）--------------------------------------
function sprayChart(balls) {
  const W = 320; const H = 300; const hx = W / 2; const hy = H - 24; const scale = (H - 40) / 135;
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, class: 'spray' });
  // 内野・外野の目安円 + フェンス弧
  const pt = (deg, dist) => {
    const r = (deg * Math.PI) / 180;
    return [hx + dist * scale * Math.sin(r), hy - dist * scale * Math.cos(r)];
  };
  // フェア地帯（ファウルライン ±45°）
  const [lx, ly] = pt(-45, 125); const [rx, ry] = pt(45, 125);
  svg.append(svgEl('path', { d: `M ${hx} ${hy} L ${lx} ${ly} A ${125 * scale} ${125 * scale} 0 0 1 ${rx} ${ry} Z`, fill: '#123d2a', stroke: '#2f6b4a' }));
  // 内野ダイヤ目安
  const [b2x, b2y] = pt(0, 38);
  svg.append(svgEl('circle', { cx: b2x, cy: b2y, r: 3, fill: '#c9a06a' }));
  // 打球ドット
  const color = (res) => res === 'HR' ? '#e8b84b' : res === '2B' || res === '3B' ? '#5aa9e6' : res === '1B' ? '#f4f1e6' : '#6d7f74';
  for (const b of balls) {
    const [x, y] = pt(b.sprayDeg, Math.min(b.distanceM, 130));
    svg.append(svgEl('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: b.result === 'HR' ? 3.2 : 2.2, fill: color(b.result), opacity: 0.85 }));
  }
  svg.append(svgEl('circle', { cx: hx, cy: hy, r: 3, fill: '#fff' }));
  return svg;
}

// --- 小物 -----------------------------------------------------------------
function td(v, align) { return el('td', { class: align || '' }, String(v)); }
function table(headers, rows) {
  return el('div', { class: 'tablewrap' }, [el('table', { class: 'stat' }, [
    el('thead', {}, el('tr', {}, headers.map((h) => el('th', {}, h)))),
    el('tbody', {}, rows),
  ])]);
}
function svgEl(tag, attrs) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k of Object.keys(attrs)) e.setAttribute(k, attrs[k]);
  return e;
}
function primaryPos(p) {
  if (!p || p.role === 'pitcher') return 'P';
  let mp = ''; let mx = -1;
  const pp = p.trueAbility.fielding.positionProf;
  for (const k of Object.keys(pp)) if (pp[k] > mx) { mx = pp[k]; mp = k; }
  return mp;
}
function pitchName(t) {
  return { fastball: '直球', slider: 'スラ', curve: 'カーブ', changeup: 'チェンジ', fork: 'フォーク', sinker: 'シンカー', cutter: 'カット' }[t] || t;
}

initApp();
</script>
