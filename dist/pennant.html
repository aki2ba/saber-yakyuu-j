const TEAM_ABBR = Object.fromEntries(TEAM_NAMES.map((n, i) => [n, TEAM_ABBRS[i]]));

function draw(rng, mean = 50, sd = 10) {
  return clampRating(rng.normal(mean, sd));
}

/** 完全架空の姓名を合成 */
function generateName(rng) {
  return SURNAMES[rng.int(SURNAMES.length)] + '　' + GIVEN[rng.int(GIVEN.length)];
}

/** 投手を1人生成 */
function generatePitcher(rng, id) {
  const velocityKmh = Math.round(clamp(rng.normal(146, 4.5), 130, 165)); // NPB先発平均~146
  const control = draw(rng, 50, 13); // S5較正: 分散を微拡大（平均不変）＝エース級FIPの裾→投手WAR王
  // （F2-5: 12→13。出場登録29人選抜でリーグ平均が上澄み化しエースの相対優位が圧縮→裾を再拡大）
  const stamina = draw(rng, 50, 12);

  // 球種数 2〜5（奪三振能力とは独立, §8.1）。fastball は必ず保有。
  const nPitches = 2 + rng.int(4);
  const pool = shuffle(rng, PITCH_TYPES.filter((t) => t !== 'fastball'));
  const types = ['fastball', ...pool.slice(0, nPitches - 1)];
  const pitches = types.map((t) =>
    createPitch(t, {
      current: draw(rng, 50, 10),
      whiff: draw(rng, 50, 15), // S5較正: 分散を微拡大（平均不変）＝奪三振の裾→投手WAR王（F2-5: 14→15・同上）
      hrSuppress: draw(rng, 50, 10),
      contactQuality: draw(rng, 50, 10), // 被コンタクト質の抑止（EV抑止に接続・A-9修正）
    }),
  );

  // §10.2 衰え相関: 速球高＆制球低 → 衰え速い（技巧派だけ長生き）。
  const declineRate = clamp(
    0.5 + (velocityKmh - 146) * 0.03 - (control - 50) * 0.012 + rng.normal(0, 0.15),
    0.1,
    1.3,
  );

  const t = createTrueAbility({
    common: {
      arm: draw(rng, 56, 9),
      speed: draw(rng, 42, 9),
      hands: draw(rng, 48, 9),
      reaction: draw(rng, 48, 9),
      power: draw(rng, 40, 8), // S5較正: 投手打席を実NPB水準（打率~.13）へ＝セパ得点差の門番
    },
    // 投手打撃は実NPB水準（AVG~.15 / K%~30 / 極低BB）へ。特に対球種適性を低く設定しないと
    // 既定50（球種に対し平均打者）のままK%が上がらずAVGが.21まで膨れ、セパ得点差が埋没する（レビュー#3）。
    // F2-5再較正: 出場登録29人選抜でDH枠の打者の質が上がりセパ得点差が帯上限(0.45)を超過
    //   → 投手打撃を僅かに底上げ（DH無リーグの得点を持ち上げ差を帯内へ）。rng消費数は不変（値のみ）。
    batting: {
      ev: draw(rng, 30, 6),
      la: draw(rng, 39, 6),
      contact: draw(rng, 31, 6),
      eye: draw(rng, 29, 6),
      vsFastball: draw(rng, 30, 6), // 対速球適性（低＝速球で三振を取られる）
      vsBreaking: draw(rng, 28, 6), // 対変化球適性
    },
    pitching: { velocityKmh, control, stamina, gbRate: draw(rng, 50, 12), hold: draw(rng, 50, 10), pitches },
    // §12.4: peakAge も能力タイプと相関させる（技巧＝制球高ほど後ろズレ／速球高ほど前ズレ）。
    //   乱数は base の rng.normal 一発のみ（既引きの velocityKmh/control で決定論シフト）＝生成の
    //   乱数列は不変＝1年目シム（既存50較正）に一切影響しない。晩成の“稀化/ゲート”を復活させる。
    career: {
      peakAge: Math.round(clamp(rng.normal(27, 2) + (control - 50) * 0.05 - (velocityKmh - 146) * 0.12, 23, 34)),
      declineRate,
    },
  });

  // R6: 潜在的な故障耐性（生涯不変の真値）。独立シード(id基準)で引き、メインの生成ストリームを
  //   一切消費しない＝既存リーグ生成は byte 不変（较正53指標に非干渉）。
  t.career.durability = clampRating(makeRng(hashSeed(id, 'durability')).normal(50, 10));
  return createPlayer({
    id,
    name: generateName(rng),
    role: 'pitcher',
    primaryPos: 'P',
    bats: rng.chance(0.3) ? 'L' : 'R',
    throws: rng.chance(0.28) ? 'L' : 'R',
    age: 18 + rng.int(20),
    trueAbility: t,
    scoutSeed: hashSeed(id, 'scout'),
  });
}

// ポジション別の打撃バイアス（守備難ポジは打撃控えめ＝現実の傾向。較正で微調整）
const POS_POWER_BIAS = { '1B': 8, RF: 6, LF: 6, '3B': 3, CF: 0, C: -2, '2B': -3, SS: -5 };

// ============================================================================
// ポジション別の走力・肩バイアス（一次データ由来）
// 正典: thyroxin/research/fielding_metrics_reference.md §14
//
// 旧実装は「CF/SS だけ速い、RF/C だけ強肩、残り全員フラット」という二値スイッチだった。
// 実データはそうなっていない（捕手は最も遅い／二塁手は三塁手より速い／一塁手・二塁手の肩は
// 三塁手より6〜9mphも弱い／コーナー外野は二塁手より速い）。
//
// レーティングへの写像: 1 rating pt = 選手個人の標準偏差の 0.1（＝σ=10 rating）。
//   走力: Baseball Savant 2024 (N=566・競争的走塁10回以上) を CSV から自己集計。
//         リーグ全体平均 27.30 ft/sec（公称27と一致＝集計の検算）、個人SD 1.36 ft/sec。
//         bias = (ポジション平均 − 27.30) / 1.36 × 10
//   肩:   Baseball Savant 2024 公表のポジション別平均（上位10%送球の平均）。
//         個人SD ≈ 6 mph（arm_overall 5.77 / max_arm 6.62 で挟んだ自己集計値）。
//         bias = (ポジション平均 − 7ポジ平均85.17) / 6.0 × 10
//
// draw の sd は「母集団sdを現行と一致させる値」と「実測の位置内SD」が独立に一致した:
//   走力 9.97 vs 実測位置内SD 6.1〜9.3 rating  → 10 を採用
//   肩   7.06 vs 実測位置内SD 6.7〜8.3 rating  → 7.1 を採用
// base は生成人数で重み付けした平均が現行値（走力50.70 / 肩52.44）になるよう定めた（較正の揺れを最小化）。
// ============================================================================
const SPEED_BASE = 49.58;
const SPEED_SD = 10;
// Savant 2024 ft/sec: CF 28.68 / SS 27.93 / LF 27.87 / RF 27.79 / 2B 27.61 / 3B 27.30 / 1B 26.32 / C 25.97
const POS_SPEED_BIAS = { CF: 10.1, SS: 4.6, LF: 4.2, RF: 3.6, '2B': 2.3, '3B': 0, '1B': -7.2, C: -9.8 };

const ARM_BASE = 51.28;
const ARM_SD = 7.1;
// Savant 2024 mph: CF 89.7 / RF 89.4 / LF 88.1 / SS 86.9 / 3B 85.7 / 2B 79.3 / 1B 77.1
// ⚠️捕手は Savant が Arm Strength から除外している（Pop Time で評価する）ため一次情報の平均が存在しない。
//   2017年のトップ捕手の max-effort 送球が 87〜88mph（＝外野平均と同水準）という二次情報しかないので、
//   RF と同値を「設計値」として置く。出典のある数値ではないことを明示する。
const POS_ARM_BIAS = { CF: 7.5, RF: 7.0, C: 7.0, LF: 4.9, SS: 2.9, '3B': 0.9, '2B': -9.8, '1B': -13.5 };

// 盗塁技術は走力と連続に結線する（旧実装は speed>55 で 46→55 と 9pt 跳ぶ階段関数で、
// speed 25 の選手と speed 54 の選手の盗塁技術が同じだった）。
// 傾き・切片・残差sdは、旧実装の周辺分布（平均48.85 / sd12.56 / steal~speed の回帰係数0.2636）を
// 保つよう定めた＝段差の撤廃だけを行い、新しい数値を発明しない。
const STEAL_BASE = 48.67;
const STEAL_PER_SPEED = 0.2636;
const STEAL_SD = 12.17;

/** 野手を1人生成（primaryPos を主守備位置に） */
function generateFielder(rng, id, primaryPos) {
  const speed = draw(rng, SPEED_BASE + (POS_SPEED_BIAS[primaryPos] ?? 0), SPEED_SD);
  const powerBias = POS_POWER_BIAS[primaryPos] ?? 0;
  const power = draw(rng, 50 + powerBias, 10); // S5較正: 打撃系sdを微圧縮（平均不変）＝5ツール重畳の
  // 外れ値が野手WAR王を9.5超へ押し上げるのを抑える（打率王/HR王の裾もこのsdで同時較正）

  // 守備習熟: 主ポジ高、他は低。ユーティリティは近隣に分散（§13）。
  const positionProf = {};
  for (const p of FIELD_POSITIONS) positionProf[p] = draw(rng, 24, 5);
  positionProf[primaryPos] = draw(rng, 60, 8);
  if (rng.chance(0.35)) {
    // ユーティリティ寄り: もう1ポジ育つ
    const alt = FIELD_POSITIONS[rng.int(FIELD_POSITIONS.length)];
    positionProf[alt] = Math.max(positionProf[alt], draw(rng, 48, 8));
  }

  const declineRate = clamp(0.5 + (speed - 50) * 0.012 + rng.normal(0, 0.15), 0.1, 1.3);

  const t = createTrueAbility({
    common: {
      speed,
      power,
      arm: draw(rng, ARM_BASE + (POS_ARM_BIAS[primaryPos] ?? 0), ARM_SD),
      hands: draw(rng, 50, 10),
      reaction: draw(rng, 50, 10),
    },
    batting: {
      ev: draw(rng, 50 + powerBias, 9.5),
      la: draw(rng, 50, 10),
      pull: draw(rng, 50, 12),
      contact: draw(rng, 50, 9.5),
      eye: draw(rng, 50, 9.5),
      vsFastball: draw(rng, 50, 11), // 対速球適性（§4段階1）
      vsBreaking: draw(rng, 50, 11), // 対変化球適性
    },
    fielding: {
      positionProf,
      positioningIQ: draw(rng, 50, 10),
      framing: primaryPos === 'C' ? draw(rng, 50, 10) : draw(rng, 30, 6),
    },
    baserunning: { steal: draw(rng, STEAL_BASE + (speed - 50) * STEAL_PER_SPEED, STEAL_SD), baserunIQ: draw(rng, 50, 10) },
    // §12.4: peakAge を能力タイプ相関で引く（走力系ほど前ズレ＝早熟／低走力の技巧・パワー型ほど
    //   後ろズレ）。乱数は base の rng.normal 一発のみ（既引きの speed で決定論シフト）＝生成の
    //   乱数列は不変＝1年目シム（既存50較正）に影響しない。晩成が“稀な少数テール”になるよう寄せる。
    career: {
      peakAge: Math.round(clamp(rng.normal(27, 2) - (speed - 50) * 0.06, 23, 34)),
      declineRate,
    },
  });

  // ブロッキング（§B1・捕手専用）: 独立シード(id基準)で引き、メインの生成ストリームを一切乱さない
  // （既存リーグ生成をバイト一致で保つ＝B1の変更を「一球シム化」だけに閉じる）。非捕手は既定50=WP/PB非関与。
  if (primaryPos === 'C') t.fielding.blocking = clampRating(makeRng(hashSeed(id, 'block')).normal(50, 10));

  t.career.durability = clampRating(makeRng(hashSeed(id, 'durability')).normal(50, 10)); // R6（同上・独立シード）
  return createPlayer({
    id,
    name: generateName(rng),
    role: 'fielder',
    primaryPos,
    bats: rng.chance(0.35) ? 'L' : rng.chance(0.08) ? 'S' : 'R',
    throws: rng.chance(0.15) ? 'L' : 'R',
    age: 18 + rng.int(20),
    trueAbility: t,
    scoutSeed: hashSeed(id, 'scout'),
  });
}

/**
 * 時代トレンド（D3・§11.3）の新人への反映（in-place・乱数非消費＝決定論）。
 * era.veloBump=平均球速の経年上昇（投手のみ）、era.cohortQuality=世代の波（ドラフト当たり/外れ年）を
 * 新人の主要レーティングへ加算する。boost=王朝均衡の弱球団再分配（team.balanceBoost・非負）。
 * era はプレーンデータ（game/era.mjs の computeEra 由来）＝ generate は game/ を import しない。
 * @param {Object} p 生成直後の新人（trueAbility を持つ）
 * @param {{veloBump?:number, cohortQuality?:number}} era 時代成分（省略時は無効果）
 * @param {number} boost 王朝均衡の追加 rating boost（>=0・省略時0）
 */
function applyEraToRookie(p, era = null, boost = 0) {
  const dRating = (era && era.cohortQuality ? era.cohortQuality : 0) + (boost || 0);
  const dVelo = era && era.veloBump ? era.veloBump : 0;
  if (!dRating && !dVelo) return p;
  const t = p.trueAbility;
  if (dVelo) t.pitching.velocityKmh = clamp(t.pitching.velocityKmh + dVelo, 130, 168);
  if (!dRating) return p;
  const bump = (obj, key) => { obj[key] = clampRating(obj[key] + dRating); };
  if (p.role === 'pitcher') {
    bump(t.pitching, 'control');
    bump(t.pitching, 'stamina');
    for (const pi of t.pitching.pitches) { bump(pi, 'current'); bump(pi, 'whiff'); }
  } else {
    for (const k of ['ev', 'la', 'contact', 'eye']) bump(t.batting, k);
    bump(t.common, 'power');
    bump(t.common, 'speed');
    bump(t.fielding.positionProf, p.primaryPos);
  }
  return p;
}

/**
 * 新人（ドラフト相当）を1人生成する（C2b 世代交代・§10.6）。
 * 既存の generatePitcher/generateFielder を id 基準の独立シードで駆動し、年齢だけを
 * 高卒/大卒相当（rookieAgeMin..Max）へ上書きする（生成の乱数列は消費済みで決定論・順序非依存）。
 * @param {number} seed ドラフト用の階層シード（hashSeed(masterSeed,'draft',yearIndex)）
 * @param {string} id 新人の一意ID（例 'T4Y3N0'）。live/replay で同一なら bit 一致
 * @param {{role:'pitcher'|'fielder', primaryPos:string, ageMin:number, ageMax:number, debutYear:number, era?:Object}} o
 *   era=時代トレンド成分（D3・§11.3）。指定時は生成後に球速の経年上昇/世代の波を反映（乱数非消費）。
 * @returns {Object} Player（teamId は呼び出し側で設定）
 */
function generateRookie(seed, id, { role, primaryPos, ageMin = 18, ageMax = 22, debutYear, era = null, cfg = null }) {
  const rng = makeRng(hashSeed(seed, id));
  const p = role === 'pitcher' ? generatePitcher(rng, id) : generateFielder(rng, id, primaryPos);
  // 新人は若い（栄冠的な伸びしろ＝成長ドリフトの母数）。generate 内部の age 抽選結果は
  // 独立シードで引き直して上書きする（メイン列の順序は乱さない＝決定論）。
  const aRng = makeRng(hashSeed(seed, id, 'age'));
  p.age = ageMin + aRng.int(Math.max(1, ageMax - ageMin + 1));
  p.birthSeason = debutYear != null ? debutYear - p.age : null;
  p.primaryPos = role === 'pitcher' ? 'P' : primaryPos;
  // 時代トレンド（D3）: 世代の波・球速の経年上昇を反映（王朝均衡の team boost は draft 割当後に別途）。
  // R2: era は「素質の波」なのでポテンシャルに効かせる＝ applyMaturity の **前** に適用する。
  if (era) applyEraToRookie(p, era, 0);
  // R2: 年齢確定後にポテンシャル→現在能力。これで高卒新人(18)は一軍平均を大きく下回り、
  //   数年かけて育つ（旧実装は新人がいきなりリーグ平均能力を持っていた＝「初期値ができすぎ」）。
  //   rookiePotentialLift（負値）は「ドラフトはプールの上澄みを選ぶ」ぶんの相殺（§下記）:
  //   球団は surplus 付きプールから自評価の最良を指名するため、指名された新人のポテンシャルは
  //   プール平均より高く出る。これを補正しないと毎年リーグへ「平均より強い個体」が注入され続け、
  //   多年で能力が単調インフレする（実測: 15年で一軍EV +1.5pt → SLG +0.03）。
  if (cfg) {
    const mk = cfg.tuning.market;
    // R7（決定1）: 高卒(refAge未満)ほど「期限付き未成熟負債」を積む。負債は applyAging が
    //   毎年 youthDebtRepayPerYear ずつ返済して0へ収束させる＝一時的な弱さ（恒久劣化ではない）。
    const youthDebt = -(mk.youthDebtPerYear ?? 0) * Math.max(0, (mk.youthDebtRefAge ?? 0) - p.age);
    p.trueAbility.career.youthDebt = youthDebt;
    applyMaturity(p, cfg, (mk.rookiePotentialLift ?? 0) + draftSkew(seed, id, cfg) + youthDebt);
  }
  return p;
}

/**
 * R7（決定2）: 新人の真値分布に右の歪みを入れる（現行=正規分布。現実=大多数が凡庸/少数の大当たり・
 * 97%がWAR5未満・§draft_timeline_evidence）。独立シードで駆動＝メイン生成列を乱さない（決定論）。
 * 期待値0で設計する（bustProb の確率で mean=-skewBustMag/2 の凡庸オフセット、残りは平均 starScale
 * ＝ p*m/(2*(1-p)) の指数裾「大当たり」オフセット）＝多年平均に系統ドリフトを起こさない。
 */
function draftSkew(seed, id, cfg) {
  const dk = cfg.tuning.market.draft;
  if (!dk?.skewBustProb) return 0;
  const r = makeRng(hashSeed(seed, id, 'skew'));
  const p = dk.skewBustProb;
  const m = dk.skewBustMag;
  if (r.chance(p)) return -m * r.next(); // 凡庸〜伸び悩み: uniform(-m, 0)
  const starScale = (p * m) / (2 * (1 - p)); // E[skew]=0 になるよう解析的に導出
  return -starScale * Math.log(1 - r.next()); // 大当たり: 指数裾（稀に大きく化ける）
}

// 1チームの守備位置配分（F2-1: 支配下70人＝投手33-36＋野手34-37）。
//   CORE=従来の一軍層20人（年齢は従来一様帯）／DEPTH=二軍層14人（若手厚め）／EXTRA=35-37人目の追加先。
//   合計で各ポジション最低4人（C4 1B4 2B4-5 3B4 SS5 LF4 CF5 RF4-5）＝一軍・二軍の両編成が同時に成立する。
const CORE_FIELDER_PLAN = [
  'C', 'C', 'C',
  '1B', '1B',
  '2B', '2B', '2B',
  '3B', '3B',
  'SS', 'SS', 'SS',
  'LF', 'LF',
  'CF', 'CF', 'CF',
  'RF', 'RF',
];
const DEPTH_FIELDER_PLAN = [
  'C',
  '1B', '1B',
  '2B',
  '3B', '3B',
  'SS', 'SS',
  'LF', 'LF',
  'CF', 'CF',
  'RF', 'RF',
];
const EXTRA_FIELDER_POS = ['C', '2B', 'RF']; // 野手35-37人目の追加ポジション（投手数の球団差ぶん）

/**
 * 重み付き年齢分布から年齢を1つ引く（R2・realism_r2_age_roster_spec §2-C）。
 * weights は {age: 相対重み}。決定論: 整数キーは昇順に走査される（JSのプロパティ順序仕様）。
 */
function drawAgeWeighted(rng, weights) {
  const ages = Object.keys(weights);
  let total = 0;
  for (const a of ages) total += weights[a];
  let u = rng.next() * total;
  for (const a of ages) {
    u -= weights[a];
    if (u <= 0) return Number(a);
  }
  return Number(ages[ages.length - 1]);
}

// ============================================================================
// R2 成熟度カーブ（realism_r2_age_roster_spec §2-A,B,D / §10.1）
//
// generatePitcher/generateFielder が引くのは **ポテンシャル（成長終端＝peak時の能力）** であり、
// 現在の能力ではない。applyMaturity が age まで aging と同一のカーブを適用して現在能力にする。
//   現在能力 = ポテンシャル + baseLift + survivorBonus(age) + maturityDelta(能力, age)
// これで「生成された28歳」と「18歳から育った28歳」が同分布になる（生成と加齢の内部整合）。
//
// 旧実装は age を能力と独立に引いていたため、18歳の平均能力＝30歳の平均能力（相関 r=0.012）で、
// 一軍登録の38%・規定到達者の36%が20歳以下という破綻を生んでいた（ユーザー報告「初期値ができすぎ」）。
// ============================================================================

/**
 * 1能力軸ぶんの成熟度デルタ（ポテンシャルからの差）。aging.curveDelta の逆積分＝同一カーブ。
 *   未成熟: 成長終端(growEnd)までの残り年数ぶん grow を引く（＝まだ伸びていない）
 *   衰え:   衰え開始(onset)から age までの decline を年ごとに積む（declineAccel の加速も同式で）
 * 成長係数 gm は生成時には未知なので 1（平均的な成長を辿った個体）と仮定する。
 */
function maturityDelta(prof, age, peak, dr, aging) {
  let d = 0;
  const growEnd = peak + prof.peakShift;
  if (age < growEnd) d -= prof.grow * (growEnd - age);
  const onset = peak + prof.declineOffset;
  for (let a = onset; a <= age - 1; a++) d -= prof.decline * dr * (1 + aging.declineAccel * (a - onset));
  return d;
}

/**
 * 生成された「ポテンシャル」を age 時点の「現在能力」へ変換する（in-place・乱数非消費・決定論）。
 * age を確定させた **後** に呼ぶこと（generateRookie は age を上書きするため順序が重要）。
 *
 * survivorBonus: 34歳で支配下に残っているのは「ポテンシャルが高かった個体」だけ（弱い個体は
 *   淘汰済み・§10.6 生存バイアス）。1年目リーグにその結果を織り込む。これが無いとベテランが
 *   「衰えただけの弱い選手」ばかりになり全員二軍に沈む（別の非現実）。
 * baseLift: 年齢構造の導入でロスターの平均能力が下がるぶんを戻す中心化（★較正の主ノブ）。
 *
 * 動かす能力の集合は aging.agePlayer と完全に同一（対称性＝生成と加齢が同じ関数であることの担保）。
 */
function applyMaturity(p, cfg, extraLift = 0) {
  const aging = cfg.tuning.aging;
  const M = cfg.tuning.maturity;
  const t = p.trueAbility;
  const age = p.age;
  const peak = t.career.peakAge;
  const dr = t.career.declineRate;
  const lift = M.baseLift + extraLift + Math.max(0, age - M.survivorFromAge) * M.survivorSlope;
  const profOf = (k) => aging.profiles[k] ?? aging.profiles.default;
  const put = (obj, key, profKey, extra = 0) => {
    obj[key] = clampRating(obj[key] + lift + extra + maturityDelta(profOf(profKey), age, peak, dr, aging));
  };
  // 長打だけの追加加点（R2較正・野手のみ）: power/ev は decline が最速の軸なので、一軍の高齢化で
  //   リーグ長打力だけが構造的に不足する。投手打撃には効かせない（セパ得点差の帯を動かさない）。
  const pw = p.role === 'fielder' ? M.powerLift : 0;

  for (const k of ['speed', 'arm', 'hands', 'reaction', 'power']) put(t.common, k, k, k === 'power' ? pw : 0);
  for (const k of ['ev', 'la', 'pull', 'contact', 'eye', 'vsFastball', 'vsBreaking']) put(t.batting, k, k, k === 'ev' ? pw : 0);

  // 投手（球速は km/h 実数＝別スケール。lift は veloPerRating で換算して写す）
  const pi = t.pitching;
  const v = aging.velo;
  pi.velocityKmh = clamp(
    pi.velocityKmh + lift * M.veloPerRating + maturityDelta(v, age, peak, dr, aging),
    v.min,
    v.max,
  );
  for (const k of ['control', 'stamina', 'gbRate', 'hold']) put(pi, k, k);
  for (const pitch of pi.pitches) {
    for (const k of ['current', 'whiff', 'hrSuppress', 'contactQuality']) put(pitch, k, 'pitchStuff');
  }

  // 守備・走塁
  put(t.fielding, 'positioningIQ', 'positioningIQ');
  put(t.fielding, 'framing', 'framing');
  if (t.fielding.blocking != null) put(t.fielding, 'blocking', 'blocking');
  for (const pos of Object.keys(t.fielding.positionProf)) put(t.fielding.positionProf, pos, 'positionProf');
  put(t.baserunning, 'steal', 'steal');
  put(t.baserunning, 'baserunIQ', 'baserunIQ');

  return p;
}

/**
 * 1チームの支配下ロスターを生成（F2-1: 70人＝投手33-36＋野手34-37）。
 * 投手数は rng で球団ごとに散らし、残りを野手に充てる（合計は cfg.tuning.roster.controlledPerTeam で恒常）。
 * 年齢は R2 の重み付き分布（roster.ageWeights・NPB実態の山型）から引き、確定後に applyMaturity で
 * 「ポテンシャル → その年齢での現在能力」へ変換する（＝若手は未成熟・ベテランは衰え＋生存バイアス）。
 */
function generateTeam(rng, teamId, cfg) {
  const R = cfg.tuning.roster;
  const nPitchers = R.pitchersMin + rng.int(R.pitchersMax - R.pitchersMin + 1);
  const nFielders = R.controlledPerTeam - nPitchers;
  const plan = CORE_FIELDER_PLAN.concat(DEPTH_FIELDER_PLAN);
  for (let i = plan.length; i < nFielders; i++) {
    plan.push(EXTRA_FIELDER_POS[(i - CORE_FIELDER_PLAN.length - DEPTH_FIELDER_PLAN.length) % EXTRA_FIELDER_POS.length]);
  }
  const roster = [];
  for (let i = 0; i < nPitchers; i++) {
    const p = generatePitcher(rng, `${teamId}P${i + 1}`);
    p.age = drawAgeWeighted(rng, R.ageWeights);
    roster.push(applyMaturity(p, cfg));
  }
  for (let i = 0; i < nFielders; i++) {
    const p = generateFielder(rng, `${teamId}F${i + 1}`, plan[i]);
    p.age = drawAgeWeighted(rng, R.ageWeights);
    roster.push(applyMaturity(p, cfg));
  }
  return roster;
}

/**
 * 球団の育成方針（devFocus 20-80）から育成選手の保有数を決める（F2-1・決定論の純関数）。
 * devCountMin..Max へ線形写像＝育成に厚い球団(ソフトバンク型)と薄い球団の個性が人数に出る。
 */
function devCountFor(devFocus, cfg) {
  const R = cfg.tuning.roster;
  const t = clamp((devFocus - 20) / 60, 0, 1);
  return Math.round(R.devCountMin + (R.devCountMax - R.devCountMin) * t);
}

/**
 * 1球団分の育成選手を生成する（F2-1・§12.1）。rosterStatus='minor' で league.farm に入る別枠。
 * 能力の生成分布は支配下と同一（観測が薄い・ノイズ大なのは既存 §12.1 の farm 観測枠組みが担う）。
 * 年齢は 18-24 中心（若手最厚）。id は `${teamId}D{n}`＝支配下(P/F)と衝突しない。
 */
function generateFarmPlayers(rng, teamId, count, cfg) {
  const R = cfg.tuning.roster;
  const list = [];
  for (let i = 0; i < count; i++) {
    const id = `${teamId}D${i + 1}`;
    const isPitcher = rng.chance(R.devPitcherShare);
    const p = isPitcher
      ? generatePitcher(rng, id)
      : generateFielder(rng, id, FIELD_POSITIONS[rng.int(FIELD_POSITIONS.length)]);
    p.age = drawAgeWeighted(rng, R.devAgeWeights); // 育成は支配下より若い（R2）
    p.rosterStatus = 'minor';
    p.teamId = teamId;
    list.push(applyMaturity(p, cfg)); // 年齢確定後にポテンシャル→現在能力（＝育成は未成熟な若手）
  }
  return list;
}

/**
 * 監督プロファイルを生成（S1・§S2/S3の采配判断が参照する「監督ポリシー」の個性）。
 * 20-80スケール(50=リーグ平均)。判断ロジック自体は src/sim/manager.mjs に置く（S2）。
 */
function generateManager(rng) {
  return {
    buntTend: draw(rng, 50, 12), // 犠打の好み（高いほどバントさせる）
    stealTend: draw(rng, 50, 12), // 盗塁の積極性
    ibbTend: draw(rng, 50, 12), // 敬遠の使い方
    quickHook: draw(rng, 50, 12), // 継投の早さ（高いほど早く投手を代える）
    devFocus: draw(rng, 50, 14), // 育成方針（F2-1・フロントの個性）: 高いほど育成選手を多く抱える（10-40人へ写像）
  };
}

/**
 * 球場ジオメトリの生偏差を1つ引く（D2 パークファクター・§11.2）。
 * 各偏差は平均0の対称分布（sizeSd/centerSd/asymSd/heightSd）。リーグ内ゼロサム中心化は
 * generateLeague 側で行い（球場分布の平均＝中立球場）、得点環境の据え置きを保証する。
 * 決定論: park専用RNG系列で引くこと（選手生成RNGを消費しない＝選手はD2前とbyte同一）。
 * @returns {{dSize:number, dCenter:number, dAsym:number, dHeight:number}}
 */
function generatePark(rng, cfg) {
  const P = cfg.tuning.park;
  return {
    dSize: rng.normal(0, P.sizeSd), // 球場全体の広狭（両翼＋中堅を一様に）
    dCenter: rng.normal(0, P.centerSd), // 中堅の独立偏差
    dAsym: rng.normal(0, P.asymSd), // 左右非対称（左翼 +dAsym / 右翼 −dAsym）
    dHeight: rng.normal(0, P.heightSd), // フェンス高
  };
}

/**
 * ゼロサム中心化済みの生偏差から球場オブジェクトを構築する（D2）。
 * @param {{dSize,dCenter,dAsym,dHeight}} dev リーグ平均を引いた（＝中心化済み）偏差
 * @param {string} name 完全架空の球場名（実在球場名は使わない・§11.2）
 */
function buildParkFromDeviations(dev, name, cfg) {
  const P = cfg.tuning.park;
  const lf = clamp(P.baseLine + dev.dSize + dev.dAsym, P.lineClampLo, P.lineClampHi);
  const rf = clamp(P.baseLine + dev.dSize - dev.dAsym, P.lineClampLo, P.lineClampHi);
  const center = clamp(P.baseCenter + dev.dSize + dev.dCenter, P.centerClampLo, P.centerClampHi);
  const height = clamp(P.baseHeight + dev.dHeight, P.heightClampLo, P.heightClampHi);
  return createBallpark({
    name,
    lineDistM: (lf + rf) / 2, // 代表値（表示・後方互換）
    lfLineM: lf,
    rfLineM: rf,
    centerDistM: center,
    gapDistM: (center + (lf + rf) / 2) / 2, // 中間の目安（表示用）
    fenceHeightM: height,
  });
}

/** 完全架空の球場名を球団名から合成（実在球場名は使わない・§11.2） */
function parkNameFor(teamName) {
  return `${teamName}スタジアム`;
}

/**
 * リーグ全体を生成。masterSeed＋階層シードで決定論・順序非依存。
 * 2リーグ制: 前半球団=leagues[0]（L1・DH無）、後半=leagues[1]（L2・DH有）。
 * @returns {{masterSeed:number, teams:Array, players:Array}}
 */
function generateLeague(masterSeed, config) {
  const numTeams = config.league.numTeams;
  const leagues = config.league.leagues ?? null;
  const perLeague = leagues ? Math.ceil(numTeams / leagues.length) : numTeams;

  // 1) 全チームのロスターを生成（チームシードで決定論・順序非依存）＋攻撃力を測る。
  const built = [];
  for (let ti = 0; ti < numTeams; ti++) {
    const teamId = `T${ti + 1}`;
    const trng = makeRng(hashSeed(masterSeed, 'team', ti));
    const roster = generateTeam(trng, teamId, config);
    for (const p of roster) p.teamId = teamId;
    const manager = generateManager(makeRng(hashSeed(masterSeed, 'manager', ti)));
    // 球場ジオメトリの生偏差（D2・§11.2）。park専用RNG系列＝選手/監督RNGを消費しない（選手はD2前とbyte同一）。
    const parkDev = generatePark(makeRng(hashSeed(masterSeed, 'park', ti)), config);
    // 育成選手（F2-1・§12.1）: 球団の育成方針(devFocus)で人数に差（10-40人）。専用RNG系列＝支配下と独立。
    const farm = generateFarmPlayers(
      makeRng(hashSeed(masterSeed, 'devroster', ti)),
      teamId,
      devCountFor(manager.devFocus, config),
      config,
    );
    // 攻撃力＝「一軍級の上位野手」のhitScore合計（F2-1: 全野手合計だと二軍層/育成の人数差で歪むため
    //   デプスチャートに乗る上位 offenseTopN 人で測る＝リーグ間の一軍攻撃力を均衡させる本来の目的に整合）。
    const topN = config.tuning.roster.offenseTopN;
    const offense = roster
      .filter((p) => p.role === 'fielder')
      .map((p) => hitScore(p))
      .sort((a, b) => b - a)
      .slice(0, topN)
      .reduce((a, v) => a + v, 0);
    built.push({ teamId, roster, farm, manager, offense, parkDev });
  }

  // 球場偏差をリーグ内でゼロサム中心化（D2）: 各偏差からリーグ平均を引き、球場分布の平均＝中立球場に
  //   する（リーグ全体の得点環境を据え置き＝PF平均≈100・§D2）。中心化は決定論（順序非依存の総和）。
  const nBuilt = built.length;
  const parkMean = { dSize: 0, dCenter: 0, dAsym: 0, dHeight: 0 };
  for (const t of built) for (const k of Object.keys(parkMean)) parkMean[k] += t.parkDev[k];
  for (const k of Object.keys(parkMean)) parkMean[k] /= nBuilt || 1;
  for (const t of built) {
    t.parkCentered = {
      dSize: t.parkDev.dSize - parkMean.dSize,
      dCenter: t.parkDev.dCenter - parkMean.dCenter,
      dAsym: t.parkDev.dAsym - parkMean.dAsym,
      dHeight: t.parkDev.dHeight - parkMean.dHeight,
    };
  }

  // 2) リーグ均衡割当（2リーグ×偶数のみ）: 攻撃力降順にグリーディで「総攻撃力が小さいリーグ」へ
  //    詰め、両リーグの野手攻撃を近づける。→ セ・パ得点差がDH効果だけを反映して安定する（競争均衡）。
  //    それ以外の構成は従来どおり前半L1/後半L2の連番割当。
  const leagueOf = new Map();
  if (leagues && leagues.length === 2 && numTeams % 2 === 0) {
    const half = numTeams / 2;
    const sums = [0, 0];
    const counts = [0, 0];
    for (const t of built.slice().sort((a, b) => b.offense - a.offense)) {
      let g;
      if (counts[0] >= half) g = 1;
      else if (counts[1] >= half) g = 0;
      else g = sums[0] <= sums[1] ? 0 : 1;
      leagueOf.set(t.teamId, g);
      sums[g] += t.offense;
      counts[g]++;
    }
  } else {
    built.forEach((t, ti) =>
      leagueOf.set(t.teamId, leagues ? Math.min(Math.floor(ti / perLeague), leagues.length - 1) : 0),
    );
  }

  // 3) teams配列を [L1..., L2...] 順（各リーグ内はチーム番号順）に並べ、名前を最終位置で付与。
  const ordered = leagues
    ? built.slice().sort((a, b) => leagueOf.get(a.teamId) - leagueOf.get(b.teamId))
    : built;
  const teams = [];
  const players = [];
  const farm = [];
  ordered.forEach((t, idx) => {
    const gi = leagueOf.get(t.teamId);
    const name = TEAM_NAMES[idx] ?? t.teamId;
    teams.push({
      id: t.teamId,
      name,
      league: leagues ? leagues[gi].id : null,
      manager: t.manager,
      // 本拠地球場（D2・§11.2）。ゼロサム中心化済み偏差から構築（完全架空名）。
      park: buildParkFromDeviations(t.parkCentered, parkNameFor(name), config),
      playerIds: t.roster.map((p) => p.id),
    });
    players.push(...t.roster);
    // 育成選手（F2-1）: league.players/team.playerIds と別枠の league.farm へ（既存 §12.1 farm 枠組み）。
    farm.push(...t.farm);
  });
  return { masterSeed, teams, players, farm };
}

/** Fisher–Yates（rng使用・決定論） */
function shuffle(rng, arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = rng.int(i + 1);
    const tmp = a[i];
    a[i] = a[j];
    a[j] = tmp;
  }
  return a;
}


// ===== src/sim/pitchGrid.mjs =====
// ============================================================================
// 球種格子 段階1（2-1/2-2 / §4）
// 1打席ごとに投手の球種を1つ選び、その球種の (whiff/hrSuppress/contactQuality) と
// 打者の (対速球/対変化球) 適性で解決する。これにより:
//   - 対ストレート成績が球種別ログの集計として湧く
//   - フォーク習得で開花（列が一本生える＝新しい優秀な球種の追加）
//   - 球種構成＝投手タイプ / 先発・リリーフ適性
// ============================================================================


/** その打席で投げる球種を1つ選ぶ（速球系を重く重み付け・legacy: 打席1回1球種の旧API） */
function selectPitch(pitcher, rng, cfg) {
  const pitches = pitcher.trueAbility.pitching.pitches;
  if (!pitches || pitches.length === 0) return null;
  const fw = cfg.tuning.pa.fastballWeight;
  let total = 0;
  for (const p of pitches) total += FASTBALL_TYPES.has(p.type) ? fw : 1;
  let r = rng.next() * total;
  for (const p of pitches) {
    r -= FASTBALL_TYPES.has(p.type) ? fw : 1;
    if (r <= 0) return p;
  }
  return pitches[pitches.length - 1];
}

/**
 * 一球ごとの球種選択（B1・§B1-1(a)）: (balls,strikes) 依存の重みで投手の球種構成から1球を選ぶ。
 *   - even/追い込み前 = 速球系を重く（fastballWeight）
 *   - 2ストライク（決め球）= whiff の高い球種ほど重く（putawayWhiffBias×(whiff-50)）
 *   - ビハインド（3ボール, 2-0）= 速球系をさらに重く（制球しやすい球・behindFastballBias）
 * 決定論: rng を1回だけ消費。使い捨てオブジェクトは作らない（重み合計→線形走査）。
 */
function selectPitchByCount(pitcher, rng, cfg, balls, strikes) {
  const pitches = pitcher.trueAbility.pitching.pitches;
  if (!pitches || pitches.length === 0) return null;
  if (pitches.length === 1) {
    rng.next(); // 乱数消費数をカウント状態に依存させない（決定論の安定化）
    return pitches[0];
  }
  const K = cfg.tuning.pitch;
  const behind = balls === 3 || (balls === 2 && strikes === 0);
  const putaway = strikes === 2;
  let total = 0;
  for (const p of pitches) {
    let w = FASTBALL_TYPES.has(p.type) ? K.fastballWeight : 1;
    if (behind && FASTBALL_TYPES.has(p.type)) w += K.behindFastballBias;
    if (putaway) w += K.putawayWhiffBias * Math.max(0, (p.whiff - 50) / 10); // 決め球=高whiff球種
    total += w;
  }
  let r = rng.next() * total;
  for (const p of pitches) {
    let w = FASTBALL_TYPES.has(p.type) ? K.fastballWeight : 1;
    if (behind && FASTBALL_TYPES.has(p.type)) w += K.behindFastballBias;
    if (putaway) w += K.putawayWhiffBias * Math.max(0, (p.whiff - 50) / 10);
    r -= w;
    if (r <= 0) return p;
  }
  return pitches[pitches.length - 1];
}


// ===== src/sim/battedBall.mjs =====
// ============================================================================
// 打球生成（1-2）— 2段パイプラインの第2段・前半（§3.2）
//
// IN_PLAY になった打席で、接触の瞬間に打球3要素を先に生成する:
//   EV（打球速度 km/h） = 打者EV適性 × 生体power × 投球の質（抑止）＋ノイズ
//   LA（打球角度 度）   = 打者LA適性 × 投手ゴロ率相性 ＋ノイズ
//   方向（spray 度）    = 打者引っ張り/流し（利き手で符号）＋ノイズ
// ここでは結果（安打/アウト）は決めない。落下点・結果は 1-3 が球場ジオメトリで導く。
//
// Phase1簡略（自己レビューF34）: 「投球の質」は集約スカラー、方向は打者傾向のみ
//   （×投球コースは球種格子 段階2まで保留）。球種別は 2-1 で差し替える。
// ============================================================================




/** 投手の被コンタクト質抑止（球種contactQualityの平均。高いほど強い打球を許さない） */
function meanContactSuppress(pit) {
  const arr = pit.pitches;
  if (!arr || arr.length === 0) return 50;
  let s = 0;
  for (const p of arr) s += p.contactQuality;
  return s / arr.length;
}

/**
 * 打球3要素を生成して BattedBall を返す（幾何・結果は null のまま）。
 */
function generateBattedBall(batter, pitcher, cfg, rng, ctx = {}) {
  const bb = cfg.tuning.bb;
  const bat = batter.trueAbility;
  const pit = pitcher.trueAbility.pitching;

  // EV: 打者EV適性＋power − 投手抑止(選択球種) − 被弾抑止(M3) ＋対クラス適性 ＋巡目 ＋ノイズ
  const tto = ctx.tto ?? 0;
  const pitch = ctx.pitch ?? null;
  const contactSup = pitch ? pitch.contactQuality : meanContactSuppress(pit);
  const hrSup = pitch ? pitch.hrSuppress : 50;
  const apt = pitch
    ? pitchClass(pitch.type) === 'fastball'
      ? bat.batting.vsFastball
      : bat.batting.vsBreaking
    : 50;
  // 左右プラトーン（S1・M7解消）: 同利き（スイッチは常に有利側）でEVの中心を下げる
  const pl = cfg.tuning.platoon;
  const platoonEv = pl && isSameHand(batter, pitcher) ? pl.evKmhSame : 0;
  const evMean =
    bb.evBase +
    bb.evPerEV * (bat.batting.ev - 50) +
    bb.evPerPower * (bat.common.power - 50) -
    bb.evPitchSuppress * (contactSup - 50) -
    bb.evHrSuppressW * (hrSup - 50) +
    bb.evAptW * (apt - 50) +
    tto * cfg.tuning.tto.evPerTime +
    platoonEv;
  const evKmh = Math.max(40, rng.normal(evMean, bb.evSd));

  // LA: 打者LA適性で中心シフト、投手ゴロ率で下げる ＋ノイズ
  const laMean = bb.laBase + bb.laPerLA * (bat.batting.la - 50) - bb.laPitchGB * (pit.gbRate - 50);
  const laDeg = rng.normal(laMean, bb.laSd);

  // 方向: pull適性で引っ張り側へ。右打ちは左方向(−)、左打ちは右方向(+)へ引っ張る。
  // スイッチ(S)は実効打席サイド（常に投手と逆＝有利側）で引っ張る（S1でM7の簡易扱いを解消）。
  const pullMag = bb.sprayPull * (bat.batting.pull - 50);
  const pullSign = effectiveBats(batter, pitcher) === 'L' ? +1 : -1;
  const sprayMean = pullSign * pullMag;
  let sprayDeg = rng.normal(sprayMean, bb.spraySd);
  if (sprayDeg < -50) sprayDeg = -50;
  if (sprayDeg > 50) sprayDeg = 50;

  const bb2 = createBattedBall({
    evKmh,
    laDeg,
    sprayDeg,
    pitchType: ctx.pitchType ?? null,
    batterId: batter.id,
    pitcherId: pitcher.id,
    baseState: ctx.baseState ?? 0,
    outs: ctx.outs ?? 0,
  });
  bb2.runnerSpeed = batter.trueAbility.common.speed; // 三塁打の脚力依存に使用（監査B1）
  return bb2;
}


// ===== src/sim/plateAppearance.mjs =====
// ============================================================================
// 打席解決の規律層（1-1）— 2段パイプラインの第1段（§3.1 / 自己レビュー F29）
//
// ここでは打者能力 vs 投手能力を log5/オッズ比で合成し、打席の分岐だけを決める:
//   { K(三振) / BB(四球) / HBP(死球) / IN_PLAY(インプレー=打球化) }
// 安打/アウト/長打は決めない。IN_PLAY は第2段(1-2/1-3 EV/LA→球場→守備)へ渡す。
// 「結果を先に決めてゾーンを後付け」を避け、決定権をこの1箇所に閉じる。
// ============================================================================







const PA_OUTCOME = { K: 'K', BB: 'BB', HBP: 'HBP', IN_PLAY: 'inPlay' };

/** 投手の平均空振り資質（球種whiffの平均）。球種未設定なら平均50。 */
function meanWhiff(pit) {
  const arr = pit.pitches;
  if (!arr || arr.length === 0) return 50;
  let s = 0;
  for (const p of arr) s += p.whiff;
  return s / arr.length;
}

/**
 * 打席の分岐確率（pK, pBB, pHBP）を log5 合成で算出。IN_PLAY は残余。
 * @returns {{pK:number, pBB:number, pHBP:number, pInPlay:number}}
 */
function paProbabilities(batter, pitcher, cfg, tto = 0, pitch = null) {
  const pa = cfg.tuning.pa;
  const b = batter.trueAbility.batting;
  const p = pitcher.trueAbility.pitching;

  // --- 左右プラトーン（S1・M7解消）: 同利き（スイッチは常に有利側=逆打席）で K↑ BB↓ ---
  const pl = cfg.tuning.platoon;
  const same = pl && isSameHand(batter, pitcher);

  // --- K: 打者のK傾向（コンタクト/選球眼＋対該当球種クラス適性）×投手の奪三振資質 ---
  // 球種格子(§4段階1): pitch があればその球種の whiff を使い、打者の対クラス適性で補正。
  const whiffVal = pitch ? pitch.whiff : meanWhiff(p);
  let aptAdj = 0;
  if (pitch) {
    const apt = pitchClass(pitch.type) === 'fastball' ? b.vsFastball : b.vsBreaking;
    aptAdj = pa.whiffAptW * (apt - 50); // 適性高い→Kしにくい
  }
  // 巡目(tto)が進むほど打者はK を回避しやすい（§3.3）。
  const kProne = 50 - pa.kContactW * (b.contact - 50) - pa.kEyeW * (b.eye - 50) - aptAdj;
  const kStuff = whiffVal + pa.kVeloPerKmh * (p.velocityKmh - 146);
  let pK = expit(
    logit(pa.kLeague) +
      ratingDelta(kProne, pa.kSlope) +
      ratingDelta(kStuff, pa.kSlope) -
      tto * cfg.tuning.tto.kPerTime +
      (same ? pl.kLogitSame : 0),
  );

  // --- BB: 打者選球眼（高→増）×投手制球（高→減） ---
  let pBB = expit(
    logit(pa.bbLeague) +
      ratingDelta(b.eye, pa.bbSlope) -
      ratingDelta(p.control, pa.bbSlope) +
      (same ? pl.bbLogitSame : 0),
  );

  // --- HBP: 小。投手制球が低いほどわずかに増 ---
  let pHBP = expit(logit(pa.hbpLeague) - ratingDelta(p.control, pa.hbpSlope));

  // 端の組み合わせで合計が1に近づき過ぎないようガード（IN_PLAY を最低限残す）
  const sum = pK + pBB + pHBP;
  const cap = 0.95;
  if (sum > cap) {
    const s = cap / sum;
    pK *= s;
    pBB *= s;
    pHBP *= s;
  }
  return { pK, pBB, pHBP, pInPlay: 1 - pK - pBB - pHBP };
}

/**
 * 打席の分岐を1回抽選（決定論・rng使用）。
 * @returns {'K'|'BB'|'HBP'|'inPlay'}
 */
function resolvePADiscipline(batter, pitcher, cfg, rng, tto = 0, pitch = null) {
  const { pK, pBB, pHBP } = paProbabilities(batter, pitcher, cfg, tto, pitch);
  const u = rng.next();
  if (u < pK) return PA_OUTCOME.K;
  if (u < pK + pBB) return PA_OUTCOME.BB;
  if (u < pK + pBB + pHBP) return PA_OUTCOME.HBP;
  return PA_OUTCOME.IN_PLAY;
}

// ============================================================================
// B1: (balls, strikes) カウント状態機械（§B1-1）
//
// 1打席を1球ずつ回し、3ストライク=K / 4ボール=BB / 死球=HBP / 接触=インプレー を「創発」させる。
// 各一球で pitches/swings/whiffs/fouls/calledStrikes/zone/oZone/…/ballsInDirt を打者・投手の
// 生カウントへ直接加算する（使い捨てオブジェクトを作らない・§B1-4 性能）。
// インプレーが出たら既存の generateBattedBall を呼ぶ（EV/LA/方向パイプラインは不変）。
// ============================================================================

// 走者塁状態のビット化（0..7）。game.mjs と同義（重複定義・importを増やさない）。
function baseBits(bases) {
  return (bases[0] ? 1 : 0) | (bases[1] ? 2 : 0) | (bases[2] ? 4 : 0);
}

/** ワンバウンド球が抜けた時の走者進塁（全員1つ・三塁は生還）。得点数を返し bases を破壊更新。 */
function advanceOnWildPitch(bases) {
  let runs = 0;
  if (bases[2]) { runs++; bases[2] = null; } // 三塁→生還
  if (bases[1]) { bases[2] = bases[1]; bases[1] = null; } // 二塁→三塁
  if (bases[0]) { bases[1] = bases[0]; bases[0] = null; } // 一塁→二塁
  return runs;
}

// 一球ごとに使い捨てオブジェクトを作らないための、単一の再利用結果構造体（単スレッド・即時消費）。
const PA_RESULT = {
  outcome: null, // 'K'|'BB'|'HBP'|'inPlay'
  battedBall: null, // インプレー時の BattedBall（それ以外 null）
  decisiveClass: null, // 決着球のクラス（'fastball'|'breaking'）＝対球種スプリット計上用
  pitches: 0, // この打席の投球数
  wpRuns: 0, // 打席中の暴投/捕逸で入った得点（打者の得点機会外・game側で加点）
  countBucket: 'even', // byCount 圧縮分類（ahead/even/behind）
  passed02: false, // 0-2 を通過したか
  passed30: false, // 3-0 を通過したか
};

/**
 * 1打席をカウント状態機械で解決する（§B1-1）。
 * @param {Object} env {batter,pitcher,catcher, cfg,rng, tto, bLine,pLine,cLine, bases, outs}
 *   bLine=打者 battingLine / pLine=投手 pitchingLine / cLine=捕手 fieldingLine(なければnull)
 *   bases=[1B,2B,3B]（暴投判定・インプレー塁状態に使う。WPで破壊更新されうる）
 * @returns {typeof PA_RESULT} 再利用構造体（呼び出し側は即座に読み出すこと）
 */
function runPlateAppearance(env) {
  const { batter, pitcher, catcher, cfg, rng, tto, bLine, pLine, cLine, bases } = env;
  // 観戦の一球速報フック（フェーズE2・§16）: 存在するときのみ各投球の確定点で
  // (n, 球種, 判定, ボール, ストライク, 暴投走者進塁, 帯band) を通知する。gc/onEvent と同じ流儀で
  // 乱数は一切消費しない＝onPitch の有無で打席結果・シーズン結果は不変（決定論の門番は verify）。
  // band はこの一球の既計算ロケーション帯（0=ゾーン内/1=ボーダー/2=明確ボール）＝UIコース図の実データ。
  const onPitch = env.onPitch ?? null;
  const K = cfg.tuning.pitch;
  const bat = batter.trueAbility;
  const pit = pitcher.trueAbility.pitching;
  const same = cfg.tuning.platoon && isSameHand(batter, pitcher);
  const framing = catcher ? catcher.trueAbility.fielding.framing : 50;
  const blocking = catcher ? (catcher.trueAbility.fielding.blocking ?? 50) : 50;

  let balls = 0;
  let strikes = 0;
  let nPitches = 0;
  let wpRuns = 0;
  let passed02 = false;
  let passed30 = false;
  let firstPitchStrike = false; // 初球がストライク(見逃し/空振り/ファウル/インプレー)なら true

  const R = PA_RESULT;
  R.outcome = null;
  R.battedBall = null;
  R.decisiveClass = null;
  R.wpRuns = 0;

  while (true) {
    if (balls === 0 && strikes === 2) passed02 = true;
    if (balls === 3 && strikes === 0) passed30 = true;

    // (a) 球種選択（カウント依存）
    const pitch = selectPitchByCount(pitcher, rng, cfg, balls, strikes);
    const cls = pitch ? pitchClass(pitch.type) : 'fastball';
    const ptype = pitch ? pitch.type : 'fastball'; // 一球速報の球種表示（E2・乱数非消費）
    const whiffVal = pitch ? pitch.whiff : 50;
    const apt = cls === 'fastball' ? bat.batting.vsFastball : bat.batting.vsBreaking;
    nPitches++;
    bLine.pitches++;
    pLine.pitches++;

    // (b) ロケーション帯: ゾーン内率 = f(control, カウント)
    let zone = K.zoneBase + K.zoneControlW * (pit.control - 50);
    if (strikes === 2 && balls < 2) zone += K.zoneAheadW; // 0-2,1-2 → ボールで釣る
    else if (balls === 3) zone += K.zoneBehindW; // 3-x → ゾーンへ置きにいく
    else if (balls === 2 && strikes === 0) zone += K.zoneBehindW * 0.6; // 2-0
    else if (balls > strikes) zone += K.zoneEvenBehindW; // 軽いビハインド
    zone = clamp(zone, 0.15, 0.85);
    const border = (1 - zone) * K.borderShare;
    const u1 = rng.next();
    const band = u1 < zone ? 0 : u1 < zone + border ? 1 : 2; // 0=ゾーン,1=ボーダー,2=明確ボール

    // 帯→ゾーン内/外の計上（0.9.1-pitchband・O-Swing%のFanGraphs定義整合）:
    //   ボーダー帯(band1)はゾーンの縁を跨ぐ帯（Statcastのshadow相当＝半分がゾーン内/半分がゾーン外）。
    //   旧実装は band1 をどちらにも計上せず、O-Swing%=「明確ボールのみのスイング率」に偏っていた。
    //   FanGraphs の O-Swing%（ゾーン外投球へのスイング率）へ近づけるため、際の半分をゾーン外として
    //   按分計上する（oZonePitches/oSwings/oWhiffs += 0.5）。Zone%（zonePitches）は「明確にゾーン内」
    //   の帯のみ＝従来定義のまま（目標帯[42,48]は不変）。両側(bLine/pLine)対称加算＝Σ恒等は保たれる。
    if (band === 0) { bLine.zonePitches++; pLine.zonePitches++; }
    else if (band === 1) { bLine.oZonePitches += 0.5; pLine.oZonePitches += 0.5; }
    else { bLine.oZonePitches++; pLine.oZonePitches++; }

    // (f) HBP: 明確ボール（内角外れ）の低確率イベント
    if (band === 2) {
      const pHbp = K.hbpPerClearBall * (1 + K.hbpControlW * (50 - pit.control));
      if (rng.next() < pHbp) {
        if (onPitch) onPitch(nPitches, ptype, 'hbp', balls, strikes, false, band);
        R.outcome = 'HBP'; R.decisiveClass = cls; break;
      }
    }

    // (c) スイング判断: Swing% = f(帯, eye, カウント)
    let pSwing;
    if (band === 0) pSwing = K.zSwingBase - K.swingZoneEyeW * (bat.batting.eye - 50);
    else if (band === 1) pSwing = K.bSwingBase - K.swingEyeW * (bat.batting.eye - 50);
    else pSwing = K.oSwingBase - K.swingEyeW * (bat.batting.eye - 50) + (same ? K.platoonOSwingSame : 0);
    if (strikes === 2) pSwing += K.twoStrikeSwingW; // 2ストライクの保護スイング
    if (balls === 3 && strikes === 0) pSwing -= K.threeOhTakeW; // 3-0は自重
    pSwing = clamp(pSwing, 0.01, 0.99);
    const swung = rng.next() < pSwing;

    if (swung) {
      bLine.swings++; pLine.swings++;
      if (band === 0) { bLine.zSwings++; pLine.zSwings++; }
      else if (band === 1) { bLine.oSwings += 0.5; pLine.oSwings += 0.5; } // 際=半分ゾーン外（按分・上記コメント）
      else { bLine.oSwings++; pLine.oSwings++; }
      // (d) 空振り率 = f(球種whiff, contact, 帯, 適性)
      const base = band === 0 ? K.whiffZoneBase : band === 1 ? K.whiffBorderBase : K.whiffOBase;
      let pWhiff =
        base +
        K.whiffPitchW * (whiffVal - 50) -
        K.whiffContactW * (bat.batting.contact - 50) -
        K.whiffAptW * (apt - 50) +
        (same ? K.platoonWhiffSame : 0) -
        tto * K.ttoWhiff;
      // 2ストライクの「当てにいく」短縮スイング＝空振り減・コンタクト増（ファウルで粘り→投球数増・§B1-3）。
      if (strikes === 2) pWhiff -= K.whiffTwoStrikeW;
      pWhiff = clamp(pWhiff, 0.01, 0.95);
      if (rng.next() < pWhiff) {
        bLine.whiffs++; pLine.whiffs++;
        if (band === 0) { bLine.zWhiffs++; pLine.zWhiffs++; }
        else if (band === 1) { bLine.oWhiffs += 0.5; pLine.oWhiffs += 0.5; } // 際=半分ゾーン外（按分）
        else { bLine.oWhiffs++; pLine.oWhiffs++; }
        if (nPitches === 1) firstPitchStrike = true;
        strikes++;
        if (onPitch) onPitch(nPitches, ptype, 'whiff', balls, strikes, false, band);
        if (strikes >= 3) { R.outcome = 'K'; R.decisiveClass = cls; break; }
      } else {
        // 接触: ファウル vs インプレー（2ストライクのファウルはカウント維持）
        let pFoul = K.foulBase + (strikes === 2 ? K.foulTwoStrikeW : 0);
        pFoul = clamp(pFoul, 0.05, 0.95);
        if (rng.next() < pFoul) {
          bLine.fouls++; pLine.fouls++;
          if (nPitches === 1) firstPitchStrike = true;
          if (strikes < 2) strikes++;
          if (onPitch) onPitch(nPitches, ptype, 'foul', balls, strikes, false, band);
        } else {
          // インプレー → 既存の打球パイプライン（不変）
          R.battedBall = generateBattedBall(batter, pitcher, cfg, rng, {
            baseState: baseBits(bases), outs: env.outs, tto, pitch,
          });
          R.outcome = 'inPlay';
          R.decisiveClass = cls;
          if (nPitches === 1) firstPitchStrike = true;
          if (onPitch) onPitch(nPitches, ptype, 'inplay', balls, strikes, false, band);
          break;
        }
      }
    } else {
      // (e) 見逃し: ゾーン内=ストライク / ボーダー=フレーミング判定 / 外=ボール
      if (band === 0) {
        bLine.calledStrikes++; pLine.calledStrikes++;
        if (nPitches === 1) firstPitchStrike = true;
        strikes++;
        if (onPitch) onPitch(nPitches, ptype, 'called', balls, strikes, false, band);
        if (strikes >= 3) { R.outcome = 'K'; R.decisiveClass = cls; break; }
      } else if (band === 1) {
        const pCS = clamp(K.borderCsBase + K.frameSlopePerPt * (framing - 50), 0.02, 0.98);
        const gotStrike = rng.next() < pCS;
        if (cLine) {
          const delta = (gotStrike ? 1 : 0) - K.borderCsBase; // 中立捕手(framing50)対比
          cLine.frameCalls += delta;
          cLine.framingRuns += delta * K.runPerCall; // per-inning近似の置換（§7.3）
        }
        if (gotStrike) {
          bLine.calledStrikes++; pLine.calledStrikes++;
          if (nPitches === 1) firstPitchStrike = true;
          strikes++;
          if (onPitch) onPitch(nPitches, ptype, 'called', balls, strikes, false, band);
          if (strikes >= 3) { R.outcome = 'K'; R.decisiveClass = cls; break; }
        } else {
          balls++;
          if (onPitch) onPitch(nPitches, ptype, 'ball', balls, strikes, false, band);
          if (balls >= 4) { R.outcome = 'BB'; R.decisiveClass = cls; break; }
        }
      } else {
        // 明確ボール: (g) ワンバウンド球×捕手blocking → 暴投/捕逸
        let wild = false; // 一球速報用（後逸で走者進塁したか・乱数非消費）
        if (cls === 'breaking' && rng.next() < K.dirtBaseBreaking) {
          bLine.ballsInDirt++; pLine.ballsInDirt++;
          if (bases[0] || bases[1] || bases[2]) {
            if (cLine) cLine.blockOpp++;
            const pPass = clamp(K.wildBase - K.blockSlopePerPt * (blocking - 50), 0.02, 0.9);
            if (rng.next() < pPass) {
              if (cLine) { if (rng.next() < K.wpShare) cLine.wp++; else cLine.pb++; }
              else rng.next(); // 捕手不在でも乱数消費数を一定に
              wpRuns += advanceOnWildPitch(bases);
              wild = true;
            }
          }
        }
        balls++;
        if (onPitch) onPitch(nPitches, ptype, 'ball', balls, strikes, wild, band);
        if (balls >= 4) { R.outcome = 'BB'; R.decisiveClass = cls; break; }
      }
    }
  }

  if (firstPitchStrike) { bLine.firstPitchStrikes++; pLine.firstPitchStrikes++; }
  R.pitches = nPitches;
  R.wpRuns = wpRuns;
  R.passed02 = passed02;
  R.passed30 = passed30;
  // byCount 圧縮分類（決着直前カウント balls vs strikes）
  R.countBucket = balls > strikes ? 'ahead' : balls < strikes ? 'behind' : 'even';
  return R;
}


// ===== src/sim/battedBallResult.mjs =====
// ============================================================================
// 打球結果解決（1-3）— 2段パイプラインの第2段・後半（§3.2）
//
// 打球3要素(EV/LA/方向)＋球場ジオメトリから落下点・滞空時間を出し、
//   - フェンス越え → HR
//   - それ以外 → Distance-Time モデルで各野手のアウト化確率を幾何から導き、
//     責任野手(argmax)のリーグ中立確率 pOut を期待アウト率とし、
//     責任野手"個人"の Smax で実際の抽選を行う
// を行う。expOut はリーグ中立（＝Statcast catch probability と同じ性質）。
// 個人の上手さは OAA(1-9) で "期待からの差分" として湧く。
//
// 【重要】打球種別ごとの安打率(旧 hitGB/hitLD/hitFB/hitPU)はもはやノブではない。
//   守備隊形と打球の幾何から創発する（鉄則4・正典§11.2）。
// ============================================================================





const G = 9.8;

/** 打球種別（角度で分類） */
function battedType(laDeg) {
  if (laDeg < 10) return 'GB'; // ゴロ（負角含む）
  if (laDeg < 25) return 'LD'; // ライナー
  if (laDeg <= 50) return 'FB'; // フライ
  return 'PU'; // ポップ
}

/** 飛距離・滞空・落下点を計算して bb に書き込む */
function computeGeometry(bb, cfg, park = NEUTRAL_PARK) {
  const v = bb.evKmh / 3.6; // m/s
  const laRad = (bb.laDeg * Math.PI) / 180;
  let distanceM;
  let hangTimeS;
  if (bb.laDeg <= 0) {
    // ゴロ: 地面を転がる想定。内野到達距離の目安のみ。
    distanceM = Math.max(0, ((v * v) / G) * 0.15);
    hangTimeS = 0;
  } else {
    // キャリー効率: 最適LA ~26°を中心に山（空気抵抗込みの現実近似。真空sin(2θ)より現実的）
    const lift = Math.exp(-Math.pow((bb.laDeg - 26) / 24, 2));
    distanceM = Math.max(0, cfg.tuning.bb.carry * ((v * v) / G) * lift);
    hangTimeS = (2 * v * Math.sin(laRad)) / G;
  }
  const sprayRad = (bb.sprayDeg * Math.PI) / 180;
  bb.distanceM = distanceM;
  bb.hangTimeS = hangTimeS;
  bb.landingX = distanceM * Math.sin(sprayRad);
  bb.landingY = distanceM * Math.cos(sprayRad);
  return bb;
}

/**
 * 落下点・打球種別から責任野手を決める（OAAの主語）。
 * Distance-Time モデルのリーグ中立 argmax（DRS の流儀・正典§9.2）。
 * 旧実装は spray角のみで1人に決め打ちしていた（正典§5.4 の根本原因）。
 */
function assignFielder(bb, type, cfg) {
  return neutralResponsible(bb, type, cfg).pos;
}

/**
 * 落下点・打球のロール線と外野守備隊形の位置関係（realism_r1_baserunning_spec §6・R1b改）。
 * - dNear: 落下点から最寄り外野手までのユークリッド距離
 * - beyond: 本塁からの落下距離が最寄り外野手の定位置より深い(正)か手前(負・0以下)か
 * - dPerpMin: 打球のロール線（spray方向の延長＝落下後にボールが転がっていく直線）に対する
 *   各外野手の垂線距離の最小値
 *
 * 【重要】前落ち球（beyond<=0）の単打/二塁打を分けるのは dNear ではなく dPerpMin。
 * 落下後のボールは外野手「に向かって」転がるため、ロール線上に野手がいれば（横ズレが小さければ）
 * どれだけ手前に落ちても必ずカットされ単打になる。二塁打になるのは横ズレの大きい真のギャップ/
 * ライン際だけ（旧: dNearで判定→「CF正面の手前15m」と「左中間の横15m」を同一視して
 * 正面の前落ちライナーが57%二塁打になる穴があった。ユーザー指摘で発覚）。
 */
function outfieldGeometry(bb, cfg) {
  const F = fielderPositions(cfg);
  const landR = Math.hypot(bb.landingX, bb.landingY);
  const ux = bb.landingX / landR; // ロール線の単位ベクトル（本塁→落下点方向）
  const uy = bb.landingY / landR;
  let dNear = Infinity;
  let r = 0;
  let dPerpMin = Infinity;
  for (const pos of FG_OUTFIELD) {
    const f = F[pos];
    const d = Math.hypot(bb.landingX - f.x, bb.landingY - f.y);
    if (d < dNear) { dNear = d; r = f.r; }
    const dPerp = Math.abs(f.x * uy - f.y * ux); // ロール線への垂線距離（外積の大きさ）
    if (dPerp < dPerpMin) dPerpMin = dPerp;
  }
  return { dNear, beyond: landR - r, dPerpMin };
}

/**
 * 安打種別を落下点と守備隊形から決める（realism_r1_baserunning_spec §6）。
 * ゴロ: ライン際×強い打球ほどコーナーまで転がり二塁打（さらに俊足なら三塁打）。
 * 空中球: 外野手到達圏(gapDistM)手前の前落ちは単打。それ以降は最寄り外野手との距離関係で
 *   前落ち単打帯（外野手の目の前/手前）・頭上を抜けても至近なら単打止まり・ギャップ/ライン際の
 *   二塁打化、をそれぞれ創発させる（旧実装は落下距離だけで無条件二塁打にしていた＝穴）。
 */
function decideBases(bb, type, cfg, rng) {
  const g = cfg.tuning.bb;
  const g2 = cfg.tuning.run2b;
  if (type === 'GB') {
    const pCorner =
      expit((Math.abs(bb.sprayDeg) - g2.gbLinePivotDeg) / g2.gbLineWidthDeg) *
      clamp(g2.gbEvBase + g2.gbEvW * (bb.evKmh - 140), 0.2, 1);
    if (rng.next() < pCorner) {
      if (Math.abs(bb.sprayDeg) > 40) {
        const speed = bb.runnerSpeed ?? 50;
        const pTriple = clamp(g2.gbTripleBase + (speed - 50) * g.tripleSpeedW, 0, 0.1);
        if (rng.next() < pTriple) return '3B';
      }
      return '2B';
    }
    return '1B';
  }
  // 外野手到達圏(gapDistM)手前に前落ちする空中安打は単打
  if (bb.distanceM < g.gapDistM) return '1B';
  const { dNear, beyond, dPerpMin } = outfieldGeometry(bb, cfg);
  let isDouble;
  if (beyond > 0) {
    // 頭上/後方を抜けた: 至近なら追いつかれて単打止まりになりうる
    const pStay1 = clamp(g2.behindStay1Base - g2.behindStay1DistW * dNear, 0, 0.5);
    isDouble = rng.next() >= pStay1;
  } else {
    // 前落ち: ボールはロール線に沿って外野手側へ転がる。ロール線への横ズレ(dPerpMin)が
    // 小さければカットされ単打（正面の前落ちは必ず単打）、大きければ真のギャップ/ライン際で
    // 転がり抜けて二塁打。浅く落ちるほど(frontM大)野手が収束する時間があり閾値が上がる。
    const frontM = -beyond;
    const pivot = g2.frontPerpPivotM + g2.frontDepthW * frontM;
    isDouble = rng.next() < expit((dPerpMin - pivot) / g2.frontPerpWidthM);
  }
  if (!isDouble) return '1B';
  // さらに深いギャップ/ライン際(|spray|>18)は打者speedで三塁打になりうる
  if (bb.distanceM >= g.tripleDistM && Math.abs(bb.sprayDeg) > 18) {
    const speed = bb.runnerSpeed ?? 50;
    const pTriple = clamp(g.tripleBase + (speed - 50) * g.tripleSpeedW, 0.02, 0.55);
    if (rng.next() < pTriple) return '3B';
  }
  return '2B';
}

/**
 * 塁打分布の"期待値"（rng抽選を伴わない decideBases の確率版・§B3a xBA/xSLG/xwOBA用）。
 * decideBases と同一の分岐条件を確率として返す（実結果の期待値＝モデルの塁打分布）。
 * @returns {{p1:number, p2:number, p3:number}} 安打を打った条件下での 1B/2B/3B 確率（Σ=1）
 */
function expectedBases(bb, type, cfg) {
  const g = cfg.tuning.bb;
  const g2 = cfg.tuning.run2b;
  if (type === 'GB') {
    const pCorner =
      expit((Math.abs(bb.sprayDeg) - g2.gbLinePivotDeg) / g2.gbLineWidthDeg) *
      clamp(g2.gbEvBase + g2.gbEvW * (bb.evKmh - 140), 0.2, 1);
    let p3 = 0;
    if (Math.abs(bb.sprayDeg) > 40) {
      const speed = bb.runnerSpeed ?? 50;
      p3 = pCorner * clamp(g2.gbTripleBase + (speed - 50) * g.tripleSpeedW, 0, 0.1);
    }
    return { p1: 1 - pCorner, p2: pCorner - p3, p3 };
  }
  if (bb.distanceM < g.gapDistM) return { p1: 1, p2: 0, p3: 0 };
  const { dNear, beyond, dPerpMin } = outfieldGeometry(bb, cfg);
  let pDouble;
  if (beyond > 0) {
    const pStay1 = clamp(g2.behindStay1Base - g2.behindStay1DistW * dNear, 0, 0.5);
    pDouble = 1 - pStay1;
  } else {
    const frontM = -beyond;
    const pivot = g2.frontPerpPivotM + g2.frontDepthW * frontM;
    pDouble = expit((dPerpMin - pivot) / g2.frontPerpWidthM);
  }
  let p3 = 0;
  if (bb.distanceM >= g.tripleDistM && Math.abs(bb.sprayDeg) > 18) {
    const speed = bb.runnerSpeed ?? 50;
    p3 = pDouble * clamp(g.tripleBase + (speed - 50) * g.tripleSpeedW, 0.02, 0.55);
  }
  return { p1: 1 - pDouble, p2: pDouble - p3, p3 };
}

/**
 * 打球を解決。bb.result と bb.fielderPos を確定し、要約を返す。
 * 追加(§B3a): 期待塁打分布 xB1/xB2/xB3/xHR（rng抽選前の防御中立=pHit基準の期待値）を返す。
 *   実結果とは独立の"期待値"であり、リーグ集計で xwOBA≈wOBA を恒等成立させる（副作用・rng消費なし）。
 * @returns {{result:string, type:string, expOut:number, fielderPos:string, distanceM:number,
 *   xB1:number, xB2:number, xB3:number, xHR:number}}
 */
/**
 * @param {Function} [fielderRangeFor] (pos) => Rangeレーティング(50=平均)。守備者個人の
 *   レンジで実効被安打率を上下させる（2-7）。省略時は50＝リーグ平均（Phase1互換）。
 */
function resolveBattedBall(bb, cfg, rng, park = NEUTRAL_PARK, fielderRangeFor) {
  computeGeometry(bb, cfg, park);
  const type = battedType(bb.laDeg);

  // --- HR判定（D1-1・§D1）: 適角のフライ/ライナーが「HR専用飛距離」でフェンスを越える ---
  // 幾何の distanceM（安打/長打の落下点用）とは別に、フェンス越え専用の飛距離 hrDist を明示化:
  //   hrDist = carry・(v²/g)・hrLift(適角ガウス;peak,conc)・evBoost(飽和ロジスティック;ref,width,gain)
  // 打者power/EV/最適LAへの依存を露わにする（v²＋evBoostで高EVほど非線形にHR化＝スラッガー書き分け）。
  // 既定は集中無効(gain=0・peak26/conc24=幾何lift一致)で baseline HR挙動を維持（D1調査: 集中は
  // out-of-sample の HR王 床を削るため／config §hrEvGain 参照）。総量(HR/team)は hrScale が門番。
  if ((type === 'FB' || type === 'LD') && bb.laDeg >= 15 && bb.laDeg <= 48) {
    const g = cfg.tuning.bb;
    // 実効フェンス距離（D2・§11.2）: 方向別のフェンス距離＋フェンス高ペナルティ。高い壁ほどHRに要する
    //   飛距離が増える（中立4mは差0＝baseline不変）。狭い翼/低い壁の球場で「同じ打球がHRに」なる。
    const fence =
      fenceDistanceAt(bb.sprayDeg, park) +
      g.hrFenceHeightW * ((park.fenceHeightM ?? g.hrFenceHeightBase) - g.hrFenceHeightBase);
    const v = bb.evKmh / 3.6; // m/s
    const hrLift = Math.exp(-Math.pow((bb.laDeg - g.hrLaPeak) / g.hrLaConcentration, 2)); // 適角へ狭く集中
    // 飽和EVブースト: よく捉えた球(EV>hrEvRef)へ上限 hrEvGain までのHR飛距離ボーナス（怪物の暴走を抑える）
    const evBoost = 1 + g.hrEvGain / (1 + Math.exp(-(bb.evKmh - g.hrEvRef) / g.hrEvWidth));
    const hrDist = g.carry * ((v * v) / G) * hrLift * evBoost;
    if (hrDist * cfg.tuning.hrScale >= fence) {
      bb.fielderPos = assignFielder(bb, type, cfg);
      bb.result = 'HR';
      return { result: 'HR', type, expOut: 0, fielderPos: bb.fielderPos, airCatch: false, distanceM: bb.distanceM, xB1: 0, xB2: 0, xB3: 0, xHR: 1 };
    }
  }

  // --- インプレー: Distance-Time モデルで各野手のアウト化確率を出し、責任野手を決める ---
  // 各野手の「必要走速度」「送球アウト確率」は野手の能力を含まない（＝Statcast catch probability）。
  const { reqSpeed, pThrow, gbAir } = fieldingChances(bb, type, cfg);
  const smaxBase = cfg.tuning.field.smaxBase;

  // 責任野手 = リーグ中立 p の argmax（DRS の流儀・正典§9.2）。
  // 全員 p≈0（誰にも捕れない打球）なら「最も惜しかった」＝必要走速度が最小の野手。
  let fielderPos = null;
  let pOut = -1;
  let bestReq = Infinity;
  for (const pos of FIELD_POS) {
    const p = outProb(reqSpeed[pos], pThrow[pos], smaxBase, cfg);
    if (p > pOut + 1e-12 || (Math.abs(p - pOut) <= 1e-12 && reqSpeed[pos] < bestReq)) {
      pOut = p;
      bestReq = reqSpeed[pos];
      fielderPos = pos;
    }
  }
  if (fielderPos == null) fielderPos = type === 'GB' ? 'SS' : 'CF';
  bb.fielderPos = fielderPos;

  const expOut = clamp(Math.max(0, pOut), 0, 1); // リーグ中立の期待アウト（OAAのベースライン）
  const pHit = 1 - expOut;

  // 期待塁打分布（§B3a）: 防御中立の pHit × decideBases 確率版。rng を消費しない（決定論不変）。
  const eb = expectedBases(bb, type, cfg);
  const xB1 = pHit * eb.p1;
  const xB2 = pHit * eb.p2;
  const xB3 = pHit * eb.p3;

  // 実際の抽選は責任野手"個人"の Smax で行う（OAAの個人シグナル源）。
  // 難しいプレー（p≈0.5）でのみ巧拙が大きく効き、凡プレー/絶望的な打球では効きにくい
  // ＝ロジスティックの性質から自動的に導かれる（旧 rangeLogitSlope の人為的近似は不要）。
  const rangeR = fielderRangeFor ? fielderRangeFor(fielderPos) : 50;
  const effPOut = clamp(outProb(reqSpeed[fielderPos], pThrow[fielderPos], smaxOf(rangeR, cfg), cfg), 0.005, 0.995);
  const effPHit = 1 - effPOut;

  if (rng.next() >= effPHit) {
    bb.result = 'out';
    // airCatch: GB分類(LA<10°)だが初バウンド前に迎撃＝実質ライナー捕球（記録上は「直」・
    // 走者はゴロ意味論でなく帰塁。realism検証 2026-07-12 で「痛烈な内野ライナーが全て
    // ゴロ表記になっている」穴として発覚。統計上の打球分類(bbGB)はStatcast準拠のLA閾値のまま）
    const airCatch = type === 'GB' && !!(gbAir && gbAir[fielderPos]);
    return { result: 'out', type, expOut, fielderPos, airCatch, distanceM: bb.distanceM, xB1, xB2, xB3, xHR: 0 };
  }
  const base = decideBases(bb, type, cfg, rng);
  bb.result = base;
  return { result: base, type, expOut, fielderPos, airCatch: false, distanceM: bb.distanceM, xB1, xB2, xB3, xHR: 0 };
}


// ===== src/sim/leagueStats.mjs =====
// ============================================================================
// リーグ集計指標（1-7の一部・1-11較正で再利用）
// シーズン結果(playerSeasons + standings)から、レート指標を算出する。
// ============================================================================

/** リーグ打撃集計 */
function leagueBatting(playerSeasons) {
  const s = { pa: 0, ab: 0, h: 0, b1: 0, b2: 0, b3: 0, hr: 0, bb: 0, ibb: 0, hbp: 0, so: 0, sf: 0, sh: 0 };
  for (const ps of playerSeasons) {
    const b = ps.batting;
    s.pa += b.pa; s.ab += b.ab; s.h += b.h; s.b1 += b.b1; s.b2 += b.b2; s.b3 += b.b3;
    s.hr += b.hr; s.bb += b.bb; s.ibb += b.ibb; s.hbp += b.hbp; s.so += b.so; s.sf += b.sf; s.sh += b.sh;
  }
  const tb = s.b1 + 2 * s.b2 + 3 * s.b3 + 4 * s.hr;
  const avg = s.ab ? s.h / s.ab : 0;
  const obp = s.ab + s.bb + s.hbp + s.sf ? (s.h + s.bb + s.hbp) / (s.ab + s.bb + s.hbp + s.sf) : 0;
  const slg = s.ab ? tb / s.ab : 0;
  const babipDen = s.ab - s.so - s.hr + s.sf;
  return {
    ...s,
    tb,
    avg,
    obp,
    slg,
    ops: obp + slg,
    iso: slg - avg,
    kPct: s.pa ? s.so / s.pa : 0,
    bbPct: s.pa ? s.bb / s.pa : 0,
    babip: babipDen ? (s.h - s.hr) / babipDen : 0,
  };
}

/** リーグ投手集計 */
function leaguePitching(playerSeasons) {
  const s = { outs: 0, bf: 0, h: 0, hr: 0, bb: 0, ibb: 0, hbp: 0, so: 0, r: 0, er: 0 };
  for (const ps of playerSeasons) {
    const p = ps.pitching;
    s.outs += p.outs; s.bf += p.bf; s.h += p.h; s.hr += p.hr; s.bb += p.bb; s.ibb += p.ibb;
    s.hbp += p.hbp; s.so += p.so; s.r += p.r; s.er += p.er;
  }
  const ip = s.outs / 3;
  return { ...s, ip, era: ip ? (s.er / ip) * 9 : 0, whip: ip ? (s.h + s.bb) / ip : 0 };
}

/**
 * シーズン結果からリーグ全体のサマリを作る（較正の判定用）。
 * @param {{playerSeasons:Array, standings:Array}} res
 * @param {number} numTeams
 */
function leagueSummary(res, numTeams) {
  const bat = leagueBatting(res.playerSeasons);
  const pit = leaguePitching(res.playerSeasons);
  const totalRS = res.standings.reduce((a, t) => a + t.rs, 0);
  const totalG = res.standings.reduce((a, t) => a + t.g, 0); // = リーグ延べ試合数(=2×試合)
  const gamesPerTeam = totalG / numTeams;
  return {
    batting: bat,
    pitching: pit,
    hrPerTeam: bat.hr / numTeams,
    runsPerTeamPerGame: totalRS / numTeams / gamesPerTeam,
    gamesPerTeam,
  };
}

/**
 * リーグ別（L1/L2）のサマリ（S3・セパ得点差の較正用）。チームの所属リーグ単位で集計する。
 * ※DH規則単位（試合のDH有無別）の得点差は simulateSeason の runSplit を使うこと
 *   （所属リーグ単位は球団戦力ノイズで符号が反転しうる・S2引き継ぎ注意）。
 * @param {{playerSeasons:Array, standings:Array}} res simulateSeason の結果
 * @param {Array<{id:string,league:?string}>} teams league.teams
 * @returns {Object<string, ReturnType<leagueSummary>>} リーグid → サマリ
 */
function leagueSummaryByLeague(res, teams) {
  const leagueOf = new Map(teams.map((t) => [t.id, t.league]));
  const out = {};
  for (const lid of new Set(teams.map((t) => t.league))) {
    const ps = res.playerSeasons.filter((s) => leagueOf.get(s.teamId) === lid);
    const rows = res.standings.filter((t) => leagueOf.get(t.teamId) === lid);
    if (!rows.length) continue;
    out[lid ?? 'ALL'] = leagueSummary({ playerSeasons: ps, standings: rows }, rows.length);
  }
  return out;
}


// ===== src/sim/parkFactor.mjs =====
// ============================================================================
// パークファクター導出（D2・§11.2「文脈で化ける」）
//
// 集計（順位表の本拠地/敵地 得点スプリット）から球団ごとのパークファクター(PF)を導出する。
//   PF_runs(team) = 本拠地の得点/試合 ÷ 敵地の得点/試合
// 自チームの攻守力は本拠地/敵地の両方に等しく効くため、比で相殺され「球場の個性」だけが残る
// （古典的な1年PFの近似）。リーグ平均で正規化し PF平均=1（＝ゼロサム・§D2）にする。
//
// 打者/投手へ適用するPFは本拠地露出（≒半分の試合）ぶんに縮約:
//   pfBat(team) = 1 + (pfRuns(team) − 1) × batShare
// これを metrics の wRC+/ERA-/FIP- のパーク補正（park補正版フィールド）に接続する（leagueConstants）。
// ============================================================================

/**
 * 順位表の本拠地/敵地 得点スプリットから PF を導出する。
 * @param {Array} standings 各行に hpRuns/hpG（本拠地）・rpRuns/rpG（敵地）を含む（season.mjs が累積）
 * @param {Object} [cfg] batShare（PF→打者/投手縮約率）を含む設定。省略時 0.5
 * @returns {{pfRunsByTeam:Map, pfBatByTeam:Map, pfPitByTeam:Map, rawByTeam:Map}}
 *   pfRunsByTeam: 正規化済み run PF（平均1）。pfBat/pfPit: 本拠地露出ぶんに縮約したPF（wRC+/ERA-補正用）。
 */
function deriveParkFactors(standings, cfg = null) {
  const batShare = (cfg && cfg.tuning && cfg.tuning.park && cfg.tuning.park.batShare) ?? 0.5;
  const rawByTeam = new Map();
  let sumRaw = 0;
  let n = 0;
  for (const t of standings) {
    const homeRPG = (t.hpG || 0) > 0 ? (t.hpRuns || 0) / t.hpG : 0;
    const roadRPG = (t.rpG || 0) > 0 ? (t.rpRuns || 0) / t.rpG : 0;
    const raw = roadRPG > 0 ? homeRPG / roadRPG : 1;
    rawByTeam.set(t.teamId, raw);
    sumRaw += raw;
    n++;
  }
  const meanRaw = n > 0 ? sumRaw / n : 1;
  const pfRunsByTeam = new Map();
  const pfBatByTeam = new Map();
  const pfPitByTeam = new Map();
  for (const [teamId, raw] of rawByTeam) {
    const pfRuns = meanRaw > 0 ? raw / meanRaw : 1; // 正規化（平均1＝ゼロサム）
    const pf = 1 + (pfRuns - 1) * batShare; // 本拠地露出ぶんに縮約
    pfRunsByTeam.set(teamId, pfRuns);
    pfBatByTeam.set(teamId, pf);
    pfPitByTeam.set(teamId, pf); // 投手も同じ本拠地PF（打高球場ほど ERA-/FIP- が優遇される）
  }
  return { pfRunsByTeam, pfBatByTeam, pfPitByTeam, rawByTeam };
}

/** PF散らばりの要約（較正/表示用）。max−min と mean。 */
function parkFactorSpread(pfRunsByTeam) {
  const vals = [...pfRunsByTeam.values()];
  if (!vals.length) return { spread: 0, mean: 1, min: 1, max: 1 };
  const min = Math.min(...vals);
  const max = Math.max(...vals);
  const mean = vals.reduce((a, v) => a + v, 0) / vals.length;
  return { spread: max - min, mean, min, max };
}


// ===== src/sim/leagueConstants.mjs =====
// ============================================================================
// リーグ定数導出パス（1-6 / 自己レビュー F2・F31・F46）
//
// 2パス構造: pass1 でシーズンを実走・集計 → 本モジュールでシムのラン環境から
// 線形ウェイト・lgwOBA・wOBAscale・FIP定数・RPW を導出 → pass2 で各指標を確定。
// §18 の 13.3/1.216 等は「初期値」であり、ここで 12球団143試合NPB環境へ再導出する。
// ============================================================================




// 各イベントの得点価値（アウト基準=0の線形ウェイト・runs単位）。FanGraphs標準の
// "runs above out" 系（wRAAが正しいラン単位になり、WARの絶対値が文献スケールに乗る・レビューB-2）。
// run-expectancy からの厳密導出は将来（コード自身の予告）。
const LINEAR_WEIGHTS = {
  bb: 0.55,
  hbp: 0.58,
  b1: 0.7,
  b2: 1.0,
  b3: 1.27,
  hr: 1.65,
};

/** 打撃イベント合計から「アウト基準の得点価値/打席」を出す（wOBAの素）。
 *  FG定義準拠（S3）: 分子は uBB=BB−IBB（敬遠は打者の技量でない）、分母 = AB+BB−IBB+SF+HBP。 */
function rawRunValuePerPA(bat, W = LINEAR_WEIGHTS) {
  const ibb = bat.ibb || 0;
  const denom = bat.ab + bat.bb - ibb + bat.sf + bat.hbp;
  if (!denom) return 0;
  const num =
    W.bb * (bat.bb - ibb) + W.hbp * bat.hbp + W.b1 * bat.b1 + W.b2 * bat.b2 + W.b3 * bat.b3 + W.hr * bat.hr;
  return num / denom;
}

/**
 * シーズン結果からリーグ定数を導出。cfg.leagueConstants に相当する構造を返す。
 * @param {{playerSeasons:Array, standings:Array}} res
 */
function deriveLeagueConstants(res, cfg = null) {
  const bat = leagueBatting(res.playerSeasons);
  const pit = leaguePitching(res.playerSeasons);

  // パークファクター（D2・§11.2）: 順位表の本拠地/敵地 得点スプリットから球団PFを導出。
  //   metrics 側で wRC+/ERA-/FIP- の park補正版フィールドに接続する（ps.teamId でルックアップ）。
  //   スプリットが無い（古い呼び出し/中立単一park）場合は空Map＝park補正=素の値（後方互換）。
  const hasSplits = (res.standings || []).some((t) => (t.hpG || 0) > 0 && (t.rpG || 0) > 0);
  const pf = hasSplits ? deriveParkFactors(res.standings, cfg) : null;

  // --- wOBA 系（lgwOBA を lgOBP スケールへ正規化）---
  const lgRawPerPA = rawRunValuePerPA(bat); // アウト基準の得点価値/打席
  const lgOBP = bat.obp;
  const wobaScale = lgRawPerPA > 0 ? lgOBP / lgRawPerPA : 1; // wOBA = wobaScale × raw で lgwOBA=lgOBP
  const lgwOBA = lgOBP;

  // wRC+ 用: リーグの総得点/打席
  const totalRuns = res.standings.reduce((a, t) => a + t.rs, 0);
  const lgRunsPerPA = bat.pa ? totalRuns / bat.pa : 0;

  // --- FIP 定数（lgFIP を lgERA に一致させる。FG式＝IBB除外・S3）---
  const ip = pit.outs / 3;
  const fipRawLeague = ip ? (13 * pit.hr + 3 * (pit.bb - (pit.ibb || 0) + pit.hbp) - 2 * pit.so) / ip : 0;
  const lgERA = pit.era;
  const fipConstant = lgERA - fipRawLeague;
  const lgFIP = lgERA; // 定義上一致

  // xFIP用のリーグ HR/FB（§B3a）: リーグ総被HR ÷ リーグ総被フライ。
  // これで Σ(被FB×lgHRFB)=ΣHR となり、リーグ xFIP=リーグ FIP=リーグ ERA が恒等成立する。
  let totFB = 0;
  for (const ps of res.playerSeasons) totFB += ps.pitching.bbFB;
  const lgHRFB = totFB ? pit.hr / totFB : 0;
  const lgSLG = bat.slg; // OPS+ の基準（§B3a）

  // --- RPW（Runs Per Win, Tango近似 1.5×RG+3。RG=1チーム1試合の得点）---
  const gamesPerTeam = res.standings.reduce((a, t) => a + t.g, 0) / res.standings.length;
  const runsPerGamePerTeam = gamesPerTeam ? totalRuns / res.standings.length / gamesPerTeam : 4.2;
  const rpw = 1.5 * runsPerGamePerTeam + 3;

  // 代替水準（野手）: FanGraphs は「リーグ全体の代替勝利の総量」を固定し、各選手へ打席比で按分する。
  //   Replacement Runs = (570 × (MLB Games / 2,430)) × (Runs Per Win / lgPA) × PA
  //   → 両辺を RPW で割ると 代替wins = (570 × Games/2430) × (PA / lgPA)
  //   ＝ 代替勝利の総量は得点環境にもリーグ総打席にも依存しない（勝率.294のチームは何点環境でも48勝）。
  // 旧実装は repl を run 単位で (PA/600)×定数 としていたため、投手（wins単位）と単位が食い違い、
  // 得点環境が下がる（rpw が下がる）と野手の代替勝利だけが膨らんで総WARが動いていた。
  // 正典: sabermetrics_glossary.md §7.1 / §7.3 / §10.5
  const lgPA = bat.pa;
  const lgTeamGames = res.standings.reduce((a, t) => a + t.g, 0); // Σ 各チームの試合数
  const replHitterWinsTotal = cfg && cfg.tuning ? cfg.tuning.replHitterWinsPerTeamGame * lgTeamGames : 0;

  // 盗塁の得点価値（正典 sabermetrics_glossary.md §6.2・一次: FanGraphs Library wSB）
  //   runSB = +0.2（全シーズン固定）
  //   runCS = −(2 × RunsPerOut + 0.075)  ← 得点環境依存の可変式
  // 旧実装は runCS を固定値 -0.38 にしていたため、時代トレンドで得点環境が動くと原典から乖離した。
  // RunsPerOut = リーグ総得点 / リーグ総アウト数（＝投手の記録した総アウト）。
  let totalOuts = 0;
  for (const ps of res.playerSeasons) totalOuts += ps.pitching.outs;
  const lgRunsPerOut = totalOuts ? totalRuns / totalOuts : 0;
  const runCS = -(2 * lgRunsPerOut + 0.075);

  // 併殺リーグ率（wGDPの基準・§6）
  let totGDP = 0;
  let totGDPOpp = 0;
  for (const ps of res.playerSeasons) {
    totGDP += ps.batting.gdp;
    totGDPOpp += ps.baserunning.gdpOpp;
  }
  const lgGDPrate = totGDPOpp ? totGDP / totGDPOpp : 0;

  // 二遊間 併殺転換率（DPRの基準・§B3b）: 守備側の機会/成立から。lgDPRate= Σ成立/Σ機会。
  // 各機会は 2B・SS の両者に計上されるため分母/分子とも2倍だが比は不変（DPRの対平均は0中心）。
  // ※1件の併殺のrun価値は二遊間で共有する1イベントなので、metrics側(dprRunsAboveAvg)で
  //   dpShare=0.5 を掛けて参加者に配分する（両者へのフル二重帰属を防ぐ・単一計上のチーム値に一致）。
  let totDPturned = 0;
  let totDPopp = 0;
  for (const ps of res.playerSeasons) {
    totDPturned += ps.fielding.dpTurned || 0;
    totDPopp += ps.fielding.dpOpp || 0;
  }
  const lgDPRate = totDPopp ? totDPturned / totDPopp : 0;

  // 外野ARMの基準（実イベント創発）: 追加進塁機会あたりの「進塁を許した率」「刺した率」。
  // fielding.mjs が ARM = lgPerOpp×opp − (adv×runUBR + kill×runCS) で対平均run換算する
  // （リーグΣ ARM = 0 が厳密成立）。
  let totArmOpp = 0;
  let totArmAdv = 0;
  let totArmKill = 0;
  // 捕手ブロッキングの基準: ワンバウンド機会あたりの (暴投+捕逸) 率
  let totBlockOpp = 0;
  let totWpPb = 0;
  for (const ps of res.playerSeasons) {
    const f = ps.fielding;
    totArmOpp += f.armOpp || 0;
    totArmAdv += f.armAdv || 0;
    totArmKill += f.armKill || 0;
    totBlockOpp += f.blockOpp || 0;
    totWpPb += (f.wp || 0) + (f.pb || 0);
  }
  const lgArmAdvRate = totArmOpp ? totArmAdv / totArmOpp : 0;
  const lgArmKillRate = totArmOpp ? totArmKill / totArmOpp : 0;
  const lgBlockFailRate = totBlockOpp ? totWpPb / totBlockOpp : 0;

  // 追加進塁リーグ率（UBRの基準・§6／§req_20260708強化）。
  // 実際のUBR/EqBRR（Fangraphs/Baseball Prospectus）はシナリオ別（単打での二塁走者本塁突入・
  // 二塁打での一塁走者本塁突入・単打での一塁走者三塁進塁・タッグアップ等）にRE24分解して評価する。
  // lgAdvRateは後方互換の全シナリオ合算（XBT%表示用）、各シナリオ別のリーグ率を別途算出する。
  let totAdv = 0;
  let totAdvOpp = 0;
  const scenarioTotals = {
    adv2h1b: [0, 0], adv1h2b: [0, 0], adv1t3b: [0, 0], tag: [0, 0],
    // realism_r1_baserunning_spec §A/§B: ゴロ進塁・タッグアップ深さ依存化の新シナリオ
    gbAdv3h: [0, 0], gbAdv2t3: [0, 0], tag3h: [0, 0],
  };
  for (const ps of res.playerSeasons) {
    const br = ps.baserunning;
    totAdv += br.advTaken;
    totAdvOpp += br.advOpp;
    for (const k of Object.keys(scenarioTotals)) {
      scenarioTotals[k][0] += br[`${k}Taken`] || 0;
      scenarioTotals[k][1] += br[`${k}Opp`] || 0;
    }
  }
  const lgAdvRate = totAdvOpp ? totAdv / totAdvOpp : 0;
  const lgAdvRateByScenario = {};
  for (const k of Object.keys(scenarioTotals)) {
    const [taken, opp] = scenarioTotals[k];
    lgAdvRateByScenario[k] = opp ? taken / opp : 0;
  }

  // wSB中心化の基準（監査C1・§6）: リーグの盗塁/盗塁死と、盗塁母数=一塁到達(1B+BB+HBP-IBB)。
  // metrics側で lgwSB = (ΣSB×runSB+ΣCS×runCS)/Σ機会 を作り、走者の機会分だけ基準控除する。
  let lgSB = 0;
  let lgCS = 0;
  let lgSBOpp = 0;
  for (const ps of res.playerSeasons) {
    const b = ps.batting;
    lgSB += b.sb;
    lgCS += b.cs;
    lgSBOpp += b.b1 + b.bb + b.hbp - b.ibb;
  }

  // ポジション別 OAA/イニング・失策/イニング 平均（UZRの範囲成分/失策成分を
  // 「そのポジションで守る選手の平均=0」に中心化するため。§7.2・監査A3）
  const posAgg = {};
  for (const ps of res.playerSeasons) {
    const inn = totalFieldInnings(ps.fielding);
    if (inn < 1) continue;
    const pos = mainPosition(ps.fielding);
    if (!posAgg[pos]) posAgg[pos] = { oaa: 0, inn: 0, err: 0 };
    posAgg[pos].oaa += ps.fielding.oaaOuts;
    posAgg[pos].inn += inn;
    posAgg[pos].err += ps.fielding.e || 0;
  }
  const oaaCenterPerInn = {};
  const errCenterPerInn = {};
  for (const pos of Object.keys(posAgg)) {
    oaaCenterPerInn[pos] = posAgg[pos].oaa / posAgg[pos].inn;
    errCenterPerInn[pos] = posAgg[pos].err / posAgg[pos].inn;
  }

  return {
    lgGDPrate,
    lgDPRate,
    lgArmAdvRate,
    lgArmKillRate,
    lgBlockFailRate,
    lgAdvRate,
    lgAdvRateByScenario,
    lgSB,
    lgCS,
    lgSBOpp,
    oaaCenterPerInn,
    errCenterPerInn,
    linearWeights: { ...LINEAR_WEIGHTS },
    lgRawPerPA,
    wobaScale,
    lgwOBA,
    lgOBP,
    lgRunsPerPA,
    lgRunsPerOut,
    lgPA,
    lgTeamGames,
    replHitterWinsTotal,
    runCS,
    lgSLG,
    lgHRFB,
    lgERA,
    lgFIP,
    fipConstant,
    rpw,
    // パークファクター（D2・§11.2）: 球団PF。metrics の park補正版フィールドが参照する。
    parkBatByTeam: pf ? pf.pfBatByTeam : null,
    parkPitByTeam: pf ? pf.pfPitByTeam : null,
    parkRunsByTeam: pf ? pf.pfRunsByTeam : null,
    // WAR 用の位置補正は §9/positions の per-1350 値を使う（143試合再スケールはWAR算出2-9で）
  };
}

/** シーズンを走らせてから cfg.leagueConstants を埋める（2パスの糊） */
function fillLeagueConstants(cfg, res) {
  cfg.leagueConstants = { ...cfg.leagueConstants, ...deriveLeagueConstants(res, cfg) };
  return cfg.leagueConstants;
}


// ===== src/sim/manager.mjs =====
// ============================================================================
// 監督ポリシー（フェーズA S2 / §S2 / 設計原則「采配はすべて監督ポリシー経由」）
//
// 采配・起用の判断ロジックをここに集約する（game.mjs は状態機械と記録に徹する）。
// フェーズCで人間の采配に差し替えるフックとなるため、各関数は
// 「状況（試合状態のビュー）→ 判断（確率 or 起用対象）」の純粋関数として書く。
//
// 三層構造の原則（req: 起用AIが trueAbility を直接見てよいのは編成の初期値のみ）:
//   - 打者の強弱判断 = 観測statline（observedWoba: 生カウント＋リーグ平均への回帰）
//   - 交代候補の序列 = buildPregameEval（試合開始時に固めた「監督の当日メモ」＝編成時評価）
//   - 左右（bats/throws）は公開情報として参照してよい
// シーズン中のレギュラー見直しは S3 usage.mjs（観測＋スカウトノイズ）が担う。
// ============================================================================







/** 中立の監督プロファイル（未指定時の既定。生成は generate.generateManager） */
function neutralManager() {
  return { buntTend: 50, stealTend: 50, ibbTend: 50, quickHook: 50 };
}

/**
 * 観測wOBA（インゲーム判断用の近似）。観測statlineの生カウントから
 * 得点価値/PA を出し、少打席はリーグ平均へ回帰させる（config.tuning.mgr）。
 * リーグ定数導出（2パス目）前でも使えるよう wobaScale は簡易ノブで代用。
 */
function observedWoba(batLine, cfg) {
  const m = cfg.tuning.mgr;
  const raw = rawRunValuePerPA(batLine, LINEAR_WEIGHTS) * m.wobaScale;
  const pa = batLine.pa || 0;
  return (raw * pa + m.wobaPrior * m.wobaPriorPA) / (pa + m.wobaPriorPA);
}

/**
 * 試合開始時の「監督の当日メモ」（編成時評価＝trueAbility 参照はここまで）。
 * 以降のインゲーム判断（代打/代走/守備固め）はこのメモと観測statlineのみを見る。
 * @returns {Map<string,{hit:number,speed:number,def:Object}>}
 */
function buildPregameEval(byId, cfg) {
  const d = cfg.tuning.depth;
  const m = new Map();
  for (const [pid, p] of byId) {
    const def = {};
    const range = rangeRating(p, cfg);
    for (const pos of FIELD_POSITIONS) {
      def[pos] = p.trueAbility.fielding.positionProf[pos] + d.posToolW * (range - 50);
    }
    m.set(pid, { hit: hitScore(p), speed: p.trueAbility.common.speed, def });
  }
  return m;
}

/** 側オブジェクトから未使用・未退場のブルペン投手を返す（可用リスト前提・§S2-7） */
function availableRelievers(side) {
  return side.bullpen.filter((pid) => !side.usedPitchers.has(pid) && !side.retired.has(pid));
}

// --- 盗塁の采配ゲート（§S2-6） ----------------------------------------------

/**
 * 盗塁試行への監督ゲート（logit加算値）。stealTend の個性＋状況ゲート:
 * 大差（±gateBigDiff以上）では走らない / 2死×強打者では自重。
 */
function stealLogitAdjust(manager, situ, cfg) {
  const s = cfg.tuning.steal;
  let adj = ratingDelta(manager.stealTend, s.tendW);
  if (Math.abs(situ.scoreDiff) >= s.gateBigDiff) adj -= s.gateBigDiffLogit;
  if (situ.outs === 2 && situ.batterWoba >= cfg.tuning.ibb.strongBatterWoba) adj -= s.gateStrong2OutLogit;
  return adj;
}

// --- 犠打（§S2-4） -----------------------------------------------------------

/**
 * 犠打の試行確率。局面不成立（2死/三塁走者あり/走者なし）は0。
 * 投手打席はほぼ必ずバント。野手は接戦×非強打者（観測wOBA）×監督buntTend。
 */
function buntAttemptProb(situ, cfg) {
  const t = cfg.tuning.bunt;
  if (situ.outs >= 2) return 0;
  if (situ.bases[2] || (!situ.bases[0] && !situ.bases[1])) return 0; // 走者1B/2B×三塁空きのみ
  if (situ.isPitcher) {
    // 投手は野手より広い点差でバントするが、大差では打たせる（点差ゲートを先に評価）
    return Math.abs(situ.scoreDiff) > t.pitcherMaxScoreDiff ? 0 : t.pitcherAttempt;
  }
  if (Math.abs(situ.scoreDiff) > t.maxScoreDiff) return 0;
  if (situ.batterWoba >= t.weakBatterWoba) return 0; // 強打者にはバントさせない
  return expit(logit(t.attemptBase) + ratingDelta(situ.manager.buntTend, t.tendW));
}

// --- 敬遠（§S2-5） -----------------------------------------------------------

/**
 * 敬遠の実施確率（守備側監督の判断）。一塁空き×一死or二死×終盤接戦×
 * （強打者 or 次打者が投手）でのみ正の値。
 */
function ibbProb(situ, cfg) {
  const t = cfg.tuning.ibb;
  if (situ.inning < t.minInning) return 0;
  if (situ.outs < 1) return 0; // 一死or二死のみ
  if (situ.bases[0]) return 0; // 一塁空きのみ
  if (!situ.bases[1] && !situ.bases[2]) return 0; // 得点圏に走者がいる時のみ
  if (Math.abs(situ.scoreDiff) > t.maxScoreDiff) return 0;
  if (!(situ.batterWoba >= t.strongBatterWoba || situ.nextIsPitcher)) return 0;
  return expit(logit(t.base) + ratingDelta(situ.manager.ibbTend, t.tendW));
}

// --- 代打/代走/守備固め（§S2-3） ---------------------------------------------

/**
 * 代打の起用判断。条件成立時、ベンチ最良打者（当日メモ＋プラトーン込み）を返す。
 * - 投手へ: phPitcherInning 以降のビハインド（±phMaxBehind内）or 同点以下の得点機。
 *   次の回に新投手を出せる救援が残っている時のみ。
 * - 野手へ: phInning 以降・同点orビハインド（phMaxBehind内）の得点機で、
 *   実効打力差（プラトーン込みhitScore相当）が phGainMin 以上の時のみ。
 * @returns {?string} 代打のplayerId（起用しないなら null）
 */
function choosePinchHitter(ctx, cfg) {
  const t = cfg.tuning.sub;
  const side = ctx.side;
  if (!side.bench.length) return null;
  const diff = side.score - ctx.oppScore;
  const risp = !!(ctx.bases[1] || ctx.bases[2]);
  if (ctx.isPitcher) {
    if (ctx.inning < t.phPitcherInning) return null;
    const behind = diff < 0 && -diff <= t.phMaxBehind;
    if (!behind && !(diff <= 0 && risp)) return null;
    if (availableRelievers(side).length === 0) return null; // 次の回の新投手が出せない
  } else {
    if (ctx.inning < t.phInning) return null;
    if (!(diff <= 0 && -diff <= t.phMaxBehind)) return null;
    if (!risp) return null; // 得点機のみ
  }
  // 実効打力 = 当日メモのhitScore − 同利きペナルティ（スイッチは常に有利側=減点なし）
  const eff = (pid) => {
    const e = side.pregame.get(pid);
    return e.hit - (isSameHand(side.byId.get(pid), ctx.oppPitcher) ? t.phPlatoonW : 0);
  };
  let best = null;
  let bestV = -Infinity;
  for (const pid of side.bench) {
    const v = eff(pid);
    if (v > bestV) {
      bestV = v;
      best = pid;
    }
  }
  if (bestV - eff(ctx.batterId) < t.phGainMin) return null;
  return best;
}

/**
 * 代走の起用判断。prInning 以降・prMaxScoreDiff 以内の接戦で、塁上の鈍足走者と
 * ベンチ最速の走力差が prSpeedGainMin 以上なら {baseIdx, pid} を返す。
 * 投手走者は対象外（投手退場が絡むため・DH無し試合）。
 */
function choosePinchRunner(ctx, cfg) {
  const t = cfg.tuning.sub;
  const side = ctx.side;
  if (!side.bench.length) return null;
  if (ctx.inning < t.prInning) return null;
  if (Math.abs(side.score - ctx.oppScore) > t.prMaxScoreDiff) return null;
  let fast = null;
  let fastSp = -Infinity;
  for (const pid of side.bench) {
    const sp = side.pregame.get(pid).speed;
    if (sp > fastSp) {
      fastSp = sp;
      fast = pid;
    }
  }
  let baseIdx = -1;
  let bestGain = -Infinity;
  for (let i = 0; i < 3; i++) {
    const r = ctx.bases[i];
    if (!r || r === side.curPid) continue;
    const gain = fastSp - side.pregame.get(r).speed;
    if (gain > bestGain) {
      bestGain = gain;
      baseIdx = i;
    }
  }
  if (baseIdx < 0 || bestGain < t.prSpeedGainMin) return null;
  return { baseIdx, pid: fast };
}

/**
 * 守備固めの判断。defInning 以降・リード defLeadMin〜defLeadMax で、
 * 守備最弱ポジ（当日メモの習熟＋素材）にベンチから defGainMin 以上の
 * 上位互換がいる時のみ {pos, pid} を返す。
 */
function chooseDefensiveSub(ctx, cfg) {
  const t = cfg.tuning.sub;
  const side = ctx.side;
  if (!side.bench.length) return null;
  if (ctx.inning < t.defInning) return null;
  const lead = side.score - ctx.oppScore;
  if (lead < t.defLeadMin || lead > t.defLeadMax) return null;
  let worstPos = null;
  let worstV = Infinity;
  for (const pos of Object.keys(side.defense)) {
    const pid = side.defense[pos];
    if (!pid) continue;
    const v = side.pregame.get(pid).def[pos];
    if (v < worstV) {
      worstV = v;
      worstPos = pos;
    }
  }
  if (!worstPos) return null;
  let best = null;
  let bestV = -Infinity;
  for (const pid of side.bench) {
    const v = side.pregame.get(pid).def[worstPos];
    if (v > bestV) {
      bestV = v;
      best = pid;
    }
  }
  if (!best || bestV - worstV < t.defGainMin) return null;
  return { pos: worstPos, pid: best };
}

/**
 * 負傷退場の代替を選ぶ（R3・§S2-3と同輪）。壊れた選手のポジションを継げるベンチ最良。
 *   守備位置 → その位置の守備評価（pregame.def）が最良 ／ DH → 打撃評価が最良。
 * ベンチが枯れていれば null（＝痛みを押して出場継続。翌日以降に抹消される）。
 * 決定論: 乱数不使用・bench 配列順で安定（同値は先着）。
 */
function chooseInjuryReplacement(side, pos, cfg) {
  if (!side.bench.length) return null;
  const evalOf = (pid) => {
    const pg = side.pregame.get(pid);
    if (!pg) return -Infinity;
    return pos === 'DH' ? pg.hit : pg.def[pos] ?? -Infinity;
  };
  let best = null;
  let bestV = -Infinity;
  for (const pid of side.bench) {
    const v = evalOf(pid);
    if (v > bestV) {
      bestV = v;
      best = pid;
    }
  }
  return best;
}

// --- 継投v2（§S2-7） ---------------------------------------------------------

/** 先発の球数上限（スタミナ×監督quickHook。高quickHookほど早く代える） */
function starterPitchLimit(manager, pitcher, cfg) {
  const pen = cfg.tuning.pen;
  return (
    pen.starterPitchBase +
    pitcher.trueAbility.pitching.stamina * pen.starterPitchStamW -
    (manager.quickHook - 50) * pen.quickHookW
  );
}

/**
 * レバレッジ代理（LI近似・§8.3 D4）。回・点差・走者/アウトから接戦度を合成した状態の純関数。
 *   pass1（LI表導出前）と pass2（加算）で同値＝救援選択が両パスで一致＝WPA telescoping を壊さない
 *   （経験的LI表は pass1 に存在しないため使えない。代理LIは状態のみから算出＝決定論）。
 *   概ねリーグ平均≈1.0・終盤×接戦×走者ありで上昇。高レバレッジ閾値は pen.highLevThreshold。
 * @param {number} inning 回 / @param {number} lead 投手側リード（負=ビハインド）
 * @param {number} baseBits 走者ビット（1=1B,2=2B,4=3B） / @param {number} outs アウト数
 */
function leverageProxy(inning, lead, baseBits, outs, pen) {
  const inn = Math.min(inning, pen.levInningCap);
  const inningW = 1 + Math.max(0, inn - pen.levInningPivot) * pen.levInningSlope;
  const closeW = Math.exp(-Math.abs(lead) / pen.levCloseScale); // 同点=1.0・離れるほど指数減衰
  const onBase = (baseBits & 1 ? 1 : 0) + (baseBits & 2 ? 1 : 0) + (baseBits & 4 ? 1 : 0);
  const risp = baseBits & 6 ? 1 : 0;
  const baseOutW = Math.max(0, 1 + pen.levRunnerW * onBase + pen.levRispW * risp - pen.levOutW * outs);
  return inningW * closeW * baseOutW;
}

/**
 * 状況→レバレッジ駆動の救援選択（§S2-7＋§8.3 D4）。可用リスト（連投制限等でフィルタ済み・S3）のみ使用。
 *   セーブ機会（9回以降=closer / 8回=setup8 / 7回=setup7）は従来の役割固定を基本とし、SV/HLD分布を維持。
 *   ただし走者を背負った火消し等の高レバレッジ局面では最良のセットアッパーを投入（LI駆動＝§8.3の完成）。
 *   同点・僅差ビハインドの高レバレッジ終盤も middle でなく勝ちパターン救援へ（好救援が高LIに集まり
 *   gmLI/WPA が質と相関＝「WARは平凡だがWPA抜群のセットアッパー」）。払底時は middle(B級)へフォールスルー
 *   （＝薄いブルペンが接戦でB級を高LIに晒す・WAR予測を下回る構造）。closer は温存し SV を守る。
 * @param {{baseBits?:number, outs?:number}} [situ] 現局面の走者/アウト（省略時=走者なし0死＝回頭）。
 * @returns {?string} 登板させる投手id（適任なし=現投手続投なら null）
 */
function chooseReliever(side, statFor, inning, lead, cfg, situ) {
  const pen = cfg.tuning.pen;
  const avail = availableRelievers(side);
  if (!avail.length) return null;
  const r = side.roles;
  const has = (pid) => pid != null && avail.includes(pid);
  const saveSitu = lead >= 1 && lead <= pen.saveLeadMax;
  const lev = leverageProxy(inning, lead, situ?.baseBits ?? 0, situ?.outs ?? 0, pen);
  const highLev = lev >= pen.highLevThreshold;
  // 勝ちパターン序列を質順（bullpen配列=relieverScore降順）で best-first に返す（最良救援の投入）。
  const bestCorps = (ids) => {
    for (const pid of side.bullpen) if (ids.includes(pid) && has(pid)) return pid;
    return null;
  };

  if (saveSitu && inning >= 9) {
    if (has(r.closer)) return r.closer;
    return avail[0]; // 抑え不在: 序列最上位（bullpenはrelieverScore順）
  }
  if (saveSitu && (inning === 8 || inning === 7)) {
    // 高レバレッジのセーブ機会（走者を背負った火消し）は最良のセットアッパーを投入（LI駆動・§8.3）。
    // 回頭（走者なし）の通常セーブ機会は回固定（8→setup8 / 7→setup7）＝HLD分布を維持。
    if (highLev) {
      const best = bestCorps([r.setup8, r.setup7]);
      if (best) return best;
    }
    if (inning === 8) {
      if (has(r.setup8)) return r.setup8;
      return avail.find((pid) => pid !== r.closer) ?? null; // closerは9回のセーブ機会に温存
    }
    if (has(r.setup7)) return r.setup7;
    return avail.find((pid) => pid !== r.closer && pid !== r.setup8) ?? avail.find((pid) => pid !== r.closer) ?? null;
  }
  // 高レバレッジの非セーブ終盤（同点・僅差ビハインド）: middle でなく勝ちパターン救援へ（§8.3 D4）。
  if (!saveSitu && highLev && inning >= pen.leverageMinInning && lead > -pen.bigBehind) {
    const best = bestCorps([r.setup8, r.setup7]);
    if (best) return best;
  }
  if (lead <= -pen.bigBehind && has(r.long)) return r.long; // 敗戦処理

  // その他（僅差ビハインド・同点・大差リード等）: middle を負荷分散。
  // closer/setup8 に加え setup7 も温存（7回接戦の役割登板と兼務させると登板数王が
  // 70台へ膨らむため・S5較正。middle が尽きた時のみ setup7→closer 以外の順で繰り上げ）。
  let pool = avail.filter((pid) => pid !== r.closer && pid !== r.setup8 && pid !== r.setup7);
  if (!pool.length) pool = avail.filter((pid) => pid !== r.closer && pid !== r.setup8);
  if (!pool.length) pool = avail.filter((pid) => pid !== r.closer);
  if (!pool.length) return null; // closerしか残っていない → 現投手続投
  // 負荷分散はG(登板数)基準・同数ならouts（S5較正: outs基準だと細切れ登板の投手に
  // 登板数が偏り登板数王が70台へ膨らむ。Gを均せば45-65へ収まる）
  let best = null;
  let bestG = Infinity;
  let bestOuts = Infinity;
  for (const pid of pool) {
    const p = statFor(pid, side.teamId).pitching;
    const g = p.g ?? 0;
    if (g < bestG || (g === bestG && p.outs < bestOuts)) {
      bestG = g;
      bestOuts = p.outs;
      best = pid;
    }
  }
  return best;
}

// ============================================================================
// 追加系指標の打球イベント集計（§B3a / フェーズB B3a）
//
// 「打席/打球/プレーのイベントストリームを読むだけで計算できる」追加集計を、
// シミュレーション本体（打席解決・打球生成・継投）を一切変えずに湧かせる。
// resolveBattedBall が既に計算した期待out率・期待塁打分布(xB1..xHR)と、打球3要素(EV/LA/spray)を
// 打者/投手の生カウントへ積むだけ。ここでは乱数を一切消費しない（＝決定論・較正30指標が完全不変）。
//
// 生の一球ログは永続化しない（§17）。集計カウンタのみ。
// ============================================================================


/**
 * Barrel 判定（Statcast定義の近似・§B3a）。EV≥~98mph かつ、EVが上がるほど広がるLA帯に入る打球。
 * @param {number} evKmh 打球速度(km/h)
 * @param {number} laDeg 打球角度(度)
 * @param {Object} m cfg.tuning.metrics（Barrel帯定数）
 */
function isBarrel(evKmh, laDeg, m) {
  if (evKmh < m.barrelMinKmh) return false;
