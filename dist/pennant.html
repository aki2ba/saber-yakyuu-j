    // 候補プール: 守備ポジは編成時 positionRank 上位（守備適性の担保）、DHは全野手
    const pool = pos === 'DH' ? fielders : chart.positionRank[pos].slice(0, u.candidatesPerPos);
    const bestOf = (list) => {
      let best = null;
      let bv = -Infinity;
      for (const pid of list) {
        if (excluded(pid)) continue;
        const v = effEval(pid, pos);
        if (v > bv) {
          bv = v;
          best = pid;
        }
      }
      return best;
    };

    // (1) 担当: challenger は share の頻度で先発（観測ベース見直しの漸進昇格）
    let pid = a.regular != null && !excluded(a.regular) ? a.regular : null;
    if (a.challenger && !excluded(a.challenger) && ctx.rng.next() < a.share) pid = a.challenger;

    // (2) 休養: 捕手は厚めに、連続出場が長いほど確率↑（正捕手100-135試合の機序）
    if (pid != null) {
      const restP =
        (pos === 'C' ? r.catcherRestProb : r.fielderRestProb) + r.streakW * (state.consecStarts.get(pid) ?? 0);
      if (ctx.rng.next() < restP) {
        resting.add(pid);
        pid = null;
      }
    }
    // (2b) 不振ベンチ（S5較正・WAR下限>-2.5の門番）: 観測ベース評価＋レンジ評価（50中心・
    // UZR産出に比例する静的成分）がベンチ水準を割る担当は、見直し(25試合)の周期を待たず
    // 日次でPA蓄積を絞る（打撃崩壊型・レンジ破綻型の双方が数百打席積むのを防ぐ）。
    // 逆に「守備の名手×貧打」はレンジ加点で先発が保たれる（現実のNPBの守備型レギュラー）。
    // 捕手は守備優先の起用が現実につき通常は対象外だが、「壊滅的」水準（catcherDisasterWoba未満＝
    // wRAA最悪級×守備破綻）に限り控えと分担させ、WAR-3級の定着を防ぐ（原則2）。
    if (pid != null) {
      const isC = pos === 'C';
      const benchEval =
        baseEval(pid) + (pos === 'DH' ? 0 : u.rangeWobaPerPt * ((state.rangeEval?.get(pid) ?? 50) - 50));
      const thr = isC ? r.catcherDisasterWoba : r.benchWoba;
      const prob = isC ? r.catcherDisasterBenchProb : r.slumpBenchProb;
      if (benchEval < thr && ctx.rng.next() < prob) {
        resting.add(pid);
        pid = null;
      }
    }

    // (3) 空席の充填: 候補プールの実効評価最良（全滅なら positionRank/全野手から最初の未使用）
    if (pid == null) {
      const all = pos === 'DH' ? fielders : chart.positionRank[pos];
      pid =
        bestOf(pool) ??
        all.find((x) => !excluded(x)) ??
        // F2-2 最終安全弁: 出場登録29人制（野手15人）では休養の集中＋IL重複で候補が尽き得る。
        // 休養は柔らかい希望なので解除して充当（IL相当は最後まで避ける）。スタメン9人を必ず埋め、
        // 候補が残る通常時は一切通らない＝挙動不変。乱数非消費（決定論）。
        all.find((x) => !used.has(x) && !isInjured(state, x, ctx.day)) ??
        all.find((x) => !used.has(x));
      if (pid != null) resting.delete(pid); // 休養解除で先発する場合は rested から外す
    } else if (pos !== 'C' && ctx.oppPitcher && isSameHand(byId.get(pid), ctx.oppPitcher)) {
      // (4) プラトーン: 同利きの担当に対し、実効評価（守備込み）で上回る候補がいれば当日限りの入替
      const alt = bestOf(pool.filter((x) => x !== pid));
      if (alt != null && effEval(alt, pos) - effEval(pid, pos) > u.platoonMargin) pid = alt;
    }
    used.add(pid);
    today[pos] = pid;
  }

  // 打順スロットへ反映（交代者は同じ打順スロットを引き継ぐ）。9番'P'は initSide が当日先発を充填。
  const lineup = chart.lineup.map((s) => ({ playerId: s.pos === 'P' ? null : today[s.pos], pos: s.pos }));
  const inLineup = new Set(lineup.map((s) => s.playerId));
  // 休養者は代打要員としてベンチに残るが、離脱中(IL)は代打にも出せないので除外する（C2.4）。
  const bench = fielders.filter((pid) => !inLineup.has(pid) && !isInjured(state, pid, ctx.day));
  return { lineup, bench, rested: [...resting] };
}

/**
 * 試合後の起用履歴の更新。ローテ進行・投手の日次球数（S2投手使用ログの接続）・
 * 野手の連続出場/先発数を記録し、reviewInterval 試合ごとに見直しを回す。
 */
function recordGameUsage(state, { day, starterPid, lineup, pitcherLog }, getBat, cfg) {
  // 先発ローテの進行と登板日の記録
  const rot = state.charts.dh.rotation;
  const ri = rot.indexOf(starterPid);
  if (ri >= 0) state.rotIdx = (ri + 1) % rot.length;
  state.lastStartDay.set(starterPid, day);
  let sd = state.startDaysByPid.get(starterPid);
  if (!sd) {
    sd = [];
    state.startDaysByPid.set(starterPid, sd);
  }
  sd.push(day);

  // 投手の日次球数（連投制限・前日球数の判定材料）
  for (const ap of pitcherLog) {
    let m = state.pitchedByDay.get(ap.pid);
    if (!m) {
      m = new Map();
      state.pitchedByDay.set(ap.pid, m);
    }
    m.set(day, (m.get(day) ?? 0) + ap.pitches);
  }

  // 野手の連続出場・先発数（先発した野手は+1、しなかった野手は0へリセット）
  const started = new Set();
  for (const s of lineup) {
    if (s.pos === 'P' || !s.playerId) continue;
    started.add(s.playerId);
    state.startsByPid.set(s.playerId, (state.startsByPid.get(s.playerId) ?? 0) + 1);
    let mp = state.startsAtPos.get(s.playerId);
    if (!mp) {
      mp = new Map();
      state.startsAtPos.set(s.playerId, mp);
    }
    mp.set(s.pos, (mp.get(s.pos) ?? 0) + 1);
  }
  for (const [pid, p] of state.charts.dh.byId) {
    if (p.role !== 'fielder') continue;
    state.consecStarts.set(pid, started.has(pid) ? (state.consecStarts.get(pid) ?? 0) + 1 : 0);
  }

  // 観測成績ベースの見直し（25試合ごと・§S3-2）
  state.games++;
  if (state.games % cfg.tuning.usage.reviewInterval === 0) reviewAssignments(state, getBat, cfg);
}

/**
 * 観測成績ベースの担当見直し（§S3-2）。ポジションごとに混合評価で候補を再ランクし、
 * swapMargin を超えて上回る候補を challenger としてシェアを漸増（share≥1で完全昇格）。
 * 差が縮めばシェアは減衰する（一時の好不調で振り回されない）。真値は見ない。
 */
function reviewAssignments(state, getBat, cfg) {
  const u = cfg.tuning.usage;
  const chart = state.charts.dh;
  const fielders = [];
  for (const [pid, p] of chart.byId) if (p.role === 'fielder') fielders.push(pid);
  // 直近フォーム窓: 前回見直し以降の観測で評価（窓PAが少なければ累積へフォールバック）
  const getBatWin = (pid) => {
    const cur = getBat(pid);
    const snap = state.lastSnap ? state.lastSnap.get(pid) : null;
    if (!snap) return cur;
    const win = diffBatCounts(cur, snap);
    return win.pa >= u.windowMinPA ? win : cur;
  };
  const bat = new Map(fielders.map((pid) => [pid, blendedWoba(state, pid, getBatWin, cfg)]));

  const used = new Set();
  for (const pos of [...POSITION_DIFFICULTY, 'DH']) {
    const a = state.assign[pos];
    if (!a) continue;
    // 評価 = 混合打撃評価 + ポジション守備のwOBA換算（同一ポジション内の比較・S5較正）
    const ev = new Map(fielders.map((pid) => [pid, bat.get(pid) + defWobaAt(state, pid, pos, cfg)]));
    const pool = (pos === 'DH' ? fielders : chart.positionRank[pos].slice(0, u.candidatesPerPos)).filter(
      (pid) => !used.has(pid),
    );
    if (!pool.length) continue;
    // レギュラーが他ポジションの担当に取られた（or不在）なら評価最良を新担当に
    if (a.regular == null || used.has(a.regular)) {
      a.regular = pool.reduce((b, pid) => (ev.get(pid) > ev.get(b) ? pid : b));
      a.challenger = null;
      a.share = 0;
      used.add(a.regular);
      continue;
    }
    let top = a.regular;
    for (const pid of pool) if (ev.get(pid) > ev.get(top)) top = pid;
    // 入替マージン: 捕手のみ厚め（リード面の継続性＝正捕手の出場を100-135試合へ保つ・S5較正）
    const margin = pos === 'C' ? u.catcherSwapMargin : u.swapMargin;
    if (top === a.regular || ev.get(top) - ev.get(a.regular) <= margin) {
      // 現状維持: 挑戦者のシェアは減衰（差が消えたら挑戦解消）
      a.share = Math.max(0, a.share - u.promoteStep);
      if (a.share === 0) a.challenger = null;
    } else if (a.challenger === top) {
      a.share += u.promoteStep;
      if (a.share >= 1) {
        // 完全昇格: 不振レギュラーはベンチ（次回見直しから挑戦者になりうる）
        a.regular = top;
        a.challenger = null;
        a.share = 0;
      }
    } else {
      a.challenger = top; // 新挑戦者はシェア漸増から（急な全交代をしない）
      a.share = u.promoteStep;
    }
    used.add(a.regular);
  }

  // スナップショットの更新（次回見直しの直近フォーム窓の起点）
  state.lastSnap = new Map(fielders.map((pid) => [pid, copyBatCounts(getBat(pid))]));
}


// ===== src/sim/postseason.mjs =====
// ============================================================================
// ポストシーズン（フェーズA S3 / §S3-3）
//
// クライマックスシリーズ（CS）→ 日本シリーズを NPB 規則で実行する:
//   CS 1st   : リーグ2位 vs 3位。csFirstWins(2)戦先勝・全試合2位の本拠地。
//   CS Final : リーグ1位 vs CS1st勝者。1位に csFinalAdv(1)勝のアドバンテージ・
//              csFinalWins(4)勝先取・全試合1位の本拠地。
//   日本シリーズ: 両リーグ王者。japanSeriesWins(4)勝先取・2-3-2 の本拠地パターン
//              （レギュラーシーズン勝率上位が第1,2,6,7戦を主催。同率は得失点差→先着）。
// 延長は決着まで（引分なし・maxInnings:Infinity）。DH規則=ホーム球団のリーグ（§S2-2と同じ）。
// 統計はレギュラーシーズンと分離集計（専用の stats Map。混ぜない・§S3-3）。
// 起用はシリーズ内でローテを頭から回す簡易版（日次疲労の持ち越しはフェーズB以降）。
// ============================================================================





/**
 * ポストシーズン一式を実行。
 * @param {Object} input
 * @param {Array<{id:string, rows:Array}>} input.rankings リーグ別順位（rows=順位表の行・勝率降順）
 * @param {Map} input.chartsByTeam teamId → {dh,noDh} 編成表
 * @param {Map} input.teamById teamId → チーム（league/manager 参照）
 * @param {Map} input.leagueDh リーグid → DH有無
 * @param {number} input.seed ポストシーズン用シード（レギュラーシーズンから分離）
 * @returns {{csFirst:Object, csFinal:Object, japanSeries:?Object, champion:?string,
 *   playerSeasons:Array, statsById:Map}}
 */
function simulatePostseason({ rankings, chartsByTeam, teamById, leagueDh, cfg, seed, season = 2026, park = NEUTRAL_PARK, parkByTeam = null }) {
  const rules = cfg.league.postseason ?? {};
  const csFirstWins = rules.csFirstWins ?? 2;
  const csFinalWins = rules.csFinalWins ?? 4;
  const csFinalAdv = rules.csFinalAdv ?? 1;
  const jsWins = rules.japanSeriesWins ?? 4;

  // ポストシーズン専用の集計器（レギュラーシーズンと混ぜない）
  const stats = new Map();
  const statFor = (pid, teamId) => {
    let s = stats.get(pid);
    if (!s) {
      s = createPlayerSeason(pid, 'postseason');
      s.teamId = teamId;
      stats.set(pid, s);
    }
    return s;
  };
  const psGames = new Map(); // teamId → ポストシーズン消化試合数（ローテを頭から回す）

  /** 1試合（延長は決着まで）。DH規則=ホーム球団リーグ。 */
  const playGame = (stage, gi, homeId, awayId) => {
    const rng = makeRng(hashSeed(seed, stage, gi));
    const dh = leagueDh.get(teamById.get(homeId).league) ?? true;
    const init = (teamId) => {
      const c = chartsByTeam.get(teamId);
      const n = psGames.get(teamId) ?? 0;
      psGames.set(teamId, n + 1);
      return {
        teamId,
        depth: dh ? c.dh : c.noDh,
        starterIdx: n, // シリーズはローテ頭から順に（中n日はシリーズ間隔で担保される簡易版）
        manager: teamById.get(teamId).manager,
        dh,
      };
    };
    // 本拠地球場（D2）: ホーム球団の本拠地 park で開催（ホームアドバンテージに球場個性も乗る）。
    const gamePark = (parkByTeam && parkByTeam.get(homeId)) || park;
    const res = simulateGame(init(homeId), init(awayId), cfg, rng, statFor, gamePark, undefined, {
      maxInnings: Infinity, // 延長は決着まで（引分なし・§S3-3）
    });
    return { home: homeId, away: awayId, homeScore: res.homeScore, awayScore: res.awayScore, innings: res.innings };
  };

  /** シリーズ（winsNeeded 勝先取。advA=チームaの初期アド、hosts=第n戦のホスト列・末尾を繰返し） */
  const playSeries = (stage, a, b, { winsNeeded, advA = 0, hosts }) => {
    const wins = { [a]: advA, [b]: 0 };
    const games = [];
    let gi = 0;
    while (wins[a] < winsNeeded && wins[b] < winsNeeded) {
      const home = hosts[Math.min(gi, hosts.length - 1)];
      const away = home === a ? b : a;
      const g = playGame(stage, gi, home, away);
      games.push(g);
      wins[g.homeScore > g.awayScore ? g.home : g.away]++;
      gi++;
    }
    const winner = wins[a] >= winsNeeded ? a : b;
    return { teams: [a, b], winsNeeded, advantage: advA > 0 ? a : null, wins, games, winner };
  };

  // --- リーグごとの CS ------------------------------------------------------
  const csFirst = {};
  const csFinal = {};
  const finalists = []; // {league, teamId}
  for (const l of rankings) {
    const ids = l.rows.map((r) => r.teamId);
    const [t1, t2, t3] = ids;
    if (!t1) continue;
    let challenger = t2 ?? null;
    if (t2 && t3) {
      csFirst[l.id] = playSeries(`csFirst:${l.id}`, t2, t3, { winsNeeded: csFirstWins, hosts: [t2] });
      challenger = csFirst[l.id].winner;
    }
    if (challenger) {
      csFinal[l.id] = playSeries(`csFinal:${l.id}`, t1, challenger, {
        winsNeeded: csFinalWins,
        advA: csFinalAdv,
        hosts: [t1],
      });
      finalists.push({ league: l.id, teamId: csFinal[l.id].winner });
    } else {
      finalists.push({ league: l.id, teamId: t1 }); // 相手不在（縮小構成の安全弁）
    }
  }

  // --- 日本シリーズ（2-3-2） -------------------------------------------------
  let japanSeries = null;
  let champion = finalists.length === 1 ? finalists[0].teamId : null;
  if (finalists.length >= 2) {
    const [fa, fb] = [finalists[0].teamId, finalists[1].teamId];
    // 本拠地アドバンテージ: NPB方式＝主催リーグを年の偶奇で交互（勝率無関係）。
    // 偶数年は leagues[0]、奇数年は leagues[1] のリーグ王者が第1,2,6,7戦を主催。
    const leagues = cfg.league.leagues ?? [];
    const hostLeague = leagues.length === 2 ? leagues[season % 2].id : finalists[0].league;
    const aFirst = finalists[0].league === hostLeague;
    const upper = aFirst ? fa : fb;
    const lower = aFirst ? fb : fa;
    const hosts = [upper, upper, lower, lower, lower, upper, upper]; // 2-3-2
    japanSeries = playSeries('japanSeries', upper, lower, { winsNeeded: jsWins, hosts });
    champion = japanSeries.winner;
  }

  return { csFirst, csFinal, japanSeries, champion, playerSeasons: [...stats.values()], statsById: stats };
}


// ===== src/sim/context.mjs =====
// ============================================================================
// 文脈指標（RE24 / WPA / LI / Clutch）— フェーズB B2（§B2 / req_1 §8.3「WARの死角」）
//
// 「打席/打球/プレーのイベントストリームを読むだけで計算できる」文脈指標を、
// シミュレーション本体（打席解決・打球生成・継投）を一切変えずに湧かせる。
//
// 2パス構造（season.mjs で結線・§B2）:
//   pass1(derive)   : シーズンを実走し、24状態(塁×アウト)の得点期待値(RE)・
//                     (イニング,表裏,点差,塁アウト)→勝率(WE)・打席状態のWE変化分散(LI) を
//                     大標本として集計する（乱数は消費しない＝結果は不変）。
//   → deriveTables  : RE行列・WE表(階層平滑化)・LI表(リーグ平均=1.0正規化) を焼き固める。
//   pass2(accumulate): 同一シード＝同一試合を再走し、各プレー確定点で
//                     ΔRE を打者(+)/投手(−)、走塁は走者へ・ΔWE(=WPA) を打者/投手へ加算。
//                     LI を打席加重(aLI)・投手(pLI)・救援登板時(gmLI) に積む。
//
// 恒等式（構造から保証）: リーグ ΣRE24 ≈ 0 / 1試合の ΣWPA = 勝者+0.5・敗者−0.5（ゼロサム）/
//                        リーグ 打席加重平均 LI = 1.0。
//
// 生の一球ログは永続化しない（§17）。派生に用いる liPairs は導出中のみ保持する一時バッファで、
// pass1 完了後は破棄する（集計カウンタと導出用の遷移対のみ・恒久保存しない）。
// ============================================================================

// 終端(試合決着)を表す afterKey のセンチネル（liPairs 用）。
const TERM_HWIN = -1; // ホーム勝ち（weHome=1）
const TERM_HLOSS = -2; // ホーム負け（weHome=0）
const TERM_TIE = -3; // 引分（weHome=0.5）

/** 状態キー = f(イニング, 表裏, 点差クリップ, 塁状態0..7, アウト0..2)。打者側視点の点差。 */
function ctxEncodeKey(innMax, diffClip, inning, isBottom, diff, base, outs) {
  const D = 2 * diffClip + 1;
  const inn = (inning < 1 ? 1 : inning > innMax ? innMax : inning) - 1;
  const d = (diff < -diffClip ? -diffClip : diff > diffClip ? diffClip : diff) + diffClip;
  return (((inn * 2 + (isBottom ? 1 : 0)) * D + d) * 8 + base) * 3 + outs;
}

/** キーから「表裏（bottom=ホーム攻撃）」を復元（LI導出でホーム視点へ変換するのに使う）。 */
function ctxKeyIsBottom(key, diffClip) {
  const D = 2 * diffClip + 1;
  return Math.floor(key / (D * 8 * 3)) % 2 === 1;
}

/** 24状態インデックス（塁 0..7 × アウト 0..2）。RE行列の添字。 */
function ctxReIndex(base, outs) {
  return outs * 8 + base;
}

/**
 * 回終了（3アウト）後の「次ハーフ先頭（無死・走者なし・攻守交代）」の状態キー。
 * 3アウト状態は WE表(アウト0..2)に無いため、勝率は次ハーフ先頭の値へ連続的に引き継ぐ
 * （そうしないと打者/投手側の WPA 配分が偏る）。次の攻撃側から見た点差 = 現守備側得点 − 現攻撃側得点。
 */
function nextHalfKey(innMax, diffClip, inning, curBottom, curBatScore, fldScore) {
  const nextBottom = !curBottom;
  const nextInning = curBottom ? inning + 1 : inning;
  return ctxEncodeKey(innMax, diffClip, nextInning, nextBottom, fldScore - curBatScore, 0, 0);
}

/**
 * このプレー確定後に試合が決着したか（simulateGame の break 条件と整合させる）。
 * @param {boolean} isBottom 攻撃側がホーム（裏）か
 * @param {number} inning
 * @param {number} batScore 攻撃側の得点（このプレー後）
 * @param {number} fldScore 守備側の得点
 * @param {number} outsAfter このプレー後のアウト数
 * @param {number} maxInnings 引分になる回数上限（ポストシーズンは Infinity）
 * @returns {{over:boolean, homeWon?:boolean, tie?:boolean}}
 */
function gameOverAfter(isBottom, inning, batScore, fldScore, outsAfter, maxInnings) {
  if (inning < 9) return { over: false };
  // サヨナラ: 裏でホーム(=攻撃側)が勝ち越し（アウト数に依らず即決着）
  if (isBottom && batScore > fldScore) return { over: true, homeWon: true };
  if (outsAfter >= 3) {
    if (!isBottom) {
      // 表終了: ホーム(=守備側)がリードなら決着（裏は行われない）
      if (fldScore > batScore) return { over: true, homeWon: true };
      return { over: false }; // ビジターリード or 同点 → 裏へ
    }
    // 裏終了: ホーム(=攻撃側)は勝ち越していれば既にサヨナラ済み。ここでは同点 or ビハインド。
    if (batScore < fldScore) return { over: true, homeWon: false }; // ビジター勝ち
    if (batScore === fldScore && inning >= maxInnings) return { over: true, tie: true };
    return { over: false }; // 同点続行
  }
  return { over: false };
}

// --- 導出コンテキスト（pass1: 集計のみ・乱数非消費） --------------------------

/**
 * pass1 用の集計コンテキストを作る（§B2）。onPlay で各プレーの状態遷移を受け、
 * RE(24状態→残り得点)・WE(状態→勝敗)・LIペア(打席の状態前後キー) を蓄える。
 */
function makeDeriveContext(cfg) {
  const c = cfg.tuning.context;
  return {
    mode: 'derive',
    innMax: c.innMax,
    diffClip: c.scoreDiffClip,
    maxInnings: 12,
    reSum: new Float64Array(24),
    reCount: new Float64Array(24),
    weWin: new Map(),
    weN: new Map(),
    liPairs: [], // flat [beforeKey, afterKey, ...]（PA のみ・一時バッファ）
    // 実行中の一時状態
    reHalfBuf: [], // flat [reIdx, runsBefore, ...]（当該ハーフ）
    inningRunsSoFar: 0,
    weGameBuf: [], // flat [key, isBottom(0/1), ...]（当該試合）
    startGame() {
      this.reHalfBuf.length = 0;
      this.inningRunsSoFar = 0;
      this.weGameBuf.length = 0;
    },
    onPlay(p) {
      deriveOnPlay(this, p);
    },
  };
}

function deriveOnPlay(gc, p) {
  const batScoreAfter = p.batScoreBefore + p.runsOnPlay;
  const go = gameOverAfter(p.battingIsHome, p.inning, batScoreAfter, p.fldScore, p.outsAfter, gc.maxInnings);
  const inningOver = p.outsAfter >= 3 || go.over;

  // RE: 「この状態から回終わりまでの得点」を回終了時に確定する
  gc.reHalfBuf.push(ctxReIndex(p.baseBefore, p.outsBefore), gc.inningRunsSoFar);
  gc.inningRunsSoFar += p.runsOnPlay;
  if (inningOver) {
    const total = gc.inningRunsSoFar;
    const buf = gc.reHalfBuf;
    for (let i = 0; i < buf.length; i += 2) {
      gc.reSum[buf[i]] += total - buf[i + 1];
      gc.reCount[buf[i]] += 1;
    }
    buf.length = 0;
    gc.inningRunsSoFar = 0;
  }

  // WE: 状態(打者側視点)を試合バッファに積み、決着時に「攻撃側が勝ったか」で確定する
  const beforeKey = ctxEncodeKey(gc.innMax, gc.diffClip, p.inning, p.battingIsHome, p.batScoreBefore - p.fldScore, p.baseBefore, p.outsBefore);
  gc.weGameBuf.push(beforeKey, p.battingIsHome ? 1 : 0);

  // LI: 打席の状態前→状態後（終端は centinel・回終了は次ハーフ先頭）を蓄え、WE表確定後に分散を取る
  if (p.kind === 'pa') {
    const afterKey = go.over
      ? go.tie
        ? TERM_TIE
        : go.homeWon
          ? TERM_HWIN
          : TERM_HLOSS
      : p.outsAfter >= 3
        ? nextHalfKey(gc.innMax, gc.diffClip, p.inning, p.battingIsHome, batScoreAfter, p.fldScore)
        : ctxEncodeKey(gc.innMax, gc.diffClip, p.inning, p.battingIsHome, batScoreAfter - p.fldScore, p.baseAfter, p.outsAfter);
    gc.liPairs.push(beforeKey, afterKey);
  }

  if (go.over) {
    const buf = gc.weGameBuf;
    for (let i = 0; i < buf.length; i += 2) {
      const key = buf[i];
      const isB = buf[i + 1] === 1;
      const battingWon = isB ? go.homeWon : !go.homeWon;
      gc.weN.set(key, (gc.weN.get(key) || 0) + 1);
      gc.weWin.set(key, (gc.weWin.get(key) || 0) + (go.tie ? 0.5 : battingWon ? 1 : 0));
    }
    buf.length = 0;
  }
}

// --- 表の焼き固め（pass1 → tables） ------------------------------------------

/**
 * pass1 の集計から RE行列・WE表(階層平滑化)・LI表(リーグ平均=1.0) を導出する（§B2）。
 * @param {ReturnType<makeDeriveContext>} gc
 * @param {Object} cfg
 * @returns {{re:Float64Array, we:Float64Array, li:Float64Array, innMax:number, diffClip:number,
 *   keyN:number, avgSwing:number, re0:number}}
 */
function deriveTables(gc, cfg) {
  const c = cfg.tuning.context;
  const innMax = gc.innMax;
  const diffClip = gc.diffClip;
  const D = 2 * diffClip + 1;
  const keyN = innMax * 2 * D * 8 * 3;

  // RE行列（24状態）
  const re = new Float64Array(24);
  for (let i = 0; i < 24; i++) re[i] = gc.reCount[i] ? gc.reSum[i] / gc.reCount[i] : 0;

  // WE表の階層平滑化: fine(状態) ← coarse(イニング/表裏/点差) ← diff周辺 ← 0.5
  const coarseN = new Float64Array(innMax * 2 * D);
  const coarseWin = new Float64Array(innMax * 2 * D);
  const diffN = new Float64Array(D);
  const diffWin = new Float64Array(D);
  for (const [key, n] of gc.weN) {
    const win = gc.weWin.get(key);
    const d = Math.floor(key / (8 * 3)) % D;
    const innB = Math.floor(key / (D * 8 * 3)); // = inn*2 + isBottom（0..innMax*2-1）
    coarseN[innB * D + d] += n;
    coarseWin[innB * D + d] += win;
    diffN[d] += n;
    diffWin[d] += win;
  }
  const diffWE = new Float64Array(D);
  for (let d = 0; d < D; d++) diffWE[d] = (diffWin[d] + c.weDiffK * 0.5) / (diffN[d] + c.weDiffK);
  const coarseWE = new Float64Array(innMax * 2 * D);
  for (let i = 0; i < coarseWE.length; i++) {
    const d = i % D;
    coarseWE[i] = (coarseWin[i] + c.weCoarseK * diffWE[d]) / (coarseN[i] + c.weCoarseK);
  }
  const we = new Float64Array(keyN);
  for (let key = 0; key < keyN; key++) {
    const n = gc.weN.get(key) || 0;
    const win = gc.weWin.get(key) || 0;
    const d = Math.floor(key / (8 * 3)) % D;
    const innB = Math.floor(key / (D * 8 * 3));
    const prior = coarseWE[innB * D + d];
    we[key] = (win + c.weSmoothK * prior) / (n + c.weSmoothK);
  }

  // LI表: 各状態の ΔWE(ホーム視点) の二乗平均平方根(=WE変化のばらつき) を、
  // 打席加重平均で 1.0 に正規化する（リーグ平均LI=1.0）。
  const liSumSq = new Float64Array(keyN);
  const liN = new Float64Array(keyN);
  const P = gc.liPairs;
  const weHomeOfKey = (key) => (ctxKeyIsBottom(key, diffClip) ? we[key] : 1 - we[key]);
  for (let i = 0; i < P.length; i += 2) {
    const b = P[i];
    const a = P[i + 1];
    const weHb = weHomeOfKey(b);
    const weHa = a === TERM_HWIN ? 1 : a === TERM_HLOSS ? 0 : a === TERM_TIE ? 0.5 : weHomeOfKey(a);
    const dw = weHa - weHb;
    liSumSq[b] += dw * dw;
    liN[b] += 1;
  }
  const swing = new Float64Array(keyN);
  let wSum = 0;
  let wN = 0;
  for (let k = 0; k < keyN; k++) {
    if (liN[k]) {
      swing[k] = Math.sqrt(liSumSq[k] / liN[k]);
      wSum += swing[k] * liN[k];
      wN += liN[k];
    }
  }
  const avgSwing = wN ? wSum / wN : 1; // 打席加重平均のスイング＝正規化基準
  const li = new Float64Array(keyN);
  for (let k = 0; k < keyN; k++) li[k] = avgSwing > 0 ? swing[k] / avgSwing : 1;

  return { re, we, li, innMax, diffClip, keyN, avgSwing, re0: re[ctxReIndex(0, 0)] };
}

// --- 加算コンテキスト（pass2: プレーごとに ΔRE/ΔWPA/LI を選手へ付与） ----------

/**
 * pass2 用の加算コンテキストを作る（§B2）。tables を参照し、各プレー確定点で
 * ΔRE を打者(+)/投手(−)・走塁は走者へ、ΔWE(=WPA) を打者/投手・救援登板時LIを積む。
 * gameHomeWpa は当該試合のホーム側WPA累計（= weHome(終端)−0.5 = 勝者±0.5 のゼロサム検査用）。
 */
function makeAccumulateContext(tables, cfg) {
  return {
    mode: 'accumulate',
    tables,
    innMax: tables.innMax,
    diffClip: tables.diffClip,
    maxInnings: 12,
    weHomePrev: 0.5, // 試合開始の中立勝率（アンカー）
    gameHomeWpa: 0,
    startGame() {
      this.weHomePrev = 0.5;
      this.gameHomeWpa = 0;
    },
    onPlay(p) {
      accumulateOnPlay(this, p);
    },
  };
}

function reGet(t, base, outs) {
  return t.re[ctxReIndex(base, outs)];
}
function weHomeOf(t, inning, isBottom, diff, base, outs) {
  return weHomeAtKey(t, ctxEncodeKey(t.innMax, t.diffClip, inning, isBottom, diff, base, outs));
}
function weHomeAtKey(t, key) {
  const wb = t.we[key]; // P(攻撃側が勝つ)
  return ctxKeyIsBottom(key, t.diffClip) ? wb : 1 - wb; // ホーム視点へ
}
function liGet(t, inning, isBottom, diff, base, outs) {
  const key = ctxEncodeKey(t.innMax, t.diffClip, inning, isBottom, diff, base, outs);
  return t.li[key];
}

function accumulateOnPlay(gc, p) {
  const t = gc.tables;
  const batScoreAfter = p.batScoreBefore + p.runsOnPlay;
  const go = gameOverAfter(p.battingIsHome, p.inning, batScoreAfter, p.fldScore, p.outsAfter, gc.maxInnings);
  const inningOver = p.outsAfter >= 3 || go.over;

  // RE24: ΔRE = RE(状態後) − RE(状態前) + このプレー得点。回終了/決着後は RE=0。
  const reB = reGet(t, p.baseBefore, p.outsBefore);
  const reA = inningOver ? 0 : reGet(t, p.baseAfter, p.outsAfter);
  const dRE = reA - reB + p.runsOnPlay;
  p.batSideStat.re24 += dRE;
  p.pitStat.re24 -= dRE;

  // WPA: ホーム視点の勝率変化を打者(攻撃側)/投手(守備側)へ。ΔWE の総和は telescoping で
  // weHome(終端)−0.5 = 勝者±0.5（ゼロサム）に一致する（weHomePrev をアンカーに逐次更新）。
  // 回終了(3アウト)後は次ハーフ先頭の勝率へ連続的に引き継ぐ（3アウト状態は表に無い）。
  const weNow = go.over
    ? go.tie
      ? 0.5
      : go.homeWon
        ? 1
        : 0
    : p.outsAfter >= 3
      ? weHomeAtKey(t, nextHalfKey(t.innMax, t.diffClip, p.inning, p.battingIsHome, batScoreAfter, p.fldScore))
      : weHomeOf(t, p.inning, p.battingIsHome, batScoreAfter - p.fldScore, p.baseAfter, p.outsAfter);
  const dHome = weNow - gc.weHomePrev;
  const batWPA = p.battingIsHome ? dHome : -dHome; // 攻撃側から見た勝率変化
  p.batSideStat.wpa += batWPA;
  p.pitStat.wpa -= batWPA;
  if (p.pitcherCur) p.pitcherCur.wpa -= batWPA; // 登板ぶんWPA（SD/MD判定用）
  gc.weHomePrev = weNow;
  gc.gameHomeWpa += dHome;

  // LI: 打席の状態前レバレッジを 打者(aLI)/投手(pLI) へ。救援は登板時(初打者)を gmLI へ。
  // WPA/LI（文脈中立）: 各打席の WPA を打席LIで割って累積（Clutch = WPA/pLI − WPA/LI の素）。
  if (p.kind === 'pa') {
    const li = liGet(t, p.inning, p.battingIsHome, p.batScoreBefore - p.fldScore, p.baseBefore, p.outsBefore);
    p.batSideStat.liSum += li;
    p.pitStat.liSum += li;
    if (li > 0) {
      p.batSideStat.wpaLiSum += batWPA / li;
      p.pitStat.wpaLiSum += -batWPA / li;
    }
    if (p.firstBatterOfApp) {
      p.pitStat.gmLiSum += li;
      p.pitStat.gmLiN += 1;
    }
  }
}

// ============================================================================
// 日程生成・シーズン実行・順位表（1-4a/f → フェーズA S3 で日程v2・日次起用AI・PSを導入）
//
// 日程v2（§S3-1）: リーグ内5相手×25（ホーム13/12交互）=125 ＋ 交流戦6相手×3=18 → 143試合。
//   「節」（day）単位に直列化: 各チーム1日1試合・連続 maxTeamConsecDays 日で休日を挟む。
//   試合のDH有無 = ホーム球団の所属リーグ規則（§S2-2）。
// 日次スタメンAI（§S3-2・usage.mjs）: 先発は中5日以上、救援は3連投禁止/前日30球で不可、
//   捕手厚めの休養・プラトーン・25試合ごとの観測ベース見直しで当日スタメンを組む。
// 各試合は階層シードで独立に実行（§17/§19）。起用状態（疲労・見直し）は day 順に逐次更新
// されるため、日程は day 昇順で回す。
// ポストシーズン（§S3-3・postseason.mjs）: CS→日本シリーズ。統計はレギュラーと分離集計。
// ============================================================================









/**
 * 日程v2を生成し「節」（day）単位に直列化する（§S3-1）。
 * 2リーグ×同数構成: リーグ内 各相手 inLeagueGamesPerOpp 試合（ホームは13/12を交互）＋
 * 交流戦 各相手 interLeagueGamesPerOpp 試合（3連戦を一方の本拠地で・ホスト交互）。
 * それ以外の構成は旧・総当たり近似にフォールバック（day直列化は同様に適用）。
 * @param {Array} teams league.teams（t.league でリーグ判定）
 * @param {Object} rng 決定論rng（シャッフル用）
 * @param {Object} cfg createConfig() の設定
 * @returns {Array<{home:string, away:string, day:number}>} day 昇順
 */
function buildSchedule(teams, rng, cfg) {
  const byLeague = new Map();
  for (const t of teams) {
    const key = t.league ?? '';
    if (!byLeague.has(key)) byLeague.set(key, []);
    byLeague.get(key).push(t.id);
  }
  const groups = [...byLeague.values()];
  const canV2 = groups.length === 2 && groups[0].length === groups[1].length && groups[0].length >= 2;

  const flat = [];
  if (canV2) {
    const nIn = cfg.league.inLeagueGamesPerOpp ?? 25;
    const nInter = cfg.league.interLeagueGamesPerOpp ?? 3;
    // リーグ内: 各ペア nIn 試合。「追加ホーム」（13試合目）は (i+j) 偶奇で振り分け＝
    // 各チームの追加ホスト数が2or3に均され、リーグ内ホームは62or63試合になる。
    for (const g of groups) {
      for (let i = 0; i < g.length; i++) {
        for (let j = i + 1; j < g.length; j++) {
          const extraToI = (i + j) % 2 === 0;
          for (let k = 0; k < nIn; k++) {
            const iHosts = (k % 2 === 0) === extraToI;
            flat.push(iHosts ? { home: g[i], away: g[j] } : { home: g[j], away: g[i] });
          }
        }
      }
    }
    // 交流戦: 各ペア nInter 試合を一方の本拠地で（(a+b) 偶奇でホスト交互＝各チーム3カード主催・
    // 交流戦ホームは9試合。総ホームは71or72試合でほぼ均衡）。
    const [A, B] = groups;
    for (let a = 0; a < A.length; a++) {
      for (let b = 0; b < B.length; b++) {
        const hostA = (a + b) % 2 === 0;
        for (let k = 0; k < nInter; k++) {
          flat.push(hostA ? { home: A[a], away: B[b] } : { home: B[b], away: A[a] });
        }
      }
    }
  } else {
    // フォールバック: 総当たり近似（対戦相手ごとの試合数 = round(G/(n-1))・ホストはペア内交互）
    const ids = teams.map((t) => t.id);
    const n = ids.length;
    const perPair = Math.round((cfg.league.gamesPerSeason ?? 143) / (n - 1));
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const startHome = (i + j) % 2;
        for (let k = 0; k < perPair; k++) {
          const iHosts = k % 2 === startHome;
          flat.push(iHosts ? { home: ids[i], away: ids[j] } : { home: ids[j], away: ids[i] });
        }
      }
    }
  }

  // シャッフル（同一カードの偏り解消）→ 節カレンダーへ直列化
  for (let i = flat.length - 1; i > 0; i--) {
    const j = rng.int(i + 1);
    const t = flat[i];
    flat[i] = flat[j];
    flat[j] = t;
  }
  return serializeDays(flat, teams, cfg.tuning?.schedule?.maxTeamConsecDays ?? 6);
}

/**
 * フラットな試合リストを day 単位へ直列化（§S3-1）。各チーム1日1試合。
 * 連続 maxConsec 日出場したチームは翌日を休日にする（連投制限・中6日の時間基盤）。
 */
function serializeDays(flat, teams, maxConsec) {
  const remaining = flat.slice();
  const consec = new Map(teams.map((t) => [t.id, 0]));
  const out = [];
  let day = 0;
  while (remaining.length) {
    const busy = new Set(); // 今日もう試合が入った（or 休日の）チーム
    for (const [tid, c] of consec) if (c >= maxConsec) busy.add(tid);
    const played = new Set();
    for (let i = 0; i < remaining.length; ) {
      const g = remaining[i];
      if (busy.has(g.home) || busy.has(g.away)) {
        i++;
        continue;
      }
      busy.add(g.home);
      busy.add(g.away);
      played.add(g.home);
      played.add(g.away);
      out.push({ home: g.home, away: g.away, day });
      remaining.splice(i, 1);
    }
    for (const t of teams) consec.set(t.id, played.has(t.id) ? consec.get(t.id) + 1 : 0);
    day++; // 誰も組めない日は全休日（consecがリセットされ翌日は必ず進む）
  }
  return out;
}

// ============================================================================
// 日次ループの共有部品（フェーズC1・ゲーム層から day 単位で駆動するために切り出し）。
//   simulateSeason（一括）と src/game/ の日次ランナーが「同一の per-game 処理」を共有する。
//   → ゲーム層で day を刻んでも、一括APIと bit 単位で同一結果になる（既存50較正が不変）。
// ============================================================================

/**
 * 編成表一式を作る（DH有/無の depth chart・リーグDH規則・teamById・後方互換 depthByTeam）。
 * F2-2: 一軍デプスチャートは「出場登録 rosterActive 人」（selectActiveRoster が支配下から選抜）
 * のみで編成する。登録外の支配下＋育成は二軍（season_runtime の farm リーグ）へ回る。
 * @param {{teams:Array,players:Array}} league
 * @returns {{leagueDh:Map, teamById:Map, chartsByTeam:Map, depthByTeam:Map, registeredByTeam:Map}}
 *   registeredByTeam: teamId → Set(登録選手id)（二軍ロスターの補集合判定に使う）
 */
/**
 * 離脱の単位換算（R3）: gamesLost（試合数）→ 日程の day 数。日程には全休日があるので day > game。
 * 実際の日程から実測する（cfg のフォールバック値には依存しない）。
 * @returns {number} 1試合あたりの day 数（例: 143試合が 170日なら 1.19）
 */
function dayScaleOf(schedule, cfg) {
  const games = cfg.league.gamesPerSeason ?? 143;
  if (!schedule.length || !games) return cfg.tuning.injury?.inSeason?.daysPerGame ?? 1;
  const lastDay = schedule[schedule.length - 1].day;
  return (lastDay + 1) / games;
}

function buildTeamCharts(league, cfg) {
  const leagueDh = new Map((cfg.league.leagues ?? []).map((l) => [l.id, l.dh]));
  const teamById = new Map(league.teams.map((t) => [t.id, t]));
  const chartsByTeam = new Map();
  const registeredByTeam = new Map();
  for (const t of league.teams) {
    const roster = league.players.filter((p) => p.teamId === t.id);
    const active = selectActiveRoster(roster, cfg); // 出場登録（roster<=rosterActive なら全員＝旧挙動）
    registeredByTeam.set(t.id, new Set(active.map((p) => p.id)));
    chartsByTeam.set(t.id, {
      dh: buildDepthChart(active, cfg, { dh: true }),
      noDh: buildDepthChart(active, cfg, { dh: false }),
    });
  }
  // 後方互換の depthByTeam: 各チームの所属リーグ規則での編成（リーグ未設定はDH有）
  const depthByTeam = new Map(
    league.teams.map((t) => {
      const c = chartsByTeam.get(t.id);
      return [t.id, (leagueDh.get(t.league) ?? true) ? c.dh : c.noDh];
    }),
  );
  return { leagueDh, teamById, chartsByTeam, depthByTeam, registeredByTeam };
}

/**
 * 観測成績の集計器を1つ作る（三層構造 layer2・未出場は空ライン＝priorへ回帰）。
 * 各パスは独立の集計器で走る（pass1導出用の集計は破棄する）。
 * @returns {{stats:Map, statFor:Function, getBat:Function}}
 */
function makeSeasonStats(season) {
  const stats = new Map();
  const emptyBat = createBattingLine();
  const emptyPitch = createPitchingLine();
  const statFor = (pid, teamId) => {
    let s = stats.get(pid);
    if (!s) {
      s = createPlayerSeason(pid, season);
      s.teamId = teamId;
      stats.set(pid, s);
    }
    return s;
  };
  const getBat = (pid) => {
    const s = stats.get(pid);
    return s ? s.batting : emptyBat;
  };
  // 当年の観測投手ライン（破綻救援ガード用・読み取り専用）。未出場は空ライン＝ガード非該当。
  const getPitch = (pid) => {
    const s = stats.get(pid);
    return s ? s.pitching : emptyPitch;
  };
  return { stats, statFor, getBat, getPitch };
}

/**
 * 1試合（schedule[gi]）を実行し、起用状態・順位/得点集計・文脈フックを更新する。
 * simulateSeason の runPass のループ本体をそのまま切り出したもの（挙動は完全同一）。
 * @param {{seed:number, park:Object, cfg:Object, leagueDh:Map, teamById:Map,
 *   chartsByTeam:Map, usageByTeam:Map, pass:Object}} ctx
 * @param {{home:string, away:string, day:number}} g
 * @param {number} gi schedule内index（＝階層シード座標。日次実行でも一括と同一にする鍵）
 * @returns {Object} simulateGame の結果
 */
function playScheduledGame(ctx, g, gi) {
  const { seed, park, cfg, leagueDh, teamById, chartsByTeam, usageByTeam, pass } = ctx;
  // 本拠地球場（D2・§11.2）: 試合はホーム球団の本拠地 park で行う（ビジターは相手本拠地 park）。
  //   parkByTeam 未提供時は単一 park（NEUTRAL/明示park）へフォールバック＝後方互換。
  const gamePark = (ctx.parkByTeam && ctx.parkByTeam.get(g.home)) || park;
  const rng = makeRng(hashSeed(seed, 'game', gi));
  // 試合のDH有無 = ホーム球団の所属リーグ規則（§S2-2。両チームとも同じ規則で編成）
  const gameDh = leagueDh.get(teamById.get(g.home).league) ?? true;
  const hC = chartsByTeam.get(g.home);
  const aC = chartsByTeam.get(g.away);
  const hU = usageByTeam.get(g.home);
  const aU = usageByTeam.get(g.away);

  // 先発投手（中5日以上）を先に決める＝互いのスタメン（プラトーン）判断の入力になる
  const hSp = selectStarter(hU, g.day, cfg);
  const aSp = selectStarter(aU, g.day, cfg);

  // 当日スタメン・ベンチ・救援可用リスト（usage.mjs）。乱数は試合ごとに独立の階層シード。
  const mkInit = (teamId, chart, u, starterPid, oppStarter, sideIdx) => {
    const sel = selectLineup(
      u,
      {
        day: g.day,
        dh: gameDh,
        oppPitcher: oppStarter,
        rng: makeRng(hashSeed(seed, 'lineup', gi, sideIdx)),
        getBat: pass.getBat,
      },
      cfg,
    );
    return {
      teamId,
      depth: chart,
      starterPid,
      lineup: sel.lineup,
      bench: sel.bench,
      // 破綻救援ガード（多年運用・原則2）: 当年観測(pass.getPitch)＋独立の階層シードRNGで確率間引き。
      //   penGuard は既存ストリーム(game/lineup)と別座標＝1年目（前歴なしで不作動）は byte 不変。
      availableRelievers: bullpenAvailable(u, g.day, cfg, pass.getPitch, makeRng(hashSeed(seed, 'penGuard', gi, sideIdx))),
      manager: teamById.get(teamId).manager,
      dh: gameDh,
      // R6: 先発が中4日以下で投げるか（故障リスク増・PubMed 39292010 IRR=0.78 の裏返し）。
      //   ローテが故障で枯れて代役先発を立てた日などに立つ。
      starterShortRest: (() => {
        const last = u.lastStartDay.get(starterPid);
        return last != null && g.day - last - 1 < cfg.tuning.injury.shortRestDays;
      })(),
    };
  };
  const hInit = mkInit(g.home, gameDh ? hC.dh : hC.noDh, hU, hSp, aC.dh.byId.get(aSp), 0);
  const aInit = mkInit(g.away, gameDh ? aC.dh : aC.noDh, aU, aSp, hC.dh.byId.get(hSp), 1);

  // 故障（R3・§10.5）: 試合中に発生した離脱を usage.injuredUntil へ立てる（以後の日程で
  //   スタメン/ローテ/救援可用から自動的に外れる）。ゲーム層ではさらに ctx.onInjury が
  //   ログへ積み、二軍からのIL補充（roster_moves）が動く。
  //   gamesLost(試合数) → day 数の換算は ctx.dayScale（日程には全休日があるので day > game）。
  const onInjury = (ev) => {
    const u = usageByTeam.get(ev.teamId);
    const days = Math.max(1, Math.round(ev.gamesLost * (ctx.dayScale ?? cfg.tuning.injury.inSeason.daysPerGame)));
    const until = g.day + days;
    if (u && (u.injuredUntil.get(ev.playerId) ?? 0) < until) u.injuredUntil.set(ev.playerId, until);
    if (ctx.onInjury) ctx.onInjury({ ...ev, day: g.day, until });
  };

  const res = simulateGame(hInit, aInit, cfg, rng, pass.statFor, gamePark, pass.onBattedBall, {
    gameContext: pass.gameContext,
    onEvent: pass.onEvent, // 観戦実況フック（フェーズC1・通常シムでは undefined＝無影響）
    onInjury,
    season: ctx.season ?? null, // R6: 直近故障の残債（指数減衰）の計算に使う
  });

  // 投手使用ログ→日次疲労、野手の連続出場・見直しタイマーを更新
  recordGameUsage(hU, { day: g.day, starterPid: hSp, lineup: hInit.lineup, pitcherLog: res.pitchers.home }, pass.getBat, cfg);
  recordGameUsage(aU, { day: g.day, starterPid: aSp, lineup: aInit.lineup, pitcherLog: res.pitchers.away }, pass.getBat, cfg);

  // WPA ゼロサム検査（§B2）: ホーム側WPA累計が 勝者±0.5/引分0 に一致するか（決着の整合）。
  if (pass.gameContext && pass.gameContext.mode === 'accumulate' && pass.contextCheck) {
    const expected = res.tie ? 0 : res.homeScore > res.awayScore ? 0.5 : -0.5;
    const err = Math.abs(pass.gameContext.gameHomeWpa - expected);
    if (err > pass.contextCheck.wpaMaxErr) pass.contextCheck.wpaMaxErr = err;
  }

  if (pass.standings) {
    const H = pass.standings.get(g.home);
    const A = pass.standings.get(g.away);
    H.g++;
    A.g++;
    H.rs += res.homeScore;
    H.ra += res.awayScore;
    A.rs += res.awayScore;
    A.ra += res.homeScore;
    // パークファクター導出用の得点スプリット（D2・§11.2）: この試合の総得点(両軍)を
    //   ホーム球団は「本拠地(home)」に、ビジター球団は「敵地(road)」に計上する。
    //   PF(team) = 本拠地の得点/試合 ÷ 敵地の得点/試合（自チーム攻守力は比で相殺）。
    const totalRuns = res.homeScore + res.awayScore;
    H.hpRuns = (H.hpRuns || 0) + totalRuns;
    H.hpG = (H.hpG || 0) + 1;
    A.rpRuns = (A.rpRuns || 0) + totalRuns;
    A.rpG = (A.rpG || 0) + 1;
    if (res.tie) {
      H.t++;
      A.t++;
    } else if (res.homeScore > res.awayScore) {
      H.w++;
      A.l++;
    } else {
      A.w++;
      H.l++;
    }
    // 交流戦成績（S4 UI）: 別リーグ同士の対戦を各チームの il へ計上
    if (teamById.get(g.home).league !== teamById.get(g.away).league) {
      if (res.tie) {
        H.il.t++;
        A.il.t++;
      } else if (res.homeScore > res.awayScore) {
        H.il.w++;
        A.il.l++;
      } else {
        A.il.w++;
        H.il.l++;
      }
    }
  }
  if (pass.runSplit) {
    const split = gameDh ? pass.runSplit.dh : pass.runSplit.noDh;
    split.games++;
    split.runs += res.homeScore + res.awayScore;
  }
  return res;
}

/**
 * 順位表を確定（勝率降順→得失点差）。リーグ別順位表も返す。
 * @param {Map} standings teamId → 順位行
 * @returns {{table:Array, standingsByLeague:Object}}
 */
function finalizeStandings(standings) {
  const table = [...standings.values()].sort((a, b) => winPct(b) - winPct(a) || b.rs - b.ra - (a.rs - a.ra));
  const standingsByLeague = {};
  for (const row of table) {
    const lid = row.league ?? 'ALL';
    (standingsByLeague[lid] = standingsByLeague[lid] || []).push(row);
  }
  return { table, standingsByLeague };
}

/**
 * 1シーズンを実行。
 * @param {{teams:Array,players:Array,masterSeed:number}} league
 * @param {Object} cfg
 * @param {{season?:number, seed?:number, park?:Object, postseason?:boolean, context?:boolean}} opts
 *   context=true で文脈指標（RE24/WPA/LI・§B2）を2パスで算出する。pass1でRE行列/WE表/LI表を
 *   大標本導出→焼き固め、pass2（同一シード＝同一試合の再走）で ΔRE/ΔWPA/LI を選手へ加算する。
 *   context無効時は単一パス＝従来と完全同一（乱数消費も不変・較正30指標が不変）。
 * @returns {{season:number, standings:Array, standingsByLeague:Object, playerSeasons:Array,
 *   statsById:Map, depthByTeam:Map, runSplit:Object, usageByTeam:Map, postseason:?Object,
 *   contextTables?:Object, contextCheck?:Object}}
 */
function simulateSeason(league, cfg, opts = {}) {
  const season = opts.season ?? 2026;
  const seed = opts.seed ?? league.masterSeed ?? 20260701;
  const park = opts.park ?? NEUTRAL_PARK;
  // 本拠地球場マップ（D2・§11.2）: 球団ごとの park（generateLeague が付与）。無い球団は単一 park へ。
  //   opts.park を明示した場合も、park を持つ球団はその本拠地 park を優先する（本拠地/ビジターの正しさ）。
  const parkByTeam = new Map(league.teams.map((t) => [t.id, t.park ?? park]));

  // 編成表（試合のDH有無=ホーム球団の所属リーグ規則。各チームDH用/DH無し用の両方を用意）
  const { leagueDh, teamById, chartsByTeam, depthByTeam } = buildTeamCharts(league, cfg);

  // 観測成績の読み取り専用ビューを持つ集計器を作る（S3 usage: 未出場は空ライン＝priorへ回帰）。
  // 各パスは独立の集計器で走る（三層構造・pass1導出用の集計は破棄する）。
  const makeStats = () => makeSeasonStats(season);

  const standings = new Map();
  for (const t of league.teams) {
    // il = 交流戦成績（S4 UI「2リーグ順位表＋交流戦成績」の素材。所属リーグが異なる対戦のみ勘定）
    standings.set(t.id, { ...createTeamSeason(t.id, season), name: t.name, league: t.league, il: { w: 0, l: 0, t: 0 } });
  }

  // スプレー収集（§16, §17: 生イベントは最新シーズンのみ保持）。opts.collectSpray で有効化。
  const spray = opts.collectSpray ? new Map() : null;
  const capPerBatter = opts.sprayCap ?? 600;
  const onBattedBall = spray
    ? (batterId, teamId, bb, result) => {
        let arr = spray.get(batterId);
        if (!arr) {
          arr = [];
          spray.set(batterId, arr);
        }
        if (arr.length < capPerBatter) {
          arr.push({ sprayDeg: bb.sprayDeg, distanceM: bb.distanceM, laDeg: bb.laDeg, evKmh: bb.evKmh, result });
        }
      }
    : undefined;

  // 日程v2（day昇順）。日程は一度だけ生成し、各パスで同一に消化する（同一試合＝決定論）。
  const schedule = buildSchedule(league.teams, makeRng(hashSeed(seed, 'schedule')), cfg);
  // 試合のDH規則別 得点集計（セパ得点差はDH規則単位で見る: 所属リーグ単位は球団戦力ノイズが乗る）
  const runSplit = { dh: { games: 0, runs: 0 }, noDh: { games: 0, runs: 0 } };

  /**
   * 日程を1パス消化する。集計器・順位/得点集計・文脈フックを注入する。
   * pass ごとに起用状態(usage)を新規生成＝同一シードなら選手成績も同一に進む（決定論）。
   * @param {{statFor:Function, getBat:Function, standings?:Map, runSplit?:Object,
   *   onBattedBall?:Function, gameContext?:Object, contextCheck?:Object}} pass
   * @returns {Map} usageByTeam（消化後の起用状態）
   */
  const runPass = (pass) => {
    const usageByTeam = new Map(league.teams.map((t) => [t.id, createUsageState(t, chartsByTeam.get(t.id), cfg)]));
    const ctx = { seed, park, parkByTeam, cfg, leagueDh, teamById, chartsByTeam, usageByTeam, pass, dayScale: dayScaleOf(schedule, cfg), season };
    schedule.forEach((g, gi) => playScheduledGame(ctx, g, gi));
    return usageByTeam;
  };

  // 文脈指標（§B2）の2パス導出: pass1でRE行列/WE表/LI表を大標本から焼き、pass2（同一試合の再走）で
  // 選手へ ΔRE/ΔWPA/LI を加算する。context無効時は単一パス（従来と完全同一・較正30指標が不変）。
  let contextTables = null;
  let contextCheck = null;
  if (opts.context) {
    const derive = makeStats();
    const dgc = makeDeriveContext(cfg);
    runPass({ statFor: derive.statFor, getBat: derive.getBat, getPitch: derive.getPitch, gameContext: dgc }); // pass1: 導出のみ（集計は破棄）
    contextTables = deriveTables(dgc, cfg);
    contextCheck = { wpaMaxErr: 0 };
  }

  const main = makeStats();
  const usageByTeam = runPass({
    statFor: main.statFor,
    getBat: main.getBat,
    getPitch: main.getPitch,
    standings,
    runSplit,
    onBattedBall,
    gameContext: contextTables ? makeAccumulateContext(contextTables, cfg) : null,
    contextCheck,
  });
  const stats = main.stats;

  const { table, standingsByLeague } = finalizeStandings(standings);

  // ポストシーズン（§S3-3）: 2リーグ制のときのみ。統計はレギュラーシーズンと分離集計。
  let postseason = null;
  if ((opts.postseason ?? true) && (cfg.league.leagues ?? []).length === 2) {
    postseason = simulatePostseason({
      rankings: cfg.league.leagues.map((l) => ({ id: l.id, rows: standingsByLeague[l.id] ?? [] })),
      chartsByTeam,
      teamById,
      leagueDh,
      cfg,
      seed: hashSeed(seed, 'postseason'),
      season, // 日本シリーズの主催リーグを年の偶奇で交互にするため（NPB方式）
      park,
      parkByTeam,
    });
  }

  return {
    season,
    standings: table,
    standingsByLeague,
    playerSeasons: [...stats.values()],
    statsById: stats,
    depthByTeam,
    spray,
    runSplit,
    usageByTeam,
    postseason,
    contextTables, // §B2: RE行列/WE表/LI表（context有効時のみ・非null）
    contextCheck, // §B2: { wpaMaxErr } ゼロサム検査の最大誤差（context有効時のみ）
  };
}

/** 勝率（引分除く） */
function winPct(t) {
  const dec = t.w + t.l;
  return dec === 0 ? 0 : t.w / dec;
}

/** ゲーム差（NPB慣例: 首位との勝敗差の平均。首位行の「-」表記は表示側で行う）。負値もそのまま返す。 */
function gamesBehind(leader, t) {
  return leader ? ((leader.w - t.w) + (t.l - leader.l)) / 2 : 0;
}


// ===== src/sim/metrics.mjs =====
// ============================================================================
// 選手別セイバー指標（1-7 / §5 §9）
// 生カウント(PlayerSeason)＋リーグ定数(1-6) から打撃・投手指標を算出する。
// 指標は「後付け」でなく、打席・打球のシミュレートの副産物である生カウントから湧く（付録原則1）。
// ============================================================================





const div = (a, b) => (b ? a / b : 0);

/**
 * ピタゴラス期待勝率（pythagenpat・チーム得失点から実力勝率を推定）＋幸運度（§セイバー団体指標）。
 * 指数は得点環境に応じて動く pythagenpat: exp = ((RS+RA)/G)^0.287。
 * luck = (実勝率 − 期待勝率) × 決着試合数（+なら得失点差の割に勝ち越し＝幸運/接戦強い）。
 * 三層構造に無関係な純関数（順位表の得失点=公開情報のみ使用）。
 * @param {{w:number,l:number,rs:number,ra:number}} t 順位表の行（引分は決着に含めない）
 * @returns {{expWinPct:number, luck:number, exponent:number}}
 */
function pythag(t) {
  const decided = (t.w || 0) + (t.l || 0);
  const rs = t.rs || 0;
  const ra = t.ra || 0;
  if (decided === 0 || rs + ra === 0) return { expWinPct: 0.5, luck: 0, exponent: 2 };
  const rpg = (rs + ra) / decided; // 1試合あたり総得点（両軍）
  const exp = Math.pow(Math.max(rpg, 0.5), 0.287); // pythagenpat 指数
  const expWinPct = Math.pow(rs, exp) / (Math.pow(rs, exp) + Math.pow(ra, exp));
  const actualWinPct = t.w / decided;
  return { expWinPct, luck: (actualWinPct - expWinPct) * decided, exponent: exp };
}

/** スプリット器→スラッシュライン（AVG/OBP/SLG/OPS・§B3b）。 */
function slashOf(sl) {
  const tb = sl.b1 + 2 * sl.b2 + 3 * sl.b3 + 4 * sl.hr;
  const obp = div(sl.h + sl.bb + sl.hbp, sl.ab + sl.bb + sl.hbp + sl.sf);
  const slg = div(tb, sl.ab);
  return { pa: sl.pa, ab: sl.ab, h: sl.h, hr: sl.hr, bb: sl.bb, so: sl.so, avg: div(sl.h, sl.ab), obp, slg, ops: obp + slg };
}

/** 打撃スプリット表示（対左/対右・得点圏(RISP)・ホーム/ビジター・§B3b）。 */
function battingSplits(ps) {
  const sp = (ps.batting && ps.batting.splits) || {};
  const g = (k) => slashOf(sp[k] || createSplitLine());
  return { vsL: g('vsL'), vsR: g('vsR'), risp: g('risp'), home: g('home'), away: g('away') };
}

/** 守備成分の表示（UZR分解 RngR/ErrR/ARM/DPR/rSB/framing・§B3b）。WAR用uzrRunsとは独立の内訳表示。 */
function playerFielding(ps, cfg, lc) {
  const comp = uzrComponents(ps, cfg, lc);
  const f = ps.fielding;
  return {
    ...comp, // pos/rngR/errR/framing/arm/dpr/rSB/total
    armOpp: f.armOpp || 0,
    dpOpp: f.dpOpp || 0,
    dpTurned: f.dpTurned || 0,
    sbAllowed: f.sbAllowed || 0,
    csMade: f.csMade || 0,
  };
}

/** 打撃指標（wOBA/wRAA/wRC+ ＋ B3a: xBA/xSLG/xwOBA・Barrel%等・OPS+/wRC/SecA…） */
function playerBatting(ps, lc) {
  const b = ps.batting;
  const tb = b.b1 + 2 * b.b2 + 3 * b.b3 + 4 * b.hr;
  const avg = div(b.h, b.ab);
  const obp = div(b.h + b.bb + b.hbp, b.ab + b.bb + b.hbp + b.sf);
  const slg = div(tb, b.ab);
  const babip = div(b.h - b.hr, b.ab - b.so - b.hr + b.sf);

  const raw = rawRunValuePerPA(b, lc.linearWeights);
  const woba = lc.wobaScale ? lc.wobaScale * raw : 0;
  const wraa = (raw - (lc.lgRawPerPA || 0)) * b.pa;
  const wrcPlus =
    lc.lgRunsPerPA && b.pa ? ((wraa / b.pa + lc.lgRunsPerPA) / lc.lgRunsPerPA) * 100 : 100;
  // パーク補正 wRC+（D2・§11.2）: 本拠地PFで割る（打高球場の打者は割り引かれ、リーグ100中心に戻る）。
  //   PF未提供（中立単一park/teamId不明）時は素の wRC+ と一致（後方互換）。
  const pf = (lc.parkBatByTeam && ps.teamId && lc.parkBatByTeam.get(ps.teamId)) || 1;
  const wrcPlusPF =
    lc.lgRunsPerPA && b.pa ? ((wraa / b.pa + lc.lgRunsPerPA) / (pf * lc.lgRunsPerPA)) * 100 : wrcPlus;

  // --- B3a: 期待値系（xBA/xSLG/xwOBA）。打球イベントの期待out率/塁打分布(rng抽選前)の累積から。 ---
  const xh = b.xB1 + b.xB2 + b.xB3 + b.xHR;
  const xtb = b.xB1 + 2 * b.xB2 + 3 * b.xB3 + 4 * b.xHR;
  const xba = div(xh, b.ab);
  const xslg = div(xtb, b.ab);
  const W = lc.linearWeights || LINEAR_WEIGHTS;
  const ibb = b.ibb || 0;
  const xDenom = b.ab + b.bb - ibb + b.sf + b.hbp; // wOBAと同一の分母
  const xNum = W.bb * (b.bb - ibb) + W.hbp * b.hbp + W.b1 * b.xB1 + W.b2 * b.xB2 + W.b3 * b.xB3 + W.hr * b.xHR;
  const xRaw = xDenom ? xNum / xDenom : 0;
  const xwoba = lc.wobaScale ? lc.wobaScale * xRaw : 0;

  // --- B3a: 打球分類・質（分母=bbEvents）。GB/LD/FB/PU%・Pull/Cent/Oppo%・Barrel/HardHit/SweetSpot% ---
  const bbe = b.bbEvents;
  // --- B3a: 伝統系の派生（OPS+/wRC/TB/XBH/SecA/BB/K/ISO） ---
  const opsPlus = lc.lgOBP && lc.lgSLG ? 100 * (obp / lc.lgOBP + slg / lc.lgSLG - 1) : 100;
  const wrc = wraa + (lc.lgRunsPerPA || 0) * b.pa; // wRC = wRAA + lgR/PA×PA
  const xbh = b.b2 + b.b3 + b.hr; // 長打(二塁打+三塁打+本塁打)
  const secA = div(tb - b.h + b.bb + (b.sb - b.cs), b.ab); // Secondary Average

  return {
    pa: b.pa,
    ab: b.ab,
    h: b.h,
    hr: b.hr,
    rbi: b.rbi,
    sb: b.sb,
    bb: b.bb,
    so: b.so,
    avg,
    obp,
    slg,
    ops: obp + slg,
    iso: slg - avg,
    babip,
    kPct: div(b.so, b.pa),
    bbPct: div(b.bb, b.pa),
    woba,
    wraa,
    wrcPlus,
    wrcPlusPF, // パーク補正 wRC+（D2・§11.2）
    pf, // 本拠地パークファクター（打者補正・1.0=中立）
    tb,
    // --- B3a 追加 ---
    xba,
    xslg,
    xwoba,
    opsPlus,
    wrc,
    xbh,
    secA,
    bbK: div(b.bb, b.so),
    gbPct: div(b.bbGB, bbe),
    ldPct: div(b.bbLD, bbe),
    fbPct: div(b.bbFB, bbe),
    puPct: div(b.bbPU, bbe),
    pullPct: div(b.bbPull, bbe),
    centPct: div(b.bbCent, bbe),
    oppoPct: div(b.bbOppo, bbe),
    barrelPct: div(b.barrels, bbe),
    hardHitPct: div(b.hardHits, bbe),
    sweetSpotPct: div(b.sweetSpots, bbe),
    evAvg: div(b.evSum, bbe),
    evMax: b.evMax,
    bbEvents: bbe,
    // --- B2 文脈指標（RE24/WPA/LI・§B2。context有効時のみ非0） ---
    re24: b.re24,
    wpa: b.wpa,
    aLI: div(b.liSum, b.pa), // 打席加重レバレッジ（リーグ平均=1.0）
    wpaLI: b.wpaLiSum, // 文脈中立WPA（Σ 打席WPA/打席LI）
    clutch: div(b.wpa, div(b.liSum, b.pa)) - b.wpaLiSum, // Clutch = WPA/aLI − WPA/LI
  };
}

/**
 * UBRのシナリオ別内訳1件ぶんのrun価値（§req_20260708・Fangraphs UBR/BP EqBRRのRE24分解準拠）。
 * シナリオごとにリーグ平均進塁率で中心化し、run/機会の重み(runW)を掛ける（リーグΣ≈0）。
 */
function ubrScenario(br, lc, key, runW) {
  const opp = br[`${key}Opp`] || 0;
  if (!opp) return 0;
  const rate = lc && lc.lgAdvRateByScenario ? lc.lgAdvRateByScenario[key] || 0 : 0;
  return ((br[`${key}Taken`] || 0) - rate * opp) * runW;
}

/**
 * 走塁指標（§6／§req_20260708強化）。BsR = wSB + UBR + wGDP。
 * UBR はシナリオ別（単打での二塁走者本塁突入・二塁打での一塁走者本塁突入・単打での一塁走者
 * 三塁進塁・タッグアップ）にRE24分解して合算する（Fangraphs UBR/Baseball Prospectus EqBRR準拠。
 * 単一の全シナリオ合算率で中心化する旧方式は、進塁機会ごとに基準確率が異なるため偏りがあった）。
 */
function playerBaserunning(ps, cfg, lc) {
  const b = ps.batting;
  // wSB（監査C1）: リーグ基準 lgwSB×(一塁到達機会) を控除して中心化する。
  // 走らない選手は僅かに負の基準、盗塁者は正味加点というゼロ点になり、リーグwSB総和≈0。
  const sbOpp = (b.b1 || 0) + (b.bb || 0) + (b.hbp || 0) - (b.ibb || 0);
  // 盗塁の得点価値: runCS は得点環境依存の可変式（lc.runCS）。正典 §6.2
  const runSB = cfg.tuning.run.runSB;
  const runCS = (lc && lc.runCS != null) ? lc.runCS : cfg.tuning.run.runCS;
  const lgwSBrate =
    lc && lc.lgSBOpp ? (lc.lgSB * runSB + lc.lgCS * runCS) / lc.lgSBOpp : 0;
  const wSB = b.sb * runSB + b.cs * runCS - lgwSBrate * sbOpp;
  const br = ps.baserunning || {};
  // wGDP: 期待併殺(リーグ率×機会)より少なく併殺した分がプラス。§6
  const gdpOpp = br.gdpOpp || 0;
  const wGDP =
    lc && lc.lgGDPrate != null ? (lc.lgGDPrate * gdpOpp - (b.gdp || 0)) * Math.abs(cfg.tuning.gdp.runGDP) : 0;
  // UBR: シナリオ別に中心化して合算（走者Speed/IQ）。§6／§req_20260708
  const rw = cfg.tuning.run;
  const ubr =
    ubrScenario(br, lc, 'adv2h1b', rw.runUBR) +
    ubrScenario(br, lc, 'adv1h2b', rw.runUBR) +
    ubrScenario(br, lc, 'adv1t3b', rw.runUBR1t3b) +
    ubrScenario(br, lc, 'tag', rw.runUBRTag) +
    // realism_r1_baserunning_spec §A/§B: ゴロ進塁・タッグアップ本塁生還の新シナリオ
    ubrScenario(br, lc, 'gbAdv3h', rw.runGbAdv3h) +
    ubrScenario(br, lc, 'gbAdv2t3', rw.runGbAdv2t3) +
    ubrScenario(br, lc, 'tag3h', rw.runTag3h);
  return {
    sb: b.sb,
    cs: b.cs,
    sbPct: b.sb + b.cs ? b.sb / (b.sb + b.cs) : 0,
    gdp: b.gdp,
    wSB,
    ubr,
    wGDP,
    bsr: wSB + ubr + wGDP,
    // --- 走塁の追加集計（XBT%）---
    //   ※ Spd（Speed Score）は撤去した。FanGraphs 自身が「outdated / run スケールでない。UBR を使え」と
    //     明言しており、各 factor の正確な係数は一次情報で確認できなかった（Wikipedia 単独ソースかつ
    //     一般に流布する式と係数が食い違う）。旧実装は「守備位置速度」という打席を1つも見ない
    //     ルックアップ項を含み、しかもその表はこのシムの生成分布と矛盾していた。
    //     走塁の価値は BsR = UBR + wSB + wGDP（すべて一次情報で定義・生カウントから創発）で表す。
    //     正典: thyroxin/research/fielding_metrics_reference.md §7
    xbt: div(br.advTaken || 0, br.advOpp || 0), // 追加進塁率（advTaken/advOpp）
    advOpp: br.advOpp || 0,
    advTaken: br.advTaken || 0,
    // --- B2 文脈指標（走塁イベントのRE24/WPA・§B2。context有効時のみ非0） ---
    re24: br.re24 || 0, // 盗塁/追加進塁の得点期待値寄与
    wpa: br.wpa || 0, // 盗塁/追加進塁の勝率寄与
  };
}

/**
 * 投手指標（ERA/FIP ＋ B3a: xFIP/SIERA/kwERA/ERA-/FIP-/xFIP-/K-BB%/LOB%/被打球分類/HR-FB/QS）。
 * FIPはFG式 (13HR+3(BB−IBB+HBP)−2K)/IP + C（敬遠は投手の技量でないため除外・S3）。
 * @param {Object} ps PlayerSeason
 * @param {Object} lc リーグ定数（lgHRFB/lgERA/lgFIP/fipConstant を含む）
 * @param {Object} [cfg] 設定（SIERA/kwERA係数=cfg.tuning.metrics。省略時は METRICS_CONST 既定）
 */
function playerPitching(ps, lc, cfg = null) {
  const p = ps.pitching;
  const ip = p.outs / 3;
  const m = (cfg && cfg.tuning && cfg.tuning.metrics) || METRICS_CONST;
  // 本拠地パークファクター（D2・§11.2）。PF未提供/teamId不明なら1.0（＝park補正=素の値）。
  const pfPit = (lc.parkPitByTeam && ps.teamId && lc.parkPitByTeam.get(ps.teamId)) || 1;
  const uBBhbp = p.bb - (p.ibb || 0) + p.hbp;
  const fipRaw = ip ? (13 * p.hr + 3 * uBBhbp - 2 * p.so) / ip : 0;
  const fip = ip ? fipRaw + (lc.fipConstant || 0) : 0;
  const era = div(p.er * 9, ip);
  const kPct = div(p.so, p.bf);
  const bbPct = div(p.bb, p.bf);

  // xFIP（§B3a）: 被HRを 被FB×lgHR/FB に置換（FG式）。fipConstant共通ゆえ リーグxFIP=リーグFIP。
  const xHRexp = p.bbFB * (lc.lgHRFB || 0);
  const xfipRaw = ip ? (13 * xHRexp + 3 * uBBhbp - 2 * p.so) / ip : 0;
  const xfip = ip ? xfipRaw + (lc.fipConstant || 0) : 0;

  // SIERA（FanGraphs公開式・Swartz）。netGB²項は符号保存（GB>FB+PU で好投側=負寄与）。
  const pa = p.bf;
  const soR = div(p.so, pa);
  const bbR = div(p.bb, pa);
  const netGB = div(p.bbGB - p.bbFB - p.bbPU, pa);
  const S = m.siera;
  const siera = pa
    ? S.c0 +
      S.cSO * soR +
      S.cBB * bbR +
      S.cNet * netGB +
      S.cSO2 * soR * soR +
      S.cNet2 * netGB * Math.abs(netGB) +
      S.cSOnet * soR * netGB +
      S.cBBnet * bbR * netGB
    : 0;

  // kwERA = 5.40 − 12×(K% − BB%)
  const kwera = m.kwERA.c0 - m.kwERA.k * (kPct - bbPct);

  // LOB% = (H+BB+HBP−R)/(H+BB+HBP−1.4HR)（残塁率）
  const lobDen = p.h + p.bb + p.hbp - 1.4 * p.hr;
  const lobPct = lobDen ? (p.h + p.bb + p.hbp - p.r) / lobDen : 0;

  // 被打球分類（分母=bbEvents）と HR/FB
  const bbe = p.bbEvents;

  return {
    g: p.g,
    gs: p.gs,
    ip,
    bf: p.bf,
    w: p.w,
    l: p.l,
    sv: p.sv,
    hld: p.hld,
    so: p.so,
    bb: p.bb,
    h: p.h,
    hr: p.hr,
    era,
    fip,
    whip: div(p.h + p.bb, ip),
    kPer9: div(p.so * 9, ip),
    bbPer9: div(p.bb * 9, ip),
    hrPer9: div(p.hr * 9, ip),
    kPct,
    bbPct,
    // --- B3a 追加 ---
    xfip,
    siera,
    kwera,
    kbbPct: kPct - bbPct,
    lobPct,
    // リーグ=100基準（低いほど良い）。素の値は非パーク補正。park補正版は下の *PF（D2・§11.2）。
    eraMinus: lc.lgERA ? (era / lc.lgERA) * 100 : 100,
    fipMinus: lc.lgFIP ? (fip / lc.lgFIP) * 100 : 100,
    xfipMinus: lc.lgFIP ? (xfip / lc.lgFIP) * 100 : 100,
    // パーク補正版（D2）: 本拠地PFで割る（打高球場の投手は ERA-/FIP- が優遇＝低くなる）。
    //   PF未提供時は素の値と一致（後方互換）。
    pf: pfPit,
    eraMinusPF: lc.lgERA ? (era / (pfPit * lc.lgERA)) * 100 : 100,
    fipMinusPF: lc.lgFIP ? (fip / (pfPit * lc.lgFIP)) * 100 : 100,
    gbPct: div(p.bbGB, bbe),
    ldPct: div(p.bbLD, bbe),
    fbPct: div(p.bbFB, bbe),
    puPct: div(p.bbPU, bbe),
    hrFbPct: div(p.hr, p.bbFB),
    qs: p.qs,
    bbEvents: bbe,
    // --- B2 文脈指標（RE24/WPA/LI・§B2。context有効時のみ非0） ---
    re24: p.re24,
    wpa: p.wpa,
    pLI: div(p.liSum, p.bf), // 投手の平均レバレッジ（リーグ平均=1.0）
    gmLI: div(p.gmLiSum, p.gmLiN), // 登板時レバレッジ（救援WARのレバレッジ加重に使用）
    wpaLI: p.wpaLiSum, // 文脈中立WPA（Σ 被WPA/打席LI）
    clutch: div(p.wpa, div(p.liSum, p.bf)) - p.wpaLiSum, // Clutch = WPA/pLI − WPA/LI
    sd: p.sd, // シャットダウン（1登板WPA ≥ +0.06）
    md: p.md, // メルトダウン（1登板WPA ≤ −0.06）
  };
}


// ===== src/sim/war.mjs =====
// ============================================================================
// WAR算出（2-9 / §9）— 企画の一番の売り「WARまで自然に出る」
//
// 野手WAR = (wRAA + BsR + UZR + posAdj + repl) / RPW
// 投手WAR = (lgFIP − FIP)/9 × IP / RPW + (IP/9) × replPer9(役割)
//   役割別代替水準（S3・FanGraphs方式 B-5）: 先発 0.12 / 救援 0.03 wins/9IP を GS/G で按分
//   （旧 replFIP = lgFIP × replFipMult は廃止）
//
// 各項はここまでの副産物（wRAA=1-7, BsR=2-4/2-6, UZR=2-8, posAdj=位置補正, repl=代替水準）。
// 位置価値は posAdj の一箇所のみで計上（UZR側で二重計上しない・レビューB-5）。
// 試合数依存定数(1350/600)は §18/M3 に従い config・143試合基準を尊重。
// ============================================================================




/**
 * 守備位置補正（runs）。各ポジションの守備イニングに比例する。
 * FanGraphs 式: `posAdj = Σ_pos ( 値[pos] × (そのポジションの守備イニング / 1458) )`
 *   ＝ `((Innings/9) / 162) × 値`。分母は **1458**（162守備試合×9イニング）であり 1350 ではない。
 * 旧実装は FanGraphs の値に Baseball-Reference の分母(1350)を掛けており、補正を 8% 過大に与えていた。
 * 正典: sabermetrics_glossary.md §7.5 / §10.3
 */
function posAdjRuns(ps) {
  let adj = 0;
  for (const pos of Object.keys(ps.fielding.positionOuts)) {
    const innings = ps.fielding.positionOuts[pos] / 3;
    adj += (POSITION_ADJUST_PER_162G[pos] || 0) * (innings / POSITION_ADJUST_INNINGS_FULL);
  }
  return adj;
}

/**
 * 代替水準（野手）を run 単位で返す（内訳表示の単位を wraa/bsr/uzr/posAdj と揃えるため）。
 * FanGraphs 方式: リーグ全体の代替勝利の総量を固定し、打席比で按分してから rpw を掛けて run へ戻す。
 *   代替wins(選手) = 代替wins(リーグ総量) × PA / lgPA
 *   代替runs(選手) = 代替wins(選手) × rpw
 * → 代替勝利は得点環境にもリーグ総打席にも依存しない（時代が動いても総WARが動かない）。
 * lc が無い（単体呼び出し・テスト）場合のみ、旧来の (PA/600)×replBatterPer600 [run] にフォールバックする。
 */
function replacementRuns(ps, cfg, lc, rpw) {
  if (lc && lc.replHitterWinsTotal && lc.lgPA) {
    return lc.replHitterWinsTotal * (ps.batting.pa / lc.lgPA) * rpw;
  }
  return (ps.batting.pa / 600) * cfg.tuning.replBatterPer600;
}

/** 野手WAR（構成要素つき） */
function hitterWAR(ps, cfg, lc) {
  const bat = playerBatting(ps, lc);
  const bsr = playerBaserunning(ps, cfg, lc).bsr;
  const uzr = uzrRuns(ps, cfg, lc);
  const posAdj = posAdjRuns(ps);
  const rpw = lc.rpw || 9.3;
  const repl = replacementRuns(ps, cfg, lc, rpw);
  const raRuns = bat.wraa + bsr + uzr + posAdj + repl;
  return {
    wraa: bat.wraa,
    bsr,
    uzr,
    posAdj,
    repl,
    war: raRuns / rpw,
  };
}

/** 投手WAR（役割別代替水準・S3）。平均比の価値 + 役割別の代替水準ボーナス。
 *  救援WARのレバレッジ加重（§B2・FG方式・req_1 §8.3「WARの死角」の完成）:
 *    登板時レバレッジ gmLI があるとき、救援ぶんの代替水準対比runに (1+gmLI)/2 を乗じる。
 *    先発は不変（gsShare で加重＝gsShare=1 なら mult=1）。gmLI 未算出（文脈指標オフ＝
 *    gmLiN=0）のときは mult=1 に落ちるため、既存の較正済みWARは完全に不変（30指標を守る）。 */
function pitcherWAR(ps, cfg, lc) {
  const pit = playerPitching(ps, lc);
  const lgFIP = lc.lgFIP || 3.8;
  const rpw = lc.rpw || 9.3;
  // 役割 = GS/G 比で先発/救援を按分（スイングマンは中間の代替水準になる）
  const gsShare = pit.g ? pit.gs / pit.g : 0;
  const replPer9 = gsShare * cfg.tuning.replStarterPer9 + (1 - gsShare) * cfg.tuning.replRelieverPer9;
  let war = (((lgFIP - pit.fip) / 9) * pit.ip) / rpw + (pit.ip / 9) * replPer9;
  // レバレッジ加重（救援ぶんのみ・gmLI があるとき）
  const gmLiN = ps.pitching.gmLiN || 0;
  const gmLI = gmLiN ? ps.pitching.gmLiSum / gmLiN : null;
  const leverageMult = gmLI != null ? 1 + (1 - gsShare) * ((1 + gmLI) / 2 - 1) : 1;
  war *= leverageMult;
  return { ip: pit.ip, fip: pit.fip, replPer9, gmLI, leverageMult, war };
}

/** 選手のWAR（役割で分岐） */
function playerWAR(player, ps, cfg, lc) {
  return player.role === 'pitcher' ? pitcherWAR(ps, cfg, lc).war : hitterWAR(ps, cfg, lc).war;
}

// 架空選手ペナント・シミュレーション — エンジン核（ESモジュール・単一エントリ）

// F2-2: 出場登録29人（一軍デプスチャート=登録者のみ）＋二軍リーグ並走＝エンジン挙動が 0.9.1 から
//   変わる（verify-identity/smoke の新ベースラインは F2-5 の再較正確定後に取得する）。
const ENGINE_VERSION = '0.10.0-farm';

// RNG・モデル層・config・生成器 を再エクスポート（Node/ブラウザ双方の単一エントリ）

// --- エンジン同一性の門番 ---------------------------------------------------
// 同一シードで固定長の決定論列を返す。Node出力と、build.mjs がHTMLへインライン化した
// ブラウザ相当の出力が完全一致することを verify-identity.mjs が機械検証する。
// （§17 決定論RNG / §19 全国対戦のチート突合 の再現性を、開発初日から担保するため）
function selfCheck(seed = 20260701, n = 8) {
  const rnd = mulberry32(seed);
  const out = [];
  for (let i = 0; i < n; i++) out.push(Math.round(rnd() * 1e9));
  return out;
}


// ===== src/game/boxscore.mjs =====
// ============================================================================
// フェーズE4: 簡易ボックススコア（観戦イベント列 → 両軍打者/投手の当日集計行）
//
//   buildBoxScore(events) … simulateGame の onEvent 構造化イベント列
//     （start/atbat/pitch/pa/bunt/steal/sub/end・すべて乱数非消費）から、
//     日程・結果タブの「簡易ボックススコア」に必要な当日集計だけを組む純関数。
//
// 設計原則:
//   - §17（生イベント非永続）: 生イベント列はこの集計を作ったら捨てる。playerGameLog には
//     この「集計行のみ」が rec.box として残る（save の seasonState.playerGameLog も集計値のみ）。
//   - 決定論: 入力イベント列の純関数・乱数非使用。load の replay（advanceRuntimeDay 再走）でも
//     同一イベント列から同一の box が再構築される（セーブ→ロード→リプレイで bit 一致）。
//   - 簡易であること: 公式記録の細部（継承走者の失点帰属・暴投得点の打点除外等）は
//     「現在の投手/打者へ帰属」の近似で足りる（UI の当日ライン表示用。シーズン公式集計は
//     statline が正・本集計はそれに影響しない）。
// ============================================================================

/** 安打として数える打席結果。 */
const BOX_HIT_SET = new Set(['1B', '2B', '3B', 'HR']);

/**
 * 観戦イベント列から簡易ボックススコアを組む。
 * @param {Array} events simulateGame onEvent の構造化イベント列（1試合ぶん）
 * @returns {Object} {
 *   home, away, starters:{home,away},
 *   line:[{i,t,b}] イニング別得点（t=表/b=裏・null=未実施（サヨナラX等））,
 *   hits:{home,away}, errs:{home,away}, innings,
 *   batters:{home:[{pid,ord,pos,ab,h,hr,rbi,bb,k}],away:[...]}（出場順・bbは四死球）,
 *   pitchers:{home:[{pid,outs,np,h,r,bb,k,hr}],away:[...]}（登板順・rは在板中の失点）
 * }
 */
function buildBoxScore(events) {
  const box = {
    home: null,
    away: null,
    starters: { home: null, away: null },
    line: [],
    hits: { home: 0, away: 0 },
    errs: { home: 0, away: 0 },
    innings: 9,
    batters: { home: [], away: [] },
    pitchers: { home: [], away: [] },
  };
  const batBy = new Map(); // pid → 打者集計行
  const pitBy = new Map(); // pid → 投手集計行
  const slots = { home: [], away: [] }; // 打順スロット（交代を追跡・pid列）
  const scores = { home: 0, away: 0 }; // イベント時点のスコア（batScore 同期＝暴投得点も拾う）
  const curPit = { home: null, away: null }; // 現在の投手（集計行参照）
  let curOuts = 0; // 現ハーフのアウト（盗塁死/犠打のアウト帰属用）
  let lastBatSide = 'away'; // pitch イベントの帰属（atbat が先行するため常に正しい）

  const sideOf = (teamId) => (teamId === box.home ? 'home' : 'away');
  const lineOf = (inning) => {
    let c = box.line.find((x) => x.i === inning);
    if (!c) { c = { i: inning, t: null, b: null }; box.line.push(c); }
    return c;
  };
  const startHalf = (inning, half) => {
    const c = lineOf(inning);
    const k = half === 'bottom' ? 'b' : 't';
    if (c[k] == null) c[k] = 0;
  };
  const batterOf = (pid, side, ord, pos) => {
    let b = batBy.get(pid);
    if (!b) { b = { pid, ord, pos, ab: 0, h: 0, hr: 0, rbi: 0, bb: 0, k: 0 }; batBy.set(pid, b); box.batters[side].push(b); }
    return b;
  };
  const pitcherOf = (pid, side) => {
    let p = pitBy.get(pid);
    if (!p) { p = { pid, outs: 0, np: 0, h: 0, r: 0, bb: 0, k: 0, hr: 0 }; pitBy.set(pid, p); box.pitchers[side].push(p); }
    return p;
  };
  /** batScore の増分をイニング得点と現投手の失点へ配る（暴投/捕逸の得点も batScore に含まれる）。 */
  const syncScore = (batSide, batScore, inning, half) => {
    const d = batScore - scores[batSide];
    if (d > 0) {
      const c = lineOf(inning);
      const k = half === 'bottom' ? 'b' : 't';
      c[k] = (c[k] ?? 0) + d;
      const fld = batSide === 'home' ? 'away' : 'home';
      if (curPit[fld]) curPit[fld].r += d;
      scores[batSide] = batScore;
    }
  };

  for (const e of events) {
    if (e.type === 'start') {
      box.home = e.home;
      box.away = e.away;
      box.starters.home = e.homeStarter;
      box.starters.away = e.awayStarter;
      curPit.home = pitcherOf(e.homeStarter, 'home');
      curPit.away = pitcherOf(e.awayStarter, 'away');
      for (const [side, lu] of [['home', e.homeLineup], ['away', e.awayLineup]]) {
        slots[side] = lu.map((s) => s.playerId);
        lu.forEach((s, i) => batterOf(s.playerId, side, i + 1, s.pos));
      }
    } else if (e.type === 'atbat') {
      const bSide = sideOf(e.batTeam);
      const fSide = bSide === 'home' ? 'away' : 'home';
      lastBatSide = bSide;
      startHalf(e.inning, e.half);
      curOuts = e.outs;
      // 現投手を権威値（atbat.pitcherId）で同期＋球数を登板累計（pitcherPitches）で補正
      curPit[fSide] = pitcherOf(e.pitcherId, fSide);
      if (e.pitcherPitches > curPit[fSide].np) curPit[fSide].np = e.pitcherPitches;
    } else if (e.type === 'pitch') {
      const fld = lastBatSide === 'home' ? 'away' : 'home';
      if (curPit[fld]) curPit[fld].np++;
    } else if (e.type === 'pa') {
      const bSide = sideOf(e.batTeam);
      const fSide = bSide === 'home' ? 'away' : 'home';
      const b = batterOf(e.batterId, bSide, null, '');
      const p = pitcherOf(e.pitcherId, fSide);
      const isHit = BOX_HIT_SET.has(e.result);
      // 打者ライン: 打数（四死球/犠飛を除く）・安打・本・打点・四死球・三振
      // 犠飛はエンジンのe.sacFly（ctx.sacFly）が唯一の真実（realism_r1 §F-2・再導出の重複を解消）
      const sacFly = e.sacFly === true;
      if (!(e.outcome === 'BB' || e.outcome === 'HBP' || sacFly)) b.ab++;
      if (isHit) { b.h++; box.hits[bSide]++; }
      if (e.result === 'HR') b.hr++;
      if (e.outcome === 'BB' || e.outcome === 'HBP') b.bb++;
      if (e.outcome === 'K') b.k++;
      // 打点（簡易）: 失策と併殺ゴロ間の得点は打点なし（公式準拠・暴投分は近似で含む）
      const gbDp = e.result === 'out' && e.battedType === 'GB' && e.outsAfter - e.outsBefore >= 2;
      if (e.result !== 'E' && !gbDp) b.rbi += e.runsOnPlay;
      // 投手ライン: アウト・被安/被本・四死球・奪三振（失点は syncScore が現投手へ配る）
      p.outs += e.outsAfter - e.outsBefore;
      if (isHit) p.h++;
      if (e.result === 'HR') p.hr++;
      if (e.outcome === 'BB' || e.outcome === 'HBP') p.bb++;
      if (e.outcome === 'K') p.k++;
      if (e.result === 'E') box.errs[fSide]++;
      curOuts = e.outsAfter;
      syncScore(bSide, e.batScore, e.inning, e.half);
    } else if (e.type === 'bunt') {
      const bSide = sideOf(e.batTeam);
      const fSide = bSide === 'home' ? 'away' : 'home';
      const b = batterOf(e.batterId, bSide, null, '');
      const p = curPit[fSide];
      if (e.outcome === 'hit') { b.ab++; b.h++; box.hits[bSide]++; if (p) p.h++; }
      else if (e.outcome === 'fail') b.ab++;
      if (p) p.outs += Math.max(0, e.outsAfter - curOuts);
      curOuts = e.outsAfter;
      syncScore(bSide, e.batScore, e.inning, e.half);
    } else if (e.type === 'steal') {
      // 盗塁死は現投手のアウトに数える（在板中のアウト＝投球回の整合）
      if (e.outsAfter != null) {
        const fld = sideOf(e.batTeam) === 'home' ? 'away' : 'home';
        if (curPit[fld]) curPit[fld].outs += Math.max(0, e.outsAfter - curOuts);
        curOuts = e.outsAfter;
      }
    } else if (e.type === 'sub') {
      const side = sideOf(e.team);
      if (e.kind === 'RP') {
        curPit[side] = pitcherOf(e.inPid, side);
      }
      // 打順スロットの追跡（PH/PR/DEF＋DH無しリーグの投手交代も打順に入る）
      const idx = slots[side].indexOf(e.outPid);
      if (idx >= 0) {
        slots[side][idx] = e.inPid;
        const pos = e.kind === 'PH' ? '打' : e.kind === 'PR' ? '走' : e.kind === 'RP' ? 'P' : (e.pos || '守');
        batterOf(e.inPid, side, idx + 1, pos);
      }
    } else if (e.type === 'end') {
      box.innings = e.innings;
      syncScore('home', e.homeScore, e.innings, 'bottom');
      syncScore('away', e.awayScore, e.innings, 'top');
    }
  }
  box.line.sort((a, b) => a.i - b.i);
  return box;
}


// ===== src/game/aging.mjs =====
// ============================================================================
// フェーズC2a: 加齢・成長カーブ（§10.1-10.3 / §12.4）
//
//   applyAging(players, cfg, { seed, yearIndex })
//     … オフシーズン遷移で全選手の trueAbility を1年ぶん動かし、age++ する純関数。
//
// 設計原則（phaseC_spec・厳守）:
//   - エンジンを壊さない: 加齢は「オフシーズンに真値を変える」もの。シーズン内シムは不変。
//     applyAging は 2年目以降の開幕前にだけ呼ばれ、1年目のレギュラーシーズン（＝既存50較正）に
//     一切触れない。
//   - 決定論維持: 乱数は makeRng(hashSeed(seed, ...)) のみ。Date.now/Math.random 禁止。
//     各選手の乱数は id 基準で派生＝適用順に依らず同一結果（順序非依存）。
//   - 三層構造: ここが動かすのは layer1（trueAbility・隠し値）。観測/スカウト表現は UI 側の責務。
//
// モデル（能力ごとに「成長→維持→衰え」の3相・cfg.tuning.aging）:
//   growEnd = peakAge + peakShift       … ここまで毎年 +grow（若手は成長係数 gm で幅を持つ）
//   onset   = peakAge + declineOffset   … ここから毎年 −decline×declineRate×(1+accel×経過年)
//   peakShift/declineOffset を能力タイプで振ることで §10.1 の
//     早落ち（走力/守備初動）・遅くまで残る（パワー）・むしろ伸びる（選球眼）・
//     加齢に強い（制球/技巧/ポジIQ/走塁IQ）を「専用ロジックほぼ無し」で構造から出す。
//   declineRate は個体差（§10.2・generate で球速/走力と相関して既に引かれている）＝
//     速球派だけ早く落ち、技巧派・晩成が"稀に"残る（生存バイアスで鉄人が自動レア化・§10.6）。
// ============================================================================



/**
 * 全選手にオフシーズンの加齢を適用する（in-place・決定論・順序非依存）。
 * @param {Array} players generateLeague().players（trueAbility/age を持つ選手配列）
 * @param {Object} cfg createConfig()（cfg.tuning.aging を参照）
 * @param {{seed:number, yearIndex:number}} o seed=オフシーズン用階層シード / yearIndex=遷移元の年
 * @returns {Array} players（同一参照。呼び出し側の league.players を直接更新する）
 */
function applyAging(players, cfg, { seed }) {
  const aging = cfg.tuning.aging;
  const veloPerRating = cfg.tuning.maturity.veloPerRating;
  for (const p of players) {
    // 選手ごとの乱数は id 基準で派生 → 配列順・呼び出し順に依らず同一（決定論・順序非依存）。
    const prng = makeRng(hashSeed(seed, 'aging', p.id));
    agePlayer(p, prng, aging, veloPerRating);
  }
  return players;
}

/** 1選手を1年ぶん加齢させる（trueAbility を動かし age++）。 */
function agePlayer(p, prng, aging, veloPerRating) {
  const t = p.trueAbility;
  const peak = t.career.peakAge;
  const dr = t.career.declineRate;
  const age = p.age;
  const young = age < aging.youngAge;

  // §10.3 成長は「点でなく幅で」: 若手は選手ごとの成長係数 gm を引く（高分散・bust厚め）。
  //   gm<0 まで振れれば真値が退行（TINSTAAPP＝有望株が凡庸に終わる）。ベテランは gm=1（幅なし）。
  let gm = 1;
  if (young) {
    gm = 1 + prng.normal(0, aging.growthVarYoung);
    if (prng.chance(aging.bustProb)) gm -= aging.bustMag; // 伸び悩み（下方の裾を厚く）
    gm = clamp(gm, aging.growthMultMin, aging.growthMultMax);
  }

  // R7（決定1・draft_timeline_evidence）: 高卒新人の「期限付き未成熟負債」の返済。generateRookie が
  //   積んだ負債（career.youthDebt<0）を毎年 youthDebtRepayPerYear ずつ全軸へ均等に足し戻す＝
  //   一時的な弱さが数年で自然に解消する（aging.profiles を動かす方式と違い、初期ロスター生成には
  //   一切影響しない＝1年目較正・多年ドリフト帯を破らない）。
  const debt = t.career.youthDebt ?? 0;
  let flatBonus = 0;
  if (debt < 0) {
    const repay = Math.min(-debt, aging.youthDebtRepayPerYear ?? 0);
    flatBonus = repay;
    t.career.youthDebt = debt + repay;
  }

  const ctx = { age, peak, dr, gm, young, prng, aging, flatBonus, veloPerRating };

  // 共通素材（§2.2）
  ageRating(t.common, 'speed', 'speed', ctx);
  ageRating(t.common, 'arm', 'arm', ctx);
  ageRating(t.common, 'hands', 'hands', ctx);
  ageRating(t.common, 'reaction', 'reaction', ctx);
  ageRating(t.common, 'power', 'power', ctx);

  // 打撃（§2.3）
  ageRating(t.batting, 'ev', 'ev', ctx);
  ageRating(t.batting, 'la', 'la', ctx);
  ageRating(t.batting, 'pull', 'pull', ctx);
  ageRating(t.batting, 'contact', 'contact', ctx);
  ageRating(t.batting, 'eye', 'eye', ctx);
  ageRating(t.batting, 'vsFastball', 'vsFastball', ctx);
  ageRating(t.batting, 'vsBreaking', 'vsBreaking', ctx);

  // 投手（§2.4）: 球速は別枠モデル、それ以外はレーティング機構、球種は技巧扱い。
  ageVelocity(t.pitching, ctx);
  ageRating(t.pitching, 'control', 'control', ctx);
  ageRating(t.pitching, 'stamina', 'stamina', ctx);
  ageRating(t.pitching, 'gbRate', 'gbRate', ctx);
  ageRating(t.pitching, 'hold', 'hold', ctx);
  for (const pitch of t.pitching.pitches) agePitch(pitch, ctx);

  // 野手守備（§2.5）: ポジション習熟は経験で伸び緩やかに落ちる（山本泰寛型）。
  ageRating(t.fielding, 'positioningIQ', 'positioningIQ', ctx);
  ageRating(t.fielding, 'framing', 'framing', ctx);
  ageRating(t.fielding, 'blocking', 'blocking', ctx);
  for (const pos of Object.keys(t.fielding.positionProf)) {
    ageRating(t.fielding.positionProf, pos, 'positionProf', ctx);
  }

  // 走塁（§2.6）
  ageRating(t.baserunning, 'steal', 'steal', ctx);
  ageRating(t.baserunning, 'baserunIQ', 'baserunIQ', ctx);

  p.age = age + 1;
}

/**
 * 「成長→維持→衰え」の年次期待デルタ（能力プロファイル × 個体 peakAge/declineRate）。
 * 若手の成長は成長係数 gm で幅を持たせる（§10.3）。
 */
function curveDelta(prof, ctx) {
  let d = 0;
  const growEnd = ctx.peak + prof.peakShift;
  const onset = ctx.peak + prof.declineOffset;
  if (ctx.age < growEnd) d += prof.grow * (ctx.young ? ctx.gm : 1);
  if (ctx.age >= onset) {
    const past = ctx.age - onset; // 経過年（大きいほど急落＝§10.1「1オフで急落もありうる」）
    d -= prof.decline * ctx.dr * (1 + ctx.aging.declineAccel * past);
  }
  return d;
}

/** 年次ノイズ（若手ほど大きい＝高分散）。 */
function drift(ctx) {
  const sd = ctx.young ? ctx.aging.driftSdYoung : ctx.aging.driftSdOld;
  return ctx.prng.normal(0, sd);
}

/** 1レーティング(20-80)を加齢で更新（in-place）。profKey 未登録なら default プロファイル。 */
function ageRating(obj, key, profKey, ctx) {
  const prof = ctx.aging.profiles[profKey] ?? ctx.aging.profiles.default;
  // R7（決定1）: flatBonus=高卒未成熟負債の当年ぶん返済額（負債が無い選手は0＝既存挙動と bit 同一）。
  obj[key] = clampRating(obj[key] + curveDelta(prof, ctx) + drift(ctx) + ctx.flatBonus);
}

/** 球速（km/h 実数）を加齢で更新（in-place）。高球速×高declineRate ほど早く落ちる（§10.2）。 */
function ageVelocity(pitching, ctx) {
  const v = ctx.aging.velo;
  let d = 0;
  const growEnd = ctx.peak + v.peakShift;
  const onset = ctx.peak + v.declineOffset;
  if (ctx.age < growEnd) d += v.grow * (ctx.young ? ctx.gm : 1);
  if (ctx.age >= onset) d -= v.decline * ctx.dr * (1 + ctx.aging.declineAccel * (ctx.age - onset));
  d += ctx.prng.normal(0, ctx.young ? v.driftSdYoung : v.driftSdOld);
  d += ctx.flatBonus * ctx.veloPerRating; // R7: rating単位の返済額を球速換算
  pitching.velocityKmh = clamp(pitching.velocityKmh + d, v.min, v.max);
}

/** 1球種の質（球速でなく技巧側＝出し入れ）を加齢で更新（in-place・pitchStuff プロファイル）。 */
function agePitch(pitch, ctx) {
  const prof = ctx.aging.profiles.pitchStuff;
  for (const k of ['current', 'whiff', 'hrSuppress', 'contactQuality']) {
    pitch[k] = clampRating(pitch[k] + curveDelta(prof, ctx) + drift(ctx) + ctx.flatBonus);
  }
}


// ===== src/game/market.mjs =====
// ============================================================================
// フェーズC3a: 編成市場（球団AI評価の球団差・ドラフト・育成/支配下二層）
//   §13/§15（球団AIをわざと現実的に間違わせる＝市場の非効率を仕込む）／§12.1（這い上がりの箱）。
//
//   teamEvalProfile(masterSeed, teamId, cfg)  … 球団ごとに固定の「評価の癖」を分布から引く
//   evaluateProspect(profile, prospect, cfg, ctx) … 観測ツール(真値+スカウトノイズ)×球団重みでの評価
//   trueValue(prospect, cfg)                  … 真価値の代理（テスト/宝の泉の可視化用・AIは見ない）
//   runMarket(league, cfg, {...})             … 引退枠を「育成昇格→ドラフト→育成獲得」で埋める
//
// 設計原則（phaseC_spec・厳守）:
//   - エンジンを壊さない: 本モジュールはオフシーズン遷移（2年目以降）でのみ呼ばれる。1年目
//     レギュラーシーズン（既存50較正）には一切効かない（generateLeague/シムは不変）。
//   - 三層構造: 球団AIは trueAbility を直接見ない。評価は「観測ツール(真値+球団固有ノイズ)」を
//     球団固有の重み（守備/位置の過小評価度・出塁重視度・年齢バイアス）で合成する＝わざと不完全。
//     歪んだ球団評価と真価値(trueValue)の差分こそ「宝の泉」。守備を正しく重める球団(wDef>1)を
//     混ぜると、他球団の捨てた守備型の宝を系統的に拾う（守備版マネーボール）。
//   - 決定論: 乱数は階層シード rng のみ（Date.now/Math.random 非使用）。ウェーバー順は前年順位
//     （teamHistory・save に含まれ replay 再構築される）、くじは lottery シードで解決＝再現可能。
//   - ロスター構成の恒常: 引退枠(teamId,role,primaryPos)を同型で1:1に埋める（人口/構成不変）。
// ============================================================================










/** id 昇順の安定比較（決定論・順序非依存の走査に使う）。 */
function byId(a, b) {
  return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
}

/** 球種の質（current/whiff の平均）。球種なしは 50。 */
function pitchStuff(t) {
  const ps = t.pitching.pitches;
  if (!ps.length) return 50;
  let s = 0;
  for (const pi of ps) s += (pi.current + pi.whiff) / 2;
  return s / ps.length;
}

/**
 * 総合力の粗い代理（~20-80・真値ベース）。育成の昇格判定と farm 剪定に使う内部指標。
 * roster.mjs の overallAbility と同型（役割別に主要真値を平均）。真値なので AI の「評価」ではない。
 */
function overallRating(p) {
  const t = p.trueAbility;
  if (p.role === 'pitcher') {
    const veloR = clamp(50 + (t.pitching.velocityKmh - 145) * 2, 20, 80);
    return (veloR + t.pitching.control + t.pitching.stamina + pitchStuff(t)) / 4;
  }
  const b = t.batting;
  let bestProf = 20;
  for (const k of Object.keys(t.fielding.positionProf)) bestProf = Math.max(bestProf, t.fielding.positionProf[k]);
  return (b.ev + b.contact + b.la + b.eye + t.common.speed + t.fielding.positioningIQ + bestProf) / 7;
}

/**
 * 球団ごとの評価プロファイル（§13/§15）。masterSeed×teamId から固定で引く（キャリア中不変＝球団の癖）。
 *   wBat  打撃/投球コアの重み（球団差小）
 *   wEye  出塁(選球眼)重視度（球団差大）
 *   wDef  守備/位置価値の重み（多くが<1＝系統的な過小評価。稀に>1＝守備を正しく重める球団）
 *   ageBias 年齢バイアス（若手志向のペナルティ/歳）
 *   noiseSd スカウト観測ノイズSD（球団ごとの評価の荒さ）
 * @returns {{teamId:string, wBat:number, wEye:number, wDef:number, ageBias:number, noiseSd:number}}
 */
function teamEvalProfile(masterSeed, teamId, cfg) {
  const pc = cfg.tuning.market.profile;
  const r = makeRng(hashSeed(masterSeed, 'evalprofile', teamId));
  return {
    teamId,
    wBat: clamp(r.normal(pc.wBatMean, pc.wBatSd), pc.wBatMin, pc.wBatMax),
    wEye: clamp(r.normal(pc.wEyeMean, pc.wEyeSd), pc.wEyeMin, pc.wEyeMax),
    wDef: clamp(r.normal(pc.wDefMean, pc.wDefSd), pc.wDefMin, pc.wDefMax),
    ageBias: clamp(r.normal(pc.ageBiasMean, pc.ageBiasSd), pc.ageBiasMin, pc.ageBiasMax),
    noiseSd: Math.max(pc.noiseSdMin, r.normal(pc.noiseSdMean, pc.noiseSdSd)),
    // R7（決定5）: 救援過大評価の重み（多くが>1＝過大評価。稀に≈1の球団が救援に金をかけず勝つ）。
    wReliever: clamp(r.normal(pc.wRelieverMean, pc.wRelieverSd), pc.wRelieverMin, pc.wRelieverMax),
  };
}

/**
 * 観測ツール = 真値 + 球団固有スカウトノイズ（ctx 無し or noiseSd=0 なら真値そのまま＝テスト用）。
 * export: H2 draftScoutView が「トレード/評価と同じ観測座標」でスカウト表示用のツールも引くために使う
 * （真値そのものは渡らない・呼び出し側は trueVal をここでしか使わない＝表示にも trueAbility を直接出さない）。
 */
function obsTool(trueVal, profile, ctx, tool, pid) {
  if (!ctx || !profile.noiseSd) return trueVal;
  const r = makeRng(hashSeed(ctx.masterSeed, 'scout', ctx.yearIndex, ctx.teamId, pid, tool));
  return trueVal + r.normal(0, profile.noiseSd);
}

/**
 * 球団 profile による prospect の評価スカラー（§13）。観測ツール（真値+球団固有ノイズ）を
 * 球団固有の重みで合成する（trueAbility を直接は見ない＝三層構造）。守備/位置価値は wDef で重み、
 * 多くの球団は wDef<1 ＝守備/位置を過小評価する（宝を捨てる）。
 * @param {Object} profile teamEvalProfile() の返値（テストは noiseSd:0 の即席 profile を渡せる）
 * @param {Object} p prospect（Player）
 * @param {Object} cfg
 * @param {{masterSeed:number, yearIndex:number, teamId:string}|null} ctx ノイズ座標（null=無ノイズ）
 */
function evaluateProspect(profile, p, cfg, ctx = null) {
  const m = cfg.tuning.market.eval;
  const t = p.trueAbility;
  const id = p.id;
  const ageK = profile.ageBias * Math.max(0, p.age - 18);
  if (p.role === 'pitcher') {
    const veloR = clamp(50 + (t.pitching.velocityKmh - 145) * 2, 20, 80);
    const velo = obsTool(veloR, profile, ctx, 'velo', id);
    const ctrl = obsTool(t.pitching.control, profile, ctx, 'control', id);
    const stam = obsTool(t.pitching.stamina, profile, ctx, 'stamina', id);
    const stuff = obsTool(pitchStuff(t), profile, ctx, 'stuff', id);
    // R7（決定5）: 救援シェイプ（低スタミナ）の stuff/velo を球団が過大評価する癖（wReliever）。
    //   実際の勝利貢献はスタミナに比例して薄い（R²=0.051）のに、市場は「電光石火の球威」に
    //   引かれて過大な値を付ける＝救援を軽視する球団(wReliever≈1)が安く勝てる構造の土台。
    const shape = clamp(
      (m.relieverShapeFull - stam) / Math.max(1, m.relieverShapeFull - m.relieverShapeStamina),
      0,
      1,
    );
    const reliefBonus = shape * Math.max(0, (velo + stuff) / 2 - 50) * m.relieverOvervalueW * ((profile.wReliever ?? 1) - 1);
    return profile.wBat * (velo + ctrl + stam + stuff) - ageK + reliefBonus;
  }
  const b = t.batting;
  const c = t.common;
  const f = t.fielding;
  const ev = obsTool(b.ev, profile, ctx, 'ev', id);
  const contact = obsTool(b.contact, profile, ctx, 'contact', id);
  const eye = obsTool(b.eye, profile, ctx, 'eye', id);
  const la = obsTool(b.la, profile, ctx, 'la', id);
  const power = obsTool(c.power, profile, ctx, 'power', id);
  const prof = obsTool(f.positionProf[p.primaryPos] ?? 20, profile, ctx, 'prof', id);
  const iq = obsTool(f.positioningIQ, profile, ctx, 'iq', id);
  const reaction = obsTool(c.reaction, profile, ctx, 'reaction', id);
  const arm = obsTool(c.arm, profile, ctx, 'arm', id);
  const batComp = ev + contact + power + m.laW * la;
  const defComp = prof + iq + reaction + m.armW * arm;
  const posVal = (POSITION_ADJUST_PER_162G[p.primaryPos] ?? 0) * m.posScale;
  return profile.wBat * batComp + profile.wEye * m.eyeScale * eye + profile.wDef * (defComp + posVal) - ageK;
}

/**
 * 真価値の代理（テスト/可視化用・AIは見ない）。守備・位置価値を「正しく」重めた全知評価
 * （wBat=wEye=wDef=1・ノイズ0・年齢バイアス0）。歪んだ球団評価との差分が「宝の泉」（§13）。
 */
function trueValue(p, cfg) {
  return evaluateProspect({ wBat: 1, wEye: 1, wDef: 1, ageBias: 0, noiseSd: 0 }, p, cfg, null);
}

/**
 * R7（決定3）: 球団の「優勝の窓」を teamHistory だけから純関数で導出する（新規の永続状態は
 * 持たない＝save/loadに一切手を入れない）。SABR BRJ 2018（Jordan）の実測に整合させる:
 *   - contending: 直近年の勝率が contendWinPct 以上
 *   - rebuilding: 直近 lookbackYears 年が**すべて**非contending（＝2年連続で初めて閉じる時間的
 *     ヒステリシス。1年の不振だけでは閉じない）
 *   - neutral: 上記どちらでもない（履歴不足・混在シグナル）
 * @param {string} teamId
 * @param {Array<{year:number, standings:Array}>} teamHistory 完了年の順位（新しい順である必要はない）
 * @returns {'contending'|'neutral'|'rebuilding'}
 */
function teamWindowState(teamId, teamHistory, cfg) {
  const wc = cfg.tuning.market.window;
  const winPct = (s) => { const d = (s.w ?? 0) + (s.l ?? 0); return d ? s.w / d : 0.5; };
  const rows = (teamHistory ?? [])
    .slice()
    .sort((a, b) => b.year - a.year)
    .map((h) => h.standings?.find((s) => s.teamId === teamId))
    .filter(Boolean)
    .slice(0, wc.lookbackYears);
  if (!rows.length) return 'neutral';
  if (winPct(rows[0]) >= wc.contendWinPct) return 'contending';
  if (rows.length >= wc.lookbackYears && rows.every((s) => winPct(s) < wc.contendWinPct)) return 'rebuilding';
  return 'neutral';
}

/** 前年順位からのウェーバー逆順（勝率の低い順＝弱いチームが先）。standings 無しは teams 順。 */
function waiverOrder(standings, league) {
  if (!standings || !standings.length) return league.teams.map((t) => t.id);
  const winPct = (s) => {
    const dec = (s.w ?? 0) + (s.l ?? 0);
    return dec ? s.w / dec : 0.5;
  };
  return standings
    .slice()
    .sort((a, b) => winPct(a) - winPct(b) || (a.teamId < b.teamId ? -1 : 1))
    .map((s) => s.teamId);
}

/** 世代（高卒18/大卒22/社会人25）から新人の年齢を1つ引く（§15 世代生成）。 */
function pickCohortAge(rng, cohort) {
  const u = rng.next();
  if (u < cohort.hsShare) return cohort.hsAge;
  if (u < cohort.hsShare + cohort.colShare) return cohort.colAge;
